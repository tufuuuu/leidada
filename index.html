.sources{display:none}</style></head><body><div id="app"></div><script type="application/json" id="bank-data">[{"number":1,"subjects":[{"name":"科目一二","questions":[{"number":1,"stem":"2026 年是“十五五”开局之年,国家统筹推进水网､新型电网､算力网､新一代通信网､城市地下管网､物流网等“六张网”建设｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":2,"stem":"平陆运河于 9 月 16 日建成通航,这是新中国成立以来我国第一条国家层面统筹建设的通江达海运河工程｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。平陆运河于 9 月 16 日建成通航,这是新中国成立以来我国第一条国家层面统筹建设的通江达海运河工程。这条国内通航等级最高的运河,按内河Ⅰ级标准建设,可通航 5000 吨级船舶。","type":"判断题"},{"number":3,"stem":"第二艘国产大型邮轮“爱达•魔都号”于 3 月 20 日在上海出坞,邮轮总吨位达到 14.19 万吨｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,应为“爱达•花城号”。第二艘国产大型邮轮“爱达•花城号”计划于 3 月20 日在上海出坞。“爱达•花城号”邮轮总吨位达到 14.19 万吨。与首艘国产大型邮轮“爱达•魔都号”相比,“爱达•花城号”邮轮在设计和建造上进行了诸多改进。","type":"判断题"},{"number":4,"stem":"由 C919 执飞的国航 CA723 航班于 8 月 12 日 15 时许从北京首都国际机场起飞,前往蒙古国首都乌兰巴托,这是 C919 首次执飞国际商业航班｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":5,"stem":"根据《中华人民共和国宪法》的规定,全国人民代表大会是最高国家权力机关;全国人民代表大会和县级以上地方各级人民代表大会均设立常务委员会,作为常设机关｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"全国人民代表大会是最高国家权力机关,全国人民代表大会和县级以上地方各级人民代表大会设立常务委员会作为常设机关。","type":"判断题"},{"number":6,"stem":"《旅游法》规定,旅游者数量可能达到最大承载量时,景区应当提前公告,并同时向当地人民政府报告｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"旅游者数量可能达到最大承载量时,景区应当提前公告并同时向当地人民政府报告。","type":"判断题"},{"number":7,"stem":"消费争议需要进行鉴定､检测,消费者与经营者无法协商确定鉴定机构的,应当由经营者寻找第三方机构｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"双方无法协商一致时,受理投诉的市场监督管理部门或者其他有关行政部门可以指定鉴定、检测机构,并非应当由经营者自行寻找,说法错误。","type":"判断题"},{"number":8,"stem":"根据《旅游安全管理办法》的规定,发布二级风险提示的,应当停止组团或者带团前往风险区域;已在风险区域的,应当调整或者中止行程｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"根据《旅游安全管理办法》规定,风险提示发布后,旅行社应当根据风险级别采取相应措施:二级风险的,停止组团或者带团前往风险区域;已在风险区域的,调整或者中止行程。故本题说法正确。","type":"判断题"},{"number":9,"stem":"《旅行社条例》规定,旅行社取得经营许可满 2 年,且未因侵害旅游者合法权益受到行政机关罚款处罚的,可以申请经营出境旅游业务｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"《旅行社条例》第 8 条规定,旅行社取得经营许可满 2 年,且未因侵害旅游者合法权益受到行政机关罚款以上处罚的,可以申请经营出境旅游业务。故本题说法错误。","type":"判断题"},{"number":10,"stem":"《旅游法》规定,旅行社不得出租､出借旅行社业务经营许可证,或者以其他形式转让旅行社业务经营许可｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"旅行社业务经营许可证可以依法转让,但不能非法转让。","type":"判断题"},{"number":11,"stem":"根据《旅行社责任保险管理办法》,旅游活动中发生意外事故,旅行社依法应当承担赔偿责任的,由旅行社责任保险负责赔偿｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"依据《旅行社责任保险管理办法》,旅行社从事旅游业务经营活动,无论入境旅游、出境旅游还是国内旅游,都必须投保旅行社责任保险。旅游活动中发生意外事故,属于旅行社依法应当承担赔偿责任情形的,由旅行社责任保险在责任限额内予以赔偿。故本题说法正确。","type":"判断题"},{"number":12,"stem":"根据《中华人民共和国民用航空法》的规定,航空运输的诉讼时效期间为 2 年,自民用航空器到达目的地点､应当到达目的地点或者运输终止之日起计算｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"第 143 条,航空运输的诉讼时效期间为二年,自民用航空器到达目的地点、应当到达目的地点或者运输终止之日起计算。该表述与法条原文一致,故正确。","type":"判断题"},{"number":13,"stem":"国歌不得用于或者变相用于商标､广告,不得作为公共场所的背景音乐等｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"《国歌法》规定,国歌不得用于或者变相用于商标、商业广告,不得在私人丧事活动等不适宜的场合使用,不得作为公共场所的背景音乐等。故本题说法正确。","type":"判断题"},{"number":14,"stem":"根据《大型群众性活动安全管理条例》,大型群众性活动包括每场次预计参加人数达到 1000 人以上的体育比赛活动｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"《大型群众性活动安全管理条例》规定,大型群众性活动,是指法人或者其他组织面向社会公众举办的每场次预计参加人数达到 1000 人以上的活动,包括体育比赛活动,演唱会、音乐会等文艺演出,展览、展销,游园、灯会、庙会、花会、焰火晚会,人才招聘会、现场开奖的彩票销售等活动。故本题说法正确。","type":"判断题"},{"number":15,"stem":"根据《风景名胜区条例》,风景名胜区是指具有观赏､文化或者科学价值,自然景观､人文景观比较集中,环境优美,可供人们游览或者进行科学､文化活动的区域｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"该表述与条例第二条对风景名胜区的法定定义完全一致,故判断为对。","type":"判断题"},{"number":16,"stem":"根据《自然保护区条例》的规定,县级以上地方人民政府自然资源主管部门负责本行政区域内自然保护区的监督管理工作｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"《自然保护区条例》第六条:县级以上地方人民政府林业草原主管部门负责本行政区域内自然保护区的监督管理工作。县级以上地方人民政府其他有关部门在各自职责范围内负责自然保护区的有关监督管理工作。本行政区域内自然保护区的监督管理由县级以上地方人民政府林业草原主管部门负责,不是自然资源主管部门,故判断为错。","type":"判断题"},{"number":17,"stem":"依据习近平新时代中国特色社会主义思想相关理论,建设一支听党指挥､能打胜仗､作风优良的人民军队,是实现“两个一百年”奋斗目标､实现中华民族伟大复兴的战略支撑｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"坚持党对人民军队的绝对领导。建设一支听党指挥、能打胜仗、作风优良的人民军队,是实现“两个一百年”奋斗目标、实现中华民族伟大复兴的战略支撑。题干表述与文档原文相符,故本题正确。","type":"判断题"},{"number":18,"stem":"新时代中国特色社会主义思想,是对马克思列宁主义､毛泽东思想､邓小平理论､“三个代表”重要思想､科学发展观的继承和发展,是马克思主义中国化最新成果,是全党全国人民为实现中华民族伟大复兴而奋斗的根本保证｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"错在“实现中华民族伟大复兴而奋斗的根本保证”,正确的表述是“行动指南”。新时代中国特色社会主义思想,是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的继承和发展,是马克思主义中国化最新成果,是党和人民实践经验和集体智慧的结晶,是中国特色社会主义理论体系的重要组成部分,是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南。","type":"判断题"},{"number":19,"stem":"学校应当每日升挂国旗,有条件的幼儿园参照学校的规定升挂国旗｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题表述不准确。学校除寒假、暑假和休息日外,应当每日升挂国旗。有条件的幼儿园参照学校的规定升挂国旗。","type":"判断题"},{"number":20,"stem":"《关于推动在线旅游市场高质量发展的意见》提出,要加快建设网络强国､数字中国｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。意见中明确提到“贯彻落实党中央关于加快建设网络强国、数字中国决策部署”。","type":"判断题"},{"number":21,"stem":"世界上首次环球旅游是 1855 年从莱斯特到巴黎的旅游｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误。1872 首次环球旅行。","type":"判断题"},{"number":22,"stem":"导游服务质量是衡量旅游服务质量高低的敏感标志｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。导游服务质量是衡量旅游服务质量高低的敏感标志。","type":"判断题"},{"number":23,"stem":"文化和旅游部组织特级导游等级考核,原则上采取论文答辩形式,每 3 年开展一次｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误。文化和旅游部组织特级导游等级考核,原则上采取论文答辩形式,每 4年开展一次。","type":"判断题"},{"number":24,"stem":"旅游者人数超过 10 人时应持导游旗,少于 10 人时可以不持导游旗｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。旅游者人数超过 10 人时应持导游旗,少于 10 人时可根据现场情况决定是否持导游旗。","type":"判断题"},{"number":25,"stem":"“导游专座”应设置在旅游客运车辆前乘客门侧第一排乘客座椅靠通道侧位置｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。\"导游专座\"应设置在旅游客运车辆前乘客门侧第一排乘客座椅靠通道侧位置;为了保证安全,地陪应当坐在导游专座上。","type":"判断题"},{"number":26,"stem":"如发生旅游者在境外滞留不归的事件,领队应当及时向地接社和中国驻所在国使领馆报告,寻求帮助｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误。如发生旅游者在境外滞留不归的事件,领队应当及时向组团社和中国驻所在国使领馆报告,寻求帮助。","type":"判断题"},{"number":27,"stem":"导游老王讲解时音量应以每位旅游者都能听清为宜,如有需要,可借助扩音器辅助讲解｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。音量应以每位旅游者都能听清为宜,如有需要,可借助扩音器辅助讲解。","type":"判断题"},{"number":28,"stem":"苏州是著名的江南水乡,老城内至今保持着“水陆并行､河街相邻”的双棋盘格局,被意大利旅行家马可·波罗称为“东方的威尼斯”｡这种比较属于同类相似类比｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。苏州是著名的江南水乡,被称为\"东方的威尼斯\",这种将性质相似的事物进行比较的方式属于同类相似类比。","type":"判断题"},{"number":29,"stem":"除另有规定外,我国所有船舶船上每人至少应配备 1 件救生衣,并应至少为每位值班人员配备一件救生衣｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。除另有规定外,我国所有船舶,船上每人至少应配备 1 件救生衣;应至少为每位值班人员配备一件救生衣。","type":"判断题"},{"number":30,"stem":"第一印象效应即首因效应,导游老王可利用首因效应,在初次接触旅游者时留下好印象,为后续工作打下基础｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。第一印象效应即首因效应,导游可利用首因效应,在初次接触旅游者时留下好印象,为后续工作打下基础。","type":"判断题"},{"number":31,"stem":"全陪导游老王带领游客乘坐高铁,在检票口排队安检时,应尽量靠后,安排团队负责人在队伍最前面照看成员｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误。全陪导游带领游客乘坐高铁,在检票口排队安检时,导游应尽量靠前,安排团队负责人在队伍末尾照看成员。","type":"判断题"},{"number":32,"stem":"当旅游者卢女士提出需求后,导游老王可暂时不予正面答复,搁置一段时间,待其需求欲消退后达到拒绝的目的｡这是正面回绝法的应用｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误。拖延时间法:当旅游者提出需求后,导游可暂时不予正面答复,搁置一段时间,等旅游者的需求欲消退后,达到拒绝的目的。","type":"判断题"},{"number":33,"stem":"面对游客卢女士临到饭点才提出的特殊餐饮要求,导游老王应该婉转地拒绝｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误。面对旅游者临时提出的特殊餐饮需求,导游应立刻联系餐馆,尽力安排。若原餐馆无法满足要求,需另寻其他餐馆或协助旅游者自行解决。","type":"判断题"},{"number":34,"stem":"全团统一要求更改景点时,导游老王需第一时间将情况上报接待社,由接待社负责与组团社进行沟通协调,征得组团社的同意｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。全团统一提出时:请示接待社计调部门,请其与组团社联系,组团社同意后方可更换或取消。","type":"判断题"},{"number":35,"stem":"遭遇火灾时,若楼道出现浓烟,应尽快找毛巾沾湿并捂住口鼻,直立快速奔跑出浓烟,离开现场｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误。若楼道出现浓烟,应尽快找毛巾沾湿并捂住口鼻,身体尽量贴近地面行走。","type":"判断题"},{"number":36,"stem":"当风雨渐渐减小并变成间歇性降雨,直到风力减弱､云层升高､雨势渐停,才是台风真正离开的标志｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":37,"stem":"海啸到达前,船只听到预警应迅速驶回港口,此时港口相较于深海更为安全｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误。海啸在海港中会引发巨大落差和湍流,十分危险。船主应在海啸到达前,将船只驶向开阔海面,此时深海区相较于海岸更为安全。","type":"判断题"},{"number":38,"stem":"购买联程或来回程机票的旅客卢女士订妥座位后,如在联程或回程地停留超过 72 小时,需在航班离站前一天中午 12 点前办理座位再证实手续｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误。购买联程或来回程机票的旅客订妥座位后,在联程或回程地停留超 72小时,需在航班离站前两天中午 12 点前办理座位再证实手续。","type":"判断题"},{"number":39,"stem":"中国民航局对旅客携带充电宝作出规定:头等舱旅客可以携带 2 个充电宝,而经济舱旅客只能携带 1 个充电宝,且额定功率不能超过 160Wh｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误。每名旅客携带总数不得超过 2 个。","type":"判断题"},{"number":40,"stem":"所有火车票无论网上还是现场都仅允许改签一次｡","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。二、单项选择题（共 90 题，每题 0.5 分，共 45 分）","type":"判断题"},{"number":41,"stem":"2026 年 7 月 25 日,在韩国釜山举行的第 48 届世界遗产大会上,由中国申报的“景德镇手工瓷业遗存”项目经世界遗产委员会审议,成功列入《世界遗产名录》,成为中国第()项世界遗产｡","options":[{"key":"A","text":"59 项"},{"key":"B","text":"60 项"},{"key":"C","text":"61 项"},{"key":"D","text":"62 项"}],"answer":"C","keys":["C"],"explanation":"2026 年 7 月 25 日,在韩国釜山举行的第 48 届世界遗产大会上,由中国申报的“景德镇手工瓷业遗存”项目经世界遗产委员会审议,成功列入《世界遗产名录》,成为中国第 61 项世界遗产。","type":"单选题"},{"number":42,"stem":"我国宪法规定,公民有集会､游行的自由｡这一规定体现了公民的（ ）｡","options":[{"key":"A","text":"人身自由权"},{"key":"B","text":"政治权利"},{"key":"C","text":"政治自由"},{"key":"D","text":"监督权"}],"answer":"C","keys":["C"],"explanation":"政治自由的内容包括:公民有言论、出版、结社、集会、游行、示威的自由。","type":"单选题"},{"number":43,"stem":"根据《中华人民共和国宪法》的规定,农村集体经济组织实行的经营体制是（ ）｡","options":[{"key":"A","text":"家庭承包经营为基础､统分结合的双层经营体制"},{"key":"B","text":"集体统一经营体制"},{"key":"C","text":"个人承包经营体制"},{"key":"D","text":"股份制经营体制"}],"answer":"A","keys":["A"],"explanation":"农村集体经济组织实行家庭承包经营为基础、统分结合的双层经营体制(第 8 条)。国家保护城乡集体经济组织的合法权益,鼓励、指导和帮助集体经济发展。B 项错误,宪法第 8 条规定的经营体制是“家庭承包经营为基础、统分结合的双层经营体制”,而非集体统一经营;C 项错误,“个人承包经营”不是宪法规定的表述;D 项错误,“股份制经营”不是宪法对农村集体经济组织经营体制的规定。","type":"单选题"},{"number":44,"stem":"依据《旅游法》,旅游者卢女士欲将包价旅游合同中自身的权利义务转让给雷先生,旅行社没有正当理由不得拒绝,由此增加的费用由卢女士和雷先生承担｡该转让行为应当发生在旅游行程（ ）｡","options":[{"key":"A","text":"开始前"},{"key":"B","text":"过程中"},{"key":"C","text":"开始前或过程中"},{"key":"D","text":"开始前和过程中"}],"answer":"A","keys":["A"],"explanation":"《旅游法》第 64 条规定,旅游行程开始前,旅游者可以将包价旅游合同中自身的权利义务转让给第三人,旅行社没有正当理由的不得拒绝,因此增加的费用由旅游者和第三人承担。","type":"单选题"},{"number":45,"stem":"《旅游法》规定,将不同景区的门票或者同一景区内不同游览场所的门票合并出售的,合并后的价格不得高于各单项门票的价格之和,且旅游者有权选择购买其中的单项票｡该规定保障了旅游者的（ ）｡","options":[{"key":"A","text":"自主选择权"},{"key":"B","text":"知悉真情权"},{"key":"C","text":"优惠权"},{"key":"D","text":"公平交易权"}],"answer":"A","keys":["A"],"explanation":"《旅游法》第 9 条,旅游者有权自主选择旅游产品和服务,有权拒绝旅游经营者的强制交易行为。","type":"单选题"},{"number":46,"stem":"《旅游法》规定,国家鼓励各类市场主体在有效保护旅游资源的前提下,依法（ ）旅游资源｡","options":[{"key":"A","text":"合法利用"},{"key":"B","text":"规划开发"},{"key":"C","text":"合理利用"},{"key":"D","text":"适度开发"}],"answer":"C","keys":["C"],"explanation":"国家鼓励各类市场主体在有效保护旅游资源的前提下,依法合理利用旅游资源。","type":"单选题"},{"number":47,"stem":"旅游行程中解除合同的,旅行社应当协助旅游者返回（ ）｡","options":[{"key":"A","text":"出发地或者旅游者指定的合理地点"},{"key":"B","text":"常住地或者旅行社指定的合理地点"},{"key":"C","text":"常住地或者旅游者指定的合理地点"},{"key":"D","text":"出发地或者旅行社指定的合理地点"}],"answer":"A","keys":["A"],"explanation":"《旅游法》第 68 条规定,旅游行程中解除合同的,旅行社应当协助旅游者返回出发地或者旅游者指定的合理地点。","type":"单选题"},{"number":48,"stem":"年仅 14 周岁且已取得导游资格证的刘某,属于（ ）｡","options":[{"key":"A","text":"无民事行为能力人"},{"key":"B","text":"限制民事行为能力人"},{"key":"C","text":"视为完全民事行为能力人"},{"key":"D","text":"完全民事行为能力人"}],"answer":"B","keys":["B"],"explanation":"8 周岁以上的未成年人、不能完全辨认自己行为的成年人为限制民事行为能力人。","type":"单选题"},{"number":49,"stem":"相对人可以催告无民事行为能力人或者限制民事行为能力人的法定代理人自收到通知之日起（ ）内予以追认｡","options":[{"key":"A","text":"15 个工作日"},{"key":"B","text":"15 日"},{"key":"C","text":"30 个工作日"},{"key":"D","text":"30 日"}],"answer":"D","keys":["D"],"explanation":"相对人可以催告法定代理人自收到通知之日起 30 日内予以追认。","type":"单选题"},{"number":50,"stem":"《民法典》规定,当事人一方因第三人的原因造成违约的,（ ）承担违约责任｡","options":[{"key":"A","text":"第三人"},{"key":"B","text":"当事人一方"},{"key":"C","text":"当事人一方和第三人按份"},{"key":"D","text":"当事人一方或第三人"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 593 条规定,当事人一方因第三人的原因造成违约的,应当依法向对方承担违约责任。此处“应当依法向对方”所指的是“当事人一方”。","type":"单选题"},{"number":51,"stem":"根据《民法典》的规定,以对话方式作出的意思表示,（ ）生效｡","options":[{"key":"A","text":"到达相对人时"},{"key":"B","text":"相对人确认后"},{"key":"C","text":"相对人知道其内容时"},{"key":"D","text":"表示完成时"}],"answer":"C","keys":["C"],"explanation":"以对话方式作出的意思表示,相对人知道其内容时生效。以非对话方式作出的意思表示,到达相对人时生效。","type":"单选题"},{"number":52,"stem":"无民事行为能力人造成他人损害,监护人将监护职责委托给他人的,（ ）｡","options":[{"key":"A","text":"监护人应当承担侵权责任;受托人有过错的,承担连带责任"},{"key":"B","text":"受托人承担相应的责任"},{"key":"C","text":"受托人应当承担侵权责任;监护人有过错的,承担相应的责任"},{"key":"D","text":"监护人应当承担侵权责任;受托人有过错的,承担相应的责任"}],"answer":"D","keys":["D"],"explanation":"《民法典》第 1189 条规定,无民事行为能力人、限制民事行为能力人造成他人损害,监护人将监护职责委托给他人的,监护人应当承担侵权责任;受托人有过错的,承担相应的责任。","type":"单选题"},{"number":53,"stem":"导游老王在执行带团任务过程中,未对游客卢女士进行充分的安全警示,致其人身遭受意外伤害｡根据《民法典》,该侵权责任应由委派老王的雷大大旅行社承担｡此种情形下,雷大大旅行社承担的责任属于（ ）｡","options":[{"key":"A","text":"自己责任"},{"key":"B","text":"替代责任"},{"key":"C","text":"补充责任"},{"key":"D","text":"连带责任"}],"answer":"B","keys":["B"],"explanation":"如果违反安全保障义务的具体行为人是公共场所管理人或者群众性活动组织者的工作人员或者雇员,其侵权责任还是要由管理人、组织者或者雇主承担。这种侵权责任形态就是替代责任。","type":"单选题"},{"number":54,"stem":"《民法典》规定,当事人因防止损失扩大而支出的合理费用,由（ ）负担｡","options":[{"key":"A","text":"采取措施的当事人"},{"key":"B","text":"双方分担"},{"key":"C","text":"违约方"},{"key":"D","text":"划分责任后视具体情况"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 591 条第 2 款规定,当事人因防止损失扩大而支出的合理费用,由违约方负担。","type":"单选题"},{"number":55,"stem":"根据《民法典》的规定,受害人和行为人对损害的发生都没有过错的,依照法律的规定由双方分担损失｡此处适用的归责原则是（ ）｡","options":[{"key":"A","text":"过错推定责任原则"},{"key":"B","text":"过错责任原则"},{"key":"C","text":"公平责任原则"},{"key":"D","text":"无过错责任"}],"answer":"C","keys":["C"],"explanation":"公平责任原则指在当事人双方对损害的发生均无过错,法律又无特别规定适用无过错责任原则的情况下,由人民法院根据公平观念,责令加害人对受害人给予适当补偿,由当事人合理分担损失的一种归责原则。","type":"单选题"},{"number":56,"stem":"《旅行社条例》规定,申请经营出境旅游业务的,受理申请的旅游主管部门应当自受理申请之日起（ ）个工作日内作出许可或者不予许可的决定｡","options":[{"key":"A","text":"7"},{"key":"B","text":"10"},{"key":"C","text":"20"},{"key":"D","text":"30"}],"answer":"C","keys":["C"],"explanation":"《旅行社条例》第 9 条规定,申请经营出境旅游业务的,应当向国务院旅游行政主管部门或者其委托的省、自治区、直辖市旅游行政管理部门提出申请,受理申请的旅游行政管理部门应当自受理申请之日起 20 个工作日内作出许可或者不予许可的决定。","type":"单选题"},{"number":57,"stem":"《旅行社条例》规定,下列关于旅行社设立的服务网点的说法,正确的是（ ）｡","options":[{"key":"A","text":"具有法人资格"},{"key":"B","text":"在其所在地的省､自治区､直辖市行政区划内设立服务网点"},{"key":"C","text":"实行统一人事､财务､招徕､咨询服务规范"},{"key":"D","text":"在设立社所在地的设区的市的行政区划内设立"}],"answer":"B","keys":["B"],"explanation":"服务网点没有法人资格;旅行社应当加强对服务网点的管理,实行统一管理、统一财务、统一招徕和统一咨询的服务规范;设立社可以在其所在地的省、自治区、直辖市行政区划内设立服务网点。可以在该分社所在地设区的市的行政区划内设立服务网点。","type":"单选题"},{"number":58,"stem":"《旅行社条例》规定,旅行社自交纳或者补足服务质量保证金之日起（ ）内未因侵害旅游者合法权益受到行政机关罚款以上处罚的,旅游行政管理部门应当将旅游服务质量保证金的缴存数额降低 50%,并向社会公告｡","options":[{"key":"A","text":"1 年"},{"key":"B","text":"2 年"},{"key":"C","text":"3 年"},{"key":"D","text":"5 年"}],"answer":"C","keys":["C"],"explanation":"旅行社自交纳或者补足质量保证金之日起 3 年内未因侵害旅游者合法权益受到行政机关罚款以上处罚的,旅游行政管理部门应当将旅游服务质量保证金的缴存数额降低 50%,并向社会公告。","type":"单选题"},{"number":59,"stem":"根据《旅行社条例》的规定,旅行社被吊销旅行社业务经营许可的,其（ ）在旅行社业务经营许可被吊销之日起 5 年内不得担任任何旅行社的主要负责人｡","options":[{"key":"A","text":"直接责任人"},{"key":"B","text":"涉事的工作人员"},{"key":"C","text":"有关管理人员"},{"key":"D","text":"主要负责人"}],"answer":"D","keys":["D"],"explanation":"《旅行社条例》第 64 条规定,旅行社被吊销旅行社业务经营许可的,其主要负责人在旅行社业务经营许可被吊销之日起 5 年内不得担任任何旅行社的主要负责人。","type":"单选题"},{"number":60,"stem":"《文化和旅游市场信用管理规定》规定,对严重失信主体､轻微失信主体实施信用管理措施的期限分别为（ ）｡法律法规另有规定的,从其规定｡","options":[{"key":"A","text":"5 年,3 年"},{"key":"B","text":"4 年,2 年"},{"key":"C","text":"3 年,1 年"},{"key":"D","text":"2 年,6 个月"}],"answer":"C","keys":["C"],"explanation":"第 21 条规定,对严重失信主体实施信用管理措施的期限为 3 年,对轻微失信主体实施信用管理措施的期限为 1 年。法律法规另有规定的,从其规定。","type":"单选题"},{"number":61,"stem":"《文化和旅游市场信用管理规定》规定,失信主体信息应当按照（ ）原则,通过全国文化和旅游市场信用管理系统等渠道公开｡","options":[{"key":"A","text":"“谁管理､谁公开”"},{"key":"B","text":"“谁认定､谁公开”"},{"key":"C","text":"“谁负责､谁公开”"},{"key":"D","text":"“谁制定､谁公开”"}],"answer":"B","keys":["B"],"explanation":"第 23 条规定,失信主体信息应当按照“谁认定、谁公开”原则通过全国文化和旅游市场信用管理系统等渠道公开。法律法规另有规定的,从其规定。","type":"单选题"},{"number":62,"stem":"在线旅游经营者违反有关规定,为以不合理低价组织的旅游活动提供交易机会的,由县级以上文化和旅游主管部门责令改正,给予警告,可以并处（ ）罚款｡","options":[{"key":"A","text":"1 万元以上 3 万元以下"},{"key":"B","text":"3 万元以下"},{"key":"C","text":"1 万元"},{"key":"D","text":"3 万元"}],"answer":"B","keys":["B"],"explanation":"《在线旅游经营服务管理暂行规定》第 36 条规定,在线旅游经营者违反本规定第 18条规定,为以不合理低价组织的旅游活动提供交易机会的,由县级以上文化和旅游主管部门责令改正,给予警告,可并处 3 万元以下罚款。","type":"单选题"},{"number":63,"stem":"依据《导游人员管理条例》,导游人员在引导旅游者旅行､游览过程中,遇有可能危及旅游者（ ）的紧急情形时,经征得多数旅游者的同意,可以调整或者变更接待计划,但是应当立即报告旅行社｡","options":[{"key":"A","text":"财产安全或者人身安全"},{"key":"B","text":"财产安全和人身安全"},{"key":"C","text":"人身安全"},{"key":"D","text":"财产安全"}],"answer":"C","keys":["C"],"explanation":"导游人员在引导旅游者旅行、游览过程中,遇有可能危及旅游者人身安全的紧急情形时,经征得多数旅游者的同意,可以调整或者变更接待计划,但是应当立即报告旅行社。注意:考点中涉及到的几处仅有“人身安全”的情形要注意总结。","type":"单选题"},{"number":64,"stem":"《导游人员管理条例》规定,导游人员应当不断提高（ ）｡","options":[{"key":"A","text":"服务水平"},{"key":"B","text":"职业道德修养"},{"key":"C","text":"导游证等级"},{"key":"D","text":"自身业务素质和职业技能"}],"answer":"D","keys":["D"],"explanation":"《导游人员管理条例》第 7 条规定,导游人员应当不断提高自身业务素质和职业技能。","type":"单选题"},{"number":65,"stem":"根据《导游人员管理条例》的规定,导游人员资格证书由（ ）颁发｡","options":[{"key":"A","text":"国务院旅游行政部门"},{"key":"B","text":"县级以上旅游行政部门"},{"key":"C","text":"国务院旅游行政部门或其委托的县级以上人民政府旅游行政部门"},{"key":"D","text":"国务院旅游行政部门或其委托的省､自治区､直辖市人民政府旅游行政部门"}],"answer":"D","keys":["D"],"explanation":"根据《导游人员管理条例》的规定,导游人员资格证书由国务院旅游行政部门或者国务院旅游行政部门委托省、自治区、直辖市人民政府旅游行政部门颁发。","type":"单选题"},{"number":66,"stem":"依据《导游管理办法》,导游应当自（ ）情形发生之日起 10 个工作日内,通过全国旅游监管服务信息系统提交相应材料,申请变更导游证信息｡","options":[{"key":"A","text":"在旅游行业组织取消注册后,在 3 个月内与旅行社订立劳动合同"},{"key":"B","text":"与旅行社订立的劳动合同解除后,在 3 个月后与其他旅行社订立劳动合同"},{"key":"C","text":"户籍所在地发生变化"},{"key":"D","text":"工作单位联系方式发生变化"}],"answer":"A","keys":["A"],"explanation":"《导游管理办法》第 15 条规定,导游应当自下列情形发生之日起 10 个工作日内,通过全国旅游监管服务信息系统提交相应材料,申请变更导游证信息:姓名、身份证号、导游等级和语种等信息发生变化的;与旅行社订立的劳动合同解除、终止或者在旅游行业组织取消注册后,在 3 个月内与其他旅行社订立劳动合同或者在其他旅游行业组织注册的;经常执业地区发生变化的;其他导游身份信息发生变化的。","type":"单选题"},{"number":67,"stem":"依据《中华人民共和国旅游法》,从事领队业务应当具有相应学历;依据《旅行社条例实施细则》,相应学历是指（ ）｡","options":[{"key":"A","text":"中专学历"},{"key":"B","text":"高中学历"},{"key":"C","text":"大学学历"},{"key":"D","text":"大专以上学历"}],"answer":"D","keys":["D"],"explanation":"旅行社为组织旅游者出境旅游委派的领队,应当具备下列条件:取得导游证;具有大专以上学历;取得相关语言水平测试等级证书或通过外语语种导游资格考试,旅行社委派的领队,应当掌握相关旅游目的地国家(地区)语言或者英语,但为赴港澳台地区旅游委派的领队除外;具有 2 年以上旅行社业务经营、管理或者导游等相关从业经历;与委派其从事领队业务的取得出境旅游业务经营许可的旅行社订立劳动合同。赴台旅游领队还应当符合《大陆居民赴台湾地区旅游管理办法》规定的要求。","type":"单选题"},{"number":68,"stem":"导游老王将其导游证出借给朋友小雷,为其进入景区提供便利｡依据《导游管理办法》,应由旅游主管部门责令改正,并可以处（ ）罚款｡","options":[{"key":"A","text":"2000 元以上 1 万元以下"},{"key":"B","text":"1000 元以上 2 万元以下"},{"key":"C","text":"2000 元以上 2 万元以下"},{"key":"D","text":"1000 元以上 1 万元以下"}],"answer":"A","keys":["A"],"explanation":"《导游管理办法》第 35 条规定,导游涂改、倒卖、出租、出借导游人员资格证、导游证,以其他形式非法转让导游执业许可,或者擅自委托他人代为提供导游服务,由县级以上旅游主管部门责令改正,并可以处 2000 元以上 1 万元以下罚款。","type":"单选题"},{"number":69,"stem":"《导游人员管理条例》第 21 条规定,导游人员进行导游活动时未佩戴导游证的,由旅游行政部门责令改正;拒不改正的,处（ ）以下的罚款｡","options":[{"key":"A","text":"500 元"},{"key":"B","text":"1000 元"},{"key":"C","text":"2000 元"},{"key":"D","text":"3000 元"}],"answer":"A","keys":["A"],"explanation":"《导游人员管理条例》第 21 条规定,导游人员进行导游活动时未佩戴导游证的,由旅游行政部门责令改正;拒不改正的,处 500 元以下的罚款。","type":"单选题"},{"number":70,"stem":"根据《消费者权益保护法》的规定,下列情形中,消费者有权自收到商品之日起 7 日内退货且无需说明理由的是（ ）｡","options":[{"key":"A","text":"消费者从某电商平台购买的家用电器"},{"key":"B","text":"消费者从科技市场购买的电脑"},{"key":"C","text":"消费者在药店购买的保健品"},{"key":"D","text":"消费者在某商场购买的大衣"}],"answer":"A","keys":["A"],"explanation":"《消费者权益保护法》第 25 条:经营者采用网络、电视、电话、邮购等方式销售商品,消费者有权自收到商品之日起 7 日内退货,且无需说明理由。","type":"单选题"},{"number":71,"stem":"依据《国家旅游局关于旅游不文明行为记录管理暂行办法》,下列关于不文明行为当事人的信息中,属于“旅游不文明行为记录”信息内容的是（ ）｡","options":[{"key":"A","text":"动态管理"},{"key":"B","text":"户籍所在地"},{"key":"C","text":"工作单位"},{"key":"D","text":"户籍省份"}],"answer":"D","keys":["D"],"explanation":"“旅游不文明行为记录”信息内容包括:(1)不文明行为当事人的姓名、性别、户籍省份;(2)不文明行为的具体表现、不文明行为所造成的影响和后果;(3)对不文明行为的记录期限。","type":"单选题"},{"number":72,"stem":"旅游投诉处理机构受理旅游投诉后,对于情况复杂的投诉,应当填写（ ）,连同有关投诉材料副本一并送达被投诉人。","options":[{"key":"A","text":"《旅游投诉立案表》"},{"key":"B","text":"《旅游投诉处理通知书》"},{"key":"C","text":"《旅游投诉受理通知书》"},{"key":"D","text":"《旅游投诉转办函》"}],"answer":"B","keys":["B"],"explanation":"《旅游投诉处理办法》第十六条旅游投诉处理机构受理旅游投诉后,应当按照以下方式进行处理:(一)对于事实清楚的,应当立即调解并记录情况;(二)对于情况复杂的,应当填写《旅游投诉处理通知书》,与有关投诉材料副本一并送达被投诉人。","type":"单选题"},{"number":73,"stem":"《突发事件应对法》规定,突发事件发生后,实施应急处置措施的主体是（ ）｡","options":[{"key":"A","text":"有关部门"},{"key":"B","text":"人民政府"},{"key":"C","text":"应急救援队伍"},{"key":"D","text":"社会力量"}],"answer":"B","keys":["B"],"explanation":"突发事件发生后,履行统一领导职责或者组织处置突发事件的人民政府应当针对其性质、特点和危害程度,立即组织有关部门,调动应急救援队伍和社会力量,依照本章的规定和有关法律、法规、规章的规定采取应急处置措施。","type":"单选题"},{"number":74,"stem":"造成或者可能造成人员死亡(含失踪)30 人以上或者重伤（ ）以上的,构成特别重大旅游突发事件｡","options":[{"key":"A","text":"30 人"},{"key":"B","text":"50 人"},{"key":"C","text":"100 人"},{"key":"D","text":"150 人"}],"answer":"C","keys":["C"],"explanation":"特别重大旅游突发事件包括下列情形:造成或者可能造成人员死亡(含失踪)30 人以上或者重伤 100 人以上;旅游者 500 人以上滞留超过 24 小时,并对当地生产生活秩序造成严重影响;其他在境内外产生特别重大影响,并对旅游者人身、财产安全造成特别重大威胁的事件。","type":"单选题"},{"number":75,"stem":"依据《旅行社责任保险管理办法》的规定,旅行社投保旅行社责任保险,由旅行社与保险公司协商确定责任赔偿限额,但每人人身伤亡责任限额不得低于（ ）｡","options":[{"key":"A","text":"10 万元"},{"key":"B","text":"20 万元"},{"key":"C","text":"30 万元"},{"key":"D","text":"40 万元"}],"answer":"B","keys":["B"],"explanation":"依据《旅行社责任保险管理办法》的规定,责任限额可以根据旅行社业务经营范围、经营规模、风险管控能力、当地经济社会发展水平和旅行社自身需要,由旅行社与保险公司协商确定,但每人人身伤亡责任限额不得低于 20 万元。","type":"单选题"},{"number":76,"stem":"《出入境管理法》规定,中国公民出境入境,应当依法申请办理护照或者（ ）｡","options":[{"key":"A","text":"身份证明"},{"key":"B","text":"签证"},{"key":"C","text":"其他出境证明文件"},{"key":"D","text":"其他旅行证件"}],"answer":"D","keys":["D"],"explanation":"《出入境管理法》第 9 条规定,中国公民出境入境,应当依法申请办理护照或者其他旅行证件。","type":"单选题"},{"number":77,"stem":"根据《娱乐场所管理条例》,下列地点中可以设立娱乐场所的是（ ）｡","options":[{"key":"A","text":"居民住宅区周围"},{"key":"B","text":"车站､机场等人群密集的场所"},{"key":"C","text":"建筑物地下一层"},{"key":"D","text":"居民楼等建筑物内"}],"answer":"C","keys":["C"],"explanation":"娱乐场所不得设在下列地点:居民楼、博物馆、图书馆和被核定为文物保护单位的建筑物内;居民住宅区和学校、医院、机关周围;车站、机场等人群密集的场所;建筑物地下一层以下;与危险化学品仓库毗连的区域。","type":"单选题"},{"number":78,"stem":"《食品安全法》第 14 条规定,国家建立食品安全（ ）制度,对食源性疾病､食品污染及食品中的有害因素进行监测｡","options":[{"key":"A","text":"风险监测"},{"key":"B","text":"风险预估"},{"key":"C","text":"风险评估"},{"key":"D","text":"风险监控"}],"answer":"A","keys":["A"],"explanation":"《食品安全法》第 14 条规定,国家建立食品安全风险监测制度,对食源性疾病、食品污染及食品中的有害因素进行监测。","type":"单选题"},{"number":79,"stem":"经批准开业的旅馆,如有歇业､转业､合并､迁移､改变名称等情况,应当在工商行政管理部门办理变更登记后（ ）内,向当地的县､市公安局､公安分局备案｡","options":[{"key":"A","text":"3 日"},{"key":"B","text":"5 日"},{"key":"C","text":"3 个工作日"},{"key":"D","text":"5 个工作日"}],"answer":"A","keys":["A"],"explanation":"经批准开业的旅馆,如有歇业、转业、合并、迁移、改变名称等情况,应当在工商行政管理部门办理变更登记后 3 日内,向当地的县、市公安局、公安分局备案。","type":"单选题"},{"number":80,"stem":"根据《风景名胜区条例》的规定,风景名胜区总体规划的规划期一般为（ ）｡","options":[{"key":"A","text":"10 年"},{"key":"B","text":"15 年"},{"key":"C","text":"20 年"},{"key":"D","text":"25 年"}],"answer":"C","keys":["C"],"explanation":"《风景名胜区条例》第十四条:风景名胜区应当自设立之日起 2 年内编制完成总体规划。总体规划的规划期一般为 20 年。","type":"单选题"},{"number":81,"stem":"根据《博物馆条例》,国家（ ）主管部门负责全国博物馆的监督管理工作｡","options":[{"key":"A","text":"文化"},{"key":"B","text":"建设"},{"key":"C","text":"文物"},{"key":"D","text":"旅游"}],"answer":"C","keys":["C"],"explanation":"国家文物主管部门负责全国博物馆监督管理工作,县级以上地方人民政府文物主管部门负责本行政区域的博物馆监督管理工作。","type":"单选题"},{"number":82,"stem":"中国特色社会主义最本质的特征是（ ）｡","options":[{"key":"A","text":"人民代表大会制度"},{"key":"B","text":"以人为本"},{"key":"C","text":"中国共产党领导"},{"key":"D","text":"民主集中制"}],"answer":"C","keys":["C"],"explanation":"全面加强党的领导,明确中国特色社会主义最本质的特征是中国共产党领导,中国特色社会主义制度的最大优势是中国共产党领导。","type":"单选题"},{"number":83,"stem":"《港区国安法》规定,犯颠覆国家政权罪的,对积极参加的,处（ ）｡","options":[{"key":"A","text":"3 年以上 5 年以下有期徒刑"},{"key":"B","text":"3 年以上 10 年以下有期徒刑"},{"key":"C","text":"5 年以上 10 年以下有期徒刑"},{"key":"D","text":"5 年以上 15 年以下有期徒刑"}],"answer":"B","keys":["B"],"explanation":"《港区国安法》第 22 条规定,任何人组织、策划、实施或者参与实施以下以武力、威胁使用武力或者其他非法手段旨在颠覆国家政权行为之一的,即属犯罪:推翻、破坏中华人民共和国宪法所确立的中华人民共和国根本制度;推翻中华人民共和国中央政权机关或者香港特别行政区政权机关;严重干扰、阻挠、破坏中华人民共和国中央政权机关或者香港特别行政区政权机关依法履行职能;攻击、破坏香港特别行政区政权机关履职场所及其设施,致使其无法正常履行职能。犯前款罪,对首要分子或者罪行重大的,处无期徒刑或者 10 年以上有期徒刑;对积极参加的,处 3 年以上 10 年以下有期徒刑;对其他参加的,处 3 年以下有期徒刑、拘役或者管制。","type":"单选题"},{"number":84,"stem":"国家建立了侵害英雄烈士名誉､荣誉的公益诉讼制度,即在英雄烈士没有近亲属,或者近亲属不提起诉讼的情况下,（ ）可以提起诉讼,以保护英雄烈士的合法权益｡","options":[{"key":"A","text":"英雄烈士生前所属单位"},{"key":"B","text":"法律援助志愿者"},{"key":"C","text":"英烈保护机构"},{"key":"D","text":"检察机关"}],"answer":"D","keys":["D"],"explanation":"《英烈法》第 25 条规定,对侵害英雄烈士的姓名、肖像、名誉、荣誉的行为,英雄烈士的近亲属可以依法向人民法院提起诉讼。英雄烈士没有近亲属或者近亲属不提起诉讼的,检察机关依法对侵害英雄烈士的姓名、肖像、名誉、荣誉,损害社会公共利益的行为向人民法院提起诉讼。","type":"单选题"},{"number":85,"stem":"依据文化和旅游部《旅游强国建设“十五五”规划》,到 2030 年,我国旅游业发展的总体目标是（ ）｡","options":[{"key":"A","text":"旅游业高质量发展取得明显成效,现代旅游业体系更加完善,旅游强国建设取得显著进展"},{"key":"B","text":"现代旅游业体系基本建成,旅游及相关产业增加值占国内生产总值比重显著提升"},{"key":"C","text":"旅游强国建设取得决定性进展,现代旅游业体系全面成熟"},{"key":"D","text":"全面建成旅游强国,旅游业国际竞争力和影响力全球领先"}],"answer":"A","keys":["A"],"explanation":"到 2030 年,旅游业高质量发展取得明显成效,现代旅游业体系更加完善,旅游强国建设取得显著进展。旅游业的支柱产业地位更加稳固,旅游业拉动内需、促进就业、活跃市场的作用进一步发挥,旅游及相关产业增加值占国内生产总值比重稳步提升。A 项正确,与规划原文对 2030 年发展目标的表述完全一致,故 A 正确。B 项错误,规划对 2030 年的定位是“旅游强国建设取得显著进展”,而非“现代旅游业体系基本建成”,且原文为“增加值占国内生产总值比重稳步提升”,非“显著提升”,故 B 错误。C 项错误,“取得决定性进展”“现代旅游业体系全面成熟”均非规划原文表述,故 C 错误。D 项错误,“全面建成旅游强国”不是 2030 年的目标定位,故 D 错误。","type":"单选题"},{"number":86,"stem":"《关于推动在线旅游市场高质量发展的意见》强调,要深入发展的领域是（ ）｡","options":[{"key":"A","text":"实体经济"},{"key":"B","text":"智慧旅游"},{"key":"C","text":"传统文化"},{"key":"D","text":"传统旅游业"}],"answer":"B","keys":["B"],"explanation":"以推动高质量发展为主题,以深化供给侧结构性改革为主线,以满足人民日益增长的美好生活需要为根本目的,充分发挥市场在资源配置中的决定性作用,更好发挥政府作用,用好各项纾困政策,调动市场积极因素,大力发展数字经济,深入发展智慧旅游,提升常态化监管水平,支持在线旅游平台经营者在引领发展、创造就业中大显身手。坚守安全底线,加强行业自律,推动在线旅游市场高质量发展。","type":"单选题"},{"number":87,"stem":"被公认为世界上第一次商业性旅游活动､近代旅游活动开端标志的是（ ）｡","options":[{"key":"A","text":"1841 年禁酒大会"},{"key":"B","text":"1845 年利物浦之行"},{"key":"C","text":"1845 年托马斯库克旅行社成立"},{"key":"D","text":"1846 年苏格兰之行"}],"answer":"A","keys":["A"],"explanation":"1841 世界上第一次商业性旅游活动包租火车组织 570 人从莱斯特到拉夫巴勒参加禁酒大会;每人支付往返票价一先令被公认为世界上第一次商业性旅游活动;近代旅游活动开端的标志。","type":"单选题"},{"number":88,"stem":"1949 年 11 月,新中国第一家旅行社（ ）在厦门成立｡","options":[{"key":"A","text":"中国旅行社"},{"key":"B","text":"华侨服务社"},{"key":"C","text":"中国国际旅行社"},{"key":"D","text":"中国青年旅行社"}],"answer":"B","keys":["B"],"explanation":"1949 年 11 月:新中国第一家旅行社“华侨服务社”在厦门营业,新中国第一批导游同步诞生。","type":"单选题"},{"number":89,"stem":"1983 年 10 月,国家旅游局确定以东汉青铜器（ ）作为中国旅游业的图形标志｡","options":[{"key":"A","text":"曾侯乙编钟"},{"key":"B","text":"四羊方尊"},{"key":"C","text":"后母戊鼎"},{"key":"D","text":"马踏飞燕"}],"answer":"D","keys":["D"],"explanation":"1983 年 10 月,国家旅游局确定以东汉青铜器“马踏飞燕”作为中国旅游业的图形标志。","type":"单选题"},{"number":90,"stem":"（ ）原则是导游服务的核心,以满足游客正当需求为出发点｡","options":[{"key":"A","text":"规范化服务"},{"key":"B","text":"平等待客"},{"key":"C","text":"游客为本"},{"key":"D","text":"维护旅游者合法权益"}],"answer":"C","keys":["C"],"explanation":"游客为本原则是导游服务的核心,以满足游客正当需求为出发点。","type":"单选题"},{"number":91,"stem":"导游服务质量的高低对于旅游产品和旅行社形象的传播具有至关重要的作用,这是（ ）作用的体现｡","options":[{"key":"A","text":"标志作用"},{"key":"B","text":"反馈作用"},{"key":"C","text":"扩散作用"},{"key":"D","text":"纽带作用"}],"answer":"C","keys":["C"],"explanation":"导游服务质量的高低对于旅游产品和旅行社形象的传播具有至关重要的作用,这是扩散作用的体现。","type":"单选题"},{"number":92,"stem":"在中华人民共和国境内从事导游活动,必须取得（ ）｡","options":[{"key":"A","text":"导游证"},{"key":"B","text":"导游资格证"},{"key":"C","text":"领队证"},{"key":"D","text":"普通话证"}],"answer":"A","keys":["A"],"explanation":"在中华人民共和国境内从事导游活动,必须取得导游证。","type":"单选题"},{"number":93,"stem":"下列选项中,关于初级导游晋升中级导游,描述正确的一项是（ ）｡","options":[{"key":"A","text":"必须具有高中以上学历"},{"key":"B","text":"取得初级导游必须满 2 年"},{"key":"C","text":"2 年内带团记录不得少于 30 次或者 120 天"},{"key":"D","text":"初级导游可以在获得表彰奖励(符合要求)3 年内,通过申请获得中级"}],"answer":"B","keys":["B"],"explanation":"必须具有大专以上学历;2 年内带团记录不得少于 25 次或者 90 天;初级导游可以在获得表彰奖励(符合要求)2 年内,通过申请获得中级。","type":"单选题"},{"number":94,"stem":"（ ）在导游工作集体中处于中心地位,起着主导作用｡","options":[{"key":"A","text":"地陪"},{"key":"B","text":"全陪"},{"key":"C","text":"领队"},{"key":"D","text":"团长"}],"answer":"B","keys":["B"],"explanation":"全陪在导游工作集体中处于中心地位,起着主导作用。","type":"单选题"},{"number":95,"stem":"从卫生角度考虑,交谈的最佳距离为（ ）｡","options":[{"key":"A","text":"1 米"},{"key":"B","text":"1.3 米"},{"key":"C","text":"2 米"},{"key":"D","text":"3.7 米"}],"answer":"B","keys":["B"],"explanation":"从卫生角度考虑,交谈的最佳距离为 1.3 米。","type":"单选题"},{"number":96,"stem":"若旅游者欲观看不健康的文娱节目或参与不正常的夜生活活动,地陪应（ ）｡","options":[{"key":"A","text":"耐心劝阻"},{"key":"B","text":"置之不理"},{"key":"C","text":"明确拒绝"},{"key":"D","text":"主动协助"}],"answer":"C","keys":["C"],"explanation":"若旅游者欲观看不健康的文娱节目或参与不正常的夜生活活动,地陪应明确拒绝。","type":"单选题"},{"number":97,"stem":"地陪老王接团前,通常与司机商定提前（ ）到达见面地点｡","options":[{"key":"A","text":"20 分钟"},{"key":"B","text":"30 分钟"},{"key":"C","text":"40 分钟"},{"key":"D","text":"60 分钟"}],"answer":"B","keys":["B"],"explanation":"地陪应接团前与司机联系,商定接头时间和地点(通常提前 30 分钟到达见面地点)。","type":"单选题"},{"number":98,"stem":"下列选项中,属于地陪在旅游团即将抵达前的业务安排的是（ ）｡","options":[{"key":"A","text":"穿着大方得体的服装去迎接客人"},{"key":"B","text":"提前熟悉用餐餐厅的具体情况"},{"key":"C","text":"集中清点行李"},{"key":"D","text":"确认旅游团抵达的时间和地点"}],"answer":"D","keys":["D"],"explanation":"旅游团即将抵达前的业务安排:确认旅游团抵达的时间和地点;与旅游车司机对接;再次核实旅游团抵达的时间。","type":"单选题"},{"number":99,"stem":"地陪导游老王待旅游者上车坐稳后,首先（ ）｡","options":[{"key":"A","text":"检查行李架上的物品是否稳固"},{"key":"B","text":"礼貌地清点人数"},{"key":"C","text":"提醒旅游者坐稳系好安全带"},{"key":"D","text":"致欢迎词"}],"answer":"A","keys":["A"],"explanation":"待旅游者坐稳后,地陪应先检查行李架上的物品是否稳固,再礼貌地清点人数,最后请司机开车,并再次提醒旅游者坐稳系好安全带。","type":"单选题"},{"number":100,"stem":"（ ）不是地陪离店服务的服务内容｡","options":[{"key":"A","text":"提醒注意事项"},{"key":"B","text":"办理退房手续"},{"key":"C","text":"集合登车"},{"key":"D","text":"致欢送词"}],"answer":"D","keys":["D"],"explanation":"地陪离店服务的服务内容:提醒注意事项;办理退房手续;集合登车。","type":"单选题"},{"number":101,"stem":"全陪导游老王接待入境团时,应在接团（ ）与首站接待社取得联系,了解接待工作的详细安排情况｡","options":[{"key":"A","text":"前一日"},{"key":"B","text":"当天"},{"key":"C","text":"到达交通工具所在地时"},{"key":"D","text":"接到旅游团队后"}],"answer":"A","keys":["A"],"explanation":"全陪应在接团前一日与首站接待社取得联系,了解接待工作详细安排情况。","type":"单选题"},{"number":102,"stem":"导游讲解的理想语速为每分钟（ ）字左右｡","options":[{"key":"A","text":"150"},{"key":"B","text":"180"},{"key":"C","text":"200"},{"key":"D","text":"250"}],"answer":"C","keys":["C"],"explanation":"导游讲解中理想语速为每分钟 200 字左右,过快会使旅游者听不清,过慢则容易让人乏味。","type":"单选题"},{"number":103,"stem":"“大明湖里的荷花亭亭玉立,在微风中悄然起舞”,这句话采用了（ ）的修辞方式｡","options":[{"key":"A","text":"夸张"},{"key":"B","text":"比喻"},{"key":"C","text":"比拟"},{"key":"D","text":"引用"}],"answer":"C","keys":["C"],"explanation":"拟人:将景物赋予人的特征与情感,使其更具生命力和亲和力。例如:“大明湖里的荷花亭亭玉立,在微风中悄然起舞”,荷花为物,修饰以“亭亭玉立”“悄然起舞”后,就有了人的美丽,贴切形象。","type":"单选题"},{"number":104,"stem":"目光语中表示尊重､谦逊､期待､盼望､哀求等含义的是（ ）｡","options":[{"key":"A","text":"仰视"},{"key":"B","text":"正视"},{"key":"C","text":"俯视"},{"key":"D","text":"斜视"}],"answer":"A","keys":["A"],"explanation":"仰视视线朝上,表尊重、谦逊、期待、盼望、哀求等。","type":"单选题"},{"number":105,"stem":"介绍城市或景点的地理､历史､人物､布局等内容时,适用（ ）进行讲解｡","options":[{"key":"A","text":"突出重点法"},{"key":"B","text":"触景生情法"},{"key":"C","text":"分段讲解法"},{"key":"D","text":"概述法"}],"answer":"D","keys":["D"],"explanation":"综合概述法,又称“概况讲解”,是指导游在旅游者初到城市或景点前,利用车上沿途讲解时间或在景区大型导览图前停留的时间,对城市或景点的地理、历史、人物、布局等进行概括性介绍,使旅游者快速了解旅游目的地的大致情况。","type":"单选题"},{"number":106,"stem":"导游老王先抛出问题,稍作停顿后主动解释,不需要游客参与的讲解方法是（ ）｡","options":[{"key":"A","text":"我问客答"},{"key":"B","text":"自问自答"},{"key":"C","text":"客问我答"},{"key":"D","text":"客问客答"}],"answer":"B","keys":["B"],"explanation":"自问自答导游先抛出问题,稍作停顿后主动解释,目的在于吸引注意力、激发游兴,适用于难度较大或旅游者难以回答的问题。","type":"单选题"},{"number":107,"stem":"如果地陪不住饭店,（ ）要负起全责,照顾好旅游团的安全和生活｡","options":[{"key":"A","text":"领队"},{"key":"B","text":"全陪"},{"key":"C","text":"团长"},{"key":"D","text":"酒店"}],"answer":"B","keys":["B"],"explanation":"如果地陪不住饭店,全陪要负起全责,照顾好旅游团的安全和生活。","type":"单选题"},{"number":108,"stem":"导游老王在为老年人安排行程计划时,操作正确的是（ ）｡","options":[{"key":"A","text":"景点游览宜多而精"},{"key":"B","text":"参游项目宜量力而行,不宜过多使用激将法"},{"key":"C","text":"适当安排夜间游览"},{"key":"D","text":"游览中适当增加休息频次"}],"answer":"D","keys":["D"],"explanation":"景点游览宜少而精;增加休息频次:在游览中增加休息次数,多安排上卫生间的机会;不宜安排夜间游览,避免老年人过度疲劳;参游项目宜量力而行:导游不宜用激将法刺激老年人参加挑战性项目。","type":"单选题"},{"number":109,"stem":"当发生接待纠纷时,导游处理不正确的选项是（ ）｡","options":[{"key":"A","text":"遵循旅游合同,防止矛盾扩大化"},{"key":"B","text":"引导旅游者情绪,坚决维护旅游者利益"},{"key":"C","text":"做好书面记录,保存书证､物证､电子数据等证据"},{"key":"D","text":"按旅行社要求采取必要的措施"}],"answer":"B","keys":["B"],"explanation":"遵循旅游合同,防止矛盾扩大化,处理问题讲求有理、有利、有节,稳定旅游者情绪,引导旅游者理性维权;做好书面记录,保存书证、物证、电子数据等证据;及时向旅行社报告,反映接待纠纷的详细情况,并按旅行社要求采取必要的措施;尽量保障后续旅游行程的执行,维护旅游者和旅行社的合法权益。","type":"单选题"},{"number":110,"stem":"旅游者卢女士在境外丢失证件或物品时,导游老王应该协助（ ）｡","options":[{"key":"A","text":"旅游者到当地旅行社开具遗失证明"},{"key":"B","text":"向当地警方报失,开具丢失证明"},{"key":"C","text":"办理相应离境手续"},{"key":"D","text":"持遗失证明向保险公司理赔"}],"answer":"D","keys":["D"],"explanation":"当地旅行社开具丢失证明，领队协助旅游者:①向当地警方报失;②开具物品遗失证明(用途:-离境时海关查验;-向保险公司申请理赔)。","type":"单选题"},{"number":111,"stem":"下列选项中,属于地陪导游与全陪导游工作不同的是（ ）｡","options":[{"key":"A","text":"旅游接待工作"},{"key":"B","text":"维护安全"},{"key":"C","text":"处理问题"},{"key":"D","text":"宣传､调研工作"}],"answer":"D","keys":["D"],"explanation":"宣传、调研工作是全陪特有的工作,地陪工作中没有此项。故选 D。","type":"单选题"},{"number":112,"stem":"导游在带（ ）时,应遵循“三不说”原则:不多说､不错说､不乱说,确保信息的准确性和严肃性｡","options":[{"key":"A","text":"老年团"},{"key":"B","text":"商务团"},{"key":"C","text":"政务团"},{"key":"D","text":"亲子团"}],"answer":"C","keys":["C"],"explanation":"讲解是政务接待中导游的主要任务。政务团的讲解要求“精”“要”。导游应遵循“三不说”原则:不多说、不错说、不乱说,确保信息的准确性和严肃性。","type":"单选题"},{"number":113,"stem":"对于游客卢女士提出更换饭店的要求,导游老王应该予以满足的情形是（ ）｡","options":[{"key":"A","text":"客房清洁不达标或设施出现损坏"},{"key":"B","text":"饭店无法提供可调换楼层和朝向的客房"},{"key":"C","text":"景观房或高楼层房间需求不能满足时"},{"key":"D","text":"确认旅行社实际安排的饭店低于合同约定标准时"}],"answer":"D","keys":["D"],"explanation":"A、B、C 三项属于旅游者要求调换房间的情形;D 项旅行社实际安排的饭店低于合同约定标准,按照规定可以调换饭店。","type":"单选题"},{"number":114,"stem":"面对个别旅游者购买文物古玩的需求,导游操作正确的是（ ）｡","options":[{"key":"A","text":"告知旅游者在购买文物古玩时务必妥善保管好发票"},{"key":"B","text":"提醒旅游者在路边摊购买文物古玩时,注意甄别"},{"key":"C","text":"注意去掉古玩上的火漆印,否则不好出关"},{"key":"D","text":"若发现个别旅游者存在走私文物等可疑行为,导游要耐心劝阻"}],"answer":"A","keys":["A"],"explanation":"提醒旅游者避免在路边摊购买文物古玩,而是建议其前往当地正规的文物商店进行选购,降低购买到赝品的风险,保障旅游者的消费权益;告知旅游者在购买文物古玩时务必妥善保管好发票,并注意保留古玩上的火漆印,作为鉴定凭证,以便在通过海关查验等环节时能够顺利出示相关证明,避免麻烦;若发现个别旅游者存在走私文物等可疑行为,导游必须立即向有关部门报告,确保旅游者的购买行为合法合规,防止违法违规情况的发生,维护旅游市场的正常秩序与国家文物安全。","type":"单选题"},{"number":115,"stem":"为了避免游客晕车,导游操作正确的选项是（ ）｡","options":[{"key":"A","text":"如果乘坐游船,游客应坐在最前排的舱位"},{"key":"B","text":"尽量吃饱,避免空腹低血糖"},{"key":"C","text":"不应阅读,应看近处快速移动景物"},{"key":"D","text":"乘坐交通工具前 30 分钟,服用抗晕药物减轻症状"}],"answer":"D","keys":["D"],"explanation":"避免晕车的正确做法包括:注意休息、避免过度疲劳;饮食清淡、不喝酒、不吃高蛋白高脂食品,且不过饱;乘坐旅游客车前排、游船中间靠后舱位、飞机机舱前部;乘坐期间闭目养神,避免长时间阅读或看近处快速移动景物;乘坐交通工具前 30 分钟服用抗晕药物减轻症状。故选 D。","type":"单选题"},{"number":116,"stem":"如果导游在境内发现游客走失,操作错误的一项是（ ）｡","options":[{"key":"A","text":"及时向旅行社报告"},{"key":"B","text":"全陪安排旅游者随行亲朋/团队代表共同寻找,地陪带团继续旅游"},{"key":"C","text":"立即向走失地公安机关报案"},{"key":"D","text":"联系景区､住宿经营者等可能有线索的接待者"}],"answer":"C","keys":["C"],"explanation":"①走失 24 小时未找到:立即向走失地公安机关报案;②特殊人群(老年人/未成年人/残疾人):立即报警。","type":"单选题"},{"number":117,"stem":"对于连续驾驶行程超过（ ）公里的旅游线路,雷大大旅行社应安排驾驶员中途休息｡","options":[{"key":"A","text":"300"},{"key":"B","text":"400"},{"key":"C","text":"500"},{"key":"D","text":"600"}],"answer":"B","keys":["B"],"explanation":"对于连续驾驶超过 4 小时或连续行程超过 400 公里的旅游线路,旅行社应安排驾驶员中途休息或增配一名驾驶员。","type":"单选题"},{"number":118,"stem":"旅游期间遭遇泥石流,导游带领游客撤离的正确方式是（ ）｡","options":[{"key":"A","text":"迅速顺着山坡向下奔跑"},{"key":"B","text":"现将游客集中起来,避免撤离时走散"},{"key":"C","text":"迅速向两侧逃生,即与泥石流垂直方向奔跑"},{"key":"D","text":"迅速找到大树,攀爬到树上躲避"}],"answer":"C","keys":["C"],"explanation":"不要攀爬到树上躲避;一旦发现有泥石流或山体滑坡迹象时,切勿与其同向奔跑,而应迅速向两侧逃生,即逃跑方向要与泥石流或山体滑坡方向成垂直方向,并且不要停留在凹坡处,要尽可能加快逃跑速度。","type":"单选题"},{"number":119,"stem":"一名 17 周岁的中国公民,其护照有效期为（ ）｡","options":[{"key":"A","text":"2 年"},{"key":"B","text":"5 年"},{"key":"C","text":"8 年"},{"key":"D","text":"10 年"}],"answer":"D","keys":["D"],"explanation":"《护照法》规定,我国公民未满 16 周岁护照有效期为 5 年,16 周岁以上的为 10 年,取消延期。","type":"单选题"},{"number":120,"stem":"截至 2025 年 6 月,中国已对美国､俄罗斯､英国等 55 国实施（ ）过境免签政策｡","options":[{"key":"A","text":"72 小时"},{"key":"B","text":"144 小时"},{"key":"C","text":"192 小时"},{"key":"D","text":"240 小时"}],"answer":"D","keys":["D"],"explanation":"截至 2025 年 6 月,中国已对美国、俄罗斯、英国等 55 国实施 240 小时过境免签政策。","type":"单选题"},{"number":121,"stem":"中国国际航空公司的标志是（ ）｡","options":[{"key":"A","text":"凤凰"},{"key":"B","text":"飞翔的燕子"},{"key":"C","text":"木棉花与飞机尾翼"},{"key":"D","text":"高飞的白鹭"}],"answer":"A","keys":["A"],"explanation":"中国国际航空公司:凤凰。集中体现在“中国红凤凰体 VIP”上:(1)造型以简洁舞动的线条展现凤凰姿态,同时是英文“VIP”(尊贵客人)的艺术变形;(2)寓意:以凤凰之姿打造完美航程,传递平安吉祥,引领行业发展。","type":"单选题"},{"number":122,"stem":"按照铁路规定,开车前 24—48 小时退票的旅客,按票价（ ）计算收取退票费｡","options":[{"key":"A","text":"5%"},{"key":"B","text":"10%"},{"key":"C","text":"20%"},{"key":"D","text":"不收"}],"answer":"B","keys":["B"],"explanation":"开车前 8 天(含 8 天)以上退票的,不收退票费;开车前 48 小时以上的,按票价 5%计;开车前 24‑ 48 小时的,按票价 10%计;不足 24 小时的按票价 20%计。","type":"单选题"},{"number":123,"stem":"车次前冠有“Y”字母的列车是（ ）｡","options":[{"key":"A","text":"临时旅客列车"},{"key":"B","text":"郊游旅客列车"},{"key":"C","text":"旅游列车"},{"key":"D","text":"临时约定通行列车"}],"answer":"C","keys":["C"],"explanation":"Y 字头——旅游列车。","type":"单选题"},{"number":124,"stem":"国际航班的值机柜台一般在飞机起飞前（ ）分钟关闭｡","options":[{"key":"A","text":"20"},{"key":"B","text":"30"},{"key":"C","text":"40"},{"key":"D","text":"60"}],"answer":"C","keys":["C"],"explanation":"国内航班一般离站前 30 分钟,国际航班前 40 分钟值机柜台关闭,具体以航空公司和机场规定为准。","type":"单选题"},{"number":125,"stem":"海拔在（ ）米以上时,就会出现高原反应的症状｡","options":[{"key":"A","text":"2500"},{"key":"B","text":"2700"},{"key":"C","text":"3000"},{"key":"D","text":"3200"}],"answer":"A","keys":["A"],"explanation":"海拔标准:高于 2500 米。","type":"单选题"},{"number":126,"stem":"服用（ ）对抗高原反应没有作用｡","options":[{"key":"A","text":"红景天"},{"key":"B","text":"高原康"},{"key":"C","text":"藿香正气水"},{"key":"D","text":"高原安"}],"answer":"C","keys":["C"],"explanation":"提前服用抗高反药(红景天/高原康/高原安)。","type":"单选题"},{"number":127,"stem":"如果在水上发生险情,可以拨打水上遇险电话（ ）｡","options":[{"key":"A","text":"12315"},{"key":"B","text":"12308"},{"key":"C","text":"12395"},{"key":"D","text":"12123"}],"answer":"C","keys":["C"],"explanation":"出现险情立即拨打全国水上遇险电话 12395。","type":"单选题"},{"number":128,"stem":"下列对游客浸泡温泉时注意事项的描述,正确的一项是（ ）｡","options":[{"key":"A","text":"高血压､心脑血管疾病患者禁止泡温泉"},{"key":"B","text":"空腹或过饱游客泡温泉时间要少于 20 分钟"},{"key":"C","text":"热毛巾敷面,避免自由基损伤皮肤"},{"key":"D","text":"入水前温泉水擦拭身体适应,出水缓慢起身"}],"answer":"D","keys":["D"],"explanation":"高血压/心脑血管疾病患者:规则服药或医生允许后浸泡,每次≤20 分钟;敷面膜/冷毛巾敷面+闭眼冥想深呼吸(防自由基损伤皮肤,缓身心压力);空腹或过饱不宜入浴(防头晕、呕吐、消化不良、疲倦);入水前温泉水擦拭身体适应,出水缓慢起身(防血管异常收缩/血压下降导致头晕跌倒)。","type":"单选题"},{"number":129,"stem":"在中国境内,（ ）可以直接兑换成人民币｡","options":[{"key":"A","text":"马来西亚林吉特"},{"key":"B","text":"菲律宾比索"},{"key":"C","text":"越南盾"},{"key":"D","text":"朝鲜元"}],"answer":"B","keys":["B"],"explanation":"在中国境内,以下国家和地区的现钞可兑换成人民币:美元、欧元、英镑、日元、澳大利亚元、加拿大元、瑞士法郎、丹麦克朗、挪威克朗、瑞典克朗、新加坡元、港币、俄罗斯卢布、新西兰元、菲律宾比索、泰国铢、韩元、澳门元和新台币等。","type":"单选题"},{"number":130,"stem":"下列城市中,比北京更早迎来新一天的是（ ）｡","options":[{"key":"A","text":"堪培拉"},{"key":"B","text":"伦敦"},{"key":"C","text":"莫斯科"},{"key":"D","text":"纽约"}],"answer":"A","keys":["A"],"explanation":"北京位于东八区,而堪培拉位于东 10 区。所以堪培拉更早。三、多项选择题（共 35 题，每题 1 分，共 35 分）","type":"单选题"},{"number":131,"stem":"根据《宪法》对公民监督权的规定,对于任何国家机关和国家工作人员的违法失职行为,公民有提出（ ）的权利｡","options":[{"key":"A","text":"批评"},{"key":"B","text":"申诉"},{"key":"C","text":"控告"},{"key":"D","text":"建议"},{"key":"E","text":"检举"}],"answer":"BCE","keys":["B","C","E"],"explanation":"公民对于任何国家机关和国家工作人员,有提出批评和建议的权利;对于任何国家机关和国家工作人员的违法失职行为,有向有关国家机关提出申诉、控告或者检举的权利,但是不得捏造或者歪曲事实进行诬告陷害。注意:批评和建议无门槛;申诉、控告或者检举需要在“违法失职行为”时才可以。","type":"多选题"},{"number":132,"stem":"根据《旅游法》的规定,订立包价旅游合同时,雷大大旅行社应当告知旅游者的事项包括（ ）｡","options":[{"key":"A","text":"旅游者不适合参加旅游活动的情形"},{"key":"B","text":"旅游活动中的安全注意事项"},{"key":"C","text":"旅游者依法可以减免责任的信息"},{"key":"D","text":"依照中国法律旅游者不宜参加的活动"},{"key":"E","text":"旅游活动中旅游者的权利和义务"}],"answer":"ABD","keys":["A","B","D"],"explanation":"《旅游法》第 62 条规定,订立包价旅游合同时,旅行社应当向旅游者告知下列事项:旅游者不适合参加旅游活动的情形;旅游活动中的安全注意事项;旅行社依法可以减免责任的信息;旅游者应当注意的旅游目的地相关法律、法规和风俗习惯、宗教禁忌,依照中国法律不宜参加的活动等;法律、法规规定的其他应当告知的事项。在包价旅游合同履行中,遇有前款规定事项的,旅行社也应当告知旅游者。“旅游活动中旅游者的权利和义务”不在此情形。","type":"多选题"},{"number":133,"stem":"根据《民法典》的规定,下列关于动物园动物致人损害责任的说法,正确的是（ ）｡","options":[{"key":"A","text":"饲养动物致人损害,仅动物饲养人承担侵权责任"},{"key":"B","text":"能够证明损害是因被侵权人重大过失造成的,可以不承担责任"},{"key":"C","text":"因未对动物采取安全措施造成他人损害的,动物饲养人或者管理人应当承担侵权责任"},{"key":"D","text":"禁止饲养危险动物致人损害,动物饲养人或者管理人应当承担侵权责任"},{"key":"E","text":"动物园动物致人损害,动物园均应承担侵权责任"}],"answer":"CD","keys":["C","D"],"explanation":"《民法典》第 1245 条规定,饲养的动物造成他人损害的,动物饲养人或者管理人应当承担侵权责任;但是,能够证明损害是因被侵权人故意或者重大过失造成的,可以不承担或者减轻责任。第 1248 条,动物园的动物造成他人损害的,动物园应当承担侵权责任,但能够证明尽到管理职责的,不承担责任。","type":"多选题"},{"number":134,"stem":"根据《旅行社条例》的规定,旅游服务质量保证金的使用情形包括（ ）｡","options":[{"key":"A","text":"旅行社违反旅游合同约定,侵害旅游者合法权益,经旅游行政管理部门查证属实的"},{"key":"B","text":"垫付旅游者人身财产安全遇有危险时的紧急救援费用"},{"key":"C","text":"发生不可抗力造成旅游者滞留的食宿费用"},{"key":"D","text":"在旅游过程中,旅游者人身安全遇有危险时用于垫付紧急救援费用的"},{"key":"E","text":"人民法院判决､裁定认定旅行社损害旅游者权益但旅行社拒绝或无力赔偿的"}],"answer":"ADE","keys":["A","D","E"],"explanation":"使用质量保证金的情形:旅游行政管理部门:(1)旅行社违反旅游合同约定,侵害旅游者合法权益,经旅游行政管理部门查证属实的;(2)旅行社因解散、破产或者其他原因造成旅游者预交旅游费用损失的;(3)在旅游过程中,旅游者人身安全遇有危险时用于垫付紧急救援费用的;司法机关:人民法院判决、裁定及其他生效法律文书认定旅行社损害旅游者合法权益,旅行社拒绝或无力赔偿的,人民法院可以从旅行社的质量保证金账户上划拨赔偿款。B 选项错误,旅游服务质量保证金垫付的是旅游者人身安全遇有危险时的紧急救援费用的。C 选项错误,发生不可抗力造成旅游者滞留的食宿费用由旅游者自己承担。","type":"多选题"},{"number":135,"stem":"依据《中华人民共和国旅游法》，旅行社可以行使解除合同权的情形包括：旅游者（ ）。","options":[{"key":"A","text":"患有传染病等疾病，可能危害其他旅游者健康和安全的"},{"key":"B","text":"未按行程约定时间准时到达集合地点的"},{"key":"C","text":"从事严重影响其他旅游者权益的活动，且不听劝阻、不能制止的"},{"key":"D","text":"从事违规或者违反社会公德的活动的"},{"key":"E","text":"携带超过容量规定的日用品与相关部门发生冲突的"}],"answer":"AC","keys":["A","C"],"explanation":"《旅游法》第 66 条规定，旅游者有下列情形之一的，旅行社可以解除合同：(一)患有传染病等疾病，可能危害其他旅游者健康和安全的；(二)携带危害公共安全的物品且不同意交有关部门处理的；(三)从事违法或者违反社会公德的活动的；(四)从事严重影响其他旅游者权益的活动，且不听劝阻、不能制止的；(五)法律规定的其他情形。旅行社可以解除合同的情形可以总结为：旅游者有重大过错或者瑕疵。BE 两个选项虽然是旅游者的原因造成的，但所造成后果的严重程度不足以到旅行社可以解除合同。D 选项表述错误，应为“从事违法”。","type":"多选题"},{"number":136,"stem":"依据《在线旅游经营服务管理暂行规定》，平台经营者发现（ ）的，应当立即采取必要的救助和处置措施，并依法及时向县级以上文化和旅游主管部门报告。","options":[{"key":"A","text":"平台内经营者未经许可经营旅行社业务"},{"key":"B","text":"经营服务过程中发生旅游安全事故的"},{"key":"C","text":"提供的旅游产品存在缺陷，危及旅游者财产安全"},{"key":"D","text":"出现法律、法规禁止交易的产品或者服务的"},{"key":"E","text":"提供的旅游产品存在缺陷，危及旅游者人身安全"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"平台经营者发现以下情况，应当立即采取必要的救助和处置措施，并依法及时向县级以上文化和旅游主管部门报告：(1)提供的旅游产品或者服务存在缺陷，危及旅游者人身、财产安全的；(2)经营服务过程中发生突发事件或者旅游安全事故的；(3)平台内经营者未经许可经营旅行社业务的；(4)出现法律、法规禁止交易的产品或者服务的；(5)其他应当报告的事项。","type":"多选题"},{"number":137,"stem":"依据《导游管理办法》，下列关于不予核发导游证情形的表述，正确的是（ ）。","options":[{"key":"A","text":"限制民事行为能力的"},{"key":"B","text":"无民事行为能力的"},{"key":"C","text":"因过失犯罪以外受过刑事处罚的"},{"key":"D","text":"被吊销导游证之日起已逾 3 年的"},{"key":"E","text":"患有甲类、乙类传染性疾病的"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"《导游管理办法》第 12 条规定，具有下列情形的，不予核发导游证：(1)无民事行为能力或者限制民事行为能力的；(2)患有甲类、乙类以及其他可能危害旅游者人身健康安全的传染性疾病的；(3)受过刑事处罚的，过失犯罪的除外；(4)被吊销导游证之日起未逾 3 年的。","type":"多选题"},{"number":138,"stem":"根据《治安管理处罚法》的规定，关于治安管理处罚的种类，下列说法正确的有（ ）。","options":[{"key":"A","text":"警告属于申诫罚，是最轻的治安管理处罚"},{"key":"B","text":"罚款属于财产罚，适用范围较为广泛"},{"key":"C","text":"行政拘留属于人身自由罚，期限为 1 日以上 15 日以下"},{"key":"D","text":"吊销公安机关发放的许可证件属于资格罚"},{"key":"E","text":"对违反治安管理的外国人，只能附加适用驱逐出境，不能适用限期出境"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"A 项正确：警告属于申诫罚，以书面方式作出，适用于情节轻微的违法行为。B 项正确：罚款属于财产罚，适用范围最广。C 项正确：行政拘留属于人身自由罚，是最严厉的治安管理处罚，期限为 1 日以上 15 日以下。D 项正确：吊销公安机关发放的许可证件属于资格罚，剥夺违法者从事特定活动的资格。E 项错误：对违反治安管理的外国人，可以附加适用限期出境或者驱逐出境，两者均可适用，并非只能驱逐出境。","type":"多选题"},{"number":139,"stem":"依据《旅游安全管理办法》，风险提示信息应当包括（ ）、注意事项、应采取的措施等内容。","options":[{"key":"A","text":"风险类别"},{"key":"B","text":"提示级别"},{"key":"C","text":"可能影响的区域"},{"key":"D","text":"起始时间"},{"key":"E","text":"发布机关"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"风险提示信息，应当包括风险类别、提示级别、可能影响的区域、起始时间、注意事项、应采取的措施和发布机关等内容。","type":"多选题"},{"number":140,"stem":"根据《旅游安全管理办法》的规定，旅游经营者的安全义务包括（ ）。","options":[{"key":"A","text":"安全防范、管理和保障义务"},{"key":"B","text":"建立旅游目的地安全风险提示制度的义务"},{"key":"C","text":"安全救助、处置和报告义务"},{"key":"D","text":"安全说明或警示义务"},{"key":"E","text":"统计分析本行政区域内发生旅游安全事故情况的义务"}],"answer":"ACD","keys":["A","C","D"],"explanation":"《旅游法》第 77 条规定，国家建立旅游目的地安全风险提示制度。故 B 项错误；县级以上地方各级旅游主管部门应当定期统计分析本行政区域内发生旅游突发事件的情况。故 E 项错误。","type":"多选题"},{"number":141,"stem":"根据《中华人民共和国民用航空法》的规定，旅客、行李或者货物在航空运输中因延误造成损失，承运人不承担赔偿责任的情形有（ ）。","options":[{"key":"A","text":"承运人证明其为了避免损失的发生已经采取一切合理措施"},{"key":"B","text":"损失主要是由旅客个人疏忽造成的"},{"key":"C","text":"承运人证明在客观情况下不可能采取合理措施避免损失"},{"key":"D","text":"旅客没有购买航班延误保险"},{"key":"E","text":"承运人的受雇人、代理人为了避免损失的发生已经采取一切合理处置手段"}],"answer":"ACE","keys":["A","C","E"],"explanation":"第 132 条 旅客、行李或者货物在航空运输中因延误造成的损失，承运人应当承担责任；但是，承运人证明本人或者其受雇人、代理人为了避免损失的发生，已经采取一切合理措施或者不可能采取此种措施的，不承担责任。A 项正确，承运人证明已经采取一切合理措施避免损失发生的，不承担责任。B 项错误，损失主要由旅客个人疏忽造成，不是法定免责事由。C 项正确，客观情况下不可能采取合理措施避免损失的，承运人不承担责任。D 项错误，是否购买航班延误保险与承运人免责无关。E 项正确，承运人的受雇人、代理人为了避免损失的发生已经穷尽一切合理处置手段的，承运人不承担责任。","type":"多选题"},{"number":142,"stem":"《中华人民共和国食品安全法》规定，县级以上人民政府食品安全监督管理部门接到食品安全事故报告后，为防止或者减轻社会危害，应当采取的措施包括（ ）。","options":[{"key":"A","text":"封存被污染的食品相关产品，并责令清洗消毒"},{"key":"B","text":"封存确认导致食品安全事故的食品及其原料，并立即进行检验"},{"key":"C","text":"对疑似被污染的食品及其原料，责令食品生产经营者召回或者停止经营"},{"key":"D","text":"开展应急救援工作，组织救治因食品安全事故导致人身伤害的人员"},{"key":"E","text":"做好信息发布工作，并对可能产生的危害加以解释、说明"}],"answer":"ADE","keys":["A","D","E"],"explanation":"《食品安全法》第 105 条规定，县级以上人民政府食品安全监督管理部门接到食品安全事故的报告后，应当立即会同同级卫生行政、农业行政等部门进行调查处理，并采取下列措施，防止或者减轻社会危害： 开展应急救援工作，组织救治因食品安全事故导致人身伤害的人员；封存可能导致食品安全事故的食品及其原料，并立即进行检验；对确认属于被污染的食品及其原料，责令食品生产经营者依照本法第 63 条的规定召回或者停止经营；封存被污染的食品相关产品，并责令进行清洗消毒；做好信息发布工作，依法对食品安全事故及其处理情况进行发布，并对可能产生的危害加以解释、说明。选项 C，只有对确认属于被污染的食品及原料，才可以召回或者停止经营。选项 B 错误，“可能导致”就要被封存并检验。","type":"多选题"},{"number":143,"stem":"根据《自然保护区条例》的规定，下列可以列为国家级自然保护区的有（ ）。","options":[{"key":"A","text":"涉及国家海洋权益的自然保护区"},{"key":"B","text":"其他自然保护区"},{"key":"C","text":"在国内外有典型意义的自然保护区"},{"key":"D","text":"在科学上有重大国际影响的自然保护区"},{"key":"E","text":"有特殊科学研究价值的自然保护区"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"《自然保护区条例》第十二条：自然保护区分为国家级自然保护区和省级自然保护区。在国内外有典型意义、在科学上有重大国际影响或者有特殊科学研究价值的自然保护区，以及涉及国家海洋权益的自然保护区，列为国家级自然保护区。其他自然保护区列为省级自然保护区。故 ACDE 项正确。B 项错误，其他自然保护区列为省级自然保护区，而不是国家级。","type":"多选题"},{"number":144,"stem":"依据习近平新时代中国特色社会主义思想相关理论，关于中国特色社会主义事业总体布局与战略布局，下列说法正确的有（ ）。","options":[{"key":"A","text":"中国特色社会主义事业战略布局是“五位一体”"},{"key":"B","text":"全面建设小康社会属于“四个全面”战略布局内容"},{"key":"C","text":"“五位一体”包含生态文明建设"},{"key":"D","text":"经济建设不属于“五位一体”总体布局范畴"},{"key":"E","text":"全面从严治党是“四个全面”战略布局组成部分"}],"answer":"CE","keys":["C","E"],"explanation":"明确中国特色社会主义事业总体布局是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，战略布局是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党四个全面。A 项错误，“五位一体”是总体布局，“四个全面”才是战略布局，二者概念混淆。B 项错误，“四个全面”战略布局的最新表述为全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党，不包含“全面建设小康社会”，小康社会已经实现。C 项正确，“五位一体”包含经济建设、政治建设、文化建设、社会建设、生态文明建设。D 项错误，经济建设是“五位一体”总体布局的首要组成部分。E 项正确，全面从严治党属于“四个全面”战略布局的组成部分。","type":"多选题"},{"number":145,"stem":"依据习近平新时代中国特色社会主义思想相关理论，要始终保持马克思主义的蓬勃生机和旺盛活力，必须坚持把马克思主义基本原理同（ ）相结合。","options":[{"key":"A","text":"新时代党的建设总要求"},{"key":"B","text":"中国具体实际"},{"key":"C","text":"总体国家安全观"},{"key":"D","text":"中华优秀传统文化"},{"key":"E","text":"新发展理念"}],"answer":"BD","keys":["B","D"],"explanation":"只有把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，坚持运用辩证唯物主义和历史唯物主义，才能正确回答时代和实践提出的重大问题，才能始终保持马克思主义的蓬勃生机和旺盛活力。A 项错误，新时代党的建设总要求属于“十个明确”内容，不属于“两个结合”范畴。B 项正确，马克思主义基本原理同中国具体实际相结合，是原文“两个结合”的内容。C 项错误，总体国家安全观是“十四个坚持”的内容，不属于“两个结合”。D 项正确，同中华优秀传统文化相结合，是原文“两个结合”的内容。E 项错误，新发展理念是“十个明确”“十四个坚持”中提到的发展理念，不属于“两个结合”。","type":"多选题"},{"number":146,"stem":"下列主体中，属于《宪法》保护的特定主体的是（ ）。","options":[{"key":"A","text":"妇女"},{"key":"B","text":"教师"},{"key":"C","text":"儿童"},{"key":"D","text":"老人"},{"key":"E","text":"华侨"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"教师不是《宪法》保护的特殊主体。","type":"多选题"},{"number":147,"stem":"《英烈保护法》明确了英雄烈士的保护范围，包括（ ）。","options":[{"key":"A","text":"为国牺牲的烈士"},{"key":"B","text":"为新中国建设牺牲的英雄"},{"key":"C","text":"为民族作出牺牲和贡献的革命先行者"},{"key":"D","text":"健在的时代先锋模范"},{"key":"E","text":"当代健在的英雄战士"}],"answer":"ABC","keys":["A","B","C"],"explanation":"《英烈法》第 2 条规定，国家和人民永远尊崇、铭记英雄烈士为国家、人民和民族作出的牺牲和贡献。近代以来，为了争取民族独立和人民解放，实现国家富强和人民幸福，促进世界和平和人类进步而毕生奋斗、英勇献身的英雄烈士，功勋彪炳史册，精神永垂不朽。需要说明的是，《英烈法》保护的英雄烈士都是已经牺牲、去世的。健在的英雄模范人物与本法保护的英雄烈士的精神是一脉相承的，对他们的褒奖、保护，适用《国家勋章和国家荣誉称号法》等相关法律法规，不适用本法。","type":"多选题"},{"number":148,"stem":"导游服务的特点有（ ）。","options":[{"key":"A","text":"工作独立性强"},{"key":"B","text":"脑体高度结合"},{"key":"C","text":"客观情况复杂"},{"key":"D","text":"文化交流频繁"},{"key":"E","text":"服务水平体现"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"导游服务的特点：工作独立性强；脑体高度结合；客观情况复杂；文化交流频繁。","type":"多选题"},{"number":149,"stem":"按照业务范围，我国导游分为（ ）。","options":[{"key":"A","text":"专职导游"},{"key":"B","text":"外语导游"},{"key":"C","text":"全陪"},{"key":"D","text":"领队"},{"key":"E","text":"地陪"}],"answer":"CDE","keys":["C","D","E"],"explanation":"按照业务范围，我国导游分为地陪导游、全陪导游和领队。","type":"多选题"},{"number":150,"stem":"带领游客赴景点途中的服务包括（ ）。","options":[{"key":"A","text":"宣布当日活动日程"},{"key":"B","text":"提醒游览中的注意事项"},{"key":"C","text":"沿途风光导游"},{"key":"D","text":"讲解游览线路"},{"key":"E","text":"组织途中活动"}],"answer":"ACE","keys":["A","C","E"],"explanation":"赴景点途中的服务：宣布当日活动日程；沿途风光导游；组织途中活动；景点概况介绍。","type":"多选题"},{"number":151,"stem":"对于地陪导游提供的餐饮服务，描述正确的选项有（ ）。","options":[{"key":"A","text":"提前落实用餐"},{"key":"B","text":"用餐过程中，地陪应巡视旅游团用餐情况 1‑ 2 次"},{"key":"C","text":"如菜品中有异物，要求餐厅负责人出面赔礼道歉"},{"key":"D","text":"涉及口味咸淡、酸辣等口味问题，要及时向餐厅反映并立即换菜"},{"key":"E","text":"用餐结束后，地陪应严格按照团队人数、用餐标准签字确认"}],"answer":"AB","keys":["A","B"],"explanation":"提前落实用餐；用餐过程中，地陪应巡视旅游团用餐情况 1—2 次；针对旅游者在用餐中出现的问题和要求，如菜品中有异物(头发、虫子等)，地陪要及时向餐厅反映并立即换菜，必要时要求餐厅负责人出面赔礼道歉并给予适当补偿；口味问题协调：涉及口味咸淡、酸辣等口味问题，地陪要及时与餐厅协调处理，并在后续餐饮安排中加以注意；用餐结束后，地陪应严格按照实际用餐人数、标准、饮用酒水数量等核实餐厅开列的账单，直接付款或在结算单上签字。","type":"多选题"},{"number":152,"stem":"首次沿途服务的内容包括（ ）。","options":[{"key":"A","text":"致欢迎辞"},{"key":"B","text":"行程介绍"},{"key":"C","text":"沿途导游"},{"key":"D","text":"核对商定日程"},{"key":"E","text":"核实团队信息"}],"answer":"ABC","keys":["A","B","C"],"explanation":"首次沿途服务的内容包括：致欢迎辞；行程介绍；沿途导游。","type":"多选题"},{"number":153,"stem":"全陪通常为游客提供的抵站服务包括（ ）。","options":[{"key":"A","text":"介绍服务行程"},{"key":"B","text":"带领旅游团出站"},{"key":"C","text":"向地陪通报情况"},{"key":"D","text":"清点行李、集合登车"},{"key":"E","text":"处理突发事件"}],"answer":"BCD","keys":["B","C","D"],"explanation":"抵站服务包括：带领旅游团出站；向地陪通报情况；清点行李、集合登车。","type":"多选题"},{"number":154,"stem":"下列选项中，符合领队带领游客文明游览要求的是（ ）。","options":[{"key":"A","text":"导游领队宜将文明旅游的内容融合在讲解词中，进行提醒和告知"},{"key":"B","text":"领队应提醒游客遵守游览场所规则，依序文明游览"},{"key":"C","text":"游览区域对游客着装有要求的，领队应在出发前向游客说明"},{"key":"D","text":"领队应提醒游客摄影摄像时先后有序，不妨碍他人"},{"key":"E","text":"领队应提示游客爱护公物、保护文物，不攀登骑跨或胡写乱画"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"(1)导游领队宜将文明旅游的内容融合在讲解词中，进行提醒和告知。(2)导游领队应提醒游客遵守游览场所规则，依序文明游览。(3)在自然环境中游览时，导游领队应提示游客爱护环境、不攀折花草、不惊吓伤害动物，不进入未开放区域。(4)观赏人文景观时，导游领队应提示游客爱护公物、保护文物，不攀登骑跨或胡写乱画。(5)在参观博物馆、教堂等室内场所时，导游领队应提示游客保持安静，根据场馆要求规范使用摄影摄像设备。不随意触摸展品。(6)游览区域对游客着装有要求的(如教堂、寺庙、博物馆、皇宫等)，导游领队应提前一天向游客说明，提醒准备。(7)导游领队应提醒游客摄影摄像时先后有序，不妨碍他人。如需拍摄他人肖像或与他人合影，应征得同意。","type":"多选题"},{"number":155,"stem":"下列选项中，对于虚实结合法描述正确的有（ ）。","options":[{"key":"A","text":"“虚”包括民间故事、神话传说"},{"key":"B","text":"“实”指景观的具体形象、真实历史"},{"key":"C","text":"以“虚”为主，“实”为“虚”服务，烘托情节"},{"key":"D","text":"虚实有机结合、自然连贯，不能生搬硬套"},{"key":"E","text":"注意内容选择，“实”要“精”要“活”"}],"answer":"ABD","keys":["A","B","D"],"explanation":"“虚”包括民间故事、神话传说等，“实”指景观的具体形象、真实历史等。(1)虚实有机结合、自然连贯，不能生搬硬套；(2)以“实”为主，“虚”为“实”服务，烘托情节；(3)注意内容选择，“实”要从眼前景物中选，“虚”要 “精”要“活”。","type":"多选题"},{"number":156,"stem":"地陪在与全陪合作过程中，应该遵循的原则有（ ）。","options":[{"key":"A","text":"找准个人定位，把握自身职责"},{"key":"B","text":"以地陪为中心，全陪协助地陪"},{"key":"C","text":"尽量减少与全陪接触，独立完成带团任务"},{"key":"D","text":"给予对方尊重，建立友情关系"},{"key":"E","text":"善于相互学习，营造积极氛围"}],"answer":"ADE","keys":["A","D","E"],"explanation":"找准个人定位，把握自身职责；给予对方尊重，建立友情关系；善于相互学习，营造积极氛围。","type":"多选题"},{"number":157,"stem":"下列选项中，导游应该劝阻旅游者自由活动的情形有（ ）。","options":[{"key":"A","text":"旅游团即将离开本地"},{"key":"B","text":"景区游客不多，环境较好，游客提出自由活动"},{"key":"C","text":"旅游者提出单独划船或去非游泳区“游泳”的要求"},{"key":"D","text":"旅游者单独骑自行车去人生地不熟、车水马龙的街头游玩"},{"key":"E","text":"旅游者去不对外开放的地区、机构参观游览的要求"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"应劝阻旅游者自由活动的几种情况1.旅游团计划去另一地游览或即将离开本地时：劝阻旅游者不要自由活动，特别是需要较长时间的活动，如不要到热闹的地方购物，以避免误机(车、船)。2.身处治安不理想、复杂、混乱的地方时：劝阻旅游者外出活动，更不要单独活动，但必须实事求是地说明情况。3.单独骑自行车去人生地不熟、车水马龙的街头游玩时：不宜让旅游者单独前往。4.游河(湖、海)时提出划小船或在非游泳区游泳时：不能答应，也不能置旅游团于不顾而陪少数人去划船、游泳。5.要求去不对外开放的地区、机构参观游览时：进行劝阻，不得答应相应要求。","type":"多选题"},{"number":158,"stem":"旅游者出现下列情形之一的，导游应立即向雷大大旅行社报告（ ）。","options":[{"key":"A","text":"旅游者中途需要暂时离团的"},{"key":"B","text":"患有传染病等疾病，可能危害其他旅游者健康和安全的"},{"key":"C","text":"携带危害公共安全的物品且不同意交有关部门处理的"},{"key":"D","text":"从事违法或违反公序良俗活动的"},{"key":"E","text":"法律规定的需要报告的其他情形"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"旅游者出现下列情形之一的，导游应立即向旅行社报告：(1)患有传染病等疾病，可能危害其他旅游者健康和安全的；(2)携带危害公共安全的物品且不同意交有关部门处理的；(3)从事违法或违反公序良俗活动的；(4)从事严重影响其他旅游者权益的活动，且不听劝阻、不能制止的；(5)法律规定的其他情形。","type":"多选题"},{"number":159,"stem":"如果导游老王预计可能发生误机(车、船)事故，他应该（ ）。","options":[{"key":"A","text":"及时向旅行社汇报"},{"key":"B","text":"开展应急联动操作"},{"key":"C","text":"做好对下一站的通知"},{"key":"D","text":"做好旅游者安抚工作"},{"key":"E","text":"立刻改签交通工具，尽量确保游客正常离开"}],"answer":"ABD","keys":["A","B","D"],"explanation":"将成事故的应急处理：在赶往机场(车站、码头)途中遇高速严重堵车、旅游车抛锚等突发情况时，导游若预计延误，需提前应急：(1)及时向旅行社汇报：发现可能延误，即刻向旅行社负责人说明情况并保持联系。(2)开展应急联动操作：通过旅行社联系机场、车站、码头等，告知旅游者人数、迟到原因及预计抵达时间，询问能否等候；导游也可通过软件关注航班等信息。(3)灵活制定应对措施：依承运方反馈和现场交通状况，与旅行社商定应对措施，如高铁改签、航班更改等。(4)做好旅游者安抚工作：处理过程中，导游保持冷静，随时向旅游者通报进展和补救措施，安抚情绪并告知需协助事项。","type":"多选题"},{"number":160,"stem":"旅游者被毒虫蜇伤后，导游老王应（ ）。","options":[{"key":"A","text":"提醒旅游者尽快离开事发点"},{"key":"B","text":"记下事发地环境及毒虫样貌"},{"key":"C","text":"提醒旅游者快速挤压或按摩伤口"},{"key":"D","text":"若被蜜蜂等刺伤，先检查并拔除毒刺，有条件尽量用酸性溶液清洗"},{"key":"E","text":"如出现头晕、呼吸困难，应尽快送医或拨打急救电话"}],"answer":"ABE","keys":["A","B","E"],"explanation":"提醒旅游者尽快离开事发点，防止再次被咬；记下事发地环境及毒虫样貌；被蜜蜂等刺伤，先检查并拔除毒刺，用洁净清水冲洗伤口，有条件用肥皂水冲洗；提醒旅游者勿挤压或按摩伤口；如出现头晕、呼吸困难，应尽快送医或拨打急救电话。","type":"多选题"},{"number":161,"stem":"为防止食物中毒事故发生，导游老王应该（ ）。","options":[{"key":"A","text":"选择卫生可靠的餐厅用餐"},{"key":"B","text":"提醒旅游者少吃街边小摊食物，少量品尝即可"},{"key":"C","text":"购买包装食品时查看生产日期和保质期"},{"key":"D","text":"不吃隔夜、生冷食物及野生果实"},{"key":"E","text":"若发现餐厅菜肴、饮料不卫生，立即停止进食，并带领游客前往医院观察"}],"answer":"ACD","keys":["A","C","D"],"explanation":"1.选择卫生可靠的餐厅用餐：安排或建议旅行社安排有卫生保障的餐厅，避免无证经营场所。2.做好安全饮食提示：提醒旅游者勿食街边小摊食物，购买包装食品时查看生产日期和保质期，不吃隔夜、生冷食物及野生果实。3.及时处理饮食变质问题：用餐时若发现菜肴、饮料不卫生或存在过期、变质、异味等情况，立即让餐厅撤下并采取补救措施，同时留意旅游者用餐后的状况。","type":"多选题"},{"number":162,"stem":"发生地震时，室内避震正确的方式有（ ）。","options":[{"key":"A","text":"身处单层房屋和楼房的一、二层，条件允许，应迅速撤离至室外安全区域"},{"key":"B","text":"若身处楼房高层，身体状况不适合撤离，则应“就近躲避”"},{"key":"C","text":"靠近玻璃门窗躲避，待地震停止后，击碎玻璃逃生"},{"key":"D","text":"选择小开间区域、立柱旁边、内承重墙的墙根、墙角躲避"},{"key":"E","text":"若处于排椅、床等旁边，可选择趴下、伏而待定或侧卧躺下等姿势"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"C 选项，务必避开吊灯、电扇等悬挂物，以及玻璃门窗、橱窗、高大不稳或摆放易碎品的货架等可能发生物体倒塌或坠落的危险区域。其他选项描述正确。","type":"多选题"},{"number":163,"stem":"洪水到来时，导游老王应该（ ）。","options":[{"key":"A","text":"等待救援过程中，尽量找机会下水，想办法远离洪水"},{"key":"B","text":"迅速组织游客转移到附近高处"},{"key":"C","text":"若无法脱困时，迅速与救援部门取得联系，准确报告所在方位和险情"},{"key":"D","text":"切勿接近或触碰电线杆、高压线铁塔，远离有电线掉落的水域"},{"key":"E","text":"安抚客人情绪，保持冷静"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"应迅速组织大家转移到附近高处，像山坡、高地、坚固的高层建筑等场所暂避；若发现无法凭借自身力量脱困时，要迅速与救援部门取得联系，准确报告所在方位和险情；切勿接近或触碰电线杆、高压线铁塔，远离有电线掉落的水域，以防触电；也不要轻易下水，洪水水流湍急且水下情况复杂，可能存在暗流、旋涡、尖锐物体等危险因素，极易让人失去平衡遭受伤。","type":"多选题"},{"number":164,"stem":"关于购买飞机机票的价格，描述正确的选项有（ ）。","options":[{"key":"A","text":"12 周岁及以上年龄旅客需要购买全价票"},{"key":"B","text":"2 至 12 周岁旅客需要购买全价票价格的 50%的机票"},{"key":"C","text":"即使成人折扣价低于全价票的 50%，2 至 12 周岁旅客也不可以购买成人折扣票"},{"key":"D","text":"不满 2 周岁旅客，票价为成年人正常票价的 10%，占座"},{"key":"E","text":"1 位成年人可以购买 2 张成年人正常票价的 10%的儿童票，并占座"}],"answer":"AB","keys":["A","B"],"explanation":"成人票 12 周岁及以上全价票提供标准座位；儿童票 2 至 12 周岁基准价：全价票的 50%例外规则：若成人票折扣价低于全价 50%，可订成人折扣票；婴儿票不满 2 周岁：成人正常票价的 10%不单独占座，需占座则购买儿童票多人携带规则：1 名成人限带 1 名婴儿。","type":"多选题"},{"number":165,"stem":"下列度量衡换算正确的选项是（ ）。","options":[{"key":"A","text":"1 米=3 英尺"},{"key":"B","text":"1 斤=20 两"},{"key":"C","text":"1 金衡盎司=155.5 克拉"},{"key":"D","text":"1 亩=666.67 平方米"},{"key":"E","text":"1 立方米 =100000 立方厘米"}],"answer":"CD","keys":["C","D"],"explanation":"1 米=3 尺=3.2808 英尺；1 千克=20 两；1 金衡盎司=155.5 克拉；1 亩=666.67 平方米；1 立方米=1000000 立方厘米。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD一/LDD押题第一卷（科目一二）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD一/LDD押题第一卷（科目一二）-试卷.pdf"},{"name":"科目三四","questions":[{"number":1,"stem":"墨家代表人物墨子主张“兼爱”“非攻”“尚同”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。墨家代表人物:墨子(名翟,著作叫《墨子》),主张“兼爱”“非攻”“尚同”。","type":"判断题"},{"number":2,"stem":"苏州宝带桥建于唐代,是我国孔数最多的联拱石桥。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。苏州宝带桥建于唐代,是我国孔数最多的联拱石桥。","type":"判断题"},{"number":3,"stem":"“建安七子”中成就最高的是刘桢,与曹植并称为“曹王”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,“刘桢”错误。建安七子成就最高的是王粲,与曹植并称为“曹王”,主要代表作是《七哀诗》和《登楼赋》。“建安七子”指孔融、陈琳、王粲、徐幹、阮瑀、应瑒、刘桢七人。","type":"判断题"},{"number":4,"stem":"祭月、赏月活动始于周代,北宋始定为中秋节。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。祭月、赏月活动始于周代,北宋始定为中秋节,南宋成为普遍的活动,明清以来盛行不衰。中秋节的时间在每年阴历八月十五,恰值三秋之中,故名。在中国人心目中,中秋节是象征团圆的传统节日。","type":"判断题"},{"number":5,"stem":"三湾改编从组织上确立了党对军队的领导。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。1927 年 9 月 29日,秋收起义军到达江西永新县三湾村时,在毛泽东的领导下进行了改编,史称三湾改编。三湾改编建立党的各级组织和党代表制度,党的支部建在连上,班、排有小组,连以上设党代表,营、团设党委;成立各级士兵委员会,实行民主制度,在政治上官兵平等。三湾改编从组织上确立了党对军队的领导,是建设无产阶级领导的新型人民军队的重要开端。","type":"判断题"},{"number":6,"stem":"中国最早的书法作品是商朝甲骨文和金文,分别镌刻在甲骨和青铜器上。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。中国最早的书法作品是商朝甲骨文和金文,分别镌刻在甲骨和青铜器上。秦丞相李斯创制小篆,实现了字体统一。","type":"判断题"},{"number":7,"stem":"春秋时楚国最早修筑长城数百里,称“方城”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。春秋时楚国最早修筑长城数百里,称“方城”。 汉长城规模最大,东起辽东,西迄蒲昌海(今新疆罗布泊),长 1 万千米。长城是中国古代规模最宏大的防御工程。","type":"判断题"},{"number":8,"stem":"嘉峪关是明长城西端的起点,有“天下第一雄关”的美名。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。嘉峪关是明朝万里长城西端的终点,建于明洪武年间,是目前保存最完整的一座城关,有“天下第一雄关”的美名,也是丝绸之路上的重要一站。明长城东端的重要关隘是山海关。","type":"判断题"},{"number":9,"stem":"西晋王叔和著《脉经》,是我国最早的脉学著作。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。西晋王叔和著《脉经》,是我国最早的脉学著作;西晋皇甫谧著《针灸甲乙经》,是我国第一部针灸学著作。","type":"判断题"},{"number":10,"stem":"传说中国最早的历法是《黄帝历》。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。传说中国最早的历法是《黄帝历》。《授时历》是中国古代使用时间最长、精确度最高的历法。","type":"判断题"},{"number":11,"stem":"1970年 4 月 24 日,我国用长征二号运载火箭成功发射了第一颗人造卫星“东方红一号”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,“长征二号”错误。1970年 4 月 24 日,我国用长征一号运载火箭成功发射第一颗人造卫星“东方红一号”,成为继苏联、美国、法国、日本之后,世界第五个能独立发射人造地球卫星的国家。","type":"判断题"},{"number":12,"stem":"孙武著有《孙子兵法》,孙膑著有《孙膑兵法》,二人都是兵家代表人物。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。兵家关心的是“知己与知彼”“强与弱”“多与寡”“攻与守”的辩证关系,代表人物有春秋时期吴国将军孙武和战国时期齐国将军孙膑。孙武著有《孙子兵法》,孙膑著有《孙膑兵法》。","type":"判断题"},{"number":13,"stem":"“连中三元”指在乡试、会试、殿试中均获得第一名。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。考生如果能够在两轮三次考试中都获得第一名,即“乡试”第一名“解元”、“会试”第一名“会元”、“殿试”第一名 “状元”,史称“连中三元”。","type":"判断题"},{"number":14,"stem":"法国的国花是玫瑰。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,“玫瑰”错误。法国的国花是香根鸢尾花。英国国花是玫瑰。法国还是世界著名的三大烹饪王国之一。","type":"判断题"},{"number":15,"stem":"中国佛教包容了北传佛教、南传佛教和藏传佛教三大体系。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。中国佛教包容了北传佛教、南传佛教和藏传佛教三大体系,世界上完整的佛教在中国,世界上完整的佛教经典也在中国。可以说,佛教诞生在印度,发展在中国。","type":"判断题"},{"number":16,"stem":"中国古典园林的精华集中在北方。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,“北方”错误。中国现存著名古典园林多是明、清两代的遗物。中国古典园林的精华集中在江南。现存著名皇家园林:北京颐和园、北海公园,河北承德避暑山庄等。","type":"判断题"},{"number":17,"stem":"王士性“无时不游,无地不游,无官不游”,被誉为中国人文地理学的开山鼻祖。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。明代出现两位大旅行家,一是王士性,二是徐霞客。王士性“无时不游,无地不游,无官不游”。被誉为中国人文地理学的开山鼻祖,代表作《广志绎》是一部很有价值的人文地理学著作。徐霞客真名徐弘祖,号霞客,著《徐霞客游记》。","type":"判断题"},{"number":18,"stem":"日食只发生于望日,月食只发生于朔日。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,日食、月食的发生时间说反了。日食是月球遮掩太阳的一种天象。只有朔日,地球才可能位于月球的背日方向,因之日食只发生于朔日。月食是地球遮掩太阳后,月球因没有可被反射的阳光而失去光明的一种天象。只有望日,月球才可能位于地球的背日方向。因之月食只发生于望日。","type":"判断题"},{"number":19,"stem":"“一国两制”构想最早是为解决香港问题而提出的。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,“香港问题”错误。1982年,邓小平首次提出“一个国家,两种制度”的概念。“一国两制”构想最早是为解决台湾问题而提出的。","type":"判断题"},{"number":20,"stem":"鄱阳湖是我国第一大内陆湖泊,也是我国最大的淡水湖。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,“第一大内陆湖泊”错误。青海湖是我国第一大内陆湖泊,也是我国最大的咸水湖。青海湖鸟岛是我国重要的鸟类自然保护区。鄱阳湖是我国最大的淡水湖。由于东南季风带来大量水蒸气,鄱阳湖形成了“泽国芳草碧,梅黄烟雨中”景观。被称为“白鹤世界”“珍禽王国”。","type":"判断题"},{"number":21,"stem":"北京成为世界上第一个举办过夏季奥运会和冬季奥运会的城市,被称为\"双奥之城\"。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。随着 2022年第 24 届冬季奥运会和冬残奥会的顺利举办,北京成为世界上第一个举办过夏季奥运会和冬季奥运会的城市,被称为\"双奥之城\"。","type":"判断题"},{"number":22,"stem":"额尔古纳湿地被誉为\"亚洲第一湿地\"。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。额尔古纳湿地是中国保持原状态最完好、面积较大的湿地,被誉为\"亚洲第一湿地\",是观鸟和体验湿地生态的绝佳场所。","type":"判断题"},{"number":23,"stem":"吉林省是东北地区唯一既沿海又沿边的省份。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,应为\"辽宁省\"。 辽宁省位于中国东北地区的南部,南临黄海、渤海,东与朝鲜一江之隔,与日本、韩国隔海相望,是东北地区唯一的既沿海又沿边的省份。","type":"判断题"},{"number":24,"stem":"山海关素有\"万里长城,金山独秀\"的美誉。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,错在\"山海关\"。素有\"万里长城,金山独秀\"美誉的是金山岭长城;山海关素有\"两京锁钥无双地,万里长城第一关\"的盛誉。","type":"判断题"},{"number":25,"stem":"清福陵因墓主人辈分最高,被称为盛京三陵中\"三陵之首\",是清王朝的关外第一陵。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,\"福陵\"应改为\"永陵\"。清永陵因建筑年代远在清朝定都北京之前,且墓主人辈分又高,因此称\"三陵之首\",是清王朝的关外第一陵;清福陵是清太祖努尔哈赤和孝慈高皇后叶赫那拉氏的陵墓。","type":"判断题"},{"number":26,"stem":"伯夷、叔齐的《采薇歌》是辽宁最早有文字记载的文学作品。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。辽宁的文学创作古已有之,伯夷、叔齐的《采薇歌》是辽宁最早有文字记载的文学作品。","type":"判断题"},{"number":27,"stem":"山西全省大部分地区海拔在 1500 米以上,被誉为\"中华水塔\"。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,\"中华水塔\"应改为\"华北水塔\"。山西被誉为\"华北水塔\";全省大部分地区海拔在 1500 米以上,山地、丘陵面积占全省总面积的 80.1%。","type":"判断题"},{"number":28,"stem":"承德避暑山庄及周围寺庙是中国现存规模较大、保存最完整的皇家园林。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误。中国现存规模较大、保存最完整的皇家园林是北京颐和园。承德避暑山庄及周围寺庙是中国现存最大的皇家宫苑和皇家寺庙建筑群。","type":"判断题"},{"number":29,"stem":"吉林市是吉林省第一大城市,是全国唯一与省同名的城市。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,应改为“第二大城市”。吉林市是全国唯一与省同名的城市。吉林市是吉林省第二大城市,素以\"北国江城\"而闻名,有\"雾凇之都滑雪天堂\"的美誉。","type":"判断题"},{"number":30,"stem":"长春净月潭国家级森林公园为亚洲最大的森林氧吧。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。长春净月潭国家级森林公园潭水涟漪,林茂风疏,为亚洲最大的森林氧吧。","type":"判断题"},{"number":31,"stem":"上海国际电影节创办于1993年,是中国唯一获国际电影制片人协会认证的国际A类电影节。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。上海国际电影节创办于 1993 年,是中国唯一获国际电影制片人协会认证的国际 A类电影节;创办于 1986年、中国第一个国际性电视节的是上海电视节。","type":"判断题"},{"number":32,"stem":"新疆是中国位置最北、纬度最高的省区。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,应改为“黑龙江省”。黑龙江省简称\"黑\",省会哈尔滨,是中国位置最北、纬度最高的省份,地貌特征为\"五山一水一草三分田\"。","type":"判断题"},{"number":33,"stem":"五台山叶斗峰是华北最高峰,有\"华中屋脊\"之称。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,应改为“华北屋脊”。五台山叶斗峰海拔 3061米,是华北最高峰,有\"华北屋脊\"之称。点评:台顶方位属细节考点。","type":"判断题"},{"number":34,"stem":"那达慕大会是蒙古族最重要的节日之一,每年春季举办。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,\"春季\"应改为\"夏季\"。那达慕大会是蒙古族最重要的节日之一,每年夏季举办,集合了体育竞技和文化娱乐,包括赛马、摔跤、射箭等项目。","type":"判断题"},{"number":35,"stem":"赵州桥是现存最早的敞肩石拱桥。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。石家庄全市有 6个联合国认定的\"千年古县\",有世界最早的古驿道——秦皇古道,有现存最早的敞肩石拱桥\"天下第一桥\"赵州桥,有被誉为\"京外名刹之首\"的隆兴寺,有\"中国古建筑博物馆\"之称的国家历史文化名城正定。","type":"判断题"},{"number":36,"stem":"浙江之名源自钱塘江,钱塘江是浙江省内第一大江,又称\"之江\"。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。浙江省简称\"浙\",浙江之名源自浙江省境内的钱塘江;钱塘江是浙江省内第一大江,又称\"之江\"。","type":"判断题"},{"number":37,"stem":"普陀山以\"海天佛国\"\"南海圣境\"著称于世。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。号称\"东南第一山\"的是雁荡山;普陀山以\"海天佛国\"\"南海圣境\"著称于世。","type":"判断题"},{"number":38,"stem":"江苏是中国地势最低的省份,绝大部分地区海拔在 50米以下。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。江苏是中国地势最低的一个省份,绝大部分地区海拔 50 米以下,平原面积占陆地面积的 86.90%。","type":"判断题"},{"number":39,"stem":"2025年上海港集装箱吞吐量连续 16年位居全球第一。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"对","keys":["A"],"explanation":"本题说法正确。上海港是世界级枢纽港,2025 年全年完成港口货物吞吐量 88538.18万吨,集装箱吞吐量 5506.25 万国际标准箱,连续 16 年位居全球第一。","type":"判断题"},{"number":40,"stem":"截至目前,文化和旅游部共确定了 368 处国家 5A级旅游景区。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"错","keys":["B"],"explanation":"本题说法错误,应为\"358 处\"。截至目前,文化和旅游部共确定了 358 处国家 5A 级旅游景区(含恢复的乔家大院、陕西山西共有的黄河壶口瀑布算 1 处)。二、单选题","type":"判断题"},{"number":41,"stem":"苏州园林中,( )以建筑布置精巧、奇石众多而著称。","options":[{"key":"A","text":"网师园"},{"key":"B","text":"留园"},{"key":"C","text":"拙政园"},{"key":"D","text":"沧浪亭"}],"answer":"B","keys":["B"],"explanation":"留园以建筑布置精巧、奇石众多而著称。河北承德避暑山庄、北京颐和园、江苏苏州拙政园与留园,被称为我国“四大园林”。A项网师园蕴含浓郁的隐逸气息,是以少胜多的典范,被誉为“苏州园林小园极则”。C项拙政园是苏州现存最大的古典园林,也是苏州园林的代表作,全园以水为中心。D项沧浪亭代表宋代艺术风格(苏州的沧浪亭、狮子林、拙政园和留园分别代表宋、元、明、清四个朝代的艺术风格)。","type":"单选题"},{"number":42,"stem":"1927年领导湘赣边界秋收起义的是( )。","options":[{"key":"A","text":"刘少奇"},{"key":"B","text":"周恩来"},{"key":"C","text":"朱德"},{"key":"D","text":"毛泽东"}],"answer":"D","keys":["D"],"explanation":"1927 年 9 月 9 日,湘赣边界秋收起义爆发。秋收起义从进攻大城市转向进攻农村,是中国革命具有决定意义的新起点。八七会议后,毛泽东以中央特派员身份到湖南传达八七会议精神,改组省委,领导了秋收起义。B项周恩来、C 项朱德参与领导的是南昌起义。","type":"单选题"},{"number":43,"stem":"宋词婉约派的代表人物是( )。","options":[{"key":"A","text":"王安石、欧阳修"},{"key":"B","text":"陆游、范成大"},{"key":"C","text":"柳永、李清照"},{"key":"D","text":"苏轼、辛弃疾"}],"answer":"C","keys":["C"],"explanation":"宋词流派有以柳永、李清照为代表的婉约派,以苏轼、辛弃疾为代表的豪放派。D 项苏轼、辛弃疾为豪放派代表。A 项王安石、欧阳修名列“唐宋八大家”,B项陆游、范成大以诗歌创作著称,均非婉约派代表。","type":"单选题"},{"number":44,"stem":"新石器时代后期,北方黄河流域父系氏族社会的代表性文化是( )。","options":[{"key":"A","text":"红山文化"},{"key":"B","text":"仰韶文化"},{"key":"C","text":"河姆渡文化"},{"key":"D","text":"龙山文化"}],"answer":"D","keys":["D"],"explanation":"新石器时代后期——父系氏族社会代表性文化是北方黄河流域的龙山文化和南方长江流域的良渚文化,距今 5000‑ 4000年。使用快轮制造陶器、出现城址是这一时期重要的文化特征。龙山文化轮制的黑陶薄如蛋壳,十分精良。B 项仰韶文化是北方黄河流域母系氏族社会代表性文化,C 项河姆渡文化是南方长江流域母系氏族社会代表性文化,均属新石器时代前期(距今 7000—5000年)。","type":"单选题"},{"number":45,"stem":"确定了土地革命和武装反抗国民党反动派总方针的会议是( )。","options":[{"key":"A","text":"中共三大"},{"key":"B","text":"八七会议"},{"key":"C","text":"古田会议"},{"key":"D","text":"遵义会议"}],"answer":"B","keys":["B"],"explanation":"八七会议着重批评了大革命后期以陈独秀为代表的右倾机会主义错误,确定了土地革命和武装反抗国民党反动派的总方针。八七会议是由大革命失败到土地革命战争兴起的历史性转变。A 项中共三大 1923年 6 月在广州举行;C项古田会议确立了思想建党、政治建军的原则;D项遵义会议是党的历史上一个生死攸关的转折点。","type":"单选题"},{"number":46,"stem":"采用“种蛎固基法”、由蔡襄主持建造的桥梁是( )。","options":[{"key":"A","text":"赵州桥"},{"key":"B","text":"洛阳桥"},{"key":"C","text":"宝带桥"},{"key":"D","text":"湘子桥"}],"answer":"B","keys":["B"],"explanation":"泉州洛阳桥又名万安桥,是我国古代著名的梁式石桥。桥为当年郡守蔡襄主持建造,工程十分艰难。为使桥基和桥墩石胶结牢固,采用了“种蛎固基法”,独具匠心,为我国古代重要的科学创新。A 项赵州桥(安济桥)建于隋开皇年间,由工匠李春设计建造,是世界上现存最大的敞肩桥。C项苏州宝带桥建于唐代,是我国孔数最多的联拱石桥。D 项潮州湘子桥又称广济桥,初建于宋代,是我国第一座启闭式桥梁。","type":"单选题"},{"number":47,"stem":"彩画的使用有严格的等级规定,级别由高到低依次是( )。","options":[{"key":"A","text":"和玺彩画、旋子彩画、苏式彩画"},{"key":"B","text":"旋子彩画、和玺彩画、苏式彩画"},{"key":"C","text":"苏式彩画、旋子彩画、和玺彩画"},{"key":"D","text":"和玺彩画、苏式彩画、旋子彩画"}],"answer":"A","keys":["A"],"explanation":"彩画的使用有严格的等级规定,级别由高到低分为和玺彩画、旋子彩画、苏式彩画三种。明代规定,庶民民居不得饰彩画。","type":"单选题"},{"number":48,"stem":"世界上最寒冷的首都是( )。","options":[{"key":"A","text":"雷克雅未克"},{"key":"B","text":"莫斯科"},{"key":"C","text":"渥太华"},{"key":"D","text":"赫尔辛基"}],"answer":"C","keys":["C"],"explanation":"渥太华是加拿大的首都,位于安大略省东南部,是世界上最寒冷的首都。国会大厦是渥太华最著名的标志性建筑,也是加拿大的象征。","type":"单选题"},{"number":49,"stem":"世界上最大的展示极地海洋动物及极地体验的场馆——极地馆,位于( )。","options":[{"key":"A","text":"上海海昌海洋公园"},{"key":"B","text":"珠海长隆海洋王国"},{"key":"C","text":"大连老虎滩海洋馆"},{"key":"D","text":"青岛海底世界"}],"answer":"C","keys":["C"],"explanation":"大连老虎滩海洋馆有世界最大的展示极地海洋动物及极地体验的场馆——极地馆,还有亚洲最大以展示珊瑚礁生物群为主的大型海洋生物馆——珊瑚馆。","type":"单选题"},{"number":50,"stem":"唐代著名行书作品《祭侄文稿》的作者是( )。","options":[{"key":"A","text":"赵孟頫"},{"key":"B","text":"欧阳询"},{"key":"C","text":"颜真卿"},{"key":"D","text":"柳公权"}],"answer":"C","keys":["C"],"explanation":"唐颜真卿的《祭侄文稿》也是著名的行书作品。行书以东晋王羲之成就最高,人称“书圣”,代表作《兰亭集序》被誉为“天下第一行书”。唐朝欧阳询、颜真卿、柳公权与元朝赵孟頫,合称“楷书四大家”;A项赵孟頫为元朝人;B 项欧阳询、D 项柳公权均为唐代楷书名家,非《祭侄文稿》作者。","type":"单选题"},{"number":51,"stem":"西安大雁塔是由( )设计建造的仿印度窣堵波式佛塔。","options":[{"key":"A","text":"法显"},{"key":"B","text":"慧能"},{"key":"C","text":"鉴真"},{"key":"D","text":"玄奘"}],"answer":"D","keys":["D"],"explanation":"西安大雁塔被视为古都西安的象征,是由玄奘设计建造的仿印度窣堵波式佛塔。C 项鉴真为唐代东渡日本的高僧,日本奈良的唐招提寺即由其主持建造;A项法显、B项慧能与西安大雁塔无关。","type":"单选题"},{"number":52,"stem":"“落霞与孤鹜齐飞,秋水共长天一色”出自王勃的( )。","options":[{"key":"A","text":"《岳阳楼记》"},{"key":"B","text":"《赤壁赋》"},{"key":"C","text":"《兰亭集序》"},{"key":"D","text":"《滕王阁序》"}],"answer":"D","keys":["D"],"explanation":"滕王阁载誉古今,是与王勃《滕王阁序》分不开的,其经典语句“落霞与孤鹜齐飞,秋水共长天一色”广为流传。A 项《岳阳楼记》作者是范仲淹;B 项《赤壁赋》作者是苏轼;C项《兰亭集序》作者是王羲之。","type":"单选题"},{"number":53,"stem":"世界上第一部由国家颁布的药典是唐朝的( )。","options":[{"key":"A","text":"《唐本草》"},{"key":"B","text":"《千金方》"},{"key":"C","text":"《本草纲目》"},{"key":"D","text":"《神农本草经》"}],"answer":"A","keys":["A"],"explanation":"唐朝由政府颁定《唐本草》,是世界上第一部由国家颁布的药典。东汉《神农本草经》,是我国第一部药物学著作;明朝李时珍著《本草纲目》,是集中国古代药物学大成的巨著,被誉为“东方药学巨典”。B 项《千金方》是唐朝名医孙思邈所著,被誉为“东方医学圣典”;D项《神农本草经》是东汉我国第一部药物学著作;C 项《本草纲目》为明朝李时珍所著。","type":"单选题"},{"number":54,"stem":"东晋顾恺之主张“以形写神”,其代表作是( )。","options":[{"key":"A","text":"《女史箴图》《洛神赋图》"},{"key":"B","text":"《步辇图》《历代帝王图》"},{"key":"C","text":"《游春图》"},{"key":"D","text":"《清明上河图》"}],"answer":"A","keys":["A"],"explanation":"东晋顾恺之,擅长人物画,主张“以形写神”,代表作《女史箴图》《洛神赋图》;B项《步辇图》《历代帝王图》是初唐阎立本的代表作。C项《游春图》是隋朝展子虔的代表作,是现存最早的卷轴画。D项《清明上河图》是宋代张择端的作品。","type":"单选题"},{"number":55,"stem":"日本有 108个活火山,是地震多发国,被称为( )。","options":[{"key":"A","text":"“火山、地震之国”"},{"key":"B","text":"“枫叶之国”"},{"key":"C","text":"“骑在羊背上的国家”"},{"key":"D","text":"“冰城”"}],"answer":"A","keys":["A"],"explanation":"日本国土将近70%为山地,69%的陆地面积为森林覆盖,有108个活火山,是地震多发国,被称为“火山、地震之国”。B项“枫叶之国”指加拿大;C项“骑在羊背上的国家”指澳大利亚;D项“冰城”指哈尔滨。","type":"单选题"},{"number":56,"stem":"北京故宫的清朝玉雕《大禹治水玉山》是用整块( )雕琢而成的。","options":[{"key":"A","text":"岫玉"},{"key":"B","text":"独山玉"},{"key":"C","text":"和田玉"},{"key":"D","text":"蓝田玉"}],"answer":"C","keys":["C"],"explanation":"北京故宫的清朝玉雕《大禹治水玉山》就是用整块和田玉雕琢而成的。一般所称中国“四大名玉”是指新疆的和田玉、辽宁岫岩县的岫玉、河南南阳的独山玉、陕西蓝田的蓝田玉。被称为羊脂玉的白玉,为和田玉中最佳品。A 项岫玉产于辽宁岫岩县、B 项独山玉产于河南南阳、D项蓝田玉产于陕西蓝田,均非该玉山用料。","type":"单选题"},{"number":57,"stem":"我国探月工程“嫦娥工程”中,首次实现月球采样返回的是( )。","options":[{"key":"A","text":"嫦娥五号"},{"key":"B","text":"嫦娥六号"},{"key":"C","text":"嫦娥三号"},{"key":"D","text":"嫦娥四号"}],"answer":"A","keys":["A"],"explanation":"2004年我国启动探月工程(命名为“嫦娥工程”),其中嫦娥五号带回月壤 1731克,实现了我国首次月球采样返回。 嫦娥六号带回人类首份月背样品 1935.3克。","type":"单选题"},{"number":58,"stem":"鱼尾狮是( )的标志。","options":[{"key":"A","text":"泰国"},{"key":"B","text":"菲律宾"},{"key":"C","text":"新加坡"},{"key":"D","text":"马来西亚"}],"answer":"C","keys":["C"],"explanation":"鱼尾狮坐落于新加坡河畔,高 8米,是新加坡的标志。新加坡别称“狮城”,是世界上最袖珍的国家之一。整个国家也即是一座城市,有“花园城市”的美誉。","type":"单选题"},{"number":59,"stem":"汉族服装始终保留的鲜明特点是( )。","options":[{"key":"A","text":"对襟中开"},{"key":"B","text":"圆领窄袖"},{"key":"C","text":"大襟右衽"},{"key":"D","text":"大襟左衽"}],"answer":"C","keys":["C"],"explanation":"汉族的服饰在式样上主要有上衣下裳和衣裳相连两种基本的形式,大襟右衽是其服装始终保留的鲜明特点。 汉族的染织工艺,以其历史悠久、技术先进、制作精美而独步世界。","type":"单选题"},{"number":60,"stem":"重阳节的应景食品是( )。","options":[{"key":"A","text":"粽子"},{"key":"B","text":"重阳糕"},{"key":"C","text":"汤圆"},{"key":"D","text":"月饼"}],"answer":"B","keys":["B"],"explanation":"重阳节的习俗主要有登高、插茱萸、饮菊花酒等,应景食品是重阳糕。江南地区,持蟹赏菊也是重阳节的美事。A 项粽子、C 项汤圆、D 项月饼分别为端午节、元宵节、中秋节的应景食品。","type":"单选题"},{"number":61,"stem":"元宵耍灯起源于( )。","options":[{"key":"A","text":"宋代"},{"key":"B","text":"明代"},{"key":"C","text":"汉代"},{"key":"D","text":"唐代"}],"answer":"C","keys":["C"],"explanation":"元宵耍灯起源于汉代,每到元宵节,很多地方都要举行灯展。正月十五为每年第一个望月,称为上元节,也称元宵节,是春节活动的高潮和结束。","type":"单选题"},{"number":62,"stem":"花岗岩低山或丘陵地貌受球状风化作用,常形成巨大的( )造型。","options":[{"key":"A","text":"“石林”"},{"key":"B","text":"石瀑"},{"key":"C","text":"“石蛋”"},{"key":"D","text":"石笋"}],"answer":"C","keys":["C"],"explanation":"花岗岩低山或者丘陵,其特点是:高度小,起伏和缓,岩石表面受到球状风化作用,浑圆多姿,形成巨大的“石蛋”造型或浑圆多姿的巨石兀立形态。厦门鼓浪屿万石山、浙江普陀山、海南岛天涯海角等景区属于典型的花岗岩低山或名丘地貌。A 项“石林”属地表喀斯特景观;D项“石笋”属地下喀斯特洞穴景观;B项“石瀑”非花岗岩球状风化造型。","type":"单选题"},{"number":63,"stem":"历史上基督教有( )中国之说。","options":[{"key":"A","text":"五传"},{"key":"B","text":"二传"},{"key":"C","text":"三传"},{"key":"D","text":"四传"}],"answer":"D","keys":["D"],"explanation":"历史上有基督教四传中国之说。道教是土生土长的中国宗教,形成于东汉时期。","type":"单选题"},{"number":64,"stem":"被誉为“地球绿洲”“动植物基因库”的是( )。","options":[{"key":"A","text":"五台山"},{"key":"B","text":"普陀山"},{"key":"C","text":"九华山"},{"key":"D","text":"梵净山"}],"answer":"D","keys":["D"],"explanation":"梵净山被誉为“地球绿洲”“动植物基因库”“人类的宝贵遗产”,拥有以黔金丝猴等为代表的珍稀野生动植物及原生森林生态系统。梵净山得名于“梵天净土”,是西南地区佛教名山。A项五台山、B项普陀山、C项九华山均为佛教名山,但无“地球绿洲”“动植物基因库”之称。","type":"单选题"},{"number":65,"stem":"迄今世界上最大的水利枢纽工程是( )。","options":[{"key":"A","text":"葛洲坝水利工程"},{"key":"B","text":"三峡水利工程"},{"key":"C","text":"小浪底水利工程"},{"key":"D","text":"三门峡水利工程"}],"answer":"B","keys":["B"],"explanation":"三峡水利工程全称“长江三峡水利枢纽工程”,位于湖北省宜昌市夷陵区三斗坪镇,是我国治理、开发和保护长江的关键性骨干工程,也是迄今世界上最大的水利枢纽工程。可实现防洪、发电和航运三大效益。A 项葛洲坝水利工程是三线建设的伟大成果之一;C项小浪底、D项三门峡均非世界最大水利枢纽工程。","type":"单选题"},{"number":66,"stem":"马尔代夫的旅游业特色模式是( )。","options":[{"key":"A","text":"“一岛一农场”"},{"key":"B","text":"“一岛一度假村酒店”"},{"key":"C","text":"“一岛一赌场”"},{"key":"D","text":"“一岛一寺庙”"}],"answer":"B","keys":["B"],"explanation":"马尔代夫的旅游业是第一支柱产业,与船运业、渔业并列为三大经济支柱,特色模式为“一岛一度假村酒店”。马累是马尔代夫的首都,面积约 1.96平方千米,是世界上最小的首都之一。","type":"单选题"},{"number":67,"stem":"韩国的首都是( )。","options":[{"key":"A","text":"首尔"},{"key":"B","text":"仁川"},{"key":"C","text":"大邱"},{"key":"D","text":"釜山"}],"answer":"A","keys":["A"],"explanation":"首尔是韩国首都,韩国金融和商业中心,也是“世界经济实力最强的城市”之一。D 项釜山是韩国第二大城市和最大的港口城市,也是世界第五大集装箱港。","type":"单选题"},{"number":68,"stem":"古代帝王改年号称为( )。","options":[{"key":"A","text":"改元"},{"key":"B","text":"建元"},{"key":"C","text":"纪元"},{"key":"D","text":"纪年"}],"answer":"A","keys":["A"],"explanation":"改年号叫改元。改年号后新的年号从元年开始重新计数。西汉武帝时开始采用年号纪年,如汉武帝将即位的第一年(公元前 140 年)称为建元元年。B 项“建元”是汉武帝即位后第一个年号的名称,不是改年号的称谓。","type":"单选题"},{"number":69,"stem":"下列三线建设成果中,位于贵州的是( )。","options":[{"key":"A","text":"六盘水煤炭工业基地"},{"key":"B","text":"东风汽车公司"},{"key":"C","text":"酒泉卫星发射中心"},{"key":"D","text":"攀枝花钢铁基地"}],"answer":"A","keys":["A"],"explanation":"四川攀枝花钢铁基地、湖北东风汽车公司、甘肃酒泉卫星发射中心、贵州六盘水煤炭工业基地以及著名的葛洲坝水利工程,都是三线建设的伟大成果。B 项东风汽车公司位于湖北,C 项酒泉卫星发射中心位于甘肃,D 项攀枝花钢铁基地位于四川。","type":"单选题"},{"number":70,"stem":"长江干流所经省级行政区总共有( )个。","options":[{"key":"A","text":"9"},{"key":"B","text":"10"},{"key":"C","text":"11"},{"key":"D","text":"12"}],"answer":"C","keys":["C"],"explanation":"长江干流所经省级行政区总共有 11 个,自西至东依次为青海、四川、西藏、云南、重庆、湖北、湖南、江西、安徽、江苏和上海,奔入东海。","type":"单选题"},{"number":71,"stem":"欧洲最大的海港、荷兰第二大城市是( )。","options":[{"key":"A","text":"海牙"},{"key":"B","text":"乌得勒支"},{"key":"C","text":"阿姆斯特丹"},{"key":"D","text":"鹿特丹"}],"answer":"D","keys":["D"],"explanation":"鹿特丹是荷兰第二大城市、欧洲最大的海港。","type":"单选题"},{"number":72,"stem":"至今保存着中国最早人工种植七株茶树的皇茶园位于( )。","options":[{"key":"A","text":"浙江省杭州市狮峰山"},{"key":"B","text":"福建省武夷山市"},{"key":"C","text":"云南省普洱市"},{"key":"D","text":"四川省名山县蒙顶山"}],"answer":"D","keys":["D"],"explanation":"西汉时期开始茶叶种植,四川省名山县蒙顶山的皇茶园,至今保存着中国最早人工种植的七株茶树。","type":"单选题"},{"number":73,"stem":"以浙江越窑青瓷和河北邢窑白瓷为代表的隋唐瓷业,史称( )。","options":[{"key":"A","text":"“南青北白”"},{"key":"B","text":"“东青西白”"},{"key":"C","text":"“南红北白”"},{"key":"D","text":"“南白北青”"}],"answer":"A","keys":["A"],"explanation":"隋唐时期陶瓷业进入了迅猛发展的阶段,形成了以浙江越窑为代表的青瓷和以河北邢窑为代表的白瓷两大瓷窑系统,一般以 “南青北白”概称之。","type":"单选题"},{"number":74,"stem":"“左祖右社”中,“右社”指的是宫殿右前方设的( )。","options":[{"key":"A","text":"太庙"},{"key":"B","text":"社稷坛"},{"key":"C","text":"天坛"},{"key":"D","text":"地坛"}],"answer":"B","keys":["B"],"explanation":"“右社”——在宫殿右前方设社稷坛,社为土地神,稷为谷物神,社稷坛是帝王祭祀土地神、谷物神的地方。 “左祖”——在宫殿左前方设祖庙,是帝王祭祀祖先的地方,因为是天子的祖庙,故称太庙。A项太庙是“左祖”;C 项天坛是祭天场所,D项地坛是祭地场所。","type":"单选题"},{"number":75,"stem":"西双版纳野象谷是我国最大的( )聚集地。","options":[{"key":"A","text":"丹顶鹤"},{"key":"B","text":"亚洲象"},{"key":"C","text":"大熊猫"},{"key":"D","text":"金丝猴"}],"answer":"B","keys":["B"],"explanation":"西双版纳野象谷是我国最大的亚洲象聚集地。D 项金丝猴以梵净山黔金丝猴为代表;A项丹顶鹤、C 项大熊猫与西双版纳野象谷无关。","type":"单选题"},{"number":76,"stem":"粤菜对( )的烹制有独到之处。","options":[{"key":"A","text":"蛇"},{"key":"B","text":"鼠"},{"key":"C","text":"猫"},{"key":"D","text":"狗"}],"answer":"A","keys":["A"],"explanation":"广东各地对鱼虾、禽畜、野味烹制均有专长,尤其对“蛇”的制作有独到之处。粤菜历来以选料广博奇杂、菜肴新颖奇异而闻名全国,其口味清淡,重汤菜。粤菜由广府、客家、潮汕三种风味组成,以广府风味为代表。","type":"单选题"},{"number":77,"stem":"新中国成立后建成的第一条铁路是( )。","options":[{"key":"A","text":"青藏铁路"},{"key":"B","text":"宝成铁路"},{"key":"C","text":"成渝铁路"},{"key":"D","text":"成昆铁路"}],"answer":"C","keys":["C"],"explanation":"新中国成立后建成的第一条铁路是成渝铁路,全长 505公里,连通成都和重庆,1950 年开始建设,1952年 7月 1日建成通车,填补了西南地区铁路建设的空白。A 项青藏铁路、B 项宝成铁路、D 项成昆铁路建成均晚于成渝铁路。","type":"单选题"},{"number":78,"stem":"东汉时期,改进造纸法,造出“蔡侯纸”的是( )。","options":[{"key":"A","text":"沈括"},{"key":"B","text":"蔡伦"},{"key":"C","text":"毕昇"},{"key":"D","text":"张衡"}],"answer":"B","keys":["B"],"explanation":"造纸术萌芽于西汉,东汉时期,宦官蔡伦改进造纸法,造出质地细腻、便于书写的“蔡侯纸”。目前所能见到的最早的印刷品,是唐代印制的《金刚经》(868 年),叫雕版印刷。C项毕昇是北宋平民,发明活字印刷术;A项沈括是北宋科学家,编撰《梦溪笔谈》;D项张衡为东汉科学家,与造纸术无关。","type":"单选题"},{"number":79,"stem":"元明清三代被指定为皇室御用贡品,用于龙袍、凤衣及宫廷装饰的是( )。","options":[{"key":"A","text":"壮锦"},{"key":"B","text":"云锦"},{"key":"C","text":"蜀锦"},{"key":"D","text":"宋锦"}],"answer":"B","keys":["B"],"explanation":"元明清三代,云锦被指定为皇室御用贡品,用于龙袍、凤衣及宫廷装饰,三朝相继在南京设官办织造局。云锦因锦面色彩斑斓、美若云霞而得名,被专家称为“中国古代织锦工艺史上最后一座里程碑”。在中国众多锦中,南京云锦、四川蜀锦、苏州宋锦、广西壮锦并称“四大名锦”,分别代表宫廷皇家、汉唐丝路、文人雅士和少数民族四大文化体系。A 项壮锦代表少数民族文化体系、C 项蜀锦代表汉唐丝路、D 项宋锦代表文人雅士,均非元明清皇室御用贡品。","type":"单选题"},{"number":80,"stem":"被誉为“外交酒”的是( )。","options":[{"key":"A","text":"山西汾酒"},{"key":"B","text":"五粮液"},{"key":"C","text":"桂林三花酒"},{"key":"D","text":"贵州茅台酒"}],"answer":"D","keys":["D"],"explanation":"贵州茅台酒是酱香型酒的典型代表,还是许多重大外事活动的见证者,因而被誉为“外交酒”。 A 项山西汾酒是清香型酒的代表;B项五粮液酒是浓香型酒的代表;C 项桂林三花酒是米香型酒的代表。","type":"单选题"},{"number":81,"stem":"东汉擅今草、被尊为“草圣”的书法家是( )。","options":[{"key":"A","text":"王羲之"},{"key":"B","text":"张芝"},{"key":"C","text":"张旭"},{"key":"D","text":"怀素"}],"answer":"B","keys":["B"],"explanation":"草书名家有东汉张芝,擅今草;唐朝张旭和怀素,擅狂草,三人均有“草圣”之誉。A 项王羲之是东晋行书大家,被尊为“书圣”;C项张旭、D 项怀素是唐朝狂草名家,非东汉人。","type":"单选题"},{"number":82,"stem":"曾有“尺瓶寸盂视为无上之品,茗瓯酒盏叹为不世之珍”之说的是( )。","options":[{"key":"A","text":"雨点釉瓷"},{"key":"B","text":"青花瓷"},{"ke
