安全、旅游监督管理、旅游纠纷处理、法律责任、附则。","type":"单选题"},{"number":47,"stem":"根据《旅游法》的规定，利用公共资源建设的景区，不得通过增加另行收费项目等方式变相涨价；另行收费项目已收回投资成本的，（ ）。","options":[{"key":"A","text":"应当在涨价之前举行听证会"},{"key":"B","text":"应当实行政府定价"},{"key":"C","text":"应当免费开放"},{"key":"D","text":"应当相应降低价格或者取消收费"}],"answer":"D","keys":["D"],"explanation":"《旅游法》第 43条，利用公共资源建设的景区，不得通过增加另行收费项目等方式变相涨价；另行收费项目已收回投资成本的，应当相应降低价格或者取消收费。","type":"单选题"},{"number":48,"stem":"根据《旅游法》的规定，旅行社依照本法规定将包价旅游合同中的接待业务委托给地接社履行的，应当在包价旅游合同中载明（ ）的基本信息。","options":[{"key":"A","text":"委托社"},{"key":"B","text":"地接社"},{"key":"C","text":"委托社和地接社"},{"key":"D","text":"委托社或地接社"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 60 条第 2款规定：“旅行社依照本法规定将包价旅游合同中的接待业务委托给地接社履行，应当在包价旅游合同中载明地接社的基本信息。”因此，仅需载明地接社信息，而非委托社或两者皆载，故 B 项正确。","type":"单选题"},{"number":49,"stem":"根据《旅游法》的规定，旅游行程中解除合同的，旅行社应当协助旅游者返回出发地或者旅游者指定的合理地点。由于旅行社或者履行辅助人的原因导致合同解除的，返程费用由（ ）承担。","options":[{"key":"A","text":"旅游者"},{"key":"B","text":"旅行社"},{"key":"C","text":"履约辅助人"},{"key":"D","text":"旅行社或者履行辅助人"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 68 条规定：“旅游行程中解除合同的，旅行社应当协助旅游者返回出发地或者旅游者指定的合理地点。由于旅行社或者履行辅助人的原因导致合同解除的，返程费用由旅行社承担。”因此，B 项正确。旅游者只与旅行社有合同关系，因此即使履行辅助人（如地接社、酒店、车队）有过错，也应先由旅行社对外承担返程费用，再向辅助人追偿。","type":"单选题"},{"number":50,"stem":"依法负担被监护人抚养费、赡养费、扶养费的父母、子女、配偶等，在被人民法院撤销监护人资格后，关于其应当如何履行相关义务的说法，正确的是（ ）。","options":[{"key":"A","text":"无需再履行任何义务"},{"key":"B","text":"只需在被监护人提出要求时履行"},{"key":"C","text":"应当继续履行负担的义务"},{"key":"D","text":"可以选择性地履行部分义务"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 37 条规定，依法负担被监护人抚养费、赡养费、扶养费的父母、子女、配偶等，被人民法院撤销监护人资格后，应当继续履行负担的义务。","type":"单选题"},{"number":51,"stem":"根据《民法典》的规定，下列关于委托合同的说法，正确的是（ ）。","options":[{"key":"A","text":"委托人无法概括委托受托人处理一切事务"},{"key":"B","text":"委托人可以委托受托人处理多项事务"},{"key":"C","text":"委托人应当预付处理委托事务的费用，不得要求受托人为处理委托事务垫付费用"},{"key":"D","text":"受托人在处理委托事务时可以转委托，但需要及时告知委托人"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 920条规定，委托人可以特别委托受托人处理一项或者数项事务，也可以概括委托受托人处理一切事务。第 921条委托人应当预付处理委托事务的费用。受托人为处理委托事务垫付的必要费用，委托人应当偿还该费用并支付利息。第 923 条受托人应当亲自处理委托事务。经委托人同意，受托人可以转委托。","type":"单选题"},{"number":52,"stem":"根据《民法典》的规定，以下关于自甘风险的说法，正确的是（ ）。","options":[{"key":"A","text":"参加具有一定风险的文体活动，因其他参加者的行为受到损害的，受害人不得请求其他参加者承担侵权责任"},{"key":"B","text":"自甘风险参加的文体活动，因其他参加者的行为受到损害的，受害人可以请求其他参加者承担侵权责任"},{"key":"C","text":"自甘风险参加的文体活动，因其他参加者的故意行为受到损害的，受害人可以请求其他参加者承担侵权责任"},{"key":"D","text":"自甘风险参加的文体活动，因其他参加者的过失受到损害的，受害人可以请求其他参加者承担侵权责任"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 1176条，自愿参加具有一定风险的文体活动，因其他参加者的行为受到损害的，受害人不得请求其他参加者承担侵权责任；但是，其他参加者对损害的发生有故意或者重大过失的除外。","type":"单选题"},{"number":53,"stem":"根据《民法典》的规定，下列关于民事行为能力的说法，正确的是（ ）。","options":[{"key":"A","text":"6周岁以上的未成年人为限制民事行为能力人"},{"key":"B","text":"14周岁以上的未成年人可以视为完全民事行为能力人"},{"key":"C","text":"不满 8 周岁的未成年人为无民事行为能力人"},{"key":"D","text":"16周岁以上，以自己的收入作为主要生活来源为完全民事行为能力人"}],"answer":"C","keys":["C"],"explanation":"A 项错误：6 周岁以上的未成年人为限制民事行为能力人。法律规定的限制民事行为能力人最低年龄是 8周岁，不是 6周岁。6周岁以下属于无民事行为能力人。B 项错误：14周岁以上的未成年人可以视为完全民事行为能力人。“视为完全民事行为能力人”需要同时满足两个条件：1.年满 16周岁；2.以自己的劳动收入为主要生活来源。14周岁不满足年龄条件，也不能“视为完全”。C 项正确：不满 8 周岁的未成年人为无民事行为能力人。完全符合《民法典》第 20 条规定：不满 8 周岁的未成年人为无民事行为能力人。D 项错误：1.年满 16周岁；2.以自己的劳动收入为主要生活来源。仅“视为”完全民事行为能力人。","type":"单选题"},{"number":54,"stem":"根据《民法典》的规定，下列民事法律行为无效的是（ ）。","options":[{"key":"A","text":"以虚假的意思表示实施的民事法律行为"},{"key":"B","text":"基于重大误解实施的民事法律行为"},{"key":"C","text":"以胁迫手段，使对方在违背真实意思的情况下实施的民事法律行为"},{"key":"D","text":"成立时显失公平的民事法律行为"}],"answer":"A","keys":["A"],"explanation":"A 项正确：《民法典》第 146 条第 1 款规定：“行为人与相对人以虚假的意思表示实施的民事法律行为无效。”这是明确的无效事由。","type":"单选题"},{"number":55,"stem":"根据《民法典》的规定，以下关于合同转让和转移的说法，正确的是（ ）。","options":[{"key":"A","text":"合同的转让是合同内容的变更，合同的主体并不发生变化"},{"key":"B","text":"债务人将合同的义务全部或者部分转移给第三人的，应当通知债权人"},{"key":"C","text":"当事人一方经对方同意，可以将自己在合同中的权利和义务一并移转给第三人"},{"key":"D","text":"法人合并的，其权利和义务由原法人享有和承担"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 555条规定：“当事人一方经对方同意，可以将自己在合同中的权利和义务一并转让给第三人。”故 C 项正确。","type":"单选题"},{"number":56,"stem":"根据《旅行社条例》及《旅游法》的规定，申请设立旅行社时，申请者如果租用营业用房的，租期应不少于（ ）。","options":[{"key":"A","text":"一个月"},{"key":"B","text":"三个月"},{"key":"C","text":"一年"},{"key":"D","text":"两年"}],"answer":"C","keys":["C"],"explanation":"根据《旅行社条例》及《旅游法》规定，申请设立旅行社申请者拥有产权的营业用房，或者申请者租用的、租期不少于 1年的营业用房。","type":"单选题"},{"number":57,"stem":"《旅游法》规定，旅游行程中解除合同的，旅行社应当协助旅游者返回出发地或者旅游者指定的合理地点。由于旅行社或者履行辅助人的原因导致合同解除的，返程费用由（ ）。","options":[{"key":"A","text":"旅游者承担"},{"key":"B","text":"旅行社承担"},{"key":"C","text":"双方分担"},{"key":"D","text":"旅游者和旅行社协商承担"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 68条规定，旅游行程中解除合同的，旅行社应当协助旅游者返回出发地或者旅游者指定的合理地点。由于旅行社或者履行辅助人的原因导致合同解除的，返程费用由旅行社承担。","type":"单选题"},{"number":58,"stem":"在线旅游经营服务违法行为由实施违法行为的经营者住所地县级以上文化和旅游主管部门管辖。不能确定经营者住所地的，由经营者注册登记地或者备案地、（ ）县级以上文化和旅游主管部门管辖。","options":[{"key":"A","text":"损害行为发生地"},{"key":"B","text":"被投诉人所在地"},{"key":"C","text":"旅游合同签订地"},{"key":"D","text":"旅游合同履行地"}],"answer":"D","keys":["D"],"explanation":"《在线旅游经营服务管理暂行规定》第 25条规定，在线旅游经营服务违法行为由实施违法行为的经营者住所地县级以上文化和旅游主管部门管辖。不能确定经营者住所地的，由经营者注册登记地或者备案地、旅游合同履行地县级以上文化和旅游主管部门管辖。","type":"单选题"},{"number":59,"stem":"《文化和旅游市场信用管理规定》规定，旅行社因侵犯旅游者合法权益受到罚款以上行政处罚而被认定为严重失信主体的，自处罚之日起（ ）内不得申请出境旅游业务。","options":[{"key":"A","text":"5年"},{"key":"B","text":"3年"},{"key":"C","text":"2年"},{"key":"D","text":"1年"}],"answer":"C","keys":["C"],"explanation":"旅行社因侵犯旅游者合法权益受到罚款以上行政处罚而被认定为严重失信主体的，自处罚之日起 2 年内不得申请出境旅游业务。第 19条规定，文化和旅游主管部门对旅游市场严重失信主体实施下列管理措施：①适当提高抽查比例和频次，纳入重点监管对象；②将失信信息提供给有关部门查询，供其在相关行政管理、公共服务、评优评先等活动中参考使用；③将失信信息提供给各类市场主体查询，供其在市场活动中参考使用；④旅行社因被吊销旅行社业务经营许可证而被认定为严重失信主体的，其主要负责人 5 年内不得担任任何旅行社的主要负责人；⑤导游、领队因被吊销导游证而被认定为严重失信主体的，旅行社有关管理人员因旅行社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起3年内不得重新申请导游证或者从事旅行社业务；⑥旅行社因侵犯旅游者合法权益受到罚款以上行政处罚而被认定为严重失信主体的，自处罚之日起 2年内不得申请出境旅游业务；⑦法律、行政法规和党中央、国务院政策文件规定的其他管理措施。","type":"单选题"},{"number":60,"stem":"根据《旅行社服务质量赔偿标准》的规定，甲旅行社未经旅游者同意，擅自将旅游者与乙旅行社的旅游者拼团，并由乙旅行社组团，则甲旅行社应当向旅游者支付旅游费用总额（ ）的违约金。","options":[{"key":"A","text":"15%"},{"key":"B","text":"20%"},{"key":"C","text":"25%"},{"key":"D","text":"30%"}],"answer":"C","keys":["C"],"explanation":"《旅行社服务质量赔偿标准》第 5条规定：“未经旅游者签字确认，旅行社擅自将旅游者转团、拼团的，旅行社应当向旅游者支付旅游费用总额 25%的违约金。”C项正确：擅自拼团属于严重违约行为，直接损害旅游者对原旅行社的信任和服务预期，故设定 25%的较高违约金以示惩戒。","type":"单选题"},{"number":61,"stem":"《导游管理办法》规定，我国领队管理由资格准入制改为（ ）管理制度，旅游主管部门不再对领队从业进行行政审批。","options":[{"key":"A","text":"注册"},{"key":"B","text":"登记"},{"key":"C","text":"资格审查"},{"key":"D","text":"备案"}],"answer":"D","keys":["D"],"explanation":"《导游管理办法》第 25条规定，具备领队条件的导游从事领队业务，不再实行资格审批，改为由旅行社将符合条件的领队信息通过全国旅游监管服务信息系统向旅游主管部门“备案”。这意味着旅游主管部门不再进行事前审批，转为事后监管，体现了“放管服”改革精神。D项正确：“备案”是现行法定管理制度，由旅行社履行报备义务。","type":"单选题"},{"number":62,"stem":"根据《导游管理办法》的规定，导游申请变更导游证信息，应当在变更发生的（ ）个工作日内，通过全国旅游监管服务信息系统提交相应材料。","options":[{"key":"A","text":"3"},{"key":"B","text":"5"},{"key":"C","text":"10"},{"key":"D","text":"15"}],"answer":"C","keys":["C"],"explanation":"《导游管理办法》第 15条第 1 款规定：“导游应当自下列情形发生之日起 10个工作日内，通过全国旅游监管服务信息系统提交相应材料，申请变更导游证信息。”这是法定时限，逾期可能影响执业。C 项正确：完全符合“10 个工作日内”的法律规定。","type":"单选题"},{"number":63,"stem":"根据《导游管理办法》的规定，下列情形中，不得颁发导游证的是（ ）。","options":[{"key":"A","text":"因过失犯罪受过刑事处罚，且刑罚执行完毕未满 3年的"},{"key":"B","text":"患有高血压"},{"key":"C","text":"被吊销导游证之日起未满 2年的"},{"key":"D","text":"考取导游资格证的 17 岁公民，以自己的收入作为主要生活来源"}],"answer":"C","keys":["C"],"explanation":"根据《导游管理办法》第 12 条规定，具有下列情形的，不予核发导游证：(1)无民事行为能力或者限制民事行为能力的；(2)患有甲类、乙类以及其他可能危害旅游者人身健康安全的传染性疾病的；(3)受过刑事处罚的，过失犯罪的除外；(4)被吊销导游证之日起未逾 3 年的。A 项过失犯罪，法律明确排除，可以发证。B 项高血压不属于传染性疾病，可以发证。C项吊销导游证未满 2年，属于法定不予发证情形，正确；D 项 17周岁，以自己劳动收入为主要生活来源，《民法典》视为完全民事行为能力人，可以发证。","type":"单选题"},{"number":64,"stem":"《导游人员管理条例》规定，导游进行导游活动，（ ）的，由旅游行政部门责令改正，处1000元以上 3 万元以下的罚款；有违法所得的，并处没收违法所得。","options":[{"key":"A","text":"有损害国家利益和民族尊严的言行"},{"key":"B","text":"向旅游者兜售物品"},{"key":"C","text":"擅自变更接待计划"},{"key":"D","text":"未作明确说明和警示"}],"answer":"B","keys":["B"],"explanation":"《导游人员管理条例》第 23条，导游人员进行导游活动，向旅游者兜售物品、由旅游行政部门责令改正，处 1000元以上 3 万元以下的罚款；有违法所得的，并处没收违法所得；情节严重的，由省、自治区、直辖市人民政府旅游行政部门吊销导游证并予以公告。","type":"单选题"},{"number":65,"stem":"经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权依法退货，经营者应当依法返还消费者支付的商品价款。如果退回的商品存在质量问题，则退回商品的运费由（ ）承担。","options":[{"key":"A","text":"经营者与消费者分担"},{"key":"B","text":"经营者或消费者承担"},{"key":"C","text":"消费者承担"},{"key":"D","text":"经营者承担"}],"answer":"D","keys":["D"],"explanation":"《消费者权益保护法》第 25条经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起 7 日内退货，且无需说明理由，但下列商品除外：(1)消费者定作的；(2)鲜活易腐的；(3)在线下载或者消费者拆封的音像制品、计算机软件等数字化商品；(4)交付的报纸、期刊。消费者退货的商品应当完好。经营者应当自收到退回商品之日起 7 日内返还消费者支付的商品价款。退回商品的运费由消费者承担；经营者和消费者另有约定的，按照约定。本题题干说明“存在质量问题”，存在质量问题的话由经营者承担退回运费。做题时可结合生活实际进行。","type":"单选题"},{"number":66,"stem":"根据《治安管理处罚法》的规定，以下属于扰乱公共秩序的行为是（ ）。","options":[{"key":"A","text":"公共场所违反安全规定拒不改正"},{"key":"B","text":"在使用中的航空器上使用可能影响导航系统正常功能的工具，不听劝阻"},{"key":"C","text":"非法强登机动车，影响交通工具正常行驶的"},{"key":"D","text":"在铁路线路上放置障碍物或者故意向列车投掷物品"}],"answer":"C","keys":["C"],"explanation":"根据《治安管理处罚法》的规定，其余三项属于“妨害公共安全的行为”。","type":"单选题"},{"number":67,"stem":"根据《旅游投诉处理办法》第 16条的规定，对于情况复杂的投诉，被投诉人应当在接到通知之日起（ ）个工作日以内作出书面答复，提出事实、理由和答辩意见。","options":[{"key":"A","text":"3"},{"key":"B","text":"5"},{"key":"C","text":"7"},{"key":"D","text":"10"}],"answer":"B","keys":["B"],"explanation":"《旅游投诉处理办法》第 16 条规定：“旅游投诉处理机构受理旅游投诉后，应当按照以下方式进行处理：(一)对于事实清楚的，应当立即调解并记录情况；(二)对于情况复杂的，应当填写《旅游投诉处理通知书》，与有关投诉材料副本一并送达被投诉人；被投诉人应当在接到通知之日起五个工作日以内作出书面答复，提出事实、理由和答辩意见。”","type":"单选题"},{"number":68,"stem":"《旅游投诉处理办法》规定，投诉人（ ）人以上，以同一事由投诉同一被投诉人的，为共同投诉。","options":[{"key":"A","text":"2人"},{"key":"B","text":"4人"},{"key":"C","text":"5人"},{"key":"D","text":"10人"}],"answer":"B","keys":["B"],"explanation":"《旅游投诉处理办法》第 14条规定，投诉人 4人以上，以同一事由投诉同一被投诉人的，为共同投诉。","type":"单选题"},{"number":69,"stem":"根据《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》，下列属于旅游经营者、旅游辅助服务者不予免责情形的是（ ）。","options":[{"key":"A","text":"旅游者自行安排旅游活动期间旅行社未做必要提示"},{"key":"B","text":"旅游者未履行如实告知义务的"},{"key":"C","text":"因不可抗力等客观原因导致旅游合同无法履行的"},{"key":"D","text":"旅游者擅自脱团的"}],"answer":"A","keys":["A"],"explanation":"《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》第 19条规定，旅游者在自行安排活动期间遭受人身损害、财产损失，旅游经营者未尽到必要的提示义务、救助义务，旅游者请求旅游经营者承担相应责任的，人民法院应予支持。","type":"单选题"},{"number":70,"stem":"旅游投诉的主体是（ ）。","options":[{"key":"A","text":"景区"},{"key":"B","text":"旅游者"},{"key":"C","text":"旅行社"},{"key":"D","text":"旅游行政管理机关"}],"answer":"B","keys":["B"],"explanation":"旅游投诉的主体只能是旅游者。","type":"单选题"},{"number":71,"stem":"旅行社及其从业人员发现履行辅助人提供的服务不符合法律、法规规定或者存在安全隐患的，应当（ ）。","options":[{"key":"A","text":"向有关部门投诉"},{"key":"B","text":"要求其承担相应责任"},{"key":"C","text":"报告旅游行政管理部门"},{"key":"D","text":"予以制止或者更换"}],"answer":"D","keys":["D"],"explanation":"旅行社及其从业人员发现履行辅助人提供的服务不符合法律、法规规定或者存在安全隐患的，应当予以制止或者更换。","type":"单选题"},{"number":72,"stem":"《旅游安全管理办法》规定，（ ）应当承担旅游安全的主体责任，加强安全管理，建立、健全安全管理制度，关注安全风险预警和提示，妥善应对旅游突发事件。","options":[{"key":"A","text":"旅游经营者"},{"key":"B","text":"旅游主管部门"},{"key":"C","text":"县级以上人民政府"},{"key":"D","text":"国务院"}],"answer":"A","keys":["A"],"explanation":"《旅游安全管理办法》第 4 条规定，旅游经营者应当承担旅游安全的主体责任，加强安全管理，建立、健全安全管理制度，关注安全风险预警和提示，妥善应对旅游突发事件。","type":"单选题"},{"number":73,"stem":"依据《突发事件应对法》的规定，自然灾害、事故灾难或者公共卫生事件发生后，履行统一领导职责的人民政府可以采取下列应急处置措施（ ）。","options":[{"key":"A","text":"限制有关公共场所内的活动"},{"key":"B","text":"立即抢修被损坏的交通供热等公共设施"},{"key":"C","text":"加强对易受冲击的核心机关和单位的警卫"},{"key":"D","text":"对特定区域内的建筑物、交通工具等供应进行控制"}],"answer":"B","keys":["B"],"explanation":"其余三项属于社会安全事件的应急处置措施。","type":"单选题"},{"number":74,"stem":"旅行社责任保险的赔偿责任承担者、被保险人和受益人分别是（ ）。","options":[{"key":"A","text":"旅行社、旅行社、旅行社"},{"key":"B","text":"保险公司、旅行社、旅游者"},{"key":"C","text":"保险公司、旅行社、旅行社"},{"key":"D","text":"旅行社、旅行社、旅游者"}],"answer":"C","keys":["C"],"explanation":"旅行社责任保险主要包含以下 4 个特征：属于强制保险；是财产保险；投保人和被保险人是旅行社；保险人是保险公司，赔偿的承担者是承保的保险公司。","type":"单选题"},{"number":75,"stem":"根据《中华人民共和国民用航空法》的规定，承运人承认货物已经遗失，或者货物在应当到达之日起（ ）日后仍未到达的，收货人有权依据航空货物运输合同向承运人主张权利。","options":[{"key":"A","text":"7"},{"key":"B","text":"14"},{"key":"C","text":"21"},{"key":"D","text":"30"}],"answer":"A","keys":["A"],"explanation":"第 124条，承运人承认货物已经遗失，或者货物在应当到达之日起七日后仍未到达的，收货人有权依据航空货物运输合同向承运人主张权利。A 项正确，该期限为 7 日。B 项错误，14 日是货物发生损失后提出书面异议的期限。C 项错误，21 日是托运行李或者货物发生延误后提出异议的期限。D 项错误，30日不符合法律规定。","type":"单选题"},{"number":76,"stem":"根据《出境入境管理法》的规定，冒用他人护照出境入境，情节严重的，（ ）。","options":[{"key":"A","text":"处 5日以上 10日以下拘留，可以并处 1000元以上 5000元以下罚款"},{"key":"B","text":"处 5日以上 15日以下拘留，可以并处 1000元以上 5000元以下罚款"},{"key":"C","text":"处 5日以上 10日以下拘留，可以并处 2000元以上 1 万元以下罚款"},{"key":"D","text":"处 5日以上 15日以下拘留，可以并处 2000元以上 1 万元以下罚款"}],"answer":"C","keys":["C"],"explanation":"《出境入境管理法》第 71条规定，有下列行为之一的，处 1000元以上 5000元以下罚款；情节严重的，处 5 日以上 10 日以下拘留，可以并处 2000元以上 1万元以下罚款：①持用伪造、变造、骗取的出境入境证件出境入境的；②冒用他人出境入境证件出境入境的；③逃避出境入境边防检查的；④以其他方式非法出境入境的。","type":"单选题"},{"number":77,"stem":"《娱乐场所管理条例》规定，娱乐场所改建、扩建营业场所或者变更场地、主要设施设备、投资人员，或者变更娱乐经营许可证载明的事项的，应当向原发证机关申请重新核发娱乐经营许可证，并向（ ）备案。","options":[{"key":"A","text":"人民政府"},{"key":"B","text":"公安部门"},{"key":"C","text":"市场监督管理部门"},{"key":"D","text":"文化主管部门"}],"answer":"B","keys":["B"],"explanation":"本题考查娱乐场所重大变更后的备案机关。B 项正确：《娱乐场所管理条例》第 12条规定：“娱乐场所改建、扩建营业场所或者变更场地、主要设施设备、投资人员，或者变更娱乐经营许可证载明的事项的，应当向原发证机关申请重新核发娱乐经营许可证，并向公安部门备案；需要办理变更登记的，应当依法向工商行政管理部门办理变更登记。”变更涉及场所结构、人员、设备等，可能影响治安与消防，故须向公安报备。","type":"单选题"},{"number":78,"stem":"依据《娱乐场所管理办法》的规定，娱乐场所设立申请公示期为（ ）。","options":[{"key":"A","text":"5日"},{"key":"B","text":"10日"},{"key":"C","text":"15日"},{"key":"D","text":"20日"}],"answer":"B","keys":["B"],"explanation":"本题考查娱乐场所设立的公示期限。B 项正确：《娱乐场所管理办法》第 12 条规定：“文化和旅游主管部门受理申请后，应当对设立场所的位置、周边环境、面积等进行实地检查。符合条件的，应当在设立场所、文化和旅游主管部门办公场所显著位置向社会公示 10日，并依法组织听证。”公示旨在听取周边利害关系人意见，保障公众参与权。","type":"单选题"},{"number":79,"stem":"根据《风景名胜区条例》的规定，在景物、设施上刻划、涂污或者乱扔垃圾的，条例规定的罚款金额为（ ）。","options":[{"key":"A","text":"50元"},{"key":"B","text":"100元"},{"key":"C","text":"500元"},{"key":"D","text":"1000元"}],"answer":"A","keys":["A"],"explanation":"《风景名胜区条例》第四十四条：违反本条例的规定，在景物、设施上刻划、涂污或者在风景名胜区内乱扔垃圾的，由风景名胜区管理机构责令恢复原状或者采取其他补救措施，处 50元的罚款；刻划、涂污或者以其他方式故意损坏国家保护的文物、名胜古迹的，按照治安管理处罚法的有关规定予以处罚；构成犯罪的，依法追究刑事责任。A项正确，符合条例第四十四条处 50 元罚款的规定。B 项错误，100 元属于干扰数值，条例对该行为没有此处罚标准。C 项错误，500元没有本条法律依据。D 项错误，1000 元是个人开荒、修坟立碑行为的处罚下限，依据条例第四十三条。","type":"单选题"},{"number":80,"stem":"博物馆举办陈列展览的，应当在陈列展览开始之日（ ）个工作日前，将陈列展览主题、展品说明、讲解词等向陈列展览举办地的文物主管部门或者其他有关部门备案。","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"15"},{"key":"D","text":"30"}],"answer":"B","keys":["B"],"explanation":"《博物馆条例》第 31 条规定，博物馆举办陈列展览的，应当在陈列展览开始之日10 个工作日前，将陈列展览主题、展品说明、讲解词等向陈列展览举办地的文物主管部门或者其他有关部门备案。","type":"单选题"},{"number":81,"stem":"不可移动文物根据（ ），可以分为全国重点、省级、市县级文物保护单位。","options":[{"key":"A","text":"历史、艺术和科学价值"},{"key":"B","text":"历史、艺术和文化价值"},{"key":"C","text":"观赏、文化和科学价值"},{"key":"D","text":"观赏、文化和历史价值"}],"answer":"A","keys":["A"],"explanation":"《文物保护法》第 3条规定，古文化遗址、古墓葬、古建筑、石窟寺、石刻、壁画、近代现代重要史迹和代表性建筑等不可移动文物，根据它们的历史、艺术、科学价值，可以分别确定为全国重点文物保护单位，省级文物保护单位，市、县级文物保护单位。","type":"单选题"},{"number":82,"stem":"中国特色社会主义最本质的特征是（ ）。","options":[{"key":"A","text":"人民民主专政"},{"key":"B","text":"坚持以人为本"},{"key":"C","text":"中国共产党领导"},{"key":"D","text":"集中统一领导"}],"answer":"C","keys":["C"],"explanation":"全面加强党的领导，明确中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导。","type":"单选题"},{"number":83,"stem":"依据习近平新时代中国特色社会主义思想相关理论，全面推进依法治国总目标是（ ）。","options":[{"key":"A","text":"推进国家治理体系和治理能力现代化"},{"key":"B","text":"完善以宪法为核心的社会主义道德规范体系"},{"key":"C","text":"建设中国特色社会主义法治体系、建设社会主义法治国家"},{"key":"D","text":"发展全过程人民民主，实现全体人民同步富裕"}],"answer":"C","keys":["C"],"explanation":"明确全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。A 项错误，推进国家治理体系和治理能力现代化是全面深化改革总目标的组成部分，并非依法治国总目标。B项错误，应当是完善以宪法为核心的中国特色社会主义法律体系，不是道德规范体系。C 项正确。D项错误，要推动全体人民共同富裕，不是同步富裕，且不属于依法治国总目标。","type":"单选题"},{"number":84,"stem":"根据《英烈保护法》的规定，烈士纪念日是每年的（ ）。","options":[{"key":"A","text":"9月 1 日"},{"key":"B","text":"9月 15 日"},{"key":"C","text":"9月 30 日"},{"key":"D","text":"10月 30日"}],"answer":"C","keys":["C"],"explanation":"《英烈法》第 5条规定，每年 9 月 30日为烈士纪念日，国家在首都北京天安门广场人民英雄纪念碑前举行纪念仪式，缅怀英雄烈士。","type":"单选题"},{"number":85,"stem":"《港区国安法》规定，任何人组织、策划、实施或者参与实施（ ）之一的，不论是否使用武力或者以武力相威胁，即属犯分裂国家罪。","options":[{"key":"A","text":"以威胁旨在颠覆国家政权行为"},{"key":"B","text":"以武力旨在颠覆国家政权行为"},{"key":"C","text":"造成严重社会危害的恐怖活动"},{"key":"D","text":"旨在破坏国家统一行为"}],"answer":"D","keys":["D"],"explanation":"《港区国安法》第 20条对“分裂国家罪”的规定：任何人组织、策划、实施或者参与实施旨在分裂国家、破坏国家统一行为的，不论是否使用武力或者以武力相威胁，即属犯罪。","type":"单选题"},{"number":86,"stem":"坚持和完善社会主义基本经济制度，充分发挥（ ）在资源配置中的决定性作用。","options":[{"key":"A","text":"政府"},{"key":"B","text":"市场"},{"key":"C","text":"国家"},{"key":"D","text":"人民"}],"answer":"B","keys":["B"],"explanation":"坚持市场主导。尊重人民首创精神，充分发挥市场在资源配置中的决定性作用。","type":"单选题"},{"number":87,"stem":"1974年，经国务院批准，（ ）成立。","options":[{"key":"A","text":"中国旅行社"},{"key":"B","text":"中国国际旅行社"},{"key":"C","text":"中国青年旅行社"},{"key":"D","text":"华侨服务社"}],"answer":"A","keys":["A"],"explanation":"1974年 1 月 3 日：经国务院批准，中国旅行社成立，与华侨旅行社合署办公。","type":"单选题"},{"number":88,"stem":"地陪要注意游客安全，下列选项中说法正确的是（ ）。","options":[{"key":"A","text":"在景点导游讲解中，给游客留足自己活动的空间和时间"},{"key":"B","text":"地陪要与领队、全陪密切配合，随时清点人数"},{"key":"C","text":"为避免被盗窃，地陪要经常提醒游客把贵重物品拿出来清点"},{"key":"D","text":"地陪应提醒全陪时刻观察周围的环境和注意游客动向"}],"answer":"B","keys":["B"],"explanation":"（1）观察环境与游客动向：在景点导游讲解中，地陪应时刻观察周围的环境和注意游客的动向。（2）清点人数（防走失）：为防止游客走失，地陪要与入境领队、全陪密切配合，随时清点人数。（3）提高警惕与安全提醒（防治安事件）：为防止游客发生意外事故，地陪还应注意和提醒游客在游览中提高警惕，防止小偷小摸等治安事件发生。","type":"单选题"},{"number":89,"stem":"旅行出现问题后，导游通过摆事实、讲道理、分清利弊得失，直至说服旅游者，这是（ ）的应用。","options":[{"key":"A","text":"正面引导法"},{"key":"B","text":"侧面迂回法"},{"key":"C","text":"间接暗示法"},{"key":"D","text":"替代方案法"}],"answer":"A","keys":["A"],"explanation":"正面引导法：问题出现后，导游通过摆事实、讲道理、分清利弊得失，层层分析推进，直至说服旅游者。正面劝慰旅游者需要导游具备足够的耐心，善于从旅游者立场看待问题，同时配合旅行社做好因改变行程带来的一系列协调工作。","type":"单选题"},{"number":90,"stem":"在朱自清的《背影》中，作者通过使用“戴”“穿”“蹒跚走”等一系列动词，细腻地描绘出父爱，令人难以忘怀。这段描写是修辞生动性中（ ）的呈现。","options":[{"key":"A","text":"细节化"},{"key":"B","text":"情节化"},{"key":"C","text":"修辞化"},{"key":"D","text":"比拟化"}],"answer":"A","keys":["A"],"explanation":"细节化：绘声绘色的语言能够让人有身临其境之感，将抽象的事物具体化，无形的事物有形化。要达到这一效果，导游需要善于运用动词来捕捉和放大细节。例如在朱自清的《背影》中，作者通过使用“戴”“穿”“蹒跚走”“探身”“攀”“缩”“微倾”等一系列动词，细腻地描绘出父亲穿过铁道、爬上月台的感人场景，父爱在文字中得到了生动地展现，令人难以忘怀。","type":"单选题"},{"number":91,"stem":"“这里的葡萄，一颗就有乒乓球那么大”，这是修辞方法中的（ ）手法的运用。","options":[{"key":"A","text":"夸张"},{"key":"B","text":"比拟"},{"key":"C","text":"比喻"},{"key":"D","text":"对比"}],"answer":"A","keys":["A"],"explanation":"普通类夸张：又可细分为扩大夸张和缩小夸张。例如：“这里的葡萄，一颗就有乒乓球那么大”，通过扩大葡萄大小的夸张手法，生动形象地展现了当地葡萄的硕大，使游客在尚未亲身体验之前就能对当地葡萄的大小有深刻的了解。","type":"单选题"},{"number":92,"stem":"北京位于（ ）。","options":[{"key":"A","text":"东八区"},{"key":"B","text":"西八区"},{"key":"C","text":"东五区"},{"key":"D","text":"东九区"}],"answer":"A","keys":["A"],"explanation":"北京位于东经 116°24′，划在东 8区，该区的中央经线为东经 120°。","type":"单选题"},{"number":93,"stem":"托马斯·库克父子旅行社成立于（ ）。","options":[{"key":"A","text":"1841年"},{"key":"B","text":"1845年"},{"key":"C","text":"1846年"},{"key":"D","text":"1865年"}],"answer":"D","keys":["D"],"explanation":"1865年，旅行社的全球化发展更名为“托马斯·库克父子公司”，迁址至伦敦。","type":"单选题"},{"number":94,"stem":"1994年，国家旅游局开始（ ）。","options":[{"key":"A","text":"组织导游资格证考试"},{"key":"B","text":"正式局成立"},{"key":"C","text":"开始将导游分为初级、中级、高级、特级四个等级"},{"key":"D","text":"开始允许中国公民自费出国旅行"}],"answer":"C","keys":["C"],"explanation":"1994年：国家旅游局设初级、中级、高级、特级四个等级。","type":"单选题"},{"number":95,"stem":"导游独立宣传和执行国家政策，独立执行旅游计划、组织活动，这是导游服务（ ）的特点体现。","options":[{"key":"A","text":"工作独立性强"},{"key":"B","text":"脑体高度结合"},{"key":"C","text":"客观情况复杂"},{"key":"D","text":"文化交流频繁"}],"answer":"A","keys":["A"],"explanation":"独立性表现：独立宣传和执行国家政策；独立执行旅游计划、组织活动；独立、正确、及时处理问题。","type":"单选题"},{"number":96,"stem":"关于导游领队岗位的描述，内容正确的是（ ）。","options":[{"key":"A","text":"文化和旅游都对领队实行考试录取制"},{"key":"B","text":"领队在带领游客出境前，与旅行社签订临时劳动合同"},{"key":"C","text":"从事领队业务的人员，应当取得导游资格证"},{"key":"D","text":"旅行社委派的领队应当掌握相关旅游目的地国家语言或英语"}],"answer":"D","keys":["D"],"explanation":"文化和旅游部对领队实行备案管理制。从事领队业务的人员，应当取得导游证，具有相应的学历、语言能力和旅游从业经历，并与委派其从事领队业务的取得出境旅游业务经营许可的旅行社订立劳动合同。旅行社委派的领队应当掌握相关旅游目的地国家（地区）语言或英语。","type":"单选题"},{"number":97,"stem":"中级、高级导游等级考核原则上采取笔试形式，每（ ）开展一次。","options":[{"key":"A","text":"1年"},{"key":"B","text":"2年"},{"key":"C","text":"3年"},{"key":"D","text":"4年"}],"answer":"B","keys":["B"],"explanation":"中级、高级导游等级考核，原则上采取笔试形式，每 2 年开展一次。","type":"单选题"},{"number":98,"stem":"下列选项中，按照使用的语言划分的是（ ）。","options":[{"key":"A","text":"外语导游"},{"key":"B","text":"专职导游"},{"key":"C","text":"领队导游"},{"key":"D","text":"高级导游"}],"answer":"A","keys":["A"],"explanation":"按照使用的语言划分，我国导游分为中文导游和外语导游。","type":"单选题"},{"number":99,"stem":"下列选项中，能够展示导游良好形象的内容是（ ）。","options":[{"key":"A","text":"带团头发被吹乱后，可以当众梳头，及时整理形象"},{"key":"B","text":"带团可以涂抹有色指甲油，但是不可以留长指甲"},{"key":"C","text":"带团女导游不可以化妆，更别说浓妆艳抹"},{"key":"D","text":"带团必要时可食用口香糖或茶叶来减少口腔异味"}],"answer":"D","keys":["D"],"explanation":"头发清洁整齐：注意经常梳洗，不存有头屑，长短适宜，不梳怪异发型；头发被吹乱后，应及时梳理，但不可当众梳头，以免失礼；牙齿洁净：必要时可食用口香糖或茶叶来减少口腔异味；妆容适宜：女士为保持面容光泽，女士可施淡妆，但不要浓妆，不当众化妆或补妆；手部清洁：不涂抹有色指甲油。","type":"单选题"},{"number":100,"stem":"（ ）属于地陪导游熟悉接待计划的内容。","options":[{"key":"A","text":"核对日程安排"},{"key":"B","text":"与全陪联系"},{"key":"C","text":"了解不熟悉的参观旅游点"},{"key":"D","text":"了解旅游团成员基本情况"}],"answer":"D","keys":["D"],"explanation":"熟悉接待计划：旅游团概况；旅游团成员基本情况；旅游线路和交通工具；交通票据。所以选择 D。","type":"单选题"},{"number":101,"stem":"关于导游旗的使用方法，正确的是（ ）。","options":[{"key":"A","text":"可以悬挂造型奇异的挂饰，以区别其他导游旗，引起游客注意"},{"key":"B","text":"使用导游旗时，应确保旗杆挺立，旗面位于旅游者易辨识的方位"},{"key":"C","text":"旅游团无论多少人都应该打导游旗带团"},{"key":"D","text":"暂不使用导游旗时，可以垫坐，但不能玩耍"}],"answer":"B","keys":["B"],"explanation":"人流量大的景点，导游使用导游旗方便旅游者紧跟团队，避免走失；旅游者人数超过 10 人时应持导游旗，少于 10 人时可根据现场情况决定是否持旗；使用导游旗时，应确保旗杆挺立，旗面位于旅游者易辨识方位；暂不使用导游旗时，妥善放置，不应垫坐、玩耍等。","type":"单选题"},{"number":102,"stem":"地陪在面对入境领队或旅游者提出小的修改意见或增加新的游览项目时，应该（ ）。","options":[{"key":"A","text":"对“合理又可能”满足的项目，应予以安排"},{"key":"B","text":"对确有困难且无法满足的要求，婉转拒绝"},{"key":"C","text":"对需加收费用的项目，直接收取，并落实项目"},{"key":"D","text":"自己做决定是否同意，无需经过旅行社"}],"answer":"A","keys":["A"],"explanation":"地陪应及时向旅行社反映；合理安排：对“合理又可能”满足的项目，应予以安排；费用说明：对需加收费用的项目，地陪要事先向入境领队（全陪）或旅游者讲明，按有关规定收取费用；对确有困难且无法满足的要求，地陪要详细解释、耐心说服。","type":"单选题"},{"number":103,"stem":"出境领队至少需提前（ ）抵达机场、车站、码头等出境口岸指定集合地点，等待游客集合出发。","options":[{"key":"A","text":"15分钟"},{"key":"B","text":"45分钟"},{"key":"C","text":"1个小时"},{"key":"D","text":"2个小时"}],"answer":"A","keys":["A"],"explanation":"领队需至少提前 15分钟抵达机场、车站、码头等出境口岸指定集合地点（行前说明会已通知）。","type":"单选题"},{"number":104,"stem":"游览区域对游客着装有要求的，导游领队应（ ）向游客说明，提醒准备。","options":[{"key":"A","text":"出发前"},{"key":"B","text":"提前一天"},{"key":"C","text":"抵达景点下车前"},{"key":"D","text":"进入景区后"}],"answer":"B","keys":["B"],"explanation":"游览区域对游客着装有要求的（如教堂、寺庙、博物馆、皇宫等），导游领队应提前一天向游客说明，提醒准备。","type":"单选题"},{"number":105,"stem":"下列选项中，不属于全陪致欢迎词的内容是（ ）。","options":[{"key":"A","text":"代表组团社及个人向旅游者致欢迎词"},{"key":"B","text":"介绍行程涉及的下榻饭店、餐饮、游览景点等信息"},{"key":"C","text":"自我介绍、介绍地陪和司机"},{"key":"D","text":"对于入境团，需特别介绍中国概况"}],"answer":"B","keys":["B"],"explanation":"全陪应代表组团社及个人向旅游者致欢迎词。热情的欢迎词有助于提升旅游者的满意度；欢迎词包括：问候语、欢迎语、介绍语（自我介绍、介绍地陪和司机）、恳请语（恳请大家支持、配合工作）、祝愿语；入境旅游者需特别介绍中国概况，涵盖历史、地理、文化、政治、经济、语言、民族、宗教等维度，借助数字技术讲好中国故事、传播中国声音。","type":"单选题"},{"number":106,"stem":"导游带团时，应采用（ ）的方法与游客交流。","options":[{"key":"A","text":"正视"},{"key":"B","text":"仰视"},{"key":"C","text":"俯视"},{"key":"D","text":"斜视"}],"answer":"A","keys":["A"],"explanation":"与旅游者视线平齐，表理性、平等、坦诚，是导游目光语主要形式，体现平等友好相处诚意。","type":"单选题"},{"number":107,"stem":"在抗日战争纪念馆，导游讲述英雄事迹时，双手张开、微微颤抖，眼神坚定且充满敬意，这是导游运用的（ ）。","options":[{"key":"A","text":"象形手势语"},{"key":"B","text":"指示手势语"},{"key":"C","text":"情感手势语"},{"key":"D","text":"标准动作语"}],"answer":"C","keys":["C"],"explanation":"导游表达讲解情感的手势语，用于表达强烈情感，感染力强。例如：在抗日战争纪念馆，导游讲述英雄事迹时，双手张开、微微颤抖，眼神坚定且充满敬意，示意当年战争的惨烈与英雄的伟大，让游客深刻感受到对先烈的崇敬之情。","type":"单选题"},{"number":108,"stem":"导游为突出或强调某些内容、加深旅游者印象而进行的停顿是（ ）。","options":[{"key":"A","text":"语法停顿"},{"key":"B","text":"逻辑停顿"},{"key":"C","text":"感情停顿"},{"key":"D","text":"生理停顿"}],"answer":"B","keys":["B"],"explanation":"导游为突出或强调某些内容而进行的停顿，有助于加深旅游者印象，增强讲解的生动性。例如“秦始皇兵马俑是如何被偶然发现的呢？这一重大发现缘何被赞誉为世界第八大奇迹呢？”在这两个问句后，导游各做一次停顿，勾起旅游者好奇心，使其迫不及待地想要继续聆听下文。","type":"单选题"},{"number":109,"stem":"政务接待过程中，违反保密原则的选项是（ ）。","options":[{"key":"A","text":"不该看的不看"},{"key":"B","text":"不乱找人吐槽"},{"key":"C","text":"可以发朋友圈获赞"},{"key":"D","text":"不该问的不问"}],"answer":"C","keys":["C"],"explanation":"导游在接待中要做到“四不”：不该看的不看，不该问的不问，不该听的不听，不该说的不说。不乱发朋友圈，不乱找人吐槽。","type":"单选题"},{"number":110,"stem":"对残疾人团队照顾恰当适宜的是（ ）。","options":[{"key":"A","text":"设法搞清楚残障原因"},{"key":"B","text":"多为残障游客拍照"},{"key":"C","text":"对残障者表现出重点关注"},{"key":"D","text":"提供帮助前，先征询残障旅游者意见"}],"answer":"D","keys":["D"],"explanation":"提供帮助前，先征询残障旅游者意见，询问是否需要帮助及具体需求；不多问：相处过程中，避免表现得过于好奇。若残障旅游者未主动提及，导游不应擅自打听其残疾原因；未经同意，不可随意对残障旅游者拍照；勿对残障者表现出过分关注，尤其不应过度关注其残疾部位。","type":"单选题"},{"number":111,"stem":"关于游客特殊餐饮服务要求，导游处理正确的是（ ）。","options":[{"key":"A","text":"无论是事先约定，还是旅游者临时提出，导游都应积极想办法落实"},{"key":"B","text":"临时特殊餐饮需求，导游要立即上报旅行社等待指示"},{"key":"C","text":"明确告知旅游者新产生的餐费需自理，原餐费不退"},{"key":"D","text":"因主客观因素限制，无法满足的，导游婉转拒绝"}],"answer":"A","keys":["A"],"explanation":"无论该特殊餐饮要求是旅游合同事先约定，还是旅游者临时提出，都应积极想办法落实，避免引发旅游者投诉；面对旅游者临时提出的特殊餐饮需求，导游应立刻联系餐馆，尽力安排；当导游已协助解决旅游者临时特殊餐饮需求时，要明确告知旅游者新产生的餐费需自理，原餐费则按照旅游合同的约定进行处理；如因主客观因素限制，暂时无法满足旅游者的特殊餐饮需求，导游要做好耐心细致的解释工作，争取旅游者的理解。","type":"单选题"},{"number":112,"stem":"旅游者要前往不健康的娱乐场所，导游操作正确的是（ ）。","options":[{"key":"A","text":"积极协助"},{"key":"B","text":"置身事外，不介入也不劝阻"},{"key":"C","text":"果断拒绝"},{"key":"D","text":"耐心劝阻"}],"answer":"C","keys":["C"],"explanation":"果断拒绝并介绍中国的传统观念和道德风貌，严肃指出不健康的娱乐活动和不正常的夜生活在中国是明令禁止的，是违法行为，会受到法律的惩处。","type":"单选题"},{"number":113,"stem":"发生漏接事故以后，导游做法正确的是（ ）。","options":[{"key":"A","text":"应第一时间与全陪联系，争取尽快会面商量如何回复游客"},{"key":"B","text":"见面后，找到合适的理由，减少客人的投诉"},{"key":"C","text":"若因漏接导致旅游者产生额外费用，导游表示遗憾无法提供帮助"},{"key":"D","text":"通过提供热情周到的高质量服务，减轻漏接造成的不良影响"}],"answer":"D","keys":["D"],"explanation":"知晓旅游者抵达后，导游应第一时间与其联系，争取尽快会面；见面后，导游首先需诚恳地向旅游者道歉，随后实事求是地说明情况，并力求获得旅游者的谅解；一方面，导游可通过提供热情周到的高质量服务，减轻漏接造成的不良影响；另一方面，若因漏接导致旅游者产生额外费用，导游应主动给予报销。如有必要，还可通过加菜、赠送本地特产等方式，给予旅游者物质补偿。","type":"单选题"},{"number":114,"stem":"当旅游者出现不当行为时，导游操作不当的是（ ）。","options":[{"key":"A","text":"发现不当行为，导游应立即制止，不回避、不躲闪"},{"key":"B","text":"严肃冷静地指出行为不当之处"},{"key":"C","text":"导游应立即汇报给旅行社"},{"key":"D","text":"如果事情性质严重，后果恶劣，要汇报给相关主管部门，配合调查"}],"answer":"C","keys":["C"],"explanation":"发现不当行为，导游应立即制止，不回避、不躲闪；严肃冷静地指出行为不当之处，区分问题性质，提醒继续该行为的严重后果；若旅游者不听劝阻，导游应及时汇报给旅行社，并在协助下汇报给相关主管部门，配合调查。","type":"单选题"},{"number":115,"stem":"当旅游客车发生交通事故时，导游应该拨打（ ）报警。","options":[{"key":"A","text":"120"},{"key":"B","text":"119"},{"key":"C","text":"122"},{"key":"D","text":"110"}],"answer":"C","keys":["C"],"explanation":"当旅游客车发生交通事故时，导游需冷静保护事故现场，避免其进一步破坏或污染，同时拨打或安排人员拨打 122报警电话，待交警到达后，协助现场处置。","type":"单选题"},{"number":116,"stem":"当旅游者遭遇传染病疫情时，导游操作正确的是（ ）。","options":[{"key":"A","text":"第一时间向旅行社报告，不调整行程，争取将行程按计划走完"},{"key":"B","text":"经查旅游者确患传染病的，立即解除与旅行社合同关系"},{"key":"C","text":"如患者系外籍人士，我国令其提前出境的，协助患者办理相关离境手续"},{"key":"D","text":"如果有游客患病，请其自动离团，避免传染其她游客"}],"answer":"C","keys":["C"],"explanation":"(1)立即暂停旅游活动，在第一时间向旅行社及其所在地、疫情发生地旅游主管部门报告，并及时向附近的疾病预防控制机构报告详细情况，配合开展旅游者防疫、安抚和宣传解释工作；(2)有关部门认为应对旅游者进行防疫检查的，立即将旅游者送至当地疾病预防控制机构或有关部门指定的其他场所；(3)经查旅游者确患传染病的，遵照当地有关疫情防控指引和要求，配合相关部门和单位做好旅游者隔离、密切接触者追踪或采取其他措施，并通知其亲属；(4)关注目的地疫情防控动态，宜根据疫情发展情况，按旅行社的安排，调整或变更旅游行程；(5)如患者系外籍人士，由我国公安机关令其提前出境的，协助患者办理相关离境手续。","type":"单选题"},{"number":117,"stem":"当旅游者在境内旅游期间遭遇自然灾害，导游操作正确的是（ ）。","options":[{"key":"A","text":"立即报警，在原地等待救援"},{"key":"B","text":"旅游者遭受人身损害的，引导旅游者开展自救和互救"},{"key":"C","text":"尽量不惊动旅行社，由导游个人独立处理"},{"key":"D","text":"稳定游客情绪，鼓励他们用意志克服困难，争取逃生"}],"answer":"B","keys":["B"],"explanation":"及时报警并向旅行社报告，同时向旅游者预警，引导旅游者采取相应的安全防范措施，立刻带领旅游者撤离灾区；旅游者遭受人身损害的，根据现场的条件，引导旅游者开展自救和互救，防范二次伤害，等待救援；稳定旅游者情绪，及时将事件发生的时间、地点、原因、经过等情况报告旅行社和相关部门，取得指导和帮助。","type":"单选题"},{"number":118,"stem":"公务普通护照的发放对象是（ ）。","options":[{"key":"A","text":"我国党、政、军高级领导"},{"key":"B","text":"我国派驻国外的外交机构工作人员"},{"key":"C","text":"我国副县、副处级以下因公出国人员"},{"key":"D","text":"我国因私出国探亲、学习、就业的普通公民"}],"answer":"C","keys":["C"],"explanation":"公务普通护照：发给我国各级政府部门副县、处级以下公务员和国有企事业单位因公出国人员等。","type":"单选题"},{"number":119,"stem":"我国的 L 字签证代表的是（ ）。","options":[{"key":"A","text":"外交签证"},{"key":"B","text":"礼遇签证"},{"key":"C","text":"旅游签证"},{"key":"D","text":"普通签证"}],"answer":"C","keys":["C"],"explanation":"外国人来中国旅游时，需向中国驻外使、领馆申请旅游签证（L字签证）。","type":"单选题"},{"number":120,"stem":"下列可以出境的物品有（ ）。","options":[{"key":"A","text":"伪造的货币及伪造的有价证券"},{"key":"B","text":"印刷品、胶卷、照片、唱片"},{"key":"C","text":"珍贵文物及其他禁止出境的文物"},{"key":"D","text":"带有危险性病菌、害虫及其他有害生物的动物"}],"answer":"B","keys":["B"],"explanation":"列入禁止入境范围的所有物品；伪造的货币及伪造的有价证券；珍贵文物及其他禁止出境的文物；带有危险性病菌、害虫及其他有害生物的动物、植物及其产品。","type":"单选题"},{"number":121,"stem":"外国人出国携带金银限额标注正确的是（ ）。","options":[{"key":"A","text":"银质器皿 20 市两"},{"key":"B","text":"白银饰品 20 市两"},{"key":"C","text":"黄金饰品 2 市两"},{"key":"D","text":"黄金没有限额"}],"answer":"A","keys":["A"],"explanation":"在境内的中国人、外国侨民和无国籍人出境定居，每人携带金银的限额为：黄金饰品 1 市两（31.25 克），白银饰品 10 市两（312.50 克），银质器皿 20 市两（625 克）。经海关查验符合规定限额的放行。","type":"单选题"},{"number":122,"stem":"东盟国家旅游团入境云南西双版纳免签时间为（ ）。","options":[{"key":"A","text":"24小时"},{"key":"B","text":"72小时"},{"key":"C","text":"144小时"},{"key":"D","text":"240小时"}],"answer":"C","keys":["C"],"explanation":"东盟旅游团入境云南西双版纳免签：2025 年 2 月 10 日起，东盟国家持普通护照经我国境内旅行社组织接待，采取团进团出方式，可由西双版纳嘎洒国际机场口岸、磨憨铁路口岸、磨憨公路口岸免办签证入境出境，活动范围为云南省西双版纳傣族自治州行政区域，停留时间不超过 144小时（6天）。","type":"单选题"},{"number":123,"stem":"南方航空公司的标志是（ ）。","options":[{"key":"A","text":"木棉花与飞机尾翼"},{"key":"B","text":"凤凰"},{"key":"C","text":"飞翔的燕子"},{"key":"D","text":"三道 S"}],"answer":"A","keys":["A"],"explanation":"南方航空：木棉花与飞机尾翼。","type":"单选题"},{"number":124,"stem":"不满两周岁但单独占座的孩子，其机票价格为（ ）。","options":[{"key":"A","text":"全价票"},{"key":"B","text":"全价票的 50%"},{"key":"C","text":"全价票的 20%"},{"key":"D","text":"成人正常票价的 10%"}],"answer":"B","keys":["B"],"explanation":"不满两周岁应购买婴儿票，不单独占座；需占座则购买儿童票，儿童票基准价：全价票的 50%。","type":"单选题"},{"number":125,"stem":"下列对于动车组列车所有携带物品的尺寸描述，正确的是（ ）。","options":[{"key":"A","text":"每件物品长+宽+高之和≤160cm"},{"key":"B","text":"杆状物品≤200cm"},{"key":"C","text":"每件重量≤30kg"},{"key":"D","text":"所有物品尺寸均≤130cm"}],"answer":"D","keys":["D"],"explanation":"普通列车：每件物品长+宽+高之和≤160cm·杆状物品≤200cm；动车组列车：所有物品尺寸均≤130cm·每件重量≤20kg。","type":"单选题"},{"number":126,"stem":"关于不宜登山人群，描述错误的一项是（ ）。","options":[{"key":"A","text":"青少年"},{"key":"B","text":"关节疾病者"},{"key":"C","text":"心脑血管疾病者"},{"key":"D","text":"体质衰弱的老年人"}],"answer":"A","keys":["A"],"explanation":"不宜登山人群：登山属高强度耗氧运动，关节疾病患者、心脑血管疾病患者、体质衰弱的老年人及平时缺乏锻炼者均不宜前往高山景区。","type":"单选题"},{"number":127,"stem":"对于交通意外保险，描述正确的是（ ）。","options":[{"key":"A","text":"意外伤害保险范围，从持有效机票过安检到抵达目的港走出机场止"},{"key":"B","text":"廊桥和舷梯区域属于航空公司管理"},{"key":"C","text":"飞机中途停留、绕道飞行期间跟机行动的意外伤害，航空公司负责"},{"key":"D","text":"因民航延误旅客离机期间的意外伤害，航空公司负责"}],"answer":"C","keys":["C"],"explanation":"航空旅客意外伤害保险期限起止：持有效机票过安检→抵达目的港走出航班舱门止（舷梯与廊桥区域除外）；飞机中途停留/绕道飞行期间跟机行动的意外伤害；因民航延误旅客离机期间的意外伤害。","type":"单选题"},{"number":128,"stem":"在饭店客房中比例最高、被大家称作“标准间”的是（ ）。","options":[{"key":"A","text":"单人间"},{"key":"B","text":"双床间"},{"key":"C","text":"大床间"},{"key":"D","text":"套房"}],"answer":"B","keys":["B"],"explanation":"双床间：配备两张单人床，较受团体客人欢迎。由于在饭店客房中占比较高比例，也常被称为饭店的“标准间”。","type":"单选题"},{"number":129,"stem":"下列城市中，与北京一起看到日出的是（ ）。","options":[{"key":"A","text":"新加坡"},{"key":"B","text":"莫斯科"},{"key":"C","text":"夏威夷"},{"key":"D","text":"开普敦"}],"answer":"A","keys":["A"],"explanation":"新加坡和北京一个时区，莫斯科比中国晚了 5 个小时，夏威夷比中国晚了 18 个小时，开普敦比中国晚了 6个小时。","type":"单选题"},{"number":130,"stem":"1升相当于（ ）英制加仑。","options":[{"key":"A","text":"0.5"},{"key":"B","text":"0.22"},{"key":"C","text":"1"},{"key":"D","text":"0.8"}],"answer":"B","keys":["B"],"explanation":"1 升相当于 0.22英制加仑。三、多选题","type":"单选题"},{"number":131,"stem":"人民行使国家权力的机关是（ ）。","options":[{"key":"A","text":"全国人民政治协商会议"},{"key":"B","text":"地方各级人民政治协商会议"},{"key":"C","text":"全国人民代表大会"},{"key":"D","text":"中央及地方各级人民政府"},{"key":"E","text":"地方各级人民代表大会"}],"answer":"CE","keys":["C","E"],"explanation":"中华人民共和国的一切权力属于人民。人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会。","type":"多选题"},{"number":132,"stem":"根据《中华人民共和国宪法》关于财产保护制度的规定，下列说法正确的有（ ）。","options":[{"key":"A","text":"国家为了公共利益的需要，对公民私有财产征收或征用后应当给予赔偿"},{"key":"B","text":"社会主义公共财产神圣不可侵犯"},{"key":"C","text":"任何组织或者个人可以在合理范围内处置社会主义公共财产"},{"key":"D","text":"国家为了公共利益的需要，可以依法对土地实行征收或者征用并给予补偿"},{"key":"E","text":"国家为了公共利益的需要，可以依法对私有财产实行征收、征用并给予补偿"}],"answer":"BDE","keys":["B","D","E"],"explanation":"《宪法》第 12条规定，社会主义的公共财产神圣不可侵犯。国家保护社会主义的公共财产。禁止任何组织或者个人用任何手段侵占或者破坏国家的和集体的财产。《宪法》第10 条第 3 款规定，国家为了公共利益的需要，可以依照法律规定对土地实行征收或者征用并给予补偿。《宪法》第 13条第 3 款规定，国家为了公共利益的需要，可以依照法律规定对公民的私有财产实行征收或者征用并给予补偿。选项辨析：A 错误：补偿适用于合法的征收、征用行为；赔偿针对国家机关违法行使职权造成损害的情形。宪法规定征收征用对应的是补偿而非赔偿，概念不能混淆。C 错误：《宪法》禁止任何组织或者个人侵占、破坏国家和集体公共财产，公共财产不允许组织或个人随意处置。","type":"多选题"},{"number":133,"stem":"依据《中华人民共和国旅游法》，旅行社可以解除旅游服务合同的法定情形包括（ ）。","options":[{"key":"A","text":"患有传染性疾病、可能危害其他旅游者健康和安全的"},{"key":"B","text":"携带危害公共安全的物品且不同意交有关部门处理的"},{"key":"C","text":"从事违法或者违反社会公德活动的"},{"key":"D","text":"从事影响其他旅游者权益的活动，且不听劝阻、不能制止的"},{"key":"E","text":"法律、行政法规规定的其他情形"}],"answer":"ABC","keys":["A","B","C"],"explanation":"《旅游法》第 66条规定，旅游者有下列情形之一的，旅行社可以解除合同：①患有传染病等疾病，可能危害其他旅游者健康和安全的；②携带危害公共安全的物品且不同意交有关部门处理的；③从事违法或者违反社会公德的活动的；④从事严重影响其他旅游者权益的活动，且不听劝阻、不能制止的；⑤法律规定的其他情形。“从事影响其他旅游者权益的活动，且不听劝阻、不能制止的”应该是“严重”影响，表述不够完整。“法律、行政法规规定的其他情形”注意，是法律规定的其他情形。","type":"多选题"},{"number":134,"stem":"旅游合同签订后，因目的地入境政策临时变更，导致某国际旅行社的出境旅游团无法成行。对此（ ）。","options":[{"key":"A","text":"旅行社应当承担违约责任，赔偿旅游者的各项损失"},{"key":"B","text":"旅行社不承担违约责任"},{"key":"C","text":"旅行社无权解除合同"},{"key":"D","text":"旅游者有权解除合同"},{"key":"E","text":"如果合同解除，组团社应该将旅游者未发生的费用退还"}],"answer":"BD","keys":["B","D"],"explanation":"《旅游法》第 67条规定，因不可抗力或者旅行社、履行辅助人已尽合理注意义务仍不能避免的事件，影响旅游行程的，按照下列情形处理：(1)合同不能继续履行的，旅行社和旅游者均可以解除合同。合同不能完全履行的，旅行社经向旅游者作出说明，可以在合理范围内变更合同；旅游者不同意变更的，可以解除合同。(2)合同解除的，组团社应当在扣除已向地接社或者履行辅助人支付且不可退还的费用后，将余款退还旅游者；合同变更的，因此增加的费用由旅游者承担，减少的费用退还旅游者。","type":"多选题"},{"number":135,"stem":"根据《民法典》的规定，提供格式条款一方（ ）的相应条款无效。","options":[{"key":"A","text":"不合理的减轻其责任"},{"key":"B","text":"加重对方责任"},{"key":"C","text":"排除对方主要权利"},{"key":"D","text":"限制对方主要权利"},{"key":"E","text":"免除其责任"}],"answer":"AC","keys":["A","C"],"explanation":"《民法典》第 497 条规定，有下列情形之一的，该格式条款无效：(1)具有本法第一编第六章第三节和本法第 506 条规定的无效情形；(2)提供格式条款一方不合理地免除或者减轻其责任、加重对方责任、限制对方主要权利；(3)提供格式条款一方排除对方主要权利。","type":"多选题"},{"number":136,"stem":"根据《民法典》的规定，下列关于物件致人损害责任的说法，正确的是（ ）。","options":[{"key":"A","text":"建筑物、构筑物或者其他设施倒塌致人损害，由建设单位与施工单位承担连带责任"},{"key":"B","text":"抛掷物或坠物致人损害，除能够证明自己不是侵权人的外，由可能加害的建筑物使用人或所有人给予补偿"},{"key":"C","text":"堆放物倒塌致人损害，堆放人不管有无过错，都应当承担侵权责任"},{"key":"D","text":"妨碍通行物致人损害，有关单位或者个人不能证明自己没有过错的，应当承担侵权责任"},{"key":"E","text":"林木折断致人损害，林木的所有人或者管理人不能证明自己没有过错的，应当承担侵权责任"}],"answer":"AE","keys":["A","E"],"explanation":"《民法典》第 1254条，从建筑物中抛掷物品或者从建筑物上坠落的物品造成他人损害，难以确定具体侵权人的，除能够证明自己不是侵权人的外，由可能加害的建筑物使用人给予补偿，所以“抛掷物或坠……”错误；第 1255条，堆放物倒塌致人损害，堆放人不能证明自己没有过错的，应当承担侵权责任，所以“堆放物倒塌……”错误；第 1256条，妨碍通行物致人损害，在公共道路上堆放、倾倒、遗撒妨碍通行的物品造成他人损害的，有关单位或者个人应当承担侵权责任，所以“妨碍通行物……”错误。","type":"多选题"},{"number":137,"stem":"国内旅游因旅行社原因不能成行的，应提前 7日（不含 7 日）通知旅游者，否则应向旅游者全额退还预付旅游费用，并向旅游者支付违约金。下列选项符合《旅行社服务质量赔偿标准》规定的是（ ）。","options":[{"key":"A","text":"出发前 3日至 1 日，支付旅游费用总额 15%的违约金"},{"key":"B","text":"出发前 7日（含 7日）至 4日，支付旅游费用总额 10%的违约金"},{"key":"C","text":"出发当日，支付旅游费用总额 20%的违约金"},{"key":"D","text":"出发当日，支付旅游费用总额 25%的违约金"},{"key":"E","text":"出发前 3日至 1 日，支付旅游费用总额 20%的违约金"}],"answer":"ABC","keys":["A","B","C"],"explanation":"国内旅游旅行社原因未能成行，应提前 7 天通知旅游者，当天通知：违约金是旅游费用总额的 20%，出发前 3日至 1日，出发前 7 日（含 7 日）至 4 日，分别按照 5%的差额递减。答题诀窍：掌握最大赔偿比例和递减规律。","type":"多选题"},{"number":138,"stem":"《导游管理办法》规定，对（ ），所在地旅游主管部门应当撤销导游证。","options":[{"key":"A","text":"超过 3 个月未与任何旅行社订立劳动合同的"},{"key":"B","text":"申请人以欺骗、贿赂等不正当手段取得导游证的"},{"key":"C","text":"不具备申请资格或者不符合法定条件的申请人核发导游证的"},{"key":"D","text":"导游死亡的"},{"key":"E","text":"导游证有效期届满未申请换发导游证的"}],"answer":"BC","keys":["B","C"],"explanation":"有下列情形之一的，所在地旅游主管部门应当撤销导游证：(1)对不具备申请资格或者不符合法定条件的申请人核发导游证的；(2)申请人以欺骗、贿赂等不正当手段取得导游证的；(3)依法可以撤销导游证的其他情形。本题考查导游证“撤销”和“注销”的区别。总结如下：注销是自然而然发生的事情，比如“超过 3 个月未与任何旅行社订立劳动合同的”属于导游未能找到挂靠管理单位；“导游死亡的”是导游生命终结；“导游证有效期届满未申请换发导游证的”导游证因为到期而失效。这些情形无关对错，不涉及行政许可行为。而导游证“撤销”是旅游行政管理部门对行政许可行为的收回，这样的收回或者是申请人有错，或者是行政许可做出人有工作疏漏。","type":"多选题"},{"number":139,"stem":"导游张某在带团时遭遇泥石流，情况紧急，但是张某不顾游客劝阻，也未向相关部门履行报告义务，执意继续前往旅游目的地。依据《导游管理办法》，由县级以上旅游主管部门对张某（ ）。","options":[{"key":"A","text":"没收违法所得"},{"key":"B","text":"并可以处 1000元以下罚款"},{"key":"C","text":"责令改正"},{"key":"D","text":"暂扣或吊销导游证"},{"key":"E","text":"情节严重的，处 1000 元以上 5000元以下罚款"}],"answer":"BC","keys":["B","C"],"explanation":"《导游管理办法》第 33 条规定，违反本办法规定，不依照本办法第 24条规定采取相应措施的，由县级以上旅游主管部门责令改正，并可以处 1000元以下罚款；情节严重的，可以处 1000元以上 5000元以下罚款。注意选项“情节严重的……”，是“可以处”。","type":"多选题"},{"number":140,"stem":"根据《治安管理处罚法》正当防卫的规定，下列说法正确的有（ ）。","options":[{"key":"A","text":"为免受正在进行的不法侵害而采取的制止行为，造成损害的，不属于违反治安管理行为，不予处罚"},{"key":"B","text":"制止行为明显超过必要限度，造成较大损害的，依法给予处罚"},{"key":"C","text":"制止行为明显超过必要限度，情节较轻的，不予处罚"},{"key":"D","text":"治安案件中的防卫行为，适用刑法有关正当防卫的规定，不适用治安管理处罚法专门条款"},{"key":"E","text":"对于双方发生肢体冲突的案件，一般应当认定为互殴，不能认定正当防卫"}],"answer":"AC","keys":["A","C"],"explanation":"A 正确，符合新法第 19条第一款。B 错误，防卫过当造成较大损害，应当处罚且“应当减轻”。C 正确，防卫过当、情节较轻，不予处罚。D 错误，新法区分互殴与正当防卫，不是一般都认定互殴，一方遭受不法侵害实施制止的，仍可成立正当防卫。E错误，新《治安管理处罚法》专门设置正当防卫条款，治安案件优先适用本法本条规定，而非直接适用刑法正当防卫。","type":"多选题"},{"number":141,"stem":"依据《旅游投诉处理办法》，旅游投诉处理机构不予受理的情形有（ ）。","options":[{"key":"A","text":"人民法院已经受理的"},{"key":"B","text":"超过旅游合同签订之日起 90天的"},{"key":"C","text":"投诉人与被投诉事项没有直接利害关系的"},{"key":"D","text":"旅游经营者认为旅游者在旅游过程中严重侵害其合法权益"},{"key":"E","text":"旅游投诉处理机构已经做出处理，但又出现新情况的"}],"answer":"ACD","keys":["A","C","D"],"explanation":"《旅游投诉处理办法》第九条旅游投诉应当符合下列条件：（一）投诉人与投诉事项有直接利害关系；（二）有明确的被投诉人、具体的投诉请求。第十一条旅游投诉有下列情形之一的，不予受理：（一）不属于旅游投诉处理机构管辖范围的；（二）超过旅游合同履行期限届满之日九十日的；（三）人民法院、仲裁机构、其他行政管理部门、消费者组织或者人民调解组织等机构已经受理或者处理的；（四）旅游投诉处理机构已经作出处理，且没有新情况、新理由的；（五）不符合本办法第九条规定的受理条件的；（六）本办法规定情形之外的经济纠纷、劳动人事纠纷等其他纠纷。A项正确，人民法院已经受理的，属于第十一条明确的不予受理情形。B 项错误，法定期限起算点是旅游合同履行期限届满之日，不是合同签订之日，该表述错误，不属于不予受理情形。C 项正确，投诉人与投诉事项没有直接利害关系，不满足第九条规定的受理条件，不予受理。D 项正确，旅游投诉的投诉人仅限旅游者，旅游经营者不能作为投诉人提起旅游投诉，该情形不予受理。E项错误，已经作出处理，但出现新情况的，不属于不予受理情形；只有无新情况、新理由再次投诉才不予受理。","type":"多选题"},{"number":142,"stem":"依据《旅游安全管理办法》，旅游目的地安全风险提示级别为二级风险的，旅行社应当采取的措施包括（ ）。","options":[{"key":"A","text":"组织已在风险区域的旅游者撤离"},{"key":"B","text":"停止组团或者带团前往风险区域"},{"key":"C","text":"已在风险区域的，调整行程"},{"key":"D","text":"已在风险区域的，中止行程"},{"key":"E","text":"加强对旅游者的提示"}],"answer":"BCD","keys":["B","C","D"],"explanation":"《旅游安全管理办法》第 18条规定风险提示发布后的应对措施：四级风险：加强对旅游者的提示；三级风险：采取必要的安全防范措施；二级风险：停止组团或者带团前往风险区域；已在风险区域的，调整或者中止行程；一级风险：停止组团或者带团前往风险区域，组织已在风险区域的旅游者撤离。B 项正确：二级风险要求“停止组团或带团前往”。CD项正确：已在风险区域的，应“调整或中止行程”。A 项错误：“组织撤离”是一级风险措施。二级风险尚未达到必须撤离的程度。E项错误：“加强提示”是四级风险最低级别措施。","type":"多选题"},{"number":143,"stem":"违反《中华人民共和国食品安全法》规定，县级以上人民政府有（ ）行为的，对直接负责的主管人员和其他直接责任人员给予记大过处分。","options":[{"key":"A","text":"缓报食品安全事故"},{"key":"B","text":"本行政区域内发生特别重大食品安全事故"},{"key":"C","text":"谎报食品安全事故"},{"key":"D","text":"本行政区域内连续发生较大食品安全事故"},{"key":"E","text":"瞒报食品安全事故"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"《食品安全法》第 142条规定，县级以上地方人民政府有下列行为之一的，对直接负责的主管人员和其他直接责任人员给予记大过处分；情节较重的，给予降级或者撤职处分；情节严重的，给予开除处分；造成严重后果的，其主要负责人还应当引咎辞职：对发生在本行政区域内的食品安全事故，未及时组织协调有关部门开展有效处置，造成不良影响或者损失；对本行政区域内涉及多环节的区域性食品安全问题，未及时组织整治，造成不良影响或者损失；隐瞒、谎报、缓报食品安全事故；本行政区域内发生特别重大食品安全事故，或者连续发生重大食品安全事故。","type":"多选题"},{"number":144,"stem":"习近平法治思想提出的全面依法治国要求包括（ ）。","options":[{"key":"A","text":"坚持依宪治国、依宪执政"},{"key":"B","text":"坚持以党的领导为中心"},{"key":"C","text":"坚持党对全面依法治国的领导"},{"key":"D","text":"坚持以人民为中心"},{"key":"E","text":"坚持中国特色社会主义法治道路"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"答案选 ACDE。全面依法治国的要求包括坚持党对全面依法治国的领导、坚持以人民为中心、坚持中国特色社会主义法治道路、坚持依宪治国、依宪执政。B 项全面依法治国是坚持以人民为中心，不是以党的领导为中心，党的领导是根本保证。","type":"多选题"},{"number":145,"stem":"《英雄烈士保护法》规定，禁止歪曲、丑化、亵渎、否定英雄烈士事迹和精神。英雄烈士的（ ）受法律保护。","options":[{"key":"A","text":"事迹"},{"key":"B","text":"姓名"},{"key":"C","text":"肖像"},{"key":"D","text":"名誉"},{"key":"E","text":"荣誉"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"《英雄烈士保护法》第 22条规定：“英雄烈士的姓名、肖像、名誉、荣誉受法律保护。”因此，正确选项是 BCDE。B 姓名：禁止擅自使用烈士姓名注册商标、命名商业场所；C肖像：禁止丑化、篡改烈士照片或画像；D名誉：禁止散布谣言贬损烈士形象；E荣誉：禁止否定烈士荣誉称号的正当性。举例：商家注册“董存瑞炸碉堡”商标，被依法宣告无效，即因侵害姓名与荣誉权。A 项错误：法律保护的是基于事迹产生的“精神”与“名誉”，而非“事迹”本身。歪曲事迹可能构成对名誉或精神的侵害，但“事迹”不作为独立保护客体。","type":"多选题"},{"number":146,"stem":"《民法典》规定，有下列（ ）情形之一的，当事人可以解除合同。","options":[{"key":"A","text":"因不可抗力致使合同变更"},{"key":"B","text":"在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务"},{"key":"C","text":"当事人一方迟延履行主要债务"},{"key":"D","text":"当事人一方有其他违约行为致使不能实现合同目的"},{"key":"E","text":"法律规定的其他情形"}],"answer":"BDE","keys":["B","D","E"],"explanation":"《民法典》第 563 条，有下列情形之一的，当事人可以解除合同：(1)因不可抗力致使不能实现合同目的；(2)在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务；(3)当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行；(4)当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的；(5)法律规定的其他情形。A 错误：法条是“致使不能实现合同目的”，不是“致使合同变更”。B 正确：预期违约（明示/默示不履行主债务）。C 错误：只迟延履行主要债务还不够，必须加上经催告后合理期限仍不履行才可以解除。D 正确：根本违约，导致合同目的落空。E 正确：法条原文是法律规定的其他情形。","type":"多选题"},{"number":147,"stem":"根据《国家旅游局关于旅游不文明行为记录管理暂行办法》的规定，下列表述错误的是（ ）。","options":[{"key":"A","text":"旅游经营者和旅游从业人员属于旅游不文明行为记录管理制度的纳入对象"},{"key":"B","text":"“旅游不文明行为记录”形成前应经“旅游不文明行为记录评审委员会”评审通过"},{"key":"C","text":"“旅游不文明行为记录”的记录期限实行动态管理"},{"key":"D","text":"“旅游不文明行为记录”形成后，当事人本人享有申辩的权利"},{"key":"E","text":"受到行政处罚的，“旅游不文明行为记录”的信息保存期限为 2 年至 4 年"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"A 错误，注意：旅游经营者（企业）不在记录对象里，记录对象是游客+旅游从业人员（自然人）。该办法纳入的是游客、旅游从业人员（自然人），旅游经营者（企业主体）不属于该记录的纳入对象，所以 A说法错误。B 正确，第 8条：记录形成前，经评审委员会评审通过；C 正确，第 9条：记录期限 1-5年，实行动态管理；D 正确，第 11条：记录形成后，送达本人，告知享有申辩权。E 正确，受到行政处罚的，“旅游不文明行为记录”的信息保存期限为 2-4年。","type":"多选题"},{"number":148,"stem":"关于导游的介绍礼仪，阐述正确的选项有（ ）。","options":[{"key":"A","text":"介绍一般可分为自我介绍、为他人做介绍及被人介绍三种"},{"key":"B","text":"应遵循“让长者、客人先知”的原则"},{"key":"C","text":"介绍时，应简洁清楚，不能含糊其词"},{"key":"D","text":"介绍他人时，可用手指指着对方，清晰明了"},{"key":"E","text":"导游被人介绍时，应面对旅游者，显示出想结识旅游者的诚意"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"介绍一般可分为自我介绍、为他人做介绍及被人介绍三种；应遵循“让长者、客人先知”的原则；介绍时，应简洁清楚，不能含糊其词；介绍他人时，不可用手指指着对方，应有礼貌地以手掌示意；导游被人介绍时，应面对旅游者，显示出想结识旅游者的诚意。","type":"多选题"},{"number":149,"stem":"地陪导游送行前的工作包括（ ）。","options":[{"key":"A","text":"核对交通票据"},{"key":"B","text":"商定出发时间"},{"key":"C","text":"提醒注意事项"},{"key":"D","text":"集合登车"},{"key":"E","text":"与饭店结账"}],"answer":"ABC","keys":["A","B","C"],"explanation":"地陪导游送行前的工作：核对交通票据；商定出发时间；提醒注意事项；及时归还证件。","type":"多选题"},{"number":150,"stem":"导游服务的原则有（ ）。","options":[{"key":"A","text":"游客为本原则"},{"key":"B","text":"规范化服务原则"},{"key":"C","text":"平等待客原则"},{"key":"D","text":"营销有别原则"},{"key":"E","text":"维护旅行社合法权益原则"}],"answer":"ABC","keys":["A","B","C"],"explanation":"导游服务的原则：游客为本原则；规范化服务原则；平等待客原则；个性化服务原则；维护旅游者合法权益原则。","type":"多选题"},{"number":151,"stem":"地陪导游在接团前，应该做好的心理准备有（ ）。","options":[{"key":"A","text":"树立带好旅游团的自信"},{"key":"B","text":"准备面对艰苦复杂的工作"},{"key":"C","text":"准备可能面对抱怨和投诉"},{"key":"D","text":"旅游稽查的审核"},{"key":"E","text":"旅游景区的监督和检查"}],"answer":"ABC","keys":["A","B","C"],"explanation":"地陪导游在接团前，应该做好的心理准备：树立带好旅游团的自信；准备面对艰苦复杂的工作；准备可能面对抱怨和投诉。","type":"多选题"},{"number":152,"stem":"导游语言的基本要求包括（ ）。","options":[{"key":"A","text":"准确性"},{"key":"B","text":"通俗性"},{"key":"C","text":"复杂性"},{"key":"D","text":"清晰性"},{"key":"E","text":"生动性"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"导游语言的基本要求包括：准确性；通俗性；清晰性；生动性。","type":"多选题"},{"number":153,"stem":"导游领队带领游客进行进餐活动时，应该遵守的规则包括（ ）。","options":[{"key":"A","text":"有序就餐，避免高声喧哗干扰他人"},{"key":"B","text":"引导游客就餐时尽量多拿，避免多次往返餐台"},{"key":"C","text":"提醒游客自助餐区域的食物、饮料不能带离就餐区"},{"key":"D","text":"提醒游客正确使用公共餐具"},{"key":"E","text":"就餐环境对服装有特殊要求的，导游不需要提示游客"}],"answer":"ACD","keys":["A","C","D"],"explanation":"1.导游领队应提醒游客注意用餐礼仪，有序就餐，避免高声喧哗干扰他人。2.导游领队应引导游客就餐时适量点用，避免浪费。3.导游领队应提醒游客自助餐区域的食物、饮料不能带离就餐区。4.集体就餐时，导游领队应提醒游客正确使用公共餐具。5.游客如需在就餐时抽烟，导游领队应指示游客到指定抽烟区域就座，如就餐区禁烟的，应遵守相关规则。6.就餐环境对服装有特殊要求的，导游领队应事先告知游客，以便游客准备。7.在公共交通工具或博物馆、展览馆、音乐厅等场所，应遵守相关规则，勿违规饮食。","type":"多选题"},{"number":154,"stem":"地陪导游为游客提供餐饮服务应遵守的规则包括（ ）。","options":[{"key":"A","text":"在旅游团队用餐前，地陪需提前落实本团当天的用餐事宜"},{"key":"B","text":"到达餐厅以后，地陪引导游客入座以后就可以离开"},{"key":"C","text":"用餐过程中，地陪应巡视旅游团用餐情况 1—2 次"},{"key":"D","text":"若是风味餐，地陪还应进行必要的介绍，使旅游者了解风味餐的历史等"},{"key":"E","text":"如菜品中有异物必须要求餐厅负责人出面赔礼道歉并立即换菜"}],"answer":"ACD","keys":["A","C","D"],"explanation":"在旅游团队用餐前，地陪需提前落实本团当天的用餐事宜；地陪应提前了解团队用餐位置，并向旅游者做出指引；进入餐厅后，向餐厅迎宾员告知团队的团号、旅行社名称以及人数等信息；引导旅游者落座后，督促服务员上茶水，介绍餐厅的相关设施，尤其是洗手间的位置，并向旅游者说明用餐的具体时间；用餐过程中，地陪应巡视旅游团用餐情况 1—2 次；针对旅游者在用餐中出现的问题和要求，如菜品中有异物（头发、虫子等），地陪要及时向餐厅反映并立即换菜，必要时要求餐厅负责人出面赔礼道歉并给予适当补偿。","type":"多选题"},{"number":155,"stem":"旅游团回国的入境手续包括（ ）。","options":[{"key":"A","text":"接受检验检疫"},{"key":"B","text":"领取托运行李"},{"key":"C","text":"接受入境边防检查"},{"key":"D","text":"接受海关检查"},{"key":"E","text":"接受财务检查"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"旅游团回国的入境手续：接受检验检疫；领取托运行李；接受入境边防检查；接受海关检查。","type":"多选题"},{"number":156,"stem":"带领孩子旅行的“四不宜”原则是（ ）。","options":[{"key":"A","text":"不宜为讨好孩子而给其买食物、玩具等物品"},{"key":"B","text":"不宜密切关注孩子的动向，确保其始终处于安全环境中"},{"key":"C","text":"不宜过于关注孩子而冷落其他成员"},{"key":"D","text":"不宜单独带孩子外出活动"},{"key":"E","text":"不宜在孩子生病时直接提供药物给其服用"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"“四不宜”原则：①不宜为讨好孩子而给其买食物、玩具等物品；②不宜过于关注孩子而冷落其他成员；③不宜单独带孩子外出活动；④不宜在孩子生病时直接提供药物给其服用。","type":"多选题"},{"number":157,"stem":"游客要求中途退团，导游处置得当的是（ ）。","options":[{"key":"A","text":"合理退团，游客提出书面申请并签字，导游按照旅行社安排处理"},{"key":"B","text":"若外国旅游者持团体签证，协助办理分离签证手续"},{"key":"C","text":"额外产生的费用由旅游者自理"},{"key":"D","text":"不合理退团要求，导游告知一切费用自理，其余团费不退"},{"key":"E","text":"不合理退团要求，地陪、领队、全陪互相配合，耐心劝服继续随团"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"不合理退团要求，导游告知一切费用自理，未使用费用按旅游合同约定处理，其余选项正确。","type":"多选题"},{"number":158,"stem":"为了防止误机事故的发生，导游应该做的预防工作有（ ）。","options":[{"key":"A","text":"仔细确认班（轮）次、日期、时间及地点"},{"key":"B","text":"统筹旅游行程，避免离开当天安排旅游者前往地域复杂或位置偏远景点"},{"key":"C","text":"送机（车、船）前安排自由活动"},{"key":"D","text":"提前与司机沟通交通情况，预留充足行车时间"},{"key":"E","text":"不要带领游客去不对外开放的地点旅游"}],"answer":"ABD","keys":["A","B","D"],"explanation":"导游应仔细确认班（轮）次、日期、时间及地点。当地若有多个机场、火车站或码头，还需进一步确认具体位置；导游应统筹旅游行程，避免离开当天安排旅游者前往地域复杂或位置偏远景点，以及在送机（车、船）前安排自由活动；导游提前与司机沟通交通情况，预留充足行车时间。","type":"多选题"},{"number":159,"stem":"境内旅游过程中，导游发现旅游者走失后，应该（ ）。","options":[{"key":"A","text":"向其他旅游者了解情况"},{"key":"B","text":"立即报警"},{"key":"C","text":"及时向旅行社报告"},{"key":"D","text":"全陪安排旅游者随行亲朋共同寻找"},{"key":"E","text":"地陪带团继续游览"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"1.了解情况与寻找：①向其他旅游者了解情况；②全陪安排旅游者随行亲朋/团队代表共同寻找；③联系景区、住宿经营者等可能有线索的接待者；④地陪带团继续游览。2.及时向旅行社报告。3.联系饭店。4.报警/报案。","type":"多选题"},{"number":160,"stem":"发现旅游者中暑，导游可采取的措施有（ ）。","options":[{"key":"A","text":"移至阴凉通风处，意识清醒者平躺干爽休息"},{"key":"B","text":"失去意识者坐姿休息，支撑头与肩部"},{"key":"C","text":"症状轻微可扇风散热，面色潮红发烧时用凉水擦拭身体降温"},{"key":"D","text":"解开患者衣领，放松裤带"},{"key":"E","text":"患者病症重，处理后症状未改善，及时送医"}],"answer":"CDE","keys":["C","D","E"],"explanation":"①移至阴凉通风处，意识清醒者坐姿休息，支撑头与肩部；失去意识者平躺干爽位置，解开衣领，放松裤带；②症状轻微可扇风散热，面色潮红发烧时用凉水擦拭身体降温；③症状未缓解，征询旅游者或亲友意见，服用自带防暑药物，进一步观察；④患者病症重，经处理后症状未改善，及时送往医院进一步治疗。","type":"多选题"},{"number":161,"stem":"将溺水旅游者救上岸后昏迷，导游应该（ ）。","options":[{"key":"A","text":"立即拨打 120，在接线人员的指导下，进行科学救护"},{"key":"B","text":"将溺水者仰卧置于地上，把头部置于侧位，以便水从口中流出"},{"key":"C","text":"迅速清理掉溺水者口鼻内的堵塞物，使其保持呼吸道畅通"},{"key":"D","text":"若发现溺水者尚有心跳，就应立即采用心肺复苏术进行施救"},{"key":"E","text":"快速判断是否还有呼吸"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"立即拨打 120是较好的办法。一方面可让救护车尽早赶到，另一方面可通过 120接线人员的指导，进行科学救护，避免溺水者遭受二次伤害；将失去知觉的溺水者仰卧置于地上，把头部置于侧位，以便水从口中流出；迅速清理掉溺水者口鼻内的堵塞物，使其保持呼吸道畅通；可将手掌平放在溺水者胸腹部上方作为参照，侧脸俯身观察胸腹部是否有起伏，时间约为 5-10 秒；若发现溺水者已经没有呼吸心跳，就应立即采用心肺复苏术进行施救。","type":"多选题"},{"number":162,"stem":"导游带团旅行过程中发生了泥石流，作为导游人员应该（ ）。","options":[{"key":"A","text":"若看到河床中正常流水断流或水流突然增大并伴有较多的柴草树木，要带领游客迅速撤离危险地域"},{"key":"B","text":"撤离时切勿与泥石流同向奔跑，而应迅速向两侧逃生"},{"key":"C","text":"不要停留在凹坡处，要尽可能加快向两侧高坡撤离"},{"key":"D","text":"如果时间来不及，要攀爬到树上躲避"},{"key":"E","text":"脱离险境后，选择平整的高地集合队伍，发送求救信息等待救援"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"泥石流前兆：若观察到河（沟）床中正常流水断流或水流突然增大并伴有较多的柴草树木，听到沟谷内传来类似火车轰鸣声或闷雷声，这表明沟谷上游可能已发生山洪泥石流。一旦发现有泥石流或山体滑坡迹象时，切勿与其同向奔跑，而应迅速向两侧逃生，即逃跑方向要与泥石流或山体滑坡方向成垂直方向，并且不要停留在凹坡处，要尽可能加快逃跑速度。若遭遇泥石流，可就近选择林木密集地带逃生，但不要攀爬到树上躲避。无论是遭遇泥石流还是山体滑坡，都应尽可能选择平整的高地集合队伍，然后发送求救信息并等待专业救援力量到达。","type":"多选题"},{"number":163,"stem":"旅途中不得不在雨中行走时，导游应注意的事项有（ ）。","options":[{"key":"A","text":"当路面有积水情况不明时，不可轻易踏足"},{"key":"B","text":"对于必经之路，要做好充分的探路工作，避免跌入窨井、地坑、沟渠等地"},{"key":"C","text":"尽量避开电线杆、路灯等含金属物体，防止因积水导电引发触电事故"},{"key":"D","text":"避开危险物体离临时搭建物、危旧墙体、高层建筑物确保行进路线安全"},{"key":"E","text":"当发现上游来水突然变得浑浊且水位快速上涨时，迅速引导旅游者向安全区域转移"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"本题各选项均为雨中行走时导游应注意的事项。","type":"多选题"},{"number":164,"stem":"民航局对于携带充电宝的规定，正确的是（ ）。","options":[{"key":"A","text":"充电宝必须是旅客个人自用携带"},{"key":"B","text":"功率>100Wh 且≤160Wh，无须经航空公司批准"},{"key":"C","text":"严禁在托运行李中携带"},{"key":"D","text":"严禁携带无 3C标识或标识不清的充电宝"},{"key":"E","text":"严禁在飞行过程中使用充电宝充电"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"充电宝必须是旅客个人自用携带；额定能量限制：≤100Wh；无须批准；>100Wh 且≤160Wh；经航空公司批准后可携带；附加限制：每名旅客携带总数不得超过 2个；严禁携带无 3C标识或标识不清的充电宝；严禁在飞行过程中使用充电宝充电。","type":"多选题"},{"number":165,"stem":"避免高原反应发生的预防工作有（ ）。","options":[{"key":"A","text":"禁止急速行走、跑步、体力劳动"},{"key":"B","text":"忌暴饮暴食、饮酒、吸烟"},{"key":"C","text":"每日补充 6000毫升液体"},{"key":"D","text":"佩戴防紫外线遮阳镜"},{"key":"E","text":"提前服用抗高反药（红景天/高原康/高原安）"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"禁止急速行走、跑步、体力劳动；忌暴饮暴食、饮酒、吸烟；每日补充 2000-3000毫升液体，佩戴防紫外线遮阳镜；提前服用抗高反药（红景天/高原康/高原安）。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD7/2b97e2461f5f76822e1d062d8d6926a0_852780904920182118_m_LDD押题第7卷（科目一二）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD7/2b97e2461f5f76822e1d062d8d6926a0_852780904920182118_m_LDD押题第7卷（科目一二）-试卷.pdf"},{"name":"科目三四","questions":[{"number":1,"stem":"青岛是我国啤酒产业的发源地，被中国酒业协会授予“中国啤酒之都”称号。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“青岛”应改为“哈尔滨”。哈尔滨是我国啤酒产业的发源地，被中国酒业协会授予“中国啤酒之都·哈尔滨”称号。易混对比——啤酒之城：· 哈尔滨：我国啤酒产业的发源地，获授“中国啤酒之都·哈尔滨”称号（黑龙江）；· 青岛：著名的青岛啤酒产地（山东）。","type":"判断题"},{"number":2,"stem":"应县木塔是我国现存最古、最高的一座木结构大塔。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。应县木塔是楼阁式塔的代表，是我国现存最古、最高的一座木结构大塔。同类对比——我国现存著名古塔：· 应县木塔：我国现存最古、最高的一座木结构大塔；· 嵩岳寺塔：河南登封，其建造标志着砖结构技术的巨大进步。","type":"判断题"},{"number":3,"stem":"2000年初，胡锦涛视察广东，提出了“三个代表”重要思想。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“胡锦涛”应改为“江泽民”。2000年初，江泽民视察广东，提出了“三个代表”重要思想。","type":"判断题"},{"number":4,"stem":"红茶制作的关键工序是杀青。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，红茶制作的关键是渥红（发酵）（不是杀青），以促进酶活性，使多酚类充分氧化；红茶出现于清朝，用全发酵法制成。易混对比——茶叶发酵程度与关键工序：· 绿茶：不发酵茶，初制时高温杀青；· 红茶：全发酵茶，关键工序是渥红（发酵）；· 青茶（乌龙茶）：半发酵茶；· 黄茶：轻发酵茶，采用杀青、焖黄方法制作。","type":"判断题"},{"number":5,"stem":"闽南方言称台湾为“大员”“台员”等，明洪武年间公文开始正式使用“台湾”称谓。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“明洪武年间”应改为“明万历年间”。由于迁居台湾的闽南人居多，闽南方言称台湾为“大员”“台员”等，明万历年间公文开始正式使用“台湾”称谓。","type":"判断题"},{"number":6,"stem":"北京人生活在距今 70万-20万年前，已经掌握人工取火技术。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，已经掌握人工取火技术的是山顶洞人（不是北京人）。北京人生活在距今 70万-20万年前，已发现 6个头盖骨和属于 40个男女个体的人体化石、10多万件石器和长期使用天然火的痕迹；山顶洞人已经掌握人工取火技术，会使用骨针缝制皮衣。易混对比——北京人与山顶洞人：· 北京人：生活在距今 70 万-20万年前；· 山顶洞人：已经掌握人工取火技术；· 山顶洞人：会使用骨针缝制皮衣，佩戴兽牙、石珠项链。","type":"判断题"},{"number":7,"stem":"三星堆遗址位于四川省广汉市，出土了大量精美的青铜器等文物，证明其属于汉代文化遗址。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，三星堆遗址出土的是商周时期古蜀国的青铜器和玉器、金器、陶器，并非汉代。三星堆遗址位于四川省广汉市，其出土的青铜器、玉器、金器、陶器，显示出当时的蜀文化丝毫不亚于北方的商周文化。易混对比——三星堆遗址：· 三星堆遗址：商周时期古蜀国遗址，位于四川省广汉市；· 青铜大立人像：高 260.8 厘米，世界现存最高、最完整的青铜立人像，号称“铜像之王”。","type":"判断题"},{"number":8,"stem":"新时代以来的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有里程碑意义。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。新时代以来的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有里程碑意义。同类对比——新时代伟大变革：· 五史：党史、新中国史、改革开放史、社会主义发展史、中华民族发展史；· 意义：新时代伟大变革具有里程碑意义。","type":"判断题"},{"number":9,"stem":"唐宋八大家（韩愈、柳宗元、欧阳修、王安石、苏洵、苏轼、苏辙、白居易）中宋占其六。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，唐宋八大家中宋占其六，但末位应是曾巩（不是白居易）；白居易是唐代著名诗人，不在唐宋八大家之列。易混对比——唐宋八大家：· 唐代：韩愈、柳宗元；· 宋代：欧阳修、王安石、苏洵、苏轼、苏辙、曾巩。","type":"判断题"},{"number":10,"stem":"西安有 3100多年建城史和 1100多年国都史，先后有 14 个封建王朝在此建都。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“14个”应改为“13 个”。西安有 3100多年建城史和 1100 多年国都史，先后有 13 个封建王朝在此建都。陕西全省则先后共有西周、秦、汉、西晋、隋、唐等14个政权在陕西建都。易混对比——建都数字：· 西安：3100多年建城史、1100多年国都史，先后有 13个封建王朝在此建都（陕西）；· 陕西全省：先后共有西周、秦、汉、西晋、隋、唐等 14 个政权建都；· 洛阳：十三朝古都，有 5000多年文明史、1500多年建都史（河南）。","type":"判断题"},{"number":11,"stem":"楷书之祖是东晋王羲之，他与汉末三国人钟繇合称“钟王”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，楷书之祖是汉末三国人钟繇（不是东晋王羲之），他与东晋王羲之合称“钟王”。易混对比——钟繇与王羲之：· 钟繇：汉末三国人，楷书之祖；· 王羲之：东晋人，世称“书圣”；· “钟王”：钟繇与王羲之的合称。","type":"判断题"},{"number":12,"stem":"大理古城被联合国教科文组织高度评价为“展示了一幅非同寻常的文化、经济、社会及宗教发展的完整画卷”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“大理古城”应改为“平遥古城”。平遥古城被联合国教科文组织高度评价为“展示了一幅非同寻常的文化、经济、社会及宗教发展的完整画卷”。平遥古城有“龟城”之称，街道格局为“土”字形，整体布局遵从八卦方位，体现了明清时期城市规划理念和形制分布。城内外有各类遗址、古建筑 300多处，保存完整的明清民宅近 4000座，街道商铺都体现历史原貌，被称作研究中国古代城市的活样本。易混对比——平遥古城（山西）：· 平遥古城：有“龟城”之称，街道格局为“土”字形，整体布局遵从八卦方位；· 明清民宅：保存完整的明清民宅近 4000座，被称作研究中国古代城市的活样本；· 联合国教科文组织评价：“展示了一幅非同寻常的文化、经济、社会及宗教发展的完整画卷”。","type":"判断题"},{"number":13,"stem":"铸牢中华民族共同体意识，要引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。铸牢中华民族共同体意识，就是要引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念，把铸牢中华民族共同体意识作为新时代党的民族工作和民族地区各项工作的主线。同类对比——共同体理念：· 四个与共：休戚与共、荣辱与共、生死与共、命运与共；· 主线：铸牢中华民族共同体意识。","type":"判断题"},{"number":14,"stem":"上海迪士尼的标志性建筑为高 69米的奇幻童话城堡，融合牡丹、祥云等中国元素，是亚洲最高的迪士尼城堡。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“亚洲最高”应改为“全球最高”。上海迪士尼标志性建筑为高 69米的奇幻童话城堡，融合牡丹、祥云等中国元素，是全球最高的迪士尼城堡。上海迪士尼乐园是中国内地首座、亚洲第三个、全球第六个迪士尼主题乐园，以“原汁原味迪士尼，别具一格中国风”为特色。易混对比——迪士尼乐园：· 上海迪士尼：中国内地首座、亚洲第三个、全球第六个，奇幻童话城堡高 69米为全球最高迪士尼城堡；· 香港迪士尼：全球第 5 座、亚洲第 2 座、中国第 1 座迪士尼乐园。","type":"判断题"},{"number":15,"stem":"绝句、律诗一律押平声韵，不换韵，“押韵”也叫“叶韵”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。这是近体诗的押韵规则：绝句、律诗一律押平声韵，不换韵。“押韵”也叫“吐韵”；平起的诗首句起韵，仄起的诗第二句起韵，其下都是隔句押韵。","type":"判断题"},{"number":16,"stem":"潮州湘子桥初建于宋代，是我国第一座启闭式桥梁。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。湘子桥又称广济桥，位于潮州古城的东门外，初建于宋代，距今已有 800余年的历史，是我国第一座启闭式桥梁。同类对比——我国古代名桥：· 湘子桥（广济桥）：位于潮州，我国第一座启闭式桥梁；· 赵州桥：隋代建造，世界上最早的敞肩石拱桥；· 卢沟桥：位于北京，始建于金代，是北京现存最古老的联拱石桥。","type":"判断题"},{"number":17,"stem":"日本的传统文化以“三道”即茶道、花道、剑道为代表。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，日本传统文化“三道”指茶道、花道、书道（不是剑道）。","type":"判断题"},{"number":18,"stem":"广西西隔北部湾与越南相对，东面和南面在南海中与菲律宾、文莱、印度尼西亚和马来西亚为邻。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“广西”应改为“海南”。海南西隔北部湾与越南相对，东面和南面在南海中与菲律宾、文莱、印度尼西亚和马来西亚为邻。易混对比——海南与广西区位：· 海南：西隔北部湾与越南相对，东面和南面在南海中与菲律宾、文莱、印度尼西亚和马来西亚为邻；· 广西：西南与越南接壤，有“广西盆地”之称。","type":"判断题"},{"number":19,"stem":"龙凤旗袍制作代表了京派旗袍手工制作技艺的最高水平，每一件都承载着“指尖上的非遗”匠心。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“京派旗袍”应改为“海派旗袍”。龙凤旗袍制作代表了海派旗袍手工制作技艺的最高水平，属于国家级非遗，其核心在于全手工、个性化精工定制。易混对比——旗袍：· 龙凤旗袍：代表海派旗袍手工制作技艺的最高水平，属国家级非遗（上海）；· 旗袍：已成为中国传统女装，吉林省是满族的发源地之一。","type":"判断题"},{"number":20,"stem":"西夏陵是西夏王朝的陵墓遗址群，是现存规模最大、等级最高、保存最完整的一处西夏文化遗址。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。西夏陵（又称西夏王陵）是西夏王朝的陵墓遗址群，位于宁夏银川市西，是现存规模最大、等级最高、保存最完整的一处西夏文化遗址。西夏陵分布范围近40平方千米，包含 9 座帝陵、271处陪葬墓，2025年 7 月 11 日被正式列入《世界遗产名录》。西夏陵的陵寝制度承袭唐宋帝陵传统，又吸收佛教建筑与党项、吐蕃、回鹘等多元文化影响，构成中国陵园建筑中别具一格的形式，故有“东方金字塔”之称。","type":"判断题"},{"number":21,"stem":"大连冬无严寒，夏无酷暑，每年空气质量优良天数在 300天以上，对休养疗养十分有利。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。大连冬无严寒，夏无酷暑，每年空气质量优良天数在 300天以上，对休养疗养十分有利。大连是中国最佳旅游城市，理想的旅游、度假和避暑胜地。","type":"判断题"},{"number":22,"stem":"泉州是我国首届“东亚文化之都”，也是全国著名侨乡和台湾省汉族同胞主要祖籍地。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。泉州简称“泉”或“鲤”，是我国首批历史文化名城，是世界闽南文化的发祥地，是首届“东亚文化之都”，也是全国著名侨乡和台湾省汉族同胞主要祖籍地。泉州港古称“刺桐港”，是中国古代海上丝绸之路起点之一。","type":"判断题"},{"number":23,"stem":"嘉兴南湖是中国共产党的诞生地和“红船精神”的发源地。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。嘉兴南湖是中国共产党的诞生地和“红船精神”的发源地，1921年中共一大在此闭幕，庄严宣告了中国共产党的成立。","type":"判断题"},{"number":24,"stem":"1966 年 10 月 27 日，我国自行研制的东风二号核导弹试爆成功，标志着“两弹”成功结合。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1966年 10月 27日，我国自行研制的东风二号核导弹试爆成功，标志着“两弹”成功结合，中国有了可用于实战的核导弹。同类对比——“两弹一星”重大成就：· 1964年 10 月 16日：我国第一颗原子弹爆炸成功；· 1966年 10 月 27日：东风二号核导弹试爆成功，标志“两弹”成功结合；· 1967年 6 月 17 日：我国第一颗氢弹空爆试验成功。","type":"判断题"},{"number":25,"stem":"距今约 6000 年的磁山文化是仰韶文化的源头，其出土的家鸡骨骼是已知世界上最早的家鸡。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“6000 年”应改为“8000 年”。磁山文化，距今约 8000年，是仰韶文化的源头。其出土的家鸡骨骼是已知世界上最早的家鸡。同类对比——史前文化遗址：· 磁山文化：距今约 8000年，仰韶文化的源头，出土世界最早家鸡骨骼（河北）；· 红山文化：距今 6500~5000 年，出土“中华第一龙”玉龙（内蒙古）；· 半坡遗址：距今 6000年前的仰韶文化遗址（陕西）；· 西侯度遗址：人类用火历史追溯至距今约 243万年（山西）。","type":"判断题"},{"number":26,"stem":"五行相生的顺序是：金克木，木克土，土克水，水克火，火克金。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，金克木、木克土、土克水、水克火、火克金是五行相克（不是五行相生）；五行相生为：金生水，水生木，木生火，火生土，土生金。易混对比——五行相生与五行相克：· 五行相生：金生水，水生木，木生火，火生土，土生金；· 五行相克：金克木，木克土，土克水，水克火，火克金；· 五行：金、木、水、火、土。","type":"判断题"},{"number":27,"stem":"百团大战是全国抗战以来八路军在华北发动的规模最大、持续时间最长的一次带战略性进攻的战役。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1940 年 8 月 20 日至 1941 年 1 月 24 日，八路军总部在华北发动了一次对日军大规模的进攻，陆续参战的部队达到 105个团 20余万人，史称“百团大战”，是全国抗战以来八路军在华北发动的规模最大、持续时间最长的一次带战略性进攻的战役，作战 1824次，毙伤日、伪军 2.5万人，打击了日军的侵略气焰，在抗战局面比较低迷时振奋了全国民心。同类对比——抗日战争重要战役：· 平型关大捷：1937年 9月，全民族抗战爆发后中国军队主动对日作战取得的第一个重大胜利；· 台儿庄战役：1938年取得胜利，粉碎日本帝国主义“三个月灭亡中国”的计划；· 百团大战：1940年 8月在华北发动，是规模最大、持续时间最长的战略性进攻战役。","type":"判断题"},{"number":28,"stem":"因澳门南湾地区盛产生蚝，澳门古称“蚝镜澳”，大意就是生蚝港，自古以生蚝命名。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。因为澳门南湾地区盛产生蚝，澳门古称“蚝镜澳”，大意就是生蚝港，自古以生蚝命名，今天澳门的“焜生蚝”远近闻名。","type":"判断题"},{"number":29,"stem":"中国于 1985年 12 月 12 日正式加入《保护世界文化与自然遗产公约》。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。中国于 1985年 12月 12 日正式加入《保护世界文化与自然遗产公约》。同类对比——世界遗产制度时间线：· 1985年 12 月 12日：中国正式加入《保护世界文化与自然遗产公约》；· 1986年：中国开始向联合国教科文组织申报世界遗产项目；· 1999年 10 月 29日：中国当选世界遗产委员会成员；· 每年 6 月第二个星期六：中国文化遗产日。","type":"判断题"},{"number":30,"stem":"北宋景德年间，昌南镇烧制的瓷器被选为贡品，宋真宗以年号“景德”赐名，即今天的景德镇。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。北宋景德年间，昌南镇烧制的瓷器被选为贡品，宋真宗以年号“景德”赐名。景德镇陶瓷以白瓷著称，素有“白如玉，明如镜，薄如纸，声如馨”之誉。同类对比——江西“四个千年”（江西）：· 千年瓷都：景德镇；· 千年名楼：滕王阁；· 千年书院：白鹿洞；· 千年古刹：东林寺。","type":"判断题"},{"number":31,"stem":"山东是全国唯一拥有全部 41 个工业大类的省份。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。山东省产业体系完备，是全国唯一拥有全部 41个工业大类的省份。","type":"判断题"},{"number":32,"stem":"党的十九大把习近平新时代中国特色社会主义思想写入党章，并确立为党的指导思想。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。党的十九大把党的十八大以来党的理论创新成果明确概括为习近平新时代中国特色社会主义思想，并确立为党的指导思想。同类对比——党的指导思想写入党章历程：· 党的十五大：把邓小平理论作为党的指导思想写入党章；· 党的十六大：把“三个代表”重要思想写入党章；· 党的十八大：把科学发展观确立为党的指导思想；· 党的十九大：把习近平新时代中国特色社会主义思想写入党章并确立为党的指导思想。","type":"判断题"},{"number":33,"stem":"北京故宫是世界上现存规模最大、最完整的古代木构建筑群。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。北京故宫位于北京市中心，是世界上现存规模最大、最完整的古代木构建筑群，始建于 1406年，历时 14年才完工，为明清两代的皇宫。同类对比——著名宫殿建筑群：· 北京故宫：世界上现存规模最大、最完整的古代木构建筑群；· 沈阳故宫：与北京故宫同为明清宫殿建筑群实例；· 布达拉宫：宫堡式建筑群，始建于 7 世纪吐蕃赞普松赞干布时期。","type":"判断题"},{"number":34,"stem":"中国共产党第一次全国代表大会确定党的名称为“中国共产党”，选举产生了以李大钊为书记的中央局。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，中共一大选举产生了以陈独秀（不是李大钊）为书记的中央局。大会确定党的名称为“中国共产党”，通过了中国共产党第一个纲领。易混对比——中共一大相关史实：· 中共一大：确定党的名称为“中国共产党”；· 中央局：一大选举产生以陈独秀为书记的中央局；· 陈独秀：1920年上海共产党组织成立时任书记。","type":"判断题"},{"number":35,"stem":"浚县正月古庙会被誉为“华北第一古庙会”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。浚县正月古庙会被誉为“华北第一古庙会”。宝丰马街书会是中国规模最大的露天曲艺集会，被誉为“中国曲艺史活化石”。同类对比——河南民俗盛会（河南）：· 浚县正月古庙会：“华北第一古庙会”；· 宝丰马街书会：中国规模最大的露天曲艺集会，被誉为“中国曲艺史活化石”。","type":"判断题"},{"number":36,"stem":"紫貂是国家一级保护动物，其毛皮堪称裘皮之冠。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。紫貂是国家一级保护动物，其毛皮堪称裘皮之冠。同类对比——东北“三宝”：· 人参：长白山人参因形状酷似人形而得名，吉林人参产量占全国 60%（吉林）；· 貂皮：紫貂毛皮堪称“裘皮之冠”（吉林）；· 鹿茸角：吉林著名特产，“东北三宝”之一（吉林）。","type":"判断题"},{"number":37,"stem":"火药在唐末开始用于军事，宋代甚至出现“霹雳炮”“震天炮”等火器。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。火药的发明与道士炼丹有关，唐代孙思邈曾经记载用硫黄、硝石和木炭制造火药，唐末火药就开始用于军事，宋代甚至出现“霹雳炮”“震天炮”等火器。同类对比——中国古代四大发明：· 造纸术：东汉蔡伦改进造纸法，造出“蔡侯纸”；· 印刷术：目前所见最早的印刷品为唐代《金刚经》（868年），称雕版印刷；· 火药：唐代孙思邈曾记载制法，唐末开始用于军事，宋代出现“霹雳炮”“震天炮”等火器。","type":"判断题"},{"number":38,"stem":"天津的历史遗迹是城市近代史与中国近代史的缩影和有力见证，故有“看近代史到天津”的说法。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。天津的历史遗迹是城市近代史与中国近代史的缩影和有力见证，故有“看近代史到天津”的说法。","type":"判断题"},{"number":39,"stem":"《南京条约》是中国近代史上第一个不平等条约，被迫割让香港岛给英国。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1842 年清朝签订中国近代史上第一个不平等条约《南京条约》，被迫割让香港岛，向英国赔款，开放广州、福州、厦门、宁波、上海五处为通商口岸，并丧失关税自主权。同类对比——鸦片战争与《南京条约》：· 鸦片战争：1840年英国为打开中国市场发动；· 《南京条约》：1842年签订，中国近代史上第一个不平等条约；· 《南京条约》内容：被迫割让香港岛，开放广州、福州、厦门、宁波、上海五处为通商口岸。","type":"判断题"},{"number":40,"stem":"原始神话是我国浪漫主义文学的源头。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。原始神话是我国浪漫主义文学的源头，《女娲补天》《夸父逐日》《后羿射日》《嫦娥奔月》等著名神话大多保存在先秦诸子散文及《楚辞》《山海经》《淮南子》等著作中。二、单选题","type":"判断题"},{"number":41,"stem":"“人生自古谁无死？留取丹心照汗青”出自文天祥的（ ）。","options":[{"key":"A","text":"《指南录》"},{"key":"B","text":"《正气歌》"},{"key":"C","text":"《过零丁洋》"},{"key":"D","text":"《金陵驿》"}],"answer":"C","keys":["C"],"explanation":"答案选 C。“人生自古谁无死？留取丹心照汗青”出自文天祥《过零丁洋》。","type":"单选题"},{"number":42,"stem":"我国雾凇出现最多的城市是（ ）。","options":[{"key":"A","text":"大连市"},{"key":"B","text":"吉林市"},{"key":"C","text":"哈尔滨市"},{"key":"D","text":"沈阳市"}],"answer":"B","keys":["B"],"explanation":"答案选 B。我国雾凇出现最多的是吉林省吉林市，每当雾凇来临，吉林市松花江岸十里长堤成为“忽如一夜春风来，千树万树梨花开”的仙境；我国峨眉山雨凇最多，庐山雨凇著称“玻璃世界”。同类对比——气象奇观：· 雾凇：我国出现最多的城市是吉林省吉林市；· 吉林雾凇：松花江岸十里长堤“忽如一夜春风来，千树万树梨花开”；· 蜃景：山东蓬莱出现次数最多。","type":"单选题"},{"number":43,"stem":"科举制正式创立的标志是隋炀帝时设立（ ）。","options":[{"key":"A","text":"进士科"},{"key":"B","text":"秀才科"},{"key":"C","text":"明法科"},{"key":"D","text":"明经科"}],"answer":"A","keys":["A"],"explanation":"答案选 A。隋文帝罢中正官，隋炀帝时又设进士科，允许士人自由报考，标志着科举制正式创立。易混对比——中国古代选官制度：· 汉代：实行察举制和征辟制；· 魏晋：实行九品中正制，出现“上品无寒门，下品无士族”现象；· 隋朝：隋炀帝设进士科，标志科举制正式创立。","type":"单选题"},{"number":44,"stem":"被誉为“东方雕塑陈列馆”的世界文化遗产是（ ）。","options":[{"key":"A","text":"莫高窟"},{"key":"B","text":"云冈石窟"},{"key":"C","text":"天水麦积山石窟"},{"key":"D","text":"龙门石窟"}],"answer":"C","keys":["C"],"explanation":"世界文化遗产麦积山石窟被誉为“东方雕塑陈列馆”，凌空栈道惊险奇绝。A 项莫高窟在敦煌，B 项云冈石窟在大同，D 项龙门石窟在洛阳，被誉为“东方雕塑陈列馆”的世界文化遗产为天水麦积山石窟，故不选。易混对比——石窟著称：· 麦积山石窟：“东方雕塑陈列馆”（甘肃）；· 天梯山石窟：“石窟鼻祖”（甘肃）；· 莫高窟：“世界艺术宝库”（甘肃）；· 云冈石窟：三大佛教石窟中承前启后的艺术瑰宝（山西）。","type":"单选题"},{"number":45,"stem":"我国民族分布的格局是（ ）。","options":[{"key":"A","text":"按省聚居"},{"key":"B","text":"大聚居、小杂居"},{"key":"C","text":"大杂居、小聚居、交错居住"},{"key":"D","text":"完全混居"}],"answer":"C","keys":["C"],"explanation":"答案选 C。在少数民族聚居区，一般都有一定数量的汉族居民，从而形成了大杂居、小聚居、交错居住的格局。","type":"单选题"},{"number":46,"stem":"中秋节得名是因为（ ）。","options":[{"key":"A","text":"为庆祝秋季丰收"},{"key":"B","text":"为祭祀月神"},{"key":"C","text":"时间在每年阴历八月十五，恰值三秋之中"},{"key":"D","text":"为纪念嫦娥奔月"}],"answer":"C","keys":["C"],"explanation":"答案选 C。中秋节的时间在每年阴历八月十五，恰值三秋之中，故名；在中国人心目中，中秋节是象征团圆的传统节日。同类对比——传统节日得名：· 中秋节：阴历八月十五恰值三秋之中，又名团圆节、仲秋节；· 端午节：农历五月初五，以纪念屈原说影响最为广泛；· 重阳节：农历九月初九，“九”为阳数之极，两阳数相重谓之“重阳”。","type":"单选题"},{"number":47,"stem":"下列城市中，不属于《南京条约》规定开放的通商口岸的是（ ）。","options":[{"key":"A","text":"广州"},{"key":"B","text":"福州"},{"key":"C","text":"天津"},{"key":"D","text":"宁波"}],"answer":"C","keys":["C"],"explanation":"1842 年，清政府在中英鸦片战争中战败，被迫签订《南京条约》，规定开放广州、福州、厦门、宁波、上海五处为通商口岸；天津于 1860年（第二次鸦片战争后）被辟为通商口岸。A 项广州、B项福州、D项宁波均在《南京条约》五口通商之列，C 项天津不在其中，故本题选 C。易混对比——近代开埠：· 1842年《南京条约》：开放广州、福州、厦门、宁波、上海五处为通商口岸；· 1843年 11 月 17日：上海正式对外开埠；· 1860年：天津被辟为通商口岸。","type":"单选题"},{"number":48,"stem":"下列名胜中，位于河南开封的是（ ）。","options":[{"key":"A","text":"白马寺"},{"key":"B","text":"大相国寺"},{"key":"C","text":"少林寺"},{"key":"D","text":"中岳庙"}],"answer":"B","keys":["B"],"explanation":"同类对比——河南名寺古建（河南）：· 大相国寺：开封核心景点；· 白马寺：在洛阳，佛教传入后第一座官办寺院；· 少林寺、中岳庙：登封“天地之中”历史建筑群组成部分。","type":"单选题"},{"number":49,"stem":"既是一部生动的“地质教科书”，又是一座天然的“地质博物馆”的风景名胜区是（ ）。","options":[{"key":"A","text":"野三坡风景名胜区"},{"key":"B","text":"苍岩山风景名胜区"},{"key":"C","text":"崆山白云洞"},{"key":"D","text":"娲皇宫景区"}],"answer":"A","keys":["A"],"explanation":"野三坡风景名胜区，是一部生动的地质教科书，又是一座天然的地质博物馆。它还是中国北方极为罕见的集雄山碧水、奇峡怪泉、文物古迹、名树古刹于一身的风景名胜区。同类对比——河北名胜（河北）：· 野三坡：生动的“地质教科书”，天然的“地质博物馆”；· 白石山：中国唯一的大理岩峰林景观；· 白洋淀：中国海河平原上最大的湖泊，“华北明珠”；· 西柏坡：党的七届二中全会召开地，“两个务必”诞生地。","type":"单选题"},{"number":50,"stem":"“中华民族”概念被广泛使用的时期是（ ）。","options":[{"key":"A","text":"秦汉时期"},{"key":"B","text":"隋唐时期"},{"key":"C","text":"抗日战争时期"},{"key":"D","text":"新中国成立后"}],"answer":"C","keys":["C"],"explanation":"答案选 C。抗日战争时期，“中华民族”概念被广泛使用，成为团结全国各族人民的精神旗帜。","type":"单选题"},{"number":51,"stem":"我国第一座佛教寺庙是（ ）。","options":[{"key":"A","text":"白马寺"},{"key":"B","text":"少林寺"},{"key":"C","text":"悬空寺"},{"key":"D","text":"灵隐寺"}],"answer":"A","keys":["A"],"explanation":"答案选 A。东汉永平十年（67年），汉明帝邀请印度僧人迦叶摩腾与竺法兰来华，二人以白马驮经抵达洛阳，次年敕建白马寺，此为中国第一座佛教寺庙，二人所译《四十二章经》是中国现存最早的汉译佛经。B 少林寺以中华武术和禅宗著称；C 悬空寺为恒山人文景观之最，徐霞客称之为“天下巨观”；D灵隐寺的素斋享有盛名。易混对比——佛教初传中国：· 东汉永平十年（67年）：汉明帝邀请印度僧人迦叶摩腾与竺法兰来华；· 白马驮经：二人以白马驮经抵达洛阳传法、译经；· 白马寺：次年敕建，为中国第一座佛教寺庙。","type":"单选题"},{"number":52,"stem":"中国古代最早采用的纪年法是（ ）。","options":[{"key":"A","text":"公元纪年"},{"key":"B","text":"帝王纪年法"},{"key":"C","text":"年号纪年法"},{"key":"D","text":"干支纪年法"}],"answer":"B","keys":["B"],"explanation":"答案选 B。中国古代最早采用的是帝王纪年法，即帝王登基那一年算起，有一年算一年；西汉武帝时开始采用年号纪年。易混对比——古代纪年法：· 帝王纪年法：中国古代最早采用，从帝王登基那一年算起；· 年号纪年法：西汉武帝时开始采用，改年号叫“改元”；· 共和行政：自公元前 841 年起，中国历史有了确切的纪年。","type":"单选题"},{"number":53,"stem":"泰国人忌讳用（ ）服务或用其吃东西。","options":[{"key":"A","text":"右手"},{"key":"B","text":"左手"},{"key":"C","text":"双手"},{"key":"D","text":"筷子"}],"answer":"B","keys":["B"],"explanation":"答案选 B。泰国人进入寺庙及进入他人房间前要脱鞋，忌讳用左手服务或用左手吃东西；泰国僧侣不可与女性进行身体接触，除僧侣外任何人不能触摸他人头部。同类对比——泰国礼俗禁忌：· 脱鞋：进入寺庙及进入他人房间前要脱鞋；· 左手：忌讳用左手服务或用左手吃东西；· 僧侣：不可与女性进行身体接触。","type":"单选题"},{"number":54,"stem":"世界上线路最长、标准最高的高速铁路是（ ）。","options":[{"key":"A","text":"京沪高铁"},{"key":"B","text":"京张高铁"},{"key":"C","text":"成渝高铁"},{"key":"D","text":"京津城际铁路"}],"answer":"A","keys":["A"],"explanation":"答案选 A。2011年运营的京沪高铁，全长 1318公里、运行时速 350公里，是世界上线路最长、标准最高的高速铁路；2008年开通的京津城际铁路是中国第一条高速铁路。同类对比——我国高速铁路成就：· 京沪高铁：2011年运营，全长 1318公里，是世界上线路最长、标准最高的高速铁路；· 京津城际铁路：2008年开通，是中国第一条高速铁路；· 六次大提速：1997-2007 年，中国铁路创造了世界上既有线路提速改造的先进水平。","type":"单选题"},{"number":55,"stem":"我国第一部针灸学著作《针灸甲乙经》的作者是（ ）。","options":[{"key":"A","text":"王叔和"},{"key":"B","text":"孙思邈"},{"key":"C","text":"李时珍"},{"key":"D","text":"皇甫谧"}],"answer":"D","keys":["D"],"explanation":"答案选 D。皇甫谧著《针灸甲乙经》，是我国第一部针灸学著作。A 西晋王叔和著《脉经》，是我国最早的脉学著作；B 孙思邈是唐朝名医，著《千金方》；C李时珍是明朝药物学家，著《本草纲目》。易混对比——古代医学名著：· 《针灸甲乙经》：西晋皇甫谧著，我国第一部针灸学著作；· 《脉经》：西晋王叔和著，我国最早的脉学著作；· 《千金方》：唐朝孙思邈著；· 《本草纲目》：明朝李时珍著。","type":"单选题"},{"number":56,"stem":"党的十一届三中全会召开的时间是（ ）。","options":[{"key":"A","text":"1976年 10 月"},{"key":"B","text":"1978年 12 月 18-22 日"},{"key":"C","text":"1980年 2 月"},{"key":"D","text":"1982年 9 月"}],"answer":"B","keys":["B"],"explanation":"答案选 B。1978年 12 月 18-22 日，党的十一届三中全会在北京举行，会议的主要任务是确定把全党工作重点转移到社会主义现代化建设上来。同类对比——党史重要会议：· 中共一大：1921年 7月 23日在上海召开；· 遵义会议：1935年 1月 15-17日，中共中央在遵义召开政治局扩大会议；· 十一届三中全会：1978年 12 月 18-22 日在北京举行。","type":"单选题"},{"number":57,"stem":"北宋范仲淹脍炙人口的（ ）使岳阳楼著称于世。","options":[{"key":"A","text":"《岳阳楼记》"},{"key":"B","text":"《醉翁亭记》"},{"key":"C","text":"《游褒禅山记》"},{"key":"D","text":"《前赤壁赋》"}],"answer":"A","keys":["A"],"explanation":"答案选 A。岳阳楼位于湖南岳阳，自古有“洞庭天下水，岳阳天下楼”之誉，北宋范仲淹脍炙人口的《岳阳楼记》更使岳阳楼著称于世；其屋顶为四坡盔顶，是我国现存最大、最著名的盔顶建筑。B《醉翁亭记》是欧阳修的名篇；C《游褒禅山记》是王安石的名篇；D《前赤壁赋》是苏轼的名篇。易混对比——江南名楼与名篇：· 岳阳楼：湖南岳阳，范仲淹《岳阳楼记》，“洞庭天下水，岳阳天下楼”；· 滕王阁：王勃《滕王阁序》，“落霞与孤鹜齐飞，秋水共长天一色”；· 黄鹤楼：崔颢“昔人已乘黄鹤去，此地空余黄鹤楼”。","type":"单选题"},{"number":58,"stem":"位居景德镇四大传统名瓷之首，享有“瓷国明珠”之美誉的是（ ）。","options":[{"key":"A","text":"粉彩瓷"},{"key":"B","text":"颜色釉瓷"},{"key":"C","text":"青花瓷"},{"key":"D","text":"玲珑瓷"}],"answer":"C","keys":["C"],"explanation":"答案选 C。青花瓷、玲珑瓷、粉彩瓷、颜色釉瓷并称为景德镇四大传统名瓷，其中青花瓷烧造历史最为悠久，位居四大名瓷之首，享有“瓷国明珠”之美誉。易混对比——景德镇四大传统名瓷：· 青花瓷：位居四大名瓷之首，享有“瓷国明珠”之美誉；· 玲珑瓷：四大传统名瓷之一；· 粉彩瓷：四大传统名瓷之一；· 颜色釉瓷：四大传统名瓷之一。","type":"单选题"},{"number":59,"stem":"长城的设施中，遇敌情时白天燃烟、夜间放火的是（ ）。","options":[{"key":"A","text":"关隘"},{"key":"B","text":"城墙"},{"key":"C","text":"敌台"},{"key":"D","text":"烽火台"}],"answer":"D","keys":["D"],"explanation":"答案选 D。烽火台是利用举火和燃烟来传达军情的高台建筑，一般都筑在长城附近的小山包上，如遇敌情，白天燃烟，夜间放火，并以鸣炮的数目告知来敌的大致数目，台台相传，通报敌情消息。同类对比——长城军事防御设施：· 城墙：长城的建筑主体，外侧一面设垛口墙、望口、射洞；· 敌台：骑跨城墙突兀于墙外，可以从侧向射击敌人；· 烽火台：白天燃烟、夜间放火传达军情；· 关隘：长城沿线重要据点，扼守出入长城的咽喉要道。","type":"单选题"},{"number":60,"stem":"秦在关中修建的、主要用于农业灌溉的水利工程是（ ）。","options":[{"key":"A","text":"郑国渠"},{"key":"B","text":"都江堰"},{"key":"C","text":"灵渠"},{"key":"D","text":"邗沟"}],"answer":"A","keys":["A"],"explanation":"答案选 A。秦在关中修建郑国渠，在蜀郡修建都江堰，主要用于农业灌溉，使关中平原和成都平原成为沃野。B 都江堰由秦蜀郡守李冰主持修建，位于蜀郡；C 灵渠是秦南征岭南时开凿；D邗沟是春秋时期吴国开凿的沟通长江和淮河的运河。同类对比——古代著名水利工程：· 郑国渠：秦在关中修建，主要用于农业灌溉；· 都江堰：秦在蜀郡修建，使成都平原成为沃野；· 灵渠：秦朝开凿；· 邗沟：春秋时期吴国开凿。","type":"单选题"},{"number":61,"stem":"中国“天空之镜”指的是（ ）。","options":[{"key":"A","text":"青海湖"},{"key":"B","text":"茶卡盐湖"},{"key":"C","text":"东台吉乃尔湖"},{"key":"D","text":"察尔汗盐湖"}],"answer":"B","keys":["B"],"explanation":"中国“天空之镜”——茶卡盐湖。A 项青海湖是我国最大的内陆咸水湖，C 项东台吉乃尔湖称青海版“马尔代夫”，D 项察尔汗盐湖是中国最大的盐湖，而“天空之镜”指茶卡盐湖，故不选。易混对比——青海湖泊盐湖：· 青海湖：我国最大的内陆咸水湖；· 茶卡盐湖：中国“天空之镜”；· 东台吉乃尔湖：青海版“马尔代夫”；· 察尔汗盐湖：中国最大的盐湖（面积超 5800平方千米）。","type":"单选题"},{"number":62,"stem":"中国园林发展的转折点是（ ）。","options":[{"key":"A","text":"宋元时期"},{"key":"B","text":"秦汉时期"},{"key":"C","text":"魏晋南北朝时期"},{"key":"D","text":"隋唐时期"}],"answer":"C","keys":["C"],"explanation":"答案选 C。魏晋南北朝时期是中国园林发展的转折点；唐宋时期园林达到成熟阶段，明清时期园林艺术进入精深发展阶段。同类对比——中国古典园林发展阶段：· 魏晋南北朝时期：中国园林发展的转折点；· 唐宋时期：园林达到成熟阶段；· 明清时期：园林艺术进入精深发展阶段。","type":"单选题"},{"number":63,"stem":"被誉为“中国楹联第一村”的古村是（ ）。","options":[{"key":"A","text":"宏村"},{"key":"B","text":"西递"},{"key":"C","text":"诸葛八卦村"},{"key":"D","text":"囊底下村"}],"answer":"B","keys":["B"],"explanation":"正确答案为 B。西递以楹联文化为最大特色，被誉为“中国楹联第一村”。26版教材新增考点。易混对比——西递与宏村特色：· 西递：船形村落，以楹联文化著称；· 宏村：牛形水系，月沼为牛胃南湖为牛肚；区分关键：“中国楹联第一村”是西递；宏村以牛形水系和“中国画里的乡村”著称。","type":"单选题"},{"number":64,"stem":"韩国人一日三餐都离不开泡菜，韩国的主食是（ ）。","options":[{"key":"A","text":"大米"},{"key":"B","text":"玉米"},{"key":"C","text":"土豆"},{"key":"D","text":"面食"}],"answer":"A","keys":["A"],"explanation":"答案选 A。韩国食物以泡菜文化为特色，主食是大米，传统名菜有烤肉、泡菜、冷面。同类对比——韩国饮食文化：· 泡菜：韩国人一日三餐都离不开；· 主食：大米；· 传统名菜：烤肉、泡菜、冷面。","type":"单选题"},{"number":65,"stem":"“楚庭”是（ ）最早的名称。","options":[{"key":"A","text":"潮州市"},{"key":"B","text":"惠州市"},{"key":"C","text":"肇庆市"},{"key":"D","text":"广州市"}],"answer":"D","keys":["D"],"explanation":"“楚庭”是广州最早的名称，公元 226年，孙权将交州分为交州和广州，“广州”由此得名。","type":"单选题"},{"number":66,"stem":"陕西盛产苹果，成为陕西优质苹果代名词的是（ ）。","options":[{"key":"A","text":"洛川苹果"},{"key":"B","text":"米脂小米"},{"key":"C","text":"富平柿饼"},{"key":"D","text":"临潼石榴"}],"answer":"A","keys":["A"],"explanation":"陕西盛产苹果，洛川苹果成为陕西优质苹果的代名词。B项米脂小米、C 项富平柿饼均为陕西风物特产，D项临潼石榴为干扰项，成为陕西优质苹果代名词者为洛川苹果，故不选。同类对比——陕西风物（陕西）：· 洛川苹果：陕西优质苹果的代名词；· 米脂小米：颗粒圆大、色泽金黄、黏糯爽口、清香四溢；· 富平柿饼：白里透红、清甜软糯，远销海内外。","type":"单选题"},{"number":67,"stem":"法国最古老的城市是（ ）。","options":[{"key":"A","text":"马赛"},{"key":"B","text":"巴黎"},{"key":"C","text":"尼斯"},{"key":"D","text":"夏纳"}],"answer":"A","keys":["A"],"explanation":"答案选 A。马赛是法国第二大城市，位于法国南部，是地中海最大的港口，建于公元前 6世纪的古希腊时代，是法国最古老的城市。易混对比——法国主要城市：· 马赛：法国最古老的城市，地中海最大的港口；· 巴黎：法国首都；· 尼斯：仅次于巴黎的法国第二大旅游城市；· 夏纳：因每年举办国际电影节而闻名。","type":"单选题"},{"number":68,"stem":"有“木雕之乡”之称的是（ ）。","options":[{"key":"A","text":"浙江东阳"},{"key":"B","text":"浙江温州乐清"},{"key":"C","text":"福建福州"},{"key":"D","text":"广东潮汕地区"}],"answer":"A","keys":["A"],"explanation":"答案选 A。东阳木雕产于浙江东阳，当地有“木雕之乡”之称。东阳木雕不施彩绘，以木材天然色泽为基调，又有“白木雕”之称。26 教材新增考点。易混对比——东阳乐清潮州木雕称号：· 东阳：木雕之乡，不施彩绘，又称白木雕；· 乐清：中国黄杨木雕之乡；· 潮州：以金漆木雕著称。","type":"单选题"},{"number":69,"stem":"南京大屠杀中，遇难者达（ ）人以上。","options":[{"key":"A","text":"10万"},{"key":"B","text":"20万"},{"key":"C","text":"30万"},{"key":"D","text":"40万"}],"answer":"C","keys":["C"],"explanation":"答案选 C。1937年 12 月 13 日，日军占领南京后，进行了长达 6 周骇人听闻的血腥大屠杀，中国平民和解除武装的军人被枪杀、焚烧、活埋以及被日军用其他方法残忍杀害者达 30 万人以上。同类对比——抗日战争重大事件：· 九一八事变：1931年 9 月 18 日，东北三省沦为日本占领地；· 南京大屠杀：1937年 12 月 13日，遇难者达 30 万人以上；· 平型关大捷：全民族抗战爆发后中国军队主动对日作战取得的第一个重大胜利。","type":"单选题"},{"number":70,"stem":"隋朝修建的大运河以（ ）为中心。","options":[{"key":"A","text":"洛阳"},{"key":"B","text":"涿郡"},{"key":"C","text":"余杭"},{"key":"D","text":"长安"}],"answer":"A","keys":["A"],"explanation":"答案选 A。隋朝修建了以洛阳为中心的大运河，沟通了南北交通，对后代政治制度和经济发展影响巨大。同类对比——隋朝重大工程：· 大运河：隋朝修建，以洛阳为中心，沟通南北交通；· 赵州桥：隋代建造，世界上最早的敞肩石拱桥；· 大兴城：隋朝建造，规划严整。","type":"单选题"},{"number":71,"stem":"俗称“黄教”、明清两代执掌藏区政权的教派是（ ）。","options":[{"key":"A","text":"宁玛派"},{"key":"B","text":"萨迦派"},{"key":"C","text":"噶举派"},{"key":"D","text":"格鲁派"}],"answer":"D","keys":["D"],"explanation":"答案选 D。15世纪初，宗喀巴创立格鲁派，明清时期中央政府对格鲁派多有扶持，使其一度成为执掌藏区政权和神权的著名教派，势力最大；格鲁派俗称“黄教”，拉萨的甘丹寺、哲蚌寺、色拉寺及日喀则的扎什伦布寺等都是格鲁派（黄教）重要的寺庙。易混对比——藏传佛教主要教派：· 宁玛派：俗称“红教”；· 萨迦派：俗称“花教”；· 噶举派：俗称“白教”；· 格鲁派：俗称“黄教”，明清时期执掌藏区政权。","type":"单选题"},{"number":72,"stem":"将神仙信仰系统化，融入儒家思想的是（ ）。","options":[{"key":"A","text":"丘处机"},{"key":"B","text":"葛洪"},{"key":"C","text":"陆修静"},{"key":"D","text":"寇谦之"}],"answer":"B","keys":["B"],"explanation":"答案选 B。葛洪将神仙信仰系统化，融入了儒家思想，他的弟子儒道兼修。A 丘处机是全真道龙门派开创者；C 陆修静创立南天师道，制定了道徒晋级制度和道教斋醮仪式；D北朝人寇谦之进一步改革了道教宗教仪式，并把道教思想与忠君、孝道思想融为一体。易混对比——道教历史人物：· 葛洪：东晋人，将神仙信仰系统化，融入儒家思想；· 陆修静：南朝人，参与改造道教；· 寇谦之：北朝人，参与改造道教；· 丘处机：全真道龙门派开创者。","type":"单选题"},{"number":73,"stem":"威士忌被誉为（ ）。","options":[{"key":"A","text":"“白色火焰”"},{"key":"B","text":"“液体黄金”"},{"key":"C","text":"“生命之水”"},{"key":"D","text":"“液体面包”"}],"answer":"B","keys":["B"],"explanation":"答案选 B。被誉为“液体黄金”的威士忌是英国的特色购物产品。易混对比——英国特色购物产品：· 威士忌：被誉为“液体黄金”；· 银器、泰迪熊、烟斗：英国特色购物产品；· 英国红茶、英国巧克力、英国雪利酒：特色购物产品。","type":"单选题"},{"number":74,"stem":"别名梁溪，素有“太湖明珠”之誉的城市是（ ）。","options":[{"key":"A","text":"常州市"},{"key":"B","text":"镇江市"},{"key":"C","text":"无锡市"},{"key":"D","text":"南通市"}],"answer":"C","keys":["C"],"explanation":"无锡市：别名梁溪，简称“锡”，素有“太湖明珠”之誉。同类对比——江苏城市名片（江苏）：· 无锡：别名梁溪，简称“锡”，“太湖明珠”；· 苏州：古称姑苏、平江，有“人间天堂”的美誉；· 南京：古称金陵、建康，中国四大古都之一、十朝都会；· 扬州：“淮左名都，竹西佳处”“中国运河第一城”。","type":"单选题"},{"number":75,"stem":"中国最大的火山堰塞湖是（ ）。","options":[{"key":"A","text":"长白山天池"},{"key":"B","text":"喀纳斯湖"},{"key":"C","text":"五大连池"},{"key":"D","text":"镜泊湖"}],"answer":"D","keys":["D"],"explanation":"答案选 D。镜泊湖位于黑龙江省牡丹江市，是中国最大的火山堰塞湖，吊水楼瀑布是镜泊湖景区一绝。A 长白山天池是火山口湖；C 五大连池是火山熔岩堵塞白河河道形成的火山堰塞湖。易混对比——火山湖泊类型：· 镜泊湖：我国最大的火山堰塞湖，吊水楼瀑布是景区一绝；· 五大连池：因火山熔岩堵塞河道形成 5 个互相连通的火山堰塞湖；· 长白山天池：火山口湖。","type":"单选题"},{"number":76,"stem":"端砚产于（ ）。","options":[{"key":"A","text":"安徽歙县"},{"key":"B","text":"广东肇庆"},{"key":"C","text":"甘肃卓尼"},{"key":"D","text":"山西新绛"}],"answer":"B","keys":["B"],"explanation":"答案选 B。端砚产于广东省肇庆市，因隋在肇庆设端州府，所以称端砚。端砚贵有石眼，有“端石一斤，价值千金”之说。A 项安徽歙县、C 项甘肃卓尼、D 项山西新绛分别是歙砚、洮河砚、澄泥砚的产地，三者与端砚并称中国四大名砚，均非端砚产地。易混对比——中国四大名砚：· 端砚：产于广东肇庆；· 歙砚：产于安徽歙县；· 洮河砚：产于甘肃卓尼；· 澄泥砚：产于山西新绛。","type":"单选题"},{"number":77,"stem":"乌龙茶名品铁观音产于（ ）。","options":[{"key":"A","text":"福建"},{"key":"B","text":"广东"},{"key":"C","text":"台湾"},{"key":"D","text":"云南"}],"answer":"A","keys":["A"],"explanation":"答案选 A。乌龙茶产地主要集中在福建、广东、台湾一带，名品有福建的武夷岩茶、铁观音，广东的凤凰单枞，台湾的乌龙等。易混对比——乌龙茶名品产地：· 铁观音：产于福建；· 武夷岩茶：产于福建；· 凤凰单枞：产于广东；· 乌龙：产于台湾。","type":"单选题"},{"number":78,"stem":"世界上规模最大的大理石峡谷是（ ）。","options":[{"key":"A","text":"阿里山峡谷"},{"key":"B","text":"太鲁阁峡谷"},{"key":"C","text":"河北白石山"},{"key":"D","text":"雅鲁藏布江大峡谷"}],"answer":"B","keys":["B"],"explanation":"20千米长的太鲁阁峡谷是世界上规模最大的大理石峡谷。A 项阿里山以日出、云海、晚霞、森林、高山铁路“五奇”著称，C 项河北白石山是中国唯一的大理岩峰林景观，D 项雅鲁藏布江大峡谷是地球上最深的峡谷，世界规模最大的大理石峡谷为太鲁阁峡谷，故不选。同类对比——峡谷之最：· 太鲁阁峡谷：世界上规模最大的大理石峡谷，长 20 千米（台湾）；· 雅鲁藏布江大峡谷：深达 5382米，是地球上最深的峡谷（西藏）；· 白石山：中国唯一的大理岩峰林景观（河北）。","type":"单选题"},{"number":79,"stem":"有“蜀中之宝”美誉的是（ ）。","options":[{"key":"A","text":"蜀绣"},{"key":"B","text":"蜀锦"},{"key":"C","text":"苏绣"},{"key":"D","text":"宋锦"}],"answer":"A","keys":["A"],"explanation":"答案选 A。蜀绣是以四川成都为中心的刺绣品的总称，古称“川绣”，有“蜀中之宝”的美誉。26教材新增考点。易混对比——蜀绣与蜀锦美誉：· 蜀绣：以成都为中心，有蜀中之宝美誉；· 蜀锦：发源地为四川成都，有锦绣之根美称。","type":"单选题"},{"number":80,"stem":"被誉为“中国古代农业百科全书”的是北魏贾思勰撰写的（ ）。","options":[{"key":"A","text":"《农书》"},{"key":"B","text":"《农政全书》"},{"key":"C","text":"《汜胜之书》"},{"key":"D","text":"《齐民要术》"}],"answer":"D","keys":["D"],"explanation":"答案选 D。北魏时期，贾思勰撰写《齐民要术》，被誉为“中国古代农业百科全书”，是中国早期农书中保存最完整的一部。易混对比——中国古代农书：· 《汜胜之书》：中国最早的农书，西汉晚期成书；· 《齐民要术》：北魏贾思勰撰，被誉为“中国古代农业百科全书”；· 《农政全书》：明代徐光启著，是中国古代农学著作的集大成者。","type":"单选题"},{"number":81,"stem":"春秋时期出现了乘法口诀并有了（ ）的概念。","options":[{"key":"A","text":"无理数"},{"key":"B","text":"分数"},{"key":"C","text":"小数"},{"key":"D","text":"负数"}],"answer":"B","keys":["B"],"explanation":"答案选 B。春秋时出现乘法口诀并有了分数的概念。","type":"单选题"},{"number":83,"stem":"人称“唐人七言律诗第一”的崔颢，在武汉黄鹤楼留有“昔人已乘黄鹤去，此地空余黄鹤楼”的名句，下列哪位诗人读后感慨“眼前有景道不得，崔颢题诗在上头”？（ ）","options":[{"key":"A","text":"崔颢"},{"key":"B","text":"（选项缺失）"},{"key":"C","text":"（选项缺失）"},{"key":"D","text":"王维"}],"answer":"A","keys":["A"],"explanation":"答案选 A。人称“唐人七言律诗第一”的崔颢，在武汉黄鹤楼留有“昔人已乘黄鹤去，此地空余黄鹤楼”的名句；传说李白读了崔颢《黄鹤楼》诗亦大为佩服，感慨“眼前有景道不得，崔颢题诗在上头”。易混对比——黄鹤楼名篇：· 崔颢：人称“唐人七言律诗第一”；· 《黄鹤楼》：“昔人已乘黄鹤去，此地空余黄鹤楼”；· 李白：读后感慨“眼前有景道不得，崔颢题诗在上头”。","type":"单选题"},{"number":84,"stem":"发明了用“麻沸散”进行全麻后施行腹腔手术，并自创“五禽戏”的东汉“神医”是（ ）。","options":[{"key":"A","text":"张仲景"},{"key":"B","text":"孙思邈"},{"key":"C","text":"华佗"},{"key":"D","text":"李时珍"}],"answer":"C","keys":["C"],"explanation":"答案选 C。东汉“神医”华佗，发明了用“麻沸散”进行全麻后施行腹腔手术，其自创的“五禽戏”是最早的健身操，开中国保健医学先河。A张仲景是东汉“医圣”，著《伤寒杂病论》，开创用八纲辨证施治；B 孙思邈是唐朝名医，著《千金方》，被誉为“药王”；D李时珍是明朝药物学家，著《本草纲目》。易混对比——我国古代名医：· 华佗：东汉“神医”，发明“麻沸散”，自创“五禽戏”；· 张仲景：东汉“医圣”，著《伤寒杂病论》；· 孙思邈：唐朝名医，著《千金方》，被誉为“药王”；· 李时珍：明朝药物学家，著《本草纲目》。","type":"单选题"},{"number":85,"stem":"素有“八朝古都”之称，迄今已有 4100余年建城史和建都史的是（ ）。","options":[{"key":"A","text":"开封市"},{"key":"B","text":"商丘市"},{"key":"C","text":"安阳市"},{"key":"D","text":"郑州市"}],"answer":"A","keys":["A"],"explanation":"开封是首批国家历史文化名城，素有“八朝古都”之称，迄今已有 4100余年的建城史和建都史。同类对比——河南古都（河南）：· 开封：“八朝古都”，迄今已有 4100余年建城史和建都史；· 洛阳：十三朝古都，有 5000多年文明史、1500多年建都史；· 郑州：中国八大古都之一，“天地之中”，别称商都、绿城。","type":"单选题"},{"number":86,"stem":"年日照时间 3000小时以上，素有“日光城”美誉的城市是（ ）。","options":[{"key":"A","text":"日喀则"},{"key":"B","text":"林芝"},{"key":"C","text":"昌都"},{"key":"D","text":"拉萨"}],"answer":"D","keys":["D"],"explanation":"拉萨年日照时间 3000小时以上，素有“日光城”的美誉。A 项日喀则、B项林芝、C项昌都均为西藏城市，但年日照时间 3000 小时以上、素有“日光城”美誉者为拉萨，故不选。","type":"单选题"},{"number":87,"stem":"集演奏、演唱、舞蹈于一体，反映传统农耕生产生活中祭祀祈福、欢庆丰收的朝鲜族民间表演艺术是（ ）。","options":[{"key":"A","text":"长鼓舞"},{"key":"B","text":"安代舞"},{"key":"C","text":"农乐舞"},{"key":"D","text":"摆手舞"}],"answer":"C","keys":["C"],"explanation":"朝鲜族农乐舞是国家级非物质文化遗产，集演奏、演唱、舞蹈于一体，是反映传统农耕生产生活中祭祀祈福、欢庆丰收的民间表演艺术。A项长鼓舞是瑶族盛行的传统舞蹈，B项安代舞是蒙古族自娱性的传统民间舞蹈，D 项摆手舞是土家族最著名的传统舞蹈，均非集演奏、演唱、舞蹈于一体的朝鲜族民间表演艺术，故不选。易混对比——民族舞蹈：· 农乐舞：朝鲜族，集演奏、演唱、舞蹈于一体（吉林）；· 长鼓舞：瑶族盛行的传统舞蹈（广西）；· 安代舞：蒙古族自娱性的传统民间舞蹈（内蒙古）；· 摆手舞：最著名的土家舞蹈，与祭祀祖先、祈求丰收相联系（湖南）。","type":"单选题"},{"number":88,"stem":"黎族传统民居多为竹木结构的楼房或草房，屋顶呈（ ）。","options":[{"key":"A","text":"圆顶形"},{"key":"B","text":"平顶形"},{"key":"C","text":"穹窿形"},{"key":"D","text":"金字塔形"}],"answer":"D","keys":["D"],"explanation":"黎族传统民居多为竹木结构的楼房或草房。金字塔形屋顶，上盖茅草，用竹条或树枝扎成墙架，再以泥糊。同类对比——黎族传统民居：· 金字塔形屋顶：黎族传统民居典型屋顶，上盖茅草；· 船形屋：用竹木扎构成轮廓，状如船篷，呈半圆筒形；· 墙架做法：以竹条或树枝扎成墙架，再以泥糊。","type":"单选题"},{"number":89,"stem":"已成为北京市第一大产业的是（ ）。","options":[{"key":"A","text":"金融服务业"},{"key":"B","text":"信息服务业"},{"key":"C","text":"旅游产业"},{"key":"D","text":"商务服务业"}],"answer":"B","keys":["B"],"explanation":"北京信息服务业已经成为全市第一大产业。北京全年实现数字经济增加值 24166.3亿元，占全市地区生产总值的比重为 46.4%。A 项金融服务业、C项旅游产业、D 项商务服务业均为北京重要产业，但已成为北京市第一大产业的是信息服务业，故不选。","type":"单选题"},{"number":90,"stem":"被誉为“上帝折鞭处”的是（ ）。","options":[{"key":"A","text":"合川钓鱼城"},{"key":"B","text":"白帝城"},{"key":"C","text":"荆州古城"},{"key":"D","text":"襄阳古城"}],"answer":"A","keys":["A"],"explanation":"1243 年至 1279年发生在此长达 36 年的“钓鱼城保卫战”，是南宋王朝与蒙古之间的生死决战，钓鱼城因此被誉为“上帝折鞭处”。B 项白帝城在重庆，C项荆州古城在湖北，D 项襄阳古城在湖北，发生 36 年“钓鱼城保卫战”且被誉为“上帝折鞭处”者为合川钓鱼城，故不选。","type":"单选题"},{"number":91,"stem":"1973年，袁隆平等人在世界上首次培育成功强优势的（ ）。","options":[{"key":"A","text":"釉型杂交水稻"},{"key":"B","text":"粳型杂交水稻"},{"key":"C","text":"釉型常规水稻"},{"key":"D","text":"糯型杂交水稻"}],"answer":"A","keys":["A"],"explanation":"答案选 A。1973年我国釉型杂交水稻科研协作组的袁隆平等人，在世界上首次培育成功强优势的釉型杂交水稻。同类对比——新中国科技成就：· 1973年：袁隆平等首次培育成功强优势的釉型杂交水稻；· 1964年 10 月 16日：我国第一颗原子弹爆炸成功；· 2015年：屠呦呦获诺贝尔生理学或医学奖，贡献为创制新型抗疟药青蒿素和双氢青蒿素。","type":"单选题"},{"number":92,"stem":"金星在黄昏时现于西方，称为（ ）。","options":[{"key":"A","text":"“长庚”"},{"key":"B","text":"“启明”"},{"key":"C","text":"“岁星”"},{"key":"D","text":"“荧惑”"}],"answer":"A","keys":["A"],"explanation":"答案选 A。金星又称“明星”“太白”，五星中亮度最强，黎明时现于东方叫“启明”，黄昏时在西方叫“长庚”，《诗经》有“东有启明，西有长庚”之说。C 岁星是木星；D荧惑是火星。易混对比——金星别称：· 金星：又称“明星”“太白”，五星中亮度最强；· 启明：金星黎明时现于东方的称呼；· 长庚：金星黄昏时现于西方的称呼。","type":"单选题"},{"number":93,"stem":"中国现存最早的一部编年体史书是孔子所著（ ）。","options":[{"key":"A","text":"《资治通鉴》"},{"k
