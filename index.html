function home(){return `<div class="hero"><h1>每一套，踏实练习</h1><p>2026 雷大大押题卷 · 八套按卷整理<br>选择试卷开始练习，进度自动保存在本机。</p></div><div class="grid">${bank.map((set,i)=>`<section class="card"><h2>第 ${set.number} 套押题卷</h2><p>政策与法律法规 · 导游业务 · 全国与地方导游基础知识</p><div class="subjects">${set.subjects.map((s,j)=>{let p=saved[`${i}-${j}`];return `<button class="btn ${p?'':'primary'}" data-action="choose" data-set="${i}" data-sub="${j}">${s.name} · ${p?(p.finished?'查看结果':`继续 ${count(p)}/${s.questions.length}`):`${s.questions.length} 题`}</button>`}).join('')}</div></section>`).join('')}</div>`}
function choose(){let p=saved[`${si}-${sub}`],e=saved[`exam-${si}-${sub}`],total=questions().length;return `<div class="heading"><h1>第 ${si+1} 套 · ${bank[si].subjects[sub].name}</h1><button class="btn" data-action="home">返回套卷</button></div><div class="grid"><section class="panel"><h2>练习模式</h2><p class="note">逐题提交，立即查看答案和解析；可以随时结束。</p><button class="btn primary" data-action="start" data-mode="practice">${p?(p.finished?'查看练习结果':`继续练习 ${count(p)}/${total}`):'开始练习'}</button></section><section class="panel"><h2>模拟卷模式</h2><p class="note">全部答完才能交卷，交卷后显示成绩和解析。进度自动保存。</p><button class="btn primary" data-action="start" data-mode="exam">${e?(e.finished?'查看模拟卷成绩':`继续模拟卷 ${count(e)}/${total}`):'开始模拟卷'}</button></section><section class="panel"><h2>收藏夹</h2><p class="note">查看本套本科目收藏的题目及解析。</p><button class="btn" data-action="favorites">★ 我的收藏 · ${favorites().length} 题</button></section></div>`}
function favoriteList(){const ids=favorites(),list=questions().filter(q=>ids.includes(q.number));return `<div class="heading"><div><div class="muted">第 ${si+1} 套 · ${bank[si].subjects[sub].name}</div><h1>我的收藏</h1></div><button class="btn" data-action="back-choose">返回模式选择</button></div><section class="panel"><p class="note">已收藏 ${list.length} 道题，点击查看答案和解析。</p>${list.length?`<div class="favorite-list">${list.map(q=>`<button class="favorite-item" data-action="open-favorite" data-number="${q.number}"><span class="tag">${esc(q.type)} · 第 ${q.number} 题</span><span>${esc(q.stem)}</span><span>查看解析 ›</span></button>`).join('')}</div>`:'<p class="note">还没有收藏题目。打开练习模式，点击题目上的“收藏”即可加入。</p>'}</section>`}
function favoriteDetail(){const q=questions()[index];if(!q)return favoriteList();return `<div class="heading"><div><div class="muted">第 ${si+1} 套 · ${bank[si].subjects[sub].name}</div><h1>收藏题目</h1></div><button class="btn" data-action="favorites">返回收藏夹</button></div><section class="panel"><div class="meta"><span class="tag">${esc(q.type)}</span><span>第 ${q.number} 题</span><button class="btn favorite-toggle active" data-action="toggle-favorite" aria-pressed="true">★ 已收藏</button></div><div class="stem">${esc(q.stem)}</div>${q.options.map(o=>`<div class="option"><span class="letter">${esc(o.key)}</span><span>${esc(o.text)}</span></div>`).join('')}<div class="answer"><h3>参考答案与解析</h3><p><b>正确答案：</b>${esc(q.answer)}</p><p><b>解析：</b>${esc(q.explanation||'原文件未提供解析')}</p></div></section>`}
function settings(){return `<div class="heading"><h1>设置</h1><button class="btn" data-action="home">返回首页</button></div><section class="panel"><h2>清除学习记录</h2><p class="note">清除所有套卷的练习、模拟卷答案、成绩和收藏。清除后无法恢复。</p><button class="btn danger" data-action="clear">一键清除所有记录</button></section>`}
const points=q=>q.number<=130?0.5:1;
function isCorrect(q,s,i){const a=s.answers[i]||[];return !!(a.length&&q.keys.length&&a.slice().sort().join('')===q.keys.slice().sort().join(''))}
function resultGrid(qs,s){return `<div class="result-card"><div class="result-card-header"><div><h3>答题卡</h3><p class="note">绿色为正确，红色为错误；点击题号查看答案和解析。</p></div></div><div class="result-grid">${qs.map((q,i)=>`<button class="result-number ${isCorrect(q,s,i)?'correct':'wrong'}" data-action="review-jump" data-index="${i}" aria-label="第 ${q.number} 题，${isCorrect(q,s,i)?'正确':'错误'}">${q.number}</button>`).join('')}</div></div>`}
function result(){let s=state(),qs=questions(),done=count(s),correct=qs.filter((q,i)=>isCorrect(q,s,i)).length,score=qs.reduce((sum,q,i)=>sum+(isCorrect(q,s,i)?points(q):0),0),max=qs.reduce((sum,q)=>sum+points(q),0);const rows=['判断题','单选题','多选题'].map(type=>{const items=qs.map((q,i)=>({q,i})).filter(x=>x.q.type===type);const right=items.filter(x=>isCorrect(x.q,s,x.i));return {type,total:items.length,right:right.length,wrong:items.length-right.length,score:right.reduce((sum,x)=>sum+points(x.q),0),max:items.reduce((sum,x)=>sum+points(x.q),0)}});return `<div class="panel result"><span class="tag">${mode==='exam'?'模拟卷已交卷':'本次练习已结束'}</span><h2>第 ${si+1} 套 · ${bank[si].subjects[sub].name}</h2>${mode==='exam'?`<p><strong>${score}</strong> / ${max} 分　<span class="muted">答对 ${correct} / ${qs.length} 题</span></p><div class="score-table-wrap"><table class="score-table"><thead><tr><th>题型</th><th>正确</th><th>错误</th><th>得分</th></tr></thead><tbody>${rows.map(r=>`<tr><th>${r.type}</th><td>${r.right} 题</td><td>${r.wrong} 题</td><td>${r.score} / ${r.max} 分</td></tr>`).join('')}</tbody></table></div><p class="note">判断题、单选题每题 0.5 分，多选题每题 1 分，须全部选对。${max<100?'原文件存在缺题，本套按实际收录题目计算满分。':''}</p>`:`<p><strong>${correct}</strong> 题正确　<span class="muted">已答 ${done} / ${qs.length} 题 · 未答 ${qs.length-done} 题</span></p><p class="note">未作答的题不计为答错；你可以逐题查看正确答案和解析。</p>`}<div class="actions"><button class="btn primary" data-action="review">查看逐题解析</button><button class="btn" data-action="restart">${mode==='exam'?'重新开始这套模拟卷':'重新练习'}</button><button class="btn" data-action="home">返回套卷</button></div>${mode==='exam'?resultGrid(qs,s):''}</div>`}
function quiz(){let qs=questions(),q=qs[index],s=state(),selected=s.answers[index]||[],submitted=!!s.revealed[index]||review,correct=isCorrect(q,s,index);return `<div class="heading"><div><div class="muted">第 ${si+1} 套押题卷</div><h1>${bank[si].subjects[sub].name} · ${mode==='exam'?'模拟卷':'练习'}</h1></div><button class="btn" data-action="home">返回套卷</button></div><div class="layout"><section class="panel"><div class="meta"><span class="tag">${esc(q.type)}</span><span>第 ${q.number} 题 / 共 ${qs.length} 题</span>${review?'<span>解析复盘</span>':''}${mode==='practice'?`<button class="btn favorite-toggle ${favorites().includes(q.number)?'active':''}" data-action="toggle-favorite" aria-pressed="${favorites().includes(q.number)}">${favorites().includes(q.number)?'★ 已收藏':'☆ 收藏'}</button>`:''}</div><div class="stem">${esc(q.stem)}</div>${si===6&&sub===1&&q.number===83?'<p class="note">原解析中的选项不全，答案与解析内容不一致，请打开原文件核对。</p>':''}${q.options.map(o=>`<button class="option ${selected.includes(o.key)?'selected':''}" data-action="option" data-key="${o.key}" ${submitted?'disabled':''}><span class="letter">${o.key}</span><span>${esc(o.text)}</span></button>`).join('')}<p class="note">${q.type==='多选题'?'多选题，请选出全部正确选项。':(mode==='exam'&&!review?'选择一个答案后可直接切换题目。':'选择一个答案后提交。')}</p>${submitted?`<div class="answer ${correct?'':'wrong'}"><h3>${selected.length?(correct?'回答正确':'再看一下这道题'):'未作答'}</h3><p><b>正确答案：</b>${esc(q.answer)}</p><p><b>解析：</b>${esc(q.explanation||'原文件未提供解析')}</p></div>`:''}<div class="actions"><button class="btn" data-action="prev" ${index===0?'disabled':''}>上一题</button>${!submitted&&mode==='practice'?'<button class="btn primary" data-action="submit">提交并查看解析</button>':''}<button class="btn ${submitted?'primary':''}" data-action="next" ${index===qs.length-1?'disabled':''}>下一题</button>${review&&mode==='exam'?'<button class="btn push" data-action="result">返回成绩</button>':''}${!review?(mode==='exam'?`<button class="btn primary push" data-action="finish" ${count(s)<qs.length?'disabled':''}>${count(s)<qs.length?`还需完成 ${qs.length-count(s)} 题`:'交卷并查看成绩'}</button>`:'<button class="btn danger push" data-action="finish">结束并查看结果</button>'):''}</div></section><aside class="panel side"><h3>答题卡</h3><p>${review&&mode==='exam'?'绿色正确 · 红色错误 · 点击题号查看解析':`已作答 ${count(s)} / ${qs.length} 题 · 点击题号跳转`}</p><div class="navscroll"><div class="navgrid">${qs.map((q,i)=>`<button class="${review&&mode==='exam'?(isCorrect(q,s,i)?'review-correct':'review-wrong'):(s.answers[i]?.length?'done':'')} ${i===index?'current':''}" data-action="jump" data-index="${i}">${q.number}</button>`).join('')}</div></div>${mode==='exam'&&!review?'':'<div class="sources"><button class="btn" data-action="paper">打开原试卷</button><button class="btn" data-action="analysis">打开原解析</button></div>'}<p>切换题目和关闭应用后，作答会自动保存。</p></aside></div>`}
function render(){app.innerHTML=`<header class="top"><div class="brand"><span>✦</span> 雷大大刷题助手</div><div><span class="muted">离线学习 · 本机保存　</span><button class="btn" data-action="settings">⚙ 设置</button></div></header><main class="wrap">${view==='home'?home():view==='choose'?choose():view==='settings'?settings():view==='favorites'?favoriteList():view==='favorite-detail'?favoriteDetail():view==='result'?result():quiz()}</main>`}
app.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;
if(a==='choose'){si=+b.dataset.set;sub=+b.dataset.sub;view='choose'}
else if(a==='settings'){view='settings'}
else if(a==='back-choose'){view='choose'}
else if(a==='favorites'){view='favorites'}
else if(a==='open-favorite'){index=questions().findIndex(q=>q.number===Number(b.dataset.number));if(index<0)return;view='favorite-detail'}
else if(a==='toggle-favorite'){const number=questions()[index].number,old=favorites();if(!saved._favorites)saved._favorites={};saved._favorites[favoriteKey()]=old.includes(number)?old.filter(n=>n!==number):[...old,number];persist();if(view==='favorite-detail'&&!saved._favorites[favoriteKey()].includes(number))view='favorites'}
else if(a==='clear'){if(!confirm('确定清除全部练习、模拟卷记录和收藏吗？此操作无法撤销。'))return;saved={};persist();alert('全部学习记录已清除。')}
else if(a==='start'){mode=b.dataset.mode;let s=state();if(!s){saved[id()]={answers:{},revealed:{},index:0,finished:false};persist();s=state()}index=Math.min(s.index||0,questions().length-1);review=false;view=s.finished?'result':'quiz'}
else if(a==='home'){view='home';review=false}
else if(a==='restart'){if(!confirm(`重新${mode==='exam'?'模拟':'练习'}会清除本套当前作答记录，确定继续吗？`))return;saved[id()]={answers:{},revealed:{},index:0,finished:false};index=0;review=false;view='quiz';persist()}
else if(a==='review'||a==='review-jump'){review=true;index=a==='review-jump'?+b.dataset.index:0;view='quiz'}
else if(a==='result'){view='result';review=false}
else if(a==='option'){let s=state(),q=questions()[index],v=b.dataset.key,old=s.answers[index]||[];s.answers[index]=q.type==='多选题'?(old.includes(v)?old.filter(x=>x!==v):[...old,v]):[v];persist()}
else if(a==='submit'){if(!(state().answers[index]||[]).length){alert('请先选择答案。');return}state().revealed[index]=true;persist()}
else if(a==='finish'){let remaining=questions().length-count(state());if(mode==='exam'&&remaining)return;if(!confirm(mode==='exam'?'全部题目已作答，确定交卷并查看成绩吗？':`确定结束本次练习吗？${remaining?`还有 ${remaining} 题未作答。`:''}结束后可查看逐题解析。`))return;state().finished=true;persist();view='result'}
else if(a==='prev'||a==='next'||a==='jump'){index=a==='jump'?+b.dataset.index:index+(a==='next'?1:-1);state().index=index;persist()}
else if(a==='paper'||a==='analysis'){let err=await window.quizApp.openSource(si,sub,a==='paper'?'paperFile':'analysisFile');if(err)alert('无法打开原文件：'+err);return}
render();});render();})();
</script></body></html>
