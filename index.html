ey":"B","text":"《尚书》"},{"key":"C","text":"《春秋》"},{"key":"D","text":"《史记》"}],"answer":"C","keys":["C"],"explanation":"答案选 C。孔子著《春秋》，仅有 1.8 万字，是中国现存最早的一部编年体史书。B《尚书》和甲骨文是最早的档案类史料；D《史记》是我国第一部纪传体通史。易混对比——著名史书：· 《春秋》：孔子著，是中国现存最早的一部编年体史书；· 《史记》：西汉司马迁著，是中国第一部纪传体通史；· 《资治通鉴》：宋代司马光主持编写。","type":"单选题"},{"number":94,"stem":"陕西被列入联合国教科文组织《人类非物质文化遗产代表作名录》的项目是（ ）。","options":[{"key":"A","text":"西安鼓乐"},{"key":"B","text":"秦腔"},{"key":"C","text":"安塞腰鼓"},{"key":"D","text":"花儿"}],"answer":"A","keys":["A"],"explanation":"陕西列入《人类非物质文化遗产代表作名录》1 项：西安鼓乐。B项秦腔、C 项安塞腰鼓均为陕西著名民间艺术，但未列入《人类非物质文化遗产代表作名录》；D 项花儿系甘肃等省列入该名录的项目，故不选。同类对比——人类非遗代表作：· 西安鼓乐（陕西）；· 花儿、藏戏（甘肃）；· 侗族大歌（贵州）；· 粤剧（广东）。","type":"单选题"},{"number":95,"stem":"被誉为“生活着的千年古镇”的是（ ）。","options":[{"key":"A","text":"周庄"},{"key":"B","text":"乌镇"},{"key":"C","text":"南浔古镇"},{"key":"D","text":"西塘古镇"}],"answer":"D","keys":["D"],"explanation":"正确答案为 D。西塘古镇位于浙江省嘉善县，地处江浙沪两省一市交界处，是一座已有千年历史的江南水乡古镇，至今仍有 2600 余户原住居民生活其中，被誉为“生活着的千年古镇”。A项，周庄被誉为“中国第一水乡”。B 项，乌镇素有“中国最后的枕水人家”之誉。C 项，南浔古镇素有“诗书之乡”的美誉。26版教材新增考点。易混对比——古镇文化称号辨析：· 周庄：被誉为“中国第一水乡”；· 乌镇：素有“中国最后的枕水人家”之誉；· 南浔古镇：素有“诗书之乡”的美誉；· 西塘古镇：被誉为“生活着的千年古镇”；区分关键：西塘是“生活着的千年古镇”；周庄是“中国第一水乡”。","type":"单选题"},{"number":96,"stem":"内蒙古的哈达主要有蓝色和白色两种，其中献给珍贵客人的是（ ）。","options":[{"key":"A","text":"白色哈达"},{"key":"B","text":"红色哈达"},{"key":"C","text":"黄色哈达"},{"key":"D","text":"蓝色哈达"}],"answer":"D","keys":["D"],"explanation":"内蒙古的哈达主要有蓝色和白色两种，白色哈达是献给一般客人的，蓝色哈达是献给珍贵客人的。易混对比——蒙古族哈达：· 白色哈达：献给一般客人的；· 蓝色哈达：献给珍贵客人的；· 易错点：内蒙古哈达以蓝色最为尊贵，不是白色。","type":"单选题"},{"number":97,"stem":"有着“中国电影从这里走向世界”之美誉的是（ ）。","options":[{"key":"A","text":"横店影视城"},{"key":"B","text":"环球恐龙城"},{"key":"C","text":"镇北堡西部影城"},{"key":"D","text":"无锡影视基地"}],"answer":"C","keys":["C"],"explanation":"镇北堡西部影城，这里拍摄了《红高粱》《东邪西毒》《大话西游》等 100多部影片，有着“中国电影从这里走向世界”之美誉。A项横店影视城在浙江东阳，B项环球恐龙城在江苏常州，D项无锡影视基地在江苏，拍摄《红高粱》等影片、有“中国电影从这里走向世界”之美誉者为镇北堡西部影城，故不选。同类对比——影视基地：·镇北堡西部影城：《红高粱》等 100多部影片拍摄地，“中国电影从这里走向世界”（宁夏）；· 横店影视城：国家 5A级旅游景区（浙江）；· 无锡影视基地三国水浒城：国家 5A级旅游景区（江苏）。","type":"单选题"},{"number":98,"stem":"香港最具有代表性的沙滩是（ ）。","options":[{"key":"A","text":"亚龙湾"},{"key":"B","text":"浅水湾"},{"key":"C","text":"金石滩"},{"key":"D","text":"北海银滩"}],"answer":"B","keys":["B"],"explanation":"浅水湾号称“天下第一湾”，有“东方夏威夷”之美誉，是香港最具有代表性的沙滩。A 项亚龙湾在海南，C 项金石滩在大连，D 项北海银滩在广西，香港最具有代表性的沙滩为浅水湾，故不选。易混对比——海滨旅游胜地：· 浅水湾：香港最有代表性的沙滩，“天下第一湾”“东方夏威夷”；· 亚龙湾：海南海滨胜地；· 金石滩：大连海滨地貌，“海上石林”；· 北海银滩：广西北海。","type":"单选题"},{"number":99,"stem":"全国唯一经国务院批复的建设践行新发展理念的公园城市示范区是（ ）。","options":[{"key":"A","text":"成都市"},{"key":"B","text":"重庆市"},{"key":"C","text":"西安市"},{"key":"D","text":"昆明市"}],"answer":"A","keys":["A"],"explanation":"成都又被誉为“雪山下的公园城市”“一座来了就不想走的城市”，是全国唯一经国务院批复的建设践行新发展理念的公园城市示范区。","type":"单选题"},{"number":100,"stem":"位于世界“冰雪黄金带”的省份是（ ）。","options":[{"key":"A","text":"黑龙江省"},{"key":"B","text":"吉林省"},{"key":"C","text":"辽宁省"},{"key":"D","text":"内蒙古自治区"}],"answer":"B","keys":["B"],"explanation":"北纬 43°附近是世界的“冰雪黄金带”，长白山雪期长、降雪量大，具有发展冰雪旅游的良好条件。A 项黑龙江省、C 项辽宁省、D 项内蒙古自治区均非“冰雪黄金带”所指省份，故不选。","type":"单选题"},{"number":101,"stem":"世界上最大的铜鼓现陈列于（ ）。","options":[{"key":"A","text":"桂林博物馆"},{"key":"B","text":"柳州博物馆"},{"key":"C","text":"广西壮族自治区博物馆"},{"key":"D","text":"广东省博物馆"}],"answer":"C","keys":["C"],"explanation":"1972 年，发现于广西北流市六靖镇的汉代云雷纹大铜鼓，被誉为“铜鼓之王”，现陈列于南宁市广西壮族自治区博物馆内，是世界上最大的铜鼓。同类对比——广西文化名片（广西）：· 云雷纹大铜鼓：“铜鼓之王”，世界上最大的铜鼓，陈列于广西壮族自治区博物馆；· 左江花山岩画：2016年列入《世界遗产名录》，展现壮族先民骆越人社会生活；· 刘三姐歌谣：国家级非物质文化遗产。","type":"单选题"},{"number":102,"stem":"刘备“三顾茅庐”“隆中对”等故事发生在湖北的（ ）。","options":[{"key":"A","text":"荆州"},{"key":"B","text":"宜昌"},{"key":"C","text":"襄阳"},{"key":"D","text":"武汉"}],"answer":"C","keys":["C"],"explanation":"襄阳：刘备“三顾茅庐”“隆中对”等故事就发生在这里。A 项荆州、B 项宜昌、D项武汉均为湖北城市，但“三顾茅庐”“隆中对”发生地为襄阳，故不选。","type":"单选题"},{"number":103,"stem":"我国目前规模最宏大、保存最完整的纪念伏羲氏的明代建筑群，历代官方祭祀伏羲的重要地方是（ ）。","options":[{"key":"A","text":"周口太昊伏羲陵"},{"key":"B","text":"炎帝陵"},{"key":"C","text":"黄帝陵"},{"key":"D","text":"天水伏羲庙"}],"answer":"D","keys":["D"],"explanation":"天水伏羲庙是我国目前规模最宏大、保存最完整的纪念伏羲氏的明代建筑群，是历代官方祭祀伏羲的重要地方。A 项太昊伏羲陵在河南，B 项炎帝陵在湖南，C 项黄帝陵在陕西，我国目前规模最宏大、保存最完整的纪念伏羲氏的明代建筑群是天水伏羲庙，故不选。易混对比——始祖祭祀地：· 天水伏羲庙：我国目前规模最宏大、保存最完整的纪念伏羲氏的明代建筑群（甘肃）；· 太昊伏羲陵：淮阳太昊伏羲祭典是寻根祭祖盛典（河南）。","type":"单选题"},{"number":104,"stem":"我国最大的淡水湖是（ ），被称为“白鹤世界”“珍禽王国”。","options":[{"key":"A","text":"太湖"},{"key":"B","text":"鄱阳湖"},{"key":"C","text":"巢湖"},{"key":"D","text":"洞庭湖"}],"answer":"B","keys":["B"],"explanation":"答案选 B。鄱阳湖是我国最大的淡水湖，湖中有大量长江流域的珍贵鱼类，每年还有许多珍贵的鸟类栖息在这里，被称为“白鹤世界”“珍禽王国”。同类对比——我国著名湖泊：· 鄱阳湖：我国最大的淡水湖，被称为“白鹤世界”“珍禽王国”；· 镜泊湖：我国最大的火山堰塞湖；· 五大连池：因火山熔岩堵塞河道形成 5 个互相连通的火山堰塞湖。","type":"单选题"},{"number":105,"stem":"自称“毕慈卡”，先民与古代巴人有直接渊源关系的民族是（ ）。","options":[{"key":"A","text":"苗族"},{"key":"B","text":"土家族"},{"key":"C","text":"侗族"},{"key":"D","text":"瑶族"}],"answer":"B","keys":["B"],"explanation":"土家族人自称“毕慈卡”，意为本地人。土家族的先民与古代巴人有直接的渊源关系。A项苗族、C 项侗族、D 项瑶族的自称均非“毕慈卡”，其先民与古代巴人亦无直接渊源关系，故不选。同类对比——民族自称：· 土家族：自称“毕慈卡”，意为本地人；· 畲族：自称“山哈”，意为山里的客人（浙江）；· 羌族：自称尔玛，又称“云朵上的民族”（四川）；· 维吾尔：民族自称，意为“团结”“联合”“协助”（新疆）。","type":"单选题"},{"number":106,"stem":"2024 年 7 月列入《世界遗产名录》、填补了中国世界自然遗产中缺少沙漠类型空白的是（ ）。","options":[{"key":"A","text":"塔克拉玛干沙漠"},{"key":"B","text":"巴丹吉林沙漠——沙山湖泊群"},{"key":"C","text":"腾格里沙漠"},{"key":"D","text":"科尔沁草原"}],"answer":"B","keys":["B"],"explanation":"巴丹吉林沙漠—沙山湖泊群于 2024 年 7 月被成功列入《世界遗产名录》，填补了中国世界自然遗产中缺少沙漠类型的空白。A项塔克拉玛干沙漠是中国最大的沙漠，C 项腾格里沙漠在宁夏中卫与黄河相遇，D项科尔沁草原被誉为“草原上的花园”，2024年列入《世界遗产名录》的沙漠类遗产为巴丹吉林沙漠—沙山湖泊群，故不选。同类对比——沙漠景观：· 巴丹吉林沙漠：中国第三大沙漠、第二大流动沙漠，“中国最美沙漠”（内蒙古）；· 塔克拉玛干沙漠：中国最大的沙漠，面积 33.76 万平方公里（新疆）；· 腾格里沙漠：在宁夏中卫与黄河相遇，现“大漠孤烟直，长河落日圆”风光（宁夏）。","type":"单选题"},{"number":107,"stem":"古朴典雅的纳西族建筑中，丽江古城的（ ）最具代表性。","options":[{"key":"A","text":"四方街"},{"key":"B","text":"木府"},{"key":"C","text":"黑龙潭"},{"key":"D","text":"五凤楼"}],"answer":"A","keys":["A"],"explanation":"丽江古城的四方街最具代表性。纳西古乐起源于 14 世纪，是云南省最为古老的乐曲，也是世界最古老的乐曲之一，被誉为“音乐化石”。B 项木府、C 项黑龙潭、D 项五凤楼均为丽江知名景观，但最具代表性的是丽江古城四方街，故不选。","type":"单选题"},{"number":108,"stem":"白毫银针属于（ ）。","options":[{"key":"A","text":"黄茶"},{"key":"B","text":"白茶"},{"key":"C","text":"黑茶"},{"key":"D","text":"绿茶"}],"answer":"B","keys":["B"],"explanation":"答案选 B。白茶茶性寒凉，有退热祛暑之功效，名品有白毫银针、白牡丹、贡眉等。易混对比——茶叶发酵程度：· 白茶：轻发酵茶，茶性寒凉，有退热祛暑之功效；· 绿茶：不发酵茶，初制时高温杀青；· 青茶（乌龙茶）：半发酵茶；· 红茶：全发酵茶；· 黑茶：后发酵茶。","type":"单选题"},{"number":109,"stem":"有高空跳塔和空中漫步等刺激娱乐项目，其蹦极是世界上商业蹦极之最，高度达 233米的是（ ）。","options":[{"key":"A","text":"大三巴牌坊"},{"key":"B","text":"澳门旅游塔"},{"key":"C","text":"妈阁庙"},{"key":"D","text":"金莲花广场"}],"answer":"B","keys":["B"],"explanation":"澳门旅游塔的冒险乐园是世界顶级娱乐场所，有高空跳塔和空中漫步等刺激娱乐项目，它的蹦极是世界上商业蹦极之最，高度达到 233米。A 项大三巴牌坊是澳门的象征，C项妈阁庙是澳门三大古刹中最古老者，D项金莲花广场是澳门回归的纪念地标，蹦极高度达233米、为世界商业蹦极之最者为澳门旅游塔，故不选。同类对比——澳门地标（澳门）：· 大三巴牌坊：“澳门八景”之一，澳门的象征，圣保禄教堂正面前壁的遗址；· 妈阁庙：澳门三大古刹中最古老者，澳门葡文名称 MACAU 由此而来；· 金莲花广场：为庆祝 1999年澳门主权回归设立；· 澳门旅游塔：蹦极是世界上商业蹦极之最，高度达 233米。","type":"单选题"},{"number":110,"stem":"将民族区域自治制度载入国家根本大法的是（ ）。","options":[{"key":"A","text":"1984年《中华人民共和国民族区域自治法》"},{"key":"B","text":"党的十五大报告"},{"key":"C","text":"1954年第一届全国人民代表大会通过的《中华人民共和国宪法》"},{"key":"D","text":"1949年《中国人民政治协商会议共同纲领》"}],"answer":"C","keys":["C"],"explanation":"答案选 C。1954年第一届全国人民代表大会通过的《中华人民共和国宪法》，将民族区域自治制度载入国家根本大法；1954年第一部宪法和其后历次修改的宪法都确认了这一政策和制度的地位。同类对比——民族区域自治制度入法历程：· 《共同纲领》：1949年通过，起临时宪法作用；· 1954年宪法：第一届全国人民代表大会通过，将民族区域自治制度载入国家根本大法；· 历次修宪：都确认了民族区域自治政策和制度的地位。","type":"单选题"},{"number":111,"stem":"素有“无峰不奇，无石不峭，无庙不古，无处不幽”之美誉的名山是（ ）。","options":[{"key":"A","text":"千山"},{"key":"B","text":"五台山"},{"key":"C","text":"齐云山"},{"key":"D","text":"天柱山"}],"answer":"A","keys":["A"],"explanation":"辽宁千山素有“东北明珠”之称，有“无峰不奇，无石不峭，无庙不古，无处不幽”之美誉。B 项五台山在山西，C 项齐云山、D 项天柱山均为安徽名山，均非“无峰不奇，无石不峭，无庙不古，无处不幽”之美誉所指，故不选。","type":"单选题"},{"number":112,"stem":"素有“黄山归来不看山，九寨归来不看水”之说的景区是（ ）。","options":[{"key":"A","text":"黄龙景区"},{"key":"B","text":"四姑娘山"},{"key":"C","text":"峨眉山"},{"key":"D","text":"九寨沟景区"}],"answer":"D","keys":["D"],"explanation":"九寨沟景区叠瀑、翠海、彩林、雪峰密布，水色清纯艳丽，有如“人间仙境”“童话世界”，素有“黄山归来不看山，九寨归来不看水”之说。A项黄龙、B项四姑娘山、C项峨眉山均为四川著名景区，但素有“黄山归来不看山，九寨归来不看水”之说者为九寨沟景区，故不选。同类对比——四川景区誉称（四川）：· 九寨沟：“人间仙境”“童话世界”，素有“黄山归来不看山，九寨归来不看水”之说；· 峨眉山：普贤菩萨道场，“佛国天堂”“仙山佛国”。","type":"单选题"},{"number":113,"stem":"与美国阿波罗宇宙飞船登月活动、苏联第一颗人造卫星共同被联合国评为“象征 20世纪人类征服自然的三大奇迹”的中国工程是（ ）。","options":[{"key":"A","text":"成昆铁路工程"},{"key":"B","text":"青藏铁路工程"},{"key":"C","text":"三峡工程"},{"key":"D","text":"港珠澳大桥"}],"answer":"A","keys":["A"],"explanation":"1984 年 12 月 8 日，中国成昆铁路工程、美国阿波罗宇宙飞船登月活动和苏联第一颗人造卫星，共同被联合国评为“象征 20 世纪人类征服自然的三大奇迹”。B 项青藏铁路、C项三峡工程、D 项港珠澳大桥均为伟大工程，但与阿波罗登月、苏联第一颗人造卫星并称20世纪人类征服自然三大奇迹者为成昆铁路工程，故不选。同类对比——中国超级工程：· 成昆铁路：与美国阿波罗登月、苏联第一颗人造卫星并称“象征 20世纪人类征服自然的三大奇迹”（四川）；· 青藏铁路：全长 1956 公里，是世界上海拔最高、在冻土上路程最长的高原铁路（西藏）；· 港珠澳大桥：全长 55千米，是目前世界上最长的跨海大桥（粤港澳）。","type":"单选题"},{"number":114,"stem":"全国规模最大、最完整的关帝建筑群是（ ）。","options":[{"key":"A","text":"大同华严寺"},{"key":"B","text":"太原普祠"},{"key":"C","text":"平遥城隍庙"},{"key":"D","text":"运城解州关帝庙"}],"answer":"D","keys":["D"],"explanation":"运城解州关帝庙是全国规模最大、最完整的关帝建筑群。解州关帝庙也是全国规模最大的武庙。A 项大同华严寺、B 项太原普祠、C 项平遥城隍庙均为山西著名古建筑，但全国规模最大、最完整的关帝建筑群为运城解州关帝庙，故不选。同类对比——山西古建（山西）：· 解州关帝庙：全国规模最大、最完整的关帝建筑群，全国规模最大的武庙（运城）；· 晋祠：荟萃多元古建筑形制的千年古祠（太原）；· 华严寺：大雄宝殿建筑面积之宏伟、殿顶鸱吻之高大均为全国佛寺之最（大同）。","type":"单选题"},{"number":115,"stem":"有“中国夏都”之称的是（ ）。","options":[{"key":"A","text":"兰州市"},{"key":"B","text":"西宁市"},{"key":"C","text":"银川市"},{"key":"D","text":"乌鲁木齐市"}],"answer":"B","keys":["B"],"explanation":"西宁有“中国夏都”之称。西宁古称西平郡、青唐城，是青藏高原唯一人口超过百万的中心城市。同类对比——城市别称：· 西宁：“中国夏都”（青海）；· 哈尔滨：“冰城”“东方莫斯科”“东方小巴黎”（黑龙江）；· 长春：“北国春城”“东方底特律”（吉林）；· 拉萨：年日照时间 3000小时以上，“日光城”（西藏）。","type":"单选题"},{"number":116,"stem":"世界上最小的首都之一是（ ），机场建在邻近的瑚湖尔岛。","options":[{"key":"A","text":"新加坡市"},{"key":"B","text":"斯里巴加湾市"},{"key":"C","text":"马累"},{"key":"D","text":"曼谷"}],"answer":"C","keys":["C"],"explanation":"答案选 C。马累是马尔代夫的首都，面积约 1.96平方千米，是世界上最小的首都之一，小得没有自己的机场，马尔代夫的机场建在隔邻的瑚湖尔岛。易混对比——特色首都：· 马累：马尔代夫首都，世界最小首都之一，机场建在瑚湖尔岛；· 新加坡：首都即国家，一个城市就是一个国家；· 印度：首都新德里，孟买素有印度“商业首都”之称。","type":"单选题"},{"number":117,"stem":"始建于春秋时期，完成于战国时期，西起黄河河畔，东至黄海海滨的长城是（ ）。","options":[{"key":"A","text":"齐长城"},{"key":"B","text":"嘉峪关"},{"key":"C","text":"明长城"},{"key":"D","text":"黄崖关长城"}],"answer":"A","keys":["A"],"explanation":"齐长城，始建于春秋时期，完成于战国时期，西起黄河河畔，东至黄海海滨。B 项嘉峪关号称“天下第一雄关”，C项明长城为明代修筑，D 项黄崖关长城在天津，均非始建于春秋、完成于战国者，故不选。同类对比——长城名胜：· 齐长城：始建于春秋、完成于战国，西起黄河、东至黄海（山东）；· 山海关：建于明长城东端，“万里长城第一关”（河北）；· 嘉峪关：“天下第一雄关”，在甘肃；· 黄崖关长城：天津的世界文化遗产。","type":"单选题"},{"number":118,"stem":"最早见于《史记》，曾经为丝绸之路必经之地的西域故城遗迹是（ ）。","options":[{"key":"A","text":"交河故城遗址"},{"key":"B","text":"高昌故城"},{"key":"C","text":"楼兰故城遗址"},{"key":"D","text":"北庭故城"}],"answer":"C","keys":["C"],"explanation":"楼兰，是西域故城遗迹。最早见于《史记》，曾经为丝绸之路必经之地。A 项交河故城、B项高昌故城、D项北庭故城均为西域故城遗迹，但最早见于《史记》、曾为丝绸之路必经之地者为楼兰故城遗址，故不选。同类对比——西域故城（新疆）：· 楼兰故城：最早见于《史记》，曾经为丝绸之路必经之地；· 交河故城：世界上最大最古老、保存得最完好的生土建筑城市，安西都护府最早驻地；· 高昌故城、北庭故城：丝绸之路世界遗产点。","type":"单选题"},{"number":119,"stem":"“元曲四大家”中《倩女离魂》的作者是（ ）。","options":[{"key":"A","text":"白朴"},{"key":"B","text":"马致远"},{"key":"C","text":"郑光祖"},{"key":"D","text":"关汉卿"}],"answer":"C","keys":["C"],"explanation":"答案选 C。元曲著名作品有关汉卿《窦娥冤》、白朴《墙头马上》、马致远《汉宫秋》、郑光祖《倩女离魂》，此四人被誉为“元曲四大家”。易混对比——元曲四大家及其代表作：· 关汉卿：《窦娥冤》；· 白朴：《墙头马上》；· 马致远：《汉宫秋》；· 郑光祖：《倩女离魂》。","type":"单选题"},{"number":120,"stem":"书院模式的成熟标志，理学大师朱熹制订书院揭示的书院是（ ）。","options":[{"key":"A","text":"鹅湖书院"},{"key":"B","text":"白鹭洲书院"},{"key":"C","text":"嵩阳书院"},{"key":"D","text":"白鹿洞书院"}],"answer":"D","keys":["D"],"explanation":"白鹿洞书院是书院模式的成熟标志，理学大师朱熹制订的《白鹿洞书院揭示》是我国古代书院最早的章程，成为后世书院遵行的准绳和法规。A 项鹅湖书院首创学术自由争辩之风，B 项白鹭洲书院以人才辈出、延续办学 800年著称，C 项嵩阳书院在河南登封“天地之中”历史建筑群中，均非“书院模式的成熟标志”，故不选。易混对比——江西三大书院：· 白鹿洞书院：中国四大书院之一，“天下书院之首”，朱熹《白鹿洞书院揭示》为古代书院最早章程；· 鹅湖书院：首创学术自由争辩之风；· 白鹭洲书院：以人才辈出、延续办学 800年著称。","type":"单选题"},{"number":121,"stem":"蜃景一般上现蜃景多出现在（ ），下现蜃景多出现在沙漠地区。","options":[{"key":"A","text":"高原地区"},{"key":"B","text":"内陆盆地"},{"key":"C","text":"草原地区"},{"key":"D","text":"海滨地区"}],"answer":"D","keys":["D"],"explanation":"答案选 D。蜃景有上现蜃景与下现蜃景之分，一般上现蜃景多出现在海滨地区，下现蜃景多出现在沙漠地区；山东蓬莱蜃景出现次数最多。同类对比——蜃景奇观：· 上现蜃景：多出现在海滨地区；· 下现蜃景：多出现在沙漠地区；· 山东蓬莱：我国蜃景出现次数最多的地方。","type":"单选题"},{"number":122,"stem":"被称为中华民族的“四季花园”和中外游客的“度假天堂”的是（ ）。","options":[{"key":"A","text":"云南"},{"key":"B","text":"海南"},{"key":"C","text":"福建"},{"key":"D","text":"台湾"}],"answer":"B","keys":["B"],"explanation":"海南被称为中华民族的“四季花园”和中外游客的“度假天堂”。A 项云南有“动植物王国”之称，C 项福建、D 项台湾均为东南沿海省份，被称为中华民族的“四季花园”和中外游客的“度假天堂”的是海南，故不选。","type":"单选题"},{"number":123,"stem":"下列美食中，属于河北标志性特产美食的是（ ）。","options":[{"key":"A","text":"狗不理包子"},{"key":"B","text":"河间驴肉火烧"},{"key":"C","text":"刀削面"},{"key":"D","text":"羊肉泡馍"}],"answer":"B","keys":["B"],"explanation":"河间驴肉火烧是河北标志性特产美食。A 项狗不理包子为天津名吃，C 项刀削面为山西面食，D项羊肉泡馍为陕西名吃，河北标志性特产美食为河间驴肉火烧，故不选。易混对比——华北名吃：· 河间驴肉火烧：河北标志性特产美食（河北）；· 狗不理包子：天津小吃“津门三绝”之一（天津）；· 刀削面：削面工艺独特、形似柳叶，太原被称为“面食之都”（山西）；· 牛羊肉泡馍：陕西风味小吃代表（陕西）。","type":"单选题"},{"number":124,"stem":"具有鲜明民族特色的畲族女性传统服装是（ ）。","options":[{"key":"A","text":"七星披肩"},{"key":"B","text":"彩虹袖"},{"key":"C","text":"杂帕"},{"key":"D","text":"凤凰装"}],"answer":"D","keys":["D"],"explanation":"畲族女性的传统服装“凤凰装”具有鲜明的民族特色。A 项七星披肩是纳西族妇女最具特色的服饰，B 项彩虹袖是互助土族传统服饰最典型的标志之一，C 项尕帕是维吾尔族喜爱的四楞花帽，均非畲族女性的传统服装，故不选。易混对比——民族服饰：· 凤凰装：畲族女性的传统服装（浙江、福建）；· 七星披肩：纳西族妇女最具特色的服饰，象征披星戴月（云南）；· 彩虹袖：互助土族传统服饰最典型的标志，互助县被誉为“彩虹之乡”（青海）；· 尕帕：维吾尔族喜爱的四楞花帽（新疆）。","type":"单选题"},{"number":125,"stem":"截至 2026年 7月，中国列入《世界遗产名录》的世界遗产共有（ ）项。","options":[{"key":"A","text":"59"},{"key":"B","text":"60"},{"key":"C","text":"61"},{"key":"D","text":"62"}],"answer":"C","keys":["C"],"explanation":"截至 2026年 7月，中国已有 61 项世界遗产列入《世界遗产名录》，其中世界文化遗产 42 项、世界自然遗产 15 项（自然遗产总数位列世界第一）、世界文化与自然双重遗产 4项。同类对比——中国世界遗产数字：· 61项构成：世界文化遗产 42 项、世界自然遗产 15项（世界第一）、双重遗产 4 项；· 双重遗产数量：与澳大利亚并列世界第一；· 两次承办世界遗产委员会会议：2004年苏州第 28届、2021年福州第 44届。","type":"单选题"},{"number":126,"stem":"山西省陵川县境内的昆山挂壁公路位于（ ）景区，是 7条挂壁公路中最为惊险的。","options":[{"key":"A","text":"王莽岭"},{"key":"B","text":"绵山"},{"key":"C","text":"太行山大峡谷"},{"key":"D","text":"五台山"}],"answer":"A","keys":["A"],"explanation":"山西省内还拥有独特的挂壁公路，陵川县境内的昆山挂壁公路位于王莽岭景区，是7条挂壁公路中最为惊险的。","type":"单选题"},{"number":127,"stem":"素有“浙江延安”之称的浙南抗日根据地旧址位于（ ）。","options":[{"key":"A","text":"温州平阳"},{"key":"B","text":"台州临海"},{"key":"C","text":"温州乐清"},{"key":"D","text":"金华义乌"}],"answer":"A","keys":["A"],"explanation":"素有“浙江延安”之称的浙南（平阳）抗日根据地旧址，是新民主主义革命时期浙江唯一一次全省党代会（中共浙江省一大）的召开地。","type":"单选题"},{"number":128,"stem":"中国工农红军长征翻越的最后一座高山是（ ）。","options":[{"key":"A","text":"贺兰山"},{"key":"B","text":"须弥山"},{"key":"C","text":"六盘山"},{"key":"D","text":"罗山"}],"answer":"C","keys":["C"],"explanation":"宁夏六盘山是中国工农红军长征翻越的最后一座高山，毛泽东在此写下《清平乐·六盘山》。","type":"单选题"},{"number":129,"stem":"被茶界奉为“茶圣”的是（ ）。","options":[{"key":"A","text":"陆羽"},{"key":"B","text":"孙思邈"},{"key":"C","text":"贾思勰"},{"key":"D","text":"徐光启"}],"answer":"A","keys":["A"],"explanation":"答案选 A。唐代陆羽著《茶经》，是中国也是世界第一部茶叶科学专著，记述了茶的起源、品质、种植方法、产地、采制、烹饮及器具等，陆羽因此被茶界奉为“茶圣”。B 孙思邈是唐代名医，著《千金方》，被誉为“药王”。C 贾思勰是北魏农学家，著《齐民要术》。D徐光启是明代农学家，著《农政全书》。同类对比——茶文化：· 陆羽：唐人，著《茶经》，被后人誉为“茶圣”；· 《茶经》：是中国也是世界第一部有关茶叶的科学专著；· 唐代：饮茶风气大盛。","type":"单选题"},{"number":130,"stem":"保存了古汉语音韵，被学术界认定为“古汉语的活化石”的是（ ）。","options":[{"key":"A","text":"闽南语"},{"key":"B","text":"客家方言"},{"key":"C","text":"福州话"},{"key":"D","text":"萧仙话"}],"answer":"B","keys":["B"],"explanation":"客家方言保存了古汉语音韵，被学术界认定为“古汉语的活化石”。三、多选题","type":"单选题"},{"number":131,"stem":"“元杂剧四大悲剧”包括（ ）。","options":[{"key":"A","text":"《窦娥冤》"},{"key":"B","text":"《汉宫秋》"},{"key":"C","text":"《梧桐雨》"},{"key":"D","text":"《赵氏孤儿》"},{"key":"E","text":"《西厢记》"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"正确答案为 ABCD。关汉卿《窦娥冤》、马致远《汉宫秋》、白朴《梧桐雨》和纪君祥《赵氏孤儿》合称“元杂剧四大悲剧”。易混对比——四大悲剧、元曲四大家与四大古典戏曲：· 四大悲剧：窦娥冤、汉宫秋、梧桐雨、赵氏孤儿；· 元曲四大家：关汉卿、白朴、马致远、郑光祖；· 四大古典戏曲：西厢记、牡丹亭、桃花扇、长生殿。","type":"多选题"},{"number":132,"stem":"我国已开发的冰川风景区有（ ）。","options":[{"key":"A","text":"四川贡嘎山海螺沟冰川"},{"key":"B","text":"新疆阿尔泰山喀纳斯冰川湖"},{"key":"C","text":"云南丽江玉龙雪山冰川"},{"key":"D","text":"吉林长白山冰川"},{"key":"E","text":"西藏林芝冰川"}],"answer":"ABC","keys":["A","B","C"],"explanation":"我国已开发的冰川风景区有四川贡嘎山海螺沟冰川、新疆阿尔泰山喀纳斯冰川湖、云南丽江玉龙雪山冰川等。D吉林长白山、E 西藏林芝不在已开发冰川风景区之列。易混对比——我国已开发的冰川风景区：· 四川贡嘎山海螺沟冰川；· 新疆阿尔泰山喀纳斯冰川湖；· 云南丽江玉龙雪山冰川。","type":"多选题"},{"number":133,"stem":"昆曲诞生了诸多传世经典，下列属于昆曲传世经典的有（ ）。","options":[{"key":"A","text":"《汉宫秋》"},{"key":"B","text":"《牡丹亭》"},{"key":"C","text":"《红楼梦》"},{"key":"D","text":"《长生殿》"},{"key":"E","text":"《桃花扇》"}],"answer":"BDE","keys":["B","D","E"],"explanation":"它以曲词典雅、唱念做打俱全、表演程式精湛见长，被称为“水磨调”，诞生了《牡丹亭》《长生殿》《桃花扇》等传世经典。A项《汉宫秋》是元代马致远的杂剧代表作，C 项《红楼梦》是古典小说，均非昆曲传世经典，故不选。易混对比——昆曲传世经典：· 《牡丹亭》《长生殿》《桃花扇》：昆曲传世经典；· 《汉宫秋》：元代马致远杂剧代表作，非昆曲剧目；· 昆曲：2001年首批“人类口头和非物质遗产代表作”，被称为“百戏之祖”（江苏）。","type":"多选题"},{"number":134,"stem":"西凤酒的“三绝”包括（ ）。","options":[{"key":"A","text":"不上头"},{"key":"B","text":"入口醇和浓郁"},{"key":"C","text":"不干喉"},{"key":"D","text":"蜜香清雅"},{"key":"E","text":"回味愉快"}],"answer":"ACE","keys":["A","C","E"],"explanation":"答案选 ACE。西凤酒“不上头、不干喉、回味愉快”的特点被世人赞为“三绝”。B项，入口醇和浓郁是董酒的特点。D 项，蜜香清雅是米香型酒的主要特征。26 版教材改动：西凤酒特点描述改为“不上头、不干喉、回味愉快”的“三绝”，并新增“酒中凤凰”美誉。易混对比——西凤酒三绝：· 西凤酒三绝：不上头、不干喉、回味愉快；· 米香型：蜜香清雅、入口柔绵、落口爽冽、回味悠长；· 西凤酒属性：陕西西凤酒是兼香型白酒代表；· 区分关键：西凤三绝看不上头、不干喉、回味愉快；米香型看蜜香清雅。","type":"多选题"},{"number":135,"stem":"福建是产茶大省，在全国占有重要地位。关于福建茶叶，下列说法正确的有（ ）。","options":[{"key":"A","text":"红茶代表有武夷山“正山小种”、福安“坦洋工夫”"},{"key":"B","text":"茉莉花茶代表有福州茉莉花茶"},{"key":"C","text":"福建是乌龙茶、红茶、白茶、茉莉花茶的发源地"},{"key":"D","text":"安溪铁观音是绿茶的主要代表之一"},{"key":"E","text":"白茶代表有白毫银针、白牡丹"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"福建是乌龙茶、红茶、白茶、茉莉花茶的发源地。乌龙茶的主要代表有安溪铁观音和武夷岩茶；红茶的代表有武夷山“正山小种”、福安“坦洋工夫”等；白茶的代表有白毫银针、白牡丹等；茉莉花茶的代表有福州茉莉花茶等。D 项安溪铁观音是乌龙茶的主要代表之一，而非绿茶，故不选。易混对比——福建茶类归属（福建）：· 乌龙茶：安溪铁观音、武夷岩茶（大红袍为精品）；· 红茶：武夷山“正山小种”、福安“坦洋工夫”；· 白茶：白毫银针、白牡丹；· 茉莉花茶：福州茉莉花茶。","type":"多选题"},{"number":136,"stem":"下列国家与首都对应正确的有（ ）。","options":[{"key":"A","text":"日本——东京"},{"key":"B","text":"韩国——首尔"},{"key":"C","text":"泰国——曼谷"},{"key":"D","text":"印度——新德里"},{"key":"E","text":"巴西——里约热内卢"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"答案选 ABCD。日本首都东京、韩国首都首尔、泰国首都曼谷、印度首都新德里。E巴西的首都是巴西利亚，不是里约热内卢，故 E项错误。","type":"多选题"},{"number":137,"stem":"过诺鲁孜节的民族有（ ）。","options":[{"key":"A","text":"柯尔克孜族"},{"key":"B","text":"乌孜别克族"},{"key":"C","text":"回族"},{"key":"D","text":"维吾尔族"},{"key":"E","text":"哈萨克族"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"诺鲁孜节是新疆维吾尔、哈萨克、柯尔克孜、乌孜别克和塔吉克族共有的传统民族节日，时间在春分时节，相当于公历 3 月 22 日，内容是辞旧迎新，类似内地的春节。C 项回族的传统节日主要有开斋节、古尔邦节、圣纪节等，不过诺鲁孜节，故不选。易混对比——新疆共有节日诺鲁孜节：· 诺鲁孜节：维吾尔、哈萨克、柯尔克孜、乌孜别克、塔吉克族共有，春分时节；· 开斋节、古尔邦节：回族、维吾尔族等民族的共同节日；· 注意：回族没有诺鲁孜节。","type":"多选题"},{"number":138,"stem":"下列人物中，属于历史上最著名的“京剧四大名旦”的有（ ）。","options":[{"key":"A","text":"周信芳"},{"key":"B","text":"梅兰芳"},{"key":"C","text":"程砚秋"},{"key":"D","text":"荀慧生"},{"key":"E","text":"尚小云"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"历史上最著名的“京剧四大名旦”是梅兰芳、尚小云、程砚秋、荀慧生。A 周信芳是清末民初海派京剧的著名艺人，不属于京剧四大名旦。","type":"多选题"},{"number":139,"stem":"下列关于帝王陵墓封土形式的表述，正确的有（ ）。","options":[{"key":"A","text":"周代开始“封土为坟”"},{"key":"B","text":"秦汉时期取“方上”形式，以秦始皇陵为典型"},{"key":"C","text":"唐代改为“以山为陵”，以唐乾陵为典型"},{"key":"D","text":"宋代恢复“方上”，但规模比秦汉时代小得多"},{"key":"E","text":"唐乾陵采用“方上”形式"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"答案选 ABCD。周代开始“封土为坟”；秦汉时期取“方上”形式，以秦始皇陵为典型；唐代改为“以山为陵”，唐乾陵即为典型；宋代恢复“方上”，但规模比秦汉时代小得多。E唐乾陵采用“以山为陵”形式，不是“方上”，故 E项错误。同类对比——帝王陵墓封土形式沿革：· 周代：开始“封土为坟”；· 秦汉时期：取“方上”形式，以秦始皇陵为典型；· 唐代：改为“以山为陵”，以唐乾陵为典型；· 宋代：恢复“方上”，规模比秦汉小得多；· 明清两代：采用“宝城宝顶”形式。","type":"多选题"},{"number":140,"stem":"下列属于“中国四大名陶”的有（ ）。","options":[{"key":"A","text":"江苏宜兴紫砂器"},{"key":"B","text":"云南建水紫陶"},{"key":"C","text":"广西钦州坭兴陶"},{"key":"D","text":"重庆荣昌安富陶"},{"key":"E","text":"河南洛阳仿唐三彩"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"答案选 ABCD。中国四大名陶包括江苏宜兴紫砂器、云南建水紫陶、广西钦州坭兴陶和重庆荣昌安富陶。河南洛阳仿唐三彩属于历史悠久的陶器产地，但不列入四大名陶。26教材新增考点。易混对比——四大名陶：· 江苏宜兴：紫砂器；· 云南建水：紫陶；· 广西钦州：坭兴陶；· 重庆荣昌：安富陶。","type":"多选题"},{"number":141,"stem":"关于上海的城市定位与发展，下列说法正确的有（ ）。","options":[{"key":"A","text":"上海是全国最大的经济中心城市"},{"key":"B","text":"上海是全球重要的经济枢纽"},{"key":"C","text":"上海是长三角世界级城市群的核心城市"},{"key":"D","text":"上海是国际经济、金融、贸易、航运、科技创新中心和文化大都市"},{"key":"E","text":"上海享有“新零售之都”“电商直播之都”“电竞之都”等新称号"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"本题说法全部正确。上海是全国最大的经济中心城市和全球重要的经济枢纽，是国务院批复确定的长江三角洲世界级城市群的核心城市，也是国际经济、金融、贸易、航运、科技创新中心和文化大都市。上海享有“新零售之都”“电商直播之都”“电竞之都”等新称号。","type":"多选题"},{"number":142,"stem":"下列属于“太行三珍”的有（ ）。","options":[{"key":"A","text":"栗子"},{"key":"B","text":"花椒"},{"key":"C","text":"核桃"},{"key":"D","text":"红枣"},{"key":"E","text":"柿子"}],"answer":"BCE","keys":["B","C","E"],"explanation":"核桃、柿子和花椒并称“涉县三珍”或“太行三珍”。A 项栗子、D项红枣均不属于“太行三珍”，故不选。同类对比——河北风物（河北）：· “涉县三珍”（“太行三珍”）：核桃、柿子、花椒；· 河间驴肉火烧：河北标志性特产美食；· 正定“三八席”：八凉、八热、八蒸碗的传统民俗宴席。","type":"多选题"},{"number":143,"stem":"傣族的传统节日主要有（ ）。","options":[{"key":"A","text":"开门节"},{"key":"B","text":"火把节"},{"key":"C","text":"泼水节"},{"key":"D","text":"沐浴节"},{"key":"E","text":"关门节"}],"answer":"ACE","keys":["A","C","E"],"explanation":"傣族的传统节日主要有泼水节、关门节和开门节等。B 项火把节是彝族最盛大的节日，D项沐浴节是藏族传统节日，均非傣族传统节日，故不选。易混对比——西南民族节日：· 泼水节、关门节、开门节：傣族传统节日；· 火把节：彝族最盛大的节日；· 沐浴节：藏族传统节日（9月上旬）。","type":"多选题"},{"number":144,"stem":"下列景观中，共同构成山城重庆神奇魅力的有（ ）。","options":[{"key":"A","text":"天空之城洪崖洞"},{"key":"B","text":"8D魔幻立交桥"},{"key":"C","text":"时尚金街解放碑"},{"key":"D","text":"千年古镇磁器口"},{"key":"E","text":"轻轨穿楼李子坝"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"重庆独特的地理与文化环境孕育了其特有的城市旅游品牌，时尚金街解放碑、天空之城洪崖洞、千年古镇磁器口，轻轨穿楼李子坝、8D 魔幻立交桥、长江过江索道以及城市康养好去处的南温泉、北温泉等，共同构成了山城重庆的神奇魅力。","type":"多选题"},{"number":145,"stem":"那达慕大会每年夏季举办，集合了体育竞技和文化娱乐，其项目包括（ ）。","options":[{"key":"A","text":"摔跤"},{"key":"B","text":"叼羊"},{"key":"C","text":"赛马"},{"key":"D","text":"射箭"},{"key":"E","text":"赛歌"}],"answer":"ACD","keys":["A","C","D"],"explanation":"那达慕大会是蒙古族最重要的节日之一，每年夏季举办，集合了体育竞技和文化娱乐，包括赛马、摔跤、射箭等项目。B项叼羊是新疆少数民族的民间竞技项目，E项赛歌是壮族“歌圩”的活动形式，均非那达慕大会项目，故不选。易混对比——那达慕大会项目：· 赛马、摔跤、射箭：那达慕大会传统项目；· 姑娘追：哈萨克青年最喜爱的马上体育游戏（新疆）；· 赛歌：壮族“歌圩”对歌、赛歌集会。","type":"多选题"},{"number":146,"stem":"下列佛教名山与菩萨道场对应正确的有（ ）。","options":[{"key":"A","text":"山西五台山——文殊菩萨"},{"key":"B","text":"浙江普陀山——观音菩萨"},{"key":"C","text":"四川峨眉山——普贤菩萨"},{"key":"D","text":"安徽九华山——地藏菩萨"},{"key":"E","text":"湖北武当山——地藏菩萨"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"汉地佛教四大名山为五台山、普陀山、峨眉山和九华山，分别对应文殊、观音、普贤和地藏菩萨。E 项湖北武当山不属于汉地佛教四大名山，地藏菩萨道场是安徽九华山。易混对比——汉地佛教四大名山与菩萨道场：· 五台山（山西）：文殊菩萨道场；· 普陀山（浙江）：观音菩萨道场；· 峨眉山（四川）：普贤菩萨道场；· 九华山（安徽）：地藏菩萨道场。","type":"多选题"},{"number":147,"stem":"中国古典园林构景手段中的抑景，又可分为（ ）。","options":[{"key":"A","text":"山抑"},{"key":"B","text":"树抑"},{"key":"C","text":"曲抑"},{"key":"D","text":"水抑"},{"key":"E","text":"花抑"}],"answer":"ABC","keys":["A","B","C"],"explanation":"答案选 ABC。抑景有山抑、树抑、曲抑之分：园林入口处迎门挡以假山叫山抑；杭州花港观鱼东大门的雪松是树抑的范例；“山重水复疑无路，柳暗花明又一村”是曲抑的体现。D水抑、E 花抑不是抑景的分类，故 D、E 项错误。同类对比——抑景的分类：· 山抑：园林入口处迎门挡以假山；· 树抑：杭州花港观鱼东大门的雪松为范例；· 曲抑：“山重水复疑无路，柳暗花明又一村”的体现。","type":"多选题"},{"number":148,"stem":"下列白酒品牌中，属于四川“六朵金花”的有（ ）。","options":[{"key":"A","text":"郎酒"},{"key":"B","text":"剑南春"},{"key":"C","text":"泸州老窖"},{"key":"D","text":"汾酒"},{"key":"E","text":"五粮液"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"四川五粮液、泸州老窖、剑南春、水井坊、郎酒和舍得酒“六朵金花”，几乎占据了中国名酒的半壁河山。D项汾酒为山西名酒，不属于四川“六朵金花”，故不选。易混对比——川酒“六朵金花”：· 五粮液、泸州老窖、剑南春、水井坊、郎酒、舍得酒：川酒“六朵金花”；· 汾酒：山西名酒，有着 4000多年悠久历史；· 茅台酒：产自遵义仁怀市茅台镇，被誉为酱香型白酒标杆典范（贵州）。","type":"多选题"},{"number":149,"stem":"下列画家与其代表作对应正确的有（ ）。","options":[{"key":"A","text":"顾恺之——《女史箴图》《洛神赋图》"},{"key":"B","text":"展子虔——《游春图》"},{"key":"C","text":"阎立本——《步辇图》《历代帝王图》"},{"key":"D","text":"吴道子——《送子天王图》"},{"key":"E","text":"张择端——《清明上河图》"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"顾恺之代表作《女史箴图》《洛神赋图》；展子虔代表作《游春图》；阎立本代表作《步辇图》《历代帝王图》；吴道子代表作《送子天王图》；张择端代表作《清明上河图》。以上对应均正确。","type":"多选题"},{"number":150,"stem":"江西“四大名山”是指（ ）。","options":[{"key":"A","text":"庐山"},{"key":"B","text":"井冈山"},{"key":"C","text":"三清山"},{"key":"D","text":"龙虎山"},{"key":"E","text":"武夷山"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"四大名山：匡庐奇秀甲天下的庐山、养生福地井冈山、峰林奇观三清山、道教祖庭龙虎山。E项武夷山在福建，非江西“四大名山”内容，故不选。同类对比——江西“四大名山”（江西）：· 庐山：匡庐奇秀甲天下；· 井冈山：养生福地；· 三清山：峰林奇观；· 龙虎山：道教祖庭。","type":"多选题"},{"number":151,"stem":"武隆景区的主要组成部分有（ ）。","options":[{"key":"A","text":"仙女山"},{"key":"B","text":"金佛山"},{"key":"C","text":"天生三桥"},{"key":"D","text":"黑山谷"},{"key":"E","text":"芙蓉洞"}],"answer":"ACE","keys":["A","C","E"],"explanation":"武隆景区地处武陵山与大娄山脉交会的褶皱地带，喀斯特地貌十分显著，主要由“天生三桥、仙女山、芙蓉洞”三部分组成。B项金佛山、D 项黑山谷均为重庆知名景区，非武隆景区组成部分，故不选。易混对比——重庆景区（重庆）：· 武隆景区：天生三桥、仙女山、芙蓉洞三部分，芙蓉洞有目前国内外发现的最大竖井群；· 金佛山：“喀斯特桌山”地貌世界遗产，“生物基因库、中华药库”；· 万盛黑山谷：重庆 5A景区，非武隆组成部分。","type":"多选题"},{"number":152,"stem":"香港夜景有“世界三大夜景”之一的美誉，观赏香港夜景的最佳地点有（ ）。","options":[{"key":"A","text":"中环摩天轮"},{"key":"B","text":"天际 100香港观景台"},{"key":"C","text":"太平山顶"},{"key":"D","text":"金紫荆广场"},{"key":"E","text":"海洋公园"}],"answer":"ABC","keys":["A","B","C"],"explanation":"香港夜景最佳观赏地点是香港中环摩天轮里，天际 100香港观景台或坐山顶缆车登上太平山顶。D项金紫荆广场、E 项海洋公园均非观赏香港夜景的最佳地点，故不选。","type":"多选题"},{"number":153,"stem":"下列民居建筑与地域对应正确的有（ ）。","options":[{"key":"A","text":"骑楼——岭南"},{"key":"B","text":"四合院——北京"},{"key":"C","text":"围龙屋——客家"},{"key":"D","text":"石库门里弄——上海"},{"key":"E","text":"吊脚楼——四川"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"四合院是北京传统民居，骑楼是岭南特色建筑，客家围屋（也称为围龙屋、围屋、转龙屋、客家围龙屋）是中华客家文化中著名的特色民居建筑，石库门里弄是上海最具本土特色的民居建筑形态。E 项吊脚楼为土家族、苗族等民族的传统民居，与“四川”对应不当，故不选。易混对比——民居与地域：· 四合院：北京传统民居（北京）；· 石库门里弄：上海最具本土特色的民居建筑形态（上海）；· 骑楼：岭南特色建筑，广州骑楼为粤派骑楼代表（广东）；· 围龙屋：客家文化中著名的特色民居建筑（广东）；· 吊脚楼：土家族、苗族依山而建的传统民居（湖南、贵州等）。","type":"多选题"},{"number":154,"stem":"我国著名的四大民间木刻年画产地是（ ）。","options":[{"key":"A","text":"苏州桃花坞"},{"key":"B","text":"天津杨柳青"},{"key":"C","text":"山东潍坊杨家埠"},{"key":"D","text":"四川绵竹"},{"key":"E","text":"河南朱仙镇"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"答案选 ABCD。苏州桃花坞、天津杨柳青、山东潍坊杨家埠和四川绵竹，是我国著名的四大民间木刻年画产地。E河南朱仙镇不在四大民间木刻年画产地之列，故 E项错误。","type":"多选题"},{"number":155,"stem":"湖北土家族山歌的歌词内容有（ ）。","options":[{"key":"A","text":"情歌"},{"key":"B","text":"苦歌"},{"key":"C","text":"打猎歌"},{"key":"D","text":"敬酒歌"},{"key":"E","text":"扯谎歌"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"湖北土家族人好唱山歌，其歌词内容非常丰富，有谈情说爱的“情歌”、倾诉苦情的“苦歌”、上山打猎的“打猎歌”、女儿出嫁的“哭嫁歌”、开心逗趣的“扯谎歌”，所谓“婚丧嫁娶设歌堂、喜怒哀乐都是歌”。D 项敬酒歌不在土家族山歌歌词内容之列，故不选。同类对比——土家族歌舞：· 山歌歌词：情歌、苦歌、打猎歌、哭嫁歌、扯谎歌（湖北）；· 山歌类型：情歌、哭嫁歌、摆手歌、劳动歌、盘歌（湖南）；· 摆手舞：最著名的土家舞蹈（湖南）；· 摊戏：被称为“中国戏剧的活化石”（湖南）。","type":"多选题"},{"number":156,"stem":"官式建筑屋顶形式中，级别高于攒尖的有（ ）。","options":[{"key":"A","text":"重檐庑殿"},{"key":"B","text":"重檐歇山"},{"key":"C","text":"单檐庑殿"},{"key":"D","text":"单檐歇山"},{"key":"E","text":"卷棚"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"答案选 ABCD。官式建筑屋顶形式级别从高到低依次为重檐庑殿、重檐歇山、单檐庑殿、单檐歇山、攒尖、悬山、硬山、卷棚；重檐庑殿顶规格最高，如故宫太和殿。E 卷棚排在攒尖之后，级别低于攒尖，故 E项错误。","type":"多选题"},{"number":157,"stem":"下列属于贵州省国家 5A级旅游景区的有（ ）。","options":[{"key":"A","text":"黄果树瀑布景区"},{"key":"B","text":"龙宫景区"},{"key":"C","text":"百里杜鹃景区"},{"key":"D","text":"石林风景区"},{"key":"E","text":"万峰林景区"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"贵州 10 处：黄果树大瀑布、龙宫、百里杜鹃、樟江、青岩古镇、梵净山、镇远古城、赤水丹霞、织金洞、黔西南州万峰林。D 项石林风景区属于云南省 5A 级景区，不属于贵州，故不选。","type":"多选题"},{"number":158,"stem":"中国目前保存最为完好的四大古城有（ ）。","options":[{"key":"A","text":"南京古城"},{"key":"B","text":"平遥古城"},{"key":"C","text":"丽江古城"},{"key":"D","text":"徽州古城"},{"key":"E","text":"阆中古城"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"正确答案为 BCDE。中国目前古城中保存最为完好的是平遥古城、丽江古城、徽州古城、阆中古城。26 版教材新增考点。同类对比——四大古城保存与构成：· 四大古城：平遥、丽江、徽州、阆中；· 其他古城：西安、南京、凤凰、大理、荆州等；区分关键：保存最完好的四大古城为平遥、丽江、徽州、阆中。","type":"多选题"},{"number":159,"stem":"安徽“皖南四大名山”是指（ ）。","options":[{"key":"A","text":"九华山"},{"key":"B","text":"天柱山"},{"key":"C","text":"琅琊山"},{"key":"D","text":"齐云山"},{"key":"E","text":"黄山"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"安徽自然景观山水相连，尤以“皖南四大名山”黄山、九华山、天柱山、齐云山最具有代表性。C项琅琊山在安徽滁州，不属“皖南四大名山”，故不选。易混对比——“四大名山”组合：· 皖南四大名山：黄山、九华山、天柱山、齐云山（安徽）；· 江西四大名山：庐山、井冈山、三清山、龙虎山（江西）；· 琅琊山：安徽滁州 5A景区，不在“皖南四大名山”之列。","type":"多选题"},{"number":160,"stem":"下列菜品中，属于民间湘菜代表菜品的有（ ）。","options":[{"key":"A","text":"吉首酸肉"},{"key":"B","text":"辣椒炒肉"},{"key":"C","text":"毛血旺"},{"key":"D","text":"剁椒鱼头"},{"key":"E","text":"湘西外婆菜"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"湘菜代表派系为组庵湘菜，如组庵豆腐、组庵鱼翅等；民间湘菜代表菜品有剁椒鱼头、辣椒炒肉、湘西外婆菜、吉首酸肉等。C 项毛血旺为重庆菜肴，非民间湘菜代表菜品，故不选。易混对比——湘菜构成（湖南）：· 组庵湘菜：组庵豆腐、组庵鱼翅等；· 民间湘菜：剁椒鱼头、辣椒炒肉、湘西外婆菜、吉首酸肉；· 毛血旺：重庆火锅经典，非湘菜（重庆）。","type":"多选题"},{"number":161,"stem":"伟大建党精神的具体内涵包括（ ）。","options":[{"key":"A","text":"坚持真理、坚守理想"},{"key":"B","text":"践行初心、担当使命"},{"key":"C","text":"不怕牺牲、英勇斗争"},{"key":"D","text":"对党忠诚、不负人民"},{"key":"E","text":"无私奉献、勇于创新"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"中国共产党的先驱们创建了中国共产党，形成了坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民的伟大建党精神，这是中国共产党的精神之源。E“无私奉献、勇于创新”属于三线精神，不属于伟大建党精神。","type":"多选题"},{"number":162,"stem":"唐三彩的颜色以（ ）三色为主，但也有紫、褐、蓝等色。","options":[{"key":"A","text":"黄"},{"key":"B","text":"绿"},{"key":"C","text":"白"},{"key":"D","text":"红"},{"key":"E","text":"黑"}],"answer":"ABC","keys":["A","B","C"],"explanation":"唐三彩以黄、绿、白三色为主，但也有紫、褐、蓝等色，其中蓝色是中国最早的以钴土作彩料所呈现的釉色；考古发现的唐三彩大都用作明器（随葬品）。D红、E 黑不是唐三彩的主色。同类对比——唐三彩釉色：· 主色：黄、绿、白三色；· 其他色：有紫、褐、蓝等色；· 蓝色：中国最早的以钴土作彩料所呈现的釉色。","type":"多选题"},{"number":163,"stem":"三星堆遗址出土的文物有（ ）。","options":[{"key":"A","text":"青铜神树"},{"key":"B","text":"“太阳神鸟”金饰"},{"key":"C","text":"青铜人面具"},{"key":"D","text":"黄金杖"},{"key":"E","text":"青铜大立人像"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"如 57 件青铜人面具，高 3.96 米的青铜神树，高 2.62 米的青铜大立人像，宽 1.38米并长着“千里眼”“顺风耳”的青铜面具，长 1.42米的黄金杖。B项“太阳神鸟”金饰出土于金沙遗址，非三星堆遗址，故不选。易混对比——三星堆与金沙（四川）：· 三星堆遗址：57 件青铜人面具、高 3.96 米青铜神树、高 2.62米青铜大立人像、长 1.42米黄金杖；· 金沙遗址：“太阳神鸟”金饰，已成为中国文化遗产的标志。","type":"多选题"},{"number":164,"stem":"鲁菜的代表名菜有（ ）。","options":[{"key":"A","text":"葱烧海参"},{"key":"B","text":"松鼠鳜鱼"},{"key":"C","text":"糖醋鲤鱼"},{"key":"D","text":"油焖大虾"},{"key":"E","text":"白切鸡"}],"answer":"ACD","keys":["A","C","D"],"explanation":"答案选 ACD。鲁菜三大头牌菜为葱烧海参、糖醋鲤鱼、九转大肠，其他代表性菜品有油焖大虾、油爆双脆等。B项，松鼠鳜鱼属苏菜。E 项，白切鸡属粤菜。易混对比——地域与菜系代表菜对应（地名+菜名）：· 苏菜五大头牌：蟹粉狮子头、松鼠鳜鱼、大煮干丝、金陵盐水鸭、无锡酱排骨；· 鲁菜三大头牌：葱烧海参、糖醋鲤鱼、九转大肠；· 粤菜四大头牌：白切鸡、烧鹅、烤乳猪、佛跳墙；· 川菜名菜：鱼香肉丝、宫保鸡丁、夫妻肺片、麻婆豆腐、回锅肉、凉拌鸡、开水白菜、鸡豆花等；· 粤菜其他经典菜品：红烧乳鸽、蜜汁叉烧、潮汕卤鹅、东江盐焗鸡、爽口牛丸等。· 苏菜名品：文思豆腐、软兜长鱼、三套鸭、响油鳝糊等。","type":"多选题"},{"number":165,"stem":"徽州建筑中的“三大瑰宝”包括（ ）。","options":[{"key":"A","text":"徽州府衙"},{"key":"B","text":"许国石坊"},{"key":"C","text":"渔梁坝"},{"key":"D","text":"承志堂"},{"key":"E","text":"周庄双桥"}],"answer":"ABC","keys":["A","B","C"],"explanation":"正确答案为 ABC。徽州府街、许国石坊、渔梁坝被称为徽派建筑的“三大瑰宝”。26版教材新增考点。同类对比——安徽徽派建筑三大瑰宝：·徽州府衙:在徽州古城中心，称缩小的故宫;·许国石坊:唯一八柱四面围合八脚牌楼;·渔梁坝:新安江最古老拦河坝，称徽州都江堰。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD7/2b97e2461f5f76822e1d062d8d6926a0_852780904920182118_m_LDD押题第7卷（科目三四）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD7/2b97e2461f5f76822e1d062d8d6926a0_852780904920182118_m_LDD押题第7卷（科目三四）-试卷.pdf"}]},{"number":8,"subjects":[{"name":"科目一二","questions":[{"number":1,"stem":"依据《中华人民共和国宪法》的规定，劳动既是公民的权利，也是公民的义务。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。《宪法》第 42 条规定，中华人民共和国公民有劳动的权利和义务。","type":"判断题"},{"number":2,"stem":"根据《中华人民共和国宪法》的规定，公民必须遵守公共秩序，尊重社会公德。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。宪法第 3条规定公民必须遵守公共秩序，尊重社会公德。在这里\"必须\"体现出宪法的法律地位，强调\"根本性、无条件\"义务。","type":"判断题"},{"number":3,"stem":"依据《民法典》，法律、行政法规规定或者当事人约定采用特定形式的，应当采用特定形式。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。民事法律行为可以采用书面形式、口头形式或者其他形式；法律、行政法规规定或者当事人约定采用特定形式的，应当采用特定形式。","type":"判断题"},{"number":4,"stem":"根据《民法典》的规定，当事人应当循诚信原则，根据合同的性质、目的和交易习惯履行通知、协助、保密等义务。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":5,"stem":"《旅行社条例》规定，旅行社每设立一个经营国内旅游业务和入境业务的分社，应当向其注册资本账户增存 5万元。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。错在注册资本账户。每设立 1 个经营国内旅游业务和入境旅游业务的分社，应当向其质量保证金账户增存 5万元；每设立 1 个经营出境旅游业务的分社，应当向其质量保证金账户增存 30万元。无须增加注册资金。","type":"判断题"},{"number":6,"stem":"对于滋扰跟踪他人的行为，仅可以由人民法院责令行为人禁止接触被侵害人。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《中华人民共和国治安管理处罚法》第五十条第二款，有前款第五项规定的滋扰、纠缠、跟踪行为的，除依照前款规定给予处罚外，经公安机关负责人批准，可以责令其一定期限内禁止接触被侵害人。对违反禁止接触规定的，处五日以上十日以下拘留，可以并处一千元以下罚款。本题说法错在\"仅可以由人民法院\"。","type":"判断题"},{"number":7,"stem":"根据《旅游投诉处理办法》第 5 条的规定，旅游投诉应当由旅游经营者住所地的县级以上旅游投诉处理机构管辖。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《旅游投诉处理办法》第 5 条规定:\"旅游投诉由旅游经营者住所地、旅游合同签订地或者旅游纠纷发生地县级以上旅游投诉处理机构管辖。\"旅游经营者住所地、旅游合同签订地、旅游纠纷发生地三个地点的机构均有管辖权，投诉人可择一选择，并不是\"应当\"由旅游经营者住所地的县级以上旅游投诉处理机构管辖。","type":"判断题"},{"number":8,"stem":"《旅游安全管理办法》规定，省级旅游主管部门应当于每月 5日前，将本地区上月发生的较大旅游突发事件报文化和旅游部备案。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。省级旅游主管部门应当于每月 5 日前，将本地区上月发生的较大旅游突发事件报文化和旅游部备案，内容应当包括突发事件发生的时间、地点、原因及事件类型和伤亡人数等。","type":"判断题"},{"number":9,"stem":"根据《中华人民共和国民用航空法》的规定，实施危害民用航空安全或者扰乱民用航空秩序的行为，构成违反治安管理行为的，由公安机关依法追究刑事责任。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。第 255条，违反本法规定，实施危害民用航空安全或者扰乱民用航空秩序的行为，构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。","type":"判断题"},{"number":10,"stem":"根据《自然保护区条例》的规定，在核心保护区内开展法律规定以外的活动，造成生态破坏的，责令限期修复，处 100万元以上 500万元以下罚款。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。《自然保护区条例》第四十条:在自然保护区核心保护区内开展本条例第二十六条规定以外的活动的，由县级以上人民政府林业草原、自然资源、生态环境、水行政、农业农村等有关部门按照职责分工责令停止违法行为，没收违法所得，可以处 10万元以下的罚款；属于违法修筑设施或者进行工程建设的，责令限期拆除、恢复原状，处 10万元以上 100 万元以下的罚款；造成生态破坏的，责令限期修复或者采取其他补救措施，处100 万元以上 500 万元以下的罚款。该表述中\"造成生态破坏\"的罚款为\"100 万元以上 500万元以下罚款\"，故判断为对。","type":"判断题"},{"number":11,"stem":"《保护世界文化和自然遗产公约》规定，本公约缔约国领土内的文化遗产和自然遗产的确定、保护、保存、展出和遗传后代，主要是缔约国共同的责任。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。本公约缔约国领土内的文化遗产和自然遗产的确定、保护、保存、展出和遗传后代，主要是有关国家的责任。故本题后半句说法错误。","type":"判断题"},{"number":12,"stem":"人民是历史的创造者，是决定党和国家前途命运的根本力量。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。\"十四个坚持\"中的坚持以人民为中心明确指出人民的这一地位。","type":"判断题"},{"number":13,"stem":"全面从严治党必须以党章为根本遵循，把党的政治建设摆在首位。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。全面从严治党必须以党章为根本遵循，把党的政治建设摆在首位。","type":"判断题"},{"number":14,"stem":"根据《关于印发 2026年版团队旅游合同(示范文本)的通知》，因地接社、履行辅助人违约，旅游者既可以向组团社主张权利，也可以直接向地接社、履行辅助人追责。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2026 年版合同拓宽了维权路径，旅游者既可以告组团社，也可直接向地接社、履行辅助人追责。","type":"判断题"},{"number":15,"stem":"《港区国安法》规定，驻香港特别行政区维护国家安全公署的经费由香港特区政府保障。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《港区国安法》第 51条规定:\"驻香港特别行政区维护国家安全公署的经费由中央财政保障。该规定确保驻港国安公署独立行使职权，不受地方财政制约，体现中央对香港国家安全事务的直接责任和统一领导。经费由中央保障，有利于保障执法的权威性、独立性和高效性，防止外部干预。","type":"判断题"},{"number":16,"stem":"根据《国旗法》的规定，升挂国旗时，可以举行升旗仪式。举行升旗仪式时，可以奏唱国歌。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。根据《国旗法》规定:\"升挂国旗时，可以举行升旗仪式。举行升旗仪式时，应当奏唱国歌。在国旗升起的过程中，在场人员应当面向国旗肃立，行注目礼或者按照规定要求敬礼，不得有损害国旗尊严的行为。\"由此可见，升挂国旗\"不一定\"要举行升旗仪式，只有在举行升旗仪式时才\"应当\"奏唱国歌，而非\"可以\"。原题中\"可以奏唱国歌\"错误：将\"强制性义务\"降为\"可选行为\"。","type":"判断题"},{"number":17,"stem":"米兰冬残奥会上，中国代表团以 15金 13银 16 铜的成绩位居金牌榜第一、奖牌榜第二。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为\"金牌榜、奖牌榜双第一\"。米兰冬残奥会‑ 2026 年 3 月举行，中国代表团 15 金 13银 16铜，金牌榜、奖牌榜双榜首，创境外参赛最佳战绩。","type":"判断题"},{"number":18,"stem":"2026年 7 月 1 日上午，庆祝中国共产党成立 105周年大会在北京人民大会堂隆重举行，习近平向 6名\"七一勋章\"获得者颁授勋章并发表重要讲话。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为\"8 名\"。2026 年 7 月 1 日上午 10 时，庆祝中国共产党成立 105周年大会在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平向\"七一勋章\"获得者颁授勋章并发表重要讲话，大会还对全国优秀共产党员、全国优秀党务工作者和全国先进基层党组织进行了表彰。习近平在讲话中深刻阐述了中国共产党之所以能够在 105年奋斗中不断铸就辉煌的\"优秀特质\"。\"七一勋章\"颁授‑ ‑ 2026年 7 月 1 日授 8 名：马善祥、王於昌、李连成、吾哈斯·苏来曼、吴亚琴、陈俊武、赵亚夫、钟掘；\"七一勋章\"2017年设立，2021年首次颁授。","type":"判断题"},{"number":19,"stem":"2026年 9 月 19 日至 10月 4 日在日本举行的第二十届亚洲运动会上，中国体育代表团获得 143枚金牌，位居金牌榜首位。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为\"169枚\"。第二十届亚运会(爱知·名古屋亚运会)上，中国代表团以 169金 89银 83铜共 341 枚奖牌收官，位居金牌榜、奖牌榜首位，超越 2006年多哈亚运会的 165金，创造境外参加亚运会最佳战绩。143枚为赛期网络流传的失实数据。","type":"判断题"},{"number":20,"stem":"截至 2026年 7 月底，我国光伏发电装机容量达 12.86亿千瓦，首次超过煤电，成为我国装机规模最大的单一电源类型。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。国家能源局 2026 年 9 月 1 日发布数据：截至 2026年 7月底，全国光伏发电装机容量达到 12.86 亿千瓦，同期煤电装机 12.85 亿千瓦，光伏装机规模首次超过煤电，成为我国装机规模最大的单一电源类型，改变了长期以来以煤电作为第一大电源的格局。此前，2026年上半年煤电发电量占全国总发电量比重首次降至 50%以下。","type":"判断题"},{"number":21,"stem":"世界上第一次商业性旅游活动是从莱斯特到利物浦团体消遣性旅游。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。世界上第一次商业性旅游活动是包租火车组织 570 人从莱斯特到拉夫巴勒参加禁酒大会。","type":"判断题"},{"number":22,"stem":"初级、中级导游在获得相应表彰奖励 2 年内，可以通过激励晋升的方式申请晋升一个导游等级。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":23,"stem":"导游旗形状以长方形或三角形为宜，字迹清晰、易辨识，无违背公良俗的文字、符号或图案。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":24,"stem":"地陪带领客人入住饭店时，要迅速收齐旅游者证件，快速办理入住登记手续。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。请入境领队或全陪收齐旅游者证件，然后旅游者名单表一并交给饭店前台，讲明团队名称、订房单位，快速办理入住登记手续。","type":"判断题"},{"number":25,"stem":"对于从事违法活动的游客，不听劝阻、不能制止的，导游可与其解除旅游合同。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。对于从事违法或违反社会公德活动的游客，或从事严重影响其他游客权益的活动，不听劝阻、不能制止的，根据旅行社的指示，导游领队可代表旅行社与其解除旅游合同。","type":"判断题"},{"number":26,"stem":"在导游工作中，口头语言是导游语言的主体，而书面语言则能够起到辅助作用。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":27,"stem":"进行登山运动时，需要携带足量饮用水、高热量食物、基础急救药品及防晒用品。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":28,"stem":"用于呈现庄重、严肃、平淡、冷静等情感状态的时候，适宜采用平直调。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":29,"stem":"导游带领游客参观长江三峡时，宜采用概述法为游客进行讲解。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。导游带领游客参观长江三峡时，宜采用分段讲解法为游客进行讲解。","type":"判断题"},{"number":30,"stem":"导游带团过程中，乘坐交通工具通常是先下后上。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":31,"stem":"带亲子团的导游应多采用有情节的故事、启发式和提问式讲解，满足不同年龄段成员的要求。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":32,"stem":"变数较大是商务团的一大特点，需要导游有很强的灵活应对能力，随时应对旅游行程的变更。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":33,"stem":"外国旅游者为团体签证时，须协助其去当地公安机构出入境管理部门办理分离团队签证或延长个人旅华签证手续，费用由旅行社与游客各半。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。外国旅游者为团体签证时，须协助其去当地公安机构出入境管理部门办理分离团队签证或延长个人旅华签证手续，费用由游客自理。","type":"判断题"},{"number":34,"stem":"因游客个别要求没有得到满足，游客经劝说执意退团的，所剩余的费用一律不退。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。因游客个别要求没有得到满足，游客经劝说执意退团的，所剩余的费用按照合同规定处理。","type":"判断题"},{"number":35,"stem":"旅游者在购买文物古玩时务必妥善保管好发票，并注意擦除古玩上的火漆印。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。告知旅游者在购买文物古玩时务必妥善保管好发票，并注意保留古玩上的火漆印。","type":"判断题"},{"number":36,"stem":"面色青紫肿胀、眼球结膜充血、口鼻内充满泡沫等杂物，这是溺水的症状表现。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":37,"stem":"若在野外活动时遭遇雷电，因客车对雷电有较强的导电作用，因此导游应迅速带领游客离开客车躲避。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。若在野外活动时遭遇雷电，应迅速回到旅游客车躲避。客车对雷电有较好的屏蔽作用。","type":"判断题"},{"number":38,"stem":"按照国际惯例，持有联程机票且在 24 小时内不出机场直接过境的人员一般免办签证。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":39,"stem":"由于航司原因造成航班取消或者延误，旅客退票需要收取一定比例的退票费。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。由于航司原因造成航班取消或者延误，承运人或者代理人必须免费处理。","type":"判断题"},{"number":40,"stem":"除有 3C认证以外，严禁其他游客携带额定能量大于 160Wh的充电宝上飞机。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。严禁携带额定能量>160Wh的充电宝。二、单项选择题（41‑ 130）","type":"判断题"},{"number":41,"stem":"2026 年 11 月 18 日至 19 日在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议，其主题是 ( )。","options":[{"key":"A","text":"共促繁荣，共赢未来"},{"key":"B","text":"开放·互通·协同"},{"key":"C","text":"建设亚太共同体，促进共同繁荣"},{"key":"D","text":"打造有效、包容、共同的解决方案"}],"answer":"C","keys":["C"],"explanation":"2026 年 APEC第三十三次领导人非正式会议主题为\"建设亚太共同体，促进共同繁荣\"，三大优先合作领域为\"开放、创新、合作\"。这是中国继 2001年上海、2014年北京之后第三次担任 APEC东道主。","type":"单选题"},{"number":42,"stem":"根据《中华人民共和国宪法》第 10条的规定，土地的使用权()。","options":[{"key":"A","text":"可以依照法律规定转让"},{"key":"B","text":"一律不得转让"},{"key":"C","text":"可以由公民自由转让"},{"key":"D","text":"只能由国家统一使用"}],"answer":"A","keys":["A"],"explanation":"使用转让：土地的使用可以依照法律规定转让。B 项错误，宪法第 10 条规定土地的使用可以依照法律规定转让，\"一律不得转让\"与宪法规定相；C 项错误，土地的使用权须\"依照法律规定\"转让，并非可自由转让；D 项错误，土地的使用权可以依法转让，并非只能由国家统一使用。","type":"单选题"},{"number":43,"stem":"根据《中华人民共和国宪法》的规定，作为精神文明建设核心、国家倡导的是()。","options":[{"key":"A","text":"社会主义核心价值观"},{"key":"B","text":"个人主义价值观"},{"key":"C","text":"功利主义价值观"},{"key":"D","text":"自由主义价值观"}],"answer":"A","keys":["A"],"explanation":"宪法第 24 条第 2 款明确：\"国家倡导社会主义核心价值观……\"。灵魂引领：社会主义核心价值观是精神文明建设的核心。B 项错误，个人主义是宪法第 24 条第 2 款明确反对的腐朽思想，不是国家倡导的价值观；C 项错误，功利主义不属于社会主义核心价值观；D项错误，自由主义思想属于国家反对的腐朽思想范畴。","type":"单选题"},{"number":44,"stem":"根据《中华人民共和国宪法》的规定，人民主原则中\"直接参与\"的实现形式是()。","options":[{"key":"A","text":"通过选举人大代表行使国家权力"},{"key":"B","text":"人民依照法律规定，通过各种途径和形式，管理国家事务、经济文化事业和社会事务"},{"key":"C","text":"通过人民政协进行民主监督"},{"key":"D","text":"通过新闻舆论进行监督"}],"answer":"B","keys":["B"],"explanation":"直接参与：人民依照法律规定，通过各种途径和形式，管理国家事务、经济文化事业和社会事务。 A 项错误，通过选举人大代表行使国家权力属于代议民主，不是直接参与； C项错误，通过人民政协进行民主监督是政协的重要功能，不是宪法规定的直接参与形式； D项错误，新闻舆论监督属于监督方式，不属于直接参与的实现形式。","type":"单选题"},{"number":45,"stem":"宪法规定，()并享有政治权利的，具有选举权和被选举权。","options":[{"key":"A","text":"凡是满 18周岁的中华人民共和国人民"},{"key":"B","text":"凡是满 18周岁的中华人民共和国公民"},{"key":"C","text":"16周岁以上以自己的收入为主要生活来源的中华人民共和国公民"},{"key":"D","text":"16周岁以上以自己的收入为主要生活来源的中华人民共和国人民"}],"answer":"B","keys":["B"],"explanation":"宪法第 34 条规定：中华人民共和国年满 18 周岁的公民，不分民族、种族、性别、职业、家庭出身、宗教信仰、教育程度、财产状况、居住期限，都有选举权和被选举权，但是依照法律被剥夺政治权利的人除外。","type":"单选题"},{"number":46,"stem":"根据我国宪法关于公民基本权利的规定，下列说法正确的是()。","options":[{"key":"A","text":"我国公民在年老、疾病或者丧失劳动能力时有获得物质帮助的权利"},{"key":"B","text":"国家和社会保障军人的生活"},{"key":"C","text":"我国公民有信仰宗教与公开传教的自由"},{"key":"D","text":"我国公民有任意休息的权利"}],"answer":"A","keys":["A"],"explanation":"国家和社会保障\"残废\"军人的生活；公民有宗教信仰自由，没有\"公开传教\"自由；\"公民有任意休息的权利\"错误，劳动者有休息的权利。","type":"单选题"},{"number":47,"stem":"我国宪法规定，除因国家安全或者追查刑事犯罪的需要，由()依照法律规定的程序对通信进行检查外，任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密。","options":[{"key":"A","text":"人民法院"},{"key":"B","text":"人民政府"},{"key":"C","text":"检察机关"},{"key":"D","text":"监察机关"}],"answer":"C","keys":["C"],"explanation":"除因国家安全或者追查刑事犯罪的需要，由公安机关或者检察机关依照法律规定的程序对通信进行检查外，任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密。","type":"单选题"},{"number":48,"stem":"景区不符合本法规定的开放条件而接待旅游者的，根据《旅游法》的规定，以下说法正确的是()。","options":[{"key":"A","text":"由旅游行政管理部门责令停业整顿直至符合开放条件"},{"key":"B","text":"罚款 2 万元以上 20万元以下"},{"key":"C","text":"情节严重的，两年内不再接受其开放申请"},{"key":"D","text":"对直接负责的主管人员，处 2000元以上 2 万元以下罚款"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 105条景区不符合本法规定的开放条件而接旅游者的，由景区主管部门责令停业整顿直至符合开放条件，并处 2 万元以上 20万元以下罚款。","type":"单选题"},{"number":49,"stem":"根据《旅游法》的规定，因未达到约定人数不能出团的，组团社经征得旅游者书面同意，可以委托其他旅行社履行合同。组团社、旅游者、受委托的旅行社之间存在()关系。","options":[{"key":"A","text":"受委托的旅行社对旅游者承担责任，组团社对受委托的旅行社承担责任"},{"key":"B","text":"组团社、受委托的旅行社对旅游者均承担责任"},{"key":"C","text":"组团社对旅游者承担责任，受委托的旅行社对组团社承担责任"},{"key":"D","text":"旅游者对受委托的旅行社承担责任，组团社对旅游者承担责任"}],"answer":"C","keys":["C"],"explanation":"《旅游法》第 63条第 2 款规定：\"因未达到约定人数不能出团的，组团社经征得旅游者书面同意，可以委托其他旅行社履行合同。组团社对旅游者承担责任，受委托的旅行社对组团社承担责任。\" 因此，正确选项是 C，该规定确立了\"责任分层\"机制。组团社作为合同主体，始终对旅游者负责；受委托的旅行社(地接社或接替社)仅对组团社负责，形成\"对外一对内\"双层责任结构。","type":"单选题"},{"number":50,"stem":"根据《民法典》的规定，以下关于合同转让和转移的说法正确的是()。","options":[{"key":"A","text":"合同的转让是合同内容的变更，合同的主体并不发生变化"},{"key":"B","text":"债务人将合同的义务全部或者部分转移给第三人的，应当通知债权人"},{"key":"C","text":"当事人一方经对方同意，可以将自己在合同中的权利和义务一并移转给第三人"},{"key":"D","text":"法人合并的，其权利和义务由原法人享有和承担"}],"answer":"C","keys":["C"],"explanation":"《民法典》规定，合同的转让是合同主体的变更；《民法典》第 551条规定，债务人将债务的全部或者部分转移给第三人的，应当经债权人同意；《民法典》第 555条规定，当事人一方经对方同意，可以将自己在合同中的权利和义务一并转让给第三人；《民法典》第 67条规定，法人合并的，其权利和义务由合并后的法人享有和承担。","type":"单选题"},{"number":51,"stem":"根据《民法典》的规定，处理民事纠纷，应当依照法律；法律没有规定的，可以()。","options":[{"key":"A","text":"适用习惯，但是不得违背公序良俗"},{"key":"B","text":"适用社会公德，但不得损害社会公共利益"},{"key":"C","text":"适用地方政策"},{"key":"D","text":"适用行业管理"}],"answer":"A","keys":["A"],"explanation":"《民法典》第 10条规定：\"处理民事纠纷，应当依照法律；法律没有规定的，可以适用习惯，但是不得违背公序良俗。\"因此，A项正确。","type":"单选题"},{"number":52,"stem":"根据《民法典》的规定，民法调整的是平等主体之间的()。","options":[{"key":"A","text":"人身关系"},{"key":"B","text":"财产关系"},{"key":"C","text":"人身关系和财产关系"},{"key":"D","text":"人身关系或财产关系"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 2 条规定：\"民法调整平等主体的自然人、法人和非法人组织之间的人身关系和财产关系。\"因此， C项正确。","type":"单选题"},{"number":53,"stem":"依据《民法典》，限制民事行为能力人实施民事法律行为由其法定代理人代理或者经其法定代理人同意、追认。但是，可以独立实施纯获利益的民事法律行为或者与其智力、()相适应的民事法律行为。","options":[{"key":"A","text":"精神健康状况"},{"key":"B","text":"身体健康状况"},{"key":"C","text":"身体和精神健康状况"},{"key":"D","text":"身体或者精神健康状况"}],"answer":"A","keys":["A"],"explanation":"《民法典》第 22条规定：\"可以独立实施纯获利益的民事法律行为或者与其智力、精神健康状况相适应的民事法律行为。\"因此，A 项正确。","type":"单选题"},{"number":54,"stem":"根据《民法典》的规定，当事人就有关合同的内容对质量要求不明确的，如果不能达成补充协议，则首先按照()履行。","options":[{"key":"A","text":"行业标准"},{"key":"B","text":"交易习惯"},{"key":"C","text":"强制性国家标准"},{"key":"D","text":"推荐性国家标准"}],"answer":"B","keys":["B"],"explanation":"解决约定不明的顺序是：1 协议补充→2合同条款或交易习惯→3 第 511 条法定标准。故\"交易习惯\"是第二步，优先于第 511条的\"强制性国家标准\"。《民法典》第 510条规定：\"不能达成补充协议的，按照合同相关条款或者交易习惯确定。\"第 511 条是在\"依据前条规定仍不能确定\"时的进一步规则，B 项正确。","type":"单选题"},{"number":55,"stem":"根据《民法典》相关规定，以下关于用人责任的说法中正确的是()。","options":[{"key":"A","text":"劳务派遣期间，被派遣的工作人员因执行工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵权责任"},{"key":"B","text":"用人单位的工作人员因执行工作任务造成他人损害的，由工作人员承担侵权责任"},{"key":"C","text":"个人之间形成劳务关系，提供劳务一方因劳务造成他人损害的，由提供劳务一方承担侵权责任"},{"key":"D","text":"提供劳务一方因劳务受到损害的，由接受劳务的一方承担赔偿责任"}],"answer":"A","keys":["A"],"explanation":"《民法典》第 1191条第 1 款规定：\"用人单位的工作人员因执行工作任务造成他人损害的，由用人单位承担侵权责任。\"第 2 款规定：\"劳务派遣期间，被派遣的工作人员因执行工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵权责任；劳务派遣单位有过错的，承担相应的责任。\"A项正确。B项错误：责任主体错误。工作人员执行任务时的侵权行为，由用人单位承担替代责任。C 项错误：根据《民法典》第 1192条第 1款，个人劳务中，提供劳务一方因劳务造成他人损害的，由接受劳务一方承担侵权责任。D项错误：根据《民法典》第 1192条第 1 款，提供劳务一方因劳务受到损害的，根据双方过错承担相应责任，非接受方\"承担赔偿责任\"。","type":"单选题"},{"number":56,"stem":"根据《民法典》的规定，无民事行为能力人造成他人损害，监护人将监护职责委托给他人的，()。","options":[{"key":"A","text":"受托人应当承担侵权责任"},{"key":"B","text":"监护人有过错的，承担相应的责任"},{"key":"C","text":"监护人应当承担侵权责任；受托人有过错的，承担相应的责任"},{"key":"D","text":"受托人应当承担侵权责任；监护人有过错的，承担相应的责任"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 1189条规定：\"无民事行为能力人、限制民事行为能力人造成他人损害，监护人将监护职责委托给他人的，监护人应当承担侵权责任；受托人有过错的，承担相应的责任。\"监护责任不因委托而免除。C 项正确：监护人承担主要责任，受托人仅在有过错时承担相应责任。","type":"单选题"},{"number":57,"stem":"根据《旅游法》的规定，在旅游者自行安排活动期间，旅行社未尽到安全提示、救助义务的，应当对旅游者的人身损害、财产损失承担()。","options":[{"key":"A","text":"连带责任"},{"key":"B","text":"补充责任"},{"key":"C","text":"过错责任"},{"key":"D","text":"相应责任"}],"answer":"D","keys":["D"],"explanation":"《旅游法》第 70条规定，在旅游者自行安排活动期间，旅行社未尽到安全提示、救助义务的，应当对旅游者的人身损害、财产损失承担相应责任。","type":"单选题"},{"number":58,"stem":"某旅行社组织、接待旅游者，未经同意安排另行费旅游项目的，旅游者有在旅游行程结束后()内，要求旅行社退还另行付费项目的费用。","options":[{"key":"A","text":"30日"},{"key":"B","text":"60日"},{"key":"C","text":"30个工作日"},{"key":"D","text":"60个工作日"}],"answer":"A","keys":["A"],"explanation":"《中华人民共和国旅游法》第 35条规定，旅行社不得以不合理的低价组织旅游活动，诱骗旅游者，并通过安排购物或者另行付费旅游项目获取回扣等不正当利益。旅行社组织、接待旅游者，不得指定具体购物场所，不得安排另行付费旅游项目。但是，经双方协商一致或者旅游者要求，且不影响其他旅游者行程安排的除外。发生违反前两款规定情形的，旅游者有在旅游行程结束后 30日内，要求旅行社为其办理退货并先行垫付退货货款，或者退还另行付费旅游项目的费用。","type":"单选题"},{"number":59,"stem":"在线旅游经营者应当保障旅游者的正当评价权，下列说法正确的是()。","options":[{"key":"A","text":"为增加社会影响，可以替代旅游者对本企业做出评价"},{"key":"B","text":"删除法律禁止传输的评价信息的，应当报有关部门备案"},{"key":"C","text":"为维护企业正面形象、可以屏蔽旅游者对其产品和服务的部分负面评价"},{"key":"D","text":"删除法规禁止发布的评价信息的，应当在后台记录和保存"}],"answer":"D","keys":["D"],"explanation":"《在线旅游经营服务管理暂行规定》第 13条，在线旅游经营者应当保障旅游者的正当评价权，不得擅自屏蔽、删除旅游者对其产品和服务的评价，不得误导、引诱、代替或者强制旅游者做出评价，对旅游者做出的评价应当保存并向社会公开。在线旅游经营者删除法律、法规禁止发布或者传输的评价信息的，应当在后台记录和保存。","type":"单选题"},{"number":60,"stem":"《文化和旅游市场信用管理规定》规定，导游、领队因被吊销导游证而被认定为严重失信主体的，旅行社有关管理人员因旅行社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起()内不得重新申请导游证或者从事旅行社业务。","options":[{"key":"A","text":"5年"},{"key":"B","text":"3年"},{"key":"C","text":"2年"},{"key":"D","text":"1年"}],"answer":"B","keys":["B"],"explanation":"导游、领队因被吊销导游证而被认定为严重失信主体的，旅行社有关管理人员因旅行社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起 3 年内不得重新申请导游证或者从事旅行社业务。第 19条规定，文化和旅游主管部门对旅游市场严重失信主体实施下列管理措施：(1)适当提高抽查比例和频次，纳入重点监管对象；(2)将失信信息提供给有关部门查询，供其在相关行政管理、公共服务、评优评先等活动中参考使用；(3)将失信信息提供给各类市场主体查询，供其在市场活动中参考使用；(4)旅行社因被吊销旅行社业务经营许可证而被认定为严重失信主体的，其主要负责人 5 年内不得担任任何旅行社的主要负责人；(5)导游、领队因被吊销导游证而被认定为严重失信主体的，旅行社有关管理人员因旅行社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起 3年内不得重新申请导游证或者从事旅行社业务；(6)旅行社因侵犯旅游者合法权益受到罚款以上行政处罚而被认定为严重失信主体的，自处罚之日起 2年内不得申请出境旅游业务；(7)法律、行政法规和党中央、国务院政策文件规定的其他管理措施。","type":"单选题"},{"number":61,"stem":"导游在带团过程中强迫旅游者进购物店购物三次，根据《旅行社服务质量赔偿标准》的规定，旅行社应当按照旅游费用总额的()向旅游者支付违约金。","options":[{"key":"A","text":"10%"},{"key":"B","text":"30%"},{"key":"C","text":"40%"},{"key":"D","text":"60%"}],"answer":"D","keys":["D"],"explanation":"《旅行社服务质量赔偿标准》第 10 条规定：\"强迫或者变相强迫旅游者购物的，每次按照旅游费用总额的 20%向旅游者支付违约金。D 项正确：强迫购物三次，每次 20%，累计60%。该规定体现对屡次强迫行为的叠加处罚。","type":"单选题"},{"number":62,"stem":"旅行社委派导游为旅游团提供服务，该导游未取得导游证。对此，由旅游主管部门依据《旅游法》，对该旅行社责令改正，没收违法所得，并处()罚款。","options":[{"key":"A","text":"1000元以上 1万元以下"},{"key":"B","text":"2000元以上 2万元以下"},{"key":"C","text":"5000元以上 5万元以下"},{"key":"D","text":"2万元以上 20万元以下"}],"answer":"C","keys":["C"],"explanation":"《旅游法》第 96条规定：\"旅行社违反本法规定，有下列行为之一的，由旅游主管部门责令改正，没收违法所得，并处 5000元以上 5万元以下罚款；情节严重的，责令停业整顿或者吊销旅行社业务经营许可证；对直接负责的主管人员和其他直接责任人员，处 2000元以上 2万元以下罚款：(1)未按照规定为出境或者入境团队旅游安排领队或者导游全程陪同的；(2)安排未取得导游证的人员提供导游或者领队服务的；(3)未向临时聘用的导游支付导游服务费用的；(4)要求导游垫付或者向导游收取费用的。C 项正确：法律明确规定罚款幅度为 5000元以上 5 万元以下。","type":"单选题"},{"number":63,"stem":"《旅游法》规定，导游、领队违反本法规定，()的，由旅游主管部门责令改正，没收违法所得，处 1000元以上 1 万元以下罚款，予以公告。","options":[{"key":"A","text":"向旅游者兜售物品"},{"key":"B","text":"未取得导游证而从事导游活动"},{"key":"C","text":"向旅游者索取小费"},{"key":"D","text":"私自承揽业务"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 102条规定，导游、领队违反本法规定，未取得导游证或者不具备领队条件而从事导游、领队活动，由旅游主管部门责令改正，没收违法所得，处 1000 元以上 1万元以下罚款，予以公告。","type":"单选题"},{"number":64,"stem":"导游员季某在提供旅游服务的过程中，多次暗示游客付小费给自己，根据《旅游法》的规定，以下表述正确的是()。","options":[{"key":"A","text":"由旅游主管部门没收违法所得"},{"key":"B","text":"处 1000 元以上 3 万元以下罚款"},{"key":"C","text":"情节严重的，并暂扣导游证"},{"key":"D","text":"情节严重的，吊销导游证并予以公告"}],"answer":"C","keys":["C"],"explanation":"《旅游法》第 102条，向旅游者索取小费的，由旅游主管部门责令退还，处 1000 元以上 1 万元以下罚款；情节严重的，并暂扣或者吊销导游证。","type":"单选题"},{"number":65,"stem":"根据《导游管理办法》的规定，所在地旅游主管部门应当自旅行社或者旅游行业组织核实导游证变更信息之日起()内予以审核确认。","options":[{"key":"A","text":"3个工作日"},{"key":"B","text":"3日"},{"key":"C","text":"5个工作日"},{"key":"D","text":"5日"}],"answer":"C","keys":["C"],"explanation":"《导游管理办法》第 15 条规定，旅行社或者旅游行业组织应当自收到申请之日起 3个工作日内对信息变更情况进行核实。所在地旅游主管部门应当自旅行社或者旅游行业组织核实信息之日起 5 个工作日内予以审核确认。该时限保障了信息变更的行政效率。","type":"单选题"},{"number":66,"stem":"根据《导游管理办法》的规定，申请人以欺骗、贿赂等不正当取得导游证的，导游证应予()。","options":[{"key":"A","text":"暂扣"},{"key":"B","text":"撤销"},{"key":"C","text":"注销"},{"key":"D","text":"吊销"}],"answer":"B","keys":["B"],"explanation":"《导游管理办法》第 16 条规定，有下列情形之一的，所在地旅游主管部门应当撤销导游证：1 对不具备申请资格或者不符合法定条件的申请人核发导游证的；2申请人以欺骗、贿赂等不正当手段取得导游证的；3 依法可以撤销导游证的其他情形。因此，B项\"撤销\"是唯一正确答案。","type":"单选题"},{"number":67,"stem":"根据《导游人员管理条例》，下列不属于参加导游人员资格考试应具备条件的是()。","options":[{"key":"A","text":"中华人民共和国公民且身体健康"},{"key":"B","text":"具有高中、中专或者以上学历"},{"key":"C","text":"具有完全民事行为能力"},{"key":"D","text":"具有导游职业需要的基本知识和语言表达能力"}],"answer":"C","keys":["C"],"explanation":"本题考查导游资格考试的报考条件，注意\"不属于\"的反向提问。《导游人员管理条例》第 3 条规定，国家实行全国统一的导游人员资格考试制度，参加导游人员资格考试的条件如下：(1)中华人民共和国公民；(2)具有高级中学、中等专业学校或者以上学历；(3)身体健康；(4)具有适应导游需要的基本知识和语言表达能力。C 项\"具有完全民事行为能力\"虽为常理，但法律未将其列为报考条件，故为正确答案。错误原因：将\"执业行为能力\"与\"考试资格\"混淆。考试阶段不强制要求完全民事行为能力，但申领导游证时需具备。","type":"单选题"},{"number":68,"stem":"依据《治安管理处罚法》的规定，在航空器上使用可能影响导航系统正常功能的器具、工具，不听劝阻的，处()。","options":[{"key":"A","text":"警告或者 500元以下罚款"},{"key":"B","text":"5日以下拘留或者 1000元以下罚款"},{"key":"C","text":"5日以上 10 日以下拘留"},{"key":"D","text":"10日以上 15日以下拘留"}],"answer":"B","keys":["B"],"explanation":"依据第 40 条，在航空器上使用可能影响导航系统正常功能的器具、工具，不听劝阻的，处 5 日以下拘留或者 1000 元以下罚款。A 项错误：该行为没有警告或者 500元以下罚款的档次。B 项正确：符合法条关于该行为的处罚规定。C 项错误：5 日以上 10日以下拘留是损坏其他交通工具设施情节较重或者公共场所违反安全规定情节较重的档次。D 项错误：10日以上 15日以下拘留适用于盗窃、损坏航空设施或者强行进入航空器驾驶舱等更重的行为。","type":"单选题"},{"number":69,"stem":"《中华人民共和国消费者权益保护法》规定，对损害消费者合法权益的行为，通过大众媒体予以揭露、批评是消费者协会应()。","options":[{"key":"A","text":"履行的约定义务"},{"key":"B","text":"承担的社会责任"},{"key":"C","text":"具有的法定权力"},{"key":"D","text":"履行的公益性职责"}],"answer":"D","keys":["D"],"explanation":"《中华人民共和国消费者权益保护法》第 37 条规定了消费者协会履行的 8 条公益性职责。","type":"单选题"},{"number":70,"stem":"根据《旅游法》的规定，下列关于旅游者与旅游经营者发生纠纷时的解决途径中，正确的是()。","options":[{"key":"A","text":"可以与旅游投诉受理机构协商"},{"key":"B","text":"提请人民法院进行仲裁"},{"key":"C","text":"向消费者协会申请调解"},{"key":"D","text":"向旅游投诉受理机构申请复议"}],"answer":"C","keys":["C"],"explanation":"《旅游法》第 92规定，旅游者与旅游经营者发生纠纷，可以通过下列途径解决：(1)双方协商；(2)向消费者协会、旅游投诉受理机构或者有关调解组织申请调解；(3)根据与旅游经营者达成的仲裁协议提请仲裁机构仲裁；(4)向人民法院提起诉讼。","type":"单选题"},{"number":71,"stem":"根据《旅游投诉处理办法》的规定，旅游投诉处理结束后，旅游投诉处理机构应当妥善保管相关材料，保管期限不低于()。","options":[{"key":"A","text":"1年"},{"key":"B","text":"2年"},{"key":"C","text":"3年"},{"key":"D","text":"5年"}],"answer":"C","keys":["C"],"explanation":"《旅游投诉处理办法》第 8 条规定：\"旅游投诉处理结束后，旅游投诉处理机构应当妥善保管相关材料，保管期限不低于三年。\"","type":"单选题"},{"number":72,"stem":"旅行社及其从业人员发现履行辅助人提供的服务不符合法律、法规规定或者存在安全隐患的，应当 ( )。","options":[{"key":"A","text":"向有关部门投诉"},{"key":"B","text":"予以制止或者更换"},{"key":"C","text":"拒绝向其支付接待报酬"},{"key":"D","text":"报告旅游行政管理部门"}],"answer":"B","keys":["B"],"explanation":"旅行社及其从业人员发现履行辅助人提供的服务不符合法律、法规规定或者存在安全隐患的，应当予以制止或者更换。","type":"单选题"},{"number":73,"stem":"根据《旅游投诉处理办法》的规定，下列关于旅游投诉的说法确的是()。","options":[{"key":"A","text":"处理旅游者与旅游经营者之间、旅游经营者内部的争议"},{"key":"B","text":"由文化和旅游主管部门或者其所属承担旅游投诉处理职能的组织处理"},{"key":"C","text":"对发生的行政争议进行调解"},{"key":"D","text":"对旅游经营者的犯罪行为依法处理"}],"answer":"B","keys":["B"],"explanation":"《旅游投诉处理办法》第二条本办法所称旅游投诉，是旅游者认为旅游经营者损害其合法权益，请求文化和旅游主管部门或者其所属承担旅游投诉处理职能的组织(以下称\"旅游投诉处理机构\")，对双方发生的旅游纠纷进行处理的行为。A 项错误：旅游投诉仅处理旅游者与旅游经营者之间的旅游纠纷，不处理旅游经营者内部争议。B 项正确：旅游投诉由文化和旅游主管部门或者其所属承担旅游投诉处理职能的组织(旅游投诉处理机构处理。C 项错误：旅游投诉处理的是旅游者和旅游经营者之间的旅游民事纠纷，不是行政争议。D 项错误：犯罪行为不属于旅游投诉受理范围，应当移送司法机关处理。","type":"单选题"},{"number":74,"stem":"以下属于社会安全事件的应急处置措施的是()。","options":[{"key":"A","text":"限制有关公共场所内的活动"},{"key":"B","text":"迅速控制危险源，标明危险区域"},{"key":"C","text":"立即抢修被损坏的交通等公共设施"},{"key":"D","text":"采取防止发生次生、衍生事件的必要措施"}],"answer":"A","keys":["A"],"explanation":"其余三项属于自然灾害、事故灾难或者公共卫生事件的应急处置措施。","type":"单选题"},{"number":75,"stem":"《旅游安全管理办法》规定，()应当承担旅游安全的主体责任。","options":[{"key":"A","text":"县级以上人民政府"},{"key":"B","text":"所在地旅游行政管理部门"},{"key":"C","text":"旅游经营者"},{"key":"D","text":"县级以上人民政府有关部门"}],"answer":"C","keys":["C"],"explanation":"《旅游安全管理办法》第 4 条规定，旅游经营者应当承担旅游安全的主体责任。","type":"单选题"},{"number":76,"stem":"根据《旅行社责任保险管理办法》的规定，旅行社责任保险的保险责任，应包括旅行社组织旅游活动中依法对受旅行社委派并为旅游者提供服务的导游或者领队人员的()承担的赔偿责任。","options":[{"key":"A","text":"人身伤亡和财产损失"},{"key":"B","text":"人身伤亡或财产损失"},{"key":"C","text":"财产损失"},{"key":"D","text":"人身伤亡"}],"answer":"D","keys":["D"],"explanation":"《旅行社责任保险管理办法》第 4 条规定，保险责任包括对导游或领队人员的\"人身伤亡\"承担的赔偿责任，不包括财产损失。因此，正确选项是 D。仅保障人身安全，体现对从业人员的基本保护。","type":"单选题"},{"number":77,"stem":"根据《中华人民共和国民用航空法》的规定，关于旅客人身伤亡的赔偿责任，下列说法正确的是()。","options":[{"key":"A","text":"承运人对超过赔偿责任限额的损害承担全部责任"},{"key":"B","text":"赔偿责任限额按照造成损害的事故发生时我国参加的相关国际民用航空公约确定"},{"key":"C","text":"赔偿责任限额由承运人和旅客协商确定"},{"key":"D","text":"承运人对全部损失都必须承担赔偿责任"}],"answer":"B","keys":["B"],"explanation":"《中华人民共和国民用航空法》第 134条：对于依据本法第一百二十八条规定所产生的赔偿责任，按照造成损害的事故发生时我国参加的相关国际民用航空公约规定的赔偿责任限额确定。对于超过前款规定的赔偿责任限额的损害，承运人证明有下列情形之一的，不承担赔偿责任：(一)损失不是由于承运人或者其受雇人、代理人的过错造成；(二)损失完全是由第三人的过错造成。A 项错误，对于超过赔偿责任限额的损害，承运人满足法定举证条件即可免责，不需要一律承担全部责任。B项正确，针对第 128条旅客人身伤亡的赔偿责任限额，依照事故发生时我国参加的相关国际民用航空公约确定。C项错误，赔偿责任限额是法定标准，不能由承运人和旅客协商确定。D 项错误，存在法定免责情形，承运人并非对所有损失都必须承担赔偿责任。","type":"单选题"},{"number":78,"stem":"根据《出境入境管理法》的规定，冒用他人出境入境证件出境入境的，处 1000 元以上()以下罚款。","options":[{"key":"A","text":"2000元"},{"key":"B","text":"3000元"},{"key":"C","text":"5000元"},{"key":"D","text":"1万元"}],"answer":"C","keys":["C"],"explanation":"《出境入境管理法》第 71条规定，有下列行为之一的，处 1000 元以上 5000 元以下罚款；情节严重的，处 5 日以上 10日以下拘留，可以并处 2000元以上 1 万元以下罚款：(1)持用伪造、变造、骗取的出境入境证件出境入境；(2)冒用他人出境入境证件出境入境；(3)逃避出境入境边防检查；(4)以其他方式非法出境入境。","type":"单选题"},{"number":79,"stem":"根据《风景名胜区条例》的规定，申请设立省级风景名胜区，提出申请的主体是()。","options":[{"key":"A","text":"省级人民政府"},{"key":"B","text":"省林草主管部门"},{"key":"C","text":"县级人民政府"},{"key":"D","text":"风景名胜区管理机构"}],"answer":"C","keys":["C"],"explanation":"《风景名胜区条例》第十条：设立省级风景名胜区，由县级人民政府提出申请，省、自治区、直辖市人民政府林业草原主管部门会同其他有关部门组织论证，提出审查意见，报省、自治区、直辖市人民政府批准公布。 A 项错误，省级人民政府负责批准公布省级风景名胜区，不是申请主体，依据条例第十条。 B 项错误，省林草主管部门负责会同有关部门组织论证、提出审查意见，不提出设立申请，依据条例第十条。 C 项正确，符合条例第十条\"设立省级风景名胜区，由县级人民政府提出申请\"的规定。 D 项错误，在申请设立风景名胜区阶段，风景名胜区管理机构尚未设立，不可能作为申请主体。","type":"单选题"},{"number":80,"stem":"在()期间，博物馆应当开放。","options":[{"key":"A","text":"国家法定节假日"},{"key":"B","text":"学校寒暑假"},{"key":"C","text":"休息日"},{"key":"D","text":"国家法定节假日和学校寒暑假"}],"answer":"D","keys":["D"],"explanation":"《博物馆条例》第 29条规定，博物馆应当向公众公告具体开放时间。在国家法定节假日和学校寒暑假期间，博物馆应当开放。","type":"单选题"},{"number":81,"stem":"中国特色社会主义事业的战略布局是()。","options":[{"key":"A","text":"\"五位一体\""},{"key":"B","text":"\"两个结合\""},{"key":"C","text":"\"四个全面\""},{"key":"D","text":"\"十个明确\""}],"answer":"C","keys":["C"],"explanation":"答案选 C。中国特色社会主义事业总体布局是\"五位一体\"，战略布局是\"四个全面\"。","type":"单选题"},{"number":82,"stem":"一个国家、一个民族发展中更基本、更深沉、更持久的力量是()。","options":[{"key":"A","text":"文化自信"},{"key":"B","text":"理论自信"},{"key":"C","text":"制度自信"},{"key":"D","text":"道路自信"}],"answer":"A","keys":["A"],"explanation":"答案选 A。文化自信是一个国家、一个民族发展中更基本、更深沉、更持久的力量。","type":"单选题"},{"number":83,"stem":"《中华人民共和国文物保护法》规定，()文物中的孤品和易损品，禁止出境展览。","options":[{"key":"A","text":"一级"},{"key":"B","text":"二级"},{"key":"C","text":"三级"},{"key":"D","text":"珍贵"}],"answer":"A","keys":["A"],"explanation":"《文物保护法》第 62 条，一级文物中的孤品和易损品，禁止出境展览。","type":"单选题"},{"number":84,"stem":"依据习近平外交思想，习近平外交思想的核心理念是()。","options":[{"key":"A","text":"构建人类命运共同体"},{"key":"B","text":"共建\"一带一路\""},{"key":"C","text":"和平共处五项原则"},{"key":"D","text":"推动全球治理体系变革"}],"answer":"A","keys":["A"],"explanation":"文档原文：构建人类命运共同体是习近平外交思想的核心理念，以建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界为努力目标。A 项正确，构建人类命运共同体是习近平外交思想的核心理念，故 A 正确。B 项错误，共建\"一带一路\"是外交思想\"十个坚持\"中\"坚持共商共建共享为原则\"推动的内容，不是核心理念，故 B 错误。C 项错误，和平共处五项原则是我国对外关系的重要原则，但不是习近平外交思想的核心理念，故 C 错误。D项错误，推动全球治理体系变革源于\"坚持公平正义为理念引领全球治理体系改革\"，不是核心理念，故 D错误。","type":"单选题"},{"number":85,"stem":"根据《港区国安法》第 25条的规定，组织、领导恐怖活动组织的，即属犯罪，处无期徒刑或者()年以上有期徒刑，并处没收财产。","options":[{"key":"A","text":"10"},{"key":"B","text":"15"},{"key":"C","text":"20"},{"key":"D","text":"25"}],"answer":"A","keys":["A"],"explanation":"《港区国安法》第 25 条规定，组织、领导恐怖活动组织的，即属犯罪，处无期徒刑或者 10 年以上有期徒刑，并处没收财产。","type":"单选题"},{"number":86,"stem":"教育行政部门应当以()为重点，将英雄烈士事迹和精神纳入国民教育内容。","options":[{"key":"A","text":"中学生"},{"key":"B","text":"青少年学生"},{"key":"C","text":"国家机关工作人员"},{"key":"D","text":"基层群众组织"}],"answer":"B","keys":["B"],"explanation":"《英烈法》第 17条规定，教育行政部门应当以青少年学生为重点，将英雄烈士事迹和精神的宣传教育纳入国民教育体系。","type":"单选题"},{"number":87,"stem":"我国第一家经营国际旅游业务的全国性旅行社是()。","options":[{"key":"A","text":"华侨服务社"},{"key":"B","text":"中国国际旅行社"},{"key":"C","text":"中国旅行社"},{"key":"D","text":"中国青年国际旅行社"}],"answer":"B","keys":["B"],"explanation":"中国国际旅行社国务院直属外事接待单位，暂代政府管理旅游业之职，成为我国第一家经营国际旅游业务的全国性旅行社。","type":"单选题"},{"number":88,"stem":"()年，《导游人员等级考核评定管理办法(试行)》将导游向分成初级、中级、高级、特级四个级别。","options":[{"key":"A","text":"1994年"},{"key":"B","text":"2001年"},{"key":"C","text":"2005年"},{"key":"D","text":"2013年"}],"answer":"C","keys":["C"],"explanation":"2005年《导游人员等级考核评定管理办法(试行)》，将导游分成初级导游、中级导游、高级导游、特级导游四个级别。","type":"单选题"},{"number":89,"stem":"()年，新版《导游等级考核管理办法》开始施行。","options":[{"key":"A","text":"2013年"},{"key":"B","text":"2021年"},{"key":"C","text":"2024年"},{"key":"D","text":"2025年"}],"answer":"D","keys":["D"],"explanation":"2025年 3月 1日：新版《导游等级考核管理办法》开始施行。","type":"单选题"},{"number":90,"stem":"在导游服务中居于核心和灵魂内容的是()。","options":[{"key":"A","text":"讲解服务"},{"key":"B","text":"旅行生活服务"},{"key":"C","text":"向导服务"},{"key":"D","text":"增值服务"}],"answer":"A","keys":["A"],"explanation":"导游服务的灵魂、核心内容是讲解服务。","type":"单选题"},{"number":91,"stem":"下列情形中可以颁发导游证的是()。","options":[{"key":"A","text":"无民事行为能力或限制民事行为能力"},{"key":"B","text":"患有传染性疾病的"},{"key":"C","text":"过失犯罪"},{"key":"D","text":"被吊销导游证之日起未逾被 3 年的"}],"answer":"C","keys":["C"],"explanation":"有以下情形之一的，不得颁发导游证：1 无民事行为能力或限制民事行为能力的；2患有传染性疾病的；3受过刑事处罚的(过失犯罪除外)；4 被吊销导游证之日起未逾 3 年的。","type":"单选题"},{"number":92,"stem":"着装的 TPO 原则中，P代表了()。","options":[{"key":"A","text":"时间"},{"key":"B","text":"地点"},{"key":"C","text":"场合"},{"key":"D","text":"素质"}],"answer":"B","keys":["B"],"explanation":"遵循 TPO原则：Time(时间)、Place(地点)、Occasion(场合)，导游在着装时，要注意时间、地点、场合并与之相适应。","type":"单选题"},{"number":93,"stem":"下列对地陪的主要职责描述错误的是()。","options":[{"key":"A","text":"安排旅游活动"},{"key":"B","text":"进行导游讲解"},{"key":"C","text":"维护旅游者安全"},{"key":"D","text":"做好联络工作"}],"answer":"D","keys":["D"],"explanation":"地陪的主要职责：安排旅游活动；做好接待工作；进行导游讲解；维护旅游者安全；处理相关问题。","type":"单选题"},{"number":94,"stem":"旅游行业的核心价值观是()。","options":[{"key":"A","text":"爱岗敬业，自尊自强"},{"key":"B","text":"游客为本，服务至诚"},{"key":"C","text":"团结服从，勤研善思"},{"key":"D","text":"耐心细致，宾客至上"}],"answer":"B","keys":["B"],"explanation":"\"游客为本，服务至诚\"作为旅游行业的服务理念，是社会主义核心价值观在旅游行业的延伸和具体化。","type":"单选题"},{"number":95,"stem":"机场通知航班延迟一个小时抵达，你作为导游应该()。","options":[{"key":"A","text":"迅速调整旅游接待计划"},{"key":"B","text":"在机场继续等候旅游团"},{"key":"C","text":"自行打车返回家中"},{"key":"D","text":"告知全陪抵达后通知自己"}],"answer":"B","keys":["B"],"explanation":"若所接航班(车次、船次)晚点且推迟时间不长，地陪可留在接站地点继续等旅游团；若推迟时间较长，应立即向地接社有关部门报告，听从安排。","type":"单选题"},{"number":96,"stem":"当入境旅游者提出关于行程小的修改意见或者增加游览项目时，导游应该向()反映。","options":[{"key":"A","text":"领队"},{"key":"B","text":"组团社"},{"key":"C","text":"地接社"},{"key":"D","text":"景区"}],"answer":"C","keys":["C"],"explanation":"及时反映：地陪应及时向旅行社反映。","type":"单选题"},{"number":97,"stem":"离团前一天，地陪需要将核对无误的交通票据移交给()。","options":[{"key":"A","text":"全陪"},{"key":"B","text":"领队"},{"key":"C","text":"团长"},{"key":"D","text":"游客本人"}],"answer":"A","keys":["A"],"explanation":"旅游团离开的前一天，地陪应认真核实旅游团离开的机(车、船)票相关信息，包括团名、代号、人数、全陪姓名、去向、航班(车次、船次)、起飞(开车、起航)时间(需对计划时间、时刻表时间、票面时间、问询时间进行四核实)、离开的机场(车站、码头)等，并将核实无误的票据移交给全陪。","type":"单选题"},{"number":98,"stem":"通常情况下，处理飞机延误、火车晚点、晕机(车、船)、途中饮食不适等问题的是()。","options":[{"key":"A","text":"地陪"},{"key":"B","text":"全陪"},{"key":"C","text":"领队"},{"key":"D","text":"团长"}],"answer":"B","keys":["B"],"explanation":"全陪常见问题应对：处理飞机延误、火车晚点、晕机(车、船)、途中饮食不适等问题。例如飞机延误时，应及时与航空公司进行沟通，安排旅游者休息。","type":"单选题"},{"number":99,"stem":"领队带领游客旅行过程中，对另行付费旅游项目处理得当的是()。","options":[{"key":"A","text":"在游览过程中，领队可以自己安排另行付费旅游项目"},{"key":"B","text":"如旅游者要求安排另行付费旅游项目，领队积极配合，以游客为主"},{"key":"C","text":"在另行付费旅游项目实施前，领队与旅游者双方口头同意即可"},{"key":"D","text":"如当地导游擅自安排另行付费旅游项目，领队应及时制止"}],"answer":"D","keys":["D"],"explanation":"在游览过程中，领队不应擅自安排另行付费旅游项目；如旅游者要求安排另行付费旅游项目，领队应在行程计划中\"自由活动\"时段内组织实施且不影响其他旅游者行程安排；在另行付费旅游项目实施前，领队应要求旅游者签订旅行社规定制式的书面协议；如当地导游擅自安排另行付费旅游项目，领队应及时制止。","type":"单选题"},{"number":100,"stem":"下列选项中，导游领队带领游客进行娱乐活动时操作错误的是()。","options":[{"key":"A","text":"提示游客观赏演艺、比赛类活动时遵守秩序"},{"key":"B","text":"根据要求使用摄像摄影设备，慎用闪光灯"},{"key":"C","text":"提示游客听从工作人员指挥，注意安全，爱护环境"},{"key":"D","text":"保持购物场所秩序，不哄抢喧哗，试吃试用商品应征得同意"}],"answer":"D","keys":["D"],"explanation":"D 选项不是娱乐活动时的要求，是购物时的要求。","type":"单选题"},{"number":101,"stem":"\"乱石穿空，惊涛拍岸，卷起千堆雪\"，词中以\"雪\"比喻浪花，别开生面。这句话采用了()的修辞方法。","options":[{"key":"A","text":"明喻"},{"key":"B","text":"暗喻"},{"key":"C","text":"借喻"},{"key":"D","text":"恰喻"}],"answer":"C","keys":["C"],"explanation":"\"乱石穿空，惊涛拍岸，卷起千堆雪\"，词中以\"雪\"借喻浪花，别开生面。","type":"单选题"},{"number":102,"stem":"杭州西湖晴雨两宜，晴天来西湖，我们可以感受到\"水光激滟晴方好\"的浓艳美；而如果雨天到西湖，则可以领略到\"山色空蒙雨亦奇\"的素雅美。这段话采用了引用手法中的()。","options":[{"key":"A","text":"明引"},{"key":"B","text":"意引"},{"key":"C","text":"情引"},{"key":"D","text":"暗引"}],"answer":"D","keys":["D"],"explanation":"指把别人的话语融入自己的话语中，而不注明出处。这样既能修饰自己的语言，还能增添一定的感染力。","type":"单选题"},{"number":103,"stem":"事情发生后，导游采用\"兜圈子\"的方式对旅游者进行劝慰，这叫做劝慰技巧中的()。","options":[{"key":"A","text":"正面引导法"},{"key":"B","text":"侧面迂回法"},{"key":"C","text":"间接暗示法"},{"key":"D","text":"生理停顿法"}],"answer":"B","keys":["B"],"explanation":"侧面迂回法：事情发生后，导游不直接对旅游者进行劝慰，而是采用旁敲侧击的劝慰方法，即侧面迂回法，也称 \"兜圈子\"。这种方法可避免伤害旅游者的自尊心，给对方留足面子，同时从侧面提醒对方改正不足。","type":"单选题"},{"number":104,"stem":"导游讲话时，目光似看非看地望向全体旅游者，营造\"我心有你\"的氛围。这是导游运用了()。","options":[{"key":"A","text":"环视法"},{"key":"B","text":"虚视法"},{"key":"C","text":"俯视法"},{"key":"D","text":"点视法"}],"answer":"B","keys":["B"],"explanation":"虚视法：导游讲话时，目光似看非看地望向全体旅游者，营造\"我心有你\"的氛围。","type":"单选题"},{"number":105,"stem":"当旅游者提出需求后，导游可暂时不予正面答复，搁置一段时间，等旅游者的需求欲消退后，达到拒绝的目的。这是导游采用的()。","options":[{"key":"A","text":"拖延时间法"},{"key":"B","text":"婉转拒绝法"},{"key":"C","text":"替代方案法"},{"key":"D","text":"正面回绝法"}],"answer":"A","keys":["A"],"explanation":"当旅游者提出需求后，导游可暂时不予正面答复，搁置一段时间，等旅游者的需求欲消退后，达到拒绝的目的。 拖延法是一种消极的做法，需谨慎使用。","type":"单选题"},{"number":106,"stem":"神女峰位于巫峡的北岸，海拔为 860米，高约 6米，远看就像是一位亭亭玉立的少女，故被称为神女峰。传说巫山神女名叫瑶姬，是炎帝的女儿，可惜还未出嫁就去世。瑶姬死后，她的魂魄在早晨化身为云，在傍晚化身为雨，时常缭绕在神女峰上。战国末期，楚怀王巡游到巫山，梦见一女子，便心生爱慕，下令在巫山临江一侧修建楼阁，取名朝云，以示怀念。这件事由于被辞赋家宋玉写进了《高唐赋》，因而得以流传后世。这讲解导游采用的是()。","options":[{"key":"A","text":"分段讲解法"},{"key":"B","text":"制造悬念法"},{"key":"C","text":"虚实结合法"},{"key":"D","text":"妙用数字法"}],"answer":"C","keys":["C"],"explanation":"\"虚\"包括民间故事、神话传说等，\"实\"指景观的具体形象、真实历史等。","type":"单选题"},{"number":107,"stem":"政务团讲解的要求是()。","options":[{"key":"A","text":"\"精\"\"要\""},{"key":"B","text":"\"活\""},{"key":"C","text":"\"逗\""},{"key":"D","text":"\"趣\""}],"answer":"A","keys":["A"],"explanation":"讲解是政务接待中导游的主要任务。政务团的讲解要\"精\"\"要\"。\"精\"指内容精确，每字每句都要经得起推敲；讲法精练，避免拖泥带水或模棱两可。\"要\"就是只讲要求内的范围，内容要符合对象需要。","type":"单选题"},{"number":108,"stem":"导游在接待研学团时，做法正确的是()。","options":[{"key":"A","text":"导游要按普通旅游团的方式为学生服务"},{"key":"B","text":"讲解是导游的核心工作，因此带研学团导游要侧重在讲解"},{"key":"C","text":"导游不是正式老师，不用关注言行举止对学生产生影响"},{"key":"D","text":"在带研学团期间，导游须始终牢记\"安全第一\""}],"answer":"D","keys":["D"],"explanation":"导游不能按普通旅游团的方式操作，应将自己定位为校外实践老师，提前掌握必要的教育知识和教学方法；讲解是导游的核心工作，但开展研究性指导是研学旅游指导师应具备的技能；虽然导游在研学旅游中不是校内的正式老师，但言行举止对学生产生影响；在带研学团期间，导游须始终牢记\"安全第一\"。","type":"单选题"},{"number":109,"stem":"导游专座的位置在()。","options":[{"key":"A","text":"客运车辆前乘客门侧第一排乘客座椅靠通道侧"},{"key":"B","text":"客运车辆前司机侧第一排乘客座椅靠通道侧"},{"key":"C","text":"客运车辆前乘客门侧第一排乘客座椅靠窗户侧"},{"key":"D","text":"客运车辆前司机侧第一排乘客座椅靠窗户侧"}],"answer":"A","keys":["A"],"explanation":"\"导游专座\"应设置在旅游客运车辆前乘客门侧第一排乘客座椅靠通道侧位置。","type":"单选题"},{"number":110,"stem":"对于游客提出推迟用餐的要求，导游操作正确的是()。","options":[{"key":"A","text":"婉转拒绝"},{"key":"B","text":"若全团提出推迟但是需要产生费用时，导游告知费用客人自理"},{"key":"C","text":"若个别旅游者执意推迟用餐，导游告知其餐费不退"},{"key":"D","text":"游客至上，按照客人要求处理"}],"answer":"B","keys":["B"],"explanation":"劝说随团用餐：耐心向旅游者说明团队餐馆用餐的时间规定，劝说其随团用餐；全团同意推迟用餐的处理：若全团旅游者都同意推迟用餐，导游应联系餐厅，尽量协调推迟用餐。若推迟用餐会产生相关费用(如境外超时服务费用等)，导游应告知旅游者相应费用自理；个别旅游者执意推迟用餐的处理：若只是个别旅游者执意推迟用餐，导游应带领全团按原计划正常用餐，同时协助个别旅游者后续联系餐馆安排点餐，并告知其不随团用餐的费用自理，原餐费按照旅游合同约定处理。","type":"单选题"},{"number":111,"stem":"当游客提出更换计划内文娱活动时，导游操作正确的是()。","options":[{"key":"A","text":"坚决拒绝，表示行程不方便更改"},{"key":"B","text":"若全团提出，与接待社计调部门联系，尽可能调换"},{"key":"C","text":"若部分游客提出，则耐心劝说放弃"},{"key":"D","text":"若分路参与地点在同一线路上，只能为多数旅游者提供方便"}],"answer":"B","keys":["B"],"explanation":"全团游客提出更换时：与接待社计调部门联系，尽可能调换，但不要在未联系妥当之前许诺；如接待社无法调换，要向旅游者做好耐心解释工作，并说明票已订好，不能退换，请其谅解。部分旅游者提出更换时：处理方法同上。若决定分路参与文娱活动，两个文娱活动地点在同一线路上，应与司机商量，尽量为少数旅游者提供方便，送他们到目的地；若不同路，则应为他们安排车辆，但车费自理。","type":"单选题"},{"number":112,"stem":"旅游者被伤后，导游处理错误的是()。","options":[{"key":"A","text":"立即提醒旅游者迅速离开现场，防止再次被咬"},{"key":"B","text":"记下事发地环境及毒虫样貌"},{"key":"C","text":"被蜜蜂刺伤，先检查并拔除毒刺，用酸性水冲洗"},{"key":"D","text":"若病情加重，尽快送医或拨打急救电话，避免耽误治疗"}],"answer":"C","keys":["C"],"explanation":"被蜜蜂等刺伤，先检查并拔除毒刺，用洁净清水冲洗伤口，有条件用肥皂水冲洗，减少毒素扩散。","type":"单选题"},{"number":113,"stem":"下列选项中，()是造成误机的主观原因。","options":[{"key":"A","text":"行程安排不当"},{"key":"B","text":"途中遭遇交通事故"},{"key":"C","text":"自然灾害"},{"key":"D","text":"恶劣天气"}],"answer":"A","keys":["A"],"explanation":"主观原因：在接待过程中，导游因行程安排不当致旅游者无法按时抵达机场(车站、码头)、未认真核对票据而弄错时间或地点等由人为因素造成的事故，均属主观原因，是预防的重点。","type":"单选题"},{"number":114,"stem":"当交通事故发生以后，导游第一时间应该()。","options":[{"key":"A","text":"立即展开抢救"},{"key":"B","text":"冷静拨打 120"},{"key":"C","text":"向旅行社汇报"},{"key":"D","text":"保护现场"}],"answer":"A","keys":["A"],"explanation":"事故发生第一时间，立即展开抢救，优先救助伤员。","type":"单选题"},{"number":115,"stem":"发生食物中毒以后，导游处理不当的是()。","options":[{"key":"A","text":"立即与当地医疗机构联系救助事宜，并设法催吐"},{"key":"B","text":"对食品进行留样，取得旅游者呕吐物的样本"},{"key":"C","text":"将旅游者送至医疗急救机构或医院进行救治，来证明旅行社没有责任"},{"key":"D","text":"向旅行社及其所在地旅游主管部门、发生地旅游主管部门和疾控机构报告"}
