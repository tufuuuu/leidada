、浙江龙泉、山东淄博和河北唐山也是中国瓷器的主要产地。福建德化、浙江龙泉也是中国瓷器的主要产地。","type":"多选题"},{"number":137,"stem":"地表喀斯特景观有（）。","options":[{"key":"A","text":"峰林、峰丛"},{"key":"B","text":"石林"},{"key":"C","text":"天坑、天生桥"},{"key":"D","text":"地表钙华堆积"},{"key":"E","text":"石钟乳、石笋"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"石钟乳、石笋、石柱、石花属于地下喀斯特景观。地下喀斯特景观溶洞遍布，洞内常有地下湖或地下暗河。","type":"多选题"},{"number":138,"stem":"重阳节的习俗主要有（）。","options":[{"key":"A","text":"登高"},{"key":"B","text":"插茱萸"},{"key":"C","text":"饮菊花酒"},{"key":"D","text":"吃重阳糕"},{"key":"E","text":"赛龙舟"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"赛龙舟是端午节习俗。重阳节的习俗主要有登高、插茱萸、饮菊花酒等，应景食品是重阳糕。1989年，我国把重阳节定为老年节。","type":"多选题"},{"number":139,"stem":"全真道与正一道的区别有（）。","options":[{"key":"A","text":"全真道主张三教合一，正一道以行符篆为主要特征"},{"key":"B","text":"全真道士必须出家住宫观，正一道道士可以有家室"},{"key":"C","text":"全真道重内丹修炼，正一道以画符念咒、驱鬼降妖为特征"},{"key":"D","text":"全真道奉《道德经》《般若波罗蜜多心经》《孝经》，正一道奉《正一经》"},{"key":"E","text":"两派都没有清规戒律"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"全真道以《道德经》《般若波罗蜜多心经》《孝经》为主要经典，主张道、佛、儒三教合一，重内丹修炼，道士必须出家住宫观，不得蓄妻室；正一道集符篆派之大成，以行符篆为主要特征，奉《正一经》，道士可以有家室。全真道制定了严格的清规戒律，E 项错误。","type":"多选题"},{"number":140,"stem":"下列关于《诗经》的表述，正确的有（）。","options":[{"key":"A","text":"是我国第一部诗歌总集"},{"key":"B","text":"产生于春秋时期"},{"key":"C","text":"按音乐的特点分为风、雅、颂三部分"},{"key":"D","text":"表现手法归纳为赋、比、兴"},{"key":"E","text":"雅分为大雅、小雅、颂三部分"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"《诗经》是我国第一部诗歌总集，产生于春秋时期，按音乐的特点分为风、雅、颂三部分，表现手法归纳为赋、比、兴；其中风又称“十五国风”，雅分为大雅、小雅两部分，颂分为周颂、鲁颂、商颂三部分。E 项表述错误。","type":"多选题"},{"number":141,"stem":"下列关于三湾改编的表述，正确的有（）。","options":[{"key":"A","text":"1927年 9 月 29 日在江西永新县三湾村进行"},{"key":"B","text":"建立党的各级组织和党代表制度"},{"key":"C","text":"党的支部建在连上"},{"key":"D","text":"成立各级士兵委员会，实行民主制度"},{"key":"E","text":"事实上确立了毛泽东在党中央的领导地位"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"三湾改编建立党的各级组织和党代表制度，党的支部建在连上，班、排有小组，连以上设党代表，营、团设党委；成立各级士兵委员会，实行民主制度，在政治上官兵平等。三湾改编从组织上确立了党对军队的领导。E项是遵义会议的历史意义。三湾改编从组织上确立了党对军队的领导，是建设无产阶级领导的新型人民军队的重要开端。","type":"多选题"},{"number":142,"stem":"现存著名楼阁式塔有（）。","options":[{"key":"A","text":"西安大雁塔"},{"key":"B","text":"应县木塔"},{"key":"C","text":"泉州开元寺双塔"},{"key":"D","text":"河南嵩岳寺塔"},{"key":"E","text":"崇圣寺三塔"}],"answer":"ABC","keys":["A","B","C"],"explanation":"楼阁式塔现存著名古塔有西安大雁塔、应县木塔、泉州开元寺双塔；嵩岳寺塔、崇圣寺三塔为密檐式塔。楼阁式塔为数众多、历史最久，形式也最为壮观。西安大雁塔、应县木塔、泉州开元寺双塔均为楼阁式塔。","type":"多选题"},{"number":143,"stem":"下列词作名篇与作者的对应关系，正确的有（）。","options":[{"key":"A","text":"柳永《望海潮》"},{"key":"B","text":"苏轼《念奴娇·赤壁怀古》"},{"key":"C","text":"李清照《如梦令·昨夜雨疏风骤》"},{"key":"D","text":"辛弃疾《永遇乐·京口北固亭怀古》"},{"key":"E","text":"王安石《桂枝香·金陵怀古》"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"以上对应均正确；宋词流派有以柳永、李清照为代表的婉约派，以苏轼、辛弃疾为代表的豪放派。传说岳飞创作的《满江红》也是宋词名篇。","type":"多选题"},{"number":144,"stem":"“初唐四杰”包括（）。","options":[{"key":"A","text":"王勃"},{"key":"B","text":"杨炯"},{"key":"C","text":"陈子昂"},{"key":"D","text":"卢照邻"},{"key":"E","text":"骆宾王"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"初唐时期代表诗人有“初唐四杰”（王勃、杨炯、卢照邻、骆宾王）和陈子昂。","type":"多选题"},{"number":145,"stem":"下列被后世奉为“五经”的古代文献有（）。","options":[{"key":"A","text":"《论语》"},{"key":"B","text":"《诗》"},{"key":"C","text":"《书》"},{"key":"D","text":"《礼》"},{"key":"E","text":"《易》"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"经孔子整理的古代文献《诗》《书》《礼》《易》和他撰写的鲁国编年体史书《春秋》被后世奉为经典，称“五经”。","type":"多选题"},{"number":146,"stem":"中国风筝的“四艺”包括（）。","options":[{"key":"A","text":"扎"},{"key":"B","text":"刻"},{"key":"C","text":"糊"},{"key":"D","text":"绘"},{"key":"E","text":"放"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"中国风筝的技艺概括起来只有四个字：扎、糊、绘、放，简称“四艺”，即扎架子、糊纸面、绘花彩、放风筝。","type":"多选题"},{"number":147,"stem":"下列关于帝王祭祀时间的表述，正确的有（）。","options":[{"key":"A","text":"冬至日祭天"},{"key":"B","text":"夏至日祭地"},{"key":"C","text":"春分日祭日"},{"key":"D","text":"夏至日祭天"},{"key":"E","text":"秋分日祭月"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"祭天在南郊的天坛，时间在冬至日；祭地在北郊的地坛，时间在夏至日；祭日于东郊的日坛，时间在春分日；祭月于西郊的月坛，时间在秋分日。","type":"多选题"},{"number":148,"stem":"下列关于四川民族聚居区的说法，正确的有（）。","options":[{"key":"A","text":"四川是全国最大的彝族聚居区"},{"key":"B","text":"四川是全国第二大藏族聚居区"},{"key":"C","text":"四川是全国最大的藏族聚居区"},{"key":"D","text":"四川是全国唯一的羌族聚居区"}],"answer":"ABD","keys":["A","B","D"],"explanation":"四川是全国最大的彝族聚居区、全国第二大藏族聚居区、全国唯一的羌族聚居区。彝族是四川省人数最多的少数民族，祭司称为“毕摩”，火把节是其最盛大的节日。点评：“最大”“唯一”系列是地导常考内容。","type":"多选题"},{"number":149,"stem":"“桂林三宝”是指（）。","options":[{"key":"A","text":"三花酒"},{"key":"B","text":"桂林豆腐乳"},{"key":"C","text":"桂林米粉"},{"key":"D","text":"桂花糕"},{"key":"E","text":"桂林辣椒酱"}],"answer":"ABE","keys":["A","B","E"],"explanation":"桂林三宝是指三花酒、桂林豆腐乳、桂林辣椒酱。D 项桂花糕为干扰项。","type":"多选题"},{"number":150,"stem":"河西走廊已成为游人凭吊历史的旅游名胜，其古长城遗存包括（）等。","options":[{"key":"A","text":"“天下第一雄关”"},{"key":"B","text":"阳关"},{"key":"C","text":"玉门关"},{"key":"D","text":"“长城第一墩”"},{"key":"E","text":"镇北台"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"甘肃是我国长城文化资源大省，境内现存长城主要为战国秦、汉、明三代遗迹，三代长城的西端起点主要在甘肃境内。全省长城总长度为 3654 千米，居全国第二。在河西走廊，“天下第一雄关”嘉峪关、“长城第一墩”、阳关、玉门关、汉长城等古长城遗存，都已成为游人凭吊历史的旅游名胜。","type":"多选题"},{"number":151,"stem":"合称“盛京三陵”的陵墓有（）。","options":[{"key":"A","text":"清永陵"},{"key":"B","text":"清福陵"},{"key":"C","text":"清景陵"},{"key":"D","text":"清孝陵"},{"key":"E","text":"清昭陵"}],"answer":"ABE","keys":["A","B","E"],"explanation":"清永陵、清福陵、清昭陵合称盛京三陵。清孝陵在河北清东陵（顺治帝陵），易误选。","type":"多选题"},{"number":152,"stem":"广东戏曲中，流行最广、影响最深、观众最多的三种是（）。","options":[{"key":"A","text":"粤剧"},{"key":"B","text":"黄梅戏"},{"key":"C","text":"广东汉剧"},{"key":"D","text":"潮剧"},{"key":"E","text":"粤北采茶戏"}],"answer":"ACD","keys":["A","C","D"],"explanation":"广东戏曲以粤剧、潮剧、广东汉剧三种流行最广、影响最深、观众最多。B 项黄梅戏是安徽剧种，易误选。","type":"多选题"},{"number":153,"stem":"吉林省是著名的“东北三宝”主产区，“东北三宝”包括（）。","options":[{"key":"A","text":"人参"},{"key":"B","text":"灵芝"},{"key":"C","text":"鹿茸角"},{"key":"D","text":"狍子"},{"key":"E","text":"貂皮"}],"answer":"ACE","keys":["A","C","E"],"explanation":"吉林省是著名的“东北三宝”——人参、貂皮、鹿茸角（一说乌拉草）的主产区。","type":"多选题"},{"number":154,"stem":"下列关于《格萨尔》史诗的说法，正确的有（）。","options":[{"key":"A","text":"是世界上最长的史诗"},{"key":"B","text":"是世界上唯一一部至今还在不断创作的“活着的史诗”"},{"key":"C","text":"有六七十部、150多万行"},{"key":"D","text":"是蒙古族的英雄史诗"},{"key":"E","text":"青海果洛藏族自治州是其主要发祥地"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"《格萨尔王传》有六七十部、150 多万行，是世界上最长的史诗，也是世界上唯一一部至今还在不断创作的“活着的史诗”；青海果洛藏族自治州是其主要发祥地。D 项错误，《格萨尔》是藏族的英雄史诗。","type":"多选题"},{"number":155,"stem":"下列关于黎族的说法，正确的有（）。","options":[{"key":"A","text":"擅长制作独木器，器具原料都必须是一块整木"},{"key":"B","text":"以黎锦、黎单闻名于世"},{"key":"C","text":"男子曾有文面文身的习俗"},{"key":"D","text":"妇女曾有文面文身的习俗，称为“雕题”"},{"key":"E","text":"传统民居多为竹木结构的“船形屋”"}],"answer":"ABD","keys":["A","B","D"],"explanation":"黎族擅长制作独木器，所使用的任何器具，原料都必须是一块整木。黎族手工纺织技术历史悠久，早在唐宋时代就领先于中原，并以黎锦、黎单闻名于世。黎族妇女曾有文面文身的习俗，称为“雕题”。C 项错误，文面文身是黎族妇女曾有的习俗，并非男子。黎族传统民居多为竹木结构的楼房或草房。有的住宅为“船形屋”，用竹木扎构成轮廓，状如船篷，盖以茅草，呈半圆筒形。E 项错误，教材表述为“有的住宅”为“船形屋”，并非传统民居“多为”船形屋。","type":"多选题"},{"number":156,"stem":"下列关于新疆的说法，正确的有（）。","options":[{"key":"A","text":"陆地面积最大"},{"key":"B","text":"海岸线最长"},{"key":"C","text":"毗邻国家最多"},{"key":"D","text":"人口最多"},{"key":"E","text":"陆地边境线最长"}],"answer":"ACE","keys":["A","C","E"],"explanation":"新疆是我国陆地面积最大、陆地边境线最长、毗邻国家最多的省区。新疆陆地边境线长 5700 多千米，约占全国陆地边境线的 1/4，与蒙古、俄罗斯、哈萨克斯坦、吉尔吉斯斯坦、塔吉克斯坦、阿富汗、巴基斯坦、印度 8个国家接壤。","type":"多选题"},{"number":157,"stem":"西藏的特产有（）等。","options":[{"key":"A","text":"昆仑玉"},{"key":"B","text":"藏茶、西藏木碗"},{"key":"C","text":"麝香、藏香、唐卡"},{"key":"D","text":"藏刀、手工地毯"},{"key":"E","text":"冬虫夏草、藏红花"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"西藏的特产有冬虫夏草、藏红花、藏茶、西藏木碗、麝香、藏香、藏饰品、唐卡、藏刀、手工地毯等。A 项昆仑玉不在西藏特产之内，故不选。","type":"多选题"},{"number":158,"stem":"台湾省的支柱产业有（）等。","options":[{"key":"A","text":"半导体行业"},{"key":"B","text":"纺织业"},{"key":"C","text":"电子制造业"},{"key":"D","text":"石化产业"},{"key":"E","text":"精密机械"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"台湾省制造业与高新技术产业发达，在半导体、IT、通信、精密电子制造等领域领先全球。台湾省目前支柱产业有半导体行业、电子制造业、精密机械、工控设备、石化产业等。B项纺织业不在支柱产业之内。","type":"多选题"},{"number":159,"stem":"下列关于山西汾酒的说法，正确的有（）。","options":[{"key":"A","text":"唐代诗人李白“牧童遥指杏花村”让其声名大噪"},{"key":"B","text":"又称“杏花村酒”"},{"key":"C","text":"是中国清香型白酒的典型代表"},{"key":"D","text":"1915年参加巴拿马万国博览会获得白酒甲等大奖"},{"key":"E","text":"产于汾阳市杏花村"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"汾酒产于汾阳市杏花村，又称“杏花村酒”，是中国清香型白酒的典型代表，有着4000多年的历史；1915年参加巴拿马万国博览会，曾获得白酒甲等大奖。A 项错误，“借问酒家何处有，牧童遥指杏花村”是唐代诗人杜牧的诗句。","type":"多选题"},{"number":160,"stem":"澳门的美称有（）。","options":[{"key":"A","text":"“东方之珠”"},{"key":"B","text":"“创意之都”"},{"key":"C","text":"“东方蒙特卡洛”"},{"key":"D","text":"“盛事之都”"},{"key":"E","text":"“东方夏威夷”"}],"answer":"BCD","keys":["B","C","D"],"explanation":"澳门拥有“盛事之都”“创意之都”等美称，还是世界四大赌城之一，有“东方蒙特卡洛”之称。A项“东方之珠”是香港的美誉，易误选。","type":"多选题"},{"number":161,"stem":"陕西省代表性旅游演艺剧目有（）等。","options":[{"key":"A","text":"《驼铃传奇》"},{"key":"B","text":"《延安保育院》"},{"key":"C","text":"《再回延安》《延安保卫战》"},{"key":"D","text":"《宋城千古情》"},{"key":"E","text":"《长恨歌》《西安千古情》"}],"answer":"BCE","keys":["B","C","E"],"explanation":"陕西省代表性剧目有西安市《长恨歌》《西安千古情》，延安市《延安保育院》《再回延安》《延安保卫战》等。D 项《宋城千古情》在浙江杭州，易误选。","type":"多选题"},{"number":162,"stem":"下列关于齐鲁文化的说法，正确的有（）。","options":[{"key":"A","text":"齐鲁文化是“齐文化”和“鲁文化”的合称"},{"key":"B","text":"齐文化重伦理，鲁文化尚功利"},{"key":"C","text":"鲁文化尚功利，齐文化重伦理"},{"key":"D","text":"齐文化尚功利，鲁文化重伦理"},{"key":"E","text":"齐文化讲求革新，鲁文化尊重传统"}],"answer":"ADE","keys":["A","D","E"],"explanation":"齐鲁文化是“齐文化”和“鲁文化”的合称：齐文化尚功利、讲求革新，鲁文化重伦理、尊重传统。B项把两者特点说反了，为典型干扰项。","type":"多选题"},{"number":163,"stem":"安徽入选联合国教科文组织非物质文化遗产代表作名录的项目有（）。","options":[{"key":"A","text":"徽墨制作技艺"},{"key":"B","text":"中国珠算"},{"key":"C","text":"歙砚制作技艺"},{"key":"D","text":"宣纸制作技艺"},{"key":"E","text":"徽州木结构营造技艺"}],"answer":"BDE","keys":["B","D","E"],"explanation":"安徽入选的 3 项为“宣纸制作技艺”“中国珠算”以及作为“中国传统木结构建筑营造技艺”代表之一的“徽州木结构营造技艺”。A 项徽墨制作技艺是国家级非遗，不属于这 3项，易误选。","type":"多选题"},{"number":164,"stem":"下列属于贵州世界遗产的有（）。","options":[{"key":"A","text":"三江并流"},{"key":"B","text":"左江花山岩画"},{"key":"C","text":"赤水丹霞"},{"key":"D","text":"梵净山"},{"key":"E","text":"荔波喀斯特"}],"answer":"CDE","keys":["C","D","E"],"explanation":"贵州自然遗产 3 项：中国南方喀斯特（第一期荔波喀斯特、第二期施秉白云岩）、中国丹霞（赤水丹霞）、梵净山。三江并流为云南的世界自然遗产、左江花山岩画为广西的世界遗产。","type":"多选题"},{"number":165,"stem":"粤剧被列入联合国教科文组织人类非物质文化遗产代表作名录，由（）联合申报。","options":[{"key":"A","text":"海南"},{"key":"B","text":"香港"},{"key":"C","text":"台湾"},{"key":"D","text":"广东"},{"key":"E","text":"澳门"}],"answer":"BDE","keys":["B","D","E"],"explanation":"2009 年 10 月 2 日，由广东、香港和澳门联合申报，粤剧被列为联合国教科文组织人类非物质文化遗产代表作名录。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD四/LDD押题第4卷（科目三四）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD四/LDD押题第4卷（科目三四）-试卷.pdf"}]},{"number":5,"subjects":[{"name":"科目一二","questions":[{"number":1,"stem":"根据《中华人民共和国宪法》的规定，公民合法的私有财产不受侵犯，因此一切私有财产均受宪法保护。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"公民合法的私有财产不受侵犯，受宪法保护的前提是财产“合法”，并非一切私有财产均受宪法保护。","type":"判断题"},{"number":2,"stem":"《旅游法》规定，县级以上人民政府应当按照国民经济和社会发展规划的要求，组织编制旅游发展规划。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 17条规定，国务院和省、自治区、直辖市人民政府以及旅游资源丰富的设区的市和县级人民政府，应当按照国民经济和社会发展规划的要求，组织编制旅游发展规划。错在“县级以上人民政府”，故本题错误。","type":"判断题"},{"number":3,"stem":"根据《民法典》的规定，采用两种以上文字的合同，各文本使用的词句不一致的，应当根据合同的相关条款、性质、目的以及诚实信用原则等予以解释。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"解析各文本使用的词句不一致的，应当根据合同的相关条款、性质、目的以及诚信原则等予以解释。","type":"判断题"},{"number":4,"stem":"《旅行社条例》规定，凡是中国内地居民持中国护照出国旅游或者持通行证赴香港、澳门和台湾旅游的，均属出境旅游。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"解析凡是中国内地居民持中国护照出国旅游或者持通行证赴香港、澳门和台湾旅游的，均属出境旅游。故本题说法正确。","type":"判断题"},{"number":5,"stem":"国家建立经营者守法、行业自律、消费者参与、政府监管和社会监督相结合的消费者权益保护共同治理体系。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"条例原文表述为“建立和完善经营者守法、行业自律、消费者参与、政府监管和社会监督相结合的消费者权益保护共同治理体系”，题干与法条一致，说法正确。","type":"判断题"},{"number":6,"stem":"旅游突发事件仅指突然发生、造成或者可能造成旅游者人身伤亡，需要采取应急处置措施予以应对的自然灾害、事故灾难、公共卫生事件和社会安全事件。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"旅游突发事件是指突然发生、造成或者可能造成旅游者人身伤亡、财产损失。此处既有“人身伤亡”也包括“财产损失”。","type":"判断题"},{"number":7,"stem":"国务院旅游主管部门建立旅游目的地安全风险提示制度。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题表述错误。《旅游法》第 77条规定，国家建立旅游目的地安全风险提示制度。","type":"判断题"},{"number":8,"stem":"根据《中华人民共和国民用航空法》的规定，航空货运单是航空货物运输合同订立和运输条件以及承运人接受货物的初步证据。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"第 122条，航空货运单是航空货物运输合同订立和运输条件以及承运人接受货物的初步证据。","type":"判断题"},{"number":9,"stem":"根据《出入境管理法》的规定，外国人以及交通运输工具应当从对外开放的口岸入境出境，特殊情况下，可以从外事部门批准的地点出境入境。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，错在“外事部门”。《出境入境管理法》第 6 条规定：“中国公民、外国人以及交通运输工具应当从对外开放的口岸出境入境，特殊情况下，可以从国务院或者国务院授权的部门批准的地点出境入境。”","type":"判断题"},{"number":10,"stem":"根据《风景名胜区条例》，省级风景名胜区总体规划由省级人民政府林草主管部门组织编制。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"《风景名胜区条例》第十六条：国家级风景名胜区规划由省、自治区、直辖市人民政府林业草原主管部门组织编制。省级风景名胜区规划由县级人民政府组织编制。省级风景名胜区规划的编制主体是县级人民政府，而不是省级人民政府林业草原主管部门，故判断为错。","type":"判断题"},{"number":11,"stem":"在国家法定节假日和学校寒暑假期间，博物馆应当免费开放。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"在国家法定节假日和学校寒暑假期间，博物馆应当开放。注意：不是所有的博物馆都是“免费”开放。","type":"判断题"},{"number":12,"stem":"依据习近平法治思想，坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"解析坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设。该表述与原文完全一致，故本题正确。","type":"判断题"},{"number":13,"stem":"党的二十大报告指出，中国式现代化是全体人民共同富裕的现代化。共同富裕是中国特色社会主义的本质要求，也是一个长期的历史过程。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。本题说法正确。党的二十大报告明确指出：“中国式现代化是全体人民共同富裕的现代化。”共同富裕是社会主义的本质要求，是中国式现代化的重要特征。","type":"判断题"},{"number":14,"stem":"对英雄烈士的抚恤优待要与国民经济和社会发展相适应并逐步提高。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":15,"stem":"每年 9 月 30 日为烈士纪念日，清明节当日国家在首都北京天安门广场人民英雄纪念碑前举行纪念仪式，缅怀英雄烈士。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。《英烈法》第 5 条规定，每年 9 月 30 日为烈士纪念日，国家在首都北京天安门广场人民英雄纪念碑前举行纪念仪式，缅怀英雄烈士。","type":"判断题"},{"number":16,"stem":"根据《旅游强国建设“十五五”规划》，旅游业被定位为新兴的战略性支柱产业和具有显著时代特征的民 生产业、幸福产业。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":17,"stem":"2025 年 10 月 24 日，第十四届全国人民代表大会常务委员会第十八次会议依据《中华人民共和国宪法》表决通过决定，以法律形式将 10 月 25日设立为“台湾光复纪念日”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2025年 10 月 24 日，第十四届全国人民代表大会常务委员会第十八次会议依据《中华人民共和国宪法》表决通过决定，以法律形式将 10 月 25日设立为“台湾光复纪念日”。","type":"判断题"},{"number":18,"stem":"2025年 11月，我国首艘电磁弹射航母福建舰正式入列，海军进入双航母时代。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“三航母时代”。2025年 11 月 5 日，航母 18 的福建舰在海南三亚某军港正式入列。这艘全球首艘常规动力电磁弹射型航母的服役，不仅标志着中国海军进入三航母时代，更意味着其舰载航空兵作战体系完成了从滑跃起飞到电磁弹射的代际跨越。","type":"判断题"},{"number":19,"stem":"2026年 2 月 14 日，习近平主席在致非洲联盟峰会贺电中宣布，中方将于 2026年 5月 1日起对 53个非洲建交国全面实施零关税举措，同时继续推动商签共同发展经济伙伴关系协定。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2026年 2 月 14 日，习近平主席在致非洲联盟峰会贺电中宣布，中方将于 2026 年 5 月 1 日起对 53个非洲建交国全面实施零关税举措，同时继续推动商签共同发展经济伙伴关系协定。","type":"判断题"},{"number":20,"stem":"海南自贸港全岛封关运作于 2025年 12 月 18日正式启动。海南自由贸易港全岛封关，是指将海南岛全岛建成一个海关监管特殊区域，实施以“一线”放开、“二线”管住、岛内自由”为基本特征的自由化便利化政策制度。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。海南自贸港全岛封关运作于 2025 年 12月 18日正式启动。海南自由贸易港全岛封关，是指将海南岛全岛建成一个海关监管特殊区域，实施以“一线”放开、“二线”管住、岛内自由”为基本特征的自由化便利化政策制度；是海南自由贸易港建设的标志性和基础性工程，标志着海南自由贸易港建设进入实质性阶段。","type":"判断题"},{"number":21,"stem":"导游是国家方针政策的宣传者和执行者，又是将旅游者的意见、要求传递至旅行社和旅游行政管理部门的传递者，这是导游沟通上下纽带作用的体现。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":22,"stem":"2016年 9 月，国家旅游局推行“电子导游证”，建设“全国旅游监管服务平台”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":23,"stem":"领队是指依法取得从业资格，受组团旅行社（组团社）委派，全权代表组团社带领旅游团出境旅游，监督境外地接社和导游等执行旅游计划，并为旅游者提供出入境等相关服务的工作人员。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":24,"stem":"首次沿途导游是地陪接到旅游团队后的第一次导游讲解，对于满足旅游者好奇心和求知欲、展示地陪知识技能以及树立良好第一印象具有重要作用。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":25,"stem":"旅游者提出的要求与原行程不符且涉及接待规格时，导游一般要请示旅行社，视情况而定。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。入境领队（全陪）或旅游者提出的要求与原行程不符且涉及接待规格时，导游一般要婉转拒绝。","type":"判断题"},{"number":26,"stem":"国际通用的白皮书，即“国际预防接种证书”，其核心作用在于借助卫生检疫措施来避免传染病的跨境传播。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。国际通用的黄皮书，即“国际预防接种证书”，其核心作用在于借助卫生检疫措施来避免传染病的跨境传播。","type":"判断题"},{"number":27,"stem":"在讲述一段感人的历史故事时，于情节关键处稍作停顿，让情感在静默中得以升华，这是导游运用逻辑停顿的方法进行讲解。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。导游若能以饱满感情运用感情停顿，将获得更丰富深沉的效果，营造出“此时无声胜有声”的境界。比如在讲述一段感人的历史故事时，于情节关键处稍作停顿，让情感在静默中得以升华。","type":"判断题"},{"number":28,"stem":"导游提出问题，引导旅游者积极作答，这是我向客答法的运用。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":29,"stem":"致欢送词是导游最后一次展示风采、影响旅游者看法的机会。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":30,"stem":"非居民游客携带单价超出 5000元人民币的物品，须向海关申报，并办理进境手续。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":31,"stem":"导游在接待政务团时，应能进行有针对性的讲解，适当引用相关专业术语，并保持讲解内容的准确性与权威性。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。导游在接待商务团时，应能进行有针对性的讲解，适当引用相关专业术语，并保持讲解内容的准确性与权威性。","type":"判断题"},{"number":32,"stem":"导游应发自内心地尊重残障游客，主动为残障游客在旅游期间拍照。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。发自内心的尊重是建立良好互动关系的前提，未经同意，不可随意对残障旅游者拍照。","type":"判断题"},{"number":33,"stem":"导游处理个别要求时，要维护国家尊严与自身人格尊严，对损害国家利益、民族尊严的要求断然拒绝并严正驳斥。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":34,"stem":"通常情况下，导游不陪同个别旅游者前往计划外景点。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":35,"stem":"若只是个别旅游者执意推迟用餐，导游应尽量协调推迟用餐时间。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。若只是个别旅游者执意推迟用餐，导游应带领全团按原计划正常用餐，同时协助个别旅游者后续联系餐馆安排点餐，并告知其不随团用餐的费用自理，原餐费按照旅游合同约定处理","type":"判断题"},{"number":36,"stem":"若确定气象变化或已发生的自然灾害将影响行程，在征得旅游者同意且获得旅行社认可后，导游可灵活调整行程，保障旅游者安全。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":37,"stem":"若山坡前缘出现横向及纵向裂缝，前缘土体出现隆起现象，以及动物出现惊恐异常等情况，则预示着即将发生泥石流。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。若山坡前缘出现横向及纵向裂缝，前缘土体出现隆起现象，以及动物出现惊恐异常等情况，则预示着即将发生山体滑坡。","type":"判断题"},{"number":38,"stem":"无论是正常票价还是特价机票，其客票有效期均为 1年。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。正常票价的客票有效期为 1 年。特价机票的有效期以承运人的规定为准。","type":"判断题"},{"number":39,"stem":"水运企业取得航线经营许可后，应在 60 日内开通运营，并于开航前 15日通过媒体公示及在客运站点公告。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":40,"stem":"无论是手提行李还是托运行李，都禁止夹带打火机和火柴。此外，旅客携带手机、电脑等物品时，需将手机调成飞行模式或关机后再乘坐飞机。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。二、单选题","type":"判断题"},{"number":41,"stem":"2026年《政府工作报告》提出的我国经济增长预期目标是（ ）。","options":[{"key":"A","text":"5%左右"},{"key":"B","text":"5.5%左右"},{"key":"C","text":"4.5%—5%"},{"key":"D","text":"4.5%左右"}],"answer":"C","keys":["C"],"explanation":"2026 年 3 月，十四届全国人大四次会议审议通过的《政府工作报告》提出，2026年经济增长预期目标设定为“4.5%—5%”，首次采用区间形式。2026年前三季度我国 GDP同比增长 4.6%，为实现全年目标打下良好基础。","type":"单选题"},{"number":42,"stem":"根据《中华人民共和国宪法》的规定，我国的根本政治制度是（ ）。","options":[{"key":"A","text":"中国共产党领导的多党合作和政治协商制度"},{"key":"B","text":"人民代表大会制度"},{"key":"C","text":"民族区域自治制度"}],"answer":"B","keys":["B"],"explanation":"宪法第 2 条、第 3条确立了人民代表大会制度为我国的根本政治制度，它是政权组织形式，直接体现国体，是实现人民当家作主的根本途径。A项错误，中国共产党领导的多党合作和政治协商制度属于基本政治制度；C 项错误，民族区域自治制度属于基本政治制度；D 项错误，基层群众自治制度属于基本政治制度。","type":"单选题"},{"number":43,"stem":"根据《中华人民共和国宪法》第 34条的规定，下列属于公民民主权利的是（ ）。","options":[{"key":"A","text":"选举权和被选举权"},{"key":"B","text":"劳动权"},{"key":"C","text":"受教育权"},{"key":"D","text":"休息权"}],"answer":"A","keys":["A"],"explanation":"公民权利保障：公民享有选举权和被选举权（第 34条）、批评建议权（第 41 条）等广泛民主权利。B 项错误，C 项错误，D 项错误，休息权规定于宪法第 43条。上述权利均属社会经济文化权利，不是选举权和被选举权。","type":"单选题"},{"number":44,"stem":"根据《旅游法》的规定，由于公共交通经营者的原因造成旅游者人身损害、财产损失的，（ ），旅行社应当协助旅游者向公共交通经营者索赔。","options":[{"key":"A","text":"仅由公共交通经营者承担赔偿责任"},{"key":"B","text":"由公共交通经营者依法承担主要责任"},{"key":"C","text":"旅行社应当承担连带责任"},{"key":"D","text":"旅行社应当承担补充责任"}],"answer":"A","keys":["A"],"explanation":"《旅游法》第 71条规定，由于公共交通经营者的原因造成旅游者人身损害、财产损失的，由公共交通经营者依法承担赔偿责任，旅行社应当协助旅游者向公共交通经营者索赔。","type":"单选题"},{"number":45,"stem":"《旅游法》规定，旅行社应当按照规定交纳（ ），用于旅游者权益损害赔偿和垫付旅游者人身安全遇有危险时紧急救助的费用。","options":[{"key":"A","text":"旅游风险抵押金"},{"key":"B","text":"旅游权益损害赔偿金"},{"key":"C","text":"旅游安全保障金"},{"key":"D","text":"旅游服务质量保证金"}],"answer":"D","keys":["D"],"explanation":"《旅游法》第 31条规定，旅行社应当按照规定交纳旅游服务质量保证金，用于旅游者权益损害赔偿和垫付旅游者人身安全遇有危险时紧急救助的费用。","type":"单选题"},{"number":46,"stem":"《旅游法》规定，因未达到约定人数不能出团的，组团社经征得旅游者书面同意，可以委托其他旅行社履行合同。（ ）","options":[{"key":"A","text":"组团社对旅游者承担责任，受委托的旅行社也对旅游者承担责任"},{"key":"B","text":"组团社对旅游者承担责任，受委托的旅行社对组团社承担责任"},{"key":"C","text":"组团社和受委托的旅行社均可以旅游者承担责任"},{"key":"D","text":"根据情况，旅游者可以选择组团社或受委托的旅行社承担责任"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 63条第 2款规定，因未达到约定人数不能出团的，组团社经征得旅游者书面同意，可以委托其他旅行社履行合同。组团社对旅游者承担责任，受委托的旅行社对组团社承担责任。旅游者不同意的，可以解除合同。","type":"单选题"},{"number":47,"stem":"根据《旅游法》的规定，导游员小张所带的旅游团队遭遇山洪，为保护旅游者人身和财产安全，经旅行社同意租用直升机将旅游者撤离到安全区域，为此支出的费用应当由（ ）承担。","options":[{"key":"A","text":"旅行社承担"},{"key":"B","text":"旅游者承担"},{"key":"C","text":"旅行社或旅游者承担"},{"key":"D","text":"旅行社和旅游者分担"}],"answer":"D","keys":["D"],"explanation":"《旅游法》第 67条规定，因不可抗力危及旅游者人身、财产安全的，旅行社应当采取相应的安全措施，因此支出的费用，由旅行社与旅游者分担。","type":"单选题"},{"number":48,"stem":"根据《民法典》的规定，自然人（ ）具有民事权利能力，依法享有民事权利，承担民事义务。","options":[{"key":"A","text":"从出生时起至 18 岁时止"},{"key":"B","text":"从出生时起至死亡时止"},{"key":"C","text":"从 18岁时起至死亡时止"},{"key":"D","text":"从具有劳动能力时起至退休时止"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 13条规定，自然人从出生时起到死亡时止，具有民事权利能力，依法享有民事权利，承担民事义务。","type":"单选题"},{"number":49,"stem":"合同债权人将合同权利全部或部分转让给第三人的，（ ）","options":[{"key":"A","text":"应当通知债务人"},{"key":"B","text":"应当经债务人同意"},{"key":"C","text":"应当办理审批手续"},{"key":"D","text":"应当经相关部门批准"}],"answer":"A","keys":["A"],"explanation":"《民法典》第 546条规定，债权人转让债权，未通知债务人的，该转让对债务人不发生效力。","type":"单选题"},{"number":50,"stem":"当事人可以约定一方向对方给付定金作为债权担保，收受定金的一方不履行约定的债务，致使不能实现合同目的的，应当（ ）返还定金。","options":[{"key":"A","text":"5倍"},{"key":"B","text":"2倍"},{"key":"C","text":"3倍"},{"key":"D","text":"10倍"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 587条规定，债务人履行债务的，定金应当抵作价款或者收回。给付定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，无权请求返还定金；收受定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，应当双倍返还定金。","type":"单选题"},{"number":51,"stem":"合同法定解除的情形不包括（ ）。","options":[{"key":"A","text":"当事人一方迟延履行致使不能实现合同目的"},{"key":"B","text":"合同履行期间发生不可抗力"},{"key":"C","text":"在履行期限届满之前，当事人一方明确表示不履行主要债务"},{"key":"D","text":"当事人一方迟延履行主要债务，经催告后在合同期限内仍未履行"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 563条规定，有下列情形之一的，当事人可以解除合同：因不可抗力致使不能实现合同目的；在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务；当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行；当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的；法律规定的其他情形。以持续履行的债务为内容的不定期合同，当事人可以随时解除合同，但是应当在合理期限之前通知对方。“合同履行期间发生不可抗力”错在，不仅发生不可抗力，而是不可抗力导致合同目的不能实现，才可以法定解除。","type":"单选题"},{"number":52,"stem":"根据《民法典》的规定，限制民事行为能力人实施的民事法律行为需要经法定代理人同意或者追认后有效的，相对人可以催告法定代理人自收到通知之日起（ ）内予以追认。","options":[{"key":"A","text":"15日"},{"key":"B","text":"30日"},{"key":"C","text":"60日"},{"key":"D","text":"10日"}],"answer":"B","keys":["B"],"explanation":"限制民事行为能力人实施的纯获利益的民事法律行为或者与其年龄、智力、精神健康状况相适应的民事法律行为有效；实施的其他民事法律行为经法定代理人同意或者追认后有效。相对人可以催告法定代理人自收到通知之日起 30 日内予以追认。","type":"单选题"},{"number":53,"stem":"根据《旅游法》的规定，发生（ ）情形的，组团社不能仅将余款退还旅游者。","options":[{"key":"A","text":"旅游行程结束前，旅游者解除合同的"},{"key":"B","text":"旅行社非因法定情形，单方面解除合同的"},{"key":"C","text":"旅游行程开始后，旅游者解除合同的"},{"key":"D","text":"旅游者从事违法或者违反社会公德的活动的，旅行社解除合同的"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 65、66条规定，旅游者解除旅游合同后，旅行社在法定情形下解除合同时，组团社应当在扣除必要的费用后，将余款退还旅游者。旅行社非因法定情形，单方面解除合同的”组团社需要承担违约赔偿。","type":"单选题"},{"number":54,"stem":"以挂靠形式从事道路运输经营活动的机动车，发生交通事故造成损害，属于该机动车一方责任的，由（ ）。","options":[{"key":"A","text":"挂靠人承担责任"},{"key":"B","text":"挂靠人和被挂靠人承担连带责任"},{"key":"C","text":"被挂靠人承担责任"},{"key":"D","text":"挂靠人承担责任，被挂靠人承担补充责任"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 1211条规定，以挂靠形式从事道路运输经营活动的机动车，发生交通事故造成损害，属于该机动车一方责任的，由挂靠人和被挂靠人承担连带责任。","type":"单选题"},{"number":55,"stem":"根据《民法典》相关规定，以下关于监护人责任的说法中正确的是（ ）。","options":[{"key":"A","text":"无民事行为能力人、限制民事行为能力人造成他人损害的，由监护人承担侵权责任"},{"key":"B","text":"监护人尽到监护责任的，可以减轻或免除其侵权责任"},{"key":"C","text":"有财产的无民事行为能力人、限制民事行为能力人造成他人损害的，从监护人财产中支付赔偿费用"},{"key":"D","text":"监护人支付赔偿后的不足部分，由侵权人自行承担"}],"answer":"A","keys":["A"],"explanation":"《民法典》第 1188条规定，无民事行为能力人、限制民事行为能力人造成他人损害的，由监护人承担侵权责任。监护人尽到监护职责的，可以减轻其侵权责任。有财产的无民事行为能力人、限制民事行为能力人造成他人损害的，从本人财产中支付赔偿费用；不足部分，由监护人赔偿。","type":"单选题"},{"number":56,"stem":"《中华人民共和国旅游法》规定，旅行社聘用导游或领队要求导游垫付或者向导游收取费用的，由旅游主管部门责令改正，没收违法所得，并（ ）。","options":[{"key":"A","text":"处 5000 元以上 5 万元以下罚款"},{"key":"B","text":"处 1000 元以上 1 万元以下罚款"},{"key":"C","text":"处 3000 元以上 3 万元以下罚款"},{"key":"D","text":"处 2000 元以上 2 万元以下罚款"}],"answer":"A","keys":["A"],"explanation":"《中华人民共和国旅游法》旅行社聘用导游或领队要求导游垫付或者向导游收取费用的，由旅游主管部门责令改正，没收违法所得，并处 5000 元以上 5 万元以下罚款；情节严重的，责令停业整顿或者吊销旅行社业务经营许可证。","type":"单选题"},{"number":57,"stem":"根据《旅游法》的规定，旅行社应当提示参加团队旅游的旅游者按照规定投保（ ）。","options":[{"key":"A","text":"人身意外伤害保险"},{"key":"B","text":"旅行社责任保险"},{"key":"C","text":"交通意外保险"},{"key":"D","text":"综合意外保险"}],"answer":"A","keys":["A"],"explanation":"《旅游法》第 61条规定，旅行社应当提示参加团队旅游的旅游者按照规定投保人身意外伤害保险。","type":"单选题"},{"number":58,"stem":"根据《旅行社条例》的规定，旅行社在银行存入质量保证金的，应当设立独立账户，存期由旅行社确定，但不得少于（ ）。","options":[{"key":"A","text":"一个月"},{"key":"B","text":"一年"},{"key":"C","text":"六个月"},{"key":"D","text":"两年"}],"answer":"B","keys":["B"],"explanation":"旅行社在银行存入质量保证金的，应当设立独立账户，存期由旅行社确定，但不得少于 1年。","type":"单选题"},{"number":59,"stem":"《旅游法》规定，为旅游者提供交通、住宿、餐饮、娱乐等服务的经营者，应当符合法律、法规规定的要求，按照（ ）履行义务。","options":[{"key":"A","text":"法律规定"},{"key":"B","text":"市场标准"},{"key":"C","text":"合同约定"},{"key":"D","text":"行业标准"}],"answer":"C","keys":["C"],"explanation":"《旅游法》第 49条规定，为旅游者提供交通、住宿、餐饮、娱乐等服务的经营者，应当符合法律、法规规定的要求，按照合同约定履行义务。","type":"单选题"},{"number":60,"stem":"依据《在线旅游经营服务管理暂行规定》，平台内经营者与旅游者发生旅游纠纷的，平台经营者应当积极协助旅游者维护合法权益。鼓励（ ）先行赔付。","options":[{"key":"A","text":"平台经营者"},{"key":"B","text":"平台内经营者"},{"key":"C","text":"自建网站经营者"},{"key":"D","text":"平台内经营者或平台经营者"}],"answer":"A","keys":["A"],"explanation":"解析依据《在线旅游经营服务管理暂行规定》第 21条，平台内经营者与旅游者发生旅游纠纷的，平台经营者应当积极协助旅游者维护合法权益。鼓励平台经营者先行赔付。","type":"单选题"},{"number":61,"stem":"某旅行社经营出境和入境旅游业务，2021 年设立了一家经营入境和出境旅游业务的分社和一家经营入境旅游业务和国内旅游业务的分社，并设立了两个服务网点。根据《旅行社条例》，该旅行社应当存入质量保证金账户的金额共计（ ）。","options":[{"key":"A","text":"175万元"},{"key":"B","text":"155万元"},{"key":"C","text":"180万元"},{"key":"D","text":"190万元"}],"answer":"C","keys":["C"],"explanation":"经营入境旅游业务和国内旅游业务，同时还经营出境旅游业务的旅行社，存入质量保证金为 140万元。如果该分社既经营国内旅游业务，又经营入境旅游业务，还经营出境旅游业务，则应当向其质量保证金账户增存 35万元；每设立 1 个经营国内旅游业务和入境旅游业务的分社，应当增存 5 万元；设立服务网点不需要增存质量保证金。 140 + 3 5 + 5 =180 万。","type":"单选题"},{"number":62,"stem":"导游员小张在带团过程中强迫旅游者进购物店购物三次，根据《旅行社服务质量赔偿标准》的规定，旅行社应当按照旅游费用总额的（ ）向旅游者支付违约金。","options":[{"key":"A","text":"10%"},{"key":"B","text":"30%"},{"key":"C","text":"40%"},{"key":"D","text":"60%"}],"answer":"D","keys":["D"],"explanation":"强迫或者变相强迫旅游者购物的，每次向旅游者支付旅游费用总额 20% 的违约金。注意，题干强迫旅游者进购物店购物三次，每次 20% ，因此答案是 60% 。","type":"单选题"},{"number":63,"stem":"《旅游法》规定，未取得导游证从事导游活动的，由旅游主管部门责令改正，没收违法所得，并处（ ）罚款，予以公告。","options":[{"key":"A","text":"2000元以上 1万元以下"},{"key":"B","text":"1000元以上 3万元以下"},{"key":"C","text":"2000元以上 2万元以下"},{"key":"D","text":"1000元以上 1万元以下"}],"answer":"D","keys":["D"],"explanation":"《旅游法》第 102条规定，未取得导游证从事导游活动的，由旅游主管部门责令改正，没收违法所得，并处 1000元以上 1 万元以下罚款，予以公告。","type":"单选题"},{"number":64,"stem":"根据《导游管理办法》的规定，旅行社有下列哪些行为的，导游有权向劳动行政部门投诉举报、申请仲裁或者向人民法院提起诉讼？","options":[{"key":"A","text":"不依法与临时聘用的导游订立劳务合同的"},{"key":"B","text":"不依法为临时聘用的导游缴纳社会保险费用的"},{"key":"C","text":"要求聘用导游缴纳自身社会保险费用的"},{"key":"D","text":"支付导游的报酬低于当地平均工资标准的"}],"answer":"C","keys":["C"],"explanation":"《导游管理办法》第 27条规定，旅行社有下列行为之一的，导游有权向劳动行政部门投诉举报、申请仲裁或者向人民法院提起诉讼：（1）不依法与聘用的导游订立劳动合同的；（2）不依法向聘用的导游支付劳动报酬、导游服务费用或者缴纳社会保险费用的；（3）要求导游缴纳自身社会保险费用的；（4）支付导游的报酬低于当地最低工资标准的。本题中，C项分别符合第（3）项规定，属于明确禁止的侵权行为，导游可依法维权。","type":"单选题"},{"number":65,"stem":"《导游管理办法》规定，申请取得导游证，申请人与经常执业地区的旅行社订立劳动合同的确认信息，旅行社应当自申请人提交申请之日起（ ）内确认。","options":[{"key":"A","text":"3个工作日"},{"key":"B","text":"5个工作日"},{"key":"C","text":"7个工作日"},{"key":"D","text":"10个工作日"}],"answer":"B","keys":["B"],"explanation":"《导游管理办法》第 10条规定，申请取得导游证，申请人应当通过全国旅游监管服务信息系统填写申请信息，并提交下列申请材料：（1）身份证的扫描件或者数码照片等电子版；（2）未患有传染性疾病的承诺；（3）无过失犯罪以外的犯罪记录的承诺；（4）与经常执业地区的旅行社订立劳动合同或者在经常执业地区的旅游行业组织注册的确认信息。前款第（4）项规定的信息，旅行社或者旅游行业组织应当自申请人提交申请之日起 5 个工作日内确认。","type":"单选题"},{"number":66,"stem":"根据《导游管理办法》的规定，下列关于导游执业规范的说法，正确的是（ ）。","options":[{"key":"A","text":"应当携带电子导游证"},{"key":"B","text":"应当携带导游身份标识"},{"key":"C","text":"旅游者有权查验导游电子导游证"},{"key":"D","text":"旅游者有权查验导游身份标识"}],"answer":"A","keys":["A"],"explanation":"《导游管理办法》第 20条规定：“导游在执业过程中应当携带电子导游证、佩戴导游身份标识，并开启导游执业相关应用软件。旅游者有权要求导游展示电子导游证和导游身份标识。”因此，A 项完全正确。","type":"单选题"},{"number":67,"stem":"根据《导游管理办法》的规定，具有下列（ ）情形的，应当由所在地旅游主管部门给予注销导游证。","options":[{"key":"A","text":"对不具备申请资格的申请人核发导游证的"},{"key":"B","text":"导游证被依法吊销的"},{"key":"C","text":"申请人以欺骗、贿赂等不正当手段取得导游证的"},{"key":"D","text":"对不符合法定条件的申请人核发导游证的"}],"answer":"B","keys":["B"],"explanation":"《导游管理办法》第 17条规定，有下列情形之一的，所在地旅游主管部门应当注销导游证：① 导游死亡的； ② 导游证有效期届满未申请换发导游证的； ③ 导游证依法被撤销、吊销的； ④ 导游与旅行社订立的劳动合同解除、终止或者在旅游行业组织取消注册后，超过3个月未与其他旅行社订立劳动合同或者未在其他旅游行业组织注册的； ⑤ 取得导游证后出现本办法第 12 条不予核发导游证情形第（1）项至第（3）项的； ⑥ 依法应当注销导游证的其他情形。导游证被注销后，导游符合法定执业条件需要继续执业的，应当依法重新申请取得导游证。B 项完全符合第（5）项规定。其余三项为导游被撤销导游证的情形。","type":"单选题"},{"number":68,"stem":"依据《治安管理处罚法》的规定，违反治安管理行为在（ ）以内没有被公安机关发现的，不再处罚。","options":[{"key":"A","text":"3个月"},{"key":"B","text":"6个月"},{"key":"C","text":"12个月"},{"key":"D","text":"24个月"}],"answer":"B","keys":["B"],"explanation":"解析依据第 25 条，违反治安管理行为在 6 个月以内没有被公安机关发现的，不再处罚；期限从行为发生之日起计算，行为有连续或者继续状态的，从行为终了之日起计算。","type":"单选题"},{"number":69,"stem":"根据《治安管理处罚法》第 28 条的规定，因扰乱体育比赛、文艺演出活动秩序被处以拘留处罚的，可以同时责令其（ ）以内不得进入同类场馆观看同类比赛、演出。","options":[{"key":"A","text":"三个月至一年"},{"key":"B","text":"三个月至 6 个月"},{"key":"C","text":"六个月至一年"},{"key":"D","text":"两年内"}],"answer":"C","keys":["C"],"explanation":"《治安管理处罚法》第 28条规定，因扰乱体育比赛、文艺演出活动秩序被处以拘留处罚的，可以同时责令其六个月至一年以内不得进入体育场馆、演出场馆观看同类比赛、演出。","type":"单选题"},{"number":70,"stem":"根据《消费者权益保护法》的规定，经营者提供的机动车、计算机、电视机、电冰箱、空调器、洗衣机等耐用商品或者装饰装修等服务，消费者自接受商品或者服务之日起（ ）内发现瑕疵，发生争议的，由经营者承担有关瑕疵的举证责任。","options":[{"key":"A","text":"1个月"},{"key":"B","text":"3个月"},{"key":"C","text":"6个月"},{"key":"D","text":"1年内"}],"answer":"C","keys":["C"],"explanation":"《消费者权益保护法》规定，经营者提供的机动车、计算机、电视机、电冰箱、空调器、洗衣机等耐用商品或者装饰装修等服务，消费者自接受商品或者服务之日起 6 个月内发现瑕疵，发生争议的，由经营者承担有关瑕疵的举证责任。","type":"单选题"},{"number":71,"stem":"根据《旅游投诉处理办法》的规定，以下（ ）属于旅游投诉的地域管辖范围。","options":[{"key":"A","text":"投诉者所在地"},{"key":"B","text":"旅游合同签订地"},{"key":"C","text":"损害结果发生地"},{"key":"D","text":"旅游合同解除地"}],"answer":"B","keys":["B"],"explanation":"《旅游投诉处理办法》第 5条规定：“旅游投诉由旅游经营者住所地、旅游合同签订地或者旅游纠纷发生地县级以上旅游投诉处理机构管辖。需要立即制止、纠正旅游经营者的损害行为的，应当由旅游纠纷发生地旅游投诉处理机构管辖。”需要即时制止、纠正的情形以旅游纠纷发生地管辖，便于快速处置，防止损害扩大。","type":"单选题"},{"number":72,"stem":"根据《旅游投诉处理办法》的规定，以下（ ）属于旅游投诉的实质要件。","options":[{"key":"A","text":"投诉人与投诉事项有间接利害关系"},{"key":"B","text":"有明确的投诉人"},{"key":"C","text":"旅游投诉书"},{"key":"D","text":"具体的投诉请求"}],"answer":"D","keys":["D"],"explanation":"《旅游投诉管理办法》第 9 条，旅游投诉应当符合下列条件：（1）投诉人与投诉事项有直接利害关系；（2）有明确的被投诉人、具体的投诉请求。旅游投诉可以口头投诉，故不是必须条件。","type":"单选题"},{"number":73,"stem":"根据《旅游投诉处理办法》第 23条的规定，旅游投诉处理机构应当在受理旅游投诉之日起（ ）以内作出处理。","options":[{"key":"A","text":"30日"},{"key":"B","text":"45日"},{"key":"C","text":"60日"},{"key":"D","text":"90日"}],"answer":"C","keys":["C"],"explanation":"《旅游投诉处理办法》第 23 条规定：“旅游投诉处理机构应当在受理旅游投诉之日起六十日以内，作出以下处理：（一）达成调解协议的，应当制作《旅游投诉调解书》，由投诉人与被投诉人签字、盖章或者以适当方式确认，并加盖旅游投诉处理机构公章；（二）调解不成的，应当终止调解，制作《旅游投诉终止调解书》，并以适当方式告知投诉人与被投诉人。”","type":"单选题"},{"number":74,"stem":"旅行社责任保险的保险范围不包括（ ）。","options":[{"key":"A","text":"因旅行社疏忽或过失应当承担赔偿责任"},{"key":"B","text":"因旅行社重大过失应当承担赔偿责任"},{"key":"C","text":"因发生意外事故旅行社应当承担赔偿责任"},{"key":"D","text":"国务院旅游主管部门会同中国保险监督管理委员会规定的其他情形"}],"answer":"B","keys":["B"],"explanation":"保险公司是以盈利为目的的公司，旅行社重大过失应当承担赔偿责任的，保险公司不会理赔。","type":"单选题"},{"number":75,"stem":"《旅游安全管理办法》规定，旅游突发事件实行报告制度，以下说法正确的是（ ）。","options":[{"key":"A","text":"一般旅游突发事件上报至县级旅游主管部门"},{"key":"B","text":"较大旅游突发事件逐级上报至设区的市级旅游主管部门"},{"key":"C","text":"重大旅游突发事件逐级上报至省级旅游主管部门"},{"key":"D","text":"特别重大旅游突发事件逐级上报至文化和旅游部"}],"answer":"D","keys":["D"],"explanation":"各级旅游主管部门应当建立旅游突发事件报告制度。旅游主管部门在接到旅游经营者的报告后，应当向同级人民政府和上级旅游主管部门报告。一般旅游突发事件上报至设区的市级旅游主管部门；较大旅游突发事件逐级上报至省级旅游主管部门；重大和特别重大旅游突发事件逐级上报至文化和旅游部。","type":"单选题"},{"number":76,"stem":"《旅游安全管理办法》规定，旅行社组织出境旅游，应当制作（ ）。","options":[{"key":"A","text":"应急联络卡"},{"key":"B","text":"个人健康卡"},{"key":"C","text":"安全信息卡"},{"key":"D","text":"紧急救援卡"}],"answer":"C","keys":["C"],"explanation":"旅游安全管理办法》第 12条，旅行社组织出境旅游，应当制作安全信息卡。","type":"单选题"},{"number":77,"stem":"根据《中华人民共和国民用航空法》的规定，收货人于货物到达目的地点，有权要求承运人交付货物的前提是（ ）。","options":[{"key":"A","text":"已经取得航空货运单原件"},{"key":"B","text":"缴付应付款项并履行运输条件"},{"key":"C","text":"取得托运人的书面授权"},{"key":"D","text":"货物已经完成海关查验"}],"answer":"B","keys":["B"],"explanation":"第 124条，收货人于货物到达目的地点，并在缴付应付款项和履行运输条件后，有权要求承运人交付货物。A项错误，法律并未要求收货人必须持有航空货运单原件方可提货。B项正确，收货人应当在缴付应付款项并履行运输条件后，才有权要求承运人交付货物。C项错误，收货人基于运输合同享有提货权利，不以托运人书面授权为前提。D项错误，海关查验不是收货人提货的法定前提条件。","type":"单选题"},{"number":78,"stem":"根据《铁路法》的规定，铁路运输企业应当对承运的货物、包裹、行李自接受承运时起到交付时止发生的灭失、短少、变质、污染或者损坏，承担赔偿责任。旅客根据自愿申请办理行李保价运输的，按照（ ），但最高不超过保价额。","options":[{"key":"A","text":"实际保价额赔偿"},{"key":"B","text":"实际损失赔偿"},{"key":"C","text":"最高赔偿限额"},{"key":"D","text":"声明价格赔偿"}],"answer":"B","keys":["B"],"explanation":"《铁路法》第 17条规定，铁路运输企业应当对承运的货物、包裹、行李自接受承运时起到交付时止发生的灭失、短少、变质、污染或者损坏，承担赔偿责任。托运人或者旅客根据自愿申请办理保价运输的，按照实际损失赔偿，但最高不超过保价额。","type":"单选题"},{"number":79,"stem":"根据《娱乐场所管理条例》的规定，娱乐场所依法取得营业执照和相关批准文件、许可证后，应当在（ ）内向所在地县级公安部门备案。","options":[{"key":"A","text":"7日"},{"key":"B","text":"7个工作日"},{"key":"C","text":"15日"},{"key":"D","text":"15个工作日"}],"answer":"C","keys":["C"],"explanation":"《娱乐场所管理条例》规定，娱乐场所依法取得营业执照和相关批准文件、许可证后，应当在 15 日内向所在地县级公安部门备案。","type":"单选题"},{"number":80,"stem":"根据《风景名胜区条例》的规定，在国家级风景名胜区内修建缆车、索道等重大建设工程，项目选址方案应当报（ ）核准。","options":[{"key":"A","text":"国务院林业草原主管部门"},{"key":"B","text":"省、自治区、直辖市人民政府林业草原主管部门"},{"key":"C","text":"县级以上人民政府林业草原主管部门"},{"key":"D","text":"风景名胜区管理机构"}],"answer":"B","keys":["B"],"explanation":"《风景名胜区条例》第二十八条：在风景名胜区内从事本条例第二十六条、第二十七条禁止范围以外的建设活动，应当经风景名胜区管理机构审核后，依照有关法律、法规的规定办理审批手续。在国家级风景名胜区内修建缆车、索道等重大建设工程，项目的选址方案应当报省、自治区、直辖市人民政府林业草原主管部门核准。A项错误，国务院林业草原主管部门负责全国监督管理，不负责缆车、索道等重大建设工程选址方案的核准。B 项正确，符合条例第二十八条第二款关于选址方案核准机关的规定。C 项错误，县级以上人民政府林业草原主管部门，层级不符合法条规定，故错误。D项错误，风景名胜区管理机构负责区内相关活动的审核，不承担重大建设工程选址方案的核准职权。","type":"单选题"},{"number":81,"stem":"依照《博物馆条例》的规定，博物馆违法从事非文物藏品的商业经营活动，没有违法所得的，处（ ）罚款。","options":[{"key":"A","text":"2000元以上 5000元以下"},{"key":"B","text":"2000元以上 1万元以下"},{"key":"C","text":"5000元以上 2万元以下"},{"key":"D","text":"5000元以上 5万元以下"}],"answer":"C","keys":["C"],"explanation":"此种情形下，由相关部门责令改正，有违法所得的，没收违法所得，并处违法所得2 倍以上 5 倍以下罚款；没有违法所得的，处 5000 元以上 2 万元以下罚款；情节严重的，由登记管理机关撤销登记。","type":"单选题"},{"number":82,"stem":"习近平法治思想强调，全面依法治国最广泛、最深厚的基础是（ ）。","options":[{"key":"A","text":"中国共产党"},{"key":"B","text":"以宪法为核心的法律体系"},{"key":"C","text":"人民"},{"key":"D","text":"社会主义制度"}],"answer":"C","keys":["C"],"explanation":"习近平法治思想强调，要坚持以人民为中心。全面依法治国最广泛、最深厚的基础是人民，必须坚持为了人民、依靠人民。要把体现人民利益、反映人民愿望、维护人民权益、增进人民福祉落实到全面依法治国各领域全过程。","type":"单选题"},{"number":83,"stem":"依据习近平新时代中国特色社会主义思想相关理论，（ ）是马克思主义的本质属性。","options":[{"key":"A","text":"实践性"},{"key":"B","text":"人民性"},{"key":"C","text":"开放性"},{"key":"D","text":"科学性"}],"answer":"B","keys":["B"],"explanation":"人民性是马克思主义的本质属性，党的理论是来自人民、为了人民、造福人民的理论，人民的创造性实践是理论创新的不竭源泉。A项错误，实践性是马克思主义的基本特征，但文档明确规定人民性为马克思主义的本质属性。B项正确。C项错误，开放性并非马克思主义本质属性。D项错误，科学性是马克思主义的特征，但不是本质属性。","type":"单选题"},{"number":84,"stem":"依据法律规定，以下场所中（ ）无须悬挂国徽。","options":[{"key":"A","text":"乡镇人民代表大会会场"},{"key":"B","text":"人民大会堂"},{"key":"C","text":"公安机关"},{"key":"D","text":"各级人民法院和专门人民法院的审判庭"}],"answer":"C","keys":["C"],"explanation":"下列场所应当悬挂国徽：北京天安门城楼、人民大会堂；县级以上各级人民代表大会及其常务委员会会议厅，乡、民族乡、镇的人民代表大会会场；各级人民法院和专门人民法院的审判庭；宪法宣誓场所；出境入境口岸的适当场所。","type":"单选题"},{"number":85,"stem":"中央人民政府对香港特别行政区有关的国家安全事务负有（ ）。","options":[{"key":"A","text":"宪制责任"},{"key":"B","text":"根本责任"},{"key":"C","text":"主要责任"},{"key":"D","text":"基本责任"}],"answer":"B","keys":["B"],"explanation":"《港区国安法》第 3 条规定，中央人民政府对香港特别行政区有关的国家安全事务负有根本责任。","type":"单选题"},{"number":86,"stem":"《关于推动在线旅游市场高质量发展的意见》提到的“两个作用”是指（ ）。","options":[{"key":"A","text":"市场和政府的作用"},{"key":"B","text":"企业和个人的作用"},{"key":"C","text":"高速和高质量的作用"},{"key":"D","text":"供给和需求的作用"}],"answer":"A","keys":["A"],"explanation":"《意见》（一）指导思想明确提出：“充分发挥市场在资源配置中的决定性作用，更好发挥政府作用”。这“两个作用”是新时代经济治理的核心理念。因此，A项正确。","type":"单选题"},{"number":87,"stem":"世界上组织出国包价旅游的开端是（ ）。","options":[{"key":"A","text":"1846年苏格兰之行"},{"key":"B","text":"1845年利物浦之行"},{"key":"C","text":"1855年巴黎之行"},{"key":"D","text":"1872年北美之行"}],"answer":"C","keys":["C"],"explanation":"1855 年，跨国包价旅游的开端：组织从莱斯特到巴黎的旅游（游览 4 天）；一次性包价（含往返交通费和住宿费）世界上组织出国包价旅游的开端。","type":"单选题"},{"number":88,"stem":"1927年，陈光甫创办中国第一本旅游刊物（ ）。","options":[{"key":"A","text":"《旅行杂志》"},{"key":"B","text":"《旅游杂志》"},{"key":"C","text":"《民国游记》"},{"key":"D","text":"《民国旅游》"}],"answer":"A","keys":["A"],"explanation":"1927年，陈光甫创办中国第一本旅游刊物《旅行杂志》。","type":"单选题"},{"number":89,"stem":"1954年, ( ) 成立。","options":[{"key":"A","text":"中国旅行社"},{"key":"B","text":"中国国际旅行社"},{"key":"C","text":"中国青年旅行社"},{"key":"D","text":"海外旅行社"}],"answer":"B","keys":["B"],"explanation":"1954 年 4 月 15 日: 中国国际旅行社 (以下称“国旅”) 总社在北京成立, 上海等12城设分支社。","type":"单选题"},{"number":90,"stem":"( ) 年, 举行全国导游资格考试。","options":[{"key":"A","text":"1988"},{"key":"B","text":"1989"},{"key":"C","text":"1990"},{"key":"D","text":"1991"}],"answer":"B","keys":["B"],"explanation":"1989年：举行全国导游资格考试（每年一次）。","type":"单选题"},{"number":91,"stem":"下列选项中，按照技术等级划分的是（ ）。","options":[{"key":"A","text":"专职导游"},{"key":"B","text":"外语导游"},{"key":"C","text":"地陪导游"},{"key":"D","text":"高级导游"}],"answer":"D","keys":["D"],"explanation":"根据 2025年 3 月 1 日起施行的《导游等级考核管理办法》，我国导游等级分为初级、中级、高级、特级四个等级，全国实行统一的导游等级考核制度。","type":"单选题"},{"number":92,"stem":"下列关于领队职责的描述，错误的是（ ）。","options":[{"key":"A","text":"遵守外事纪律，维护国家利益和民族尊严"},{"key":"B","text":"向旅游者说明旅游目的地法律法规、风土人情及风俗习惯"},{"key":"C","text":"领队代表组团社监督地接社和地陪履行旅游合同"},{"key":"D","text":"主动将外国特产介绍给旅游者，并正确引导他们购买"}],"answer":"D","keys":["D"],"explanation":"领队应恪守职业道德，遵守外事纪律，维护国家利益和民族尊严，提醒旅游者抵制有损国家利益和民族尊严的言行。向旅游者说明旅游目的地法律法规、风土人情及风俗习惯等，提供全程陪同服务，并在旅游行程的各个环节宣讲文明旅游注意事项，引导文明旅游；领队代表组团社监督地接社和地陪履行旅游合同，按照组团社的行程计划兑现接待服务承诺，监督其执行接待标准和保证服务质量，维护组团社和旅游者的合法权益。","type":"单选题"},{"number":93,"stem":"导游在着装时，服装颜色不宜超过（ ）。","options":[{"key":"A","text":"2种"},{"key":"B","text":"3种"},{"key":"C","text":"4种"},{"key":"D","text":"5种"}],"answer":"B","keys":["B"],"explanation":"全身颜色不宜超过 3 种。","type":"单选题"},{"number":94,"stem":"下列关于导游交谈礼仪的描述，正确的一项是（ ）。","options":[{"key":"A","text":"导游与旅游者交谈过程中态度霸气，稳重，需要引领团队"},{"key":"B","text":"导游与旅游者交谈时要选择自己擅长的领域"},{"key":"C","text":"只能适度的拿旅游者的缺点和不足来开玩笑"},{"key":"D","text":"导游对一件事不了解，不要随意地去质疑、不要打断、纠正对方"}],"answer":"D","keys":["D"],"explanation":"导游与旅游者交谈过程中态度要谦虚诚恳，说话要平和沉稳；导游与旅游者交谈时要选择对方感兴趣的话题或是彼此都感兴趣的话题，或是对方比较擅长的领域；导游与旅游者交谈时，切记不能拿旅游者的缺点和不足来开玩笑，懂得尊重旅游者；当导游对一件事不了解的时候，就不要随意地去质疑、不要打断、纠正对方。","type":"单选题"},{"number":95,"stem":"导游电话礼仪应该遵循的原则是（ ）。","options":[{"key":"A","text":"通话内容应简明扼要、直言主题"},{"key":"B","text":"通话结束后，应主动接电话"},{"key":"C","text":"时间以适中为佳，不要着急把话讲完"},{"key":"D","text":"一般选择在休息时间打电话，别耽误办公"}],"answer":"A","keys":["A"],"explanation":"除非有急事，一般不要在休息时间、用餐之时打电话；通话时间以短为佳、宁短勿长，一般限定在 3 分钟之内；通话内容应简明扼要、长话短说、直言主题。","type":"单选题"},{"number":96,"stem":"导游在接团前，要准备一些交谈的话题，下面内容中应避免出现的话题是（ ）。","options":[{"key":"A","text":"当前热门话题"},{"key":"B","text":"国内外重大新闻"},{"key":"C","text":"宗教纷争问题"},{"key":"D","text":"当地的美食推荐和饮食文化"}],"answer":"C","keys":["C"],"explanation":"交谈话题知识：当前热门话题；国内外重大新闻；旅游者可能感兴趣的话题；旅游者国家（地区）知识准备。","type":"单选题"},{"number":97,"stem":"地陪导游在客人用餐过程中，（ ）","options":[{"key":"A","text":"无需巡视"},{"key":"B","text":"应巡视 1-2次"},{"key":"C","text":"应巡视 2-3次"},{"key":"D","text":"应巡视不少于 3 次"}],"answer":"B","keys":["B"],"explanation":"用餐过程中，地陪应巡视旅游团用餐情况 1 一 2 次。","type":"单选题"},{"number":98,"stem":"在带领游客购物时，地陪操作正确的选项是（ ）。","options":[{"key":"A","text":"不得擅自增加购物次数，但是可以适当延长停留时间"},{"key":"B","text":"只能向旅游者兜售旅游当地特色物品，其他不可"},{"key":"C","text":"可以向游客介绍本地商品的特色及选购方法"},{"key":"D","text":"入境旅游者要购买麝香、犀牛角和虎骨等，明确告知只能少量购买"}],"answer":"C","keys":["C"],"explanation":"禁止擅自增加购物次数或延长停留时间，不得向旅游者兜售任何物品；地陪应向旅游团清晰说明购物场所的停留时间以及购物过程中的相关注意事项，并详细介绍本地商品的特色及选购方法，重点突出商品的实用性、收藏性、装饰性、纪念性等特点；当入境旅游者购买特殊商品（如中药或中药制成品）时，应推荐其前往质量可靠、信誉良好的大型药店，并明确告知我国海关关于药品携带出境的限额规定（即合理自用范围），特别强调海关严禁携带麝香、犀牛角和虎骨等中药材出境。","type":"单选题"},{"number":99,"stem":"（ ）不属于送行前业务准备的范畴。","options":[{"key":"A","text":"核对交通票据"},{"key":"B","text":"提醒注意事项"},{"key":"C","text":"及时归还证件"},{"key":"D","text":"收集反馈意见"}],"answer":"D","keys":["D"],"explanation":"核对交通票据；提醒注意事项；商定出发时间；及时归还证件。","type":"单选题"},{"number":100,"stem":"下列选项中，对全陪首次接待入境团的描述，不正确的是（ ）。","options":[{"key":"A","text":"应在接团前一日与首站接待社取得联系，了解接待工作详细安排情况"},{"key":"B","text":"与首站地陪一起提前 20分钟到达接站地点，迎候旅游团"},{"key":"C","text":"协助地陪认找应接旅游团，防止错接"},{"key":"D","text":"接到旅游团后，全陪要向领队和游客问好，进行自我介绍，并介绍地陪"}],"answer":"B","keys":["B"],"explanation":"（1）提前联系接待社：全陪应在接团前一日与首站接待社取得联系，了解接待工作详细安排情况强调提前沟通的重要性；（2）提前到达接站地点：与首站地陪一起提前 30 分钟到达接站地点，迎候旅游团强调时间要求；（3）协助认找旅游团：协助地陪认找应接旅游团，防止错接强调合作与避免失误；（4）向领队和旅游者问好：接到旅游团后，全陪要向领队和游客问好，进行自我介绍，并介绍地陪强调初次接触的礼节和人员介绍。（5）确认实到人数：立即询问确认实到人数，与接待计划不符时，及时通报组团社，由其通知各站地接社。","type":"单选题"},{"number":101,"stem":"游客出境前，应确认自己的护照有效期，一般应在（ ）以上。","options":[{"key":"A","text":"一个月"},{"key":"B","text":"三个月"},{"key":"C","text":"六个月"},{"key":"D","text":"一年"}],"answer":"D","keys":["D"],"explanation":"检查护照有效期：护照剩余有效期一般应在一年以上。","type":"单选题"},{"number":102,"stem":"某旅游团在海边旅游，游客希望购买海龟，并让店家烹制，导游回绝，表示海龟是国家保护动物，禁止捕杀和交易。这是导游运用了拒绝方法中的（ ）。","options":[{"key":"A","text":"正面回绝法"},{"key":"B","text":"替代方案法"},{"key":"C","text":"婉转拒绝法"},{"key":"D","text":"拖延时间法"}],"answer":"A","keys":["A"],"explanation":"正面回绝法：当旅游者提出不当要求时，导游可直接从正面给予回绝。在涉及原则性的大是大非问题面前，导游应当敢于正面回绝。","type":"单选题"},{"number":103,"stem":"在前往景区的车上，有两位游客在座位上大声交谈，影响他人休息。导游起身望向两人，同时轻声咳嗽两下，两人听到后马上压低声音。这里导游采用了（ ）。","options":[{"key":"A","text":"侧面迂回法"},{"key":"B","text":"间接暗示法"},{"key":"C","text":"正面引导法"},{"key":"D","text":"眼神交流法"}],"answer":"B","keys":["B"],"explanation":"间接暗示法：发现问题时，导游既不直接明说，也不从侧面劝告，而是采用含蓄隐喻的动作或声音暗示旅游者接受劝告的方法。","type":"单选题"},{"number":104,"stem":"（ ）常用于导游表达惭愧、爱护、沉思等情绪时。","options":[{"key":"A","text":"仰视法"},{"key":"B","text":"俯视法"},{"key":"C","text":"闭目法"},{"key":"D","text":"虚视法"}],"answer":"B","keys":["B"],"explanation":"俯视法：导游讲话时低头，视线向下看低处。该法常用于导游表达惭愧、爱护、沉思等情绪时，和仰视法一样，也不宜过多使用。","type":"单选题"},{"number":105,"stem":"下列关于导游讲解时语速快慢的表述，正确的是（ ）。","options":[{"key":"A","text":"对于年龄较大、身份尊贵、性格平和者，应适当加快语速"},{"key":"B","text":"在安静地点、氛围欢快场合，可适当降低语速"},{"key":"C","text":"讲解重要内容或需强调信息时，应放慢语速"},{"key":"D","text":"对于中青年和好动者，则可适当降低语速"}],"answer":"C","keys":["C"],"explanation":"1. 讲解对象：面对不同年龄、身份、性格的旅游者，应采取不同语速。对于年龄较大、身份尊贵、性格平和者，应放慢语速；对于中青年和好动者，则可适当提高语速。2. 讲解环境：在喧闹空间、庄严肃穆场合，应适当降低语速；在安静地点、氛围欢快场合，可适当提升语速。3. 讲解内容：讲解重要内容或需强调信息时，应放慢语速；提及无关紧要、众所周知或敏感内容时，可快速带过。","type":"单选题"},{"number":106,"stem":"例如在介绍苏州园林的造景手法时，可以这样讲：“古代造园家很讲究借景，就像计成在《园冶》中所说，要善于利用周围的自然景观来丰富园林的景色。”这段话中，导游采用了（ ）的方式。","options":[{"key":"A","text":"明引"},{"key":"B","text":"暗引"},{"key":"C","text":"意引"},{"key":"D","text":"语引"}],"answer":"C","keys":["C"],"explanation":"意引：不直接引用原文，而是间接地引述原意，同样具备一定的说服力。例如在介绍苏州园林的造景手法时，可以这样讲：“古代造园家很讲究借景，就像计成在《园冶》中所说，要善于利用周围的自然景观来丰富园林的景色。”通过意引的方式，将专业的园林理论融入讲解中，使游客能够更容易地理解苏州园林独特的造景魅力。","type":"单选题"},{"number":107,"stem":"导游从白帝城讲起，这里因刘备托孤闻名；接着进入瞿塘峡，谈其险峻雄伟、山水壮阔；再进入巫峡，着重讲解巫山十二峰及云雾缭绕的迷人景色；然后是西陵峡，介绍其滩多水急的地理特点；最后抵达终点宜昌。导游在这段讲解中采用了（ ）。","options":[{"key":"A","text":"分段讲解法"},{"key":"B","text":"突出重点法"},{"key":"C","text":"触景生情法"},{"key":"D","text":"妙用数字法"}],"answer":"A","keys":["A"],"explanation":"例如，可按空间位移顺序分段讲解长江三峡，乘船自西往东游览长江三峡，导游就可将其分为五个部分来讲解。先从白帝城讲起，这里因刘备托孤闻名；接着进入瞿塘峡，谈其险峻雄伟、山水壮阔；再进入巫峡，着重讲解巫山十二峰及云雾缭绕的迷人景色；然后是西陵峡，介绍其滩多水急的地理特点；最后抵达终点宜昌，讲述其作为三峡门户的重要地位及三峡大坝等现代化建设成果。","type":"单选题"},{"number":108,"stem":"在游览故宫时，游客对建筑感兴趣，导游应重点介绍故宫的建筑物及其特征、建筑布局和建筑艺术；游客对历史感兴趣，导游应重点讲解故宫的历史沿革。这是突出重点法中的（ ）运用。","options":[{"key":"A","text":"突出独特之处"},{"key":"B","text":"突出有代表性部分"},{"key":"C","text":"突出旅游者感兴趣的内容"},{"key":"D","text":"突出“最”“第一”"}],"answer":"C","keys":["C"],"explanation":"导游应通过观察、交流，寻找旅游者普遍感兴趣的话题并展开讲解。举例：在游览故宫时，如游客对中国古代建筑感兴趣，导游应重点介绍故宫的建筑物及其特征、建筑布局和建筑艺术，并将中国古代宫殿建筑与民间建筑乃至西方国家的宫殿建筑进行比较；如果游客对中国历史尤其是明、清的历史感兴趣，导游应重点讲解故宫的历史沿革和在故宫发生的重大事件，使游客从故宫的介绍中加深对明、清历史的了解。","type":"单选题"},{"number":109,"stem":"下列选项中，导游在带领亲子团出行时把握准确的一项是（ ）。","options":[{"key":"A","text":"兼顾父母与孩子，关注父母为主"},{"key":"B","text":"涉及到费用的时候，不要提前沟通，要在当场确认"},{"key":"C","text":"提醒家长保护好孩子，导游避免过多介入"},{"key":"D","text":"具备高超的讲解技能，把握“深入浅出”的原则，多采用有情节的故事"}],"answer":"D","keys":["D"],"explanation":"兼顾父母与孩子，引导亲子互动；导游须具备高超的讲解技能，把握“深入浅出”的原则，多采用有情节的故事、启发式和提问式讲解；导游应提前与家长沟通，清晰告知收费标准，并根据实际情况，在旅游期间，与家长密切配合，密切关注孩子的动向，确保其始终处于安全环境中。","type":"单选题"},{"number":110,"stem":"我国面积单位中，1公顷等于（ ）亩。","options":[{"key":"A","text":"10"},{"key":"B","text":"15"},{"key":"C","text":"50"},{"key":"D","text":"100"}],"answer":"B","keys":["B"],"explanation":"1 公顷=100 米的平方=10000平方米；1 亩=666.67平方米，所以 1 公顷=15亩","type":"单选题"},{"number":111,"stem":"下列关于携带外币现钞出境的要求，描述正确的一项是（ ）。","options":[{"key":"A","text":"无论多少钱，如果不超过最近一次入境时申报外币现钞数额，不需申领《携带外汇出境许可证》"},{"key":"B","text":"携带金额≤等值 10000美元的，不需申领《携带证》"},{"key":"C","text":"等值 10000 美元\u003c携带金额≤等值 20000 美元的，需要向银行申领《携带证》，出境时海关凭证验放。"},{"key":"D","text":"若加盖银行印章的《携带证》累计总额超过等值 20000美元，海关不予放行"}],"answer":"A","keys":["A"],"explanation":"携带外币现钞出境，如果不超过最近一次入境时申报外币现钞数额，不需申领《携带外汇出境许可证》（以下简称《携带证》），海关会凭最近一次入境时的外币现钞申报数额记录验放。如果没有或超出最近一次入境申报外币现钞数额记录的：（1）携带金额≤ 等值 5000 美元的，不需申领《携带证》，海关予以放行。（2）等值 5000美元 ＜携带金额≤ 等值 10000 美元的，需要向银行申领《携带证》，出境时海关凭证验放。对使用多张《携带证》的，若加盖银行印章的《携带证》累计总额超过等值 10000美元，海关不予放行。","type":"单选题"},{"number":112,"stem":"若旅游者在用餐前（ ）小时以上提出换餐，导游应尽量与餐厅联系。","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"4"}],"answer":"C","keys":["C"],"explanation":"解析用餐前 3小时提出换餐的处理，尽量与餐厅联系，事先向游客讲清楚如能换妥差价由旅游者自理，询问餐厅能否提供相应服务。","type":"单选题"},{"number":113,"stem":"部分旅游者提出更换计划内的文娱活动，导游操作正确的是（ ）。","options":[{"key":"A","text":"婉转拒绝"},{"key":"B","text":"向游客承诺更换"},{"key":"C","text":"若不同路，则应为他们安排车辆，车费由旅行社承担"}],"answer":"C","keys":["C"],"explanation":"与接待社计调部门联系，尽可能调换，但不要在未联系妥当之前许诺；如接待社无法调换，要向旅游者做好耐心解释工作，并说明票已订好，不能退换，请其谅解。若决定分路参与文娱活动，两个文娱活动地点在同一线路上，应与司机商量，尽量为少数旅游者提供方便，送他们到目的地；若不同路，则应为他们安排车辆，但车费自理。","type":"单选题"},{"number":114,"stem":"为防止接待纠纷的产生，导游应（ ）。","options":[{"key":"A","text":"时刻维护旅行社利益"},{"key":"B","text":"安排活动只要按照合同即可，不需要跟游客沟通"},{"key":"C","text":"对不文明行为直接纠正或批评，避免其他游客模仿"},{"key":"D","text":"了解可能引发纠纷的矛盾诉求，帮助解决问题，必要时求助相关部门"}],"answer":"D","keys":["D"],"explanation":"解析解析 1. 严格按合同执行旅游行程：旅游合同是实施行程的依据，保障双方利益，消除纠纷；2. 提前沟通：安排活动前多与旅游者沟通，征求意见，增强参与感，避免矛盾；3. 了解旅游者诉求：了解可能引发纠纷的矛盾诉求，帮助解决问题，必要时求助相关部门；4. 合理引导旅游者行为：对不文明行为通过单独沟通、小提示等方式引导，避免直接纠正或批评。旅游者激动时先引导冷静，再沟通。","type":"单选题"},{"number":115,"stem":"当游客发生溺水事故后，导游引导游客正确自救的做法是（ ）。","options":[{"key":"A","text":"将手臂上举扑腾，尽量引起别人注意"},{"key":"B","text":"呼吸时尽量用鼻吸气、用嘴呼气，以防呛水"},{"key":"C","text":"若遇腿部抽筋，可先深吸一口气，潜入水中搬动大腿"},{"key":"D","text":"若不慎将水吸入气管内，屏气到把嘴鼻露出水面，调整呼吸"}],"answer":"D","keys":["D"],"explanation":"1. 保持镇定，节省体力溺水者不要手脚乱蹬，以节省体力，在野外还可防止水草缠绕；更不要将手臂上举扑腾，这样人会下沉得更快2. 放松身体，保持仰位落水后，溺水者应尽快踢掉鞋子，然后放松身体，尽可能保持仰位，使头部后仰露出嘴鼻部；呼吸时尽量用嘴吸气、用鼻呼气，以防呛水；吸气要深，呼气要浅，有助于身体浮在水面3. 若遇呛水，咳嗽调整若不慎在吸气时将水吸入气管内造成呛水，溺水者应保持冷静，克制住想咳嗽的感觉，屏气到把嘴鼻露出水面，然后通过咳嗽调整呼吸，待气管内的水分排出后，呼吸就能恢复正常4. 若遇抽筋，张手扳腿若遇到手指抽筋，可先将手握拳，再用力张开，反复操作，直至抽筋消除；若遇腿部抽筋，可先深吸一口气仰浮水上，用抽筋肢体对侧的手握住抽筋肢体的脚趾，再用力向身体方向拉，同时用同侧的手掌压住抽筋肢体的膝盖，帮助抽筋腿伸直，直至症状缓解","type":"单选题"},{"number":116,"stem":"依据 24 小时内的降水量划分，被定义为大暴雨的是（ ）。","options":[{"key":"A","text":"50毫米及以下"},{"key":"B","text":"50.0- 99.9毫米"},{"key":"C","text":"100- 249.9 毫米"},{"key":"D","text":"250毫米及以上"}],"answer":"C","keys":["C"],"explanation":"暴雨等级划分：依据 24 小时内降水量来划分暴雨等级，包括暴雨（50.0- 99.9 毫米）、大暴雨（100- 249.9 毫米）和特大暴雨（250 毫米及以上）。","type":"单选题"},{"number":117,"stem":"发给前往国外定居、探亲、学习，从事商务活动等非公务原因出国的中国公民的护照是（ ）。","options":[{"key":"A","text":"外交护照"},{"key":"B","text":"公务护照"},{"key":"C","text":"特区护照"},{"key":"D","text":"普通护照"}],"answer":"D","keys":["D"],"explanation":"由公安部或者公安部委托的地方公安机关，以及驻外使、领馆和驻香港、澳门公署签发，发给前往国外定居、探亲、学习、就业、旅行、从事商务活动等非公务原因出国的中国公民。","type":"单选题"},{"number":118,"stem":"短期出国的公民无法补发护照，可申请（ ）。","options":[{"key":"A","text":"身份证"},{"key":"B","text":"中华人民共和国旅行证"},{"key":"C","text":"短期出国证明"}],"answer":"B","keys":["B"],"explanation":"短期出国的公民若时间紧迫，无法补发护照，可向中国驻外使馆、领馆或外交部委托的其他机构申请中华人民共和国旅行证。","type":"单选题"},{"number":119,"stem":"东盟旅游团入境广西桂林的免签时间为（ ）。","options":[{"key":"A","text":"48小时"},{"key":"B","text":"72小时"},{"key":"C","text":"144小时"},{"key":"D","text":"240小时"}],"answer":"C","keys":["C"],"explanation":"在境内有资质旅行社组织接待下，可从桂林机场口岸免签入境出境，活动范围限于桂林市域，停留不超 144小时（6天），采取团进团出方式。","type":"单选题"},{"number":120,"stem":"游客寄往国外的中药材、中成药，总值限人民币（ ）。","options":[{"key":"A","text":"150元"},{"key":"B","text":"300元"},{"key":"C","text":"800元"},{"key":"D","text":"1000元"}],"answer":"D","keys":["D"],"explanation":"游客寄往国外的中药材、中成药，总值限人民币 1000元。","type":"单选题"},{"number":121,"stem":"中国公民出入境，每人每次携带的人民币限额为（ ）。","options":[{"key":"A","text":"5000元"},{"key":"B","text":"10000元"},{"key":"C","text":"20000元"},{"key":"D","text":"50000元"}],"answer":"C","keys":["C"],"explanation":"中国公民出入境、外国人入出境，每人每次携带的人民币限额为 20000元，携带超量人民币出入境的，应当按照国家规定向海关如实申报。","type":"单选题"},{"number":122,"stem":"无论是国内还是国际航空公司，经济舱的代码都是（ ）。","options":[{"key":"A","text":"A"},{"key":"B","text":"C"},{"key":"C","text":"F"},{"key":"D","text":"Y"}],"answer":"D","keys":["D"],"explanation":"国内或者国际经济舱代码都是 Y。","type":"单选题"},{"number":123,"stem":"承运人或代理人收到旅客有效退款申请后，应在（ ）个工作日内完成退款手续。","options":[{"key":"A","text":"3"},{"key":"B","text":"5"},{"key":"C","text":"7"},{"key":"D","text":"12"}],"answer":"C","keys":["C"],"explanation":"承运人或代理人收到旅客有效退款申请后，应在 7 个工作日内完成退款手续（不含金融机构处理时间）。","type":"单选题"},{"number":124,"stem":"外交人员乘坐火车可以免费携带物品的最大重量是（ ）。","options":[{"key":"A","text":"35千克"},{"key":"B","text":"20千克"},{"key":"C","text":"15千克"},{"key":"D","text":"10千克"}],"answer":"A","keys":["A"],"explanation":"乘坐火车每人免费携带品的重量：外交人员 ≤ 35kg","type":"单选题"},{"number":125,"stem":"为了避免发生高原反应，每天应该补水至少（ ）。","options":[{"key":"A","text":"1000毫升"},{"key":"B","text":"2000毫升"},{"key":"C","text":"4000毫升"},{"key":"D","text":"6000毫升"}],"answer":"C","keys":["C"],"explanation":"剂量：每日 4000毫升液体","type":"单选题"},{"number":126,"stem":"下列关于人民币纳入 SDR的描述，正确的一项是（ ）。","options":[{"key":"A","text":"SDR是特别提款权的英文首字母，之前由美元、英镑、欧元和卢布组成"},{"key":"B","text":"2025年 12月，国际货币基金组织宣布把人民币纳入 SDR"},{"key":"C","text":"人民币的权重由 12.28%提升至 15.96%"},{"key":"D","text":"中国加入 SDR意味着人民币真正路身于全球主要货币之列"}],"answer":"D","keys":["D"],"explanation":"2015 年 12 月 1 日，国际货币基金组织（IMF）宣布把人民币纳入 SDR，权重定为10.92% 。2022年 5月，该组织将人民币的权重提高至 12. 28% 。SDR是特别提款权的英文首字母，是国际货币基金组织创造的国际储备资产，之前由美元、英镑、欧元和日元组成。中国加入 SDR意味着人民币真正路身于全球主要货币之列，人民币作为结算货币将得到更广泛地使用，也将推动人民币成为可兑换、可自由使用的货币。","type":"单选题"},{"number":127,"stem":"下列选项中，关于铁路意外伤害保险的说法，正确的是（ ）。","options":[{"key":"A","text":"成年旅客收费 3 元，保额 50万身故伤残金+5万意外医疗"},{"key":"B","text":"未成年人收费 1 元，保额 10万身故伤残金+1万意外医疗"},{"key":"C","text":"铁路意外伤害保险属于强制保险，已经将费用算在车票中"},{"key":"D","text":"期限为持有效乘车凭证实名制登车到凭证载明到站检票出站止"}],"answer":"A","keys":["A"],"explanation":"期限起止：持有效乘车凭证实名制验证/检票进站 →凭证载明到站检票出站止·2020年 5 月 10 日起费率：成年旅客：3元 →保额 50万身故伤残金 +5 万意外医疗；未成年人：1元 →保额 20万身故伤残金 +2 万意外医疗。","type":"单选题"},{"number":128,"stem":"我国旅游饭店一共分为（ ）等级。","options":[{"key":"A","text":"2个"},{"key":"B","text":"3个"},{"key":"C","text":"4个"},{"key":"D","text":"5个"}],"answer":"D","keys":["D"],"explanation":"我国旅游饭店星级划分为一星级、二星级、三星级、四星级、五星级，其中一星级为最低，五星级为最高。","type":"单选题"},{"number":129,"stem":"关于我国离境退税的条件，描述错误的一项是（ ）。","options":[{"key":"A","text":"物品未启用/未消费"},{"key":"B","text":"同人同日同店购物 ≥ 500 元人民币"},{"key":"C","text":"购买日距离境日≤90 天"},{"key":"D","text":"物品随身或随行托运出境"}],"answer":"B","keys":["B"],"explanation":"① 同一境外旅客同一日在同一退税商店购买的退税物品金额达到 200元人民币；并且按规定取得退税申请单（凭购买退税物品的增值税普通发票向退税商店索取）等退税凭证。② 在离境口岸办理离境手续，离境前退税物品尚未启用或消费；③ 离境日距退税物品购买日不超过 90天；④ 所购退税物品由境外旅客本人随身携带或随行托运出境。⑤ 所购退税物品经海关验核并在退税申请单上签章。⑥ 在指定的退税代理机构办理退税。","type":"单选题"},{"number":130,"stem":"目前海南离岛免税政策是（ ）。","options":[{"key":"A","text":"商品总计有 30种，离岛旅客每年每人免税购物额度为 10 万人民币"},{"key":"B","text":"商品总计有 50种，离岛旅客每年每人免税购物额度为 15 万人民币"},{"key":"C","text":"商品总计有 47种，离岛旅客每年每人免税购物额度为 10 万人民币"},{"key":"D","text":"商品总计有 52种，离岛旅客每年每人免税购物额度为 15 万人民币"}],"answer":"C","keys":["C"],"explanation":"目前离岛免税商品品种总计有 47 种，离岛旅客每年每人免税购物额度为 10 万人民币，不限次数。三、多选题","type":"单选题"},{"number":131,"stem":"根据《中华人民共和国宪法》的规定，民主集中制原则的内涵体现在（ ）。","options":[{"key":"A","text":"人民与权力机关的关系"},{"key":"B","text":"权力机关与其他国家机关的关系"},{"key":"C","text":"中央与地方的关系"},{"key":"D","text":"公民与权力机关的关系"},{"key":"E","text":"人民与行政机关的关系"}],"answer":"ABC","keys":["A","B","C"],"explanation":"宪法第 3 条确立了民主集中制为国家机构的组织原则，其内涵体现在三个层面：人民与权力机关；权力机关与其他国家机关；中央与地方关系。D 错误：宪法规定的是人民（整体）与权力机关的关系，并非单个公民和权力机关的关系，不属于民主集中制三大内涵范畴。E 错误：人民与行政机关的关系，归属于权力机关和其他国家机关这一大关系之下，不是民主集中制独立划分的内涵层面","type":"多选题"},{"number":132,"stem":"下列对公民基本权利和义务的说法中，正确的是（ ）。","options":[{"key":"A","text":"任何公民都有权对国家公职人员进行批评、建议、申诉"},{"key":"B","text":"既是公民基本权利，又是公民基本义务的有受教育权和劳动权"},{"key":"C","text":"公民的休息权是以劳动权为前提的"},{"key":"D","text":"父母有抚养教育子女、成年子女有赡养扶助父母的义务"},{"key":"E","text":"计划生育是公民的基本权利"}],"answer":"BC","keys":["B","C"],"explanation":"解析对于任何国家机关和国家工作人员的违法失职行为，有向有关国家机关提出申诉、控告或者检举的权利；父母有抚养教育未成年子女的义务；计划生育是公民的基本义务。","type":"多选题"},{"number":133,"stem":"根据《旅游法》的规定，以下情形中旅行社无需承担责任的是（ ）。","options":[{"key":"A","text":"旅行社因为其地接社原因对旅游者违约"},{"key":"B","text":"旅行社因为铁路运输部门的原因而不能履行合同约定"},{"key":"C","text":"旅游者未尽其应尽的配合、协助履行义务导致违约"},{"key":"D","text":"旅游者虽在自由活动期间发生损害，但旅行社未尽到安全提示义务"},{"key":"E","text":"旅行社因为餐饮问题对旅游者违约"}],"answer":"BC","keys":["B","C"],"explanation":"因为地接社原因对旅游者违约，旅行社作为组团社需要承担责任。旅游者在自由活动期间发生损害，旅行社未尽到安全提示义务也需要承担责任；《旅游法》第 71条规定：由于地接社、履行辅助人的原因导致违约的，由组团社承担责任。所以旅行社因为饭店原因对旅游者违约需要承担责任。","type":"多选题"},{"number":134,"stem":"根据《旅游法》的规定，公益性的（ ）等，除重点文物保护单位和珍贵文物收藏单位外，应当逐步免费开放。","options":[{"key":"A","text":"纪念馆"},{"key":"B","text":"城市公园"},{"key":"C","text":"文化生态保护区"},{"key":"D","text":"博物馆"},{"key":"E","text":"风景名胜区"}],"answer":"ABD","keys":["A","B","D"],"explanation":"《旅游法》第 43条，公益性的城市公园、博物馆、纪念馆等，除重点文物保护单位和珍贵文物收藏单位外，应当逐步免费开放。","type":"多选题"},{"number":135,"stem":"根据《民法典》的规定，委托代理授权采用书面形式的，授权委托书应当载明的内容包括（ ）。","options":[{"key":"A","text":"代理人的姓名或者名称"},{"key":"B","text":"代理人签名或者盖章"},{"key":"C","text":"代理事项"},{"key":"D","text":"代理权限和期限"},{"key":"E","text":"被代理人的姓名或者名称"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"《民法典》第 165条规定，委托代理授权采用书面形式的，授权委托书应当载明代理人的姓名或者名称、代理事项、权限和期限，并由被代理人签名或者盖章。","type":"多选题"},{"number":136,"stem":"根据《民法典》的规定，以下属于侵权责任不承担责任和减免责任的情形是（ ）。","options":[{"key":"A","text":"被侵权人对损害的发生也有过错的，可以减轻或免除侵权人的责任"},{"key":"B","text":"损害是因受害人故意造成的，行为人可以相应减轻责任"},{"key":"C","text":"损害是因第三人造成的，第三人应当承担侵权责任"},{"key":"D","text":"只要因不可抗力造成他人损害的，都无须承担责任"},{"key":"E","text":"正当防卫超过必要的限度，造成不应有的损害的，正当防卫人应当承担适当的责任"}],"answer":"CE","keys":["C","E"],"explanation":"《民法典》第 1173条，被侵权人对同一损害的发生或者扩大有过错的，可以减轻侵权人的责任。第 1174条，损害是因受害人故意造成的，行为人不承担责任。《民法典》第 180条，因不可抗力不能履行民事义务的，不承担民事责任。法律另有规定的，依照其规定。","type":"多选题"},{"number":137,"stem":"某旅行社在组织旅游者赴境外旅游过程中，安排旅游者参加另行付费旅游项目，且未征得旅游者同意。对此，由旅游主管部门对直接负责该项目的导游王某，（ ）","options":[{"key":"A","text":"处 200元以上 2000元以下罚款"},{"key":"B","text":"处 2000 元以上 2 万元以下罚款"},{"key":"C","text":"并暂扣或者吊销导游证"},{"key":"D","text":"没收违法所得"},{"key":"E","text":"情节严重的，吊销导游证"}],"answer":"BCD","keys":["B","C","D"],"explanation":"《旅游法》第 35条规定，旅行社不得以不合理的低价组织旅游活动，诱骗旅游者，并通过安排购物或者另行付费旅游项目获取回扣等不正当利益。《旅游法》第 98条规定，旅行社违反本法第 35 条规定的，由旅游主管部门责令改正，没收违法所得，责令停业整顿，并处 3万元以上 30 万元以下罚款；违法所得 30 万元以上的，并处违法所得 1 倍以上 5 倍以下罚款；情节严重的，吊销旅行社业务经营许可证；对直接负责的主管人员和其他直接责任人员，没收违法所得，处 2000元以上 2万元以下罚款，并暂扣或者吊销导游证。","type":"多选题"},{"number":138,"stem":"按照《导游人员管理条例》的规定，导游人员调整或者变更接待计划的条件包括（ ）。","options":[{"key":"A","text":"在引导旅游者旅行、游览过程中"},{"key":"B","text":"遇到可能危及旅游者人身财产安全的紧急情形"},{"key":"C","text":"征得全部旅游者的书面同意"},{"key":"D","text":"立即报告旅行社"},{"key":"E","text":"由多数旅游者提出"}],"answer":"AD","keys":["A","D"],"explanation":"《导游人员管理条例》第 13条规定，导游人员在引导旅游者旅行、游览过程中，遇有可能危及旅游者人身安全的紧急情形时，经征得多数旅游者的同意，可以调整或者变更接待计划，但是应当立即报告旅行社。“遇到可能危及旅游者人身财产安全的紧急情形”是“人身安全”，应该是“征得多数旅游者的同意”，“由多数旅游者提出”错误，没有这个条件要求。","type":"多选题"},{"number":139,"stem":"依据《导游管理办法》，以下关于导游“经常执业地区”的说法正确的是（ ）。","options":[{"key":"A","text":"连续执业时间在 3个月内累计执业达到 60日"},{"key":"B","text":"导游户籍所在省级行政区域"},{"key":"C","text":"导游连续执业的县级以上行政区域"},{"key":"D","text":"导游连续执业的省级行政区域"},{"key":"E","text":"连续执业时间在 3个月内累计执业达到 30日"}],"answer":"DE","keys":["D","E"],"explanation":"经常执业地区，是指导游连续执业或者 3 个月内累计执业达到 30 日的省级行政区域。","type":"多选题"},{"number":140,"stem":"依据《治安管理处罚法》的规定，下列属于从重处罚情形的有（ ）。","options":[{"key":"A","text":"有严重后果的"},{"key":"B","text":"教唆、诱骗他人违法行为的"},{"key":"C","text":"对报案人、控告人、举报人、证人打击报复的"},{"key":"D","text":"1年以内曾受过两次以上治安管理处罚的"},{"key":"E","text":"胁迫他人违法行为的"}],"answer":"BCE","keys":["B","C","E"],"explanation":"依据第 22条，从重处罚的情形包括：有较严重后果的；教唆、胁迫、诱骗他人违法的；对报案人、控告人、举报人、证人打击报复的；1 年以内曾受过治安管理处罚的。A项错误：有较严重后果属于从重情形，而不是“严重”。B项、E 项正确：教唆、胁迫、诱骗他人违法属于从重情形。C项正确：对报案人、控告人、举报人、证人打击报复属于从重情形。D项错误，一年以内曾受过治安管理处罚即从重，并非要求两次以上。","type":"多选题"},{"number":141,"stem":"《旅游投诉处理办法》规定，投诉人可以就下列事项向旅游投诉处理机构投诉（ ）。","options":[{"key":"A","text":"认为旅游者违反合同约定的"},{"key":"B","text":"因旅游经营者的责任致使投诉人财产受到损害的"},{"key":"C","text":"因不可抗力致使旅游合同不能履行的，投诉人与被投诉人发生争议"},{"key":"D","text":"意外事故致使旅游合同不能完全履行的"},{"key":"E","text":"旅游经营者损害团队中其他旅游者合法权益的"}],"answer":"BC","keys":["B","C"],"explanation":"《旅游投诉处理办法》第 8 条规定了旅游投诉案件的受理范围和除外情形。投诉人可以就下列事项向旅游投诉处理机构投诉：① 认为旅游经营者违反合同约定的。②因旅游经营者的责任致使投诉人人身、财产受到损害的。③因不可抗力、意外事故致使旅游合同不能履行或者不能完全履行，投诉人与被投诉人发生争议的。④其他损害旅游者合法权益的。“认为旅游者违反合同约定的”错误，旅游投诉的主体只能是“旅游者”。“意外事故致使旅游合同不能完全履行的”错误，投诉人与被投诉人发生争议，投诉人才可以就此进行投诉。“旅游经营者损害团队中其他旅游者合法权益的”错误，此情形与投诉人没有直接利害关系，所以不符合旅游投诉的实质要件。","type":"多选题"},{"number":142,"stem":"国家鼓励（ ）为人民政府应对突发事件工作提供物资、资金、技术支持和捐赠。","options":[{"key":"A","text":"公民"},{"key":"B","text":"法人"},{"key":"C","text":"自然人"},{"key":"D","text":"其他组织"},{"key":"E","text":"行政机关"}],"answer":"ABD","keys":["A","B","D"],"explanation":"《突发事件应对法》第 34条规定，国家鼓励公民、法人和其他组织为人民政府应对突发事件工作提供物资、资金、技术支持和捐赠。","type":"多选题"},{"number":143,"stem":"《中华人民共和国食品安全法》规定，县级以上人民政府食品安全监督管理部门接到食品安全事故报告后，应当立即会同相关部门进行调查处理，并（ ），以防止或者减轻社会危害。","options":[{"key":"A","text":"做好信息发布工作，依法对食品安全事故及其处理情况进行发布，并对可能产生的危害加以解释、说明"},{"key":"B","text":"对确认属于被污染的食品及其原料，责令食品生产经营者依法召回或停止经营"},{"key":"C","text":"封存被污染食品的相关环境，并责令立即进行清理消杀"},{"key":"D","text":"开展应急救援工作，组织救治因食品安全事故导致人身伤害的人员"},{"key":"E","text":"封存可能导致食品安全事故的食品及其原料，并立即进行检验"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"“封存被污染食品的相关环境，并责令立即进行清理消杀”错误，根据常识，当有食品安全事故发生的时候，相关环境是不能进行清理消杀的，因为有可能涉及到调查取证，故错误。正确的表达是“封存被污染的食品相关产品，并责令进行清洗消毒”。其余选项描述正确。","type":"多选题"},{"number":144,"stem":"党的十九届六中全会强调的“两个确立”及其重大意义包括（ ）。","options":[{"key":"A","text":"确立习近平同志党中央的核心、全党的核心地位"},{"key":"B","text":"确立习近平新时代中国特色社会主义思想的指导地位"},{"key":"C","text":"反映全党全军全国各族人民共同心愿"},{"key":"D","text":"对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义"},{"key":"E","text":"主要适用于当前发展阶段"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"答案选 ABCD。“两个确立”是确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想 的指导地位；其反映全党全军全国各族人民共同心愿，对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义。E 项“两个确立”是关乎民族复兴长远进程的重大政治论断，不仅适用于当前阶段，更是新征程上必须长期坚持的根本政治保证。","type":"多选题"},{"number":145,"stem":"2023年提出的“七个着力”还包括（ ）。","options":[{"key":"A","text":"着力续中华文脉、推动中华优秀传统文化创造性转化和创新性发展"},{"key":"B","text":"着力推动文化事业和文化产业繁荣发展"},{"key":"C","text":"着力加强国际传播能力建设、促进文明交流互鉴"},{"key":"D","text":"着力以文化产业为主、文化事业为辅的发展方向"},{"key":"E","text":"着力提升对外叙事能力，促进单向文化输出"}],"answer":"ABC","keys":["A","B","C"],"explanation":"答案选 ABC。“七个着力”还包括着力续中华文脉、推动中华优秀传统文化创造性转化和创新性发展，着力推动文化事业和文化产业繁荣发展，着力加强国际传播能力建设、促进文明交流互鉴。D项文化事业和文化产业是统筹推进、协调发展的关系。文化事业重在公共公益保障，文化产业重在市场发展，不存在“产业为主、事业为辅”的定位。E项我国国际传播坚持文明交流互鉴、双向平等对话，不是单向文化输出。","type":"多选题"},{"number":146,"stem":"《英烈法》规定，以侮辱、诽谤或者其他方式侵害英雄烈士的姓名、肖像、名誉、荣誉，损害社会公共利益的，（ ）","options":[{"key":"A","text":"承担部分民事责任"},{"key":"B","text":"依法承担民事责任"},{"key":"C","text":"依法承担行政责任"},{"key":"D","text":"构成犯罪的，依法追究刑事责任"},{"key":"E","text":"构成违反治安管理行为的，由公安机关依法给予治安管理处罚"}],"answer":"BDE","keys":["B","D","E"],"explanation":"《英烈法》第 26条规定，以侮辱、诽谤或者其他方式侵害英雄烈士的姓名、肖像、名誉、荣誉，损害社会公共利益的，依法承担民事责任；构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。","type":"多选题"},{"number":147,"stem":"根据《中华人民共和国宪法》的规定，关于非公有制经济，下列说法正确的有（ ）。","options":[{"key":"A","text":"是社会主义市场经济的重要组成部分"},{"key":"B","text":"国家保护其合法权益"},{"key":"C","text":"国家保障非公有制经济的巩固和发展"},{"key":"D","text":"是社会主义市场经济的重要补充部分"},{"key":"E","text":"国家鼓励、支持和引导其发展，并依法实行监督和管理"}],"answer":"ABE","keys":["A","B","E"],"explanation":"在法律规定范围内的个体经济、私营经济等非公有制经济，是社会主义市场经济的重要组成部分。国家保护其合法权益，鼓励、支持和引导其发展，并依法实行监督和管理（第11条）。C 错误：“保障巩固和发展”是宪法针对国有经济的规定，不适用于非公有制经济。D 错误：“重要补充部分”，现行宪法表述为重要组成部分，该说法错误。","type":"多选题"},{"number":148,"stem":"导游工作的客观情况复杂，表现在（ ）。","options":[{"key":"A","text":"服务对象复杂"},{"key":"B","text":"与计调关系复杂"},{"key":"C","text":"人际关系复杂"},{"key":"D","text":"旅游者需求多样"},{"key":"E","text":"文化信息复杂"}],"answer":"ACD","keys":["A","C","D"],"explanation":"客观情况复杂：服务对象复杂；人际关系复杂；旅游者需求多样。","type":"多选题"},{"number":149,"stem":"导游人员的基本职责包括（ ）。","options":[{"key":"A","text":"接受导游任务，引导文明旅游"},{"key":"B","text":"进行导游讲解，传播中国文化"},{"key":"C","text":"安排旅游事宜，保护旅游者安全"},{"key":"D","text":"反映意见要求，安排相关活动"},{"key":"E","text":"旅游市场调研，开拓市场"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"解析接受导游任务，引导文明旅游；进行导游讲解，传播中国文化；安排旅游事宜，保护旅游者安全；反映意见要求，安排相关活动；解答旅游者问询，处理相关问题。","type":"多选题"},{"number":150,"stem":"地陪导游在游客入住饭店时提供的服务包括（ ）。","options":[{"key":"A","text":"为游客办理入住手续，并分房"},{"key":"B","text":"宣布当天或次日活动的安排"},{"key":"C","text":"提醒游客入住注意事项"},{"key":"D","text":"安排叫早服务"},{"key":"E","text":"告知全陪处理客人在店问题"}],"answer":"BCD","keys":["B","C","D"],"explanation":"解析协助办理入住手续；宣布当天或次日活动的安排；照顾旅游团入住（提醒游客入住注意事项、处理入住问题）；安排叫早服务；离店服务。","type":"多选题"},{"number":151,"stem":"地陪带领游客参观游览出发前的服务内容有（ ）。","options":[{"key":"A","text":"提前准备好导游旗、行程单，开启导游执业相关应用软件"},{"key":"B","text":"按时提前到达集合地点"},{"key":"C","text":"核实、清点人数，若有客人未到，请全陪妥善安排好客人"},{"key":"D","text":"告知旅游者将贵重物品留在房间，不要随身携带以免丢失"},{"key":"E","text":"地陪站在车门一侧，为每一位游客提供帮助"}],"answer":"AB","keys":["A","B"],"explanation":"地陪应提前准备好导游旗，携带手机（电子导游证）、行程单及必要票证，佩戴导游身份标识，并开启导游执业相关应用软件；地陪应提前 10分钟到达约定集合点；若发现有旅游者未到，应向入境领队、全陪或其他旅游者了解情况，及时查找；告知旅游者不要将贵重物品留在房间；旅游者按约定时间集合，核实、清点人数后，地陪站在车门一侧，热情招呼旅游者上车，为老弱病残者提供必要帮助。","type":"多选题"},{"number":152,"stem":"旅游者参加旅游合同约定的文化娱乐活动时，地陪应（ ）。","options":[{"key":"A","text":"陪同前往并简要介绍文化娱乐活动内容和特点"},{"key":"B","text":"按时组织旅游者入场，倡导旅游者文明参与活动"},{"key":"C","text":"告知旅游者活动结束后的集合时间和地点"},{"key":"D","text":"节目开始后，导游要悄然离场，不要影响游客观看"},{"key":"E","text":"活动结束时提醒旅游者不要遗留物品并有序退场"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"（1）陪同介绍：陪同前往并简要介绍文化娱乐活动内容和特点；（2）组织入场与倡导文明：按时组织旅游者入场，倡导旅游者文明参与活动（3）告知集合信息：告知旅游者活动结束后的集合时间和地点；（4）安全提醒与防范：提醒旅游者在文化娱乐活动场所注意人身和财物安全，并采取必要的防范措施；（5）结束提醒与退场：活动结束时提醒旅游者不要遗留物品并有序退场。","type":"多选题"},{"number":153,"stem":"全陪的联络工作和桥梁作用主要体现在（ ）。","options":[{"key":"A","text":"建立联络渠道，做好各站的联络工作"},{"key":"B","text":"做好商家和游客之间的桥梁作用"},{"key":"C","text":"做好领队与地陪、旅游者与地陪之间的联络、协调工作"},{"key":"D","text":"做好旅游行程特别是上下站之间的联络工作"},{"key":"E","text":"做好商家与商家之间的联络工作"}],"answer":"ACD","keys":["A","C","D"],"explanation":"（1）建立联络渠道：全陪应做好各站的联络工作，架起沟通的桥梁；（2）协调各方关系：做好领队与地陪、旅游者与地陪之间的联络、协调工作；（3）确保行程衔接：做好旅游行程各站间，特别是上下站之间的联络工作。","type":"多选题"},{"number":154,"stem":"针对不文明行为的处理，导游应该（ ）。","options":[{"key":"A","text":"因无心之过出现礼仪规范不协调的行为，应及时提醒和劝阻"},{"key":"B","text":"如果游客不礼貌，必要时导游代替游客道歉"},{"key":"C","text":"对于从事违法或违反社会公德活动的游客，不听劝阻、不能制止的，导游与其解除旅游合同"},{"key":"D","text":"对于从事违法活动的游客，尽量劝阻"},{"key":"E","text":"对于从事违法活动的游客后果严重的，领队应主动向相关执法机关报告"}],"answer":"AE","keys":["A","E"],"explanation":"（1）对于游客因无心之过而与旅游目的地风俗禁忌、礼仪规范不协调的行为，应及时提醒和劝阻，必要时协助游客赔礼道歉。（2）对于从事违法或违反社会公德活动的游客，或从事严重影响其他游客权益的活动，不听劝阻、不能制止的，根据旅行社的指示，导游领队可代表旅行社与其解除旅游合同。（3）对于从事违法活动的游客，不听劝阻、无法制止，后果严重的，导游领队应主动向相关执法、管理机关报告，寻求帮助，依法处理。","type":"多选题"},{"number":155,"stem":"导游合理搭配活动内容，具体包括（ ）。","options":[{"key":"A","text":"游览节奏宜“松紧相间，先紧后松”"},{"key":"B","text":"游览时间宜“重点突出，面面俱到”"},{"key":"C","text":"游览顺序宜“先远后近，先高后低”"},{"key":"D","text":"游览旅程宜“多多益善，能走尽走”"},{"key":"E","text":"游览安排宜“快旅慢游，精彩在后”"}],"answer":"ACE","keys":["A","C","E"],"explanation":"游览节奏宜“松紧相间，先紧后松”；游览顺序宜“先远后近，先高后低”；游览安排宜“快旅慢游，精彩在后”。","type":"多选题"},{"number":156,"stem":"若允许游客全天不随团活动，导游应做的工作是（ ）。","options":[{"key":"A","text":"告知游客需增加的各项费用自理，原费用不退"},{"key":"B","text":"告诉旅游者用餐的时间和地点，以便其归队时用餐"},{"key":"C","text":"提醒其注意安全，保护好自己的财物"},{"key":"D","text":"提醒旅游者带上饭店卡片备用"},{"key":"E","text":"报告组团社，让其备案"}],"answer":"BCD","keys":["B","C","D"],"explanation":"1. 要求全天或某一景点不随团活动不影响整个旅游团活动时，可以满足并提供必要帮助。按照以下程序处理：提前说明如果不随团活动，需增加的各项费用自理，原费用根据旅游合同约定处理。告诉旅游者用餐的时间和地点，以便其归队时用餐。提醒其注意安全，保护好自己的财物。提醒旅游者带上饭店卡片（卡片上有中英文的饭店名称、地址、电话）备用。用中英文写张便条，注明旅游者要去的地点的名称、地址及简短对话，以备不时之需。","type":"多选题"},{"number":157,"stem":"面对旅游者的个别要求，导游处理的方法有（ ）。","options":[{"key":"A","text":"要求合理且导游经努力能予以满足，导游尽量满足"},{"key":"B","text":"要求合理，但因主客观因素限制，导游无法满足，耐心解释"},{"key":"C","text":"要求不合理，但导游通过努力仍可满足，导游想办法争取满足"},{"key":"D","text":"要求不合理且导游无法满足，婉转拒绝"},{"key":"E","text":"无论如何都应该尽全力满足"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"导游实际带团时，旅游者的个别要求大致可分为四种类型：一是要求合理且导游经努力能予以满足；二是要求合理，但因主客观因素限制，导游无法满足；三是要求不合理，但导游通过努力仍可满足；四是要求不合理且导游无法满足。","type":"多选题"},{"number":158,"stem":"关于导游漏接的主观原因，描述正确的选项有（ ）。","options":[{"key":"A","text":"导游自身问题，如看错接站（机）时间"},{"key":"B","text":"旅行社接待计划书写有误，未能及时通知导游"},{"key":"C","text":"导游举牌接站的地方选择不当"},{"key":"D","text":"导游前往接站（机）途中，遭遇突发交通事故而迟到"},{"key":"E","text":"旅游者乘坐的国际航班提前抵达"}],"answer":"ABC","keys":["A","B","C"],"explanation":"主观原因：导游自身问题，如看错接站（机）时间、弄错接站（机）地点等；旅行社接待计划书写有误，或旅行社上下站之间沟通不畅，未能及时将旅游者临时变动后的交通方式或抵达时间告知导游。旅游者自身问题，如自行出票的旅游者中途更换航班，却未及时通知旅行社或导游自己临时变更后的新班次信息等。客观原因：导游前往接站（机）途中，遭遇突发交通事故而迟到。旅游者乘坐的国际航班提前抵达等。","type":"多选题"},{"number":159,"stem":"为防止毒虫伤人，导游可提醒旅游者（ ）。","options":[{"key":"A","text":"有户外活动时，穿长袖长裤，必要时扣紧袖口、领口"},{"key":"B","text":"避免穿深色与花色衣物，以免吸引昆虫"},{"key":"C","text":"建议旅游者携带防蚊液、驱虫剂、中药香囊"},{"key":"D","text":"多喷洒香水等芳香剂，驱赶蚊虫"},{"key":"E","text":"草木茂盛、大树下、草地、水边易聚集毒虫，应尽量避免逗留"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"1. 做好穿着防护有户外活动时，提前告知旅游者穿长袖长裤，必要时扣紧袖口、领口，扎紧裤脚，戴帽子。避免穿深色与花色衣物，以免吸引昆虫；2. 配备驱虫用品建议旅游者携带防蚊液、驱虫剂、中药香囊等，皮肤暴露部位提前喷洒防蚊液。切忌喷洒香水等芳香剂，以免昆虫误以为是花朵；3. 避免进入毒虫聚集的环境毒虫常栖息于阴暗、闷热、潮湿处，草木茂盛、大树下、草地、水边易聚集毒虫，应尽量避免逗留。","type":"多选题"},{"number":160,"stem":"面对旅游者出现病危的情况，导游应该（ ）。","options":[{"key":"A","text":"地陪亲自到医院全程记录抢救过程，全陪安抚客人"},{"key":"B","text":"导游应立即拨打急救电话求救"},{"key":"C","text":"协同患者亲友送病人至医疗急救机构/医院抢救"},{"key":"D","text":"及时报告旅行社"},{"key":"E","text":"如患者系外籍人士，通知外交部"}],"answer":"BCD","keys":["B","C","D"],"explanation":"① 旅游者病危时，导游应立即拨打急救电话求救； ② 或协同患者亲友送病人至医疗急救机构/医院抢救； ③ 或请医生前来抢救； ④ 及时报告旅行社；涉外处理：如患者系外籍人士，协助患者通知其所在国驻华使领馆；团队安排：妥善安排好其他旅游者的活动，地陪导游带团继续游览。","type":"多选题"},{"number":161,"stem":"当旅游者发生食物中毒时，导游应（ ）。","options":[{"key":"A","text":"立即与当地医疗机构联系救助事宜，并设法催吐"},{"key":"B","text":"对食品进行留样，取得旅游者呕吐物的样本"},{"key":"C","text":"将旅游者送至医疗急救机构或医院进行救治，并保留相关证据"},{"key":"D","text":"尽量不要向旅行社通报，设法独立处理好"},{"key":"E","text":"如果在境外，领队及时向中国驻当地使领馆报告"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"1. 境内食物中毒1. 境内食物中毒(1) 立即与当地医疗机构联系救助事宜，并设法催吐，同时对食品进行留样，取得旅游者呕吐物的样本；(2) 将旅游者送至医疗急救机构或医院进行救治，并保留相关证据；(3) 及时向旅行社及其所在地旅游主管部门、发生地旅游主管部门和疾病预防控制机构报告，反映旅游者食物中毒的详细情况。2. 境外食物中毒（1）领队应及时向中国驻当地使领馆或政府派出机构报告。（2）在其指导下，全力做好食物中毒应对处置工作。","type":"多选题"},{"number":162,"stem":"旅游期间在室内出现雷电时，操作正确的是（ ）。","options":[{"key":"A","text":"可以使用太阳能淋浴器洗澡"},{"key":"B","text":"应立即关好门窗，减少外部雷电电磁辐射的侵入"},{"key":"C","text":"使用笔记本电脑工作，不连电线可以上网"},{"key":"D","text":"切勿站在阳台上，不要触摸金属管线，暂停给电器充电"},{"key":"E","text":"尽量远离金属门窗、幕墙以及有电源插座的地方"}],"answer":"BDE","keys":["B","D","E"],"explanation":"当雷电出现时，如果身处室内，应立即关好门窗，减少外部雷电电磁辐射的侵入。尽量远离金属门窗、幕墙以及有电源插座的地方，避免接触导电物体。切勿站在阳台上，不要触摸金属管线，暂停给电器充电，避免使用电视机、电脑等电子设备，同时停止使用太阳能热水器等，防止雷电通过相关设施造成伤害。","type":"多选题"},{"number":163,"stem":"地震时室内避险的正确做法是（ ）。","options":[{"key":"A","text":"躲在楼梯过道或电梯内"},{"key":"B","text":"躲在立柱旁边、内承重墙的墙根、墙角等位置相对较为安全"},{"key":"C","text":"优先躲避在坚固家具旁或下方"},{"key":"D","text":"若条件允许，用湿毛巾等捂住口鼻，防止吸入灰尘等有害物质"},{"key":"E","text":"蹲下，蜷曲身体，降低身体重心，将额头置于膝盖间"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"坚固家具旁或下方：如坚固的柜台、桌椅、书桌等旁边或下面；利用建筑结构优势：小开间区域（如卫生间、储藏室等）、立柱旁边、内承重墙的墙根、墙角等位置相对较为安全；基本站姿：蹲下，蜷曲身体，降低身体重心，将额头置于膝盖间，双手紧扣置于颈后，保护头部和颈部关键部位；若条件允许，用湿毛巾等捂住口鼻，防止吸入灰尘等有害物质，避免呼吸道受刺激或堵塞。","type":"多选题"},{"number":164,"stem":"下列情形中，铁路运输企业可以拒绝运输的有（ ）。","options":[{"key":"A","text":"拒付补票款或加收票款"},{"key":"B","text":"拒绝安全检查"},{"key":"C","text":"需依法实施传染病隔离管理"},{"key":"D","text":"100岁的老人"},{"key":"E","text":"重病的患者"}],"answer":"ABC","keys":["A","B","C"],"explanation":"有下列情形之一的，铁路运输企业可以拒绝运输：① 拒付补票款或加收票款； ② 拒绝安全检查； ③ 购票后拒绝身份核验或票证信息不符；④ 需依法实施传染病隔离管理； ⑤ 扰乱秩序、精神障碍或醉酒危及安全； ⑥ 法律法规规定的其他情形。","type":"多选题"},{"number":165,"stem":"在研学活动中我们应该执行的规范有（ ）。","options":[{"key":"A","text":"上下车时清点人数"},{"key":"B","text":"活动后规定地点按时集中"},{"key":"C","text":"晚间尽量避免巡查、夜查，影响学生休息"},{"key":"D","text":"督促供方做好食物留样"},{"key":"E","text":"将安全知识融入讲解"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"上下车时清点人数；活动后规定地点按时集中；督促供方做好食物留样；将安全知识融入讲解；按制度开展巡查、夜查。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD五/LDD押题第5卷（科目一二）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD五/LDD押题第5卷（科目一二）-试卷.pdf"},{"name":"科目三四","questions":[{"number":1,"stem":"北京中轴线北端为永定门，南端为北京鼓楼、钟楼。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“北端为北京鼓楼、钟楼，南端为永定门”。北京中轴线北端为北京鼓楼、钟楼，南端为永定门，纵贯北京老城，全长 7.8公里。","type":"判断题"},{"number":2,"stem":"山西运城垣曲县发现的距今 4500 万年的灵长类动物化石命名为“世纪曙猿”，这一发现把类人猿出现的时间向前推进了 1000 万年。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。山西运城垣曲县发现过距今 4500万年的灵长类动物化石，命名为“世纪睡猫”，这一发现把类人猿出现的时间向前推进了 1000万年。","type":"判断题"},{"number":3,"stem":"天津杨柳青年画产生于明代崇祯年间，与山东潍坊年画并称“南桃北柳”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“与苏州桃花坞年画并称‘南桃北柳’”。杨柳青年画产生于中国明代崇祯年间，与苏州桃花坞年画并称“南桃北柳”。","type":"判断题"},{"number":4,"stem":"辽宁千山山城开创了高句丽民族构筑山城的先河。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“五女山山城”。五女山山城彰显了高句丽民族杰出的智慧和高超的建筑技艺，开了高句丽民族构筑山城的先河。","type":"判断题"},{"number":5,"stem":"山东潍坊是中国著名的风筝产地，明代就已在民间出现扎风筝的艺人，现在潍坊已成为国际风筝节的固定举办地。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。山东潍坊是中国著名的风筝产地，明代就已在民间出现扎风筝的艺人。赢得了“风筝艺术，潍坊第一”的美誉。现在潍坊已成为国际风筝节的固定举办地。","type":"判断题"},{"number":6,"stem":"北宋定都开封，当时开封人口超 100万，为全国第一大城市，其商业贸易额占全国之半。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。北宋定都开封，当时开封人口超 100万，为全国第一大城市，其商业贸易额占全国之半。","type":"判断题"},{"number":7,"stem":"江苏自古便是闻名遐迩的“水乡”和“鱼米之乡”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。江苏自古便是闻名遐迩的“水乡”和“鱼米之乡”。","type":"判断题"},{"number":8,"stem":"公元 264 年，西晋把南海、苍梧、郁林、高梁 4 个郡从交州划出，另设广州，广州由此得名。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“东吴”。吴景帝永安七年（264年），东吴把南海、苍梧、郁林、高梁 4个郡（今两广大部）从交州划出，另设广州，州治番禺，广州由此得名。","type":"判断题"},{"number":9,"stem":"抗日战争时期，国民政府定重庆为陪都，重庆同华盛顿、巴黎、莫斯科一道被列为世界反法西斯四大指挥中心。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“伦敦”。抗日战争时期，国民政府定重庆为陪都，重庆同华盛顿、伦敦、莫斯科一道被列为世界反法西斯四大指挥中心。","type":"判断题"},{"number":10,"stem":"先后共有 13个政权在陕西建都。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“14 个政权”。先后共有西周、秦、汉、西晋、隋、唐等 14 个政权在陕西建都。","type":"判断题"},{"number":11,"stem":"1936 年 10月，中国工农红军三大主力在甘肃会宁大会师，标志着二万五千里长征胜利结束。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1936年 10 月，中国工农红军三大主力在甘肃会宁大会师，标志着二万五千里长征胜利结束。","type":"判断题"},{"number":12,"stem":"1662年 2 月，郑成功迫使西班牙总督签字投降，从西班牙殖民者手中收复了台湾。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“荷兰总督换一”。1662 年 2 月，郑成功迫使荷兰总督换一签字投降。郑成功从荷兰殖民者手中收复了中国领土台湾。郑成功因此被誉为民族英雄，在台湾亦被尊为“开台圣王”。","type":"判断题"},{"number":13,"stem":"福建九市一区全部获评国家森林城市，是全国最绿的省份。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。福建九市一区全部获评国家森林城市，森林覆盖率 65.85%，连续 47年保持全国第一，是全国最绿的省份。","type":"判断题"},{"number":14,"stem":"2025年盘州至兴义高铁建成通车，贵州成为西南地区首个“市市通高铁”的省份。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2025 年盘州至兴义高铁建成通车，贵州成为西南地区首个“市市通高铁”的省份。","type":"判断题"},{"number":15,"stem":"川藏铁路从成都到拉萨，线路三起三落，累计爬升高度达 1.4万米。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“八起八落”。从成都到拉萨，线路八起八落，累计爬升高度达1.4万米，川藏铁路被称为世界上最难建的铁路。","type":"判断题"},{"number":16,"stem":"内蒙古呼伦贝尔的根河市曾有-58℃的记录，被称为“中国寒极”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“中国冷极”。东部林区最低气温一般低于-50℃，呼伦贝尔的根河市曾有-58℃的记录，被称为“中国冷极”。","type":"判断题"},{"number":17,"stem":"中华苏维埃共和国临时中央政府设在井冈山，故井冈山又有“红都”之称。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“瑞金”。中华苏维埃共和国临时中央政府设在瑞金，故瑞金有“红都”之称。","type":"判断题"},{"number":18,"stem":"黄山县国际乡村旅游度假区是全国首个以“村”字号命名的国家级旅游度假区。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。黄山县国际乡村旅游度假区是全国首个以“村”字号命名的国家级旅游度假区。","type":"判断题"},{"number":19,"stem":"抗日战争时期，云南军民 9 个月时间抢修完成的滇缅公路一度成为当时国内唯一通往国外的战略运输通道。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。抗日战争时期，云南军民 9 个月时间抢修完成全长 959.4 公里的滇缅公路，创造了近代中国公路建筑史奇迹，滇缅公路一度成为当时国内唯一通往国外的战略运输通道。","type":"判断题"},{"number":20,"stem":"《格萨尔》史诗是世界上唯一一部至今还在不断创作的“活着的史诗”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。《格萨尔》史诗是世界上唯一一部至今还在不断创作的“活着的史诗”，格萨尔文化的特性、多样性、活态性特征在国内外享有极高的声誉。","type":"判断题"},{"number":21,"stem":"1949年中国人民政治协商会议第一届全体会议选举毛泽东为中央人民政府主席。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1949 年 9 月 21~30 日，中国人民政治协商会议第一届全体会议在北平隆重举行，大会通过起临时宪法作用的《中国人民政治协商会议共同纲领》，选举毛泽东为中央人民政府主席。","type":"判断题"},{"number":22,"stem":"安史之乱是唐朝由盛到衰的转折点，安史之乱后唐朝出现藩镇割据、宦官专权、农民起义三大痼疾。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。安史之乱是唐朝由盛到衰的转折点，安史之乱后唐朝出现藩镇割据、宦官专权、农民起义三大痼疾，直到公元 907年被节度使朱温取代。","type":"判断题"},{"number":23,"stem":"禅宗奉菩提达摩为初祖，五祖弘忍是禅宗的实际创始人。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。唐时，五祖弘忍创建“东山法门”，为禅宗的实际创始人。","type":"判断题"},{"number":24,"stem":"禅让制传承到大禹时，被其子夏启破坏，改为王位世袭制。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。禅让制传承到大禹时，被其子夏启破坏，改为王位世袭制。","type":"判断题"},{"number":25,"stem":"1926 年 7 月 9 日，国民革命军在广州誓师北伐，直接目标是打击受帝国主义支持的北洋军阀。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1926 年 7 月 9 日，国民革命军在广州誓师北伐，直接目标是打击受帝国主义支持的北洋军阀。","type":"判断题"},{"number":26,"stem":"指南针在南宋时称为“罗盘”，用于导航。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。战国时使用“司南”。北宋时出现人工磁化制造的指南针，科学家沈括还发现了地磁偏角现象。南宋时出现导航用指南针，称为“罗盘”。","type":"判断题"},{"number":27,"stem":"宋元时期，珠算开始在中国广泛使用。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。宋元时期，珠算开始在中国广泛使用。","type":"判断题"},{"number":28,"stem":"加拿大素有“枫叶之国”的美誉，枫树是加拿大的国树。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。加拿大素有“枫叶之国”的美誉。枫树是加拿大的国树，也是加拿大民族的象征。","type":"判断题"},{"number":29,"stem":"认为“民为贵，社稷次之，君为轻”的思想家是孔子。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“民为贵，社稷次之，君为轻”是孟子（不是孔子）的主张。","type":"判断题"},{"number":30,"stem":"钟馗原是岁暮时张挂的门神，清代成为端午之神。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。钟馗原是岁暮时张挂的门神，清代成为端午之神。节日期间主要有赛龙舟、吃粽子、挂钟馗像、挂香袋、饮雄黄酒、插菖蒲、采药等活动，或煮水沐身以祛暑避邪。","type":"判断题"},{"number":31,"stem":"官式建筑中重檐歇山顶规格最高，如故宫太和殿。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，官式建筑中规格最高的是重檐庑殿顶（不是重檐歇山顶）。庑殿顶又有单檐和重檐之分，官式建筑中重檐庑殿顶规格最高，如故宫太和殿。","type":"判断题"},{"number":32,"stem":"社指谷物神，稷指土地神，社稷成为国家的象征。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，社指土地神，稷指谷物神（不是社指谷物神、稷指土地神）。社稷因此成为国家的象征。","type":"判断题"},{"number":33,"stem":"伊斯兰教中人数最多的派别是什叶派。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，伊斯兰教中人数最多的派别是逊尼派（不是什叶派）。逊尼派是伊斯兰教中人数最多的一派，中国穆斯林大多属于逊尼派。","type":"判断题"},{"number":34,"stem":"对联最基本的特点是平仄相谐。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，字句相等（不是平仄相谐）是对联最基本的特点。无论是寥寥几个字的短联，还是成百上千字的长联，其上下联皆必须字相对，句也相对，字句相等。这是对联最基本的特点。","type":"判断题"},{"number":35,"stem":"1937 年 7 月 7 日的卢沟桥事变，是中国人民抗日战争的起点，揭开了世界反法西斯战争的序幕。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，中国人民抗日战争的起点是九一八事变（不是卢沟桥事变），揭开了世界反法西斯战争的序幕。中国人民在白山黑水间的奋起抵抗，成为中国人民抗日战争的起点，同时揭开了世界反法西斯战争的序幕。","type":"判断题"},{"number":36,"stem":"别号是古代文人为自己取的雅号，如北宋苏轼号“东坡居士”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。别号是古代文人为自己取的雅号，如东晋道士葛洪号“抱朴子”，陶潜号“五柳先生”，北宋苏轼号“东坡居士”。","type":"判断题"},{"number":37,"stem":"李大钊是在中国举起十月革命旗帜的第一人，是中国最早的马克思主义传播者。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。李大钊是在中国举起十月革命旗帜的第一人，是中国最早的马克思主义传播者。","type":"判断题"},{"number":38,"stem":"古人用十天干与十二地支相配计年，每 60 年一个轮回，称一个“二甲”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，每 60 年一个轮回称一个“甲子”（不是“二甲”）。计年时每 60年一个轮回，称一个“甲子”或“花甲”。","type":"判断题"},{"number":39,"stem":"屈原是春秋时期楚国人，是我国第一位伟大的诗人。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，屈原是战国时期楚国（不是春秋时期）诗人。屈原是我国第一位伟大的诗人，他在楚地民歌的基础上汲取了中原文化而创造出楚辞，创作出《离骚》《九歌》《九章》《天问》等作品。","type":"判断题"},{"number":40,"stem":"每个月的初一叫望，最后一天叫晦，中间十五（大月十六）那天叫朔。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，每个月的初一叫朔（不是望），中间十五（大月十六）那天叫望（不是朔）。二、单选题","type":"判断题"},{"number":41,"stem":"设计库容量 43 亿立方米，是华北地区最大的水库，也是北京最重要的地表饮用水水源地的是（）。","options":[{"key":"A","text":"官厅水库"},{"key":"B","text":"怀柔水库"},{"key":"C","text":"十三陵水库"},{"key":"D","text":"密云水库"}],"answer":"D","keys":["D"],"explanation":"密云区建有密云水库，设计库容量 43亿立方米，是华北地区最大的水库，也是北京最重要的地表饮用水水源地。A 项官厅水库位于河北怀来，C 项十三陵水库、B 项怀柔水库均非华北地区最大的水库，故不选。","type":"单选题"},{"number":42,"stem":"山西素有“中国古代建筑艺术博物馆”的美称，全国保存完好的宋、金以前的地面古建筑物（）以上在山西境内。","options":[{"key":"A","text":"50%"},{"key":"B","text":"60%"},{"key":"C","text":"80%"},{"key":"D","text":"70%"}],"answer":"D","keys":["D"],"explanation":"山西素有“中国古代建筑艺术博物馆”的美称，全国保存完好的宋、金以前的地面古建筑物 70%以上在山西境内，其数量之多和历史价值、艺术价值之高居全国首位。","type":"单选题"},{"number":43,"stem":"下列艺术形式中，不属于辽宁极具民间特色的艺术形式的是（）。","options":[{"key":"A","text":"二人转"},{"key":"B","text":"辽剧"},{"key":"C","text":"海城高跷秧歌"},{"key":"D","text":"安塞腰鼓"}],"answer":"D","keys":["D"],"explanation":"辽宁极具民间特色的艺术形式有二人转、辽剧、海城高跷秧歌等。安塞腰鼓是陕西省著名的汉族民俗活动，不属于辽宁极具民间特色的艺术形式。","type":"单选题"},{"number":44,"stem":"全国普通话标准音采集的核心区域是河北承德（）。","options":[{"key":"A","text":"平山县"},{"key":"B","text":"滦平县"},{"key":"C","text":"遵化市"},{"key":"D","text":"易县"}],"answer":"B","keys":["B"],"explanation":"滦平县为全国普通话标准音采集的核心区域。A 项平山县以革命圣地西柏坡著称，C项遵化市、D 项易县均与普通话标准音采集无关，故不选。","type":"单选题"},{"number":45,"stem":"1954年被周恩来总理亲自命名为“杂技之乡”的是河北（）。","options":[{"key":"A","text":"沧州吴桥"},{"key":"B","text":"衡水饶阳"},{"key":"C","text":"保定白沟"},{"key":"D","text":"廊坊三河"}],"answer":"A","keys":["A"],"explanation":"吴桥是我国杂技艺术的发祥地之一，被称作杂技艺术的摇篮，1954 年吴桥被周恩来总理亲自命名为“杂技之乡”。B 项饶阳、C项白沟、D 项三河均非“杂技之乡”，故不选。","type":"单选题"},{"number":46,"stem":"现有有效药品批
