准文号 13634个、总数位列全国第一的中药材产区是（）。","options":[{"key":"A","text":"武陵山区"},{"key":"B","text":"长白山区"},{"key":"C","text":"大小兴安岭"},{"key":"D","text":"秦巴山区"}],"answer":"B","keys":["B"],"explanation":"吉林省长白山区现有有效药品批准文号 13634个，总数位列全国第一。","type":"单选题"},{"number":47,"stem":"长春—满洲里—德国（简称“长满欧”）国际货运班列终点到达德国的（）。","options":[{"key":"A","text":"杜伊斯堡"},{"key":"B","text":"施瓦茨海德"},{"key":"C","text":"汉堡"},{"key":"D","text":"慕尼黑"}],"answer":"B","keys":["B"],"explanation":"长春—满洲里—德国（简称“长满欧”）国际货运班列终点到达德国的施瓦茨海德，全程约 9800 公里。是国内运行的所有国际班列中，途经国家最少、运行时间最短、基础运行成本最低的班列。A 项杜伊斯堡、C 项汉堡、D 项慕尼黑均为德国城市，但不是“长满欧”班列的终点站，故不选。","type":"单选题"},{"number":48,"stem":"高 468米，与左右两侧的南浦大桥、杨浦大桥一起形成“双龙戏珠”之势的是（）。","options":[{"key":"A","text":"上海中心大厦"},{"key":"B","text":"东方明珠广播电视塔"},{"key":"C","text":"金茂大厦"},{"key":"D","text":"上海环球金融中心"}],"answer":"B","keys":["B"],"explanation":"东方明珠广播电视塔高 468米，塔身由 11个大小不一的球形结构组成，借鉴了“大珠小珠落玉盘”的诗意意境，它和左右两侧的南浦大桥、杨浦大桥一起，形成双龙戏珠之势。A 项上海中心大厦、C 项金茂大厦、D 项上海环球金融中心均为上海高层地标建筑，但与南浦大桥、杨浦大桥构成“双龙戏珠”的是东方明珠广播电视塔，故不选。","type":"单选题"},{"number":49,"stem":"江苏 1667 年因江南省东西分置而建省，得名于（）之首字。","options":[{"key":"A","text":"江宁府与苏州府"},{"key":"B","text":"江宁府与镇江府"},{"key":"C","text":"苏州府与常州府"},{"key":"D","text":"徐州府与扬州府"}],"answer":"A","keys":["A"],"explanation":"1667年，因江南省东西分置而建省，得名于“江宁府”与“苏州府”之首字。B 项镇江府、C 项常州府、D 项徐州府均非江苏得名来源，故不选。","type":"单选题"},{"number":50,"stem":"浙江海域面积 26万平方千米，是全国岛屿最多的省份，其中为中国第四大岛的是（）。","options":[{"key":"A","text":"海南岛"},{"key":"B","text":"崇明岛"},{"key":"C","text":"舟山岛"},{"key":"D","text":"平潭岛"}],"answer":"C","keys":["C"],"explanation":"浙江海域面积 26万平方千米，是全国岛屿最多的省份。其中面积 502.65平方千米的舟山岛为中国第四大岛。A项海南岛为海南省第一大岛，B 项崇明岛是中国第三大岛、位于上海，D 项平潭岛位于福建，均非中国第四大岛，故不选。","type":"单选题"},{"number":51,"stem":"20 世纪 60年代开发的（）是我国最大的油田，也是世界上为数不多的特大型陆相砂岩油田之一。","options":[{"key":"A","text":"克拉玛依油田"},{"key":"B","text":"胜利油田"},{"key":"C","text":"大庆油田"},{"key":"D","text":"辽河油田"}],"answer":"C","keys":["C"],"explanation":"20世纪 60年代开发的大庆油田是我国最大的油田，也是世界上为数不多的特大型陆相砂岩油田之一，目前已成为我国最大的石油生产基地。","type":"单选题"},{"number":52,"stem":"将驯鹿定为吉祥物、每年 6 月 18 日为共同节日的“愚宾节”是（）的传统节日。","options":[{"key":"A","text":"鄂伦春族"},{"key":"B","text":"达斡尔族"},{"key":"C","text":"赫哲族"},{"key":"D","text":"鄂温克族"}],"answer":"D","keys":["D"],"explanation":"愚宾节是鄂温克族重要的传统节日，每年 6 月 18日为鄂温克族的共同节日“瑟宾节”，将驯鹿定为吉祥物。A 项鄂伦春族有古伦木省节，B 项达斡尔族参与五大连池药泉会，C 项赫哲族以捕鱼为生，均与“瑟宾节”不符，故不选。","type":"单选题"},{"number":53,"stem":"因作《聊斋志异》获誉“世界短篇小说之王”的山东文学家是（）。","options":[{"key":"A","text":"吴承恩"},{"key":"B","text":"罗贯中"},{"key":"C","text":"蒲松龄"},{"key":"D","text":"施耐庵"}],"answer":"C","keys":["C"],"explanation":"蒲松龄因作《聊斋志异》获誉“世界短篇小说之王”。A 项吴承恩为《西游记》作者，B项罗贯中为《三国演义》作者，D 项施耐庵为《水浒传》作者，均与《聊斋志异》无关，故不选。","type":"单选题"},{"number":54,"stem":"“四面荷花三面柳，一城山色半城湖”描绘的是素有“泉城”之称的山东（）。","options":[{"key":"A","text":"青岛"},{"key":"B","text":"济南"},{"key":"C","text":"烟台"},{"key":"D","text":"威海"}],"answer":"B","keys":["B"],"explanation":"山东省省会济南素有“泉城”之称，“家家泉水，户户垂杨”“四面荷花三面柳，一城山色半城湖”的美景名扬四海。A 项青岛以啤酒和海滨风光著称，C 项烟台被称为“人间仙境”，D项威海是甲午海战之地，均非“泉城”，故不选。","type":"单选题"},{"number":55,"stem":"福建水系密布，河流众多，全长 577 千米、是中国东南沿海地区流域面积最大的河流是（）。","options":[{"key":"A","text":"九龙江"},{"key":"B","text":"晋江"},{"key":"C","text":"闽江"},{"key":"D","text":"汀江"}],"answer":"C","keys":["C"],"explanation":"福建水系密布，河流众多，闽江为全省最大河流，全长 577 千米，流域面积 60992平方千米，是中国东南沿海地区流域面积最大的河流。A 项九龙江、B 项晋江、D 项汀江均为福建河流，但非全省最大河流，故不选。","type":"单选题"},{"number":56,"stem":"简称“黄”或“徽”，古称新安、歙州、徽州，已有 2200余年建城史的是安徽省的（）。","options":[{"key":"A","text":"黄山市"},{"key":"B","text":"安庆市"},{"key":"C","text":"宣城市"},{"key":"D","text":"池州市"}],"answer":"A","keys":["A"],"explanation":"黄山市简称“黄”或“徽”，古称新安、歙州、徽州，已经有 2200 余年建城史。B 项安庆为“安徽”得名来源之一，C 项宣城、D 项池州均非古称新安、歙州、徽州的城市，故不选。","type":"单选题"},{"number":57,"stem":"我国跨经度最广的省级行政区是（）。","options":[{"key":"A","text":"新疆维吾尔自治区"},{"key":"B","text":"甘肃省"},{"key":"C","text":"内蒙古自治区"},{"key":"D","text":"西藏自治区"}],"answer":"C","keys":["C"],"explanation":"内蒙古面积约 118.3万平方千米，约占全国总面积的八分之一，居全国第 3位，是我国跨经度最广的省级行政区。A 项新疆是我国面积最大的省级行政单位，B 项甘肃、D 项西藏均不是跨经度最广的省级行政区，故不选。","type":"单选题"},{"number":58,"stem":"（）是客家先民中原南迁的第一站，是目前海内外最大的客家聚居地，世称“客家摇篮”。","options":[{"key":"A","text":"闽西"},{"key":"B","text":"粤东"},{"key":"C","text":"赣南"},{"key":"D","text":"桂南"}],"answer":"C","keys":["C"],"explanation":"赣州是客家先民中原南迁的第一站，是客家民系的发祥地和客家人的主要聚居地之一，赣州市的客家人口占 95%以上，赣南是目前海内外最大的客家聚居地，世称“客家摇篮”。A项闽西、B 项粤东、D项桂南均为客家人聚居区域，但海内外最大的客家聚居地是赣南，故不选。","type":"单选题"},{"number":59,"stem":"素有“河山拱戴，形胜甲于天下”之誉的河南城市是（）。","options":[{"key":"A","text":"开封"},{"key":"B","text":"安阳"},{"key":"C","text":"郑州"},{"key":"D","text":"洛阳"}],"answer":"D","keys":["D"],"explanation":"洛阳山川环抱、五水绕城，素有“河山拱戴，形胜甲于天下”之誉。A项开封为北宋都城，C 项郑州为全国首个“米”字形高铁枢纽城市，B 项安阳以殷墟著称，均非“河山拱戴，形胜甲于天下”所指城市，故不选。","type":"单选题"},{"number":60,"stem":"有“京剧之母”美誉，是武汉代表性剧种的是（）。","options":[{"key":"A","text":"汉剧"},{"key":"B","text":"楚剧"},{"key":"C","text":"花鼓戏"},{"key":"D","text":"黄梅戏"}],"answer":"A","keys":["A"],"explanation":"武汉文化具有浓郁的楚文化特色，是“高山流水遇知音”故事的发生地，其汉剧有“京剧之母”的美誉。B 项楚剧、C 项花鼓戏均为湖北地方剧种，D 项黄梅戏发源于湖北黄梅、发展壮大于安徽安庆，但有“京剧之母”美誉的是汉剧，故不选。","type":"单选题"},{"number":61,"stem":"“三湘四水”是湖南的又一称谓，其中“四水”指（）。","options":[{"key":"A","text":"湘江、资江、沅江、澧水"},{"key":"B","text":"湘江、资江、沅江、潇水"},{"key":"C","text":"潇水、蒸水、沅水、澧水"},{"key":"D","text":"湘江、漓水、资江、沅江"}],"answer":"A","keys":["A"],"explanation":"“四水”指湘江、资江、沅江和澧水。B 项潇水、C项蒸水均为湘江支流，属“三湘”得名来源，D 项漓水位于广西，均不属于“四水”，故不选。","type":"单选题"},{"number":62,"stem":"别称“羊城”“疆城”“花城”，被称为中国的“南大门”的是广东省的（）。","options":[{"key":"A","text":"汕头"},{"key":"B","text":"深圳"},{"key":"C","text":"珠海"},{"key":"D","text":"广州"}],"answer":"D","keys":["D"],"explanation":"广州别称“羊城”“穗城”“花城”，是中国的“南大门”。B 项深圳别称“鹏城”，C项珠海、A项汕头均为经济特区，均非“羊城”“穗城”“花城”，故不选。","type":"单选题"},{"number":63,"stem":"1972年发现于广西北流市六靖镇、被誉为“铜鼓之王”的是（）。","options":[{"key":"A","text":"万家坝铜鼓"},{"key":"B","text":"汉代云雷纹大铜鼓"},{"key":"C","text":"翔鹭纹铜鼓"},{"key":"D","text":"冷水冲铜鼓"}],"answer":"B","keys":["B"],"explanation":"1972 年，发现于广西北流市六靖镇的汉代云雷纹大铜鼓，被誉为“铜鼓之王”。A 项万家坝铜鼓出土于云南楚雄，C 项翔鹭纹铜鼓出土于广西贵港但非“铜鼓之王”，D 项冷水冲铜鼓出土于广西藤县，故不选。","type":"单选题"},{"number":64,"stem":"被称为“海参之王”，最长可达 1.2米的海南省特有海珍是（）。","options":[{"key":"A","text":"刺参"},{"key":"B","text":"光参"},{"key":"C","text":"梅花参"},{"key":"D","text":"绿刺参"}],"answer":"C","keys":["C"],"explanation":"梅花参是海南省特有的海珍，主要在南海诸岛海域出产。海参为“海产八珍”之首，尤以梅花参最为珍贵。梅花参最长可达 1.2米，重 12~13 千克，故称“海参之王”。A 项刺参、B项光参、D 项绿刺参均非海南省特有的“海参之王”，故不选。","type":"单选题"},{"number":65,"stem":"下列美食中，不属于海南四大名菜的是（）。","options":[{"key":"A","text":"文昌鸡"},{"key":"B","text":"嘉积鸭"},{"key":"C","text":"白切鸡"},{"key":"D","text":"和乐蟹"}],"answer":"C","keys":["C"],"explanation":"文昌鸡、嘉积鸭、东山羊、和乐蟹是海南四大名菜，另有临高乳猪、石山塞羊、曲口海鲜和三亚三绝（梅花参、鲍鱼和鱼翅）全岛闻名。白切鸡是广东名菜，不属于海南四大名菜。","type":"单选题"},{"number":66,"stem":"被誉为“世界美食之都”的成都，其制作川菜的主要作料、有“川菜之魂”之称的是（）。","options":[{"key":"A","text":"涪陵榨菜"},{"key":"B","text":"郫县豆瓣"},{"key":"C","text":"保宁醋"},{"key":"D","text":"永川豆豉"}],"answer":"B","keys":["B"],"explanation":"成都被誉为“世界美食之都”，郫县豆瓣是制作川菜的主要作料，有“川菜之魂”之称。A项涪陵榨菜为重庆特产，C 项保宁醋、D 项永川豆豉均非“川菜之魂”，故不选。","type":"单选题"},{"number":67,"stem":"清政府下令从湖广省（湖北、湖南）和广东、福建等省大量移民四川，史称“湖广填四川”，若论城市则以湖北（）的移民最多。","options":[{"key":"A","text":"麻城"},{"key":"B","text":"孝感"},{"key":"C","text":"黄州"},{"key":"D","text":"武昌"}],"answer":"A","keys":["A"],"explanation":"清政府下令从湖广省（湖北、湖南）和广东、福建等省大量移民四川，史称“湖广填四川”。移民总数上百万，其中湖广省人数最多，广东、福建客家人次之。若论城市则湖北麻城的移民最多。","type":"单选题"},{"number":68,"stem":"汇集了唐宋两宋以来 5 万多尊摩崖石刻雕像，代表 9-13 世纪世界石窟艺术最高水平的是重庆（）。","options":[{"key":"A","text":"乐山大佛"},{"key":"B","text":"大足石刻"},{"key":"C","text":"安岳石刻"},{"key":"D","text":"潼南大佛"}],"answer":"B","keys":["B"],"explanation":"大足石刻是大足区境内石窟寺及石窟造像的总称，是集儒、释、道三教造像于一体的大型石窟造像群。大足石刻汇集了唐宋两宋以来的 5万多尊摩崖石刻雕像，代表了 9-13世纪世界石窟艺术的最高水平，是重庆最具国际影响力的文化旅游品牌。A 项乐山大佛为世界现存最高的石刻弥勒佛坐像，C 项安岳石刻、D 项潼南大佛均非集儒、释、道三教造像于一体的大型石窟造像群，故不选。","type":"单选题"},{"number":69,"stem":"考古工作者在宝鸡市扶风县和岐山县发掘到，自清代以来出土大批占卜甲骨、大盂鼎、大丰簋、毛公鼎、散氏盘等珍贵青铜器的西周初期都城遗址是（）。","options":[{"key":"A","text":"半坡遗址"},{"key":"B","text":"周原"},{"key":"C","text":"石峁遗址"},{"key":"D","text":"蓝田猿人遗址"}],"answer":"B","keys":["B"],"explanation":"考古工作者在宝鸡市扶风县和岐山县发掘到西周初期都城“周原”遗址，自清代以来这里已出土大批占卜甲骨、大盂鼎、大丰簋、毛公鼎、散氏盘等珍贵青铜器。A 项半坡遗址为新石器时代仰韶文化聚落遗址，C 项石峁遗址为龙山文化晚期城址，D 项蓝田猿人遗址为旧石器时代遗址，均非西周初期都城遗址，故不选。","type":"单选题"},{"number":70,"stem":"1983 年被国家旅游局确定为中国旅游标志的东汉青铜器铜奔马（又名马超龙雀），出土于甘肃省武威市（）。","options":[{"key":"A","text":"白塔寺"},{"key":"B","text":"天梯山"},{"key":"C","text":"雷台"},{"key":"D","text":"莫高窟"}],"answer":"C","keys":["C"],"explanation":"被视为中国古代高超铸造业象征的东汉青铜器——铜奔马（又名马超龙雀），就出土于甘肃省武威市雷台的东汉墓，1983 年被国家旅游局确定为中国旅游标志，并一直沿用至今。A 项白塔寺是西藏纳入中国版图的见证地，B项天梯山石窟被称为“石窟鼻祖”，D 项莫高窟被誉为“世界艺术宝库”，均非铜奔马出土地，故不选。","type":"单选题"},{"number":71,"stem":"为中国十大名茶之一的贵州名茶是（）。","options":[{"key":"A","text":"都匀毛尖"},{"key":"B","text":"湄潭翠芽"},{"key":"C","text":"凤冈锌硒茶"},{"key":"D","text":"雷山银球茶"}],"answer":"A","keys":["A"],"explanation":"都匀毛尖为中国十大名茶之一。B 项湄潭翠芽、C 项凤冈锌硒茶、D 项雷山银球茶均为贵州茶叶名品，但均不在中国十大名茶之列，故不选。","type":"单选题"},{"number":72,"stem":"纳西族最具特色的妇女服饰是缀以圆形花片、双肩各有一个大的、背上并列七个小的，象征披星戴月的（）。","options":[{"key":"A","text":"凤凰装"},{"key":"B","text":"查尔瓦"},{"key":"C","text":"风花雪月头饰"},{"key":"D","text":"七星披肩"}],"answer":"D","keys":["D"],"explanation":"纳西族最具特色的服饰是妇女的“七星披肩”，缀以圆形花片，双肩各有一个大的，背上并列七个小的，分别象征日、月、星辰，表示披星戴月、勤劳不息。A 项凤凰装是畲族女性传统服装，B 项查尔瓦是彝族服饰，C 项“风花雪月”的寓意体现在白族姑娘的头饰上，均非纳西族服饰，故不选。","type":"单选题"},{"number":73,"stem":"深达 5382 米，是地球上最深的峡谷的是（）。","options":[{"key":"A","text":"怒江大峡谷"},{"key":"B","text":"金沙江虎跳峡"},{"key":"C","text":"澜沧江梅里峡谷"},{"key":"D","text":"雅鲁藏布江大峡谷"}],"answer":"D","keys":["D"],"explanation":"雅鲁藏布江为西藏第一大河，也是世界上海拔最高的大河。雅鲁藏布江大峡谷深达5382米，是地球上最深的峡谷。A 项怒江大峡谷、B 项金沙江虎跳峡、C 项澜沧江梅里峡谷均非地球上最深的峡谷，故不选。","type":"单选题"},{"number":74,"stem":"一般用铜或银制、形似马蹄，为撒拉族妇女所钟爱的独特乐器是（）。","options":[{"key":"A","text":"口弦"},{"key":"B","text":"马头琴"},{"key":"C","text":"东布尔"},{"key":"D","text":"弹布尔"}],"answer":"A","keys":["A"],"explanation":"“口弦”是撒拉族的一种独特乐器，一般用铜或银制，形似马蹄，为撒拉族妇女所钟爱。B 项马头琴为蒙古族代表性乐器，C项东布尔、D 项弹布尔为哈萨克族、维吾尔族乐器，均非撒拉族妇女所钟爱的乐器，故不选。","type":"单选题"},{"number":75,"stem":"中国北方面积最大的丹霞地貌分布区，也是中国海拔最高的丹霞地貌群，位于宁夏西吉的（）。","options":[{"key":"A","text":"须弥山"},{"key":"B","text":"六盘山"},{"key":"C","text":"火石寨"},{"key":"D","text":"贺兰山"}],"answer":"C","keys":["C"],"explanation":"西吉火石寨国家地质公园的丹霞地貌，是中国北方面积最大的丹霞地貌分布区，也是中国海拔最高的丹霞地貌群。A 项须弥山以石窟著称，B 项六盘山、D 项贺兰山均非丹霞地貌分布区，故不选。","type":"单选题"},{"number":76,"stem":"截至 2025 年年底，新疆民用运输机场数量达到（）个，在全国排名第一。","options":[{"key":"A","text":"24"},{"key":"B","text":"26"},{"key":"C","text":"28"},{"key":"D","text":"30"}],"answer":"C","keys":["C"],"explanation":"航空运输方面，截至 2025年年底，新疆民用运输机场数量达到 28个，机场数量在全国排名第二，是全国覆盖面积最广、支线机场最多的机场网络。","type":"单选题"},{"number":77,"stem":"我国民族文学领域的“三大史诗”不包括（）。","options":[{"key":"A","text":"柯尔克孜族的《玛纳斯》"},{"key":"B","text":"藏族的《格萨尔》"},{"key":"C","text":"蒙古族的《江格尔》"},{"key":"D","text":"维吾尔族的《阿凡提的故事》"}],"answer":"D","keys":["D"],"explanation":"柯尔克孜族的《玛纳斯》与藏族的《格萨尔》、蒙古族的《江格尔》一起，被誉为我国民族文学领域的“三大史诗”。在寓言故事中，维吾尔族的《阿凡提的故事》闻名遐迩，具有很高的文学地位。《阿凡提的故事》是寓言故事，不属于我国民族文学领域的“三大史诗”。","type":"单选题"},{"number":78,"stem":"世界上关于台湾最早的记述，是三国时期吴人沈莹留下的（）。","options":[{"key":"A","text":"《岛夷志略》"},{"key":"B","text":"《临海水土志》"},{"key":"C","text":"《东西洋考》"},{"key":"D","text":"《使琉球录》"}],"answer":"B","keys":["B"],"explanation":"台湾有文字记载的历史可以追溯到公元 230年。三国时期吴王孙权派 1 万多名官兵到达“夷洲”（今台湾），吴人沈莹的《临海水土志》留下了世界上关于台湾最早的记述。A 项《岛夷志略》为元代汪大渊所著，C 项《东西洋考》为明代张燮所著，D 项《使琉球录》为明代陈侃所著，均非世界上关于台湾最早的记述，故不选。","type":"单选题"},{"number":79,"stem":"澳门会展业具有较高的国际知名度和竞争力，曾获评（）。","options":[{"key":"A","text":"最佳亚洲会议城市"},{"key":"B","text":"最佳亚洲会展城市"},{"key":"C","text":"最佳亚洲旅游城市"},{"key":"D","text":"最佳亚洲商务城市"}],"answer":"A","keys":["A"],"explanation":"澳门会展业也具有较高的国际知名度和竞争力，曾获评“最佳亚洲会议城市”。","type":"单选题"},{"number":80,"stem":"“三巴”是葡语（）的粤语音，大三巴牌坊因此得名。","options":[{"key":"A","text":"圣方济各"},{"key":"B","text":"圣保禄"},{"key":"C","text":"圣母玫瑰"},{"key":"D","text":"圣若瑟"}],"answer":"B","keys":["B"],"explanation":"“三巴”是葡语“圣保禄”的粤语音。大三巴牌坊为“澳门八景”之一，是澳门的象征，是圣保禄教堂正面前壁的遗址。A项圣方济各、C 项圣母玫瑰、D 项圣若瑟均非“三巴”的葡语来源，故不选。","type":"单选题"},{"number":81,"stem":"世界文化遗产“土司遗址”由（）联合申报。","options":[{"key":"A","text":"湖南、贵州、湖北"},{"key":"B","text":"湖南、重庆、贵州"},{"key":"C","text":"贵州、云南、广西"},{"key":"D","text":"湖北、重庆、湖南"}],"answer":"A","keys":["A"],"explanation":"“土司遗址”由湖南、贵州、湖北联合申报。","type":"单选题"},{"number":82,"stem":"2025年列入《非物质文化遗产优秀实践名录》的是（）保护计划。","options":[{"key":"A","text":"蒙古族长调"},{"key":"B","text":"福建木偶戏传承人培养"},{"key":"C","text":"赫哲族伊玛堪"},{"key":"D","text":"维吾尔木卡姆"}],"answer":"C","keys":["C"],"explanation":"2025年 12月，“赫哲族伊玛堪”保护计划选入优秀保护实践名册。A项蒙古族长调、D项维吾尔木卡姆为《人类非物质文化遗产代表作名录》项目，B 项福建木偶戏传承人培养计划于 2012年列入优秀实践名录，故不选。","type":"单选题"},{"number":83,"stem":"中国北方最大的佛事活动场所，寺内通高 27.21 米的金漆木雕千手千眼观世音菩萨被载入世界吉尼斯大全的是河北承德（）。","options":[{"key":"A","text":"普宁寺"},{"key":"B","text":"独乐寺"},{"key":"C","text":"隆兴寺"},{"key":"D","text":"普陀宗乘之庙"}],"answer":"A","keys":["A"],"explanation":"普宁寺是中国北方最大的佛事活动场所，寺中通高 27.21 米的金漆木雕千手千眼观世音菩萨被载入世界吉尼斯大全，极具宗教艺术魅力。B 项独乐寺位于天津蓟州，C项隆兴寺位于河北正定、有“京外名刹之首”之称，D 项普陀宗乘之庙为承德外八庙之一，均非中国北方最大的佛事活动场所，故不选。","type":"单选题"},{"number":84,"stem":"被誉为“羲皇故里”“陇上江南”，相传是伏羲、女娲诞生地的甘肃城市是（）。","options":[{"key":"A","text":"兰州市"},{"key":"B","text":"武威市"},{"key":"C","text":"天水市"},{"key":"D","text":"张掖市"}],"answer":"C","keys":["C"],"explanation":"天水被誉为“羲皇故里”“陇上江南”，拥有 8000年文明史和 2700多年建城史，相传是伏羲、女娲诞生地。","type":"单选题"},{"number":85,"stem":"早期道教“五斗米道”的创始人是（）。","options":[{"key":"A","text":"王重阳"},{"key":"B","text":"葛洪"},{"key":"C","text":"张角"},{"key":"D","text":"张陵"}],"answer":"D","keys":["D"],"explanation":"在蜀中鹤鸣山（今四川省大邑县境内），有张陵（又称张道陵、张“天师”）在传播道教，因信徒入教必须交五斗米，故名“五斗米道”。","type":"单选题"},{"number":86,"stem":"有“南半球的纽约”之称的澳大利亚第一大城市是（）。","options":[{"key":"A","text":"堪培拉"},{"key":"B","text":"布里斯班"},{"key":"C","text":"悉尼"},{"key":"D","text":"墨尔本"}],"answer":"C","keys":["C"],"explanation":"悉尼位于澳大利亚东南部，是新南威尔士州的首府，澳大利亚第一大城市，也是经济、文化、金融、航运和旅游的中心，有“南半球的纽约”之称。","type":"单选题"},{"number":87,"stem":"独具短报文通信服务功能的我国卫星导航系统是（）。","options":[{"key":"A","text":"伽利略系统"},{"key":"B","text":"GPS系统"},{"key":"C","text":"北斗卫星导航系统"},{"key":"D","text":"格洛纳斯系统"}],"answer":"C","keys":["C"],"explanation":"自主建设、独立运行、独具短报文通信服务功能的北斗卫星导航系统成为与美国全球定位系统（GPS）、俄罗斯格洛纳斯系统、欧洲伽利略系统并列的全球四大卫星导航系统之一。","type":"单选题"},{"number":88,"stem":"1928年 2 月初步形成的农村革命根据地是（）。","options":[{"key":"A","text":"赣南闽西根据地"},{"key":"B","text":"湘鄂西根据地"},{"key":"C","text":"陕甘根据地"},{"key":"D","text":"井冈山革命根据地"}],"answer":"D","keys":["D"],"explanation":"1928 年 2 月，井冈山革命根据地初步形成。毛泽东、朱德领导下的赣南闽西根据地是当时全国面积最大、力量最强的根据地，建立了苏区中央局和苏维埃中央政府，因此又称为中央根据地、中央苏区。","type":"单选题"},{"number":89,"stem":"下列属于冰川湖的是（）。","options":[{"key":"A","text":"鄱阳湖"},{"key":"B","text":"镜泊湖"},{"key":"C","text":"杭州西湖"},{"key":"D","text":"新疆喀纳斯湖"}],"answer":"D","keys":["D"],"explanation":"冰川湖：由冰川侵蚀形成的凹地积水成湖，如新疆喀纳斯湖。","type":"单选题"},{"number":90,"stem":"世界上最长、被誉为桥梁界“珠穆朗玛峰”的跨海大桥是（）。","options":[{"key":"A","text":"东海大桥"},{"key":"B","text":"杭州湾跨海大桥"},{"key":"C","text":"港珠澳大桥"},{"key":"D","text":"胶州湾跨海大桥"}],"answer":"C","keys":["C"],"explanation":"10 月 23 日，世界上最长的跨海大桥港珠澳大桥（55千米）开通仪式在广东省珠海市举行。这一超级工程集桥梁、隧道和人工岛于一体，其建设难度之大，被誉为桥梁界的“珠穆朗玛峰”。","type":"单选题"},{"number":91,"stem":"元代总结南北农业经验、绘制 200多幅农具图的农书是（）。","options":[{"key":"A","text":"《农桑辑要》"},{"key":"B","text":"《齐民要术》"},{"key":"C","text":"王祯《农书》"},{"key":"D","text":"《氾胜之书》"}],"answer":"C","keys":["C"],"explanation":"元代中期王祯著《农书》，特点是既讲北方也总结南方农业生产的经验，还绘制了 200多幅农具图，弥补了前人著作的缺陷。","type":"单选题"},{"number":92,"stem":"蝴蝶泉联“前生疑是庄周化”中的“庄周化”指的是（）。","options":[{"key":"A","text":"“庄周鼓盆”"},{"key":"B","text":"“庄周梦蝶”"},{"key":"C","text":"“庖丁解牛”"},{"key":"D","text":"“庄周贷粟”"}],"answer":"B","keys":["B"],"explanation":"蝴蝶舞翻斑，为万紫千红飞去飞来，前生疑是庄周化。","type":"单选题"},{"number":93,"stem":"关于唐三彩中的蓝色釉，下列说法正确的是（）。","options":[{"key":"A","text":"是中国最早的以钴土作彩料所呈现的釉色"},{"key":"B","text":"是唐三彩的主要釉色"},{"key":"C","text":"只在宫廷瓷器中使用"},{"key":"D","text":"以铁为主要呈色剂"}],"answer":"A","keys":["A"],"explanation":"唐三彩以黄、绿、白三色为主，但也有紫、褐、蓝等色，其中蓝色是中国最早的以钴土作彩料所呈现的釉色。","type":"单选题"},{"number":94,"stem":"中国佛教的创造阶段和鼎盛时期是（）。","options":[{"key":"A","text":"明清两代"},{"key":"B","text":"秦汉两代"},{"key":"C","text":"隋唐两代"},{"key":"D","text":"宋元两代"}],"answer":"C","keys":["C"],"explanation":"隋唐两代是汉地佛教的创造阶段和鼎盛时期。","type":"单选题"},{"number":95,"stem":"世界上最早的天文学著作是战国时期的（）。","options":[{"key":"A","text":"《授时历》"},{"key":"B","text":"《周髀算经》"},{"key":"C","text":"《梦溪笔谈》"},{"key":"D","text":"《甘石星经》"}],"answer":"D","keys":["D"],"explanation":"战国时期的《甘石星经》是世界上最早的天文学著作，记录了 800多个恒星的名字。","type":"单选题"},{"number":96,"stem":"中国人民抗日战争胜利纪念日是（）。","options":[{"key":"A","text":"8 月 15日"},{"key":"B","text":"9 月 2 日"},{"key":"C","text":"9 月 3 日"},{"key":"D","text":"9 月 9 日"}],"answer":"C","keys":["C"],"explanation":"9 月 3 日成为中国人民抗日战争胜利纪念日。","type":"单选题"},{"number":97,"stem":"南传佛教又称（）。","options":[{"key":"A","text":"上座部佛教"},{"key":"B","text":"大乘佛教"},{"key":"C","text":"密乘佛教"},{"key":"D","text":"藏传密教"}],"answer":"A","keys":["A"],"explanation":"南传佛教以小乘佛教（上座部佛教）为主。","type":"单选题"},{"number":98,"stem":"世界著名的“五一棚”大熊猫野外观测站位于（）。","options":[{"key":"A","text":"神农架自然保护区"},{"key":"B","text":"扎龙自然保护区"},{"key":"C","text":"四川卧龙自然保护区"},{"key":"D","text":"西双版纳自然保护区"}],"answer":"C","keys":["C"],"explanation":"四川卧龙自然保护区位于四川省汶川县西南部，是我国建立最早，栖息地面积最大，以保护大熊猫、小熊猫、金丝猴等珍稀动物以及高山森林生态系统为主的综合性自然保护区，是世界自然遗产“四川大熊猫栖息地”中最重要的核心保护区，有世界著名的“五一棚”大熊猫野外观测站，建有大熊猫博物馆。","type":"单选题"},{"number":99,"stem":"中国唯一的载人航天发射场是（）卫星发射中心。","options":[{"key":"A","text":"酒泉"},{"key":"B","text":"太原"},{"key":"C","text":"西昌"},{"key":"D","text":"文昌"}],"answer":"A","keys":["A"],"explanation":"酒泉卫星发射中心是我国创建最早、规模最大的综合性卫星发射中心，也是中国唯一的载人航天发射场。","type":"单选题"},{"number":100,"stem":"“华龙一号”是我国自主研发的（）。","options":[{"key":"A","text":"三代核电机组"},{"key":"B","text":"四代核电机组"},{"key":"C","text":"风电机组"},{"key":"D","text":"水电机组"}],"answer":"A","keys":["A"],"explanation":"2022 年 11 月 27 日，我国自主研发的三代核电机组“华龙一号”在福建福清核电站成功并网投入商业运行，标志着我国三代核电技术跻身世界前列，成为继美国、法国、俄罗斯等国家之后真正掌握三代核电技术的国家。","type":"单选题"},{"number":101,"stem":"确立思想建党、政治建军原则的是（）。","options":[{"key":"A","text":"八七会议"},{"key":"B","text":"古田会议"},{"key":"C","text":"遵义会议"},{"key":"D","text":"瓦窑堡会议"}],"answer":"B","keys":["B"],"explanation":"1929年 12 月，红四军党的第九次代表大会在福建上杭古田召开，即古田会议。大会根据中央九月来信精神，通过毛泽东起草的古田会议决议，确立了思想建党、政治建军的原则。","type":"单选题"},{"number":102,"stem":"谥号中“炀”字的含义是（）。","options":[{"key":"A","text":"表扬：好内远礼"},{"key":"B","text":"批评：好内远礼"},{"key":"C","text":"同情：短命"},{"key":"D","text":"同情：遭受国难"}],"answer":"B","keys":["B"],"explanation":"谥号中，一是表扬的，如“文”“武”“成”“景”。二是批评的，如“炀”（好内远礼）、“厉”（杀戮无辜），“炀”字属批评之类。","type":"单选题"},{"number":103,"stem":"商朝代表性器物后母戊鼎，是迄今世界上发现的最大的（）。","options":[{"key":"A","text":"陶器"},{"key":"B","text":"青铜器"},{"key":"C","text":"铁器"},{"key":"D","text":"玉器"}],"answer":"B","keys":["B"],"explanation":"商朝代表性器物是高达 133厘米、重达 832.84 公斤的后母戊鼎，是迄今世界上发现的最大的青铜器。","type":"单选题"},{"number":104,"stem":"建安文学的集大成者曹植，其赋代表作是（）。","options":[{"key":"A","text":"《洛神赋》"},{"key":"B","text":"《七哀诗》"},{"key":"C","text":"《登楼赋》"},{"key":"D","text":"《燕歌行》"}],"answer":"A","keys":["A"],"explanation":"曹植是建安文学的集大成者，赋代表作是《洛神赋》。","type":"单选题"},{"number":105,"stem":"世界上最大的凯旋门位于（）。","options":[{"key":"A","text":"柏林"},{"key":"B","text":"罗马"},{"key":"C","text":"伦敦"},{"key":"D","text":"巴黎"}],"answer":"D","keys":["D"],"explanation":"凯旋门位于巴黎戴高乐星形广场中央，是为纪念拿破仑在奥斯特里茨战役中击败俄奥联军而建的，于 1836年建成，是世界上最大的凯旋门。","type":"单选题"},{"number":106,"stem":"我国现存最早的一部医书是西汉（）。","options":[{"key":"A","text":"《黄帝内经》"},{"key":"B","text":"《神农本草经》"},{"key":"C","text":"《千金方》"},{"key":"D","text":"《伤寒杂病论》"}],"answer":"A","keys":["A"],"explanation":"西汉《黄帝内经》，我国现存最早的一部医书，包括《素问》和《灵枢》两部分，奠定了传统中医学理论基础。","type":"单选题"},{"number":107,"stem":"“前不见古人，后不见来者”出自陈子昂的（）。","options":[{"key":"A","text":"《感遇》"},{"key":"B","text":"《春夜别友人》"},{"key":"C","text":"《登泽州城北楼宴》"},{"key":"D","text":"《登幽州台歌》"}],"answer":"D","keys":["D"],"explanation":"陈子昂代表作《登幽州台歌》，留下“前不见古人，后不见来者”的感叹。","type":"单选题"},{"number":108,"stem":"我国独立研制的第五代隐身战机是（）。","options":[{"key":"A","text":"歼 10、歼 16"},{"key":"B","text":"歼 20、歼 35"},{"key":"C","text":"运 20、空警-500"},{"key":"D","text":"歼 15、空警-2000"}],"answer":"B","keys":["B"],"explanation":"中国独立研制了先进战机歼 10、歼 15（舰载机）、歼 16（多用途战机）和第五代隐身战机歼 20、歼 35，设计制造了运 20大型军用运输机和空警-200、空警-500、空警-2000等先进预警机，是世界上屈指可数能够自行研制五代战机和先进预警机的国家之一。","type":"单选题"},{"number":109,"stem":"按八卦布局的三清宫古建筑群被誉为“中国古代道教建筑的露天博物馆”，其所在的名山是（）。","options":[{"key":"A","text":"三清山"},{"key":"B","text":"武当山"},{"key":"C","text":"青城山"},{"key":"D","text":"龙虎山"}],"answer":"A","keys":["A"],"explanation":"三清山 1600 余年的道教文化广博精微，按八卦布局的三清宫古建筑群，被誉为“中国古代道教建筑的露天博物馆”。","type":"单选题"},{"number":110,"stem":"全民族抗战爆发后中国军队主动对日作战取得的第一个重大胜利是（）。","options":[{"key":"A","text":"台儿庄战役"},{"key":"B","text":"百团大战"},{"key":"C","text":"淞沪会战"},{"key":"D","text":"平型关大捷"}],"answer":"D","keys":["D"],"explanation":"1937年 9 月 25 日，八路军第一一五师主力在平型关伏击日军，首战告捷，这是全民族抗战爆发后中国军队主动对日作战取得的第一个重大胜利。","type":"单选题"},{"number":111,"stem":"嘉量全套量器从大到小依次为（）。","options":[{"key":"A","text":"解、升、斗、合、龠"},{"key":"B","text":"斗、解、升、合、龠"},{"key":"C","text":"解、斗、合、升、龠"},{"key":"D","text":"解、斗、升、合、龠"}],"answer":"D","keys":["D"],"explanation":"嘉量是我国古时的标准量器，全套量器从大到小依次为解、斗、升、合、龠，含有统一度量衡的意义，象征着国家的统一和强盛。","type":"单选题"},{"number":112,"stem":"中国园林最初的形式为（）。","options":[{"key":"A","text":"囿"},{"key":"B","text":"苑"},{"key":"C","text":"圃"},{"key":"D","text":"园"}],"answer":"C","keys":["C"],"explanation":"最初的形式为圃。公元前 11世纪，周文王曾建“灵圉”。","type":"单选题"},{"number":113,"stem":"英国的国花是（）。","options":[{"key":"A","text":"玫瑰"},{"key":"B","text":"香根鸢尾花"},{"key":"C","text":"雏菊"},{"key":"D","text":"樱花"}],"answer":"A","keys":["A"],"explanation":"国旗为米字旗，国花是玫瑰。","type":"单选题"},{"number":114,"stem":"明清科举会试由（）主持。","options":[{"key":"A","text":"工部"},{"key":"B","text":"礼部"},{"key":"C","text":"吏部"},{"key":"D","text":"户部"}],"answer":"B","keys":["B"],"explanation":"次年春天在京师举行，叫“会试”（又称“塞围”），由礼部主持，举人才有资格参加考试，考中者称为“贡士”。","type":"单选题"},{"number":115,"stem":"1997年，我国正式批准开展（）业务。","options":[{"key":"A","text":"边境旅游"},{"key":"B","text":"中国公民出境旅游"},{"key":"C","text":"外国人入境旅游"},{"key":"D","text":"港澳台居民内地旅游"}],"answer":"B","keys":["B"],"explanation":"1997 年，香港回归，国家旅游局召开了出境旅游工作会议，正式批准开展中国公民出境旅游业务，推动了内地与香港出入境双向市场的起步发展，使我国旅游业呈现出国内游、出境游和入境游开始同步发展的新格局。","type":"单选题"},{"number":116,"stem":"有“争气桥”之称的是（）。","options":[{"key":"A","text":"武汉长江大桥"},{"key":"B","text":"南京长江大桥"},{"key":"C","text":"钱塘江大桥"},{"key":"D","text":"港珠澳大桥"}],"answer":"B","keys":["B"],"explanation":"南京长江大桥位于鼓楼区下关和浦口区桥北之间，是长江上第一座由中国自行设计和建造的双层式铁路、公路两用桥梁，是新中国技术成就与现代化的象征，有“争气桥”之称，1968年 12月 29日通车。","type":"单选题"},{"number":117,"stem":"瓷器烧成温度必须在（）以上。","options":[{"key":"A","text":"800℃"},{"key":"B","text":"1000℃"},{"key":"C","text":"1200℃"},{"key":"D","text":"1500℃"}],"answer":"C","keys":["C"],"explanation":"瓷器是以高岭土（俗称瓷土）为原料，经 1200℃以上高温烧制而成的器物。","type":"单选题"},{"number":118,"stem":"1904年在美国芝加哥世界博览会上获得一等奖的是（）。","options":[{"key":"A","text":"景泰蓝“宝鼎炉”"},{"key":"B","text":"景德镇青花瓷"},{"key":"C","text":"龙泉青瓷"},{"key":"D","text":"（原文未提供 D 选项文字）"}],"answer":"A","keys":["A"],"explanation":"1904 年，在美国芝加哥世界博览会上，景泰蓝“宝鼎炉”获得一等奖，1915年巴拿马万国博览会上再获一等奖，自此景泰蓝在国际上声誉大振。","type":"单选题"},{"number":119,"stem":"被誉为“中国天眼”的 FAST，其主要用途是（）。","options":[{"key":"A","text":"导航定位"},{"key":"B","text":"探索宇宙的起源和演化"},{"key":"C","text":"监测地震活动"},{"key":"D","text":"预报天气变化"}],"answer":"B","keys":["B"],"explanation":"我国还在贵州省平塘县建成世界上最大、最灵敏的单口径巨型射电望远镜（FAST），主要用于探索宇宙的起源和演化。","type":"单选题"},{"number":120,"stem":"“汉兴厚葬”的典型，历时 53 年才修成的帝王陵是（）。","options":[{"key":"A","text":"秦始皇陵"},{"key":"B","text":"汉茂陵"},{"key":"C","text":"唐乾陵"},{"key":"D","text":"明孝陵"}],"answer":"B","keys":["B"],"explanation":"汉茂陵是汉武帝刘彻的陵墓，位于陕西省兴平市，是西汉帝王陵中规模最大的一座，始建于武帝即位后的第二年，历时 53 年才修成，是“汉兴厚葬”的典型。","type":"单选题"},{"number":121,"stem":"中国风筝发展的鼎盛时期是（）。","options":[{"key":"A","text":"秦汉时期"},{"key":"B","text":"唐宋时期"},{"key":"C","text":"明清时期"},{"key":"D","text":"民国时期"}],"answer":"C","keys":["C"],"explanation":"明清时期是中国风筝发展的鼎盛时期，风筝在大小、样式、扎制技术、装饰和放飞技艺上都有了超越前人的巨大进步。","type":"单选题"},{"number":122,"stem":"把铸牢中华民族共同体意识写入党章的是党的（）。","options":[{"key":"A","text":"十九大"},{"key":"B","text":"二十大"},{"key":"C","text":"十七大"},{"key":"D","text":"十八大"}],"answer":"A","keys":["A"],"explanation":"2017年，党的十九大正式提出“铸牢中华民族共同体意识”，强调加强各民族对中华文化的认同，推动共同繁荣发展，并将其写入党章。","type":"单选题"},{"number":123,"stem":"下列关于京张高铁的表述，正确的是（）。","options":[{"key":"A","text":"在世界上首次实现了时速 350 公里的自动驾驶"},{"key":"B","text":"全长 1318公里"},{"key":"C","text":"2008年开通运营"},{"key":"D","text":"是世界上第一条高速铁路"}],"answer":"A","keys":["A"],"explanation":"2019 年 12 月 30 日开通运营的京张高铁，使用我国自主研制的复兴号智能动车组，采用北斗卫星导航系统，在世界上首次实现了时速 350公里的自动驾驶。","type":"单选题"},{"number":124,"stem":"平定“三藩之乱”、统一台湾、签订《尼布楚条约》的皇帝是（）。","options":[{"key":"A","text":"顺治帝"},{"key":"B","text":"康熙帝"},{"key":"C","text":"雍正帝"},{"key":"D","text":"乾隆帝"}],"answer":"B","keys":["B"],"explanation":"康熙皇帝平定了平西王吴三桂、平南王尚可喜、靖南王耿精忠的“三藩之乱”，统一了台湾，与沙俄签订《尼布楚条约》，划定了中俄东部边界线，维护了国家主权。","type":"单选题"},{"number":125,"stem":"第一部白话新诗集《尝试集》的作者是（）。","options":[{"key":"A","text":"胡适"},{"key":"B","text":"郭沫若"},{"key":"C","text":"徐志摩"},{"key":"D","text":"闻一多"}],"answer":"A","keys":["A"],"explanation":"代表作家胡适是写白话新诗的第一人，1920 年出版了他的第一部白话新诗集《尝试集》。","type":"单选题"},{"number":126,"stem":"宫殿建筑采取严格的中轴对称的布局方式，是为了表现（）。","options":[{"key":"A","text":"军事防御的需要"},{"key":"B","text":"体现阴阳五行的观念"},{"key":"C","text":"君权受命于天和以皇权为核心的等级观念"},{"key":"D","text":"宗教教义的要求"}],"answer":"C","keys":["C"],"explanation":"为了表现君权受命于天和以皇权为核心的等级观念，宫殿建筑采取严格的中轴对称的布局方式。","type":"单选题"},{"number":127,"stem":"良渚文化主要分布在（）。","options":[{"key":"A","text":"辽河流域"},{"key":"B","text":"珠江流域"},{"key":"C","text":"黄河流域"},{"key":"D","text":"长江流域"}],"answer":"D","keys":["D"],"explanation":"良渚文化主要分布在浙江杭州市钱塘江流域和太湖流域，以余杭区最为集中，已发掘出村落、墓地、祭坛和占地达 290多万平方米的城址，标志着人类进入了文明时代。","type":"单选题"},{"number":128,"stem":"黄山三大主峰中最高的是（）。","options":[{"key":"A","text":"天都峰"},{"key":"B","text":"莲花峰"},{"key":"C","text":"玉屏峰"},{"key":"D","text":"光明顶"}],"answer":"B","keys":["B"],"explanation":"黄山主要为花岗岩山体，有大小 72 峰，莲花峰、光明顶、天都峰为黄山三大主峰，且高度均超过 1800 米，是我国东部少有的高峰，其中莲花峰最高，海拔 1864.8米。","type":"单选题"},{"number":129,"stem":"被称为“医圣”，开创用八纲辨证施治的是（）。","options":[{"key":"A","text":"李时珍"},{"key":"B","text":"华佗"},{"key":"C","text":"张仲景"},{"key":"D","text":"孙思邈"}],"answer":"C","keys":["C"],"explanation":"东汉《伤寒杂病论》，作者张仲景，人称“医圣”，开创用八纲辨证施治。","type":"单选题"},{"number":130,"stem":"2020年我国成功发射（）火星探测器，开启了对火星奥秘的探索。","options":[{"key":"A","text":"天问一号"},{"key":"B","text":"神舟十二号"},{"key":"C","text":"墨子号"},{"key":"D","text":"嫦娥五号"}],"answer":"A","keys":["A"],"explanation":"2020年我国成功发射“天问一号”火星探测器，开启了对火星奥秘的探索。三、多选题","type":"单选题"},{"number":131,"stem":"宁夏在地形上分为三大板块，包括（）。","options":[{"key":"A","text":"北部引黄灌区"},{"key":"B","text":"中部干旱带"},{"key":"C","text":"南部山区"},{"key":"D","text":"中部灌区"},{"key":"E","text":"北部山区"}],"answer":"ABC","keys":["A","B","C"],"explanation":"宁夏在地形上分为：北部引黄灌区、中部干旱带和南部山区三大板块。D 项中部为干旱带而非灌区，E 项北部为引黄灌区而非山区，故不选。","type":"多选题"},{"number":132,"stem":"下列属于阿里山五奇的有（）。","options":[{"key":"A","text":"日出"},{"key":"B","text":"云海"},{"key":"C","text":"晚霞"},{"key":"D","text":"森林"},{"key":"E","text":"高山公路"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"日出、云海、晚霞、森林与高山铁路，合称阿里山五奇。E 项应为“高山铁路”，不是“高山公路”，故不选。","type":"多选题"},{"number":133,"stem":"考古发现的河北保定满城西汉中山靖王刘胜夫妇墓，出土的稀世珍宝有（）。","options":[{"key":"A","text":"金缕玉衣"},{"key":"B","text":"长信宫灯"},{"key":"C","text":"错金铜博山炉"},{"key":"D","text":"后母戊鼎"},{"key":"E","text":"越王勾践剑"}],"answer":"ABC","keys":["A","B","C"],"explanation":"考古发现的河北保定满城西汉中山靖王刘胜夫妇墓，出土“金缕玉衣”“长信宫灯”“错金铜博山炉”等稀世珍宝，充分反映了西汉时期河北经济文化的高度发达。D 项后母戊鼎出土于河南安阳殷墟，E项越王勾践剑出土于湖北，均不属于满城汉墓出土文物，故不选。","type":"多选题"},{"number":134,"stem":"历史上海南岛有三种古称，包括（）。","options":[{"key":"A","text":"珠崖"},{"key":"B","text":"儋耳"},{"key":"C","text":"琼台"},{"key":"D","text":"琼州"},{"key":"E","text":"崖州"}],"answer":"ABC","keys":["A","B","C"],"explanation":"历史上海南岛有三种古称：珠崖、儋耳、琼台。D 项琼州、E 项崖州为海南历史政区名称，不属于海南岛的三种古称，故不选。","type":"多选题"},{"number":135,"stem":"下列河流中，属于北京境内五大水系的有（）。","options":[{"key":"A","text":"潮白河"},{"key":"B","text":"北运河"},{"key":"C","text":"大清河"},{"key":"D","text":"拒马河"},{"key":"E","text":"蓟运河"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"北京境内有永定河、潮白河、北运河、大清河和蓟运河五大水系，是北京市淡水的主要来源。D项拒马河为流经河北、北京的河流，不属于北京境内五大水系，故不选。","type":"多选题"},{"number":136,"stem":"关于福建省地理特点的说法，正确的有（）。","options":[{"key":"A","text":"依山傍海"},{"key":"B","text":"地势总体上西北高、东南低"},{"key":"C","text":"山地、丘陵面积约占全省土地总面积的 80%"},{"key":"D","text":"享有“东南山国”之称"},{"key":"E","text":"被称为“七山一水二分田”"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"福建省简称“闽”，福建的地理特点是“依山傍海”，地势总体上西北高、东南低，山地、丘陵面积约占全省土地总面积的 80%，享有“东南山国”之称，也被称为“八山一水一分田”。E 项“七山一水二分田”是浙江的说法，福建被称为“八山一水一分田”，故不选。","type":"多选题"},{"number":137,"stem":"关于山西大同云冈石窟的说法，正确的有（）。","options":[{"key":"A","text":"始建于北魏和平年间"},{"key":"B","text":"与敦煌莫高窟、洛阳龙门石窟并列为“中国三大石窟”"},{"key":"C","text":"融合了印度、中西亚的艺术元素"},{"key":"D","text":"融入了希腊、古罗马的建筑造型和装饰纹样"},{"key":"E","text":"展现了中外文化的交流与融合"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"本题说法全部正确。云冈石窟位于大同市西郊武周山南麓，依山开凿，始建于北魏和平年间，现存主要洞窟 45个，共计 1100多个小龛，大小造像 59000 余尊，与敦煌莫高窟、洛阳龙门石窟并列为“中国三大石窟”。云冈石窟的艺术风格独特而多元，它融合了印度、中西亚的艺术元素，又巧妙地融入了希腊、古罗马的建筑造型和装饰纹样，展现了中外文化的交流与融合。","type":"多选题"},{"number":138,"stem":"上海以三大先导产业为核心构建特色产业体系，这三大先导产业具体指（）。","options":[{"key":"A","text":"人工智能"},{"key":"B","text":"集成电路"},{"key":"C","text":"生物医药产业"},{"key":"D","text":"新能源汽车"},{"key":"E","text":"高端装备制造"}],"answer":"ABC","keys":["A","B","C"],"explanation":"上海的特色产业体系以三大先导产业为核心，“三大先导产业”具体指人工智能、集成电路和生物医药产业。2025年三大先导产业规模突破 2万亿元。D 项新能源汽车、E 项高端装备制造均不属于上海“三大先导产业”，故不选。","type":"多选题"},{"number":139,"stem":"长江三峡以（）而驰名。","options":[{"key":"A","text":"瞿塘雄"},{"key":"B","text":"巫峡秀"},{"key":"C","text":"西陵峡险"},{"key":"D","text":"虎跳峡险"},{"key":"E","text":"灯影峡秀"}],"answer":"ABC","keys":["A","B","C"],"explanation":"以立体画廊长江三峡最负盛名，长江三峡以瞿塘雄、巫峡秀、西陵峡险而驰名。D 项虎跳峡位于云南金沙江，E 项灯影峡为西陵峡中的一段，均与“瞿塘雄、巫峡秀、西陵峡险”的表述不符，故不选。","type":"多选题"},{"number":140,"stem":"下列景区中，属于青海省国家 5A级旅游景区的有（）。","options":[{"key":"A","text":"茶卡盐湖景区"},{"key":"B","text":"青海湖风景区"},{"key":"C","text":"塔尔寺景区"},{"key":"D","text":"互助土族故土园旅游区"},{"key":"E","text":"阿咪东索景区"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"青海省现有国家 5A级旅游景区共 4 家：青海湖风景区、西宁市塔尔寺景区、海东市互助土族故土园旅游区、海北州阿咪东索景区。茶卡盐湖景区位于海西州乌兰县，虽知名度高，但为国家 4A级旅游景区。","type":"多选题"},{"number":141,"stem":"在四川茶馆欣赏川剧，能看到川剧的三大绝技是（）。","options":[{"key":"A","text":"变脸"},{"key":"B","text":"吐火"},{"key":"C","text":"滚灯"},{"key":"D","text":"水袖"},{"key":"E","text":"跟头"}],"answer":"ABC","keys":["A","B","C"],"explanation":"四川的茶馆不仅能饮茶，还常常有川剧表演，能够欣赏到川剧“变脸”“吐火”“滚灯”三大绝技。D 项水袖、E 项跟头为戏曲表演基本功，不属于川剧“三大绝技”，故不选。","type":"多选题"},{"number":142,"stem":"关于南狮狮头的说法，正确的有（）。","options":[{"key":"A","text":"黄脸为刘备狮"},{"key":"B","text":"红脸为关公狮"},{"key":"C","text":"黑脸为张飞狮"},{"key":"D","text":"黄脸代表忠义、胜利"},{"key":"E","text":"黑脸代表泽被苍生、仁义"}],"answer":"ABC","keys":["A","B","C"],"explanation":"南狮狮头有脸谱化的特点：黄脸为刘备狮，代表泽被苍生、仁义及皇家贵气。红脸为关公狮，代表忠义、胜利。黑脸为张飞狮，代表勇猛、霸气等。D项忠义、胜利是红脸关公狮的寓意，E 项泽被苍生、仁义是黄脸刘备狮的寓意，故不选。","type":"多选题"},{"number":143,"stem":"下列少数民族中，属于甘肃特有的有（）。","options":[{"key":"A","text":"东乡族"},{"key":"B","text":"裕固族"},{"key":"C","text":"保安族"},{"key":"D","text":"撒拉族"},{"key":"E","text":"土族"}],"answer":"ABC","keys":["A","B","C"],"explanation":"东乡、裕固、保安为 3 个甘肃特有少数民族。D 项撒拉族、E 项土族主要聚居在青海，不属于甘肃特有少数民族，故不选。","type":"多选题"},{"number":144,"stem":"香港由（）以及 262个大小离岛组成。","options":[{"key":"A","text":"香港岛"},{"key":"B","text":"九龙半岛"},{"key":"C","text":"新界内陆地区"},{"key":"D","text":"大屿山"},{"key":"E","text":"鸭洲"}],"answer":"ABC","keys":["A","B","C"],"explanation":"香港由香港岛、九龙半岛、新界内陆地区以及 262个大小岛组成。D 项大屿山、E 项鸭洲均为香港的岛屿，不属于香港的三大组成部分，故不选。","type":"多选题"},{"number":145,"stem":"下列关于贵州省的说法，正确的有（）。","options":[{"key":"A","text":"贵州少数民族人口仅次于广西、云南、新疆，居全国第 4 位"},{"key":"B","text":"苗族的先祖可追溯到原始社会时代活跃于中原地区的撒尤部落"},{"key":"C","text":"贵州名酒无论数量还是质量都名列前茅，被清代诗人郑珍称赞为“酒冠黔人国”"},{"key":"D","text":"贵州是全国少数民族人口数量最多的省份"},{"key":"E","text":"贵州的天麻、石斛、杜仲等都是传统特产"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"贵州少数民族人口仅次于广西、云南、新疆，居全国第 4位。苗族是我国本土起源的一个国际性的古老少数民族，苗族的先祖可追溯到原始社会时代活跃于中原地区的苗尤部落。贵州名酒无论是数量还是质量，在国内外都名列前茅，被清代诗人郑珍称赞为“酒冠黔人国”。贵州的天麻、石斛、杜仲等都是传统特产。D 项说法错误，贵州少数民族人口仅次于广西、云南、新疆，居全国第 4位，并非全国少数民族人口数量最多的省份，故不选。","type":"多选题"},{"number":146,"stem":"下列关于中国旅游重点城市的说法，正确的有（）。","options":[{"key":"A","text":"南宁素有“中国绿城”“天下民歌眷恋的地方”等美誉"},{"key":"B","text":"杭州作为“茶都”，拥有中国茶叶博物馆和著名的龙井村"},{"key":"C","text":"兰州是独具魅力的“黄河之都”，形成了“两山对峙、大河中流”的城市风貌"},{"key":"D","text":"扬州个园被誉为中国晚清第一名园"},{"key":"E","text":"遵义素有“川黔咽喉”“黔北粮仓”之称"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"南宁素有“中国绿城”“天下民歌眷恋的地方”等美誉。作为“茶都”，杭州拥有中国茶叶博物馆和著名的龙井村。兰州是独具魅力的黄河之都。黄河穿城而过，形成了“两山对峙、大河中流”的城市风貌。遵义自古为“川黔咽喉”，素有“黔北粮仓”之称。D 项说法错误，被誉为“中国晚清第一名园”的是扬州何园，并非个园，故不选。","type":"多选题"},{"number":147,"stem":"下列属于杭帮菜传统名菜的有（）。","options":[{"key":"A","text":"西湖醋鱼"},{"key":"B","text":"龙井虾仁"},{"key":"C","text":"东坡肉"},{"key":"D","text":"白切鸡"},{"key":"E","text":"宋嫂鱼羹"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"杭帮菜为浙菜的代表菜，传统名菜有西湖醋鱼、龙井虾仁、东坡肉、宋嫂鱼羹、干炸响铃、蜜汁火方和西湖蔬菜汤等。D项白切鸡为广东名菜，不属于杭帮菜传统名菜，故不选。","type":"多选题"},{"number":148,"stem":"下列科技成就与其取得时间对应正确的有（）。","options":[{"key":"A","text":"第一颗原子弹爆炸成功——1964年"},{"key":"B","text":"第一颗氢弹空爆试验成功——1967年"},{"key":"C","text":"“东方红一号”发射成功——1970年"},{"key":"D","text":"第一颗人造卫星——1958年"},{"key":"E","text":"“华龙一号”并网商运——2022年"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"1964年 10 月 16 日成功爆炸我国第一颗原子弹。1967年 6月 17日，我国第一颗氢弹空爆试验成功。1970年 4月 24日，我国用长征一号运载火箭成功发射第一颗人造卫星“东方红一号”，成为继苏联、美国、法国、日本之后，世界第五个能独立发射人造地球卫星的国家。2022 年 11 月 27 日，我国自主研发的三代核电机组“华龙一号”在福建福清核电站成功并网投入商业运行，标志着我国三代核电技术跻身世界前列，成为继美国、法国、俄罗斯等国家之后真正掌握三代核电技术的国家。","type":"多选题"},{"number":149,"stem":"发展红色旅游的重要意义有（）。","options":[{"key":"A","text":"有利于加强和改进新时期爱国主义教育"},{"key":"B","text":"有利于带动沿海地区率先发展"},{"key":"C","text":"有利于带动革命老区经济社会的协调发展"},{"key":"D","text":"有利于弘扬民族精神"},{"key":"E","text":"有利于保护和利用革命历史文化遗产"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"发展红色旅游，对于加强革命传统教育，增强全国人民特别是青少年的爱国情感，弘扬和培育民族精神，带动革命老区经济社会协调发展，具有重要的现实意义和深远的历史意义。","type":"多选题"},{"number":150,"stem":"下列关于广西的说法，正确的有（）。","options":[{"key":"A","text":"广西之名源于宋至道三年（997 年）分广南路为广南东路和广南西路，今广西大部属广南西路"},{"key":"B","text":"壮族早年有婚后“不落夫家”的习俗，女子一般婚后两三年后才住夫家"},{"key":"C","text":"抗战时期，以“文化城”桂林为中心，抗日救亡文化运动在广西蓬勃发展，影响全国"},{"key":"D","text":"广西容县南方黑芝麻、柳州螺蛳粉、桂林辣椒酱、桂林三花酒、横县茉莉花茶、梧州龟苓膏等特色食品、饮料均已形成规模化生产、加工产业，享誉全国"},{"key":"E","text":"壮族人喜吃腌制的甜食，妇女有嚼槟榔的习俗"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"宋至道三年（997 年），分广南路为广南东路和广南西路，今广西大部属广南西路，广西之名源于此。壮族早年有婚后“不落夫家”的习俗，女子一般婚后两三年后才住夫家。抗战时期，以“文化城”桂林为中心，抗日救亡文化运动在广西蓬勃开展，影响全国。广西容县南方黑芝麻、柳州螺蛳粉、桂林辣椒酱、桂林三花酒、横县茉莉花茶、梧州龟苓膏等特色食品、饮料均已形成规模化生产、加工产业，享誉全国。E 项说法错误，壮族人喜吃腌制的酸食，并非甜食，故不选。","type":"多选题"},{"number":151,"stem":"下列属于“楷书四大家”的有（）。","options":[{"key":"A","text":"欧阳询"},{"key":"B","text":"颜真卿"},{"key":"C","text":"柳公权"},{"key":"D","text":"赵孟頫"},{"key":"E","text":"王羲之"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"唐朝欧阳询、颜真卿、柳公权与元朝赵孟頫，合称“楷书四大家”。","type":"多选题"},{"number":152,"stem":"下列关于长城的表述，正确的有（）。","options":[{"key":"A","text":"明长城东端的终点是嘉峪关"},{"key":"B","text":"汉长城规模最大，东起辽东，西迄蒲昌海"},{"key":"C","text":"秦始皇以秦、赵、燕三国北方长城为基础修缮增筑"},{"key":"D","text":"长城包括城墙、敌台、烽火台、关隘等设施"},{"key":"E","text":"春秋时楚国最早修筑长城，称“方城”"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"A 项错误，嘉峪关是明朝万里长城西端的终点，山海关是明长城东端的重要关隘。据文献记载，春秋时楚国最早修筑长城数百里，称“方城”。嘉峪关位于甘肃省嘉峪关市西南隅，因建于嘉峪山麓而得名，是明朝万里长城西端的终点，建于明洪武年间，是目前保存最完整的一座城关，有“天下第一雄关”的美名，也是丝绸之路上的重要一站。","type":"多选题"},{"number":153,"stem":"现存的著名皇家园林有（）。","options":[{"key":"A","text":"北京颐和园"},{"key":"B","text":"北海公园"},{"key":"C","text":"河北承德避暑山庄"},{"key":"D","text":"苏州拙政园"},{"key":"E","text":"上海豫园"}],"answer":"ABC","keys":["A","B","C"],"explanation":"现存著名皇家园林：北京颐和园、北海公园，河北承德避暑山庄等。现存的私家园林：北京恭王府，苏州拙政园、留园，上海豫园，绍兴沈园等。","type":"多选题"},{"number":154,"stem":"粤菜由三种风味组成，包括（）。","options":[{"key":"A","text":"广府风味"},{"key":"B","text":"客家（东江）风味"},{"key":"C","text":"潮汕风味"},{"key":"D","text":"闽南风味"},{"key":"E","text":"琼州风味"}],"answer":"ABC","keys":["A","B","C"],"explanation":"粤菜由广府（以广州菜为代表）、客家（以东江菜为代表）、潮汕（以潮州菜为代表）三种风味组成，以广府风味为代表。","type":"多选题"},{"number":155,"stem":"中国四大盆地包括（）。","options":[{"key":"A","text":"塔里木盆地"},{"key":"B","text":"准噶尔盆地"},{"key":"C","text":"吐鲁番盆地"},{"key":"D","text":"柴达木盆地"},{"key":"E","text":"四川盆地"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"中国四大盆地分别是塔里木盆地、准噶尔盆地、四川盆地和柴达木盆地。","type":"多选题"},{"number":156,"stem":"下列节日与习俗对应正确的有（）。","options":[{"key":"A","text":"重阳节：插柳、踏青"},{"key":"B","text":"端午节：赛龙舟、吃粽子、插菖蒲"},{"key":"C","text":"重阳节：登高、插茱萸、饮菊花酒"},{"key":"D","text":"元宵节：放花灯、猜灯谜"},{"key":"E","text":"清明节：扫墓、插柳、踏青"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"插柳、踏青是清明节的习俗，A 项错误。清明节又称踏青节，节期在农历三月间，即公历 4月 5日前后。清明节的习俗活动主要有扫墓、插柳、踏青、射柳、蹴鞠、放风筝、荡秋千等。重阳节的习俗主要有登高、插茱萸、饮菊花酒等，应景食品是重阳糕。元宵节之夜有放花灯、观花灯，耍社火、打太平鼓、猜灯谜、踩高跷、舞狮子、扭秧歌、唱大戏等活动，热闹非凡，故有“闹元宵”之说。","type":"多选题"},{"number":157,"stem":"法国人的礼节主要有（）。","options":[{"key":"A","text":"握手礼"},{"key":"B","text":"拥抱礼"},{"key":"C","text":"贴面礼"},{"key":"D","text":"吻手礼"},{"key":"E","text":"鞠躬礼"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"法国人的礼节主要有握手礼、拥抱礼、贴面礼和吻手礼，法国是世界上最早公开行亲吻礼的国家，也是使用亲吻礼频率最高的国家之一。","type":"多选题"},{"number":158,"stem":"下列属于李白代表作的有（）。","options":[{"key":"A","text":"《蜀道难》"},{"key":"B","text":"《春望》"},{"key":"C","text":"《行路难》"},{"key":"D","text":"《望庐山瀑布》"},{"key":"E","text":"《将进酒》"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"《春望》是杜甫作品，B 项错误。李白诗歌雄奇峭丽、豪放飘逸，凝聚着盛唐的时代精神，世人称其为“遗仙”。","type":"多选题"},{"number":159,"stem":"下列属于我国古代四大发明的有（）。","options":[{"key":"A","text":"造纸术"},{"key":"B","text":"印刷术"},{"key":"C","text":"火药"},{"key":"D","text":"指南针"},{"key":"E","text":"地动仪"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"四大发明是：造纸术、印刷术、火药、指南针。","type":"多选题"},{"number":160,"stem":"湖笔具有（）四大特点，被誉为“笔中之冠”。","options":[{"key":"A","text":"尖"},{"key":"B","text":"齐"},{"key":"C","text":"圆"},{"key":"D","text":"健"},{"key":"E","text":"柔"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"湖笔自元代以后取代了宣笔的地位，分羊毫、狼毫、紫毫、兼毫四大类，具有尖、齐、圆、健四大特点。","type":"多选题"},{"number":161,"stem":"秦统一六国后采取的措施包括（）。","options":[{"key":"A","text":"实行分封制"},{"key":"B","text":"在经济、文化上统一了度量衡、货币、文字"},{"key":"C","text":"军事上北伐匈奴并修建万里长城"},{"key":"D","text":"南征岭南并开凿灵渠"},{"key":"E","text":"政治上实行皇帝制度、三公九卿制度、郡县制度"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"A 项错误，秦统一后在地方实行郡县制度，并非分封制。公元前 221年秦始皇统一六国而建立，是中国第一个高度集权的封建专制王朝。为了维护大一统局面，秦始皇在政治上实行皇帝制度、三公九卿制度、郡县制度和思想专制制度，统一了刑律，制造了“焚书坑儒”事件。","type":"多选题"},{"number":162,"stem":"蜀绣的经典之作有（）。","options":[{"key":"A","text":"《百鸟朝凤》"},{"key":"B","text":"《蜀宫乐女演乐园》挂屏"},{"key":"C","text":"《熊猫图》座屏"},{"key":"D","text":"双面绣《猫》"},{"key":"E","text":"《芙蓉鲤鱼》巨幅作品"}],"answer":"BCE","keys":["B","C","E"],"explanation":"《百鸟朝凤》是粤绣代表作，双面绣《猫》是苏绣作品，AD 两项错误。《蜀宫乐女演乐园》挂屏、《熊猫图》座屏和陈列在北京人民大会堂四川厅的巨幅作品《芙蓉鲤鱼》都是蜀绣的经典之作。26 教材改动说明：蜀绣条目 26版整体改写——新增古称“川绣”、“蜀中之宝”及巴蜀文化背景；针法由“100种以上”及详细列举改为以晕针为核心、辅以滚针切针等；代表作调整为《熊猫图》座屏，并补充题材、色彩和线条特点；25 版“以软缎、彩丝为主要原料”等旧述不再保留。","type":"多选题"},{"number":163,"stem":"中国人民解放军战略决战的“三大战役”有（）。","options":[{"key":"A","text":"辽沈战役"},{"key":"B","text":"淮海战役"},{"key":"C","text":"平津战役"},{"key":"D","text":"渡江战役"},{"key":"E","text":"济南战役"}],"answer":"ABC","keys":["A","B","C"],"explanation":"渡江战役、济南战役不属于三大战役，DE 两项错误。1948 年 9 月 12 日至 1949 年 1月 31 日，中国人民解放军同国民党军进行战略决战，先后发动了辽沈战役、淮海战役和平津战役，史称“三大战役”。","type":"多选题"},{"number":164,"stem":"按照海岸物质组成及其形态，海岸可以分为（）。","options":[{"key":"A","text":"沙砾质海岸"},{"key":"B","text":"淤泥质海岸"},{"key":"C","text":"三角洲海岸"},{"key":"D","text":"生物海岸"},{"key":"E","text":"侵蚀海岸"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"侵蚀海岸是按海岸基本特征（海岸侵蚀地貌和海岸堆积地貌）划分的类型，E 项错误。海岸地貌按照其基本特征可以分为海岸侵蚀地貌和海岸堆积地貌，按照海岸物质组成及其形态可以分为沙砾质海岸、淤泥质海岸、三角洲海岸、生物海岸等。","type":"多选题"},{"number":165,"stem":"一般所称中国“四大名玉”包括（）。","options":[{"key":"A","text":"和田玉"},{"key":"B","text":"岫岩玉"},{"key":"C","text":"独山玉"},{"key":"D","text":"翡翠"},{"key":"E","text":"蓝田玉"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"翡翠是产于缅甸的硬玉，不属于中国“四大名玉”，D 项错误。一般所称中国“四大名玉”是指新疆的和田玉、辽宁岩县的岩玉、河南南阳的独山玉、陕西蓝田的蓝田玉。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD五/LDD押题第5卷（科目三四）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD五/LDD押题第5卷（科目三四）-试卷.pdf"}]},{"number":6,"subjects":[{"name":"科目一二","questions":[{"number":1,"stem":"根据《中华人民共和国宪法》的规定，国家的根本任务是沿着中国特色社会主义道路，集中力量进行社会主义现代化建设。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"宪法序言明确指出国家的根本任务：“国家的根本任务是，沿着中国特色社会主义道路，集中力量进行社会主义现代化建设。”","type":"判断题"},{"number":2,"stem":"《旅游法》规定，旅游者的要求履约权指旅游者有权要求旅游经营者按照约定提供产品和服务。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"《旅游法》第 9 条规定，旅游者有权要求旅游经营者按照约定提供产品和服务。故本题正确。","type":"判断题"},{"number":3,"stem":"被撤销的民事法律行为只有被撤销后才没有法律约束力。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题表述错误。《民法典》第 155条规定，无效的或者被撤销的民事法律行为自始没有法律约束力。","type":"判断题"},{"number":4,"stem":"信用修复应当通过全国文化和旅游市场信用管理系统进行。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":5,"stem":"违反治安管理行为人自愿向公安机关如实陈述自己的违法行为，承认违法事实，愿意接受处罚的，应当依法从宽处理。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"题干表述错误在“应当”。依据第 21 条（2025 年修订新增），违反治安管理行为人自愿如实陈述违法行为、承认违法事实、愿意接受处罚的，可以依法从宽处理。","type":"判断题"},{"number":6,"stem":"根据《旅游安全管理办法》的规定，旅行社组织出境旅游，应当制作安全信息卡，安全信息卡使用中文和英文填写。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应是“中文和目的地官方语言（或者英文）”。","type":"判断题"},{"number":7,"stem":"根据《安全生产法》，因生产安全事故受到损害的从业人员，在依法享有工伤保险后，无权依照有关民事法律提出赔偿要求。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"解析根据《安全生产法》第 56条规定，因生产安全事故受到损害的从业人员，除依法享有工伤保险外，依照有关民事法律尚有获得赔偿的权利的，有权提出赔偿要求。因此，该判断题的说法是错误的。","type":"判断题"},{"number":8,"stem":"根据《中华人民共和国民用航空法》的规定，托运行李发生损失的，旅客至迟应当自收到托运行李之日起 14 日内提出异议；货物发生损失的，至迟应当自收到货物之日起 7日内提出。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"第 142条，托运行李发生损失的，至迟应当自收到托运行李之日起七日内提出；货物发生损失的，至迟应当自收到货物之日起十四日内提出。题干将异议期限颠倒：托运行李损失异议期为收到托运行李之日起 7 日内，货物损失异议期为收到货物之日起 14日内，故错误。","type":"判断题"},{"number":9,"stem":"根据《风景名胜区条例》，刻划、涂污、损坏国家保护的文物、名胜古迹，仅适用本条例罚款处罚，不再适用治安管理处罚法。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"《风景名胜区条例》第四十四条：在景物、设施上刻划、涂污或者在风景名胜区内乱扔垃圾的，责令恢复原状或者采取其他补救措施，处 50元的罚款；刻划、涂污或者以其他方式故意损坏国家保护的文物、名胜古迹的，按照治安管理处罚法的有关规定予以处罚；构成犯罪的，依法追究刑事责任。刻划、涂污或者以其他方式故意损坏国家保护的文物、名胜古迹的，应按照治安管理处罚法的有关规定予以处罚，并非只适用罚款，故判断为错。","type":"判断题"},{"number":10,"stem":"珍贵文物中的孤品和易损品，禁止出境展览。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"一级文物中的孤品和易损品，禁止出境展览。可移动文物，分为珍贵文物和一般文物；珍贵文物分为一级文物、二级文物、三级文物。注意：一级文物的是珍贵文物中级别最高的。","type":"判断题"},{"number":11,"stem":"根据《出境入境管理法》的规定，弄虚作假骗取签证的，并处 5000元以上 2万元以下罚款。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《出境入境管理法》第 73条规定：“弄虚作假骗取签证、停留居留证件等出境入境证件处 2000元以上 5000元以下罚款；情节严重的，处 10以上 15 日以下拘留，并处 5000元以上 2 万元以下罚款”。因此，题干中“并处 5000元以上 2 万元以下罚款”的表述不准确，该罚款幅度仅适用于“情节严重”的情形，一般情形下应为 2000元以上 5000元以下罚款。“情节严重”通常指骗取多张证件、组织他人骗取证件、从事非法活动等行为。","type":"判断题"},{"number":12,"stem":"人民当家做主是中国特色社会主义最本质的特征，是社会主义法治最根本的保证。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证。","type":"判断题"},{"number":13,"stem":"依据习近平法治思想，坚持以人民为中心，强调法治为了国家、依靠政府、造福人民、保护人民。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"坚持以人民为中心。坚持法治为了人民、依靠人民、造福人民、保护人民。题干将“为了人民、依靠人民”偷换为“为了国家、依靠政府”，与原文表述不符，故本题错误。","type":"判断题"},{"number":14,"stem":"下半旗时，应当先将国旗升至杆顶，然后降至旗顶与杆顶之间的距离为旗杆全长的三分之一处；降下时从此处缓缓降下。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"下半旗时，应当先将国旗升至杆顶，然后降至旗顶与杆顶之间的距离为旗杆全长的三分之一处；降下时，应当先将国旗升至杆顶，然后再降下。","type":"判断题"},{"number":15,"stem":"《英雄烈士保护法》规定，对侵害英雄烈士的姓名、肖像、名誉、荣誉的行为，仅英雄烈士的近亲属可以依法向人民法院提起诉讼。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，错在“仅英雄烈士的近亲属可以依法向人民法院提起诉讼”。《英雄烈士保护法》第 25 条规定：“对侵害英雄烈士的姓名、肖像、名誉、荣誉的行为，英雄烈士的近亲属可以依法向人民法院提起诉讼。”该条款赋予近亲属直接诉讼权，便于及时维护英烈人格权益。近亲属包括配偶、子女、父母、兄弟姐妹等。若近亲属不提起诉讼，检察机关可依法提起公益诉讼（第 25 条），形成双重保障。","type":"判断题"},{"number":16,"stem":"《旅游强国建设“十五五”规划》提出，增强旅游国际吸引力影响力，要开展双多边旅游交流合作，深化与国际组织合作，健全国家旅游对外推广体系。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。增强旅游国际吸引力影响力还包括加强中国旅游品牌整体设计，深入开展“你好！中国”国家旅游形象推广。","type":"判断题"},{"number":17,"stem":"国家统计局初步核算，2025 年我国国内生产总值为 1401879 亿元，按不变价格计算比上年增长 5.0%。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2026年 1 月 19日，国家统计局发布数据：2025年全年国内生产总值 1401879亿元，按不变价格计算比上年增长 5.0%，经济社会发展主要目标任务圆满实现，“十四五”胜利收官。“十四五”期间，中国经济总量连续跨越 110 万亿元、120万亿元、130万亿元、140万亿元四个关口。","type":"判断题"},{"number":18,"stem":"2026 年 10月，党的二十届五中全会审议通过了《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“十五五”规划建议由党的二十届四中全会审议通过。2026 年 10 月，党的二十届五中全会在北京举行，审议通过《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。","type":"判断题"},{"number":19,"stem":"2026 年 5 月 24日，神舟二十三号载人飞船发射取得圆满成功，来自香港的载荷专家黎家盈是我国首位进入太空的香港籍航天员。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2026 年 5 月 24 日 23 时 08 分，神舟二十三号载人飞船在酒泉卫星发射中心发射成功，飞行乘组由朱杨柱、张志远、黎家盈组成，朱杨柱担任指令长，是我国首位担任指令长的航天飞行工程师。来自香港的黎家盈任载荷专家。黎家盈是我国第四批航天员中首位执行飞行任务的航天员、国家面向港澳地区选拔的首位女性载荷专家，也是我国首位进入太空的香港籍航天员。","type":"判断题"},{"number":20,"stem":"《中华人民共和国国家公园法》于 2025年 9 月 12 日由十四届全国人大常委会第十七次会议通过，自 2025 年 11月 1日起施行。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“2026年 1月 1日”。《中华人民共和国国家公园法》由十四届全国人大常委会第十七次会议于 2025 年 9 月 12 日通过，自 2026 年 1 月 1 日起施行，共 7章 63 条。注意区分：《中华人民共和国法治宣传教育法》同为 2025年 9 月 12日通过，但自2025年 11月 1日起施行。","type":"判断题"},{"number":21,"stem":"1892年，托马斯·库克发明了旅行支票。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":22,"stem":"1999 年，《中国公民自费出国旅游管理暂行办法》发布，开启出境旅游，确立旅行社入境、国内、出境三大业务。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"1997 年：《中国公民自费出国旅游管理暂行办法》发布，开启出境旅游，确立旅行社入境、国内、出境三大业务。","type":"判断题"},{"number":23,"stem":"申请参加导游等级考核的人员，对本人考核结果有异议的，可以自结果发布之日起 7个工作日内，通过省级文化和旅游主管部门向国务院文化和旅游主管部门提出复核申请。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"申请参加导游等级考核的人员，对本人考核结果有异议的，可以自结果发布之日起5个工作日内，通过省级文化和旅游主管部门向国务院文化和旅游主管部门提出复核申请。","type":"判断题"},{"number":24,"stem":"地陪可以根据旅游者的民族特征、衣着、组团社的徽记、人数等进行分析判断，主动迎接旅游团。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":25,"stem":"参观游览活动是旅游产品的核心，也是导游服务工作的中心环节。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":26,"stem":"旅游者坚持要求安排行程计划之外的购物活动且影响到原计划的执行时，领队应要求旅游者签订旅行社规定制式的行程变更确认单。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":27,"stem":"导游的微笑能够传达出友善之意，是一种通过表情、动作、姿态等无声方式进行语义表达和信息传递的体态语言。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":28,"stem":"如果旅行期间遭遇泥石流，要立即攀爬到最近的大树上躲避。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"若遭遇泥石流，可就近选择林木密集地带逃生，但不要攀爬到树上躲避。","type":"判断题"},{"number":29,"stem":"“太湖石，又名洞庭石、假山石，因盛产于太湖而得名，以奇特造型著称，其独特个性可提炼为四个字：‘瘦、皱、漏、透’。”这句话体现的是讲解法中的突出重点法。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"“太湖石，又名洞庭石、假山石，因盛产于太湖而得名，以奇特造型著称，其独特个性可提炼为四个字：‘瘦、皱、漏、透’。”这句话是讲解法中的画龙点睛法。","type":"判断题"},{"number":30,"stem":"针对老年游客，每天的游览项目不宜过多。尽量选择景点内具有代表性的点位参观，少而精，慢行细看，让老年人有足够的时间欣赏和休息。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":31,"stem":"导游工作临近结束时，可借用近因效应。若旅游者游玩期间有不愉快，可借此扭转消极看法；若服务顺利，则可强化效果，吸引回头客。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":32,"stem":"领队在游客和相关机构发生纠纷时，应及时处理、正确疏导，引导游客理性维权、化解矛盾。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":33,"stem":"对于特殊餐饮要求，无论是旅游合同事先约定，还是旅游者临时提出，导游都应积极想办法落实。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":34,"stem":"因不可抗力或旅游经营者已尽合理注意义务仍不能避免的事件，影响旅游行程而需要变更合同时，导游应向旅游者做好解释工作，及时将旅游者的意见反馈给旅行社，并按旅行社的安排执行。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":35,"stem":"若在徒步旅行时发生地震，应立即停止行进，就地选择开阔地带避险。迅速蹲下或坐下，降低身体重心，双手护住头部，保持身体稳定，防止因地面晃动而摔倒受伤。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":36,"stem":"被地震压埋人员务必保持心理镇定，坚定自救信念，鼓起勇气和毅力，迅速通过喊话、敲击让救援人员听到，尽快脱离险境。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"被压埋人员务必保持心理镇定，坚定自救信念，鼓起勇气和毅力。避免出现睡觉、急躁、哭喊、唱歌或盲目行动等消耗体力的行为，应合理分配体力，尽可能延长生存时间。","type":"判断题"},{"number":37,"stem":"入境人员携带外币现钞入境，超过等值 10000 美元的应当向海关书面申报。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"入境人员携带外币现钞入境，超过等值 5000美元的应当向海关书面申报。","type":"判断题"},{"number":38,"stem":"国内航班一般在离站前 30分钟关闭值机柜台。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":39,"stem":"飞机在起飞或者降落时不允许使用充电宝充电，但是飞行平稳时可以充电。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"飞行中使用限制：不得在飞行过程中使用充电宝充电；有启动开关的充电宝：飞行中应始终关闭。","type":"判断题"},{"number":40,"stem":"在中国境内，禁止外汇流通、使用、质押，禁止私自买卖外汇，禁止以任何形式进行套汇、炒汇、逃汇。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。二、单选题","type":"判断题"},{"number":41,"stem":"2026年美加墨世界杯决赛中，夺得冠军的是（）。","options":[{"key":"A","text":"阿根廷队"},{"key":"B","text":"英格兰队"},{"key":"C","text":"西班牙队"},{"key":"D","text":"法国队"}],"answer":"C","keys":["C"],"explanation":"当地时间 2026 年 7 月 19日，在美加墨世界杯决赛中，西班牙队凭借费兰·托雷斯在加时赛的进球，以 1：0 战胜卫冕冠军阿根廷队，时隔 16年第二次夺得世界杯冠军。西班牙队本届赛事仅失一球，创造世界杯冠军球队单届最少失球纪录；英格兰队在季军战中击败法国队获得季军。","type":"单选题"},{"number":42,"stem":"根据《中华人民共和国宪法》的规定，我国的根本制度是（）。","options":[{"key":"A","text":"人民代表大会制度"},{"key":"B","text":"社会主义制度"},{"key":"C","text":"民族区域自治制度"},{"key":"D","text":"基层群众自治制度"}],"answer":"B","keys":["B"],"explanation":"宪法第 1 条规定“社会主义制度是中华人民共和国的根本制度”，社会主义制度是宪法在我国制度体系中确定的最。A 项错误，人民代表大会制度是我国的根本政治制度，处于制度层级第二层；C 项错误，民族区域自治制度属于基本政治制度；D 项错误，基层群众自治制度属于基本政治制度。","type":"单选题"},{"number":43,"stem":"根据《中华人民共和国宪法》的规定，国有经济（全民所有制经济）在国民经济中的地位是（）。","options":[{"key":"A","text":"主导力量"},{"key":"B","text":"基础"},{"key":"C","text":"主体"},{"key":"D","text":"重要组成部分"}],"answer":"A","keys":["A"],"explanation":"国有经济（全民所有制）是国民经济中的主导力量，国家保障国有经济的巩固和发展（第 7 条）。B 项错误，我国经济制度的基础是生产资料的社会主义公有制，不是国有经济；C 项错误，宪法规定“公有制为主体”，是指公有制经济整体为主体，并非国有经济为主体；D 项错误，“重要组成部分”是宪法对非公有制经济的定位，国有经济的定位是国民经济的主导力量。","type":"单选题"},{"number":44,"stem":"根据《中华人民共和国宪法》的规定，行使国家立法权的机关是（）。","options":[{"key":"A","text":"全国人民代表大会及其常务委员会"},{"key":"B","text":"国务院"},{"key":"C","text":"最高人民法院"},{"key":"D","text":"地方各级人民代表大会"}],"answer":"A","keys":["A"],"explanation":"全国人民代表大会及其常务委员会行使国家立法权（第 58 条）。选项辨析：B 项错误，国务院是最高国家行政机关，可制定行政法规但不享有国家立法权；C项错误，最高人民法院是审判机关，不享有国家立法权；D 项错误，地方各级人民代表大会是地方国家权力机关，不享有国家立法权，国家立法权由全国人民代表大会及其常务委员会行使。","type":"单选题"},{"number":45,"stem":"景区、住宿经营者将其部分经营项目或者场地交由他人从事住宿、餐饮、购物、游览、娱乐、旅游交通等经营的，对实际经营者的经营行为给旅游者造成的损害（）。","options":[{"key":"A","text":"可以不承担法律责任"},{"key":"B","text":"可以承担次要责任"},{"key":"C","text":"应当承担补充责任"},{"key":"D","text":"应当承担连带责任"}],"answer":"D","keys":["D"],"explanation":"《中华人民共和国旅游法》第 54条规定，景区、住宿经营者将其部分经营项目或者场地交由他人从事住宿、餐饮、购物、游览、娱乐、旅游交通等经营的，应当对实际经营者的经营行为给旅游者造成的损害承担连带责任。","type":"单选题"},{"number":46,"stem":"旅游者王某参加某旅行社组织的旅游活动，在旅游行程结束前要求解除合同。下列关于合同解除后退款的说法中，正确的是（）。","options":[{"key":"A","text":"王某单方解除合同，无权要求旅行社退款"},{"key":"B","text":"王某有权要求旅行社退还未参加行程的所有款项"},{"key":"C","text":"组团社可以在扣除必要费用后，将余款退还给王某"},{"key":"D","text":"组团社应当在扣除必要费用后，将余款退还给王某"}],"answer":"D","keys":["D"],"explanation":"《旅游法》第 65条规定，旅游行程结束前，旅游者解除合同的，组团社应当在扣除必要的费用后，将余款退还旅游者。","type":"单选题"},{"number":47,"stem":"关于监护人的职责，下列说法正确的是（）。","options":[{"key":"A","text":"监护人可以按照自己的意愿处分被监护人的财产"},{"key":"B","text":"监护人无需考虑被监护人的真实意愿即可做出决定"},{"key":"C","text":"监护人只需在被监护人需要时履行监护职责"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 35条规定，监护人应当按照最有利于被监护人的原则履行监护职责。监护人除为维护被监护人利益外，不得处分被监护人的财产。","type":"单选题"},{"number":48,"stem":"在参观某景区时，杨某在检票口与游客孙某发生口角，随团导游及景区检票人员没有发现并及时阻止，随着争吵升级，杨某殴打孙某。下列关于对孙某侵权责任承担的表述，正确的是（）。","options":[{"key":"A","text":"杨某对孙某承担侵权责任，景区不承担责任"},{"key":"B","text":"杨某对孙某承担侵权责任，旅行社不承担责任"},{"key":"C","text":"杨某和景区对孙某承担连带赔偿责任"},{"key":"D","text":"杨某对孙某承担侵权责任，景区、旅行社承担相应的补充责任"}],"answer":"D","keys":["D"],"explanation":"法释（2010）13号第 7条第 2款规定，因第三人的行为造成旅游者人身损害、财产损失，由第三人承担责任；旅游经营者、旅游辅助服务者未尽安全保障义务，旅游者请求其承担相应补充责任的，人民法院应予支持。所以，此处杨某对孙某承担侵权责任，景区未尽到安全保障义务，需要承担对应的补充责任。如果违反安全保障义务的具体行为人是公共场所管理人或者群众性活动组织者的工作人员或者雇员，其侵权责任还是要由管理人、组织者或者雇主承担。本题中，导游未尽到安全保障义务，需要由委派他的旅行社承担替代责任。","type":"单选题"},{"number":49,"stem":"根据《民法典》的规定，当事人就迟延履行约定违约金的，违约方支付违约金后，（）履行债务。","options":[{"key":"A","text":"可以"},{"key":"B","text":"还应当"},{"key":"C","text":"无须"},{"key":"D","text":"视实际情况"}],"answer":"B","keys":["B"],"explanation":"《民法典》规定，当事人就迟延履行约定违约金的，违约方支付违约金后，还应当履行债务。","type":"单选题"},{"number":50,"stem":"根据《民法典》相关规定，侵害他人财产的，财产损失按照（）的市场价格或者其他方式计算。","options":[{"key":"A","text":"侵权人所在地"},{"key":"B","text":"侵权人主张赔偿时"},{"key":"C","text":"损失发生时"},{"key":"D","text":"侵害行为的发生地"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 1184条，侵害他人财产的，财产损失按照损失发生时的市场价格或者其他合理方式计算。","type":"单选题"},{"number":51,"stem":"根据《民法典》相关规定，以下关于用人责任的说法中正确的是（）。","options":[{"key":"A","text":"劳务派遣期间，被派遣的工作人员因执行工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵权责任"},{"key":"B","text":"用人单位的工作人员因执行工作任务造成他人损害的，由工作人员承担侵权责任"},{"key":"C","text":"个人之间形成劳务关系，提供劳务一方因劳务造成他人损害的，由提供劳务一方承担侵权责任"},{"key":"D","text":"提供劳务一方因劳务受到损害的，由接受劳务的一方承担赔偿责任"}],"answer":"A","keys":["A"],"explanation":"《民法典》第 1191条规定，用人单位的工作人员因执行工作任务造成他人损害的，由用人单位承担侵权责任。劳务派遣期间，被派遣的工作人员因执行工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵权责任；劳务派遣单位有过错的，承担相应的责任。宝典补充：《民法典》第 1192条规定，个人之间形成劳务关系，提供劳务一方因劳务造成他人损害的，由接受劳务一方承担侵权责任。提供劳务一方因劳务受到损害的，根据双方各自的过错承担相应的责任。","type":"单选题"},{"number":52,"stem":"《宪法》规定，（）是实现中国共产党领导的多党合作和政治协商制度的重要机构，是我国政治生活中发扬人民民主、联系人民群众的一种重要形式。","options":[{"key":"A","text":"全国人民代表大会"},{"key":"B","text":"中央政治局"},{"key":"C","text":"人民政协"},{"key":"D","text":"各级人民代表大会"}],"answer":"C","keys":["C"],"explanation":"人民政协是实现中国共产党领导的多党合作和政治协商制度的重要机构，是我国政治生活中发扬人民民主，联系人民群众的一种重要形式。","type":"单选题"},{"number":53,"stem":"（）是有广泛代表性的统一战线组织。","options":[{"key":"A","text":"人民代表大会制度"},{"key":"B","text":"政治协商制度"},{"key":"C","text":"中国人民政治协商会议"},{"key":"D","text":"工农联盟"}],"answer":"C","keys":["C"],"explanation":"中国人民政治协商会议是有广泛代表性的统一战线组织。","type":"单选题"},{"number":54,"stem":"悬挂的国徽由国家指定的企业统一制作，其直径的通用尺度为（）。","options":[{"key":"A","text":"120厘米；100厘米；60厘米"},{"key":"B","text":"100厘米；80厘米；60厘米"},{"key":"C","text":"80厘米；60 厘米；30厘米"},{"key":"D","text":"120厘米；60厘米；30厘米"}],"answer":"B","keys":["B"],"explanation":"悬挂的国徽由国家指定的企业统一制作，其直径的通用尺度为下列三种：100厘米；80厘米；60厘米。","type":"单选题"},{"number":55,"stem":"《中华人民共和国宪法》规定，公民的通信自由和通信秘密受法律的保护。除因国家安全或者追查刑事犯罪的需要，由公安机关或者（）依照法律规定的程序对通信进行检查外，任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密。","options":[{"key":"A","text":"检察机关"},{"key":"B","text":"监察机关"},{"key":"C","text":"审判机关"},{"key":"D","text":"国家安全机关"}],"answer":"A","keys":["A"],"explanation":"《宪法》第 40条，中华人民共和国公民的通信自由和通信秘密受法律的保护。除因国家安全或者追查刑事犯罪的需要，由公安机关或者检察机关依照法律规定的程序对通信进行检查外，任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密。","type":"单选题"},{"number":56,"stem":"《旅行社条例》规定，旅行社在经营活动中应当遵循自愿、平等、公平、（）的原则，提高服务质量，维护旅游者合法权益。","options":[{"key":"A","text":"合法"},{"key":"B","text":"公正"},{"key":"C","text":"合理"},{"key":"D","text":"诚信"}],"answer":"D","keys":["D"],"explanation":"依据《旅行社条例》第 4 条规定，旅行社在经营活动中应当遵循自愿、平等、公平、诚信的原则，提高服务质量，维护旅游者的合法权益。","type":"单选题"},{"number":57,"stem":"依据《旅行社条例实施细则》，旅行社为组织旅游者出境旅游委派的领队，应当具有（）年以上旅行社业务经营、管理或者导游等相关从业经历。","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"5"}],"answer":"B","keys":["B"],"explanation":"根据《旅行社条例实施细则》第 31条规定，导游从事领队业务应当具有大专以上学历；取得相关语言水平测试等级证书或通过外语语种导游资格考试，但为赴港澳台地区旅游委派的领队除外；具有两年以上旅行社业务经营、管理或者导游等相关从业经历。","type":"单选题"},{"number":58,"stem":"在线旅游经营者未在全国旅游监管服务平台填报包价旅游合同有关信息的，由县级以上文化和旅游主管部门责令改正，给予警告；拒不改正的，处（）罚款。","options":[{"key":"A","text":"10万元以下"},{"key":"B","text":"5万元以下"},{"key":"C","text":"3万元以下"},{"key":"D","text":"1万元以下"}],"answer":"D","keys":["D"],"explanation":"《在线旅游经营服务管理暂行规定》第 35条规定，违反本规定第 16 条规定，未在全国旅游监管服务平台填报包价旅游合同有关信息的，由县级以上文化和旅游主管部门责令改正，给予警告；拒不改正的，处 1 万元以下罚款。","type":"单选题"},{"number":59,"stem":"根据《旅游法》《旅行社条例》的规定，以下关于旅行社义务的说法正确的是（）。","options":[{"key":"A","text":"按旅游者要求提供服务"},{"key":"B","text":"按市场规则收取旅游费用"},{"key":"C","text":"提供的服务符合人身、财产安全需要"},{"key":"D","text":"旅行社、导游人员、领队人员不得改变旅游合同"}],"answer":"C","keys":["C"],"explanation":"旅行社的义务有：(1) 提供真实可靠的信息；(2) 按约定提供服务；(3) 提供的服务符合人身、财产安全需要；(4) 按规定收取旅游费用；(5) 聘用合格的导游和领队；(6) 旅行社应当与旅游者签订合同；(7) 旅行社、导游人员、领队人员不得擅自改变旅游合同。","type":"单选题"},{"number":60,"stem":"根据《导游管理办法》的规定，导游执业许可申请人隐瞒有关情况或者提供虚假材料申请取得导游人员资格证、导游证的，申请人在（）内不得再次申请该导游执业许可。","options":[{"key":"A","text":"1年"},{"key":"B","text":"2年"},{"key":"C","text":"3年"},{"key":"D","text":"5年"}],"answer":"A","keys":["A"],"explanation":"《导游管理办法》第 34条，导游执业许可申请人隐瞒有关情况或者提供虚假材料申请取得导游人员资格证、导游证，申请人在 1 年内不得再次申请该导游执业许可。","type":"单选题"},{"number":61,"stem":"依据《旅游法》的规定，导游在旅游行程中擅自变更旅游行程安排，严重损害旅游者权益的，处（）罚款，并暂扣或者吊销导游证。","options":[{"key":"A","text":"处 1000 元以上 3 万元以下"},{"key":"B","text":"处 2000 元以上 2 万元以下"},{"key":"C","text":"处 2000 元以上 1 万元以下"},{"key":"D","text":"处 1000 元以上 1 万元以下"}],"answer":"B","keys":["B"],"explanation":"根据《旅游法》第 100条规定，旅行社违反本法规定，有下列行为之一的，由旅游主管部门责令改正，处 3 万元以上 30万元以下罚款，并责令停业整顿；造成旅游者滞留等严重后果的，吊销旅行社业务经营许可证；对直接负责的主管人员和其他直接责任人员，处2000元以上 2 万元以下罚款，并暂扣或者吊销导游证：（一）在旅游行程中擅自变更旅游行程安排，严重损害旅游者权益的；（二）拒绝履行合同的；（三）未征得旅游者书面同意，委托其他旅行社履行包价旅游合同的。故 B 项正确。","type":"单选题"},{"number":62,"stem":"根据《导游人员管理条例》的规定，关于导游人员享有的权利，以下说法错误的是（）。","options":[{"key":"A","text":"人身权利和自由。即导游人员进行导游活动时，人身自由不受非法限制和剥夺，人格尊严不受侵犯，名誉不受损害的权利"},{"key":"B","text":"导游人员享有的调整或变更接待计划权利"},{"key":"C","text":"起诉权。即导游人员对旅游行政行为不服时，依法享有向上一级行政管理机关申请复议权利，享有向人民法院提起诉讼的权利"},{"key":"D","text":"定期接受培训的权利"}],"answer":"D","keys":["D"],"explanation":"本题要求选出“说法错误”的选项。导游人员的法定权利包括：人身权、劳动报酬权、履行职务权、调整或变更接待计划权、申请复议权和起诉权。而“定期接受培训”是《导游人员管理条例》第 11 条规定的法定义务，非权利。因此，D项将“义务”误述为“权利”，是错误说法，为正确答案。A项正确：准确描述了《导游人员管理条例》第 10 条规定的“人身权”内容，包括人身自由、人格尊严、名誉保护。B 项正确：依据《导游人员管理条例》第 13 条，导游在危及人身安全的紧急情形下，经多数游客同意并报告旅行社，可调整或变更计划，此为法定权利。C 项正确：表述虽将“申请复议权”和“起诉权”合并为“起诉权”，但内容无误。导游对行政处罚不服，既可向上一级旅游主管部门申请复议，也可向人民法院提起诉讼。D 项错误：《导游人员管理条例》第 11 条规定：“导游人员应当不断提高自身业务素质和职业技能。”《导游管理办法》也要求导游参加培训。这属于必须履行的义务，而非“可以主张的权利”。","type":"单选题"},{"number":63,"stem":"导游孙某进行导游活动时未佩戴导游证，根据《导游管理办法》的规定，他应当受到旅游行政部门的（）。","options":[{"key":"A","text":"警告：拒不改正的，处 500元以下的罚款"},{"key":"B","text":"责令改正：拒不改正的，处 500元以下的罚款"},{"key":"C","text":"警告：拒不改正的，处 1000元以下的罚款"},{"key":"D","text":"责令改正：拒不改正的，处 1000元以下的罚款"}],"answer":"B","keys":["B"],"explanation":"根据《导游管理办法》第 19 条及第 35条规定，导游在执业过程中应当携带电子导游证、佩戴导游身份标识，并开启导游执业相关应用软件，如违反规定，由旅游行政部门责令改正；拒不改正的，处 500元以下的罚款。因此，B 项“责令改正；拒不改正的，处 500元以下的罚款”完全符合法规，为正确选项。","type":"单选题"},{"number":64,"stem":"当经营者提供商品或者服务有欺诈行为时，根据《消费者权益保护法》的规定，以下说法正确的是（）。","options":[{"key":"A","text":"双方通过协商确定增加赔偿的金额"},{"key":"B","text":"增加赔偿的金额为消费者购买商品的价款 3 倍"},{"key":"C","text":"增加赔偿的金额不足 1000 元的，为 1000元"},{"key":"D","text":"增加赔偿的金额为消费者接受服务的费用的 10倍"}],"answer":"B","keys":["B"],"explanation":"《消费者权益保护法》第 55条规定，经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的 3 倍；增加赔偿的金额不足 500元的，为 500元。法律另有规定的，依照其规定。","type":"单选题"},{"number":65,"stem":"依据《治安管理处罚法》的规定，扰乱公共场所秩序，尚未造成严重后果的，处（）。","options":[{"key":"A","text":"警告或者 500元以下罚款"},{"key":"B","text":"5日以上 10 日以下拘留"},{"key":"C","text":"10日以上 15日以下拘留，可以并处 2000元以下罚款"},{"key":"D","text":"5日以上 10 日以下拘留，可以并处 1000元以下罚款"}],"answer":"A","keys":["A"],"explanation":"依据第 26条，一般扰乱秩序行为处警告或者 500 元以下罚款。A 项正确：一般情节处警告或者 500元以下罚款。B 项错误：5 日以上 10日以下拘留是情节较重的处罚档次。C项错误：10日以上 15日以下拘留并处 2000元以下罚款是聚众实施时对首要分子的处罚。D项错误：可以并处 1000 元以下罚款附随于情节较重档次，不属于一般情节。","type":"单选题"},{"number":66,"stem":"某旅行社在提供组团旅游服务时有欺诈旅游者的行为，那么该旅行社应当按照旅游者的要求增加赔偿其受到的损失，增加赔偿的金额为旅游者支付旅游服务费用的（）。","options":[{"key":"A","text":"1倍"},{"key":"B","text":"2倍"},{"key":"C","text":"3倍"},{"key":"D","text":"10倍"}],"answer":"C","keys":["C"],"explanation":"《消费者权益保护法》第 55条规定，经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的 3 倍；增加赔偿的金额不足 500元的，为 500元。","type":"单选题"},{"number":67,"stem":"根据《旅游投诉处理办法》的规定，旅游投诉由旅游经营者住所地、（）或者旅游纠纷发生地县级以上旅游投诉处理机构管辖。","options":[{"key":"A","text":"合同成立地"},{"key":"B","text":"合同履行地"},{"key":"C","text":"合同变更地"},{"key":"D","text":"合同签订地"}],"answer":"D","keys":["D"],"explanation":"《旅游投诉管理办法》第 5条规定，“旅游投诉由旅游经营者住所地、旅游合同签订地或者旅游纠纷发生地县级以上旅游投诉处理机构管辖。需要立即制止、纠正旅游经营者的损害行为的，应当由旅游纠纷发生地旅游投诉处理机构管辖。”需要即时制止、纠正的情形以旅游纠纷发生地管辖，便于快速处置，防止损害扩大。","type":"单选题"},{"number":68,"stem":"根据《旅游投诉处理办法》第 14条的规定，旅游投诉处理机构接到投诉，应当在（）以内决定是否受理。","options":[{"key":"A","text":"60日"},{"key":"B","text":"2个工作日"},{"key":"C","text":"60个工作日"},{"key":"D","text":"5个工作日"}],"answer":"B","keys":["B"],"explanation":"《旅游投诉处理办法》第 14 条规定：“旅游投诉处理机构接到投诉，应当在二个工作日以内决定是否受理：（一）投诉符合本办法规定的，予以受理；（二）投诉不符合本办法规定的，以口头、书面或者其他适当方式告知投诉人不予受理的理由；根据投诉内容能够确定其他解决纠纷途径的，一并告知投诉人。”","type":"单选题"},{"number":69,"stem":"（）应当为受理的投诉制作档案并妥善保管相关资料。","options":[{"key":"A","text":"当地文化和旅游主管部门"},{"key":"B","text":"旅游投诉处理机构"},{"key":"C","text":"当地人民政府"},{"key":"D","text":"被投诉人所在地文化和旅游主管部门"}],"answer":"B","keys":["B"],"explanation":"《旅游投诉处理办法》第二十七条旅游投诉处理机构应当使用统一规范的旅游投诉处理信息系统，为受理的投诉制作档案并妥善保管相关资料，按照规定公开投诉相关信息。A项错误：当地文化和旅游主管部门不等同于旅游投诉处理机构，该项义务主体是旅游投诉处理机构。B 项正确：旅游投诉处理机构应当为受理的投诉制作档案并妥善保管相关资料。C项错误：当地人民政府不承担旅游投诉档案保管的职责。D 项错误：档案保管义务由受理投诉的旅游投诉处理机构承担，并非被投诉人所在地文化和旅游主管部门。","type":"单选题"},{"number":70,"stem":"根据《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》，下列属于旅游者可以请求旅行社进行违约赔偿的情形是（）。","options":[{"key":"A","text":"游客王女士因旅行社代办的签证信息有误，无法成行"},{"key":"B","text":"因暴雨天气飞机延误，游客张先生未能前往旅游目的地"},{"key":"C","text":"因旅游目的地突发地震灾害，甲旅行社经全体游客同意后提前中断旅游行程"},{"key":"D","text":"赵女士在旅游行程开始前单方面解除旅游合同"}],"answer":"A","keys":["A"],"explanation":"旅游经营者因过错致其代办的手续、证件存在瑕疵，或者未尽妥善保管义务而遗失、毁损，旅游者请求旅游经营者补办或者协助补办相关手续、证件并承担相应费用的，人民法院应予支持。因上述行为影响旅游行程，旅游者请求旅游经营者退还尚未发生的费用、赔偿损失的，人民法院应予支持。此处因为旅行社的过错导致无法成行，旅行社应当承担违约赔偿。故“游客王女士因旅行社代办的签证信息有误，无法成行”选项正确。其余三个选项属于“旅行社应该在扣除必要的费用后，将余款退还给旅游者”，无需承担违约责任。","type":"单选题"},{"number":71,"stem":"根据《旅游投诉处理办法》的规定，下列情形予以受理的是（）。","options":[{"key":"A","text":"超过旅游合同履行期限届满之日 90 日提出投诉的"},{"key":"B","text":"认为导游员所属旅游经营者违反合同约定，侵害自身合法权益的"},{"key":"C","text":"因同行游客的责任致使投诉人人身受到损害的"},{"key":"D","text":"人民法院已经受理的"}],"answer":"B","keys":["B"],"explanation":"《旅游投诉处理办法》第九条旅游投诉应当符合下列条件：（一）投诉人与投诉事项有直接利害关系；（二）有明确的被投诉人、具体的投诉请求。第十一条旅游投诉有下列情形之一的，不予受理：（一）不属于旅游投诉处理机构管辖范围的；（二）超过旅游合同履行期限届满之日九十日的；（三）人民法院、仲裁机构、其他行政管理部门、消费者组织或者人民调解组织等机构已经受理或者处理的；（四）旅游投诉处理机构已经作出处理，且没有新情况、新理由的；（五）不符合本办法第九条规定的受理条件的；（六）本办法规定情形之外的经济纠纷、劳动人事纠纷等其他纠纷。A 项错误：超过旅游合同履行期限届满之日 90日，属于法条明确规定的不予受理情形。B 项正确：导游履行职务行为对应的责任由旅游经营者承担，投诉旅游经营者违约侵害权益，符合受理条件，应当受理。C 项错误：同行游客不属于旅游经营者，该纠纷不属于旅游投诉受理范围，不予受理。D 项错误：人民法院已经受理的案件，属于法定不予受理情形。","type":"单选题"},{"number":72,"stem":"自然灾害、事故灾难或者公共卫生事件发生后，履行统一领导职责的人民政府可以采取下列应急处置措施（）。","options":[{"key":"A","text":"迅速控制危险源"},{"key":"B","text":"对特定区域内的燃料、燃气、电力、水的供应进行控制"},{"key":"C","text":"封锁有关场所、道路，查验现场人员的身份证件"},{"key":"D","text":"对特定区域内的建筑物、交通工具等进行控制"}],"answer":"A","keys":["A"],"explanation":"其余三项属于社会安全事件的应急处置措施。","type":"单选题"},{"number":73,"stem":"可以预警的自然灾害、事故灾难或者公共卫生事件即将发生或者发生的可能性增大时，（）应当根据有关法律、行政法规和国务院规定的权限和程序，发布相应级别的警报。","options":[{"key":"A","text":"国务院有关行政部门"},{"key":"B","text":"市级以上地方各级人民政府"},{"key":"C","text":"县级以上地方各级人民政府"},{"key":"D","text":"所在地人民政府"}],"answer":"C","keys":["C"],"explanation":"《突发事件应对法》第 43条规定，可以预警的自然灾害、事故灾难或者公共卫生事件即将发生或者发生的可能性增大时，县级以上地方各级人民政府应当根据有关法律、行政法规和国务院规定的权限和程序，发布相应级别的警报。","type":"单选题"},{"number":74,"stem":"《旅行社责任保险管理办法》规定，旅行社责任保险的保险期间为（）。","options":[{"key":"A","text":"1年"},{"key":"B","text":"2年"},{"key":"C","text":"3年"},{"key":"D","text":"5年"}],"answer":"A","keys":["A"],"explanation":"旅行社责任保险的保险期限为 1 年。即旅行社投保责任险后，在 1 年的保险期限内，如果发生投保范围内的赔偿责任，由承保的保险公司承担赔偿责任。","type":"单选题"},{"number":75,"stem":"大型群众性活动，是指法人或者其他组织面向社会公众举办的每场次预计参加人数达到（）以上的活动。","options":[{"key":"A","text":"500人"},{"key":"B","text":"1000人"},{"key":"C","text":"1500人"},{"key":"D","text":"2000人"}],"answer":"B","keys":["B"],"explanation":"根据《大型群众性活动安全管理条例》，大型群众性活动，是指法人或者其他组织面向社会公众举办的每场次预计参加人数达到 1000人以上的活动。","type":"单选题"},{"number":76,"stem":"根据《铁路法》的规定，因铁路运输企业的责任造成旅客不能按车票载明的日期、车次乘车的，铁路运输企业应当按照旅客的要求，（）或者安排改乘到达相同目的站的其他列车。","options":[{"key":"A","text":"退还票款差价"},{"key":"B","text":"退还未发生票款"},{"key":"C","text":"退还部分票款"},{"key":"D","text":"退还全部票款"}],"answer":"D","keys":["D"],"explanation":"《铁路法》第 12条规定，铁路运输企业应当保证旅客按车票载明的日期、车次乘车，并到达目的站。因铁路运输企业的责任造成旅客不能按车票载明的日期、车次乘车的，铁路运输企业应当按照旅客的要求，退还全部票款或者安排改乘到达相同目的站的其他列车。","type":"单选题"},{"number":77,"stem":"根据《出境入境管理法》的规定，持用伪造的出境入境证件出境入境的，（）。","options":[{"key":"A","text":"处 1000 元以上 5000元以下罚款"},{"key":"B","text":"处 2000 元以上 5000元以下罚款"},{"key":"C","text":"处 1000 元以上 1 万元以下罚款"},{"key":"D","text":"处 2000 元以上 1 万元以下罚款"}],"answer":"A","keys":["A"],"explanation":"《出境入境管理法》第 71条规定，有下列行为之一的，处 1000元以上 5000元以下罚款；情节严重的，处 5 日以上 10 日以下拘留，可以并处 2000元以上 1万元以下罚款：（1）持用伪造、变造、骗取的出境入境证件出境入境；（2）冒用他人出境入境证件出境入境；（3）逃避出境入境边防检查；（4）以其他方式非法出境入境。","type":"单选题"},{"number":78,"stem":"国家对食品生产经营实行许可制度，食品生产经营许可的有效期为（）。","options":[{"key":"A","text":"1年"},{"key":"B","text":"2年"},{"key":"C","text":"3年"},{"key":"D","text":"5年"}],"answer":"D","keys":["D"],"explanation":"《食品安全法实施条例》第 15条规定，食品生产经营许可的有效期为 5年。","type":"单选题"},{"number":79,"stem":"根据《风景名胜区条例》第四十一条，在风景名胜区内从事禁止范围以外的建设活动，未经风景名胜区管理机构审核的，责令停止建设、限期拆除，对单位处（）的罚款。","options":[{"key":"A","text":"2万元以上 5万元以下"},{"key":"B","text":"10万元以上 20万元以下"},{"key":"C","text":"20万元以上 50万元以下"},{"key":"D","text":"50万元以上 100万元以下"}],"answer":"C","keys":["C"],"explanation":"《风景名胜区条例》第四十一条：在风景名胜区内从事禁止范围以外的建设活动，未经风景名胜区管理机构审核的，责令停止建设、限期拆除，对个人处 2 万元以上 5 万元以下的罚款，对单位处 20 万元以上 50 万元以下的罚款。A 选项：2 万元以上 5 万元以下，是对个人的罚款标准，故错误。B、D 选项：均不符合法条规定，故错误。C 选项：20 万元以上 50 万元以下，符合法条规定，故正确。","type":"单选题"},{"number":80,"stem":"根据《文物保护法》的规定，文物收藏单位无法通过（）方式取得文物。","options":[{"key":"A","text":"购买"},{"key":"B","text":"接受捐赠"},{"key":"C","text":"考古挖掘"},{"key":"D","text":"依法交换"}],"answer":"C","keys":["C"],"explanation":"《文物保护法》第 37条规定，文物收藏单位可以通过下列方式取得文物：（1）购买；（2）接受捐赠；（3）依法交换；（4）法律、行政法规规定的其他方式。","type":"单选题"},{"number":81,"stem":"依据《中华人民共和国非物质文化遗产法》，开发利用非物质文化遗产代表性项目的，应当支持代表性传承人开展传承活动，保护属于该项目组成部分的（）。","options":[{"key":"A","text":"实物"},{"key":"B","text":"场所"},{"key":"C","text":"实物和场所"},{"key":"D","text":"实物或者场所"}],"answer":"C","keys":["C"],"explanation":"开发利用非物质文化遗产代表性项目的，应当支持代表性传承人开展传承遗产生产性活动，保护属于该项目组成部分的实物和场所。","type":"单选题"},{"number":82,"stem":"中国共产党第二十届中央委员会第三次全体会议的主要议题是（）。","options":[{"key":"A","text":"关于推进农村改革发展若干重大问题的决定"},{"key":"B","text":"关于进一步全面深化改革、推进中国式现代化的决定"},{"key":"C","text":"关于全面深化改革若干重大问题的决定"},{"key":"D","text":"关于深化党和国家机构改革的决定"}],"answer":"B","keys":["B"],"explanation":"2024 年 7 月 18 日，习近平在党的二十届三中全会第二次全体会议上发表了重要讲话，会议分析了当前形势和任务，并审议通过了《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。","type":"单选题"},{"number":83,"stem":"依据习近平文化思想，把（）在意识形态领域指导地位确立为根本制度。","options":[{"key":"A","text":"社会主义核心价值观"},{"key":"B","text":"马克思主义"},{"key":"C","text":"中国优秀传统文化"},{"key":"D","text":"全过程人民民主"}],"answer":"B","keys":["B"],"explanation":"文档原文：习近平文化思想包括坚持党的文化领导权、推动物质文明和精神文明协调发展、把马克思主义在意识形态领域指导地位确立为根本制度、坚持以人民为中心的工作导向、保护历史文化遗产、构建中国话语和中国叙事体系、促进人类文明交流互鉴等重要内容。A 项错误，社会主义核心价值观属于“七个着力”中培育和践行的对象，并非确立为意识形态领域根本制度的对象，故 A 错误。B 项正确，把马克思主义在意识形态领域指导地位确立为根本制度，是习近平文化思想的重要内容，故 B 正确。C 项错误，中国优秀传统文化强调创造性转化和创新性发展，不属于确立为意识形态领域根本制度的对象，故 C 错误。D项错误，全过程人民民主不属于文化思想中确立为意识形态领域根本制度的内容，故 D 错误。","type":"单选题"},{"number":84,"stem":"学校除假期外，（）举行一次升旗仪式。","options":[{"key":"A","text":"每天"},{"key":"B","text":"每周"},{"key":"C","text":"每月"},{"key":"D","text":"每季度"}],"answer":"B","keys":["B"],"explanation":"北京天安门广场每日举行升旗仪式。学校除假期外，每周举行一次升旗仪式。","type":"单选题"},{"number":85,"stem":"我国国徽图案中的齿轮和谷穗象征（）领导下的工农联盟。","options":[{"key":"A","text":"工人阶级"},{"key":"B","text":"农民阶级"},{"key":"C","text":"无产阶级"},{"key":"D","text":"知识分子"}],"answer":"A","keys":["A"],"explanation":"我国国徽图案中的齿轮和谷穗象征工人阶级领导下的工农联盟。","type":"单选题"},{"number":86,"stem":"《关于推动在线旅游市场高质量发展的意见》提到的主线是（）。","options":[{"key":"A","text":"推动数字经济发展"},{"key":"B","text":"深化供给侧结构性改革"},{"key":"C","text":"扩大市场需求"},{"key":"D","text":"加强政府监管"}],"answer":"B","keys":["B"],"explanation":"坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大精神，贯彻落实党中央关于加快建设网络强国、数字中国决策部署，立足新发展阶段，贯彻新发展理念，构建新发展格局，以推动高质量发展为主题，以深化供给侧结构性改革为主线，以满足人民日益增长的美好生活需要为根本目的……。","type":"单选题"},{"number":87,"stem":"1980年，（）成立。","options":[{"key":"A","text":"厦门华侨旅行社"},{"key":"B","text":"中国国际旅行社"},{"key":"C","text":"中国旅行社"},{"key":"D","text":"中国青年旅行社"}],"answer":"D","keys":["D"],"explanation":"1980年：中国青年旅行社总社成立。","type":"单选题"},{"number":88,"stem":"（）年，全国旅游工作会议提出深化导游管理体制改革，推动导游管理从“行政化、非流动、封闭式”向“市场化、自由化、法治化”转变。","options":[{"key":"A","text":"2009年"},{"key":"B","text":"2013年"},{"key":"C","text":"2016年"},{"key":"D","text":"2018年"}],"answer":"C","keys":["C"],"explanation":"2016 年 1 月，全国旅游工作会议提出深化导游管理体制改革，推动导游管理从“行政化、非流动、封闭式”向“市场化、自由化、法治化”转变。","type":"单选题"},{"number":89,"stem":"（）是旅行社形象的标志。","options":[{"key":"A","text":"计调服务"},{"key":"B","text":"导游服务"},{"key":"C","text":"司机服务"},{"key":"D","text":"组团社服务"}],"answer":"B","keys":["B"],"explanation":"导游服务是旅行社形象的标志。","type":"单选题"},{"number":90,"stem":"导游带团可以了解不同国家和地区的文化差异，促进不同文化的交流融合，这是导游服务特点中（）的体现。","options":[{"key":"A","text":"工作独立性强"},{"key":"B","text":"脑体高度结合"},{"key":"C","text":"客观情况复杂"},{"key":"D","text":"文化交流频繁"}],"answer":"D","keys":["D"],"explanation":"文化交流频繁：导游可了解不同国家和地区的文化差异；拓宽自身文化视野；促进不同的文化交流融合。","type":"单选题"},{"number":91,"stem":"下列选项中，对导游考试资格描述错误的一项是（）。","options":[{"key":"A","text":"中华人民共和国公民"},{"key":"B","text":"具有初级中学、中等专业学校或以上学历"},{"key":"C","text":"身体健康"},{"key":"D","text":"具有适应导游需要的基本知识和语言表达能力"}],"answer":"B","keys":["B"],"explanation":"具有高级中学、中等专业学校或以上学历，身体健康，具有适应导游需要的基本知识和语言表达能力的中华人民共和国公民，可以参加导游资格考试。","type":"单选题"},{"number":92,"stem":"关于中级导游晋升高级导游的条件，描述正确的是（）。","options":[{"key":"A","text":"应具有大学本科以上学历"},{"key":"B","text":"2年内未因侵害旅游者合法权益受到罚款以上处罚"},{"key":"C","text":"取得上一个导游等级满 3 年"},{"key":"D","text":"国家旅游局每年组织一次中级升高级考试"}],"answer":"B","keys":["B"],"explanation":"中高级导游：申请参加中级、高级导游等级考核的，应具有大学专科以上学历，取得上一个导游等级满2年，2年内在全国旅游监管服务平台的带团记录不少于25次或90天；2年内未因侵害旅游者合法权益受到罚款以上处罚，未被认定为文化和旅游市场失信主体；中级、高级导游等级考核，原则上采取笔试形式，每 2年开展一次；根据需要，可增加面试形式。","type":"单选题"},{"number":93,"stem":"下列选项中，（）不是导游的技术能力。","options":[{"key":"A","text":"事故处理能力"},{"key":"B","text":"语言能力"},{"key":"C","text":"接待操作能力"},{"key":"D","text":"信息技术运用能力"}],"answer":"A","keys":["A"],"explanation":"导游的技术能力：语言能力；接待操作能力；信息技术运用能力。","type":"单选题"},{"number":94,"stem":"“爱国、敬业、诚信、友善”是（）。","options":[{"key":"A","text":"国家层面的价值目标"},{"key":"B","text":"社会层面的价值取向"},{"key":"C","text":"个人层面的价值准则"},{"key":"D","text":"中华传统的价值凝练"}],"answer":"C","keys":["C"],"explanation":"党的十八大提出，倡导富强、民主、文明、和谐（国家层面的价值目标），倡导自由、平等、公正、法治（社会层面的价值取向），倡导爱国、敬业、诚信、友善（公民个人层面的价值准则），积极培育和践行社会主义核心价值观。","type":"单选题"},{"number":95,"stem":"下列选项中，（）不是地陪导游欢迎词的内容。","options":[{"key":"A","text":"问候语，向旅游者问好"},{"key":"B","text":"介绍自己和旅行社、旅游车司机"},{"key":"C","text":"诚恳征求旅游者对本次旅游服务的意见和建议"},{"key":"D","text":"预祝旅游活动愉快顺利"}],"answer":"C","keys":["C"],"explanation":"欢迎词一般包括以下内容：- 问候语：向旅游者问好。- 欢迎语：对旅游者的到来表示欢迎。- 介绍语：介绍自己和旅行社、旅游车司机。- 愿望语：表达提供优质服务的态度和希望支持合作的愿望等。- 祝福语：预祝旅游活动愉快顺利。","type":"单选题"},{"number":96,"stem":"当入境领队（全陪）手中的旅行计划与地陪的接待计划有部分出入时，地陪导游应该（）。","options":[{"key":"A","text":"联系组团社，查明原因"},{"key":"B","text":"若是地接社的责任，地陪应实事求是地说明情况"},{"key":"C","text":"如果是组团社责任，要向客人说明不是地接社责任"},{"key":"D","text":"坚持以手中的接团计划为准，进行执行"}],"answer":"B","keys":["B"],"explanation":"入境领队（全陪）手中的旅行计划与地陪的接待计划有部分出入时：查明原因：及时报告旅行社，查明原因，分清责任；道歉说明：若是地接社的责任，地陪应实事求是地说明情况，并向入境领队（全陪）和全体旅游者赔礼道歉。","type":"单选题"},{"number":97,"stem":"下列选项中，对地陪导游带领游客抵达景区后、进入景区前的服务，描述错误的是（）。","options":[{"key":"A","text":"下车前，地陪提醒旅游者记住车型、颜色、标志、车牌号"},{"key":"B","text":"若景点下车和上车地点不同，特别提醒上车地点"},{"key":"C","text":"下车前，讲清停留时间、集合时间和地点"},{"key":"D","text":"下车后，引导旅游者至景点示意图前，讲解游览线路，交代注意事项"}],"answer":"C","keys":["C"],"explanation":"（1）车辆信息：抵达景点后，下车前，地陪提醒旅游者记住车型、颜色、标志、车牌号、停车地点和开车时间；（2）特殊地点：若景点下车和上车地点不同，特别提醒上车地点。（3）示意图前讲解：下车后，引导旅游者至景点示意图前，讲解游览线路，交代注意事项，强调人身财产安全、预防走失，讲清停留时间、集合时间和地点。","type":"单选题"},{"number":98,"stem":"乘坐出境航班，地陪导游要提前（）小时抵达机场。","options":[{"key":"A","text":"4"},{"key":"B","text":"3"},{"key":"C","text":"2"},{"key":"D","text":"1"}],"answer":"B","keys":["B"],"explanation":"乘出境航班提前 3 小时；乘国内航班提前 2 小时；乘火车、轮船提前 1 小时。","type":"单选题"},{"number":99,"stem":"地陪导游送火车游客，应该在（）后离开。","options":[{"key":"A","text":"隔离区"},{"key":"B","text":"火车站台"},{"key":"C","text":"火车启动"},{"key":"D","text":"火车站停车场"}],"answer":"A","keys":["A"],"explanation":"当旅游者进入安检口或隔离区时，地陪应与旅游者热情告别，并祝愿他们一路平安。旅游团进入安检区后，地陪方可离开。","type":"单选题"},{"number":100,"stem":"外国旅游者在中国旅游期间，不能使用的支付方式是（）。","options":[{"key":"A","text":"人民币现金"},{"key":"B","text":"微信"},{"key":"C","text":"支付宝"},{"key":"D","text":"本国货币"}],"answer":"D","keys":["D"],"explanation":"说明支付方式：向入境旅游者说明在中国可使用现金、数字人民币、VISA、微信、支付宝等多种支付方式。","type":"单选题"},{"number":101,"stem":"“漓江的水真静啊，静得让你感觉不到它在流动；漓江的水真清啊，清得可以看见江底的沙石；漓江的水真绿啊，绿得仿佛那是一块无瑕的翡翠。”这段话用了修辞手法中的（）。","options":[{"key":"A","text":"夸张"},{"key":"B","text":"比拟"},{"key":"C","text":"比喻"},{"key":"D","text":"排比"}],"answer":"D","keys":["D"],"explanation":"排比可以用来表达对某一事物的热烈赞美。连续的排比句式强化了导游语言的力量，抒发了强烈的赞美之情，让人听后顿感心旷神怡，也会忍不住由衷地发出赞叹。","type":"单选题"},{"number":102,"stem":"“各位嘉宾，大家现在已经抵达了我们祖国的心脏——北京”，这句话采用的是（）。","options":[{"key":"A","text":"暗喻"},{"key":"B","text":"明喻"},{"key":"C","text":"借喻"},{"key":"D","text":"隐喻"}],"answer":"A","keys":["A"],"explanation":"直接把一种事物当作另一种事物来描述，使比喻更加含蓄且富有深意。例如：“各位嘉宾，大家现在已经抵达了我们祖国的心脏——北京”，北京的重要地位在这番话中一目了然。","type":"单选题"},{"number":103,"stem":"表达兴奋、号召、激动、惊叹、疑问等情绪的语调是（）。","options":[{"key":"A","text":"高升调"},{"key":"B","text":"低降调"},{"key":"C","text":"平直调"},{"key":"D","text":"曲折调"}],"answer":"A","keys":["A"],"explanation":"高升调：适用于表达兴奋、号召、激动、惊叹、疑问等情绪。句子开头音调低，句尾显著升高。例如“看，流星出现在夜空啦！”（传达兴奋、激动之情）。","type":"单选题"},{"number":104,"stem":"导游讲话时，目光似看非看地望向全体旅游者，营造“我心有你”的氛围，这是导游采用了（）的目光语。","options":[{"key":"A","text":"环视法"},{"key":"B","text":"前视法"},{"key":"C","text":"点视法"},{"key":"D","text":"虚视法"}],"answer":"D","keys":["D"],"explanation":"虚视法：导游讲话时，目光似看非看地望向全体旅游者，营造“我心有你”的氛围。目的是让全体旅游者都感觉导游在关注自己。","type":"单选题"},{"number":105,"stem":"“苏州被称为‘东方的威尼斯’”运用了（）。","options":[{"key":"A","text":"同类相似类比"},{"key":"B","text":"同类相异类比"},{"key":"C","text":"异类相似类比"},{"key":"D","text":"异类相异类比"}],"answer":"C","keys":["C"],"explanation":"将相似的两个事物或现象进行比较，便于旅游者理解。举例：苏州是著名的江南水乡，老城内至今保持着“水陆并行、河街相邻”的双棋盘格局，被意大利旅行家马可·波罗称为“东方的威尼斯”。","type":"单选题"},{"number":106,"stem":"清河坊街区作为杭州目前唯一保存较完好的旧街区，身上凝聚了杭州最具代表性的历史文化、商业文化、建筑文化及市井文化。这是突出重点法中的（）应用。","options":[{"key":"A","text":"突出独特之处"},{"key":"B","text":"突出有代表性部分"},{"key":"C","text":"突出旅游者感兴趣的内容"},{"key":"D","text":"突出“最”“第一”"}],"answer":"B","keys":["B"],"explanation":"在讲解城市或景点全貌后，可侧重讲解其中富有代表性的内容。","type":"单选题"},{"number":107,"stem":"导游能够允许旅游者自由活动的情形是（）。","options":[{"key":"A","text":"城市旅游期间要求全天不跟团活动"},{"key":"B","text":"游湖时单独划小船"},{"key":"C","text":"傍晚时分，单独骑车去郊区游玩"},{"key":"D","text":"去不对外开放的地区、机构参观游览"}],"answer":"A","keys":["A"],"explanation":"其余三项均为不可允许的选项。应劝阻旅游者自由活动的几种情况：1. 旅游团计划去另一地游览或即将离开本地时：劝阻旅游者不要自由活动，特别是需要较长时间的活动，如不要到热闹的地方购物，以避免误机（车、船）。2. 身处治安不理想、复杂、混乱的地方时：劝阻旅游者外出活动，更不要单独活动，但必须实事求是地说明情况。3. 单独骑自行车去人生地不熟、车水马龙的街头游玩时：不宜让旅游者单独前往。4. 游河（湖、海）时提出划小船或在非游泳区游泳时：不能答应，也不能置旅游团于不顾而陪少数人去划船、游泳。5. 要求去不对外开放的地区、机构参观游览时：进行劝阻，不得答应相应要求。","type":"单选题"},{"number":108,"stem":"开始登机后，导游提醒旅游者有序排队，导游（）登机。","options":[{"key":"A","text":"第一个"},{"key":"B","text":"排在客人中间"},{"key":"C","text":"比较靠前的位置"},{"key":"D","text":"最后一个"}],"answer":"D","keys":["D"],"explanation":"开始登机后，提醒旅游者有序排队，确认全体人员登机后，导游最后登机。","type":"单选题"},{"number":109,"stem":"下列选项中，导游引导游客理性消费错误的一项是（）。","options":[{"key":"A","text":"提醒旅游者思考是否真正需要，避免因冲动购买无用商品，减少浪费"},{"key":"B","text":"鼓励旅游者购买真正喜欢的物品"},{"key":"C","text":"鼓励游客多多选购当地特色产品"},{"key":"D","text":"购买大件物品时，要确认商品是否提供“包修、包换、包退”服务，并索取发票等凭证"}],"answer":"C","keys":["C"],"explanation":"导游作为旅游者的朋友和向导，有责任引导其理性消费。可建议旅游者遵循以下原则：“实用”原则：必要时提醒旅游者在购买前思考是否真正需要，避免因冲动购买不实用商品，减少浪费。“喜欢”原则：鼓励旅游者购买真正喜欢的物品，能承载旅游者个人的情感与记忆，也值得购买。“保障”原则：提醒旅游者“货比三家”和确认“三包商品”。特别是购买大件物品时，要确认商品是否提供“包修、包换、包退”服务，并索取发票等凭证，妥善保存。通过以上方法，导游可在帮助旅游者享受购物乐趣的同时，引导其做出明智的消费决策。","type":"单选题"},{"number":110,"stem":"世界上第一本旅游指南《利物浦之行手册》诞生于（）年。","options":[{"key":"A","text":"1841"},{"key":"B","text":"1845"},{"key":"C","text":"1846"},{"key":"D","text":"1865"}],"answer":"B","keys":["B"],"explanation":"1845年，世界上第一本旅游指南《利物浦之行手册》诞生。","type":"单选题"},{"number":111,"stem":"游客要求退换商品，导游操作正确的一项是（）。","options":[{"key":"A","text":"立即陪同旅游者前往购买地点"},{"key":"B","text":"站在游客一边，积极与商家退货和赔偿问题"},{"key":"C","text":"若商店拒绝退赔，导游应及时联系当地市场管理部门、旅游管理部门或消费者协会等相关部门"},{"key":"D","text":"若商家出售残次品，导游要积极维护游客利益，解决问题"}],"answer":"D","keys":["D"],"explanation":"当旅游者在计划内购物店或自由活动期间所购买的商品出现质量问题，如存在残次品或假货等情况时，他们会要求导游协助进行退换货：必要时，陪同旅游者前往购买地点，协助其办理退赔手续，积极维护旅游者的合法权益，努力为旅游者解决问题。","type":"单选题"},{"number":112,"stem":"如果全团统一要求增加计划外的娱乐活动，导游操作正确的是（）。","options":[{"key":"A","text":"立即按照要求增加"},{"key":"B","text":"让旅游者通知组团社"},{"key":"C","text":"如接待社无法调换，要向旅游者做好耐心解释工作"},{"key":"D","text":"积极做出承诺帮助更换"}],"answer":"C","keys":["C"],"explanation":"与接待社计调部门联系，尽可能调换，但不要在未联系妥当之前许诺；如接待社无法调换，要向旅游者做好耐心解释工作，并说明票已订好，不能退换，请其谅解。","type":"单选题"},{"number":113,"stem":"下列自由活动要求中，导游应当劝阻的是（）。","options":[{"key":"A","text":"在海边玩时，游客要到海水浴场游泳"},{"key":"B","text":"游客要单独骑自行车去人生地不熟、车水马龙的街头游玩"},{"key":"C","text":"游三峡时，游客提出要乘坐大型游轮饱览两岸风光"},{"key":"D","text":"游客执意要去大型娱乐场所活动"}],"answer":"B","keys":["B"],"explanation":"1. 旅游团计划去另一地游览或即将离开本地时：劝阻旅游者不要自由活动，特别是需要较长时间的活动，如不要到热闹的地方购物，以避免误（车、船）。2. 身处治安不理想、复杂、混乱的地方时：劝阻旅游者外出活动，更不要单独活动，但必须实事求是地说明情况。3. 单独骑自行车去人生地不熟、车水马龙的街头游玩时：不宜让旅游者单独前往。4. 游河（湖、海）时提出划小船或在非游泳区游泳时：不能答应，也不能置旅游团于不顾而陪少数人去划船、游泳。5. 要求去不对外开放的地区、机构参观游览时：进行劝阻，不得答应相应要求。","type":"单选题"},{"number":114,"stem":"旅游者提出要求自费品尝风味餐，导游操作正确的是（）。","options":[{"key":"A","text":"全团或大多数旅游者要求品尝风味餐的处理，应予以婉拒"},{"key":"B","text":"如果是个人提出品尝风味餐，一般情况下导游需要陪同前往"},{"key":"C","text":"若是个别旅游者想要品尝风味餐，请其自理，无需帮助"},{"key":"D","text":"导游需告知游客风味餐一旦预订后若取消，须赔偿餐厅的相关损"}],"answer":"D","keys":["D"],"explanation":"1. 如果是全团或大多数旅游者提出计划外品尝风味餐的要求，导游应予以协助；可由旅行社出面，也可由游客自行与有关餐厅联系订餐，风味餐订妥后旅游者又不想去时，导游应耐心劝说他们在约定时间前往餐厅，并说明若不去用餐，须赔偿餐厅的相关损失；2. 若是个别旅游者想要品尝风味餐，导游可协助联系餐馆，告知其风味餐费用，自理，原餐费根据旅游合同约定处理，通常导游不陪同前往，但要提醒旅游者注意人身和财物安全。","type":"单选题"},{"number":115,"stem":"经多方努力仍发生误机（车、船）事故时，导游操作正确的是（）。","options":[{"key":"A","text":"自己摘除责任并跟客人解释清楚"},{"key":"B","text":"导游听从客人意见，按照客人的意见处理"},{"key":"C","text":"若下一站继续游览，及时通知并调整日程"},{"key":"D","text":"与航空公司联络，让航空公司给出意见"}],"answer":"C","keys":["C"],"explanation":"（1）稳定旅游者情绪，导游设法转移旅游者注意力，提供周到服务以稳定情绪；（2）做好协调工作，导游执行旅行社处理意见并通报旅游者，同时反馈旅游者意见给旅行社，直至找到新方案；（3）做好对下一站的通知，若下一站继续游览，及时通知并调整日程；若下一站返程，提醒旅游者联系家人告知情况，让家人放心。","type":"单选题"},{"number":116,"stem":"（）是重症中暑的表现。","options":[{"key":"A","text":"头晕、耳鸣、口渴、多汗、无力"},{"key":"B","text":"体温升至 38℃以上"},{"key":"C","text":"面色苍白、恶心、呕吐、呼吸浅快"},{"key":"D","text":"昏迷、四肢抽搐"}],"answer":"D","keys":["D"],"explanation":"中暑是在烈日或高温环境下，人体热量散发不及时，体温调节功能障碍引发的急性疾病。轻症中暑表现为头晕、耳鸣、口渴、多汗、无力，体温升至 38℃以上时，还会面色苍白、恶心、呕吐、呼吸浅快；重症中暑甚至昏迷、四肢抽搐，严重可致多器官功能衰竭。","type":"单选题"},{"number":117,"stem":"在预防治安事故的发生过程中，导游操作存在失误的是（）。","options":[{"key":"A","text":"应随时提醒旅游者加强个人安全防护"},{"key":"B","text":"应提醒司机在接待旅游者期间不带无关人员上车"},{"key":"C","text":"熟悉当地情况且安全意识较强，应尽量多与旅游者在一起"},{"key":"D","text":"遇到不明身份人员拦车时不轻易停车或开门，导游熟悉的人可以"}],"answer":"D","keys":["D"],"explanation":"1. 做好旅游者安全教育：旅游过程中，导游应随时提醒旅游者加强个人安全防护，如随身携带贵重物品、不在人群密集处暴露财物、夜晚避免独自出行、不轻信陌生人求助等；2. 提醒司机做好安全配合：导游应提醒司机在接待旅游者期间不带无关人员上车，遇到不明身份人员拦；3. 多与旅游者在一起：车时不轻易停车或开门，车上无人时关好车窗、锁好车门导游熟悉当地情况且安全意识较强，应尽量多与旅游者在一起，及时关注并提醒他们注意人身与财产安全，同时利于完成旅游接待任务。","type":"单选题"},{"number":118,"stem":"食物中毒的典型特征不包括（）。","options":[{"key":"A","text":"食物中毒潜伏期短、发病快"},{"key":"B","text":"恶心、呕吐、腹泻、腹痛"},{"key":"C","text":"常集体发病"},{"key":"D","text":"需要及时抢救，但是不会有生命危险"}],"answer":"D","keys":["D"],"explanation":"食物中毒潜伏期短、发病快，典型症状为恶心、呕吐、腹泻、腹痛，且常集体发病，严重者若抢救不及时会有生命危险。因此，导游在服务过程中应注重预防，并掌握基本处理技能。","type":"单选题"},{"number":119,"stem":"雨中行车时，导游操作正确的是（）。","options":[{"key":"A","text":"导游可提醒司机注意控制车速，紧跟大车，使其为之挡风雨"},{"key":"B","text":"遇到路面积水较深时快速通过，避免车辆涉水熄火"},{"key":"C","text":"当车辆在低洼处熄火时，全体人员在车上停留，不要下车"},{"key":"D","text":"带领游客迅速转移至安全地带，靠边等待救援"}],"answer":"D","keys":["D"],"explanation":"（1）控制车速与保持车距导游可提醒司机注意控制车速，适当增大与前车的车距，保持安全制动距离，确保行车安全；（2）绕行积水路段遇到路面积水较深时应尽量绕行，避免车辆涉水熄火，减少车辆故障和危险情况的发生；（3）车辆熄火后的应急措施当车辆在低洼处熄火时，全体人员不要在车上停留，要立即下车，迅速转移至安全地带，靠边等待救援，切不可在车内逗留，以免水位持续上升造成生命危险。","type":"单选题"},{"number":120,"stem":"关于禁止出入境物品的描述，错误的一项是（）。","options":[{"key":"A","text":"各种武器、仿真武器、弹药及爆炸物品"},{"key":"B","text":"录音带、录像带、激光视盘、计算机存储介质及其物品"},{"key":"C","text":"鸦片、吗啡、海洛因、大麻以及其他能使人成瘾的麻醉品"},{"key":"D","text":"带有危险性病菌、害虫及其他有害生物的动物、植物及其产品"}],"answer":"B","keys":["B"],"explanation":"禁止出入境物品的：各种武器、仿真武器、弹药及爆炸物品；对中国政治、经济、文化、道德有害的印刷品、胶卷、照片、唱片、影片、录音带、录像带、激光视盘、计算机存储介质及其物品；鸦片、吗啡、海洛因、大麻以及其他能使人成瘾的麻醉品；带有危险性病菌、害虫及其他有害生物的动物、植物及其产品。","type":"单选题"},{"number":121,"stem":"关于安全检查的内容，表述正确的一项是（）。","options":[{"key":"A","text":"高级外交人员可以免检"},{"key":"B","text":"安全检查通过安全门使用磁性探测检查、红外线透视，但不能搜身"},{"key":"C","text":"携带贵重物品、植入心脏起搏器需要在公开场所进行安检"},{"key":"D","text":"有殴打辱骂民航安检员妨碍民航安检工作的行为，移交公安机关处理"}],"answer":"D","keys":["D"],"explanation":"无论外交人员
