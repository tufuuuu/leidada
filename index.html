{"key":"B","text":"次日凌晨 1 点"},{"key":"C","text":"次日凌晨 2 点"},{"key":"D","text":"次日凌晨 3 点"}],"answer":"C","keys":["C"],"explanation":"《娱乐场所管理条例》第 28条规定，每日凌晨 2 时至上午 8时，娱乐场所不得营业。","type":"单选题"},{"number":81,"stem":"根据《自然保护区条例》的规定，自然保护区受损自然生态系统的修复应当坚持( )。","options":[{"key":"A","text":"人工修复为主"},{"key":"B","text":"科技助力为主"},{"key":"C","text":"自然恢复为主"},{"key":"D","text":"迁地保护为主"}],"answer":"C","keys":["C"],"explanation":"《自然保护区条例》第二十五条:自然保护区区域内受损自然生态系统修复、生态廊道连通、重要栖息地恢复等应当坚持自然恢复为主；确有必要开展种群调控、树种更新等人工修复活动的，应当充分听取有关方面意见，按照有关规定制定科学合理的修复方案并依法实施。A 项错误，人工修复只是在确有必要时作为补充手段，并非修复工作的主导原则，依据条例第二十五条。B项错误，条例规定的是自然恢复为主，没有“科技助力为主”的表述，属于干扰项。C 项正确，与条例第二十五条“坚持自然恢复为主”的规定一致。D项错误，迁地保护是针对珍稀濒危物种的救助保护方式，不是生态系统修复原则，依据条例第二十五条。","type":"单选题"},{"number":82,"stem":"根据《风景名胜区条例》的规定，国家级风景名胜区的总体规划由下列( )组织编制。","options":[{"key":"A","text":"国务院林业草原主管部门"},{"key":"B","text":"省、自治区、直辖市人民政府林业草原主管部门"},{"key":"C","text":"省级人民政府"},{"key":"D","text":"县级人民政府"}],"answer":"B","keys":["B"],"explanation":"《风景名胜区条例》第十六条:国家级风景名胜区规划由省、自治区、直辖市人民政府林业草原主管部门组织编制。省级风景名胜区规划由县级人民政府组织编制。","type":"单选题"},{"number":83,"stem":"党的二十大报告指出，坚持和发展马克思主义，必须同()相结合。只有植根本国､本民族历史文化沃土，马克思主义真理之树才能根深叶茂。","options":[{"key":"A","text":"中国式现代化"},{"key":"B","text":"中华优秀传统文化"},{"key":"C","text":"马列主义"},{"key":"D","text":"马克思主义"}],"answer":"B","keys":["B"],"explanation":"坚持和发展马克思主义，必须同中华优秀传统文化相结合。只有植根本国、本民族历史文化沃土，马克思主义真理之树才能根深叶茂。","type":"单选题"},{"number":84,"stem":"我们确立和坚持( )在意识形态领域指导地位的根本制度。","options":[{"key":"A","text":"习近平新时代中国特色社会主义思想"},{"key":"B","text":"中华优秀传统文化"},{"key":"C","text":"毛泽东思想"},{"key":"D","text":"马克思主义"}],"answer":"D","keys":["D"],"explanation":"党的二十大报告指出，我们确立和坚持马克思主义在意识形态领域指导地位的根本制度。","type":"单选题"},{"number":85,"stem":"《港区国安法》规定，任何人组织､策划､实施或者参与实施( )行为之一的，即属犯颠覆国家政权罪。","options":[{"key":"A","text":"以武力旨在颠覆国家政权行为"},{"key":"B","text":"分裂国家的行为"},{"key":"C","text":"造成严重社会危害的恐怖活动"},{"key":"D","text":"破坏国家统一行为"}],"answer":"A","keys":["A"],"explanation":"《港区国安法》第 22 条对“颠覆国家政权罪”的规定，任何人组织、策划、实施或者参与实施以武力、威胁使用武力或者其他非法手段旨在颠覆国家政权行为之一的，即属犯罪。","type":"单选题"},{"number":86,"stem":"依据文化和旅游部《旅游强国建设“十五五”规划》，规划指出，旅游业日益成为( )。","options":[{"key":"A","text":"新兴的战略性支柱产业和具有显著时代特征的民生产业、幸福产业"},{"key":"B","text":"国民经济的支柱产业和基础性产业"},{"key":"C","text":"现代服务业的龙头产业和先导性产业"},{"key":"D","text":"战略性新兴产业和国民经济主导产业"}],"answer":"A","keys":["A"],"explanation":"旅游业日益成为新兴的战略性支柱产业和具有显著时代特征的民生产业、幸福产业。A项正确，与规划原文对旅游业产业地位的定位完全一致，故 A 正确。","type":"单选题"},{"number":87,"stem":"( )是指实施旅游接待计划，在境内旅游目的地为旅游者提供导游服务的人员。","options":[{"key":"A","text":"地陪"},{"key":"B","text":"全陪"},{"key":"C","text":"领队"},{"key":"D","text":"计调"}],"answer":"A","keys":["A"],"explanation":"地陪是指实施旅游接待计划，在境内旅游目的地为旅游者提供导游服务的人员。","type":"单选题"},{"number":88,"stem":"如果旅游车在行程中遇到大雨，导游老王应该提醒司机( )。","options":[{"key":"A","text":"尽量在雨中抓紧赶路，找到安全的停车地点"},{"key":"B","text":"因特殊情况不得不冒雨行进，当路面有积水且情况不明时，快速通过不要逗留"},{"key":"C","text":"尽量避开电线杆、路灯等含金属物体，防止因积水导电引发触电事故"},{"key":"D","text":"当发现上游来水突然变得浑浊且水位快速上涨时，呆在车里，避免被水冲走"}],"answer":"C","keys":["C"],"explanation":"(1)避免雨中赶路：尽量不在雨中赶路，减少不必要的风险；(2)做好探路工作：若因特殊情况不得不冒雨行进，要特别注意沿途可能存在的安全隐患。当路面有积水且情况不明时，不可轻易踏足，要先利用树枝、木棍等工具进行探路，判断积水深度和地面状况；(3)避开危险物体：尽量避开电线杆、路灯等含金属物体，防止因积水导电引发触电事故；(4)警惕山洪或泥石流：当发现上游来水突然变得浑浊且水位快速上涨时，要高度警惕山洪或泥石流的发生，迅速引导旅游者向高地或指定安全区域转移。","type":"单选题"},{"number":89,"stem":"世界上第一家商业性旅行社成立于( )年。","options":[{"key":"A","text":"1841"},{"key":"B","text":"1845"},{"key":"C","text":"1846"},{"key":"D","text":"1865"}],"answer":"B","keys":["B"],"explanation":"1845在莱斯特创办了世界上第一家商业性旅行社。","type":"单选题"},{"number":90,"stem":"1927年，中国第一家旅行社(中国旅行社)的创始人是( )。","options":[{"key":"A","text":"陈光甫"},{"key":"B","text":"托马斯·库克"},{"key":"C","text":"顾拜旦"},{"key":"D","text":"李建武"}],"answer":"A","keys":["A"],"explanation":"1927 年 6 月：旅游部独立更名为“中国旅行社”，标志中国近代旅游企业化，陈光甫被尊为“中国近代旅游业的创始人”。","type":"单选题"},{"number":91,"stem":"( )年起，国家开始举办导游资格考试。","options":[{"key":"A","text":"1988"},{"key":"B","text":"1989"},{"key":"C","text":"1994"},{"key":"D","text":"1999"}],"answer":"B","keys":["B"],"explanation":"1989年：举行全国导游资格考试(每年一次)。","type":"单选题"},{"number":92,"stem":"导游能够及时准确反馈旅游者意见，帮助旅行社和旅游行政部门了解需求，及时发现和解决问题，提升服务水平与竞争力，这是导游( )的集中体现。","options":[{"key":"A","text":"纽带作用"},{"key":"B","text":"标志作用"},{"key":"C","text":"反馈作用"},{"key":"D","text":"扩散作用"}],"answer":"C","keys":["C"],"explanation":"反馈作用：1.收集反馈信息•及时准确反馈旅游者意见/建议/要求(涉及行程合理性、住宿舒适度、餐饮满意度等)至相关部门；2.促进质量提升•帮助旅行社和旅游行政部门了解需求，针对性提升服务质量和满意度；3.强化行业监管•加强旅游行业自我监督和管理，及时发现解决问题，提升服务水平与竞争力，导游需积极收集传递信息，推动行业健康发展。","type":"单选题"},{"number":93,"stem":"下列选项中，按照就业方式划分的是( )。","options":[{"key":"A","text":"领队"},{"key":"B","text":"中文导游"},{"key":"C","text":"专职导游"},{"key":"D","text":"高级导游"}],"answer":"C","keys":["C"],"explanation":"按照就业方式划分：旅行社专职导游和旅行社兼职导游。","type":"单选题"},{"number":94,"stem":"在工作场合尤其要注意礼貌，一般接打电话不超过( )。","options":[{"key":"A","text":"1分钟"},{"key":"B","text":"2分钟"},{"key":"C","text":"3分钟"},{"key":"D","text":"5分钟"}],"answer":"C","keys":["C"],"explanation":"通话时间以短为佳、宁短勿长，一般限定在 3分钟之内。","type":"单选题"},{"number":95,"stem":"下列选项中，对于握手顺序描述正确的是( )。","options":[{"key":"A","text":"平辈之间，男士为了尊重女士，应先伸手"},{"key":"B","text":"晚辈见到长辈，应率先伸出双手握手"},{"key":"C","text":"若与多人握手，顺序是先长辈后晚辈，先客人后主人，先上级后下级，先女士后男士"},{"key":"D","text":"宾主之间，作为主人，对到来的客人，先伸出手握手"}],"answer":"D","keys":["D"],"explanation":"一般讲究“尊者决定”；即待女士、长辈、职位高者伸出手之后，男士、晚辈、职位低者方可伸手去呼应；平辈之间，应主动握手；宾主之间，作为主人，对到来的客人，不论男女、长幼，均应先伸出手去，表示热烈欢迎；若一个人要与许多人握手，顺序是：先长辈后晚辈，先主人后客人，先上级后下级，先女士后男士。","type":"单选题"},{"number":96,"stem":"导游应该选择中性色或者饱和度低的着装，例如( )。","options":[{"key":"A","text":"黑、白、蓝"},{"key":"B","text":"黑、白、灰"},{"key":"C","text":"红、白、蓝"},{"key":"D","text":"绿、蓝、灰"}],"answer":"B","keys":["B"],"explanation":"导游着装主色调可选择中性色(黑、白、灰、藏青等)或低饱和度颜色。","type":"单选题"},{"number":97,"stem":"地陪导游在接团前，应该做好的心理准备有( )。","options":[{"key":"A","text":"准备面对艰苦复杂的工作"},{"key":"B","text":"准备面对司机的挑刺"},{"key":"C","text":"准备面对组团社的问责"},{"key":"D","text":"准备面对旅游局的检查"}],"answer":"A","keys":["A"],"explanation":"心理准备：树立带好旅游团的自信；准备面对艰苦复杂的工作；准备可能面对抱怨和投诉。","type":"单选题"},{"number":98,"stem":"旅游团抵达前，地陪应与司机联系，确保提前( )抵达接站地点。","options":[{"key":"A","text":"10分钟"},{"key":"B","text":"20分钟"},{"key":"C","text":"30分钟"},{"key":"D","text":"60分钟"}],"answer":"C","keys":["C"],"explanation":"地陪应与司机联系，确保提前 30分钟抵达接站地点。","type":"单选题"},{"number":99,"stem":"下列选项中，不属于离店服务内容的是( )。","options":[{"key":"A","text":"提醒注意事项"},{"key":"B","text":"办理退房手续"},{"key":"C","text":"集合登车"},{"key":"D","text":"商定出发时间"}],"answer":"D","keys":["D"],"explanation":"离店服务：提醒注意事项；办理退房手续；集合登车。","type":"单选题"},{"number":100,"stem":"下列选项中，地陪导游为游客提供餐饮服务正确的一项是( )。","options":[{"key":"A","text":"在用自助餐时，提醒游客多拿少次，避免游客排队"},{"key":"B","text":"用餐过程中，地陪不应去巡视，避免打扰游客用餐"},{"key":"C","text":"地陪应严格按照团队人数、标准、饮用酒水数量等核实餐厅开列的账单"},{"key":"D","text":"用餐中如菜品中有异物(头发、虫子等)，地陪要及时向餐厅反映并立即换菜"}],"answer":"D","keys":["D"],"explanation":"巡视次数：用餐过程中，地陪应巡视旅游团用餐情况 1—2 次；引导文明用餐：引导旅游者文明用餐、使用公筷公勺。在用自助餐时，倡导旅游者“厉行节约，反对浪费”；异物问题处理：针对旅游者在用餐中出现的问题和要求，如菜品中有异物(头发、虫子等)，地陪要及时向餐厅反映并立即换菜，必要时要求餐厅负责人出面赔礼道歉并给予适当补偿；用餐结束后，地陪应严格按照实际用餐人数、标准、饮用酒水数量等核实餐厅开列的账单，直接付款或在结算单上签字。","type":"单选题"},{"number":101,"stem":"全陪为游客提供入住饭店服务，内容正确的是( )。","options":[{"key":"A","text":"全陪直接提供团名、团队名单表给饭店"},{"key":"B","text":"拿到房卡后，全陪根据准备好的分房名单分发房卡"},{"key":"C","text":"请领队告知客人将贵重物品存放在饭店前台或房内保险柜中"},{"key":"D","text":"如单位组团出游，请旅游团的相关负责人分配住房"}],"answer":"D","keys":["D"],"explanation":"协助地陪导游向饭店前台提供团名、团队名单表、旅游者证件、旅游团住房要求等，快速办理入住手续。拿到房卡后，全陪要协助领队根据准备好的分房名单分发房卡；提醒游客住店期间注意安全，将贵重物品存放在饭店前台或房内保险柜中；单位组团：则请旅游团的相关负责人分配住房。","type":"单选题"},{"number":102,"stem":"境内迎接旅游团，全陪应该提前()到达组团社与游客事先约定的集合地点，手举社旗等候游客的到来。","options":[{"key":"A","text":"10分钟"},{"key":"B","text":"20分钟"},{"key":"C","text":"30分钟"},{"key":"D","text":"40分钟"}],"answer":"C","keys":["C"],"explanation":"境内迎接旅游团，全陪应该提前 30 分钟到达组团社与游客事先约定的集合地点，手举社旗等候游客的到来。","type":"单选题"},{"number":103,"stem":"在红色旅游景点参观时，可以用“英勇无畏”形容革命斗士，用“冥顽不灵”形容敌对分子，而不能反过来使用。这是导游语言准确性中( )的体现。","options":[{"key":"A","text":"思想观点准确"},{"key":"B","text":"讲解内容准确"},{"key":"C","text":"遣词造句准确"},{"key":"D","text":"语音语调准确"}],"answer":"C","keys":["C"],"explanation":"遣词造句准确：词语感情色彩使用准确。例如在红色旅游景点参观时，可以用“英勇无畏”形容革命斗士，而用“冥顽不灵”形容敌对分子，而不能反过来使用。","type":"单选题"},{"number":104,"stem":"2011年 6 月 24 日，中国“杭州西湖文化景观”被正式列入《世界遗产名录》。世界遗产委员会认为：“杭州西湖文化景观是文化景观的一个杰出典范，极为清晰地展现了中国景观的美学思想，对中国乃至世界的园林设计影响深远。”这段导游词是修饰化引用中的( )。","options":[{"key":"A","text":"明引"},{"key":"B","text":"暗引"},{"key":"C","text":"意引"},{"key":"D","text":"他引"}],"answer":"A","keys":["A"],"explanation":"明引直接引用原文，并在原文基础上加上引号，其特点是出处明确，具有较强的说服力。题干中：在介绍西湖的讲解词中，引用了联合国教科文组织的评价，增加了表达的信服度。","type":"单选题"},{"number":105,"stem":"关于救生衣的存放和标识，描述正确的是( )。","options":[{"key":"A","text":"儿童救生衣的外面应有明显耐久的“儿童专用”字样，内侧不需要"},{"key":"B","text":"为应急需要，救生衣应直接暴露在室外环境，方便取拿"},{"key":"C","text":"集中存放时，儿童救生衣应与成人救生衣放置在一起"},{"key":"D","text":"儿童救生衣的存放位置应清楚标明“儿童救生衣”字样"}],"answer":"D","keys":["D"],"explanation":"救生衣应以明显耐久的字迹标明其型号、制造厂名、制造编号、制造年月及检验单位的标志；儿童救生衣的内外两面，均应有明显耐久的“儿童专用”字样；救生衣存放位置有明显和永久性的标示，儿童救生衣的存放位置应清楚标明“儿童救生衣”字样；救生衣存放在甲板等露天开敞处所时应置于救生衣柜等装置中，不可直接暴露在室外环境；客舱内应存放与乘客等额数量的救生衣；集中存放时儿童救生衣应与成人救生衣分开放置。","type":"单选题"},{"number":106,"stem":"三峡工程是世界上施工期最长、建筑规模最大的水利工程；三峡水电站是世界上最大的水电站；三峡工程泄洪闸是世界上泄洪能力最强的泄洪闸；三峡工程对外专用公路是国内工程项目最齐全的公路。这段话是导游讲解方法中突出重点法的( )。","options":[{"key":"A","text":"突出独特之处"},{"key":"B","text":"突出有代表性部分"},{"key":"C","text":"突出旅游者感兴趣的内容"},{"key":"D","text":"突出“最”“第一”"}],"answer":"D","keys":["D"],"explanation":"突出“最”“第一”。举例：三峡工程是世界上施工期最长、建筑规模最大的水利工程；三峡水电站是世界上最大的水电站；三峡工程泄洪闸是世界上泄洪能力最强的泄洪闸；三峡工程对外专用公路是国内工程项目最齐全的公路。","type":"单选题"},{"number":107,"stem":"导游在讲解中借题发挥，不仅要介绍景物，更要借助景物引发情感，升华精神。这是导游在讲解中运用了( )。","options":[{"key":"A","text":"虚实结合法"},{"key":"B","text":"触景生情法"},{"key":"C","text":"画龙点睛法"},{"key":"D","text":"制造悬念法"}],"answer":"B","keys":["B"],"explanation":"触景生情法是导游在讲解中见物生情、借题发挥的方法。其核心在于“生情”，导游不仅要介绍景物，更要借助景物引发情感，升华精神，让旅游者感受到景中有情、情中有景。","type":"单选题"},{"number":108,"stem":"导游老王带团临近结束时，可以采用( )的方法，影响旅游者对导游的看法。","options":[{"key":"A","text":"首因效应"},{"key":"B","text":"保持效应"},{"key":"C","text":"近因效应"},{"key":"D","text":"尾端效应"}],"answer":"C","keys":["C"],"explanation":"与首因效应相对，心理学领域还有近因效应，指在人际交往中，印象形成主要取决于后来出现的部分，即最后印象。","type":"单选题"},{"number":109,"stem":"下列对游客景区游览消防安全注意事项的描述，正确的一项是( )。","options":[{"key":"A","text":"如果在草木繁盛的区域进行烧烤，事后要进行彻底灭火"},{"key":"B","text":"不违规燃放烟花爆竹"},{"key":"C","text":"可以施放氢气球，但是孔明灯不可以"},{"key":"D","text":"可以携带火种上山，但是非必要不使用"}],"answer":"B","keys":["B"],"explanation":"游览景区、公共文化场馆、文物保护单位等场所时，严格遵守消防及各类安全管理规定；不在草木繁盛、树叶堆积等易燃物聚集地或有防火提示的地方吸烟、烧烤或者使用明火；不违规燃放烟花爆竹，不施放孔明灯、氢气球；户外活动注意防火避灾，不带火种上山。","type":"单选题"},{"number":110,"stem":"导游领队对游客进行合理引导时，操作正确的是( )。","options":[{"key":"A","text":"关注游客的行为，随时对他们不当的行为进行批评教育"},{"key":"B","text":"对未成年人较多的团队，侧重对孩子的引导，避免发生不文明行为"},{"key":"C","text":"对无出境记录游客，应特别提醒旅游目的地风俗禁忌和礼仪习惯"},{"key":"D","text":"对游客的提出的批评和意见，采用拖延法处理"}],"answer":"C","keys":["C"],"explanation":"导游领队应有维护文明旅游的主动性和自觉性，关注游客的言行举止，在适当时机对游客进行相应提醒、警示、劝告；对未成年人较多的团队，应侧重对家长的引导，并需特别关注未成年人特点，避免损坏公物、喧哗吵闹等不文明现象发生；对无出境记录游客，应特别提醒旅游目的地风俗禁忌和礼仪习惯，以及出入海关、边防(移民局)的注意事项，提前告知和提醒；对游客的正确批评和合理意见，导游领队应认真听取，虚心接受。","type":"单选题"},{"number":111,"stem":"古代，无数能工巧匠汇聚于此，在崇山峻岭间，一块块巨大的石砖被艰难搬运，那段城墙，就像一位岁月的老人，默默诉说着当年劳动人民不屈不挠的抗争故事，他们为了抵御外敌，付出无数心血，才筑起了这雄伟壮观、横亘万里的长城，它见证了历史风云变幻，承载着中华民族坚韧不拔的精神。这段话采用了( )的讲解，引人入胜。","options":[{"key":"A","text":"细节化"},{"key":"B","text":"情节化"},{"key":"C","text":"比喻化"},{"key":"D","text":"夸张化"}],"answer":"B","keys":["B"],"explanation":"情节化：将平淡无奇的内容故事化，可以大幅提升导游语言的生动性。在讲述故事时，可以适当设置层层推进的逻辑关系和环环相扣的悬念，营造出引人入胜的情节。","type":"单选题"},{"number":112,"stem":"下列对地陪和领队协作的描述，错误的一项是( )。","options":[{"key":"A","text":"尊重领队，遇事多磋商"},{"key":"B","text":"赞赏领队，调动积极性"},{"key":"C","text":"关心领队，建立工作友谊"},{"key":"D","text":"指导领队，做好分内事务"}],"answer":"D","keys":["D"],"explanation":"地陪和领队协作：尊重领队，遇事多磋商；赞赏领队，调动积极性；关心领队，建立工作友谊；提醒领队，做好分内事务。","type":"单选题"},{"number":113,"stem":"关于变更交通工具类型的描述，正确的是( )。","options":[{"key":"A","text":"旅游者因乘坐舒适程度问题要求更换交通工具，通常要积极配合，尽量协调"},{"key":"B","text":"如仅更换交通工具等级，在有余票的情况下，可帮助更换"},{"key":"C","text":"更换交通工具等级，若有余票，无需联系旅行社，导游自行帮助更换即可"},{"key":"D","text":"更换交通方式所产生的损失费用以及新交通方式的全部费用旅行社和游客各承担一半"}],"answer":"B","keys":["B"],"explanation":"1.要求更换交通工具类型和出行时间。一般情况不能答应更换：除非在自然灾害、误车(机、船)等特殊情况下，一般都不能答应更换。旅途中票务预订、退换较为烦琐，短时间内很难满足。更换出行时间：与上述处理方式相同。2.要求提高交通工具等级：如提高舱位、座位等级等。有余票时可帮忙更换：导游应首先与接待社计调部门联系，若有所要求等级的舱位、座位余票可帮忙更换，但须告知该旅游者差价及相关费用自理。","type":"单选题"},{"number":114,"stem":"旅游者中暑，导游可采用的措施有( )。","options":[{"key":"A","text":"失去意识者避免平躺，应采取坐姿休息"},{"key":"B","text":"症状轻微可扇风散热，面色潮红发烧时用凉水擦拭身体降温"},{"key":"C","text":"患者病症重，经处理后送回酒店休息"},{"key":"D","text":"服用导游自备的解暑药"}],"answer":"B","keys":["B"],"explanation":"1.转到阴凉环境：移至阴凉通风处，意识清醒者坐姿休息，支撑头与肩部；失去意识者平躺干爽位置，解开衣领，放松裤带；2.进行物理降温：症状轻微可扇风散热，面色潮红发烧时用凉水擦拭身体降温；3.采取药物治疗：症状未缓解，征询旅游者或亲友意见，服用自带防暑药物，进一步观察；4.及时送医治疗：患者病症重，经处理后症状未改善，及时送往医院进一步治疗。","type":"单选题"},{"number":115,"stem":"为了避免游客发生伤病，导游操作正确的是( )。","options":[{"key":"A","text":"身体不佳者，建议中途退团"},{"key":"B","text":"多提醒旅游者注意饮食卫生，可以多吃当地美食，但是路边摊要适当吃"},{"key":"C","text":"安排合理游览线路和节奏，避免过度劳累，不要安排夜晚娱乐活动"},{"key":"D","text":"对风险环境或行为，及时明确警示旅游者"}],"answer":"D","keys":["D"],"explanation":"1.关注旅游者健康状况，旅游过程中，随时观察旅游者健康，身体不佳者建议及时休息或就医，早发现早处理隐患。2.安排游览活动应劳逸结合，根据旅游者身体、精神状态，安排合理游览线路和节奏，避免过度劳累，夜晚娱乐活动不宜过长过晚；3.安全警示应及时明确，对风险环境或行为，及时明确警示旅游者，如禁止危险拍照、嬉闹等。登高涉险项目建议量力而行，老幼群体避免参与危险项目。4.提醒旅游者注意饮食卫生，多提醒旅游者注意饮食卫生，不暴饮暴食，多喝开水或矿泉水，食用洗净或去皮水果，不吃路边摊；5.做好天气变化的提醒工作，及时提醒旅游者天气变化，做好应对措施，如暑天防中暑、冬天保暖、晴天防晒、雨天带雨具。","type":"单选题"},{"number":116,"stem":"溺水者昏迷后被救上岸，导游操作正确的一项是( )。","options":[{"key":"A","text":"将失去知觉的溺水者背卧置于地上，头部置于侧位，以便水从口中流出"},{"key":"B","text":"迅速清理掉溺水者口鼻内的堵塞物，使其保持呼吸道畅通"},{"key":"C","text":"可将手掌平放在溺水者胸腹部上方侧脸俯身观察胸腹部是否有起伏，时间约为 10‑ 20 秒"},{"key":"D","text":"立即拨打 120等待医护人员到来，不要对溺水者做任何救护，避免发生二次伤害"}],"answer":"B","keys":["B"],"explanation":"(1)立即拨打 120，若施救人员没有经过专业急救培训，但救人刻不容缓，此时立即拨打 120是较好的办法。一方面可让救护车尽早赶到，另一方面可通过 120 接线人员的指导，进行科学救护，避免溺水者遭受二次伤害；(2)清除溺水者口鼻处异物，将失去知觉的溺水者仰卧置于地上，把头部置于侧位，以便水可以从口中流出。同时，迅速清理掉溺水者口鼻内的堵塞物，使其保持呼吸道畅通；(3)快速判断是否还有呼吸，可将手掌平放在溺水者胸腹部上方作为参照，侧脸俯身观察胸腹部是否有起伏，时间约为 5‑ 10秒；(4)采用心肺复苏术救护，若发现溺水者已经没有呼吸心跳，就应立即采用心肺复苏术进行施救。若现场人员无人能做，导游可继续拨打 120请教心肺复苏术的操作方法，尽可能为溺水者赢得抢救的宝贵时间。","type":"单选题"},{"number":117,"stem":"当旅游客车发生交通事故时，导游应该( )。","options":[{"key":"A","text":"首先将事故上报给旅行社，等待旅行社指示"},{"key":"B","text":"拨打 110报警电话，等待警察到来处理"},{"key":"C","text":"安抚全体旅游者情绪，停止旅游行程"},{"key":"D","text":"立即展开抢救，优先救助伤员"}],"answer":"D","keys":["D"],"explanation":"1.立即组织抢救，事故发生第一时间，立即展开抢救，优先救助伤员。对重伤者，应即刻拨打 120，并在 120指导下进行科学急救；2.保护现场并立即报案，导游需冷静保护事故现场，避免其进一步破坏或污染，同时拨打或安排人员拨打 122报警电话，待交警到达后，协助现场处置；3.迅速上报旅行社，及时将事故情况上报旅行社，按旅行社建议与安排处理现场问题；4.做好安抚工作，安抚全体旅游者情绪，根据事故情况和旅游者意愿，合理调整后续行程。","type":"单选题"},{"number":118,"stem":"自 2015年 7 月 1 日起，大陆居民往来台湾通行证的有效期为( )。","options":[{"key":"A","text":"1年"},{"key":"B","text":"3年"},{"key":"C","text":"5年"},{"key":"D","text":"10年"}],"answer":"D","keys":["D"],"explanation":"自 2015 年 7 月 1 日起，大陆居民往来台湾通行证的有效期由原来的 5 年调整为 10年。","type":"单选题"},{"number":119,"stem":"外交部全球领事保护与服务应急热线电话是( )。","options":[{"key":"A","text":"12308"},{"key":"B","text":"12301"},{"key":"C","text":"12345"},{"key":"D","text":"12395"}],"answer":"A","keys":["A"],"explanation":"外交部全球领事保护与服务应急热线:+86‑ 10‑ 12308(24小时)。","type":"单选题"},{"number":120,"stem":"下列人员中，可以走绿色通道的是( )。","options":[{"key":"A","text":"因私出国的中国公民"},{"key":"B","text":"不知道如何选择通道的人员"},{"key":"C","text":"持有礼遇签证的人员"},{"key":"D","text":"持普通公务护照出境的中国公民"}],"answer":"C","keys":["C"],"explanation":"绿色通道(“免税通道”或“无申报通道”)：携带无须向海关申报物品的旅游者以及持有外交签证或礼遇签证的人员，可选择“绿色通道”通关，但需向海关出示本人证件和按规定填写申报单据。","type":"单选题"},{"number":121,"stem":"一名 17 周岁的英国游客，可以携带烟酒的上限是( )。","options":[{"key":"A","text":"香烟 200支或雪茄 10 支或烟丝 250 克"},{"key":"B","text":"香烟 40 支或雪茄 2 支或烟丝 40克"},{"key":"C","text":"12度以上酒精饮料 1 瓶"},{"key":"D","text":"香烟 400支或雪茄 20 支烟丝 500克"}],"answer":"D","keys":["D"],"explanation":"其他入境旅客：香烟 400 支或雪茄 20 支或烟丝 500 克；12 度以上酒精饮料:≤1.5升。","type":"单选题"},{"number":122,"stem":"中国南方航空公司的英文代码是( )。","options":[{"key":"A","text":"CA"},{"key":"B","text":"MU"},{"key":"C","text":"CZ"},{"key":"D","text":"SD"}],"answer":"C","keys":["C"],"explanation":"中国南方航空股份有限公司(CZ)。","type":"单选题"},{"number":123,"stem":"对于城际列车字母表示正确的一项是( )。","options":[{"key":"A","text":"C"},{"key":"B","text":"D"},{"key":"C","text":"Z"},{"key":"D","text":"K"}],"answer":"A","keys":["A"],"explanation":"C 字头——城际动车组列车(城市群短途通勤专线)。","type":"单选题"},{"number":124,"stem":"一对德国夫妇带着不满 2 周岁的三胞胎来中国旅行。如果成人机票价格为 1000元人民币，这个家庭共需要支付( )元购买机票。","options":[{"key":"A","text":"2300"},{"key":"B","text":"2500"},{"key":"C","text":"2700"},{"key":"D","text":"3100"}],"answer":"C","keys":["C"],"explanation":"每名成人 1000元，共计 2000 元，一名成年人可以携带一名不满 2 周岁的婴儿买婴儿票，2 人携带 2 名婴儿，合计 200元，其中一名婴儿需要买儿童票，500元，所以家庭共计支付 2000+200+500=2700元。","type":"单选题"},{"number":125,"stem":"为了避免发生高原反应，导游告知游客应( )。","options":[{"key":"A","text":"坚持每天洗澡，早睡早起"},{"key":"B","text":"每天至少补水 6000毫升"},{"key":"C","text":"如发生失眠，可以适当服安全助眠药物"},{"key":"D","text":"禁止在高原上跑步，但是可以通过疾走锻炼身体"}],"answer":"C","keys":["C"],"explanation":"少洗或不洗澡；每天至少补水 4000 毫升；禁止:疾速行走、跑步、体力劳动。2026导游资格证冲刺提升卷三｜政策与法律法规+导游业务（续）二、单项选择题（续）","type":"单选题"},{"number":126,"stem":"下列人群中，不适宜泡温泉的人群是( )。","options":[{"key":"A","text":"糖尿病患者"},{"key":"B","text":"饮酒客人"},{"key":"C","text":"有高血压或心脑血管病的病人"},{"key":"D","text":"癌症、白血病患者"}],"answer":"D","keys":["D"],"explanation":"不适宜泡温泉的情形：癌症、白血病患者不宜泡温泉(刺激新陈代谢加速身体虚弱)；皮肤伤口/溃烂/真菌感染(足癣、湿疹)、过敏性皮肤病患者不宜(防伤口恶化或荨麻疹)；女性生理期及其前后、怀孕初期/末期不宜；睡眠不足、熬夜、营养不良、大病初愈等疲惫状态不宜(防脑部缺血或休克)。","type":"单选题"},{"number":127,"stem":"对于开展研学旅游之前的注意事项，描述错误的是( )。","options":[{"key":"A","text":"导游应协助活动学校制定研学旅行安全应急预案"},{"key":"B","text":"导游应配合活动学校成立安全工作组"},{"key":"C","text":"导游应召开研学旅行活动行前说明会"},{"key":"D","text":"导游应提前熟悉研学旅行活动的地点，但无需进行实地勘查"}],"answer":"D","keys":["D"],"explanation":"导游应提前熟悉研学旅行活动的地点，进行实地勘查，制定安全合理的活动路线和方案，以确保活动安全。","type":"单选题"},{"number":128,"stem":"下列情形中，旅行社不能免责的是( )。","options":[{"key":"A","text":"因游客自身疾病导致损失或损害"},{"key":"B","text":"因游客个人过错导致的人身伤亡、财物损失及衍生费用"},{"key":"C","text":"游客签约时已声明且旅行社接受需照顾的情形，工作人员未尽到照顾义务"},{"key":"D","text":"游客自行终止旅游行程发生的人身、财物损害"}],"answer":"C","keys":["C"],"explanation":"旅行社免责情形：情形一：游客自身健康问题：游客应确保自身身体条件适合旅游活动，因自身疾病导致损失或损害，旅行社不担责，例外：游客签约时已声明且旅行社接受需照顾的情形，而旅行社及其工作人员未尽到照顾义务除外；情形二：游客未履行安全义务：游客参加活动时需服从导游或领队安排，注意自身及随行未成年人安全，妥善保管财物，因游客个人过错导致的人身伤亡、财物损失及衍生费用，旅行社不承担责任；情形三：游客自行脱离行程：游客自行终止旅游行程或未参加约定活动自行行动时发生的人身、财物损害，旅行社不担责。","type":"单选题"},{"number":129,"stem":"海南离岛免税政策，是指对年满()的国内外旅客实行限值、限量、限品种免进口税购物的税收优惠政策。","options":[{"key":"A","text":"16周岁"},{"key":"B","text":"17周岁"},{"key":"C","text":"18周岁"},{"key":"D","text":"20周岁"}],"answer":"A","keys":["A"],"explanation":"海南离岛免税政策是指对乘飞机、火车、轮船离岛(不包括离境)年满 16周岁的国内外旅客实行限值、限量、限品种免进口税购物，在实施离岛免税政策的免税商店内或经批准的网上销售窗口付款，在机场、火车站、港口码头指定区域提货离岛的税收优惠政策。","type":"单选题"},{"number":130,"stem":"从莫斯科当地时间20点起飞的客机，飞行8个小时以后落地北京，此时北京时间为( )。","options":[{"key":"A","text":"次日上午 8 时"},{"key":"B","text":"次日上午 9 时"},{"key":"C","text":"次日上午 10 时"},{"key":"D","text":"次日上午 11 时"}],"answer":"B","keys":["B"],"explanation":"莫斯科比北京晚了 5个小时，因此起飞时北京为次日凌晨 1 点，飞行 8个小时，就是上午 9时。三、多项选择题（131‑ 165题）","type":"单选题"},{"number":131,"stem":"根据《中华人民共和国宪法》的规定，我国宪法确立的基本原则包括( )。","options":[{"key":"A","text":"党的领导原则"},{"key":"B","text":"人民主权原则"},{"key":"C","text":"法治原则"},{"key":"D","text":"民主集中制原则"},{"key":"E","text":"三权分立原则"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"我国宪法确立了四项基本原则，它们相互联系、有机统一，构成国家治理体系的制度基石，即党的领导原则、人民主权原则、法治原则、民主集中制原则。E项错误，三权分立是西方资本主义国家的政权组织原则，我国宪法确立的是民主集中制原则，不实行三权分立。","type":"多选题"},{"number":132,"stem":"《宪法》规定，公民在( )的情况下，有从国家和社会获得物质帮助的权利。","options":[{"key":"A","text":"年老"},{"key":"B","text":"未成年"},{"key":"C","text":"疾病"},{"key":"D","text":"丧失劳动能力"},{"key":"E","text":"残疾"}],"answer":"ACD","keys":["A","C","D"],"explanation":"《宪法》在公民的物质帮助权中规定：公民在年老、疾病或者丧失劳动能力的情况下，有从国家和社会获得物质帮助的权利。","type":"多选题"},{"number":133,"stem":"根据《旅游法》的规定，当旅游者数量可能达到最大承载量时，以下说法正确的是( )。","options":[{"key":"A","text":"景区应当提前公告，并及时向当地人民政府报告"},{"key":"B","text":"如未依法采取措施，由旅游主管部门责令改正"},{"key":"C","text":"景区和当地人民政府应当及时采取疏导、分流等措施"},{"key":"D","text":"景区是流量控制的主体"},{"key":"E","text":"公示并相应减少收费"}],"answer":"CD","keys":["C","D"],"explanation":"“景区应当提前公告，并及时向当地人民政府报告”应把“及时”改为“同时”。《旅游法》第 45 条，旅游者数量可能达到最大承载量时，景区应当提前公告并同时向当地人民政府报告，景区和当地人民政府应当及时采取疏导、分流等措施。第 105条，景区在旅游者数量可能达到最大承载量时，未依照本法规定公告或者未向当地人民政府报告，未及时采取疏导、分流等措施，或者超过最大承载量接待旅游者的，由景区主管部门责令改正，情节严重的，责令停业整顿一个月至六个月。","type":"多选题"},{"number":134,"stem":"根据《旅游法》的规定，由于不可抗力或者旅行社、履行辅助人已尽合理注意义务仍不能避免的事件导致旅游者滞留时，关于相关费用和责任的承担，以下说法正确的是( )。","options":[{"key":"A","text":"在发生危及旅游者人身、财产安全的情况下，旅行社应当采取相应的安全措施，因此支出的费用，由旅行社与旅游者分担"},{"key":"B","text":"在造成旅游者滞留的情况下，旅行社应当采取相应的安置措施，因此增加的食宿费用，由旅游者自行承担"},{"key":"C","text":"在造成旅游者滞留的情况下，旅行社应当采取相应的安置措施，因此增加的食宿费用，由双方分担"},{"key":"D","text":"在发生危及旅游者人身、财产安全的情况下，旅行社应当采取相应的安全措施，因此支出的费用，由旅游者承担"},{"key":"E","text":"增加的返程费用，由旅游者承担"}],"answer":"AB","keys":["A","B"],"explanation":"《旅游法》第 67 条第 3项和第 4项分别做了相应的规定。即在发生危及旅游者人身、财产安全的情况下，旅行社应当采取相应的安全措施，因此支出的费用，由旅行社与旅游者分担；在造成旅游者滞留的情况下，旅行社应当采取相应的安置措施，因此增加的食宿费用，由旅游者承担；增加的返程费用，由旅行社与旅游者分担。在此情况下造成的滞留，增加的食宿费用，由旅游者承担；在此情况下造成滞留，返程费用本身就包含在旅游行程费用中，因此应由旅行社承担，而增加的返程费用，则由双方分担。","type":"多选题"},{"number":135,"stem":"根据《民法典》的规定，当合同约定不明确，且无法通过协议补充或者其他方式确定时，正确的规定是( )。","options":[{"key":"A","text":"质量要求不明确的，首先按照国家强制性标准履行"},{"key":"B","text":"履行地点不明确，给付货币的，在接受货币一方所在地履行"},{"key":"C","text":"履行地点不明确，交付不动产的，在不动产所在地履行"},{"key":"D","text":"履行期限不明确的，债务人可以随时履行"},{"key":"E","text":"价款不明确的，按照合同订立地的市场价格履行"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"“价款不明确的……”错误，价款或者报酬不明确的，按照订立合同时履行地的市场价格履行。","type":"多选题"},{"number":136,"stem":"下列关于旅行社违反《中华人民共和国旅游法》需要承担法律责任的表述，正确的是( )。","options":[{"key":"A","text":"进行虚假宣传，违法所得 5万元以上的，并处违法所得 1 倍以上 5 倍以下罚款"},{"key":"B","text":"向不合格的供应商订购产品和服务的，并处 1万元以上 10 万元以下罚款"},{"key":"C","text":"要求导游垫付费用情节严重的，责令停业整顿或者吊销营业执照"},{"key":"D","text":"未按照规定投保旅行社责任保险的，责令停业整顿"},{"key":"E","text":"未向临时聘用的导游支付导游服务费用的，并处 5000 元以上 5 万元以下罚款"}],"answer":"AE","keys":["A","E"],"explanation":"“向不合格的供应商订购产品和服务的”“未按照规定投保旅行社责任保险的”由旅游主管部门或者有关部门责令改正，没收违法所得，并处 5000 元以上 5 万元以下罚款；违法所得 5万元以上的，并处违法所得 1 倍以上 5 倍以下罚款；情节严重的，责令停业整顿或者吊销旅行社业务经营许可证；对直接负责的主管人员和其他直接责任人员，处 2000 元以上2万元以下罚款。","type":"多选题"},{"number":137,"stem":"依据《导游人员管理条例》，导游人员可以调整或者变更接待计划的是( )。","options":[{"key":"A","text":"在征得旅行社同意后"},{"key":"B","text":"在向旅游主管部门备案后"},{"key":"C","text":"在遇有可能危及旅游者人身安全的紧急情形时"},{"key":"D","text":"在引导旅游者旅行、游览过程中"},{"key":"E","text":"在征得多数旅游者同意后"}],"answer":"CDE","keys":["C","D","E"],"explanation":"《导游人员管理条例》第 13 条规定，导游人员在引导旅游者旅行、游览过程中，遇有可能危及旅游者人身安全的紧急情形时，经征得多数旅游者的同意，可以调整或者变更接待计划，但是应当立即报告旅行社。","type":"多选题"},{"number":138,"stem":"根据《旅游法》的规定，旅行社应当与其聘用的导游依法( )。","options":[{"key":"A","text":"订立劳动合同"},{"key":"B","text":"支付劳动报酬"},{"key":"C","text":"全额支付导游服务费"},{"key":"D","text":"缴纳社会保险费用"},{"key":"E","text":"提供企业福利"}],"answer":"ABD","keys":["A","B","D"],"explanation":"《旅游法》第 38条规定，旅行社应当与其聘用的导游依法订立劳动合同，支付劳动报酬，缴纳社会保险费用。","type":"多选题"},{"number":139,"stem":"依据《中华人民共和国消费者权益保护法实施条例》，关于无理由退货的规定，下列说法正确的有( )。","options":[{"key":"A","text":"经营者应当以显著方式标注不适用无理由退货的商品"},{"key":"B","text":"可将不适用无理由退货设置为消费者默认同意选项"},{"key":"C","text":"消费者查验商品，合理调试，未破坏原有品质、功能、外观的，经营者应当退货"},{"key":"D","text":"消费者打开商品包装，则无法适用于无理由退货"},{"key":"E","text":"未经消费者确认，经营者不得拒绝无理由退货"}],"answer":"ACE","keys":["A","C","E"],"explanation":"A项正确：经营者应当以显著方式对不适用无理由退货的商品进行标注，符合法条规定。B 项错误：条例明确禁止将不适用无理由退货设置为消费者默认同意的选项，该项与法律规定相悖。C 项正确：消费者基于查验需要打开商品包装，或者为确认商品品质、功能进行合理调试，不影响商品原有品质、功能和外观的，经营者应当予以退货。D 项错误。E 项正确：未经消费者确认，经营者不得拒绝无理由退货，符合法条规定。","type":"多选题"},{"number":140,"stem":"根据《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》，以下情形中旅游经营者需要承担赔偿责任的是( )。","options":[{"key":"A","text":"旅游经营者对旅游辅助服务者未尽谨慎选择义务"},{"key":"B","text":"旅游经营者、旅游辅助服务者未尽到安全保障义务，造成旅游者财产损失"},{"key":"C","text":"旅游经营者擅自将其旅游业务转让给其他旅游经营者，旅游者在旅游过程中遭受损害"},{"key":"D","text":"旅游经营者准许他人挂靠其名下从事旅游业务，造成旅游者人身损害"},{"key":"E","text":"旅游公司大巴车延误，导致旅游合同不能按约履行"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"《最高院关于审理旅游纠纷案件的规定》第 18条规定，因飞机、火车、班轮、城际客运班车等公共客运交通工具延误，导致合同不能按照约定履行，旅游者请求旅游经营者退还未实际发生的费用的，人民法院应予支持。“旅游公司大巴车延误，……”，旅游公司大巴车不是“公共交通工具”，它属于旅游公司的履行辅助人，因此旅游经营者需要承担责任。","type":"多选题"},{"number":141,"stem":"《旅游安全管理办法》规定，根据旅游突发事件的( )，一般将旅游突发事件分为四个等级。","options":[{"key":"A","text":"性质"},{"key":"B","text":"类别"},{"key":"C","text":"危害程度"},{"key":"D","text":"造成或者可能造成的影响"},{"key":"E","text":"可控性"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"《旅游安全管理办法》第 39 条第 2 款规定，根据旅游突发事件的性质、危害程度、可控性以及造成或者可能造成的影响，旅游突发事件一般分为特别重大、重大、较大和一般四级。","type":"多选题"},{"number":142,"stem":"依据《中华人民共和国食品安全法》，县级以上地方人民政府隐瞒、谎报、缓报食品安全事故的，对相关责任人的处罚是( )。","options":[{"key":"A","text":"情节较重的，给予降级或者撤职处分"},{"key":"B","text":"情节严重的，其主要负责人还应当引咎辞职"},{"key":"C","text":"对直接负责的主管人员给予记过处分"},{"key":"D","text":"对其他直接责任人员给予记过处分"},{"key":"E","text":"情节严重的，给予开除处分"}],"answer":"AE","keys":["A","E"],"explanation":"“情节严重的，其主要负责人还应当引咎辞职”错误，是“造成严重后果的”；“对直接负责的主管人员给予记过处分”“对其他直接责任人员给予记过处分”两项“记过处分”错误，是“记大过”。县级以上地方人民政府有下列行为之一的，对直接负责的主管人员和其他直接责任人员给予记大过处分；情节较重的，给予降级或者撤职处分；情节严重的给予开除处分；造成严重后果的，其主要负责人还应当引咎辞职：(1)对发生在本行政区域内的食品安全事故，未及时组织协调有关部门开展有效处置，造成不良影响或者损失；(2)对本行政区域内涉及多环节的区域性食品安全问题，未及时组织整治，造成不良影响或者损失；(3)隐瞒、谎报、缓报食品安全事故；(4)本行政区域内发生特别重大食品安全事故，或者连续发生重大食品安全事故。","type":"多选题"},{"number":143,"stem":"根据《风景名胜区条例》的规定，风景名胜区总体规划应当包含( )。","options":[{"key":"A","text":"风景资源评价"},{"key":"B","text":"重大建设工程方案"},{"key":"C","text":"游客容量"},{"key":"D","text":"开发利用强度"},{"key":"E","text":"禁止和限制开发的范围"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"《风景名胜区条例》第十三条：风景名胜区总体规划应当包括下列内容：(一)风景资源评价；(二)生态资源保护措施、重大建设项目布局、开发利用强度；(三)风景名胜区的功能结构和空间布局；(四)禁止开发和限制开发的范围；(五)风景名胜区的游客容量；(六)有关专项规划。ACDE选项：符合法条规定，故正确。B 选项：重大建设工程方案，法条表述为“重大建设项目布局”，总体规划不包含工程方案，故错误。","type":"多选题"},{"number":144,"stem":"依据习近平新时代中国特色社会主义思想相关理论，下列属于“十四个坚持”基本方略的有( )。","options":[{"key":"A","text":"坚持总体国家安全观"},{"key":"B","text":"以中国式现代化推进中华民族伟大复兴"},{"key":"C","text":"坚持推动构建人类命运共同体"},{"key":"D","text":"把制度建设贯穿党的各项建设之中"},{"key":"E","text":"坚持人与自然和谐共生"}],"answer":"ACE","keys":["A","C","E"],"explanation":"“十四个坚持”——新时代坚持和发展中国特色社会主义的基本方略。其中第 9条：坚持人与自然和谐共生；第 10条：坚持总体国家安全观；第 13条：坚持推动构建人类命运共同体。“十个明确”第 2 点：以中国式现代化推进中华民族伟大复兴；“十个明确”第 10点：把制度建设贯穿其中，深入推进反腐败斗争。A项正确，坚持总体国家安全观是“十四个坚持”第 10条。B项错误，以中国式现代化推进中华民族伟大复兴属于“十个明确”，不属于“十四个坚持”。C 项正确，坚持推动构建人类命运共同体是“十四个坚持”第 13条。D项错误，把制度建设贯穿其中出自“十个明确”第 10 点，不属于“十四个坚持”。E项正确，坚持人与自然和谐共生是“十四个坚持”第 9 条。","type":"多选题"},{"number":145,"stem":"严格公正司法，需要健全( )各司其职、相互配合、相互制约的体制机制。","options":[{"key":"A","text":"司法行政机关"},{"key":"B","text":"政府机关"},{"key":"C","text":"公安机关"},{"key":"D","text":"检察机关"},{"key":"E","text":"审判机关"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"答案选 ACDE。要健全公安机关、检察机关、审判机关、司法行政机关各司其职、相互配合、相互制约的体制机制。B 项政府机关属于行政机关，不属于该司法权力分工制约体系内的专门机关。","type":"多选题"},{"number":146,"stem":"关于人民英雄纪念碑，以下说法正确的是( )。","options":[{"key":"A","text":"人民英雄纪念碑及其名称、碑题、碑文、浮雕、图形、标志等受法律保护"},{"key":"B","text":"每年的国庆节，国家在人民英雄纪念碑前举行纪念仪式"},{"key":"C","text":"是国家和人民纪念、缅怀英雄烈士的永久性纪念设施"},{"key":"D","text":"长期以来是革命传统教育和爱国主义教育的重要场所"},{"key":"E","text":"展现了自抗日战争以来中国人民浴血奋斗的艰辛历程"}],"answer":"ACD","keys":["A","C","D"],"explanation":"选项“展现了自抗日战争…”错误，人民英雄纪念碑，展现了自鸦片战争以来中国人民浴血奋斗的艰辛历程。","type":"多选题"},{"number":147,"stem":"根据《食品安全法》的规定，县级以上人民政府食品安全监督管理部门接到食品安全事故报告后，应当立即会同有关部门进行调查处理，并采取( )措施。","options":[{"key":"A","text":"开展应急救援工作，组织救治因食品安全事故导致人身伤害的人员"},{"key":"B","text":"对导致食品安全事故的食品及其原料进行清洗消毒"},{"key":"C","text":"对疑似被污染的食品及其原料，责令食品生产经营者召回"},{"key":"D","text":"封存被污染的食品相关产品"},{"key":"E","text":"做好信息发布工作"}],"answer":"ADE","keys":["A","D","E"],"explanation":"“对导致食品安全事故的食品及其原料进行清洗消毒”说法有误，正确的表达是“封存可能导致食品安全事故的食品及其原料”；“对疑似被污染……”，正确的表达是“对确认属于被污染的食品及其原料”。","type":"多选题"},{"number":148,"stem":"导游服务的范围包括( )。","options":[{"key":"A","text":"向导服务"},{"key":"B","text":"讲解服务"},{"key":"C","text":"旅行生活服务"},{"key":"D","text":"销售服务"},{"key":"E","text":"调研服务"}],"answer":"ABC","keys":["A","B","C"],"explanation":"导游服务的范围：向导服务；讲解服务；旅行生活服务。","type":"多选题"},{"number":149,"stem":"地陪导游的主要职责有( )。","options":[{"key":"A","text":"接受导游任务，引导文明旅游"},{"key":"B","text":"进行导游讲解，传播中国文化"},{"key":"C","text":"安排旅游事宜，保护旅游者安全"},{"key":"D","text":"联络工作"},{"key":"E","text":"宣传、调研工作"}],"answer":"ABC","keys":["A","B","C"],"explanation":"接受导游任务，引导文明旅游；进行导游讲解，传播中国文化；安排旅游事宜，保护旅游者安全；反映意见要求，安排相关活动；解答旅游者问询，处理相关问题。","type":"多选题"},{"number":150,"stem":"地陪和领队(全陪)核对、商定行程时出现问题，地陪导游应该( )。","options":[{"key":"A","text":"领队或旅游者提出小的修改意见或增加新的游览项目时，地陪应及时向旅行社反映"},{"key":"B","text":"修改意见或增加新的游览项目需要费用时，地陪要事先讲明，按有关规定收取费用"},{"key":"C","text":"增加新的游览项目确有困难且无法满足的要求时，导游婉言拒绝"},{"key":"D","text":"部分旅游者提出的要求与原行程不符且涉及接待规格，导游尽量帮助解决"},{"key":"E","text":"确有特殊理由且由入境领队(全陪)提出，地陪必须请示旅行社，视情况而定"}],"answer":"ABE","keys":["A","B","E"],"explanation":"入境领队(全陪)或旅游者提出小的修改意见或增加新的游览项目时： 及时反映：地陪应及时向旅行社反映；合理安排：对“合理又可能”满足的项目，应予以安排；费用说明：对需加收费用的项目，地陪要事先向入境领队(全陪)或旅游者讲明，按有关规定收取费用；耐心解释：对确有困难且无法满足的要求，地陪要详细解释、耐心说服；入境领队(全陪)或旅游者提出的要求与原行程不符且涉及接待规格时： 婉言拒绝：一般应婉言拒绝，说明这涉及变更旅游合同，需要双方协商；特殊处理：如确有特殊理由且由入境领队(全陪)提出，地陪必须请示旅行社，视情况而定。","type":"多选题"},{"number":151,"stem":"下列选项中，属于地陪导游为游客提供的购物服务内容的有( )。","options":[{"key":"A","text":"地陪严格依据旅游合同或接待计划中规定的购物次数、购物场所和停留时间"},{"key":"B","text":"禁止擅自增加购物次数或延长停留时间"},{"key":"C","text":"不得向旅游者兜售任何物品"},{"key":"D","text":"严禁以不正当手段强迫或变相强迫旅游者参与购物活动"},{"key":"E","text":"对于不愿参加购物活动的旅游者，令其自由活动"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"《中华人民共和国旅游法》《导游管理办法》《导游服务规范》等法律法规明确规定导游的购物服务行为。地陪应严格依据旅游合同或接待计划中规定的购物次数、购物场所和停留时间，有序组织旅游者进行购物活动，禁止擅自增加购物次数或延长停留时间，不得向旅游者兜售任何物品；严禁以殴打、弃置、限制活动自由、恐吓、侮辱、咒骂等不正当手段强迫或变相强迫旅游者参与购物活动，同时不得接受购物场所经营者以回扣、佣金、人头费或奖励费等名义给予的不正当利益；对于不愿参加购物活动的旅游者，地陪应妥善安排其行程，例如安排其就近参观其他景点或在环境适宜的地点休息等候，以确保所有旅游者都能在舒心的氛围中度过购物时段。","type":"多选题"},{"number":152,"stem":"地陪导游带领游客抵达景区后、进入景区前，操作正确的是( )。","options":[{"key":"A","text":"下车前，地陪提醒旅游者记住车型、颜色、标志、车牌号、停车地点和开车时间"},{"key":"B","text":"若景点下车和上车地点不同，特别提醒上车地点"},{"key":"C","text":"下车后，引导旅游者至景点示意图前，讲解游览线路"},{"key":"D","text":"讲解时，做到“导”“游”结合，集中与分散相宜，劳逸结合"},{"key":"E","text":"根据旅游者文化程度、理解能力和地域差异调整讲解方式"}],"answer":"ABC","keys":["A","B","C"],"explanation":"抵达景点后的服务进入景区前：(1)车辆信息：抵达景点后，下车前，地陪提醒旅游者记住车型、颜色、标志、车牌号、停车地点和开车时间。(2)特殊地点：若景点下车和上车地点不同，特别提醒上车地点。(3)示意图前讲解：下车后，引导旅游者至景点示意图前，讲解游览线路，交代注意事项，强调人身财产安全、预防走失，讲清停留时间、集合时间和地点。","type":"多选题"},{"number":153,"stem":"全陪导游的末站服务内容有( )。","options":[{"key":"A","text":"全陪要与地陪、领队提前落实离站交通票据"},{"key":"B","text":"提醒妥善保管随身携带的证件和贵重物品"},{"key":"C","text":"与地陪结清费用，保管好票据"},{"key":"D","text":"做好回头客营销工作"},{"key":"E","text":"处理好客人遗留问题"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"E 项，处理好客人遗留问题属于后续服务。其他选项描述正确。","type":"多选题"},{"number":154,"stem":"领队带领游客文明旅游，在酒店住宿期间应该做到( )。","options":[{"key":"A","text":"提醒游客在饭店抽烟，不要出去后再抽"},{"key":"B","text":"尊重服务人员，服务人员问好时要友善回应"},{"key":"C","text":"应引导游客增加一次性物品的使用，干净卫生"},{"key":"D","text":"提醒游客在客房区域举止文明"},{"key":"E","text":"提醒游客在客房内消费的，应在离店前主动声明并付费"}],"answer":"BDE","keys":["B","D","E"],"explanation":"1.导游领队应提醒游客尊重服务人员，服务人员问好时要友善回应。2.导游领队应指引游客爱护和正确使用住宿场所设施设备，注意维护客房和公用空间的整洁卫生，提醒游客不在酒店禁烟区域抽烟。3.导游领队应引导游客减少一次性物品的使用，减少环境污染，节水节电。4.导游领队应提醒游客在客房区域举止文明，如在走廊等公共区域衣着得体，出入房间应轻关房门，不吵闹喧哗，宜调小电视音量，以免打扰其他客人休息。5.导游领队应提醒游客在客房内消费的，应在离店前主动声明并付费。","type":"多选题"},{"number":155,"stem":"下列内容中，属于同类相异类比的选项是( )。","options":[{"key":"A","text":"在风格上，将颐和园与凡尔赛宫花园进行比较"},{"key":"B","text":"在规模上，将唐代长安城与罗马帝国的首都君士坦丁堡相比"},{"key":"C","text":"在价值上，将秦始皇陵地宫宝藏与古埃及第十八朝法老图坦卡蒙陵墓的宝藏相比"},{"key":"D","text":"将北京的王府井比作日本东京的银座、美国纽约的第五大街"},{"key":"E","text":"讲到梁山伯和祝英台的故事时，可以将其称为“中国的罗密欧和朱丽叶”"}],"answer":"ABC","keys":["A","B","C"],"explanation":"将同类但在规模、质量、风格等方面不同的事物或现象进行比较，加深旅游者印象。举例：在风格上，将颐和园与凡尔赛宫花园进行比较，它们都是皇家园林，都在市郊，但它们在风格上迥然不同；同样，在规模上，将唐代长安城与罗马帝国的首都君士坦丁堡相比；在价值上，将秦始皇陵地宫宝藏与古埃及第十八朝法老图坦卡蒙陵墓的宝藏相比。","type":"多选题"},{"number":156,"stem":"根据《旅行社安全规范》，导游应协助旅行社在招徕环节完成的安全准备工作包括( )。","options":[{"key":"A","text":"要求旅游者提供与旅游活动相关的个人健康信息，并以书面形式予以确认"},{"key":"B","text":"对旅游线路和旅游项目风险等安全事宜做出明示"},{"key":"C","text":"调查了解游客经济实力，是否能够满足出国旅游需求"},{"key":"D","text":"应建议旅游者购买个人旅游意外保险，以防范旅游过程中的各类风险"},{"key":"E","text":"提醒旅游者出发前带齐旅游行程中必要的证件和物品"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"根据《旅行社安全规范》(LB/T028‑ 2013)，导游应协助旅行社在招徕环节完成以下安全准备：(1)健康信息确认：应要求旅游者提供与旅游活动相关的个人健康信息，并以书面形式予以确认。(2)风险提示告知：对旅游线路和旅游项目风险等安全事宜做出明示，包括：·对旅游行程和活动的身体素质要求作出提示；·明示某些疾病患者可能的风险；·对身体素质可能不宜参加某些旅游活动的报名者做出提示、警示或劝阻；·恶劣天气或者不可抗力事件对旅游行程安全可能构成的威胁。(3)保险建议：应建议旅游者购买个人旅游意外保险，以防范旅游过程中的各类风险。(4)证件与物品提醒：提醒旅游者出发前带齐旅游行程中必要的证件和物品。","type":"多选题"},{"number":157,"stem":"关于增加计划外景点的操作，正确的是( )。","options":[{"key":"A","text":"全体旅游者要求增加景点，首先征得领队或全陪的同意，并做好全体旅游者签名记录"},{"key":"B","text":"全体旅游者要求增加景点，及时将相关情况报告旅行社，按照旅行社提供的标准收取增加景点的费用"},{"key":"C","text":"由于是新增旅游景点，导游将游客送至景点即可"},{"key":"D","text":"若有少数旅游者不参与该新增景点游览，导游让游客自由活动"},{"key":"E","text":"个别旅游者要求增加景点，导游婉言拒绝"}],"answer":"AB","keys":["A","B"],"explanation":"首先征得领队或全陪的同意，并做好全体旅游者签名记录，以确保后续操作有据可依；及时将相关情况报告旅行社，按照旅行社提供的标准收取增加景点的费用，并将收据妥善交给旅游者或领队，保障费用收取的规范性与透明度；导游应全程带领旅游者开展活动，并提供相应的讲解服务以及安全保障，确保旅游者的游览体验与安全；若有少数旅游者不参与该新增景点游览，导游应妥善安排好这部分旅游者的活动，充分保障他们的合法权益，避免其权益受损。","type":"多选题"},{"number":158,"stem":"发生漏接事故以后，导游应该( )。","options":[{"key":"A","text":"导游应沉着冷静，设法弥补，并及时向旅行社报告"},{"key":"B","text":"尽快与旅游者会合"},{"key":"C","text":"诚恳地向旅游者道歉，并说明不是因为个人原因漏接的"},{"key":"D","text":"提供热情周到的高质量服务，减轻漏接造成的不良影响"},{"key":"E","text":"若因漏接导致旅游者产生额外费用，导游应主动给予报销"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"导游应沉着冷静，设法弥补，并及时向旅行社报告，依据旅行社给出的意见，结合实际情况灵活处理；1.尽快与旅游者会合：知晓旅游者抵达后，导游应第一时间与其联系，争取尽快会面；2.道歉并说明情况：见面后，导游首先需诚恳地向旅游者道歉，随后实事求是地说明情况，并力求获得旅游者的谅解；3.积极采取弥补措施：一方面，导游可通过提供热情周到的高质量服务，减轻漏接造成的不良影响；另一方面，若因漏接导致旅游者产生额外费用，导游应主动给予报销。如有必要，还可通过加菜、赠送本地特产等方式，给予旅游者物质补偿。","type":"多选题"},{"number":159,"stem":"在旅游过程中为了避免游客走失，导游应( )。","options":[{"key":"A","text":"提醒旅游者记住导游电话、旅行社名称、旅游车标志与车号等信息"},{"key":"B","text":"游览时提醒不要走散，自由活动时确保老人和孩子身边有照顾者"},{"key":"C","text":"到景点后，利用导览图介绍景点线路、集合信息"},{"key":"D","text":"地陪、全陪或领队做好断后工作"},{"key":"E","text":"要经常催促、警示喜欢拍照的游客跟上队伍"}],"answer":"ABC","keys":["A","B","C"],"explanation":"1.做好提醒工作，在旅游初期，提醒旅游者记住导游联系电话、旅行社名称、旅游车标志与车号等基本信息；游览时提醒不要走散，自由活动时确保老人和孩子身边有照顾者，并讲清集合时间与地点；提醒旅游者走散后不要乱跑，及时联系导游或亲友；2.提前告知旅游安排，提前告知旅游者行程安排，强调易走失场合；到景点后，利用导览图介绍景点线路、集合信息等；3.关注旅游者动向，导游密切配合，地陪讲解时，全陪或领队做好断后工作；关注旅游者动向，及时提醒只顾拍照等个人行为的旅游者跟上队伍，重点关注老人、孩子及行为散漫者；养成清点人数习惯，发现有人不在及时寻找；4.提供精彩讲解，导游以精彩讲解吸引旅游者，通过高超技巧和趣味内容，防止走失。","type":"多选题"},{"number":160,"stem":"旅途中行李丢失会非常影响游客的心情，导游应该( )，避免此类事件发生。","options":[{"key":"A","text":"多做提醒工作"},{"key":"B","text":"在行李箱上贴醒目粘贴纸或挂姓名电话行李牌，防止错拿"},{"key":"C","text":"搬运行李时，务必清点件数，尤其在交接过程中要细致"},{"key":"D","text":"锁好行李箱，防止拉链松开导致行李被压坏"},{"key":"E","text":"当车上无人时，导游应提醒司机锁好车窗门"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"(1)多做提醒工作，在酒店办理入住、用餐、离店等环节，旅游者可能因行色匆忙忘记携带行李。导游需在上下车、出入酒店等场景随时提醒。(2)做上醒目标记，在行李箱上贴醒目粘贴纸或挂姓名电话行李牌，便于快速识别、防止错拿。(3)做好行李清点，导游协助搬运行李时，务必清点件数，尤其在交接过程中要细致。(4)提醒司机锁好行李舱和门窗，当车上无人时，导游应提醒司机锁好车窗门，并和司机确认放置行李的车厢已上锁。","type":"多选题"},{"number":161,"stem":"当旅游者遭遇传染病疫情时，导游处理得当的选项是( )。","options":[{"key":"A","text":"立即暂停旅游活动，第一时间向旅行社及其所在地、疫情发生地旅游主管部门报告"},{"key":"B","text":"认为应进行防疫检查的，立即将旅游者送至当地疾病预防控制机构"},{"key":"C","text":"配合相关部门和单位做好旅游者隔离、密切接触者追踪或采取其他措施"},{"key":"D","text":"根据疫情发展情况，按旅行社的安排，调整或变更旅游行程"},{"key":"E","text":"如患者系外籍人士，由我国公安机关令其提前出境的，协助患者办理相关离境手续"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"(1)立即暂停旅游活动，在第一时间向旅行社及其所在地、疫情发生地旅游主管部门报告，并及时向附近的疾病预防控制机构报告详细情况，配合开展旅游者防疫、安抚和宣传解释工作；(2)有关部门认为应对旅游者进行防疫检查的，立即将旅游者送至当地疾病预防控制机构或有关部门指定的其他场所；(3)经查旅游者确患传染病的，遵照当地有关疫情防控指引和要求，配合相关部门和单位做好旅游者隔离、密切接触者追踪或采取其他措施，并通知其亲属；(4)关注目的地疫情防控动态，宜根据疫情发展情况，按旅行社的安排，调整或变更旅游行程；(5)如患者系外籍人士，由我国公安机关令其提前出境的，协助患者办理相关离境手续。","type":"多选题"},{"number":162,"stem":"带团期间遭遇台风，导游应该( )。","options":[{"key":"A","text":"导游应密切关注台风动向，为合理调整行程提供依据"},{"key":"B","text":"若在徒步游览景点时遭遇台风，切勿在广告牌、大树等附近躲避风雨"},{"key":"C","text":"如身处室内，可坐在窗户附近观测台风大小"},{"key":"D","text":"当身处室内遇到台风，迅速关好门窗，用胶布在玻璃上贴成“米”字形"},{"key":"E","text":"根据经验判断台风，通常二三十分钟之后，台风就会过去"}],"answer":"ABD","keys":["A","B","D"],"explanation":"关注台风动态：导游应密切关注台风动向，实时了解最新气象信息，为合理调整行程提供依据； 徒步景点应对：若在徒步游览景点时遭遇台风，切勿在临时建筑物、广告牌、铁塔、大树等附近躲避风雨，也不得靠近或触摸倒在路上的电线，以防触电危险。应迅速寻找房屋等室内空间进行躲避；关闭门窗：当身处室内或及时回到室内时，要迅速关好门窗，并用胶布在窗户玻璃上贴成“米”字形； 当台风骤然停止时，并不意味着台风已经远离。通常二三十分钟之后，狂风暴雨还会突然再次来袭，所以此时千万不可掉以轻心，仍要保持警惕并做好防护措施。","type":"多选题"},{"number":163,"stem":"海岛旅游期间，( )可以科学合理地规避海啸。","options":[{"key":"A","text":"若海岛有地震震感，提醒旅游者避免前往海边游玩，做好防海啸准备"},{"key":"B","text":"发现潮汐出现突然反常涨落，立即组织旅游者撤离至地势较高的地方"},{"key":"C","text":"当海水异常退去时，可少量捡拾鱼虾，然后迅速撤离"},{"key":"D","text":"如果在乘船时遇到海啸，要让船只迅速靠岸，游客弃船逃生"},{"key":"E","text":"导游需关注新闻中的地震报道以及当地发布的海啸预警信息"}],"answer":"ABE","keys":["A","B","E"],"explanation":"1.留意地震信息，地震是海啸发生的最明显前兆，导游需关注新闻中的地震报道以及当地发布的海啸预警信息。若现场有震感，应提醒旅游者避免前往海边游玩，并做好防海啸准备。需注意，海啸有时会在地震发生几小时后抵达距离震源上千公里的地方，因此不能放松警惕。2.关注潮汐状况，一旦发现潮汐出现突然反常涨落，海平面显著下降或有巨浪袭来，且有大量水泡冒出时，应立即组织旅游者撤离至陆地地势较高的地方。当海啸前海水异常退去时，往往会将大量鱼虾等海生动物留在浅滩，形成壮观场面，但此时万不可去捡拾鱼虾或看热闹，应迅速离开海岸，因为这很可能是海啸即将来袭的危险信号。3.海上船只避免返回港湾，海啸在海港中会引发巨大落差和湍流，十分危险。船主应在海啸到达前，将船只驶向开阔海面，此时深海区相较于海岸更为安全。","type":"多选题"},{"number":164,"stem":"关于铁路退票规则表述正确的是( )。","options":[{"key":"A","text":"不晚于开车前 30 分钟可在 12306.cn网站上办理"},{"key":"B","text":"距开车不足 1小时，须持购票证件至窗口办理"},{"key":"C","text":"开车前 8天(含 8 天)以上退票的，不收退票费"},{"key":"D","text":"团体票(20人以上同行程)退改签需不晚于开车前 24小时"},{"key":"E","text":"每张车票仅允许改签 1次"}],"answer":"ACE","keys":["A","C","E"],"explanation":"团体票(20人以上同行程)退改签需不晚于开车前 48小时；改签限制：每张车票仅允许改签 1 次，已取纸质票须在窗口办理；开车前 8天(含 8 天)以上退票的，不收退票费；未换取纸质票且不晚于开车前 30 分钟：可在 12306.cn 网站上办理；已取票或距开车不足 30分钟：须持购票证件至窗口办理。","type":"多选题"},{"number":165,"stem":"关于我国离境退税的政策描述正确的选项是( )。","options":[{"key":"A","text":"在我国境内连续居住少于或等于 183天的外国人和港澳台同胞可以享受离境退税政策"},{"key":"B","text":"境外旅客本人在退税商店购买且符合退税条件的个人物品享受离境退税政策"},{"key":"C","text":"同人同日同店购物大于或者等于 500元人民币"},{"key":"D","text":"退税金额在 10000元人民币以上就必须转账"},{"key":"E","text":"购买日距离境日必须小于或者等于 90天"}],"answer":"ABE","keys":["A","B","E"],"explanation":"在我国境内连续居住≤183天的外国人和港澳台同胞；境外旅客本人在退税商店购买且符合退税条件的个人物品；同人同日同店购物≥200元人民币；购买日距离境日≤90 天；大于 20000元银行转账。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD三/LDD押题第3卷（科目一二）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD三/LDD押题第3卷（科目一二）-试卷.pdf"},{"name":"科目三四","questions":[{"number":1,"stem":"《授时历》是中国古代使用时间最长､精确度最高的历法。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。传说中国最早的历法是《黄帝历》。至元代郭守敬又制定《授时历》。《授时历》是中国古代使用时间最长、精确度最高的历法。","type":"判断题"},{"number":2,"stem":"正一道道士可以有家室，可不出家、不住宫观。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。正一道集符箓派之大成，以行符箓为主要特征，清规戒律不如全真道严格。正一道以行符箓为主要特征（画符念咒、驱鬼降妖、祈福禳灾），奉持的主要经典为《正一经》。","type":"判断题"},{"number":3,"stem":"文化是旅游的灵魂，旅游则是文化的重要载体。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。文化和旅游密不可分，二者相辅相成。文化是旅游的灵魂，旅游则是文化的重要载体。党的十九届五中全会确定了到 2035 年建成文化强国的远景目标，为文化和旅游发展擘画了蓝图。","type":"判断题"},{"number":4,"stem":"商周青铜器上常有铭文，这些铭文又称金文或钟鼎文；商器字数少，周器字数多。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。商周青铜器上常有铭文（又称金文或钟鼎文），商器字数少，周器字数多，其中西周毛公鼎竟达 497个字（也有人释读成 499字）。","type":"判断题"},{"number":5,"stem":"太平道和五斗米道均为早期道教。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。领导东汉黄巾起义的张角传授的为太平道；张陵在蜀中鹤鸣山传播五斗米道。张陵在蜀中鹤鸣山传播五斗米道，因信徒入教必须交五斗米而得名。","type":"判断题"},{"number":6,"stem":"2014年，习近平总书记提出建设“四好农村路”，即把农村公路建好､管好､护好､运营好。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2014 年，习近平总书记提出“要进一步把农村公路建好、管好、护好、运营好”，全国农村掀起了建设“四好农村路”的新高潮，制约农村发展的交通瓶颈进一步被打破。","type":"判断题"},{"number":7,"stem":"古代纪年中，每 60年为一个轮回，称为一个“甲子”或“花甲”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。十天干与十二地支相配，得到 60个干支组合，计年时每 60 年一个轮回，称为一个“甲子”或“花甲”。十天干与十二地支相配，得到 60个干支组合，最早用于计日，后来用于计年。","type":"判断题"},{"number":8,"stem":"被誉为“天下第一行书”的《兰亭集序》，其作者是颜真卿。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《兰亭集序》的作者是东晋王羲之（不是颜真卿），王羲之被尊为“书圣”；颜真卿是“楷书四大家”之一，其著名行书作品是《祭侄文稿》。","type":"判断题"},{"number":9,"stem":"党的十九大将铸牢中华民族共同体意识写入党章。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2017年，党的十九大正式提出“铸牢中华民族共同体意识”，强调加强各民族对中华文化的认同，推动共同繁荣发展，并将其写入党章。","type":"判断题"},{"number":10,"stem":"新中国成立后建成的第一条铁路是成渝铁路。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。新中国成立后建成的第一条铁路是成渝铁路，全长 505千米，连通成都和重庆，1950年开始建设，1952年 7 月 1 日建成通车，填补了西南地区铁路建设的空白。","type":"判断题"},{"number":11,"stem":"明朝宋应星著有《天工开物》，该书被外国学者称为“中国 17 世纪的工艺百科全书”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。《天工开物》是世界上第一部关于农业和手工业生产的综合性科技著作。《天工开物》有明代末年资本主义萌芽的相关记载，是世界上第一部关于农业和手工业生产的综合性科技著作。","type":"判断题"},{"number":12,"stem":"研学旅行是家庭教育的一部分，其最核心的属性是娱乐性。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。研学旅行是学校教育（不是家庭教育）的一部分，由教育部门和学校有计划地组织安排，学生是研学旅游的主体，研学旅行最重要的性质是教育性。","type":"判断题"},{"number":13,"stem":"乡村旅游发生在乡村地区，并以新奇性作为旅游吸引物。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。乡村旅游是以乡村性（不是新奇性）作为旅游吸引物；其概念包含两个方面：一是发生在乡村地区，二是以乡村性作为旅游吸引物，二者缺一不可。","type":"判断题"},{"number":14,"stem":"我国人口数量最多的少数民族是回族。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。我国少数民族中人口数量最多的是壮族（不是回族）；我国汉族是人数最多的民族。","type":"判断题"},{"number":15,"stem":"纽约是美国首都，也是联合国总部所在地。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。美国的首都是华盛顿（不是纽约），华盛顿被美国人称为“国家的心脏”；纽约是美国第一大城市，也是联合国总部所在地。","type":"判断题"},{"number":16,"stem":"赵州桥由鲁班设计建造。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。赵州桥（安济桥）是由著名工匠李春（不是鲁班）设计建造的，建于隋代，是世界上现存最大的敞肩桥。","type":"判断题"},{"number":17,"stem":"北京颐和园内的谐趣园仿杭州西湖而建。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。谐趣园是仿无锡惠山寄畅园（不是杭州西湖）而建；同样仿寄畅园而建的还有圆明园内的廓然大公（后来也称双鹤斋）。","type":"判断题"},{"number":18,"stem":"清明节的前一天是中元节。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。清明节的前一天为寒食节（不是中元节），寒食节又称冷节、禁烟节，据说是为纪念介子推。","type":"判断题"},{"number":19,"stem":"战国时期，韩、赵、魏由春秋时期的晋国分裂而来，史称“三家分晋”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。战国时期，出现韩、赵、魏、楚、燕、齐、秦等强国的对峙，其中韩、赵、魏由春秋时期的晋国分裂而来，史称“三家分晋”。","type":"判断题"},{"number":20,"stem":"宋代五大名窑为汝窑、官窑、哥窑、钧窑、定窑。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。宋代五大名窑为汝窑、官窑、哥窑、钧窑、定窑。","type":"判断题"},{"number":21,"stem":"北京胡同大部分形成于明、清两代。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“明、清”应改为“元、明、清”。北京胡同星罗棋布，共有 7000余条，大部分形成于元、明、清三个朝代，民间有“有名的胡同三千六，没名的胡同赛牛毛”之说。","type":"判断题"},{"number":22,"stem":"土家族妇女的“盛装”银饰堪称中华民族服装之最，黔东南被称为“苗族服饰博物馆”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“土家族”应改为“苗族”。苗族服饰式样繁多、色彩艳丽。苗族妇女的“盛装”银饰堪称中华民族服装之最，以大为美、以重为美、以多为美。黔东南是我国和世界上苗族服饰种类最多、保存最好的区域，被称为“苗族服饰博物馆”。","type":"判断题"},{"number":23,"stem":"广西是全国唯一没有平原支撑的省份，素有“八山一水一分田”之说。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“广西”应改为“贵州”。贵州省 92.5%的面积为山地和丘陵，是全国唯一一个没有平原支撑的省份。点评：“全国唯一”是地导重要常考内容。","type":"判断题"},{"number":24,"stem":"日月潭是我国台湾省第一大天然湖泊，有“海外别洞天”之称。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。日月潭位于南投县，是台湾省最大的淡水湖，也是中国台湾省第一大天然湖泊，有“海外别洞天”之称。","type":"判断题"},{"number":25,"stem":"四川简称川或蜀，省会成都市，最高峰贡嘎山有“蜀山之王”的美誉。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。四川简称川或蜀，省会成都市；最高峰贡嘎山，海拔 7508.9 米，有“蜀山之王”美誉。","type":"判断题"},{"number":26,"stem":"西藏是世界上海拔最高的地区，素有“世界屋脊”之称。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。西藏是世界上海拔最高的地区，素有“世界屋脊”之称。境内超过8000米的高峰有 5 座，其中世界第一高峰珠穆朗玛峰就耸立在中尼边界上。","type":"判断题"},{"number":27,"stem":"维多利亚港是世界第一大海港。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，错在“世界第一”。维多利亚港是亚洲第一、世界第三大海港；香港货运机场则已第 14 次被评为世界上最繁忙的货运机场。","type":"判断题"},{"number":28,"stem":"重庆是中国西部地区唯一的直辖市，山中有城，城中有山，故有“山城”之称。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。重庆简称“渝”，位于祖国内陆西南部，长江和嘉陵江汇合处。重庆是中国西部地区唯一的直辖市，山中有城，城中有山，故有“山城”之称。","type":"判断题"},{"number":29,"stem":"桂林、阳朔一带的石灰岩峰林，曾被明代旅行家徐霞客誉为“碧莲玉笋世界”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。广西桂林山水绝佳，桂林、阳朔一带的石灰岩峰林曾被徐霞客誉为“碧莲玉笋世界”；广西洞穴众多，素有“无山不洞，无洞不奇”之称。","type":"判断题"},{"number":30,"stem":"长沙别称“星城”，源于轸宿附星“长沙星”，因此又有“星沙”之称。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。长沙简称“长”，别称“星城”——相传得名于二十八宿中轸宿附星“长沙星”，因此又有“星沙”之称。","type":"判断题"},{"number":31,"stem":"黎族是海南岛上最早的居民，海南是全国唯一的黎族聚居区。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。汉族、黎族、苗族、回族是海南省世居民族，黎族是海南岛上最早的居民。海南是全国唯一的黎族聚居区。","type":"判断题"},{"number":32,"stem":"宁夏是全国唯一全境属于黄河流域的省区，堪称中国生态微缩盆景。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。宁夏是全国唯一全境属于黄河流域的省区，拥有完整的山水林田湖草沙生态体系，堪称中国生态微缩盆景。","type":"判断题"},{"number":33,"stem":"福建陆地海岸线位居全国第一。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“第一”应改为“第二”。福建以侵蚀海岸为主，陆地海岸线长达 3752千米，位居全国第二，海岸线曲折率居全国第一位。","type":"判断题"},{"number":34,"stem":"国家速滑馆与“鸟巢”“冰立方”共同组成“双奥之城”的标志性建筑群。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。国家速滑馆与“鸟巢”“冰立方”共同组成双奥之城的标志性建筑群。国家体育场“鸟巢”是唯一举办“双奥”开幕式和闭幕式的场馆；“冰立方”即国家游泳中心，是“水立方”的冬奥化身。","type":"判断题"},{"number":35,"stem":"江苏省在“十四五”时期重点打造的“1650”产业体系，包括 16 个重点产业集群和 50条重点产业链。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。“1650”产业体系是江苏省在“十四五”时期重点打造的 16 个重点产业集群、50条重点产业链；江苏已培育 14 个国家级和 2 个省级先进制造业集群，工程机械、高端纺织、光伏等产业位居全球前列，动力电池、海工装备、新能源汽车等在全国处于领先地位。","type":"判断题"},{"number":36,"stem":"截至目前，我国入选联合国教科文组织非物质文化遗产名录的项目已达 61项，入选数量居世界首位。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“61项”应改为“45 项”，“61 项”是我国的世界遗产总数。截至 2026年 6 月，我国共有 45 个项目列入联合国教科文组织非遗名录、名册，总数居世界第一，其中，列入代表作名录 40项，列入急需保护名录项目 3 项，入选优秀保护实践名册 2项。（数据更新，以此为准）。——口诀——非遗 45世界一：代表 40，急 3，优 2。","type":"判断题"},{"number":37,"stem":"泉州具有南音、南戏、南建筑、南拳、南派工艺等独具特色的“五南”文化。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。泉州具有南音、南戏、南建筑、南拳、南派工艺等独具特色的“五南”文化。戏曲文化源远流长，有梨园戏、高甲戏等剧种，还有中国一绝“提线木偶”（其他教材补充）。","type":"判断题"},{"number":38,"stem":"张家界原名大庸市，因旅游建市。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。张家界市：·原名大庸市，明崇祯三年(1630年)，张再弘被赐团官，且设衙署于此。于是，这一带成为张氏世袭领地，被叫成了“张家界”。·张家界因旅游建市。","type":"判断题"},{"number":39,"stem":"1292年，元朝政府批准设立上海县，这是上海行政建制之始。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1292 年，元朝政府把上海镇从华亭县划出，批准设立上海县，这是上海行政建制之始。16 世纪中叶，明代的上海已成为全国棉纺织手工业中心。","type":"判断题"},{"number":40,"stem":"北京胡同星罗棋布，民间有“有名的胡同三千六，没名的胡同赛牛毛”之说。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。北京胡同共有 7000 余条，大部分形成于元、明、清三个朝代，民间有“有名的胡同三千六，没名的胡同赛牛毛”之说。二、单项选择题（每题 1 分）","type":"判断题"},{"number":41,"stem":"我国最大的内陆河是( )。","options":[{"key":"A","text":"伊犁河"},{"key":"B","text":"黑河"},{"key":"C","text":"塔里木河"},{"key":"D","text":"额尔齐斯河"}],"answer":"C","keys":["C"],"explanation":"塔里木盆地是中国面积最大的内陆盆地，盆地北缘的塔里木河是我国最大的内陆河；准噶尔盆地是中国第二大内陆盆地。","type":"单选题"},{"number":42,"stem":"佛教开始传入中国的时间是( )。","options":[{"key":"A","text":"魏晋南北朝"},{"key":"B","text":"隋唐时期"},{"key":"C","text":"西汉哀帝元寿元年"},{"key":"D","text":"东汉永平年间"}],"answer":"C","keys":["C"],"explanation":"西汉哀帝元寿元年（公元前 2 年），大月氏王使臣伊存向中国博士弟子景卢口授《浮屠经》，佛教开始传入中国，史称“伊存授经”。","type":"单选题"},{"number":43,"stem":"全真道的主要创派人是( )。","options":[{"key":"A","text":"张道陵"},{"key":"B","text":"张角"},{"key":"C","text":"王重阳"},{"key":"D","text":"丘处机"}],"answer":"C","keys":["C"],"explanation":"全真道主要创派人为王重阳，主张道、佛、儒三教合一；丘处机开创的龙门派势力最大，至今全真道仍以龙门派人数最多。","type":"单选题"},{"number":44,"stem":"俄罗斯的首都是( )。","options":[{"key":"A","text":"圣彼得堡"},{"key":"B","text":"莫斯科"},{"key":"C","text":"叶卡捷琳堡"},{"key":"D","text":"符拉迪沃斯托克"}],"answer":"B","keys":["B"],"explanation":"莫斯科自 1147年建城，迄今已有 870多年历史，是世界上绿化覆盖率最高的城市之一；克里姆林宫和红场是俄罗斯的标志，圣彼得堡被称为俄罗斯的“北方首都”。","type":"单选题"},{"number":45,"stem":"中国第一大群岛，其所在城市也是中国第一个以群岛建制的地级市，该群岛是( )。","options":[{"key":"A","text":"南沙群岛"},{"key":"B","text":"长山群岛"},{"key":"C","text":"庙岛群岛"},{"key":"D","text":"舟山群岛"}],"answer":"D","keys":["D"],"explanation":"舟山群岛是中国第一大群岛，渔业发达。舟山群岛渔业发达，是国务院批准的中国首个以海洋经济为主题的国家战略新区。舟山群岛渔业发达。","type":"单选题"},{"number":46,"stem":"都江堰是以( )为特征的大型水利工程。","options":[{"key":"A","text":"无坝引水"},{"key":"B","text":"拦河大坝"},{"key":"C","text":"船闸通航"},{"key":"D","text":"灌溉为主"}],"answer":"A","keys":["A"],"explanation":"都江堰以无坝引水为特征，2000年被联合国教科文组织列入《世界文化遗产名录》。2000年，都江堰水利工程被联合国教科文组织列入《世界文化遗产名录》。","type":"单选题"},{"number":47,"stem":"从造型上看，大多为实心、一般不能登临的塔是( )。","options":[{"key":"A","text":"密檐式塔"},{"key":"B","text":"覆钵式塔"},{"key":"C","text":"金刚宝座塔"},{"key":"D","text":"楼阁式塔"}],"answer":"A","keys":["A"],"explanation":"密檐式塔大都是实心的，一般不能登临，现存著名古塔有河南嵩岳寺塔、西安小雁塔、崇圣寺三塔。密檐式塔现存著名古塔还有西安小雁塔、崇圣寺三塔。嵩岳寺塔、西安小雁塔、崇圣寺三塔均为密檐式塔。","type":"单选题"},{"number":48,"stem":"《富春山居图》的作者是“元四家”中的( )。","options":[{"key":"A","text":"王蒙"},{"key":"B","text":"吴镇"},{"key":"C","text":"黄公望"},{"key":"D","text":"倪瓒"}],"answer":"C","keys":["C"],"explanation":"元代画家有“元四家”：黄公望、倪瓒、王蒙、吴镇。其中黄公望的《富春山居图》是中国十大传世名画之一。元代画家有“元四家”：黄公望、倪瓒、王蒙、吴镇。","type":"单选题"},{"number":49,"stem":"宣纸分生熟两种，其中( )。","options":[{"key":"A","text":"生宣渍水渗化，作写意画最好"},{"key":"B","text":"熟宣渍水渗化，作写意画最好"},{"key":"C","text":"生宣经过胶矾浸染，宜于工笔"},{"key":"D","text":"两者渗化性相同"}],"answer":"A","keys":["A"],"explanation":"宣纸分生熟两种：生宣渍水渗化，作写意画最好；熟宣经过胶矾浸染，不渗化，宜于工笔，细描细写，为书画最理想的用纸。","type":"单选题"},{"number":50,"stem":"明长城中保存最完好、最具代表性的一段是( )。","options":[{"key":"A","text":"八达岭长城"},{"key":"B","text":"老龙头长城"},{"key":"C","text":"嘉峪关长城"},{"key":"D","text":"山海关长城"}],"answer":"A","keys":["A"],"explanation":"八达岭长城位于北京西北，是明长城中保存最完好、最具代表性的一段；老龙头长城是长城入海的端头部分，有“中华之魂”的盛誉。","type":"单选题"},{"number":51,"stem":"北朝民歌中，描写花木兰替父从军故事的名篇是( )。","options":[{"key":"A","text":"《敕勒歌》"},{"key":"B","text":"《木兰辞》"},{"key":"C","text":"《孔雀东南飞》"},{"key":"D","text":"《陌上桑》"}],"answer":"B","keys":["B"],"explanation":"北朝民歌名篇有《敕勒歌》和《木兰辞》，《木兰辞》描写花木兰替父从军的故事，它与建安年间产生的《孔雀东南飞》，被誉为魏晋南北朝民间长篇叙事诗的双璧。","type":"单选题"},{"number":52,"stem":"我国最早的脉学著作《脉经》的作者是西晋时期的( )。","options":[{"key":"A","text":"王叔和"},{"key":"B","text":"宋慈"},{"key":"C","text":"葛洪"},{"key":"D","text":"皇甫谧"}],"answer":"A","keys":["A"],"explanation":"西晋王叔和著《脉经》，是我国最早的脉学著作；西晋皇甫谧著《针灸甲乙经》，是我国第一部针灸学著作。皇甫谧著《针灸甲乙经》是我国第一部针灸学著作。","type":"单选题"},{"number":53,"stem":"中国穆斯林大多属于伊斯兰教的( )。","options":[{"key":"A","text":"逊尼派"},{"key":"B","text":"什叶派"},{"key":"C","text":"苏菲派"},{"key":"D","text":"哈瓦利吉派"}],"answer":"A","keys":["A"],"explanation":"逊尼派是伊斯兰教中人数最多的一派，中国 em":"沈阳故宫在清朝初期被称为( )。","options":[{"key":"A","text":"“陪都宫殿”"},{"key":"B","text":"“关外紫禁城”"},{"key":"C","text":"“奉天行宫”"},{"key":"D","text":"“盛京皇宫”"}],"answer":"D","keys":["D"],"explanation":"沈阳故宫是清朝入关前努尔哈赤、皇太极两代皇帝兴建和使用的宫殿，清初时期被称为“盛京皇宫”；1644年清政权迁都北京后，又被称为“陪都宫殿”。A项“陪都宫殿”是迁都北京后的称谓，易误选。","type":"单选题"},{"number":110,"stem":"被联合国教科文组织认定为中国最具代表性的两首民歌之一、被誉为“山东第二省歌”的是( )。","options":[{"key":"A","text":"《茉莉花》"},{"key":"B","text":"《康定情歌》"},{"key":"C","text":"《在那遥远的地方》"},{"key":"D","text":"《沂蒙山小调》"}],"answer":"D","keys":["D"],"explanation":"《沂蒙山小调》是山东特色民歌中传播最广、影响力最大的作品，被联合国教科文组织认定为中国最具代表性的两首民歌之一，被誉为“山东第二省歌”。","type":"单选题"},{"number":111,"stem":"“姑娘追”是( )青年最喜爱的一种马上体育游戏，也是男女青年相互表达爱情的一种方式。","options":[{"key":"A","text":"维吾尔族"},{"key":"B","text":"哈萨克族"},{"key":"C","text":"塔吉克族"},{"key":"D","text":"回族"}],"answer":"B","keys":["B"],"explanation":"“姑娘追”是哈萨克青年最喜爱的一种马上体育游戏；刁羊是新疆各兄弟民族群众普遍喜爱的传统体育活动，特别是哈萨克族、柯尔克孜族、塔吉克族、蒙古族的牧民群众。","type":"单选题"},{"number":112,"stem":"北京的四合院源于( )院落式民居，是老北京城最主要的民居建筑。","options":[{"key":"A","text":"宋代"},{"key":"B","text":"明代"},{"key":"C","text":"元代"},{"key":"D","text":"清代"}],"answer":"C","keys":["C"],"explanation":"北京四合院源于元代院落式民居，是老北京城最主要的民居建筑。 北京四合院以正房、倒座房、东西厢房围绕中间庭院形成平面布局，是北方传统住宅的统称。","type":"单选题"},{"number":113,"stem":"平遥古城有“龟城”之称，其街道格局为( )。","options":[{"key":"A","text":"“王”字形"},{"key":"B","text":"“井”字形"},{"key":"C","text":"“田”字形"},{"key":"D","text":"“土”字形"}],"answer":"D","keys":["D"],"explanation":"平遥古城街道格局为“土”字形，整体布局遵从八卦方位。城内外有各类遗址、古建筑 300多处，保存完整的明清民宅近 4000 座。","type":"单选题"},{"number":114,"stem":"山西刀削面因制作过程中采用独特的( )而得名。","options":[{"key":"A","text":"拉面工艺"},{"key":"B","text":"削面工艺"},{"key":"C","text":"压面工艺"},{"key":"D","text":"切面工艺"}],"answer":"B","keys":["B"],"explanation":"山西刀削面因其制作过程中采用独特的削面工艺而得名，形似柳叶的面条独具特色；太原被称为“面食之都”，“一面百吃”的绝技独步天下。","type":"单选题"},{"number":115,"stem":"下列名山中，被誉为“佛国天堂”的是( )。","options":[{"key":"A","text":"五台山"},{"key":"B","text":"普陀山"},{"key":"C","text":"九华山"},{"key":"D","text":"峨眉山"}],"answer":"D","keys":["D"],"explanation":"峨眉山是中国佛教四大名山 香醇似幽兰、入口甘美醇和、回味经久不息”而广受欢迎，代表了皖酒文化的独特魅力。","type":"单选题"},{"number":123,"stem":"中国四大石窟中，位于甘肃的是( )。","options":[{"key":"A","text":"敦煌莫高窟、天水麦积山石窟"},{"key":"B","text":"敦煌莫高窟、洛阳龙门石窟"},{"key":"C","text":"天水麦积山石窟、大同云冈石窟"},{"key":"D","text":"洛阳龙门石窟、大同云冈石窟"}],"answer":"A","keys":["A"],"explanation":"中国四大石窟，甘肃有两个，即敦煌莫高窟、天水麦积山石窟。","type":"单选题"},{"number":124,"stem":"下列国家 5A级旅游景区中，属于陕西、山西两省共有的是( )。","options":[{"key":"A","text":"雁门关"},{"key":"B","text":"云丘山"},{"key":"C","text":"黄河壶口瀑布"},{"key":"D","text":"大明宫"}],"answer":"C","keys":["C"],"explanation":"陕西、山西共有的 5A 景区是黄河壶口瀑布。A 项雁门关、B 项云丘山为山西独有 5A景区；D 项大明宫位于陕西西安。","type":"单选题"},{"number":125,"stem":"全球第二个、中国第一个完全通过填海造陆建成的机场是( )。","options":[{"key":"A","text":"澳门国际机场"},{"key":"B","text":"香港国际机场"},{"key":"C","text":"上海浦东国际机场"},{"key":"D","text":"深圳宝安国际机场"}],"answer":"A","keys":["A"],"explanation":"答案选 A。澳门国际机场是全球第二个、中国第一个完全由填海造陆而建成的机场。","type":"单选题"},{"number":126,"stem":"1952年 7 月建成通车的新中国第一条自行设计施工、完全采用国产材料的铁路是( )。","options":[{"key":"A","text":"宝成铁路"},{"key":"B","text":"成渝铁路"},{"key":"C","text":"成昆铁路"},{"key":"D","text":"川黔铁路"}],"answer":"B","keys":["B"],"explanation":"答案选 B。1952年 7月，新中国自行设计施工、完全采用国产材料修建的第一条铁路——成渝铁路建成通车，基本改写了蜀道难的历史。","type":"单选题"},{"number":127,"stem":"蒙古语意为“河流密集的地方”、被誉为“中国盐湖城”的城市是( )。","options":[{"key":"A","text":"格尔木市"},{"key":"B","text":"德令哈市"},{"key":"C","text":"西宁市"},{"key":"D","text":"拉萨市"}],"answer":"A","keys":["A"],"explanation":"格尔木市蒙古语意为“河流密集的地方”，因青藏公路而生、因盐湖工业而兴，被誉为“中国盐湖城”和“青藏高原上的璀璨明珠”（其他教材补充）。","type":"单选题"},{"number":128,"stem":"下列湖南民俗中，主题为纪念神农恩德的是( )。","options":[{"key":"A","text":"跳香节"},{"key":"B","text":"赶秋节"},{"key":"C","text":"姑娘追"},{"key":"D","text":"赶僵尸"}],"answer":"B","keys":["B"],"explanation":"湖南花垣县麻栗场至吉首市矮寨一带的苗民，每年立秋日到来前，要过赶秋节，以此纪念神农的恩德。","type":"单选题"},{"number":129,"stem":"天津独乐寺始建于( )。","options":[{"key":"A","text":"隋朝"},{"key":"B","text":"唐朝"},{"key":"C","text":"宋朝"},{"key":"D","text":"元朝"}],"answer":"B","keys":["B"],"explanation":"答案选 B。独乐寺始建于唐，重建于辽统和二年（公元 984 年），以古建、泥塑、壁画“三绝”享誉中外。","type":"单选题"},{"number":130,"stem":"华南第一高峰是( )。","options":[{"key":"A","text":"广东石坑崆"},{"key":"B","text":"湖南酃峰"},{"key":"C","text":"海南五指山主峰"},{"key":"D","text":"广西猫儿山主峰"}],"answer":"D","keys":["D"],"explanation":"答案选 D。广西猫儿山主峰是华南第一高峰。三、多项选择题（每题 2 分，多选、少选、错选均不得分）","type":"单选题"},{"number":131,"stem":"全真道的特点有( )。","options":[{"key":"A","text":"以《道德经》《般若波罗蜜多心经》《孝经》为主要经典"},{"key":"B","text":"主张道、佛、儒三教合一"},{"key":"C","text":"重内丹修炼，不尚符箓"},{"key":"D","text":"道士必须出家住宫观，不得蓄妻室"},{"key":"E","text":"道士可以有家室，可不出家"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"道士可以有家室、可不出家的是正一道，不是全真道。全真道士必须出家住宫观，不得蓄妻室，并制定了严格的清规戒律。","type":"多选题"},{"number":132,"stem":"下列属于范仲淹《岳阳楼记》名句的有( )。","options":[{"key":"A","text":"“不以物喜，不以己悲”"},{"key":"B","text":"“居庙堂之高则忧其民”"},{"key":"C","text":"“处江湖之远则忧其君”"},{"key":"D","text":"“落霞与孤鹜齐飞，秋水共长天一色”"},{"key":"E","text":"“醉翁之意不在酒”"}],"answer":"ABC","keys":["A","B","C"],"explanation":"“居庙堂之高”指在朝中做官，“处江湖之远”意思是不在朝廷做官；“醉翁之意不在酒”出自欧阳修《醉翁亭记》。“居庙堂之高”指在朝中做官，“处江湖之远”意思是不在朝廷做官。","type":"多选题"},{"number":133,"stem":"下列关于“竹林七贤”的说法，正确的有( )。","options":[{"key":"A","text":"包括嵇康、阮籍"},{"key":"B","text":"包括向秀、刘伶"},{"key":"C","text":"包括阮咸、王戎、山涛"},{"key":"D","text":"是东晋时期的名士群体"},{"key":"E","text":"包括陶渊明"}],"answer":"ABC","keys":["A","B","C"],"explanation":"竹林七贤为嵇康、阮籍、向秀、刘伶、阮咸、王戎、山涛，是西晋时期的名士群体，不包括陶渊明。嵇康、阮籍、向秀、刘伶、阮咸、王戎、山涛时人称为“竹林七贤”。","type":"多选题"},{"number":134,"stem":"下列属于春季节气的有( )。","options":[{"key":"A","text":"立春、雨水"},{"key":"B","text":"惊蛰、春分"},{"key":"C","text":"清明、谷雨"},{"key":"D","text":"立夏、小满"},{"key":"E","text":"芒种、夏至"}],"answer":"ABC","keys":["A","B","C"],"explanation":"春天：立春、雨水、惊蛰、春分、清明、谷雨； 夏天：立夏、小满、芒种、夏至。 二十四节气中，清明既是节气又是传统节日。","type":"多选题"},{"number":135,"stem":"下列关于宫殿建筑的表述，正确的有( )。","options":[{"key":"A","text":"宫殿是帝王朝会和居住的地方"},{"key":"B","text":"宫殿建筑采取严格的中轴对称的布局方式"},{"key":"C","text":"宫殿建筑实行“左祖右社”的布局"},{"key":"D","text":"北京故宫宫殿分前朝和内廷两部分"},{"key":"E","text":"北京故宫内廷以太和殿为中心"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"宫殿是帝王朝会和居住的地方，是我国古代建筑中最高级、最豪华、艺术价值最高的一种类型；为体现君权受命于天和以皇权为核心的等级观念，宫殿建筑采取严格的中轴对称的布局方式，实行“左祖右社”；北京故宫宫殿分前后两部分，即前朝和内廷，前朝以太和殿、中和殿、保和殿三大殿为中心。 E 项错误，前朝以太和殿、中和殿、保和殿三大殿为中心。","type":"多选题"},{"number":136,"stem":"下列关于红军长征的表述，正确的有( )。","options":[{"key":"A","text":"时间是 1934 年 10月至 1936年 10 月"},{"key":"B","text":"行程二万五千里"},{"key":"C","text":"遵义会议是党的历史上生死攸关的转折点"},{"key":"D","text":"会后成立毛泽东、周恩来、王稼祥组成的三人小组"},{"key":"E","text":"长征胜利结束的标志是井冈山会师"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"1934年 10 月至 1936年 10月，红军长驱二万五千里，胜利完成震撼世界、彪炳史册的长征。遵义会议是党的历史上生死攸关的转折点，事实上确立了毛泽东同志在党中央和红军的领导地位；会后成立毛泽东、周恩来、王稼祥组成的三人小组，负责全军的军事行动。","type":"多选题"},{"number":137,"stem":"下列学派与代表人物的对应关系，正确的有( )。","options":[{"key":"A","text":"孔子、孟子——儒家"},{"key":"B","text":"老子、庄子——道家"},{"key":"C","text":"墨子——墨家"},{"key":"D","text":"商鞅、韩非——法家"},{"key":"E","text":"孙武、孙膑——法家"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"孙武、孙膑是兵家代表人物；其余对应正确。孙武、孙膑是兵家代表人物。道家主张摒弃现代文明、回归原始生活；法家主张严刑峻法，战国中后期一度受到秦国的重用。","type":"多选题"},{"number":138,"stem":"下列关于中国佛教三大体系的表述，正确的有( )。","options":[{"key":"A","text":"北传佛教——以大乘佛教为主，经典主要属于汉语"},{"key":"B","text":"南传佛教——以小乘佛教（上座部佛教）为主"},{"key":"C","text":"藏传佛教——具有活佛转世等特色"},{"key":"D","text":"北传佛教也称汉语系佛教"},{"key":"E","text":"南传佛教也称汉语系佛教"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"北传佛教以大乘佛教为主，其经典主要属于汉语，也称汉语系佛教；南传佛教以小乘佛教（上座部佛教）为主；咒术性、对喇嘛异常尊崇、活佛转世思想和宗教与政治的结合，是历史上藏传佛教的四个特色。E项错误。","type":"多选题"},{"number":139,"stem":"西周青铜器“四大重器”包括( )。","options":[{"key":"A","text":"毛公鼎"},{"key":"B","text":"大盂鼎"},{"key":"C","text":"散氏盘"},{"key":"D","text":"虢季子白盘"},{"key":"E","text":"后母戊鼎"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"西周青铜器四大重器为毛公鼎、大盂鼎、散氏盘和虢季子白盘；后母戊鼎是商朝器物。后母戊鼎是商朝器物，高达 133 厘米、重达 832.84公斤，是迄今世界上发现的最大的青铜器。","type":"多选题"},{"number":140,"stem":"下列古人对天象与人事吉凶关系的认识，正确的有( )。","options":[{"key":"A","text":"木星代表五谷丰登"},{"key":"B","text":"金星代表五谷丰登"},{"key":"C","text":"日食是上天对天子的警告"},{"key":"D","text":"彗星是兵灾的凶象"},{"key":"E","text":"日食象征五谷丰登"}],"answer":"ACD","keys":["A","C","D"],"explanation":"古人认为天象的变化预示着人事的吉凶，如木星（又叫岁星）代表五谷丰登 "text":"过桥米线"},{"key":"B","text":"马介休"},{"key":"C","text":"焗生蚝"},{"key":"D","text":"葡式蛋挞"},{"key":"E","text":"烤乳猪"}],"answer":"BCD","keys":["B","C","D"],"explanation":"葡式蛋挞是澳门美食的代表名片之一；马介休是葡式美食的主要材料；澳门的焗生蚝远近闻名。","type":"多选题"},{"number":154,"stem":"吉林省著名的旅游景观有( )等。","options":[{"key":"A","text":"长白山"},{"key":"B","text":"吉林雾凇"},{"key":"C","text":"长春净月潭"},{"key":"D","text":"查干湖"},{"key":"E","text":"珲春防川"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"本题全部正确。“雄山托天池，林海藏珍奇”的长白山、中国四大自然奇观之一的吉林雾凇、亚洲最大森林氧吧净月潭、渔猎文化胜地查干湖、“一眼望三国”的珲春防川，都是吉林著名的旅游景观。","type":"多选题"},{"number":155,"stem":"新疆正在打造的四大千亿级石化基地有( )。","options":[{"key":"A","text":"独山子—奎屯—克拉玛依"},{"key":"B","text":"乌鲁木齐"},{"key":"C","text":"巴州"},{"key":"D","text":"库尔勒"},{"key":"E","text":"库车"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"新疆油气生产加工规模居全国第一，正打造独山子—奎屯—克拉玛依、乌鲁木齐、巴州、库车四大千亿级石化基地。D项库尔勒不在四大基地之列。","type":"多选题"},{"number":156,"stem":"内蒙古现代农牧业独具优势，“黄金奶源带”“马铃薯种薯黄金带”“肉羊产业带”“玉米黄金带”渐次排布，使内蒙古成为名副其实的( )。","options":[{"key":"A","text":"“粮仓”"},{"key":"B","text":"“肉库”"},{"key":"C","text":"“油都”"},{"key":"D","text":"“绒都”"},{"key":"E","text":"“奶罐”"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"向日葵、谷子、大豆等品种选育全国领先，全国名特优新农产品保持全国第一，是名副其实的“粮仓、肉库、奶罐、绒都”。C 项“油都”不在所列称号之内。","type":"多选题"},{"number":157,"stem":"下列福建茶叶与茶类的对应关系中，正确的有( )。","options":[{"key":"A","text":"安溪铁观音——乌龙茶"},{"key":"B","text":"金骏眉——绿茶"},{"key":"C","text":"正山小种——红茶"},{"key":"D","text":"白毫银针——白茶"},{"key":"E","text":"武夷岩茶——乌龙茶"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"乌龙茶的主要代表有安溪铁观音和武夷岩茶；红茶代表有武夷山“正山小种”、福安“坦洋工夫”等；白茶代表有白毫银针、白牡丹等。","type":"多选题"},{"number":158,"stem":"江西旅游资源可以概括为“四个千年”，包括( )。","options":[{"key":"A","text":"千年瓷都景德镇"},{"key":"B","text":"千年名楼滕王阁"},{"key":"C","text":"千年古刹灵隐寺"},{"key":"D","text":"千年古刹东林寺"},{"key":"E","text":"千年书院白鹿洞"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"“四个千年”即千年瓷都景德镇、千年名楼滕王阁、千年书院白鹿洞、千年古刹东林寺。","type":"多选题"},{"number":159,"stem":"豫菜代表性名菜和小吃有( )。","options":[{"key":"A","text":"鲤鱼焙面"},{"key":"B","text":"洛阳牡丹燕菜"},{"key":"C","text":"葱扒羊肉"},{"key":"D","text":"河南烩面"},{"key":"E","text":"开封灌汤包"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"本题全部正确。豫菜是河南代表菜系，秉承五味调和、质味适中的烹饪理念，兼容南北风味；代表性名菜有鲤鱼焙面、洛阳牡丹燕菜、葱扒羊肉等；特色小吃有河南烩面、胡辣汤、开封灌汤包等。洛阳水席坚守传统制作技艺，汤菜兼备、宴席考究，是豫菜文化与宫廷饮食文化的经典传承。","type":"多选题"},{"number":160,"stem":"下列关于黑龙江世居民族生产方式的对应，正确的有( )。","options":[{"key":"A","text":"赫哲族——以捕鱼为生"},{"key":"B","text":"达斡尔族——以狩猎为生"},{"key":"C","text":"蒙古族、达斡尔族——以牧业为主"},{"key":"D","text":"满族、朝鲜族——以农耕为主"},{"key":"E","text":"鄂伦春族——以狩猎为生"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"赫哲族以捕鱼为生，鄂伦春族以狩猎为生，蒙古族、达斡尔族以牧业为主，满族、朝鲜族以农耕为主。","type":"多选题"},{"number":161,"stem":"下列河流中，发源于青海的有( )。","options":[{"key":"A","text":"黑龙江"},{"key":"B","text":"黄河"},{"key":"C","text":"澜沧江"},{"key":"D","text":"珠江"},{"key":"E","text":"长江"}],"answer":"BCE","keys":["B","C","E"],"explanation":"青海是长江、黄河、澜沧江的发源地，被称为“江河源头”。青海又称“三江源”，素有“中华水塔”之美誉，全省平均海拔 3000米以上。","type":"多选题"},{"number":162,"stem":"塔尔寺的艺术“三绝”包括( )。","options":[{"key":"A","text":"酥油茶"},{"key":"B","text":"唐卡"},{"key":"C","text":"壁画"},{"key":"D","text":"酥油花"},{"key":"E","text":"堆绣"}],"answer":"CDE","keys":["C","D","E"],"explanation":"酥油花、堆绣、壁画被誉为塔尔寺的艺术“三绝”。","type":"多选题"},{"number":163,"stem":"上海科技馆是中国唯一拥有( )三座大型场馆的综合性科学技术博物馆集群。","options":[{"key":"A","text":"科技馆"},{"key":"B","text":"艺术博物馆"},{"key":"C","text":"历史博物馆"},{"key":"D","text":"自然博物馆"},{"key":"E","text":"天文馆"}],"answer":"ADE","keys":["A","D","E"],"explanation":"上海科技馆是中国唯一拥有科技馆、自然博物馆、天文馆三座大型场馆的综合性科学技术博物馆集群，已成为上海特色文化地标、参观量最大的旅游景点之一。","type":"多选题"},{"number":164,"stem":"截至目前，海南的国家 5A级旅游景区包括（ ）。","options":[{"key":"A","text":"海口骑楼老街"},{"key":"B","text":"三亚南山大小洞天"},{"key":"C","text":"槟榔谷黎苗文化旅游区"},{"key":"D","text":"三亚市蜈支洲岛"},{"key":"E","text":"三亚南山文化旅游区"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"截至 2026年 7月，海南有国家 5A级旅游景区 7家：三亚南山文化旅游区、三亚南山大小洞天、呀诺达雨林、分界洲岛、槟榔谷黎苗文化旅游区、三亚市蜈支洲岛、三亚市天涯海角。","type":"多选题"},{"number":165,"stem":"“丝绸之路：长安——天山廊道的路网”由中国与（ ）跨国申报。","options":[{"key":"A","text":"乌兹别克斯坦"},{"key":"B","text":"土库曼斯坦"},{"key":"C","text":"塔吉克斯坦"},{"key":"D","text":"吉尔吉斯斯坦"},{"key":"E","text":"哈萨克斯坦"}],"answer":"DE","keys":["D","E"],"explanation":"“丝绸之路：长安——天山廊道的路网（跨国遗产）”由河南、陕西、甘肃、新疆联合申报。（中国与哈萨克斯坦、吉尔吉斯斯坦跨国申报）。——口诀——丝路三国：中国哈萨克斯坦吉尔吉斯斯坦。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD三/LDD押题第3卷（科目三四）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD三/LDD押题第3卷（科目三四）-试卷.pdf"}]},{"number":4,"subjects":[{"name":"科目一二","questions":[{"number":1,"stem":"《宪法》在总纲中规定：中华人民共和国的一切权力属于中央人民政府。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"中华人民共和国的一切权力属于人民。故本题错误。","type":"判断题"},{"number":2,"stem":"《旅游法》规定，旅行社不得出租、出借旅行社业务经营许可证，或者以其他形式非法转让旅行社业务经营许可。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":3,"stem":"《民法典》规定，用人单位的工作人员因执行工作任务造成他人损害的，由用人单位承担侵权责任。用人单位承担侵权责任后，可以向有故意或过失的工作人员追偿。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"此题错在是“重大过失”，不是“过失”。","type":"判断题"},{"number":4,"stem":"根据《旅行社条例实施细则》，旅行社服务网点以设立社的名义从事《旅行社条例》规定的经营活动，其经营活动的责任和后果，由设立它的分社承担。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"分社和服务网点不具有法人资格，不作为权利、义务的主体，以设立分社、服务网点的旅行社的名义从事《旅游法》《旅行社条例》规定的业务经营，其经营活动的责任和后果，由设立社承担。分社不能设立分支机构。","type":"判断题"},{"number":5,"stem":"经营者主动消除或者减轻违法行为危害后果的，按照规定可以从轻、减轻或者不予处罚。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"条例明确将主动消除、减轻违法行为危害后果列为依照《中华人民共和国行政处罚法》从轻、减轻或者不予处罚的情形，题干表述正确。","type":"判断题"},{"number":6,"stem":"旅游目的地安全风险提示级别为二级的，属于严重级别，用橙色标示。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"根据可能对旅游者造成的危害程度、紧急程度和发展态势，风险提示级别分为一级（特别严重）、二级（严重）、三级（较重）和四级（一般），分别用红色、橙色、黄色和蓝色标示。","type":"判断题"},{"number":7,"stem":"根据《安全生产法》，遵循民事活动自愿的原则，生产经营单位可以与从业人员订立协议，免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"解析根据《安全生产法》第 52条规定，生产经营单位不得以任何形式与从业人员订立协议，免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任。因此，该说法是错误的。","type":"判断题"},{"number":8,"stem":"根据《国内水路运输管理规定》的规定，水路旅客班轮运输业务经营者应当自取得班轮航线经营许可之日起 60 日内开航，并在开航的 15 日前通过媒体并在该航线停靠的各客运站点的明显位置向社会公布所使用的船舶、班期、班次、票价等信息。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。本题说法正确。《国内水路运输管理规定》第 27 条明确规定：“水路旅客班轮运输业务经营者应当自取得班轮航线经营许可之日起 60 日内开航，并在开航的 15 日前通过媒体并在该航线停靠的各客运站点的明显位置向社会公布所使用的船舶、班期、班次、票价等信息。”","type":"判断题"},{"number":9,"stem":"根据《铁路法》的规定，因旅客的过错造成旅客行李损失的，铁路运输企业可以减轻赔偿责任。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。根据《铁路法》第 18 条规定，由于下列原因造成的货物、包裹、行李损失的，铁路运输企业不承担赔偿责任：（1）不可抗力；（2）货物或者包裹、行李中的物品本身的自然属性，或者合理损耗；（3）托运人、收货人或者旅客的过错。因此，若旅客自身存在过错（如未妥善固定行李导致掉落破损），铁路运输企业完全免责，而非“减轻”赔偿责任。","type":"判断题"},{"number":10,"stem":"根据《风景名胜区条例》，风景名胜区门票收入可以用于赔偿区内财产所有权人、使用权人的损失。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"《风景名胜区条例》第三十八条：风景名胜区的门票收入和风景名胜资源有偿使用费应当专门用于风景名胜资源的保护和管理以及风景名胜区内财产的所有权人、使用权人损失的补偿。不是“赔偿”而是“补偿”。","type":"判断题"},{"number":11,"stem":"故意或者过失损毁国家保护的珍贵文物的，构成犯罪的，将依法追究刑事责任。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":12,"stem":"党的二十大报告指出，物质富足、精神富有是社会主义现代化的基本要求。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“基本要求”应为“根本要求”。党的二十大报告原文为：“物质富足、精神富有是社会主义现代化的根本要求。”“根本要求”强调其基础性、决定性地位，区别于一般性要求。“物质文明和精神文明相协调”是中国式现代化的五大特征之一。","type":"判断题"},{"number":13,"stem":"依据习近平新时代中国特色社会主义思想相关理论，坚定道路自信、理论自信、制度自信、文化自信，其中文化自信是一个国家、一个民族发展中更基本、更深沉、更持久的力量。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"坚持社会主义核心价值体系。文化自信是一个国家、一个民族发展中更基本、更深沉、更持久的力量。题干表述正确。","type":"判断题"},{"number":14,"stem":"《宪法》规定，中华人民共和国国徽，中间是五星照耀下的天安门，周围是谷穗和齿轮。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":15,"stem":"国务院各部门应当每日升挂国旗。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《国旗法》规定，国务院各部门，应当在工作日升挂国旗。","type":"判断题"},{"number":16,"stem":"《旅游强国建设“十五五”规划》在“工作中要做到”的四个坚持中，“坚持提质增效”被列在首位。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《旅游强国建设“十五五”规划》在“工作中要做到”的四个坚持中，按顺序分别为：第一，坚持守正创新；第二，坚持提质增效；第三，坚持融合发展；第四，坚持高品质体验。","type":"判断题"},{"number":17,"stem":"2026年 10 月 14日，在法国马赛召开的国际灌排委员会第 77 届国际执行理事会会议上，2026年世界灌溉工程遗产名录正式公布，我国申报的 5 处灌溉工程全部成功入选。至此，中国的世界灌溉工程遗产总数已达 46 项。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“4 处”。2026年10月14日，在法国马赛召开的国际灌排委员会第77届国际执行理事会会议上，2026年世界灌溉工程遗产名录正式公布，我国申报的 4 处灌溉工程全部成功入选。至此，中国的世界灌溉工程遗产总数已达 46项。我国这次申报的灌溉工程有 4处，分别是：河南沁河广利渠、甘肃讨赖河绿洲灌溉系统、江西上饶市广信黄沙渠、福建长泰龙津古陂灌溉工程。","type":"判断题"},{"number":18,"stem":"每年 8月为全国科普月，2026年全国科普月以“科技改变生活创新赢得未来”为主题。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“9 月”。2024年，新修订的科普法公布施行，明确每年 9 月为全国科普月。2026年全国科普月以“科技改变生活创新赢得未来”为主题。","type":"判断题"},{"number":19,"stem":"2026 年 8 月 19日，朱雀三号遥二运载火箭在东风商业航天创新试验区发射升空，运载火箭全程飞行正常，一子级成功着陆于回收场预定位置。此次任务是我国首次成功实施重复使用运载火箭一子级着陆腿方式回收，标志着我国重复使用火箭技术取得重大突破。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2026年 8 月 19日，朱雀三号遥二运载火箭在东风商业航天创新试验区发射升空，运载火箭全程飞行正常，一子级成功着陆于回收场预定位置，二子级将搭载的鸿鸽 03 星顺利送入预定轨道，飞行试验任务取得圆满成功。此次任务是我国首次成功实施重复使用运载火箭一子级着陆腿方式回收，标志着我国重复使用火箭技术取得重大突破。","type":"判断题"},{"number":20,"stem":"2026 年 8 月 15 日是第四个全国生态日，主题为“厚植中国式现代化的绿色底色”。继民法典之后我国第二部以“法典”命名的法律——《中华人民共和国生态环境法典》自 15日起正式施行，标志着我国生态环境法治建设迈入新境界，为实现人与自然和谐共生的现代化进一步筑牢法治根基。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":21,"stem":"2013 年 10 月 1 日，《中华人民共和国旅游法》施行，成为我国旅游业发展史上的一个里程碑。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2013年 10月 1日《中华人民共和国旅游法》施行，成为我国旅游业发展史上的一个重要里程碑。","type":"判断题"},{"number":22,"stem":"导游服务的扩散作用体现在对旅游产品和旅行社形象的传播，有助于扩大旅游产品的知名度和影响力。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。导游服务的扩散作用体现在对旅游产品和旅行社形象的传播，有助于扩大旅游产品的知名度和影响力。","type":"判断题"},{"number":23,"stem":"女士为保持面容光泽，女导游可以在带团期间画浓妆，但是不可以当众化妆或补妆。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。女士为保持面容光泽，女士可施淡妆，但不要浓妆，不当众化妆或补妆。","type":"判断题"},{"number":24,"stem":"旅游活动中，需用旅游者证件时，由全陪或领队统一收取，用毕立即如数归还并当面清点。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":25,"stem":"地陪在客人入住后，告知旅游者自己将会在饭店大堂等候 40~60 分钟或对每个房间进行巡视。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。地陪应根据实际情况，告知旅游者自己会在饭店大堂等候 20~30 分钟或对每个房间进行巡视。","type":"判断题"},{"number":26,"stem":"领队带领游客在海外旅游期间，如旅游者要求安排另行付费旅游项目，领队应在行程计划中“自由活动”时段内组织实施，且不影响其他旅游者行程安排。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":27,"stem":"在杭州西湖边，导游讲解荷花形态时，用手比画出荷花“出淤泥而不染，濯清涟而不妖”的亭亭玉立之态，这是导游讲解手势语中的指示手势语。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。在杭州西湖边，导游讲解荷花形态时，用手比画出荷花“出淤泥而不染，濯清涟而不妖”的亭亭玉立之态，这是导游讲解手势语中的象形手势语。","type":"判断题"},{"number":28,"stem":"当旅游者提出要求时，导游可以先有条件地答应，而实际上该条件基本无法满足，从而拒绝对方。这种方法叫做婉转拒绝法。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。婉转拒绝法是指当旅游者提出要求时，导游可以先有条件地答应，而实际上该条件基本无法满足，从而婉转地拒绝对方。","type":"判断题"},{"number":29,"stem":"旅游者提问后，导游引导其他旅游者回答，可促进旅游者之间互动，但操作难度大，需导游有较强控团能力，且不宜多用。这是客问客答法的特点。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。客问客答是指旅游者提问后，导游引导其他旅游者回答，可促进旅游者之间互动，但操作难度大，需导游有较强控团能力。","type":"判断题"},{"number":30,"stem":"旅游者要求变更行程，依据《中华人民共和国旅游法》，因变更行程增加的费用由旅游者承担，减少的费用不予退还。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。旅游者要求变更行程，向旅游者解释依据《中华人民共和国旅游法》，因变更行程增加的费用由旅游者承担，减少的费用在扣除已实际发生的成本后退还给旅游者。","type":"判断题"},{"number":31,"stem":"旅游者因自身疾病在境外死亡的，领队应及时向中国驻当地使领馆或政府派出机构报告，并按旅行社的安排处理相关事宜，但无需向外国警方报案。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。本题说法错误。旅游者死亡发生在境外的，领队应及时向当地警方报案，同时向中国驻当地使领或政府派出机构馆，并按旅行社的安排处理相关事宜。","type":"判断题"},{"number":32,"stem":"参与徒步旅游，进入草木茂密区域应穿长袖长裤，扎紧裤脚袖口，采用“打草惊蛇”方式驱赶蛇虫。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。风险防范：进入草木茂密区域应穿长袖长裤，扎紧裤脚袖口；采用“打草惊蛇”方式驱赶蛇虫，做好个人防护，避免被蛇虫咬伤。","type":"判断题"},{"number":33,"stem":"当旅游者在计划内购物店或自由活动期间所购买的商品出现质量问题，导游应该主动陪同旅游者前往商店，协助其办理退赔手续。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。当旅游者计划内购物店或自由活动期间所购买的商品出现质量问题，必要时，陪同旅游者前往购买地点，协助其办理退赔手续。","type":"判断题"},{"number":34,"stem":"一旦确认旅行社实际安排的饭店低于合同约定标准，导游需及时向旅游者致歉，并即刻向旅行社汇报，督促其迅速做出调整安排。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":35,"stem":"若在野外遭遇雷电且一时无法回到旅游客车，要立即到大树下、电线杆旁及高坡避雨。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。若在野外遭遇雷电且一时无法回到旅游客车，应立即寻找有防雷装置的庇护所，如装有避雷针的建筑物、山洞等。不宜选择孤立小屋、大树下、电线杆旁及高坡避雨。","type":"判断题"},{"number":36,"stem":"若遭遇山体滑坡，不要躲到有滚石和大量堆积物的山坡下方；当无法继续逃离时，应迅速抱住身边的树木等固定物体。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":37,"stem":"国有文物、非国有文物中的珍贵文物以及国家规定禁止出境的其他文物，在任何情况下都不得出境。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。国有文物、非国有文物中的珍贵文物以及国家规定禁止出境的其他文物，不得出境，但依法出境展览或因特殊需要经国务院批准出境的除外。","type":"判断题"},{"number":38,"stem":"全球最大国际航空联盟是星空联盟，我国的中国东方航空、厦门航空是其成员。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。全球最大国际航空联盟是星空联盟，我国的中国国际航空、深圳航空是成员。","type":"判断题"},{"number":39,"stem":"火车团体票（20人以上同行程）退改签需不晚于开车前 48小时。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。团体票（20人以上同行程）退改签需不晚于开车前 48小时。","type":"判断题"},{"number":40,"stem":"全国列车实行车票实名制，凭本人有效身份证件购票，同一日期、车次每证限购 1 张。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。全国列车实行车票实名制；须凭本人有效身份证件购票；同一日期、车次每证限购 1张。二、单选题","type":"判断题"},{"number":41,"stem":"在韩国釜山召开的联合国教科文组织第 48 届世界遗产大会，于北京时间 7 月 27日审议通过了中国黄（渤）海候鸟栖息地世界自然遗产边界调整项目，（）候鸟栖息地成功纳入世界自然遗产。","options":[{"key":"A","text":"辽宁大连长山群岛"},{"key":"B","text":"辽宁辽河口"},{"key":"C","text":"山东黄河口"},{"key":"D","text":"福建闽江河口"}],"answer":"A","keys":["A"],"explanation":"2026 年 7 月 27日，在韩国釜山召开的第 48届世界遗产大会上，中国黄（渤）海候鸟栖息地世界自然遗产边界调整项目获得通过，辽宁大连长山群岛候鸟栖息地成功纳入世界自然遗产，这是该系列遗产继 2024 年后的再次扩展。辽宁辽河口、山东黄河口虽同属黄（渤）海候鸟栖息地系列，但并非本次新纳入的组成部分；福建闽江河口则不属于该系列世界自然遗产。","type":"单选题"},{"number":42,"stem":"《宪法》规定，（）是中华人民共和国的根本政治制度。","options":[{"key":"A","text":"人民代表大会制度"},{"key":"B","text":"社会主义制度"},{"key":"C","text":"人民民主专政制度"},{"key":"D","text":"选举制度"}],"answer":"A","keys":["A"],"explanation":"人民代表大会制度是我国的根本政治制度。","type":"单选题"},{"number":43,"stem":"根据《中华人民共和国宪法》的规定，我国国家机构的组织原则是（）。","options":[{"key":"A","text":"三权分立原则"},{"key":"B","text":"民主集中制原则"},{"key":"C","text":"权力制衡原则"},{"key":"D","text":"少数服从多数原则"}],"answer":"B","keys":["B"],"explanation":"宪法第 3 条确立了民主集中制为国家机构的组织原则。民主集中制不仅是人民代表大会制度的组织原则，也是我国所有国家机构共同遵循的活动原则。A项错误，三权分立是西方资本主义国家的政权组织原则，我国宪法未予确立；C项错误，权力制衡与三权分立相关，不是我国宪法确立的组织原则；D 项错误，少数服从多数是民主决策的一般规则，不是宪法规定的国家机构组织原则。","type":"单选题"},{"number":44,"stem":"根据《旅游法》的规定，旅行社具备履行条件，经旅游者要求仍拒绝履行合同，造成旅游者人身损害、滞留等严重后果的，旅游者还可以要求旅行社支付旅游费用（）的赔偿金。","options":[{"key":"A","text":"一倍到五倍"},{"key":"B","text":"一倍到三倍"},{"key":"C","text":"三倍"},{"key":"D","text":"双倍"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 70条，旅行社具备履行条件，经旅游者要求仍拒绝履行合同，造成旅游者人身损害、滞留等严重后果的，旅游者还可以要求旅行社支付旅游费用一倍以上三倍以下的赔偿金。","type":"单选题"},{"number":45,"stem":"《旅游法》规定，旅游行程开始前，旅游者可以将包价旅游合同中自身的权利义务转让第三人，旅行社没有正当理由的不得拒绝，因此增加的费用由（）承担。","options":[{"key":"A","text":"第三人"},{"key":"B","text":"旅游者和第三人"},{"key":"C","text":"旅游者"},{"key":"D","text":"旅游者或第三人"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 64条规定，旅游行程开始前，旅游者可以将包价旅游合同中自身的权利义务转让给第三人，旅行社没有正当理由的不得拒绝，因此增加的费用由旅游者和第三人承担。[答题技巧]旅游行程开始前，旅游者可以转让权利义务，旅行社没有正当理由不得拒绝，增加的费用由转让人和受让人承担。不能拒绝，但是也有条件不允许的情况不得已拒绝。所以是没有正当理由的不得拒绝。","type":"单选题"},{"number":46,"stem":"《中华人民共和国旅游法》规定，景区超过最大承载量接待旅游者的，由景区主管部门责令改正，情节严重的，责令停业整顿（）。","options":[{"key":"A","text":"1 个月至 3 个月"},{"key":"B","text":"1 个月至 6 个月"},{"key":"C","text":"6 个月至 9 个月"},{"key":"D","text":"9 个月至 12个月"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 105条，景区在旅游者数量可能达到最大承载量时，未依照本法规定公告或者未向当地人民政府报告，未及时采取疏导、分流等措施，或者超过最大承载量接待旅游者的，由景区主管部门责令改正，情节严重的，责令停业整顿 1 个月至 6 个月。","type":"单选题"},{"number":47,"stem":"我国《旅游法》规定，（）统筹组织国家旅游形象的境外推广工作。","options":[{"key":"A","text":"国务院"},{"key":"B","text":"国务院旅游主管部门"},{"key":"C","text":"国家"},{"key":"D","text":"国务院外交主管部门"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 25条规定，国家制定并实施旅游形象推广战略。国务院旅游主管部门统筹组织国家旅游形象的境外推广工作，建立旅游形象推广机构和网络，开展旅游国际合作与交流。","type":"单选题"},{"number":48,"stem":"根据《民法典》的规定，合同解除后，以下说法正确的是（）。","options":[{"key":"A","text":"尚未履行的，继续履行"},{"key":"B","text":"已经履行的，当事人无法请求恢复原状"},{"key":"C","text":"已经履行的，根据履行情况和合同性质，当事人可以请求采取其他补救措施"},{"key":"D","text":"已经履行的，当事人无权请求赔偿损失"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 566条规定，合同解除后，尚未履行的，终止履行；已经履行的，根据履行情况和合同性质，当事人可以请求恢复原状或者采取其他补救措施，并有权请求赔偿损失。","type":"单选题"},{"number":49,"stem":"根据《民法典》的规定，16 周岁以上的未成年人，以自己的劳动收入为主要生活来源的，（）。","options":[{"key":"A","text":"为完全民事行为能力人"},{"key":"B","text":"为限制民事行为能力人"},{"key":"C","text":"视为完全民事行为能力人"},{"key":"D","text":"为无民事行为能力人"}],"answer":"C","keys":["C"],"explanation":"16 周岁以上的未成年人（不满 18周岁的自然人为未成年人），以自己的劳动收入为主要生活来源的，视为完全民事行为能力人。","type":"单选题"},{"number":50,"stem":"根据《民法典》的规定，以下关于防止损失扩大义务的说法，正确的是（）。","options":[{"key":"A","text":"当事人一方违约后，对方可以采取适当措施防止损失的扩大"},{"key":"B","text":"没有采取适当措施致使损失扩大的，因为对方违约造成的损失也无权要求赔偿"},{"key":"C","text":"当事人因防止损失扩大支出的合理费用，由双方分担"},{"key":"D","text":"因违约而发生的损害由违约方所致，受害人对此没有过错"}],"answer":"D","keys":["D"],"explanation":"《民法典》第 591条规定，当事人一方违约后，对方应当采取适当措施防止损失的扩大；没有采取适当措施致使损失扩大的，不得就扩大的损失要求赔偿。当事人因防止损失扩大支出的合理费用，由违约方承担。","type":"单选题"},{"number":51,"stem":"为保护当事人的利益，《民法典》规定，基于重大误解实施的民事法律行为，行为人有权请求人民法院或者仲裁机构（）。","options":[{"key":"A","text":"变更"},{"key":"B","text":"变更或撤销"},{"key":"C","text":"撤销"},{"key":"D","text":"宣布无效"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 147条规定，基于重大误解实施的民事法律行为，行为人有权请求人民法院或者仲裁机构予以撤销。","type":"单选题"},{"number":52,"stem":"根据《民法典》的规定，建筑物、构筑物或者其他设施及其搁置物、悬挂物发生脱落、坠落造成他人损害，（）无需承担侵权责任。","options":[{"key":"A","text":"所有人"},{"key":"B","text":"施工单位"},{"key":"C","text":"使用人"},{"key":"D","text":"管理人"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 1253条，建筑物、构筑物或者其他设施及其搁置物、悬挂物发生脱落、坠落造成他人损害，所有人、管理人或者使用人不能证明自己没有过错的，应当承担侵权责任。","type":"单选题"},{"number":53,"stem":"某旅行社导游杨某带团游览一山水景点时，因道路狭窄，游客李某被同行张某不慎挤落水中，造成人身伤害。有证据表明，杨某多次提醒游客注意安全。根据《民法典》的规定，下列选项正确的是（）。","options":[{"key":"A","text":"旅行社对李某不承担赔偿责任"},{"key":"B","text":"旅行社应当对李某承担连带赔偿责任"},{"key":"C","text":"旅行社应当对李某承担补充赔偿责任"},{"key":"D","text":"旅行社赔偿后，有权向张某追偿"}],"answer":"A","keys":["A"],"explanation":"解析因第三人的行为造成旅游者人身损害、财产损失，由第三人承担责任；旅游经营者、旅游辅助服务者未尽安全保障义务，旅游者请求其承担相应补充责任的，人民法院应予支持。关键词：第三人张某造成李某受伤，旅行社的导游杨某已尽安全保障义务，故旅行社不对李某承担赔偿。","type":"单选题"},{"number":54,"stem":"根据《民法典》的规定，以下对侵害他人造成人身损害的赔偿，说法正确的是（）。","options":[{"key":"A","text":"应当赔偿医疗费、护理费等合理费用"},{"key":"B","text":"因误工减少的收入及利息"},{"key":"C","text":"同一侵权行为造成多人死亡的，应当以相同数额确定死亡赔偿金"},{"key":"D","text":"被侵权人死亡的，其亲属有权请求侵权人承担侵权责任"}],"answer":"A","keys":["A"],"explanation":"“利息”错误，《民法典》第 1179条，侵害他人造成人身损害的，应当赔偿医疗费、护理费、交通费、营养费、住院伙食补助费等为治疗和康复支出的合理费用，以及因误工减少的收入；“应当”错误，第 1180 条，因同一侵权行为造成多人死亡的，可以以相同数额确定死亡赔偿金；“亲属”错误，第 1181条，被侵权人死亡的，其近亲属有权请求侵权人承担侵权责任。","type":"单选题"},{"number":55,"stem":"根据《旅游法》的规定，旅行社组织旅游活动必须向（）的供应商订购旅游产品和旅游服务。","options":[{"key":"A","text":"优质"},{"key":"B","text":"合格"},{"key":"C","text":"诚信"},{"key":"D","text":"报价合理"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 34条规定，旅行社组织旅游活动必须向合格的供应商订购旅游产品和旅游服务。","type":"单选题"},{"number":56,"stem":"依据《旅行社服务质量赔偿标准》，旅行社组织国内旅游因自身原因不能成行的，应在规定的期限内通知旅游者。下列关于旅行社赔偿违约金的说法中，正确的是（）。","options":[{"key":"A","text":"提前 3 日通知的，应支付旅游费用总额 20%的违约金"},{"key":"B","text":"提前 2 日通知的，应支付旅游费用总额 30%的违约金"},{"key":"C","text":"提前 5 日通知的，应支付旅游费用总额 15%的违约金"},{"key":"D","text":"提前 6 日通知的，应支付旅游费用总额 10%的违约金"}],"answer":"D","keys":["D"],"explanation":"“提前 3 日通知……”和“提前 2 日通知……”错误，出发前 3 日至 1日通知的，应支付旅游费用总额 15%的违约金；“提前 5日通知……”错误，出发前 7 日（含 7日）至 4日通知，应支付旅游费用总额 10%的违约金。","type":"单选题"},{"number":57,"stem":"根据《旅行社条例》的规定，某旅行社导游员小张未经旅游者同意，擅自将团队带入行程单以外的某购物店购买商品，那么旅游者有权在（）要求旅行社为其办理退货并先行垫付退货货款。","options":[{"key":"A","text":"购买商品后 30 日内"},{"key":"B","text":"旅游合同签订后 30 日内"},{"key":"C","text":"旅游行程结束后 30 日内"},{"key":"D","text":"旅游行程结束前"}],"answer":"C","keys":["C"],"explanation":"《旅游法》第 35条规定，旅行社不得以不合理的低价组织旅游活动，诱骗旅游者，并通过安排购物或者另行付费旅游项目获取回扣等不正当利益。旅行社组织、接待旅游者，不得指定具体购物场所，不得安排另行付费旅游项目。但是，经双方协商一致或者旅游者要求，且不影响其他旅游者行程安排的除外。发生违反前两款规定情形的，旅游者有权在旅游行程结束后 30日内，要求旅行社为其办理退货并先行垫付退货货款，或者退还另行付费旅游项目的费用。","type":"单选题"},{"number":58,"stem":"根据《旅游法》《旅行社条例》的规定，以下说法正确的是（）。","options":[{"key":"A","text":"旅行社为接待旅游者委派的导游人员，应当持有国家规定的导游资格证"},{"key":"B","text":"旅行社组织团队出境旅游，应当按照规定安排领队或者导游全程陪同"},{"key":"C","text":"旅行社应当与其委派从事领队业务的导游订立劳务合同"},{"key":"D","text":"旅行社应当将本单位领队名单报所在地省级旅游行政管理部门备案"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 36条规定，旅行社组织团队出境旅游或者组织、接待团队入境旅游，应当按照规定安排领队或者导游全程陪同。","type":"单选题"},{"number":59,"stem":"在线旅游经营者未取得质量标准、信用等级使用相关称谓和标识的，依据《在线旅游经营服务管理暂行规定》，由县级以上文化和旅游主管部门责令改正，给予警告，可以并处（）万元以下罚款。","options":[{"key":"A","text":"1"},{"key":"B","text":"3"},{"key":"C","text":"5"},{"key":"D","text":"10"}],"answer":"B","keys":["B"],"explanation":"《在线旅游经营服务管理暂行规定》第 34 条规定，在线旅游经营者违反本规定第12 条第 1 款有关规定，未取得质量标准、信用等级使用相关称谓和标识的，由县级以上文化和旅游主管部门责令改正，给予警告，可并处 3 万元以下罚款。","type":"单选题"},{"number":60,"stem":"《文化
