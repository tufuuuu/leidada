接对旅游者进行劝慰，而是采用旁敲侧击的劝慰方法，即侧面迂回法，也称“兜圈子”；间接暗示法：发现问题时，导游既不直接明说，也不从侧面劝告，而是采用含蓄隐晦的动作或声音暗示旅游者接受劝告的方法。","type":"多选题"},{"number":155,"stem":"导游带领商务团旅行的时候，应该（）。","options":[{"key":"A","text":"突出专业性，在穿着上保持专业的职业形象"},{"key":"B","text":"掌握常用商务礼仪，景点游览宜少而精"},{"key":"C","text":"导游在接待安排中应提供快速高效的服务"},{"key":"D","text":"把握灵活性，谁是准备应对旅游行程的变更"},{"key":"E","text":"不该看的不看，不该问的不问，不该听的不听"}],"answer":"ACD","keys":["A","C","D"],"explanation":"B 选项后半句是老年团的带团方式；E 选项是政务团带团的要求，其余都对。","type":"多选题"},{"number":156,"stem":"旅游者要求亲友随团，导游应该（）。","options":[{"key":"A","text":"在条件允许（如车上有空位）且不影响其他人的情况下，可满足旅游者要求"},{"key":"B","text":"事先要征得领队和旅游团其他成员的同意"},{"key":"C","text":"导游协助旅游者办理入团手续，并交付各种费用"},{"key":"D","text":"对随团活动的亲友应特殊照顾"},{"key":"E","text":"如果未缴纳费用就直接随团活动，导游直接令其下车"}],"answer":"ABC","keys":["A","B","C"],"explanation":"旅游者要求亲友随团的处理 1. 条件允许时：在条件允许（如车上有空位）且不影响其他人的情况下，可满足旅游者要求，但事先要征得领队和旅游团其他成员的同意；2. 协助办理：手续导游协助旅游者办理入团手续，并交付各种费用；3. 热情服务：导游对随团活动的亲友应热心服务，一视同仁，并根据情况给予照顾；4. 解释规定：如果旅游者亲友不办理手续、不交纳费用就直接随团活动，导游应有礼貌地向；旅游者及其亲友解释旅行社的有关规定，并做好解释工作。","type":"多选题"},{"number":157,"stem":"旅游途中旅游者晕动病发作，导游应（）。","options":[{"key":"A","text":"提醒旅游者可通过听音乐、赏远处风光等转移注意力"},{"key":"B","text":"协调换至平稳位置，通风透气呼吸新鲜空气"},{"key":"C","text":"涂抹风油精、清凉油于太阳穴等处提神"},{"key":"D","text":"备食品袋、塑料袋、纸巾或毛巾，方便清理个人卫生"},{"key":"E","text":"症状严重时，乘坐客车可请司机尽快停车，让旅游者下车缓解"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"本题说法全部正确，全选。","type":"多选题"},{"number":158,"stem":"当旅游者出现不当行为时，导游应（）。","options":[{"key":"A","text":"应立即制止，不回避、不躲闪"},{"key":"B","text":"装作没有看到，事不关己"},{"key":"C","text":"严肃冷静地指出行为不当之处，提醒继续该行为的严重后果"},{"key":"D","text":"立即向组团社汇报"},{"key":"E","text":"若旅游者不听劝阻，及时汇报给旅行社，必要时汇报给相关主管部门，配合调查"}],"answer":"ACE","keys":["A","C","E"],"explanation":"1. 立即制止不当行为：发现不当行为，导游应立即制止，不回避、不躲闪 2. 指出问题所在：严肃冷静地指出行为不当之处，区分问题性质，提醒继续该行为的严重后果 3. 及时报告相关部门：若旅游者不听劝阻，导游应及时汇报给旅行社，并在协助下汇报给相关主管部门，配合调查。","type":"多选题"},{"number":159,"stem":"旅游过程中，因客观原因导致行程变更，导游应该（）。","options":[{"key":"A","text":"第一时间将现场情况汇报给旅行社"},{"key":"B","text":"将旅行社的处理建议准确、清晰地告知旅游者"},{"key":"C","text":"由于是客观原因，无需过多提供情绪安抚"},{"key":"D","text":"对旅游者进行适当补偿，包括精神补偿和物质补偿"}],"answer":"ABD","keys":["A","B","D"],"explanation":"解析 C 项错误，需要安抚旅游者情绪，提供更细致的服务，如及时沟通信息、提供替代方案等；E 项为：旅行社原因导致的变更，采用的处理方式。其余选项描述正确。","type":"多选题"},{"number":160,"stem":"如果旅游者遭遇治安事故，导游老王应该（）。","options":[{"key":"A","text":"迅速采取措施保护旅游者的人身和财产安全"},{"key":"B","text":"在确保旅游者安全的同时，找机会拨打 110 报警，"},{"key":"C","text":"提醒司机做好安全配合"},{"key":"D","text":"做好旅游者的情绪安抚工作"},{"key":"E","text":"及时向旅行社汇报情况，协助有关方面做好善后处理"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"1. 立即采取保护措施：事故发生后，导游应迅速采取措施保护旅游者的人身和财产安全 2. 马上报警求助：在确保旅游者安全的同时，找机会拨打 110 报警，民警到达后积极配合调查并取得报案证明 3. 安抚旅游者情绪：做好旅游者的情绪安抚工作，并协助他们向警方查询案件信息及进展情况 4. 做好善后工作：及时向旅行社汇报情况，协助有关方面做好善后处理。","type":"多选题"},{"number":161,"stem":"为防止食物中毒事故，导游可采取以下措施：（）。","options":[{"key":"A","text":"选择卫生可靠的餐厅用餐"},{"key":"B","text":"每餐对食品进行留样"},{"key":"C","text":"提醒旅游者勿食街边小摊食物"},{"key":"D","text":"用餐时若发现菜肴、饮料不卫生立即报告旅行社"},{"key":"E","text":"不吃隔夜、生冷食物及野生果实"}],"answer":"ACE","keys":["A","C","E"],"explanation":"1. 选择卫生可靠的餐厅用餐：安排或建议旅行社安排有卫生保障的餐厅，避免无证经营场所 2. 做好安全饮食提示：提醒旅游者勿食街边小摊食物，购买包装食品时查看生产日期和保质期，不吃隔夜、生冷食物及野生果实 3. 及时处理饮食变质问题：用餐时若发现菜肴、饮料不卫生或存在过期、变质、异味等情况，立即让餐厅撤下并采取补救措施，同时留意旅游者用餐后的状况。","type":"多选题"},{"number":162,"stem":"一旦发生地震被压埋后，科学自救的要点包括（）。","options":[{"key":"A","text":"保持冷静，有计划地逐步清除压在身上的物体，努力挣脱束缚"},{"key":"B","text":"大声疾呼，让救援人员尽快发现自己"},{"key":"C","text":"立即捂住口鼻和头部，有效过滤灰尘，防止灰尘呛闷引发室息"},{"key":"D","text":"避免出现睡觉、急躁、哭喊、唱歌或盲目行动等消耗体力的行为"},{"key":"E","text":"一旦发现救援信号或有利时机，及时通过喊话、敲击等方式发出求救信号"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"（1）积极尝试挣脱：若不幸被压埋，但手部或其他身体部位仍有活动能力，应保持冷静，有计划地逐步清除压在身上的物体，努力挣脱束缚（2）保障呼吸与生存空间：当无法完全脱困时，要着重挪开头部、胸部周围的杂物，腾出足够空间，保证呼吸顺畅。如有湿毛巾、衣物或其他布料等可用，应立即捂住口鼻和头部，有效过滤灰尘，防止灰尘呛闷引发室息，同时也能对头部提供一定保护，减轻坠落物对头部的冲击（3）稳定生存环境：利用身边的砖块、木板等坚固物品，对残垣断壁进行支撑，以扩大和稳定生存空间，降低周围物体进一步坍塌的风险，为长时间等待救援提供相对安全的环境（4）保持冷静与合理自救：被压埋人员务必保持心理镇定，坚定自救信念，鼓起勇气和毅力。避免出现睡觉、急躁、哭喊、唱歌或盲目行动等消耗体力的行为，应合理分配体力，尽可能延长生存时间。要时刻留意外界动静，一旦发现救援信号或有利时机，及时通过喊话、敲击（如敲击管道、墙体等能够产生声响的物体）、使用通信工具（如手机）等方式发出求救信号，提高救援的概率。","type":"多选题"},{"number":163,"stem":"发生海啸落入水中后，自救的技巧包括（）。","options":[{"key":"A","text":"尽快脱掉外衣，否则吸水变重"},{"key":"B","text":"保持冷静，避免举手、挣扎"},{"key":"C","text":"尽快开始游泳，避免沉没"},{"key":"D","text":"不饮用海水"},{"key":"E","text":"尽量抓住身边大的漂浮物增加浮力"}],"answer":"BDE","keys":["B","D","E"],"explanation":"保持冷静，避免举手、挣扎；尽量减少活动，漂浮水面随波漂流；尽量抓住身边大的漂浮物增加浮力；不要脱掉衣物（即使吸水变重）；尽量避免游泳；不饮用海水（即使口渴难忍）；尽量向其他落水者靠拢。","type":"多选题"},{"number":164,"stem":"关于航空公司退票和变更描述正确的选项是（）。","options":[{"key":"A","text":"承运人或代理人退票费不超客票实际售价"},{"key":"B","text":"承运人原因改期或签转不收变更费"},{"key":"C","text":"旅客非自愿退票依具体条款可能收费"},{"key":"D","text":"航班取消/延误等航司责任变更费全免"},{"key":"E","text":"特殊事件遵守客票限定条件通常收费"}],"answer":"ABD","keys":["A","B","D"],"explanation":"承运人或代理人按运输总条件、客票使用条件办理，退票费不超客票实际售价，特价机票并非全都不退改签；承运人原因改期或签转：承运人或代理人应在有可利用座位或签转承运人同意时，免费为旅客改期或签转，不收变更费非承运人原因客票变更：按运输总条件、客票使用条件处理依具体条款可能收费非自愿退票：承运人或代理人不收退票费；航班取消/延误等航司责任全免（变更费）；航司原因或特殊事件，全免（退票费）。","type":"多选题"},{"number":165,"stem":"为了确保游客滑雪的安全，作为导游应该提醒旅游者（）。","options":[{"key":"A","text":"身着颜色与雪面白色有较大反差的滑雪服"},{"key":"B","text":"如果是初学者选择平缓宽敞的初级场地"},{"key":"C","text":"不在拥挤滑雪道上低速滑行"},{"key":"D","text":"保持与其他滑雪者的安全距离"},{"key":"E","text":"选择保暖性能好的滑雪服，佩戴手套、帽子等保暖物品"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"C 选项错误，不在拥挤滑雪道上高速滑行。其余选项描述正确。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD二/LDD押题第2卷（科目一二）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD二/LDD押题第2卷（科目一二）-试卷.pdf"},{"name":"科目三四","questions":[{"number":1,"stem":"春节活动从腊月二十三过小年开始，直到正月十五元宵节结束。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。春节起源于原始社会的腊祭。春节活动从腊月二十三过小年开始，经过除夕、春节，直到正月十五元宵节结束。正月十五为每年第一个望月，称为上元节，也称元宵节，是春节活动的高潮和结束。","type":"判断题"},{"number":2,"stem":"红茶出现于明朝，用全发酵法制成。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“明朝”错误。红茶出现于滇期，用全发酵法制成。制作关键是渥红（发酵）以促进酶活性，使多酚类充分氧化。红茶多以产地命名，以安徽祁红、云南滇红尤为出众。","type":"判断题"},{"number":3,"stem":"《论语》《孟子》和从《礼记》中抽出的《大学》《中庸》，合称“四书”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。《论语》《孟子》和从《礼记》中抽出的《大学》《中庸》，合称“四书”。朱熹著《四书集注》后来成为科举考试标准的范本，答案不能背离朱子的注解。","type":"判断题"},{"number":4,"stem":"明清科举考试内容以儒学“四书五经”为主，格式限定为八股文。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。明清科举考试内容以儒学“四书五经”为主，格式限定为八股文。明清科举考试制度固定，一般每三年举行一次，每次两轮。发榜时用黄纸书写，故称金榜题名。","type":"判断题"},{"number":5,"stem":"扬州个园园主特别爱荷，园内荷花成林，故取“月映荷成千个字”之句命名。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“爱荷”错误。扬州个园园主特别爱竹，园内翠竹成林，故取清袁枚“月映竹成千个字”之句命名。个园小巧玲珑，以假山堆叠精巧著名，采取分峰叠石的手法，运用笋石、湖石、黄石、宣石表现春、夏、秋、冬四季景色，号称“四季假山”。","type":"判断题"},{"number":6,"stem":"《营造法式》是南宋政府颁行的各种建筑工程的“规范”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“南宋”错误。《营造法式》是北宋政府为了管理宫室、坛庙、官署、府第等建筑工程，于北宋崇宁二年（1103 年）颁行的，是各种建筑的设计、结构、用料和施工的“规范”。","type":"判断题"},{"number":7,"stem":"舫是仿造舟船造型的建筑，常建于水际或池中。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。舫是仿造舟船造型的建筑，常建于水际或池中。","type":"判断题"},{"number":8,"stem":"孔子伦理思想可以概括为“仁”和“义”两个字。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“义”错误。孔子伦理思想可以概括为两个字：“仁”和“礼”。","type":"判断题"},{"number":9,"stem":"汉字是记录汉语的符号，属表意文字。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。汉族的语言简称汉语，属汉藏语系，是世界上历时最悠久、最丰富的语言之一。汉字是记录汉语的符号，属表意文字。","type":"判断题"},{"number":10,"stem":"曹丕的《燕歌行》是我国现存最早的文人创作的完整七言诗。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。诗歌代表作《燕歌行》，是我国现存最早的文人创作的完整七言诗，《典论·论文》是我国文学史上第一篇文学批评著作。通篇七言，被认为是我国现存第一首文人创作的七言诗，标志着七言诗的形成。","type":"判断题"},{"number":11,"stem":"《诗经》的表现手法归纳为风、雅、颂。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《诗经》的表现手法归纳为赋、比、兴。《诗经》按音乐的特点分为风、雅、颂三部分。风是民间歌谣，雅为朝廷诗乐，颂为宗庙祭祀乐歌。","type":"判断题"},{"number":12,"stem":"绍兴加饭酒和龙岩沉缸酒为黄酒。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。黄酒，也称为米酒。绍兴加饭酒古称“山阴甜酒”“越酒”，距今已有 2300多年的酿造历史。龙岩沉缸酒的酿造集我国黄酒酿造的各项传统精湛技术于一身。","type":"判断题"},{"number":13,"stem":"中国人民政治协商会议第一届全体会议确定五星红旗为国旗。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。中国人民政治协商会议第一届全体会议确定北平为中华人民共和国首都，改名为北京；决定采用公元纪年；以《义勇军进行曲》为代国歌；国旗为五星红旗。","type":"判断题"},{"number":14,"stem":"蔡邕主持刻写熹平石经，置于洛阳太学，成为中国历史上第一部官定的儒经经文。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。蔡邕主持刻写熹平石经，置于洛阳太学，成为中国历史上第一部官定的儒经经文。","type":"判断题"},{"number":15,"stem":"东汉张芝擅今草，唐朝张旭和怀素擅狂草，三人均有“草圣”之誉。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。草书名家有东汉张芝，擅今草，唐朝张旭和怀素，擅狂草，三人均有“草圣”之誉。","type":"判断题"},{"number":16,"stem":"李白和杜甫被誉为诗史上的“双子星座”，杜甫被世人称为“诗仙”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“诗仙”错误。李白诗歌雄奇峭丽、豪放飘逸，凝聚着盛唐的时代精神，世人称其为“诗仙”。杜甫有“诗圣”之称。杜甫诗歌深有“诗史”之誉。李白和杜甫被誉为诗史上的“双子星座”，合称“李杜”。","type":"判断题"},{"number":17,"stem":"明代徐光启所著的《农政全书》是中国古代最早的农书。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“最早的农书”错误。中国最早的农书是西汉晚期成书的《汜胜之书》。明时，徐光启著《农政全书》，是中国古代农学著作的集大成者。《汜胜之书》《齐民要术》《农书》《农政全书》被誉为中国古代“四大农书”。","type":"判断题"},{"number":18,"stem":"银发旅游者多在国庆、春节黄金周等旅游旺季集中出行，热衷惊险刺激的探险项目。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为淡季出行。银发旅游者多在旅游的淡季出行，具有慢节奏（偏好深度体验而非走马观花）、高安全性（注重医疗保障和无障碍设施）、强社交性（青睐团体活动和代际同游）、重情怀（热衷文化怀旧等主题）、性价比导向等特点。","type":"判断题"},{"number":19,"stem":"道教的早期流派之一“五斗米道”由张角创立。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“张角”错误。在蜀中鹤鸣山（今四川省大邑县境内），有张陵（又称张道陵、张“天师”）在传播道教，因信徒入教必须交五斗米，故名“五斗米道”。领导东汉黄巾起义的张角传授的为太平道。太平道教和“五斗米道”即为早期的道教。","type":"判断题"},{"number":20,"stem":"华山以雄伟著称，主峰玉皇顶海拔 1532.7 米。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“华山”错误。泰山以雄伟著称。主峰玉皇顶海拔 1532.7米。华山壁立千仞，以险峻著称，自古以来就有“华山天下险”“奇险天下第一山”等说法。","type":"判断题"},{"number":21,"stem":"浙江海岸线总长居全国首位，是全国岛屿最多的省份。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。浙江海域面积 26万平方千米，海岸线总长 6715千米，居全国首位；面积大于 500平方米的海岛有 2878个，是全国岛屿最多的省份。","type":"判断题"},{"number":22,"stem":"1839年，林则徐虎门销烟成了第一次鸦片战争的导火线。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1839年虎门销烟成了第一次鸦片战争的导火线；1856年英国借口“亚罗号”事件袭击广州城，第二次鸦片战争爆发。","type":"判断题"},{"number":23,"stem":"泼水节是白族的传统节日。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，错在“白族”。泼水节是傣族人民送旧迎新的传统节日，又称“浴佛节”；白族的传统节日主要有三月街、绕三灵、耍海节、火把节等。","type":"判断题"},{"number":24,"stem":"武汉别称“江城”，形似一只自西向东的彩蝶，被誉为中国经济地理的“心脏”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。武汉简称“汉”，别称“江城”；武汉文化具有浓郁的楚文化特色，是“高山流水遇知音”故事的发生地，其汉剧有“京剧之母”的美誉。","type":"判断题"},{"number":25,"stem":"民居、祠堂和桥梁被誉为“徽派古建三绝”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“桥梁”应改为“牌坊”。民居、祠堂和牌坊被誉为“徽派古建三绝”，粉墙、黛瓦、马头墙是徽派建筑的重要特征。","type":"判断题"},{"number":26,"stem":"佛山卫浴、陶瓷的全国市场占有率位居第一。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。广东经济发展水平稳居全国首位，2025年 GDP达 14.5847万亿元，连续 37年位居全国第一；佛山卫浴、陶瓷的全国市场占有率位居第一。","type":"判断题"},{"number":27,"stem":"龙门石窟始建于北魏孝文帝时期，被誉为“中国石刻艺术的最高峰”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。龙门石窟是世界文化遗产、中国三大石窟之一，始凿于北魏孝文帝时期，其中奉先寺卢舍那大佛高 17.14米，是唐代石刻艺术的巅峰之作。","type":"判断题"},{"number":28,"stem":"山东寿光是国务院命名的“中国蔬菜之乡”，是中国最大的蔬菜生产基地和批发市场。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。山东寿光是全国冬暖式蔬菜大棚的发源地，也是中国最大的蔬菜生产基地和批发市场。","type":"判断题"},{"number":29,"stem":"西藏是中国人口最多、密度最大的省区。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，错在“最多、密度最大”。西藏是中国人口最少、密度最小的省区；全区面积 120.28万平方公里，约占中国总面积的八分之一，仅次于新疆维吾尔自治区。","type":"判断题"},{"number":30,"stem":"1931年 11月 7日，中华苏维埃共和国在井冈山宣告中国第一个红色中央政权成立。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“井冈山”应改为“瑞金”。1931年 11 月 7 日，中华苏维埃共和国在瑞金宣告中国第一个红色中央政权成立；中华苏维埃共和国临时中央政府设在瑞金，故瑞金有“红都”之称。井冈山：中国革命的摇篮；南昌：人民军队的摇篮；瑞金：共和国的摇篮，有“红都”之称；安源：工人运动的摇篮。","type":"判断题"},{"number":31,"stem":"道教名山武当山的最高峰是神农顶。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，错在“武当山”。最高峰神农顶海拔 3105米的是号称“华中屋脊”的神农架；武当山是道教名山，著名习俗是“朝武当”。","type":"判断题"},{"number":32,"stem":"樟树的四特酒，被周恩来总理赞誉为“清、香、醇、纯”，四特酒由此而得名。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。江西中药产业历史悠久，拥有樟树千年南国药都，在中国四大传统中药炮制流派中，江西“樟帮”“建昌帮”占据其二，在海内外影响深远。","type":"判断题"},{"number":33,"stem":"1927年 10月，建立了中国第一个农村苏维埃政权——海丰、陆丰县苏维埃政府。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1927 年 10 月，建立了中国第一个农村苏维埃政权——海丰、陆丰县苏维埃政府。","type":"判断题"},{"number":34,"stem":"孔庙是世界上规模最大的家族古墓群。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“孔庙”应改为“孔林”。孔庙被誉为“天下第一庙”；孔府号称“天下第一家”；孔林是世界上规模最大的家族古墓群。注意“三孔”各自的誉称不要混淆。","type":"判断题"},{"number":35,"stem":"乐山大佛是世界上现存最高的一尊石刻释迦牟尼坐像。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“释迦牟尼”应改为“弥勒佛”。乐山大佛是世界现存最高的一尊石刻弥勒佛坐像，开凿于唐朝中期开元年间，通高 71 米，“山是一尊佛，佛是一座山”。","type":"判断题"},{"number":36,"stem":"景德镇陶瓷始于唐，拥有 2000多年的冶陶史，被誉为“世界瓷都”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“始于唐”应改为“始于汉”。景德镇陶瓷始于汉，拥有 2000多年的冶陶史、1000多年的官窑史和 600多年的御窑史，被誉为“世界瓷都”。","type":"判断题"},{"number":37,"stem":"殷墟出土的甲骨文是中国最早的文字。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“最早的文字”应改为“最早的成熟文字”。甲骨文是中国最早的成熟文字，迄今出土约 15万片；殷墟距今 3300余年，是中国首个有文献可考、并为甲骨文和考古证实的古代都城遗址，还出土了后母戊鼎等重器。","type":"判断题"},{"number":38,"stem":"云南昆明至老挝万象的中老铁路是中国第一条国际铁路。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“中老铁路”应改为“滇越铁路”。云南昆明至越南河内的滇越铁路是中国第一条国际铁路；2021年 12月 3 日，昆明到万象的中老铁路正式通车。","type":"判断题"},{"number":39,"stem":"天津始于隋朝大运河的开通，史称“三会海口”，是天津的发祥地。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。天津始于隋朝大运河的开通，史称“三会海口”，是天津的发祥地。明永乐二年（1404年）朱棣设立天津卫，天津由此得名。","type":"判断题"},{"number":40,"stem":"截至目前，我国共有 85 家国家级旅游度假区。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。截至 2025年 7月，我国共有 85 家国家级旅游度假区。二、单选题","type":"判断题"},{"number":41,"stem":"紧压茶主要以（ ）为原料，也称边销茶。","options":[{"key":"A","text":"白茶或黄茶"},{"key":"B","text":"乌龙茶或花茶"},{"key":"C","text":"普洱茶或铁观音"},{"key":"D","text":"黑茶或红茶或绿茶"}],"answer":"D","keys":["D"],"explanation":"紧压茶主要以黑茶或红茶或绿茶为原料，也称边销茶。再加工茶类有压制成型的紧压茶和鲜花窨制的花茶。花茶出现于宋代，以精制后的茶叶和鲜花为原料，经过窨花工艺制成。A 项，白茶、黄茶与 B 项乌龙茶均属六大类毛茶，B 项花茶则与紧压茶同属再加工茶类，均非紧压茶原料。C项，普洱茶为黑茶名品、铁观音为乌龙茶名品，该组合并非紧压茶原料。","type":"单选题"},{"number":42,"stem":"我国第一部文学理论专著是南朝刘勰的（ ）。","options":[{"key":"A","text":"《文赋》"},{"key":"B","text":"《诗品》"},{"key":"C","text":"《文心雕龙》"},{"key":"D","text":"《典论·论文》"}],"answer":"C","keys":["C"],"explanation":"刘勰的《文心雕龙》，我国第一部文学理论专著。D 项，《典论·论文》是我国文学史上第一篇文学批评著作。其作者为曹丕。","type":"单选题"},{"number":43,"stem":"中国古代最大的一座帝王陵墓是（ ）。","options":[{"key":"A","text":"汉茂陵"},{"key":"B","text":"秦始皇陵"},{"key":"C","text":"唐乾陵"},{"key":"D","text":"明孝陵"}],"answer":"B","keys":["B"],"explanation":"秦始皇陵是中国历史上第一个皇帝赢政的陵墓，位于陕西省西安市临潼区骊山脚下，是中国古代最大的一座帝王陵墓，也是世界上最大的一座陵墓。被誉为“世界第八大奇迹”。A项，汉茂陵是汉武帝刘彻的陵墓，是西汉帝王陵中规模最大的一座，并非中国古代最大的帝王陵墓。CD 项，唐乾陵、明孝陵的规模均不及秦始皇陵。","type":"单选题"},{"number":44,"stem":"元明清三代汉地佛教的局面是（ ）。","options":[{"key":"A","text":"禅宗一枝独秀"},{"key":"B","text":"佛教全面衰退"},{"key":"C","text":"“家家观世音，户户阿弥陀”"},{"key":"D","text":"八大宗派并立"}],"answer":"C","keys":["C"],"explanation":"元明清三代，汉地精英佛教停滞衰退，而大众佛教取得长足发展，出现“家家观世音，户户阿弥陀”的局面。A项，禅宗是我国支派最多的佛教宗派，也是中国佛教史上流传最久远、对中国文化思想影响最广泛的宗派，但元明清三代并非禅宗一枝独秀。B 项，元明清三代停滞衰退的是汉地精英佛教，大众佛教取得长足发展，“全面衰退”说法片面。D 项，隋唐两代是中国佛教的创造阶段和鼎盛时期，主要宗派并立是隋唐局面，非元明清三代局面。","type":"单选题"},{"number":45,"stem":"中国最早的书法作品是商朝的（ ）。","options":[{"key":"A","text":"石鼓文"},{"key":"B","text":"甲骨文和金文"},{"key":"C","text":"小篆和隶书"},{"key":"D","text":"楷书和行书"}],"answer":"B","keys":["B"],"explanation":"中国最早的书法作品是商朝甲骨文和金文，分别镌刻在甲骨和青铜器上。秦丞相李斯创制小篆，实现了字体统一。","type":"单选题"},{"number":46,"stem":"“建安七子”中成就最高，与曹植并称为“曹王”的是（ ）。","options":[{"key":"A","text":"陈琳"},{"key":"B","text":"刘桢"},{"key":"C","text":"孔融"},{"key":"D","text":"王粲"}],"answer":"D","keys":["D"],"explanation":"建安七子成就最高的是王粲，与曹植并称为“曹王”，主要代表作是《七哀诗》和《登楼赋》。ABC项，陈琳、刘桢、孔融均为建安七子成员，但成就最高、与曹植并称“曹王”的是王粲。","type":"单选题"},{"number":47,"stem":"世界最大的鸟类公园——裕廊鸟类公园位于（ ）。","options":[{"key":"A","text":"泰国曼谷"},{"key":"B","text":"新加坡"},{"key":"C","text":"马来西亚吉隆坡"},{"key":"D","text":"印度尼西亚雅加达"}],"answer":"B","keys":["B"],"explanation":"裕廊鸟类公园是世界最大的鸟类公园。裕廊鸟类公园位于新加坡。","type":"单选题"},{"number":48,"stem":"泰山岱庙的天殿殿同北京故宫太和殿、（ ）并称中国古代三大宫殿式建筑。","options":[{"key":"A","text":"沈阳故宫崇政殿"},{"key":"B","text":"承德避暑山庄澹泊敬诚殿"},{"key":"C","text":"拉萨布达拉宫红宫"},{"key":"D","text":"曲阜孔庙大成殿"}],"answer":"D","keys":["D"],"explanation":"天殿殿同北京故宫太和殿、曲阜孔庙大成殿并称中国古代三大宫殿式建筑。岱庙旧称“东岳庙”，又叫泰庙，主祀“东岳泰山之神”，也是古代帝王来泰山封禅告祭时居住和举行大典的地方，与北京故宫、山东曲阜三孔、河北承德避暑山庄并称我国四大古建筑群。ABC项，沈阳故宫崇政殿、承德避暑山庄澹泊敬诚殿、拉萨布达拉宫红宫均不在“三大宫殿式建筑”之列。","type":"单选题"},{"number":49,"stem":"啤酒按麦芽汁的浓度，可分为（ ）。","options":[{"key":"A","text":"红啤、黑啤两类"},{"key":"B","text":"生啤、熟啤两类"},{"key":"C","text":"有醇、无醇两类"},{"key":"D","text":"低浓度、中浓度、高浓度三类"}],"answer":"D","keys":["D"],"explanation":"按其麦芽汁的浓度，可分为低浓度啤酒（原麦汁浓度 6°-8°，酒精含量 2%左右）、中浓度啤酒（原麦汁浓度 10°- 12°，酒精含量 3.1%- 3.8%）和高浓度啤酒（原麦汁浓度14°- 20°，酒精含量 4.9%- 5.6%）。中国最著名的啤酒是青岛啤酒，系山东青岛啤酒厂出品。","type":"单选题"},{"number":50,"stem":"中国面积最大的内陆盆地是（ ）。","options":[{"key":"A","text":"四川盆地"},{"key":"B","text":"柴达木盆地"},{"key":"C","text":"准噶尔盆地"},{"key":"D","text":"塔里木盆地"}],"answer":"D","keys":["D"],"explanation":"塔里木盆地位于中国新疆南部，是中国面积最大的内陆盆地。盆地北缘的塔里木河是我国最大的内陆河。ABC 项，中国四大盆地分别是塔里木盆地、准噶尔盆地、四川盆地和柴达木盆地，其中面积最大的内陆盆地是塔里木盆地。","type":"单选题"},{"number":51,"stem":"下列湖泊中，属于河成湖的是（ ）。","options":[{"key":"A","text":"月牙泉"},{"key":"B","text":"千岛湖"},{"key":"C","text":"鄱阳湖"},{"key":"D","text":"五大连池"}],"answer":"C","keys":["C"],"explanation":"河成湖是由于河流摆动而形成的湖泊，如鄱阳湖、洞庭湖等。A 项，月牙泉属风成湖：沙漠中低于潜水面的丘间洼地，经其四周沙丘渗流汇集而成，如敦煌的月牙泉。B 项，千岛湖属人工湖：由人工修筑的蓄水区域，如千岛湖。D项，五大连池属火山堰塞湖。","type":"单选题"},{"number":52,"stem":"除夕北方地区有吃饺子的习俗，寓（ ）之意。","options":[{"key":"A","text":"“步步高”"},{"key":"B","text":"“团团圆圆”"},{"key":"C","text":"“更岁交子”"},{"key":"D","text":"“年年有余”"}],"answer":"C","keys":["C"],"explanation":"北方地区有吃饺子的习俗，寓“更岁交子”之意，南方多吃年糕，象征生活步步高。","type":"单选题"},{"number":53,"stem":"恒山悬空寺始建于（ ），距地面高约 50米。","options":[{"key":"A","text":"东汉"},{"key":"B","text":"北魏"},{"key":"C","text":"唐代"},{"key":"D","text":"宋代"}],"answer":"B","keys":["B"],"explanation":"悬空寺为恒山人文景观之最，始建于北魏，距地面高约 50米，其建筑特色可以概括为“查、悬、巧”三个字。徐霞客称悬空寺为“天下巨观”，三教殿内，释迦牟尼、老子、孔子共居一室，在我国寺庙建筑中别具一格。ACD项，东汉、唐代、宋代均与悬空寺始建年代不符。","type":"单选题"},{"number":54,"stem":"下列高原中，被称为“世界屋脊”的是（ ）。","options":[{"key":"A","text":"黄土高原"},{"key":"B","text":"青藏高原"},{"key":"C","text":"云贵高原"},{"key":"D","text":"内蒙古高原"}],"answer":"B","keys":["B"],"explanation":"青藏高原是中国最大、世界海拔最高的高原，被称为“世界屋脊”“地球第三极”。","type":"单选题"},{"number":55,"stem":"成为埃及的象征、世界八大奇迹之一的是（ ）。","options":[{"key":"A","text":"亚历山大灯塔"},{"key":"B","text":"巴比伦空中花园"},{"key":"C","text":"罗德岛太阳神巨像"},{"key":"D","text":"胡夫金字塔和狮身人面像"}],"answer":"D","keys":["D"],"explanation":"金字塔在埃及共发现 96座，最大的是开罗郊区吉萨的三座金字塔，是胡夫、哈夫拉和孟考拉祖孙三代的陵墓，其中最有名的是胡夫金字塔和狮身人面像，成为世界八大奇迹之一，也是埃及的象征。卢克索是世界上最大的露天博物馆，有“宫殿之城”的美誉。","type":"单选题"},{"number":56,"stem":"伊斯兰教内部的神秘主义派别是（ ）。","options":[{"key":"A","text":"逊尼派"},{"key":"B","text":"什叶派"},{"key":"C","text":"哈瓦利吉派"},{"key":"D","text":"苏菲派"}],"answer":"D","keys":["D"],"explanation":"苏菲派是伊斯兰教内部的神秘主义派别。A 项，逊尼派是伊斯兰教中人数最多的一派，中国穆斯林大多属于逊尼派。B项，什叶派是伊斯兰教中人数较少的一派，中国新疆塔吉克族穆斯林属于什叶派。","type":"单选题"},{"number":57,"stem":"每年举办“国际风筝节”、被称为“风筝的故乡”的城市是（ ）。","options":[{"key":"A","text":"潍坊"},{"key":"B","text":"阳江"},{"key":"C","text":"北京"},{"key":"D","text":"天津"}],"answer":"A","keys":["A"],"explanation":"1984 年起，潍坊每年都举办“国际风筝节”。现在潍坊成为世界风筝文化交流的中心，被世界各国人民称为“风筝的故乡”。B 项，阳江于 1993 年被国家体委授予“全国风筝之乡”，与“风筝的故乡”所指不同。","type":"单选题"},{"number":58,"stem":"若按桥梁的结构及外观形式分，古桥的基本类型不包括（ ）。","options":[{"key":"A","text":"立交桥"},{"key":"B","text":"梁桥"},{"key":"C","text":"浮桥"},{"key":"D","text":"索桥"}],"answer":"A","keys":["A"],"explanation":"若以桥梁的结构及外观形式分，主要有梁桥、浮桥、索桥、拱桥 4种基本类型。拱桥是古桥中最富有生命力的一种桥型。A 项立交桥是现代道路交叉工程，不在其列。","type":"单选题"},{"number":59,"stem":"西安事变发生于（ ）。","options":[{"key":"A","text":"1936年 12 月 12日"},{"key":"B","text":"1937年 12 月 12日"},{"key":"C","text":"1936年 10 月 10日"},{"key":"D","text":"1935年 12 月 12日"}],"answer":"A","keys":["A"],"explanation":"1936 年 12月 12 日，张学良、杨虎城在西安扣留蒋介石，并向全国通电，提出停止内战、一致对外等八项主张。","type":"单选题"},{"number":60,"stem":"蛋壳黑陶高柄杯“黑如漆、亮如镜、薄如纸、硬如瓷”，被考古界誉为（ ）。","options":[{"key":"A","text":"“黑陶之王”"},{"key":"B","text":"“四千年前地球文明最精致之制作”"},{"key":"C","text":"“史前陶文化之母”"},{"key":"D","text":"“东方陶魂”"}],"answer":"B","keys":["B"],"explanation":"蛋壳黑陶高柄杯，其“黑如漆、亮如镜、薄如纸、硬如瓷”，堪称史前陶文化高超技艺的典型代表，被考古界誉为“四千年前地球文明最精致之制作”。龙山文化蛋壳黑陶是山东龙山文化特有的标志性陶器，也是我国古代制陶艺术的巅峰之作。","type":"单选题"},{"number":61,"stem":"泰国的首都是（ ）。","options":[{"key":"A","text":"芭堤雅"},{"key":"B","text":"清迈"},{"key":"C","text":"普吉"},{"key":"D","text":"曼谷"}],"answer":"D","keys":["D"],"explanation":"泰国首都是曼谷。曼谷被誉为“佛教之都”，是“世界佛教联谊会”总部所在地。也是世界上佛寺最多的地方。A项，芭堤雅已成为“海滩度假天堂”的代名词，素以阳光、沙滩、海鲜名扬世界；B 项，清迈有“北方玫瑰”之称；C 项，普吉是泰国著名海岛。","type":"单选题"},{"number":62,"stem":"扬州个园的命名与（ ）有关。","options":[{"key":"A","text":"竹"},{"key":"B","text":"兰"},{"key":"C","text":"菊"},{"key":"D","text":"梅"}],"answer":"A","keys":["A"],"explanation":"扬州个园园主特别爱竹，园内翠竹成林，故取清袁枚“月映竹成千个字”之句命名。个园小巧玲珑，以假山堆叠精巧著名，采取分峰叠石的手法，运用笋石、湖石、黄石、宣石表现春、夏、秋、冬四季景色，号称“四季假山”。","type":"单选题"},{"number":63,"stem":"苏州玉雕以“小、巧、灵、精”出彩，其工匠善雕琢（ ）。","options":[{"key":"A","text":"大型山子"},{"key":"B","text":"中小件"},{"key":"C","text":"巨型摆件"},{"key":"D","text":"建筑构件"}],"answer":"B","keys":["B"],"explanation":"苏州工匠善雕琢中小件，以“小、巧、灵、精”出彩。苏州玉雕历宋、元、明、清数代，均作为贡品进献皇室。ACD项，大型山子、巨型摆件、建筑构件均非苏州玉雕所长；扬州玉雕尤以“山子雕”及“链子活”技艺独具一格。","type":"单选题"},{"number":64,"stem":"佛光是当阳光照在云雾表面，经过（ ）作用形成的一种特殊自然景观。","options":[{"key":"A","text":"折射和全反射"},{"key":"B","text":"直射和散射"},{"key":"C","text":"吸收和透射"},{"key":"D","text":"衍射和漫反射"}],"answer":"D","keys":["D"],"explanation":"佛光是当阳光照在云雾表面，经过衍射和漫反射作用形成的一种特殊自然景观。峨眉山佛光出现次数最多，因峨眉山有海拔高、多云雾，且湿度大、风速小等有利条件，故佛光有“峨眉宝光”“金顶祥光”之誉。A 项，愿景也称海市或海市蜃楼。愿景成因是气温在垂直方向剧烈变化，使空气密度在垂向上出现显著差异，从而产生光线折射和全反射现象，折射和全反射是愿景的成因，而非佛光的成因。BC 项，直射和散射、吸收和透射均与佛光成因不符。","type":"单选题"},{"number":65,"stem":"采纳董仲舒建议，实行“罢黜百家，独尊儒术”的是（ ）。","options":[{"key":"A","text":"汉武帝"},{"key":"B","text":"汉景帝"},{"key":"C","text":"汉高祖"},{"key":"D","text":"汉文帝"}],"answer":"A","keys":["A"],"explanation":"汉武帝时实行“罢黜百家，独尊儒术”。经他改革后的儒学顺应了汉武帝希望加强中央集权的愿望，汉武帝“罢黜百家，独尊儒术”，儒学从此成为中国正统思想。汉武帝派张骞出使西域，开通了陆上丝绸之路。","type":"单选题"},{"number":66,"stem":"贴春联、挂年画起源于古代的（ ）。","options":[{"key":"A","text":"剪纸"},{"key":"B","text":"灯笼"},{"key":"C","text":"桃符"},{"key":"D","text":"门神画"}],"answer":"C","keys":["C"],"explanation":"贴春联、挂年画起源于古代的挑符。","type":"单选题"},{"number":67,"stem":"中国现存规模最大、保存最完整的古代城垣是（ ）城墙。","options":[{"key":"A","text":"丽江古城"},{"key":"B","text":"南京古城"},{"key":"C","text":"西安古城"},{"key":"D","text":"平遥古城"}],"answer":"C","keys":["C"],"explanation":"西安古城城墙是中国现存规模最大、保存最完整的古代城垣。现存的著名古代城池有江苏南京古城、陕西西安古城、山西平遥古城和云南丽江古城等。B项，南京古城聚宝门规模最大，是我国现存最大、最为完整的堡垒瓮城，在城垣建筑史上占有重要地位，但现存规模最大、保存最完整的古代城垣是西安古城城墙。AD 项，丽江古城、平遥古城均为现存著名古代城池，但规模与保存完整度不及西安古城城墙。","type":"单选题"},{"number":68,"stem":"结束近 300年南北分裂局面、定都大兴（今西安）的朝代是（ ）。","options":[{"key":"A","text":"北宋"},{"key":"B","text":"西晋"},{"key":"C","text":"隋朝"},{"key":"D","text":"唐朝"}],"answer":"C","keys":["C"],"explanation":"杨坚建立的隋朝，定都大兴（今西安），结束了魏晋南北朝以来 300多年南北方长期分裂的局面。创立了三省六部制度和科举制度，修建了以洛阳为中心的大运河，沟通了南北交通，对后代政治制度和经济发展影响巨大。ABD项，北宋、西晋、唐朝均不符合“结束近300年南北分裂局面、定都大兴”的题干表述。","type":"单选题"},{"number":69,"stem":"有“匡庐奇秀甲天下”之誉的是（ ）。","options":[{"key":"A","text":"黄山"},{"key":"B","text":"庐山"},{"key":"C","text":"雁荡山"},{"key":"D","text":"三清山"}],"answer":"B","keys":["B"],"explanation":"庐山风景秀丽，文化内涵深厚，素有“匡庐奇秀甲天下”之誉。","type":"单选题"},{"number":70,"stem":"“两弹一星”中的“两弹”是指（ ）。","options":[{"key":"A","text":"核弹、导弹"},{"key":"B","text":"导弹、氢弹"},{"key":"C","text":"原子弹、人造卫星"},{"key":"D","text":"原子弹、氢弹"}],"answer":"A","keys":["A"],"explanation":"“两弹一星”指核弹、导弹、人造卫星。1964 年 10 月 16日成功爆炸我国第一颗原子弹；1966 年 10 月 27 日，我国自行研制的东风二号核导弹试爆成功，标志着“两弹”成功结合，中国有了可用于实战的核导弹。1967年 6 月 17 日，我国第一颗氢弹空爆试验成功；1970年 4 月 24 日，我国用长征一号运载火箭成功发射第一颗人造卫星“东方红一号”。BD项，原子弹、氢弹均属核弹范畴；C 项，人造卫星是“两弹一星”中的“一星”。","type":"单选题"},{"number":71,"stem":"有“沙峰、鸣沙、湖泊、奇泉、古庙”“五奇”之称的是（ ）。","options":[{"key":"A","text":"古尔班通古特沙漠"},{"key":"B","text":"巴丹吉林沙漠"},{"key":"C","text":"腾格里沙漠"},{"key":"D","text":"塔克拉玛干沙漠"}],"answer":"B","keys":["B"],"explanation":"巴丹吉林沙漠是中国第三大沙漠，沙峰、鸣沙、湖泊、奇泉、古庙被称为“沙漠五奇”。巴丹吉林沙漠中已探明的湖泊有 144个，俗称“沙漠干涸”。ACD 项，我国的四大沙漠分别是指塔克拉玛干沙漠、古尔班通古特沙漠、巴丹吉林沙漠、腾格里沙漠，“沙漠五奇”所指为巴丹吉林沙漠。","type":"单选题"},{"number":72,"stem":"汉族的语言简称汉语，属（ ）。","options":[{"key":"A","text":"印欧语系"},{"key":"B","text":"汉藏语系"},{"key":"C","text":"阿尔泰语系"},{"key":"D","text":"南亚语系"}],"answer":"B","keys":["B"],"explanation":"汉族的语言简称汉语，属汉藏语系，是世界上历时最悠久、最丰富的语言之一。汉字是记录汉语的符号，属表意文字。ACD项，印欧语系、阿尔泰语系、南亚语系均非汉语所属语系。","type":"单选题"},{"number":73,"stem":"重阳“九九”与“久久”谐音，有祝愿（ ）的含义。","options":[{"key":"A","text":"金榜题名"},{"key":"B","text":"早生贵子"},{"key":"C","text":"长久长寿"},{"key":"D","text":"五谷丰登"}],"answer":"C","keys":["C"],"explanation":"九九重阳，又与“久久”谐音，有祝愿长久长寿的含义，1989年，我国把每年的重阳节定为老人节，成为尊老、爱老、敬老、助老的节日，赋予了传统节日时代的新意。ABD项，金榜题名、早生贵子、五谷丰登均非“九九”与“久久”谐音的寓意。","type":"单选题"},{"number":74,"stem":"唐代曾经记载用硫黄、硝石和木炭制造火药的是（ ）。","options":[{"key":"A","text":"葛洪"},{"key":"B","text":"孙思邈"},{"key":"C","text":"沈括"},{"key":"D","text":"宋应星"}],"answer":"B","keys":["B"],"explanation":"唐代孙思邈曾经记载用硫黄、硝石和木炭制造火药，唐末火药就开始用于军事，宋代甚至出现“霹雳炮”“震天炮”等火器。A 项，葛洪是东晋道士；C 项，北宋科学家沈括还发现了磁偏角现象；D 项，明朝宋应星著《天工开物》，外国学者称它为“中国 17 世纪的工艺百科全书”。三者均非唐代记载制造火药之人。","type":"单选题"},{"number":75,"stem":"世界上最大的丹顶鹤繁殖地是（ ）。","options":[{"key":"A","text":"四川卧龙自然保护区"},{"key":"B","text":"黑龙江扎龙自然保护区"},{"key":"C","text":"青海湖鸟岛"},{"key":"D","text":"西双版纳野象谷"}],"answer":"B","keys":["B"],"explanation":"黑龙江扎龙主要保护对象为丹顶鹤等珍禽及湿地生态系统。湿地总面积为 21 万公顷，位居亚洲第二、世界第四，也是世界最大的芦苇湿地，1992年被列入“国际重要湿地名录”。为众多水鸟尤其是丹顶鹤提供了栖息繁殖的优良环境，是世界上最大的丹顶鹤繁殖地。A 项，卧龙自然保护区以“熊猫之乡”“宝贵的生物基因库”“天然动植物园”享誉中外，以保护大熊猫等珍稀动物为主；C项，青海湖鸟岛是我国重要的鸟类自然保护区。","type":"单选题"},{"number":76,"stem":"北京香山红叶种植最多的树种是（ ）。","options":[{"key":"A","text":"黄栌树"},{"key":"B","text":"火炬树"},{"key":"C","text":"乌桕"},{"key":"D","text":"红枫"}],"answer":"A","keys":["A"],"explanation":"北京香山红叶种植面积最大的黄栌树近 10万株。每年的 10 月中旬到 11月上旬是观赏红叶的最好季节。BCD项，火炬树、乌桕、红枫均非香山红叶种植面积最大的树种。","type":"单选题"},{"number":77,"stem":"有“中华之魂”盛誉、长城入海的端头部分是（ ）。","options":[{"key":"A","text":"老龙头长城"},{"key":"B","text":"嘉峪关"},{"key":"C","text":"居庸关"},{"key":"D","text":"八达岭长城"}],"answer":"A","keys":["A"],"explanation":"老龙头长城是长城入海的端头部分，有“中华之魂”的盛誉。BC项，嘉峪关、居庸关均为长城著名关隘；D 项，八达岭长城位于北京西北，是明长城中保存最完好、最具代表性的一段。长城入海的端头部分是老龙头。","type":"单选题"},{"number":78,"stem":"研学旅行的主体是（ ）。","options":[{"key":"A","text":"家长"},{"key":"B","text":"旅行社"},{"key":"C","text":"学生"},{"key":"D","text":"教师"}],"answer":"C","keys":["C"],"explanation":"学生是研学旅游的主体。研学旅行是学校教育的一部分。研学旅行最核心的属性是教育性。ABD项，家长、旅行社、教师均非研学旅行的主体。","type":"单选题"},{"number":79,"stem":"佛教开始传入中国的标志史称（ ）。","options":[{"key":"A","text":"“伊存授经”"},{"key":"B","text":"“白马驮经”"},{"key":"C","text":"“法显西行”"},{"key":"D","text":"“永平求法”"}],"answer":"A","keys":["A"],"explanation":"西汉哀帝元寿元年（公元前 2 年），大月氏王使臣伊存向中国博士弟子景卢口授《浮屠经》，佛教开始传入中国。史称这一佛教初传历史标志为“伊存授经”。","type":"单选题"},{"number":80,"stem":"我国“天宫”空间站是通过（ ）系列飞船逐步建成的。","options":[{"key":"A","text":"嫦娥"},{"key":"B","text":"神舟"},{"key":"C","text":"天问"},{"key":"D","text":"墨子"}],"answer":"B","keys":["B"],"explanation":"我国载人航天工程通过“神舟”系列飞船建起了天宫空间站，实现了从无人飞行到载人飞行，从一人一天到多人多天，从空间出舱到交会对接，从单船飞行到组合体稳定运行的跨越。A 项，“嫦娥工程”是我国探月工程；C 项，“天问一号”是火星探测器；D 项，“墨子号”是量子科学实验卫星。三者均与建设“天宫”空间站无关。","type":"单选题"},{"number":81,"stem":"被誉为山水画“南京鼻祖”，被后世奉为文人画始祖的是（ ）。","options":[{"key":"A","text":"倪瓒"},{"key":"B","text":"王维"},{"key":"C","text":"展子虔"},{"key":"D","text":"黄公望"}],"answer":"B","keys":["B"],"explanation":"王维，擅长山水画，被誉为山水画“南京鼻祖”，又因其画作中往往透出文人士大夫超然、闲适的情怀，“遗中有画，画中有诗”，被后世奉为文人画的始祖，惜无真迹留传下来。C项，隋朝展子虔被认为是“唐画之祖”；AD项，倪瓒、黄公望均为元代“元四家”成员。三者均非“南京鼻祖”、文人画始祖。","type":"单选题"},{"number":82,"stem":"江南三大奇石之冠是（ ）。","options":[{"key":"A","text":"杭州竹素园给云峰"},{"key":"B","text":"苏州环秀山庄假山"},{"key":"C","text":"上海豫园玉玲珑"},{"key":"D","text":"苏州留园冠云峰"}],"answer":"C","keys":["C"],"explanation":"太湖石“玉玲珑”为“江南三大奇石”之冠。“江南三大奇石”：上海豫园玉玲珑、苏州留园冠云峰、杭州竹素园给云峰。","type":"单选题"},{"number":83,"stem":"中国现存最大的盔顶建筑是（ ）。","options":[{"key":"A","text":"岳阳楼"},{"key":"B","text":"黄鹤楼"},{"key":"C","text":"滕王阁"},{"key":"D","text":"蓬莱阁"}],"answer":"A","keys":["A"],"explanation":"岳阳楼屋顶为四坡盔顶，屋面上凸下凹，为中国现存最大盔顶建筑。岳阳楼自古有“洞庭天下水，岳阳天下楼”之誉，北宋范仲淹脍炙人口的《岳阳楼记》更使岳阳楼著称于世。BCD项，黄鹤楼、滕王阁、蓬莱阁均非中国现存最大盔顶建筑。","type":"单选题"},{"number":84,"stem":"1958年通车、后来被改造成中国第一条电气化铁路的是（ ）。","options":[{"key":"A","text":"鹰厦铁路"},{"key":"B","text":"成渝铁路"},{"key":"C","text":"宝成铁路"},{"key":"D","text":"成昆铁路"}],"answer":"C","keys":["C"],"explanation":"1958 年宝鸡到成都铁路通车，“蜀道难”被突破。这条铁路后来被改造成中国第一条电气化铁路。B 项，新中国成立后建成的第一条铁路是成渝铁路，全长 505公里，连通成都和重庆，1950年开始建设，1952年 7月 1日建成通车，但并非第一条电气化铁路。AD 项，鹰厦铁路、成昆铁路均不符合题干表述；1970年 7月 1日，全长 1096公里的成昆铁路竣工运营。","type":"单选题"},{"number":85,"stem":"“海内存知己，天涯若比邻”的作者是（ ）。","options":[{"key":"A","text":"王勃"},{"key":"B","text":"杨炯"},{"key":"C","text":"卢照邻"},{"key":"D","text":"骆宾王"}],"answer":"A","keys":["A"],"explanation":"王勃的代表作有《滕王阁序》和《送杜少府之任蜀州》，留下“落霞与孤鹜齐飞，秋水共长天一色”“海内存知己，天涯若比邻”等名句。BCD 项，杨炯、卢照邻、骆宾王与王勃并称“初唐四杰”，但“海内存知己，天涯若比邻”出自王勃《送杜少府之任蜀州》。","type":"单选题"},{"number":86,"stem":"清代广东“四大园林”中保存原貌最好的是（ ）。","options":[{"key":"A","text":"番禺余荫山房"},{"key":"B","text":"佛山梁园"},{"key":"C","text":"顺德清晖园"},{"key":"D","text":"东莞可园"}],"answer":"A","keys":["A"],"explanation":"余荫山房是广东“四大园林”中保存原貌最好的古典园林。清代广东“四大园林”也被称为岭南“四大园林”，分别是顺德清晖园、东莞可园、番禺余荫山房、佛山梁园。BCD项，佛山梁园、顺德清晖园、东莞可园均为广东“四大园林”之一，但保存原貌最好的是番禺余荫山房。","type":"单选题"},{"number":87,"stem":"澳门沙仔区新濠天地酒店内最具代表性的舞台剧是（ ）。","options":[{"key":"A","text":"《印象·刘三姐》"},{"key":"B","text":"《宋城千古情》"},{"key":"C","text":"《水舞间》"},{"key":"D","text":"《大宋·东京梦华》"}],"answer":"C","keys":["C"],"explanation":"沙仔区的澳门新濠天地酒店内有一个最具代表性的舞台剧——《水舞间》。","type":"单选题"},{"number":88,"stem":"藏族人民一年中最重要、最隆重的节日是（ ）。","options":[{"key":"A","text":"藏历年"},{"key":"B","text":"雪顿节"},{"key":"C","text":"望果节"},{"key":"D","text":"沐浴节"}],"answer":"A","keys":["A"],"explanation":"藏历年相当于汉族的春节，是藏族人民一年中最重要、最隆重的节日；雪顿节意为“酸奶盛筵”，望果节是庆丰收的节日。","type":"单选题"},{"number":89,"stem":"四川省第一条高速公路是 1995年建成的（ ）。","options":[{"key":"A","text":"成雅高速公路"},{"key":"B","text":"成渝高速公路"},{"key":"C","text":"成绵高速公路"},{"key":"D","text":"成乐高速公路"}],"answer":"B","keys":["B"],"explanation":"四川省第一条高速公路是 1995年建成的成渝高速公路，里程 337.5 公里；雅西高速则被称为“云端上的高速公路”。","type":"单选题"},{"number":90,"stem":"世界现存最高的一尊石刻弥勒佛坐像——乐山大佛，通高（ ）。","options":[{"key":"A","text":"48米"},{"key":"B","text":"61米"},{"key":"C","text":"71米"},{"key":"D","text":"88米"}],"answer":"C","keys":["C"],"explanation":"乐山大佛通高 71米，位于岷江、青衣江和大渡河三江汇流的凌云山上。","type":"单选题"},{"number":91,"stem":"香港香火最旺、也是香港唯一可以举行道教婚礼的宫观是（ ）。","options":[{"key":"A","text":"黄大仙祠"},{"key":"B","text":"文武庙"},{"key":"C","text":"天后庙"},{"key":"D","text":"车公庙"}],"answer":"A","keys":["A"],"explanation":"黄大仙祠又名番色园，是一座宏伟的中国式道教寺庙，是香港香火最旺的地方。","type":"单选题"},{"number":92,"stem":"欣赏阿里山日出的最佳地点是（ ）。","options":[{"key":"A","text":"日月潭"},{"key":"B","text":"玉山"},{"key":"C","text":"祝山"},{"key":"D","text":"阳明山"}],"answer":"C","keys":["C"],"explanation":"著名的阿里山日出四季出现位置与时间皆不同，祝山是欣赏日出的最佳地点。","type":"单选题"},{"number":93,"stem":"壮族地区最负盛名的特产是（ ）。","options":[{"key":"A","text":"桂圆、荔枝、菠萝"},{"key":"B","text":"罗汉果、田七、肉桂"},{"key":"C","text":"珍珠、玛瑙、翡翠"},{"key":"D","text":"南珠、三七、蛤"}],"answer":"D","keys":["D"],"explanation":"南珠、三七、蛤是壮族地区最负盛名的特产；博白县是广西桂圆肉的主要产区，素有“桂圆肉之乡”的称誉。","type":"单选题"},{"number":94,"stem":"郑和第一次下西洋的首航日 7月 11日被定为（ ）。","options":[{"key":"A","text":"中国海洋日"},{"key":"B","text":"中国航海日"},{"key":"C","text":"世界海事日"},{"key":"D","text":"郑和文化节"}],"answer":"B","keys":["B"],"explanation":"郑和是云南昆阳州（今昆明市晋宁区）人，七下西洋完成了人类历史上伟大的壮举，其第一次下西洋的首航日 7 月 11 日被定为中国航海日。","type":"单选题"},{"number":95,"stem":"我国海拔最高的民用机场是（ ）。","options":[{"key":"A","text":"拉萨贡嘎国际机场"},{"key":"B","text":"昌都邦达机场"},{"key":"C","text":"稻城亚丁机场"},{"key":"D","text":"九寨黄龙机场"}],"answer":"C","keys":["C"],"explanation":"稻城亚丁机场海拔 4411米，是我国海拔最高的民用机场。西藏机场均为高高原机场，注意区分。","type":"单选题"},{"number":96,"stem":"台湾本岛南北最长达 394千米，东西最宽为（ ），呈纺锤形。","options":[{"key":"A","text":"180千米"},{"key":"B","text":"220千米"},{"key":"C","text":"394千米"},{"key":"D","text":"144千米"}],"answer":"D","keys":["D"],"explanation":"台湾本岛南北最长达 394千米，东西最宽为 144千米，呈纺锤形；台湾地区陆地总面积 3.6万平方千米。","type":"单选题"},{"number":97,"stem":"我国面积最大的湿地类型国家级自然保护区是（ ）。","options":[{"key":"A","text":"青海省三江源国家级自然保护区"},{"key":"B","text":"四川若尔盖湿地保护区"},{"key":"C","text":"黑龙江扎龙自然保护区"},{"key":"D","text":"内蒙古额尔古纳湿地保护区"}],"answer":"A","keys":["A"],"explanation":"青海省三江源国家级自然保护区是我国面积最大的湿地类型国家级自然保护区。","type":"单选题"},{"number":98,"stem":"甘肃地形呈狭长状，最窄处仅（ ）。","options":[{"key":"A","text":"15公里"},{"key":"B","text":"25公里"},{"key":"C","text":"50公里"},{"key":"D","text":"80公里"}],"answer":"B","keys":["B"],"explanation":"甘肃地形呈狭长状，东西长 1655公里，南北宽 530公里，最窄处仅 25 公里。","type":"单选题"},{"number":99,"stem":"中国最长的内陆河是（ ）。","options":[{"key":"A","text":"额尔齐斯河"},{"key":"B","text":"伊犁河"},{"key":"C","text":"黑河"},{"key":"D","text":"塔里木河"}],"answer":"D","keys":["D"],"explanation":"中国最长的内陆河——塔里木河，长 2100 公里；中国最大的沙漠——塔克拉玛干沙漠（33.76万平方公里）；中国最大的内陆淡水湖——博斯腾湖。","type":"单选题"},{"number":100,"stem":"全国最大的内河港是（ ）。","options":[{"key":"A","text":"重庆果园港"},{"key":"B","text":"武汉阳逻港"},{"key":"C","text":"南京港"},{"key":"D","text":"苏州港"}],"answer":"A","keys":["A"],"explanation":"全国最大的内河港果园港建成投用，2025年全市港口货运量达到 2.4亿吨，位居西部第一。","type":"单选题"},{"number":101,"stem":"下列瀑布中，被称为“中国第一瀑”的是（ ）。","options":[{"key":"A","text":"壶口瀑布"},{"key":"B","text":"黄果树瀑布"},{"key":"C","text":"德天瀑布"},{"key":"D","text":"蛟龙瀑布"}],"answer":"B","keys":["B"],"explanation":"黄果树瀑布誉满天下，被称为“中国第一瀑”。","type":"单选题"},{"number":102,"stem":"成都除“蓉城”之外，还有（ ）等别称。","options":[{"key":"A","text":"“山城”“雾都”"},{"key":"B","text":"“羊城”“花城”"},{"key":"C","text":"“龟城”“锦官城”"},{"key":"D","text":"“泉城”“面塑之都”"}],"answer":"C","keys":["C"],"explanation":"成都还有“龟城”“锦官城”“蓉城”等别称，被誉为“雪山下的公园城市”“一座来了就不想走的城市”。","type":"单选题"},{"number":103,"stem":"为昆明滇池大观楼题写“天下第一长联”、被后人尊称为“联圣”的是（ ）。","options":[{"key":"A","text":"杨慎"},{"key":"B","text":"袁枚"},{"key":"C","text":"赵藩"},{"key":"D","text":"孙髯翁"}],"answer":"D","keys":["D"],"explanation":"孙髯翁为昆明滇池大观楼题天下第一长联，被后人尊称为联圣。","type":"单选题"},{"number":104,"stem":"我国台湾省最大的港口是（ ）。","options":[{"key":"A","text":"高雄港"},{"key":"B","text":"基隆港"},{"key":"C","text":"台中港"},{"key":"D","text":"花莲港"}],"answer":"A","keys":["A"],"explanation":"高雄港是台湾省最大的港口、世界第十五大港口；台北桃园国际机场是台湾省最大、最繁忙的机场。","type":"单选题"},{"number":105,"stem":"苗族民间最大的祭祀活动是（ ）。","options":[{"key":"A","text":"姊妹节"},{"key":"B","text":"祭鼓节"},{"key":"C","text":"芦笙节"},{"key":"D","text":"跳花节"}],"answer":"B","keys":["B"],"explanation":"祭鼓节是苗族民间最大的祭祀活动。苗族主要信仰本民族长期形成的原始宗教，包括自然崇拜、图腾崇拜、祖先崇拜、鬼神崇拜。D 项跳花节是苗族传统节日，易误选。","type":"单选题"},{"number":106,"stem":"香港岛的最高点是（ ），登临的最佳时间为黄昏。","options":[{"key":"A","text":"大帽山"},{"key":"B","text":"狮子山"},{"key":"C","text":"太平山"},{"key":"D","text":"嘉顿山"}],"answer":"C","keys":["C"],"explanation":"太平山也称扯旗山，海拔 552米，是香港岛的最高点。登太平山的最佳时间是黄昏，既能观赏白天的城市景观，又可静待夜幕低垂时整个城市瞬间变幻的一刻。","type":"单选题"},{"number":107,"stem":"“三亚”因（ ）得名，是中国最南部的热带滨海旅游城市。","options":[{"key":"A","text":"三亚湾"},{"key":"B","text":"三亚山"},{"key":"C","text":"三亚岭"},{"key":"D","text":"三亚河"}],"answer":"D","keys":["D"],"explanation":"“三亚”因三亚河（古名临川水）得名；三亚又称“鹿城”，享有“东方夏威夷”的美誉，是全国较长寿地区（平均寿命超过 80岁）。","type":"单选题"},{"number":108,"stem":"澳门三大古刹中最古老者是（ ）。","options":[{"key":"A","text":"妈阁庙"},{"key":"B","text":"普济禅院"},{"key":"C","text":"莲峰庙"},{"key":"D","text":"妈阁庙和普济禅院并列"}],"answer":"A","keys":["A"],"explanation":"妈阁庙现为澳门三大古刹中最古老者。","type":"单选题"},{"number":109,"stem":"黎族最盛大的民间传统节日、也是青年男女自由交往的日子是（ ）。","options":[{"key":"A","text":"“六月六”"},{"key":"B","text":"“三月三”"},{"key":"C","text":"“盘王节”"},{"key":"D","text":"“火把节”"}],"answer":"B","keys":["B"],"explanation":"黎族大多数节日与汉族相同，“三月三”是最盛大的民间传统节日，也是青年男女自由交往的日子。C 项盘王节是瑶族传统节日，D 项火把节是彝族传统节日，均易误选。","type":"单选题"},{"number":110,"stem":"陕北民歌最常见的形式是（ ）。","options":[{"key":"A","text":"花儿"},{"key":"B","text":"山曲"},{"key":"C","text":"信天游"},{"key":"D","text":"爬山调"}],"answer":"C","keys":["C"],"explanation":"陕北民歌以信天游最常见，其曲调悠长高亢、韵律和美，名曲《兰花花》《山丹丹开花红艳艳》几乎家喻户晓。","type":"单选题"},{"number":111,"stem":"青海湖是我国最大的（ ）。","options":[{"key":"A","text":"淡水湖"},{"key":"B","text":"人工湖"},{"key":"C","text":"火山口湖"},{"key":"D","text":"内陆咸水湖"}],"answer":"D","keys":["D"],"explanation":"青海湖是我国最大的内陆咸水湖，柴达木盆地以“聚宝盆”著称于世。","type":"单选题"},{"number":112,"stem":"彝族人民最盛大的节日——火把节的时间是（ ）。","options":[{"key":"A","text":"农历六月二十四"},{"key":"B","text":"农历正月十五"},{"key":"C","text":"农历五月十五"},{"key":"D","text":"农历八月十五"}],"answer":"A","keys":["A"],"explanation":"农历六月二十四是彝族人民最盛大的节日——火把节。彝族有自己的语言、文字和历法，崇拜自然和神灵，祭司称为“毕摩”。","type":"单选题"},{"number":113,"stem":"陕西境内的最高点是（ ）。","options":[{"key":"A","text":"五台山"},{"key":"B","text":"小五台山"},{"key":"C","text":"太白山拔仙台"},{"key":"D","text":"神农架神农顶"}],"answer":"C","keys":["C"],"explanation":"陕西境内最高点为太白山拔仙台，海拔 3771.2 米。","type":"单选题"},{"number":114,"stem":"我国台湾省最大、最繁忙的机场是（ ）。","options":[{"key":"A","text":"台北松山机场"},{"key":"B","text":"台北桃园国际机场"},{"key":"C","text":"高雄小港机场"},{"key":"D","text":"台中清泉岗机场"}],"answer":"B","keys":["B"],"explanation":"台北桃园国际机场是台湾省最大、最繁忙的机场；高雄港是台湾省最大的港口、世界第十五大港口。","type":"单选题"},{"number":115,"stem":"藏族最普遍的礼节是（ ）。","options":[{"key":"A","text":"敬酥油茶"},{"key":"B","text":"鞠躬"},{"key":"C","text":"合十礼"},{"key":"D","text":"献哈达"}],"answer":"D","keys":["D"],"explanation":"献哈达是藏族最普遍的礼节，婚丧、节庆、乔迁、拜会尊长、朝拜佛像、送别远行等都有献哈达的习惯。","type":"单选题"},{"number":116,"stem":"拥有两千多年养马历史、世界上最大的马场是（ ）。","options":[{"key":"A","text":"山丹军马场"},{"key":"B","text":"伊犁昭苏马场"},{"key":"C","text":"呼伦贝尔马场"},{"key":"D","text":"坝上草原马场"}],"answer":"A","keys":["A"],"explanation":"位于张掖山丹县的山丹军马场是世界上最大的马场，拥有两千多年养马历史；甘肃养马历史悠久，自汉至今一直是我国养马业的重地。","type":"单选题"},{"number":117,"stem":"世界上最大最古老、保存得最完好的生土建筑城市是（ ）。","options":[{"key":"A","text":"楼兰故城遗址"},{"key":"B","text":"交河故城遗址"},{"key":"C","text":"高昌故城"},{"key":"D","text":"北庭故城"}],"answer":"B","keys":["B"],"explanation":"交河故城遗址是世界上最大最古老、保存得最完好的生土建筑城市，唐西域最高军政机构安西都护府最早就设在交河故城。","type":"单选题"},{"number":118,"stem":"台湾本岛唯一的热带地区，被称为“台湾的天涯海角”的是（ ）。","options":[{"key":"A","text":"野柳公园"},{"key":"B","text":"玉山"},{"key":"C","text":"垦丁公园"},{"key":"D","text":"阳明山"}],"answer":"C","keys":["C"],"explanation":"垦丁公园是台湾本岛唯一的热带地区，终年气温和暖，也是台湾省唯一拥有海域和陆地的公园，被称为台湾的天涯海角。B 项玉山、D 项阳明山均为台湾著名山岳，易误选。","type":"单选题"},{"number":119,"stem":"被众多游客称为“此生必驾公路”和“最美天山路”的是（ ）。","options":[{"key":"A","text":"独库公路"},{"key":"B","text":"伊昭公路"},{"key":"C","text":"塔里木沙漠公路"},{"key":"D","text":"赛果高速"}],"answer":"A","keys":["A"],"explanation":"自驾独库公路能够感受“一日历四季，十里不同天”的独特体验，被众多游客称为“此生必驾公路”和“最美天山路”。","type":"单选题"},{"number":120,"stem":"香港众岛屿中面积最大的岛屿是（ ）。","options":[{"key":"A","text":"香港岛"},{"key":"B","text":"南丫岛"},{"key":"C","text":"大屿山"},{"key":"D","text":"青马岛"}],"answer":"C","keys":["C"],"explanation":"香港众岛屿以大屿山面积最大，其次是香港岛；香港岛以南的鸭脚洲则是全球人口最稠密的岛屿之一。","type":"单选题"},{"number":121,"stem":"中国第一条国际铁路是（ ）。","options":[{"key":"A","text":"成昆铁路"},{"key":"B","text":"中老铁路"},{"key":"C","text":"湘黔铁路"},{"key":"D","text":"滇越铁路"}],"answer":"D","keys":["D"],"explanation":"云南昆明至越南河内的滇越铁路是中国第一条国际铁路。","type":"单选题"},{"number":122,"stem":"我国台湾省长期居全球第一位的产业领域是（ ）。","options":[{"key":"A","text":"石化产业"},{"key":"B","text":"精密机械"},{"key":"C","text":"晶圆代工产业"},{"key":"D","text":"纺织业"}],"answer":"C","keys":["C"],"explanation":"台湾省拥有全球最密集的半导体产业集群，尤其在晶圆代工产业领域长期居全球第一位，有台积电、日月光、联发科、富士康、华硕等一批企业。","type":"单选题"},{"number":123,"stem":"重庆云雾山全年雾日多达（ ）天，堪称“世界之最”。","options":[{"key":"A","text":"164天"},{"key":"B","text":"240天"},{"key":"C","text":"304天"},{"key":"D","text":"204天"}],"answer":"D","keys":["D"],"explanation":"重庆云雾山全年雾日多达 204 天，堪称“世界之最”。","type":"单选题"},{"number":124,"stem":"世界最大的室内卧佛位于甘肃（ ）。","options":[{"key":"A","text":"张掖大佛寺"},{"key":"B","text":"武威大佛寺"},{"key":"C","text":"天水大佛寺"},{"key":"D","text":"兰州大佛寺"}],"answer":"A","keys":["A"],"explanation":"张掖大佛寺有世界最大的室内卧佛；“九色香巴拉”天堂之地指甘南藏族自治州。","type":"单选题"},{"number":125,"stem":"到澳门旅游最理想的季节是（ ）。","options":[{"key":"A","text":"春季（3~5月）"},{"key":"B","text":"秋季（9~11月）"},{"key":"C","text":"夏季（6~8月）"},{"key":"D","text":"冬季（12~2月）"}],"answer":"B","keys":["B"],"explanation":"秋季（9~11月）阳光充足、气候温和且湿度较低，是到澳门旅游的最理想的季节。","type":"单选题"},{"number":126,"stem":"我国第一条跨国原油管道是（ ）。","options":[{"key":"A","text":"中俄原油管道"},{"key":"B","text":"中缅油气管道"},{"key":"C","text":"中哈原油管道"},{"key":"D","text":"中亚天然气管道"}],"answer":"C","keys":["C"],"explanation":"中哈原油管道是我国第一条跨国原油管道，也是连接里海油田到中国内陆的重要能源通道。","type":"单选题"},{"number":127,"stem":"宁夏枸杞以（ ）所产为最佳，被列入《中国药典》。","options":[{"key":"A","text":"银川"},{"key":"B","text":"固原"},{"key":"C","text":"中卫"},{"key":"D","text":"中宁"}],"answer":"D","keys":["D"],"explanation":"宁夏是枸杞的原产地，是世界上品质最好、种植时间最长的地方，其中又以中宁所产为最佳；中宁枸杞被列入《中国药典》，远销 58 国。","type":"单选题"},{"number":128,"stem":"澳门的区花是（ ）。","options":[{"key":"A","text":"莲花"},{"key":"B","text":"紫荆花"},{"key":"C","text":"白玉兰"},{"key":"D","text":"菊花"}],"answer":"A","keys":["A"],"explanation":"澳门区的区花是莲花，金莲花广场的大型雕塑“盛世莲花”是中央人民政府为庆祝澳门回归而赠送的；紫荆花是香港区花，易误选。","type":"单选题"},{"number":129,"stem":"中国第一条采用自主研发的北斗卫星导航系统、设计速度 350公里/小时的智能化高速铁路是（ ）。","options":[{"key":"A","text":"京沪高铁"},{"key":"B","text":"京张客运专线"},{"key":"C","text":"京津城际"},{"key":"D","text":"京广高铁"}],"answer":"B","keys":["B"],"explanation":"京张客运专线是中国第一条采用自主研发的北斗卫星导航系统、设计速度 350公里/小时的智能化高速铁路，也是世界上第一条最高设计速度 350公里/小时的高寒、大风沙高速铁路。","type":"单选题"},{"number":130,"stem":"国家 5A 级旅游景区数量最多的省市是（ ）。","options":[{"key":"A","text":"福建"},{"key":"B","text":"江苏"},{"key":"C","text":"天津"},{"key":"D","text":"浙江"}],"answer":"B","keys":["B"],"explanation":"江苏省国家 5A 级旅游景区数量位居全国第一、浙江第二。三、多选题","type":"单选题"},{"number":131,"stem":"中国古典园林叠山的石材主要有两种，其用途对应正确的有（ ）。","options":[{"key":"A","text":"黄石——用于假山的基础部分，称叠脚"},{"key":"B","text":"太湖石——置于假山上部，称收顶"},{"key":"C","text":"黄石——置于假山上部"},{"key":"D","text":"太湖石——用于假山的基础部分"},{"key":"E","text":"两种石材用途相同"}],"answer":"AB","keys":["A","B"],"explanation":"叠山石材主要有两种：一是黄石，因其质地坚硬，不易受风雨的侵蚀，用于假山的基础部分，称叠脚。二是太湖石，因其具有皱、瘦、漏、透四大特点，置于假山的上部，供游人玩赏品味，称收顶。CD 项把两种石材的用途颠倒了；E 项，两种石材的用途并不相同。","type":"多选题"},{"number":132,"stem":"兼香型酒以（ ）为代表。","options":[{"key":"A","text":"贵州遵义董酒"},{"key":"B","text":"陕西西凤酒"},{"key":"C","text":"贵州茅台酒"},{"key":"D","text":"山西汾酒"},{"key":"E","text":"桂林三花酒"}],"answer":"AB","keys":["A","B"],"explanation":"兼香型酒指具有两种以上主体香型的白酒，具有一酒多香的风格，又称为复香型和混合香型酒。以贵州遵义董酒、陕西西凤酒为代表。C 项，贵州茅台酒是酱香型酒的典型代表；D项，山西杏花村汾酒是清香型酒的代表；E 项，桂林三花酒属于米香型酒的代表。","type":"多选题"},{"number":133,"stem":"中国“四大名锦”包括（ ）。","options":[{"key":"A","text":"南京云锦"},{"key":"B","text":"四川蜀锦"},{"key":"C","text":"苏州宋锦"},{"key":"D","text":"广西壮锦"},{"key":"E","text":"杭州织锦"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"在中国众多锦中，南京云锦、四川蜀锦、苏州宋锦、广西壮锦并称“四大名锦”，分别代表宫廷皇家、汉唐丝路、文人雅士和少数民族四大文化体系。云锦因锦面色彩斑斓、美若云霞而得名，被专家称为“中国古代织锦工艺史上最后一座里程碑”。E 项，杭州织锦不在“四大名锦”之列。","type":"多选题"},{"number":134,"stem":"我国三大瀑布风景区是（ ）。","options":[{"key":"A","text":"黄果树瀑布风景区"},{"key":"B","text":"壶口瀑布风景区"},{"key":"C","text":"吊水楼瀑布风景区"},{"key":"D","text":"德天瀑布风景区"},{"key":"E","text":"诺日朗瀑布风景区"}],"answer":"ABC","keys":["A","B","C"],"explanation":"黄果树瀑布风景区、壶口瀑布风景区和吊水楼瀑布风景区是我国的三大瀑布风景区。D项，德天瀑布为亚洲第一大跨国瀑布；E 项，诺日朗瀑布是大型钙华瀑布，瀑面最宽达 300多米，是我国最宽的瀑布，二者均不在三大瀑布风景区之列。","type":"多选题"},{"number":135,"stem":"中国佛教包容的三大体系是（ ）。","options":[{"key":"A","text":"北传佛教"},{"key":"B","text":"南传佛教"},{"key":"C","text":"藏传佛教"},{"key":"D","text":"汉传佛教"},{"key":"E","text":"上座部佛教"}],"answer":"ABC","keys":["A","B","C"],"explanation":"中国佛教包容了北传佛教、南传佛教和藏传佛教三大体系。可以说，佛教诞生在印度，发展在中国。D 项，北传佛教亦称汉语系佛教，汉传佛教即北传佛教；E 项，南传佛教以小乘佛教（上座部佛教）为主，上座部佛教即南传佛教。","type":"多选题"},{"number":136,"stem":"从 2008年起成为全国性法定节日的有（ ）。","options":[{"key":"A","text":"七夕节"},{"key":"B","text":"清明节"},{"key":"C","text":"端午节"},{"key":"D","text":"中秋节"},{"key":"E","text":"元宵节"}],"answer":"BCD","keys":["B","C","D"],"explanation":"根据国务院令，从 2008年 1 月 1 日起，除春节外，清明节、端午节、中秋节等传统节日也成为全国性法定节日。AE项，七夕节、元宵节不在 2008年起新增的全国性法定节日之列。","type":"多选题"},{"number":137,"stem":"巴金的“爱情三部曲”包括（ ）。","options":[{"key":"A","text":"《雾》"},{"key":"B","text":"《雨》"},{"key":"C","text":"《电》"},{"key":"D","text":"《家》"},{"key":"E","text":"《春》"}],"answer":"ABC","keys":["A","B","C"],"explanation":"巴金于 1929 年发表第一部长篇小说《灭亡》，随后有长篇小说“爱情三部曲”（《雾》《雨》《电》）和“激流三部曲”（《家》《春》《秋》）。DE 项，《家》《春》属“激流三部曲”，而非“爱情三部曲”。","type":"多选题"},{"number":138,"stem":"汉字发展演变的规律可以概括为（ ）。","options":[{"key":"A","text":"笔画的线条化"},{"key":"B","text":"字形的符号化"},{"key":"C","text":"结构的规范化"},{"key":"D","text":"字体的拼音化"},{"key":"E","text":"书写的随意化"}],"answer":"ABC","keys":["A","B","C"],"explanation":"汉字发展演变的规律可以概括为以下三个方面：笔画的线条化、字形的符号化、结构的规范化。DE项，“字体的拼音化”“书写的随意化”不在汉字发展演变规律之列。","type":"多选题"},{"number":139,"stem":"下列关于古田会议的表述，正确的有（ ）。","options":[{"key":"A","text":"1929年 12 月 28-29 日在福建省上杭县古田召开"},{"key":"B","text":"选举毛泽东为新的中共红四军前敌委员会书记"},{"key":"C","text":"根据中央九月来信精神，通过毛泽东起草的古田会议决议"},{"key":"D","text":"确立了思想建党、政治建军的原则"},{"key":"E","text":"是中国共产党历史上生死攸关的转折点"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"1929 年 12 月 28-29 日，红四军党的第九次代表大会在福建省上杭县古田召开，即古田会议。古田会议选举产生了新的中共红四军前敌委员会，毛泽东当选为书记。古田会议根据中央九月来信精神，通过毛泽东起草的古田会议决议，确立了思想建党、政治建军的原则。古田会议决议是中国共产党和红军建设的纲领性文献，是党和人民军队建设史上的重要里程碑。E项，遵义会议是党的历史上一个生死攸关的转折点。","type":"多选题"},{"number":140,"stem":"新石器时代前期母系氏族社会的代表性文化有（ ）。","options":[{"key":"A","text":"仰韶文化"},{"key":"B","text":"河姆渡文化"},{"key":"C","text":"龙山文化"},{"key":"D","text":"良渚文化"},{"key":"E","text":"红山文化"}],"answer":"AB","keys":["A","B"],"explanation":"新石器时代前期——母系氏族社会代表性文化有北方黄河流域的仰韶文化和南方长江流域的河姆渡文化，距今 7000-5000 年。CD 项，新石器时代后期——父系氏族社会代表性文化是北方黄河流域的龙山文化和南方长江流域的良渚文化，属父系氏族社会；E 项，红山文化不在母系氏族社会代表性文化之列。","type":"多选题"},{"number":141,"stem":"被称为“化石植物”的有（ ）。","options":[{"key":"A","text":"水杉"},{"key":"B","text":"银杉"},{"key":"C","text":"珙桐"},{"key":"D","text":"银杏"},{"key":"E","text":"松树"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"水杉、银杉、珙桐、银杏等，被称为“化石植物”。E 项，松、竹、梅被誉为岁寒三友，松树不在“化石植物”之列。","type":"多选题"},{"number":142,"stem":"巴黎的三大地标是（ ）。","options":[{"key":"A","text":"巴黎圣母院"},{"key":"B","text":"凯旋门"},{"key":"C","text":"埃菲尔铁塔"},{"key":"D","text":"卢浮宫"},{"key":"E","text":"凡尔赛宫"}],"answer":"ABC","keys":["A","B","C"],"explanation":"巴黎圣母院、凯旋门和埃菲尔铁塔是巴黎的三大地标。埃菲尔铁塔是一座建于 1889年的镂空结构铁塔，是世界上第一座钢铁结构的高塔，也是巴黎最高的建筑物，成为巴黎和法国的象征。D 项，卢浮宫始建于 1204年，是法国最大的王宫建筑，也是世界上最大、最古老、最著名的博物馆之一，但不在巴黎三大地标之列；E 项，凡尔赛宫也不在三大地标之列。","type":"多选题"},{"number":143,"stem":"春秋战国时期沟通长江与黄河水系的工程有（ ）。","options":[{"key":"A","text":"邗沟"},{"key":"B","text":"鸿沟"},{"key":"C","text":"都江堰"},{"key":"D","text":"郑国渠"},{"key":"E","text":"灵渠"}],"answer":"AB","keys":["A","B"],"explanation":"春秋时期吴开凿邗沟，沟通了长江和淮河；战国时期魏开凿鸿沟，沟通了黄河和淮河。这两大工程打通了长江到黄河的水上交通航道，促进了中国南北方交通的发展，并成为隋代大运河的雏形。CD项，秦在关中修建郑国渠，在蜀郡修建都江堰，主要用于农业灌溉，并非沟通长江与黄河水系的工程；E项，灵渠首次沟通长江（湘江）与珠江（漓江）两大水系，沟通的是长江与珠江水系。","type":"多选题"},{"number":144,"stem":"金沙江下游梯级水电开发工程建成的四座梯级水电站是（ ）。","options":[{"key":"A","text":"乌东德"},{"key":"B","text":"白鹤滩"},{"key":"C","text":"溪洛渡"},{"key":"D","text":"向家坝"},{"key":"E","text":"龙羊峡"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"金沙江下游梯级水电开发工程共建成乌东德、白鹤滩、溪洛渡、向家坝四座梯级水电站，总装机容量相当于两个三峡工程，是我国西电东送项目的重要支撑。E 项，龙羊峡水电站位于黄河上游，不在金沙江下游梯级水电站之列。","type":"多选题"},{"number":145,"stem":"从塔的造型看，主要类型有（ ）。","options":[{"key":"A","text":"楼阁式塔"},{"key":"B","text":"密檐式塔"},{"key":"C","text":"覆钵式塔"},{"key":"D","text":"金刚宝座塔"},{"key":"E","text":"经幢式塔"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"从塔的造型看，主要有楼阁式塔、密檐式塔、覆钵式塔、金刚宝座塔等。楼阁式塔为数众多、历史最久，形式也最为壮观。E项，经幢式塔不在塔的主要类型之列。","type":"多选题"},{"number":146,"stem":"关于明清科举考试，下列说法正确的有（ ）。","options":[{"key":"A","text":"一般每三年举行一次，每次两轮"},{"key":"B","text":"乡试又称“秋闹”，考取者称为“举人”"},{"key":"C","text":"会试又称“春闹”，由礼部主持"},{"key":"D","text":"殿试排名分三等，称“三甲”"},{"key":"E","text":"一甲前三名分别称状元、榜眼、探花"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"明清科举考试制度固定，一般每三年举行一次，每次两轮。秋天在省城举行，叫“乡试”（又称“秋闹”），各府州的“生员”（或称“庠生”“秀才”）参加，考取者称为“举人”。次年春天在京师举行，叫“会试”（又称“春闹”），由礼部主持，举人才有资格参加考试，考中者称为“贡士”。排名分三等，称“三甲”，一甲取前三名，分别称为“状元”“榜眼”“探花”，赐予“进士及第”称号；二甲和三甲人数较多，分别赐予“进士出身”和“同进士出身”称号。考生如果能够在两轮三次考试中都获得第一名，即“乡试”第一名“解元”“会试”第一名“会元”“殿试”第一名“状元”，史称“连中三元”。","type":"多选题"},{"number":147,"stem":"下列关于新西兰的表述，正确的有（ ）。","options":[{"key":"A","text":"“世界边缘的国家”"},{"key":"B","text":"是世界上最大的鹿茸生产国和出口国"},{"key":"C","text":"羊肉、奶制品和粗羊毛的出口值皆为世界第一"},{"key":"D","text":"惠灵顿是世界上最南端的首都"},{"key":"E","text":"基督城是新西兰的“探险之都”"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"新西兰，被誉为“世界边缘的国家”。是世界上最年轻的移民国家之一，也是个高度发达的资本主义国家，是世界上最大的鹿茸生产国和出口国，羊肉、奶制品和粗羊毛的出口值皆为世界第一。惠灵顿是世界上最南端的首都，有“风城”之称。E 项，基督城是英国之外最像英国的城市，也是进入南极的门户；新西兰的“探险之都”是皇后镇。","type":"多选题"},{"number":148,"stem":"天津独乐寺以“三绝”享誉中外，这“三绝”包括（ ）。","options":[{"key":"A","text":"古建"},{"key":"B","text":"泥塑"},{"key":"C","text":"壁画"},{"key":"D","text":"石刻"},{"key":"E","text":"砖雕"}],"answer":"ABC","keys":["A","B","C"],"explanation":"独乐寺以古建、泥塑、壁画“三绝”享誉中外。D项石刻不在“三绝”之列。","type":"多选题"},{"number":149,"stem":"下列关于苏州的说法，正确的有（ ）。","options":[{"key":"A","text":"拥有两千余年建城史"},{"key":"B","text":"是大运河沿线城市中唯一以古城概念申遗的城市"},{"key":"C","text":"保持着“水陆并行、河街相邻”的双棋盘格局"},{"key":"D","text":"有“人间天堂”的美誉"},{"key":"E","text":"古称金陵"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"苏州古称姑苏、平江，平江、山塘历史街区分别被评为中国历史文化名街和中国最受欢迎的旅游历史文化名街。","type":"多选题"},{"number":150,"stem":"湖南红色旅游最具代表性的红色研学精品线路有（ ）等。","options":[{"key":"A","text":"“我的韶山行”"},{"key":"B","text":"“领袖元帅”"},{"key":"C","text":"“不忘初心，传承长征精神”"},{"key":"D","text":"“一粒种子改变世界”"},{"key":"E","text":"“重走长征路”"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"湖南以“十步之内，必有芳草”的红色底蕴，构建起以韶山为核心、红三角为极核的红色旅游格局。","type":"多选题"},{"number":151,"stem":"被称为西藏饮食“四宝”的是（ ）。","options":[{"key":"A","text":"酥油"},{"key":"B","text":"茶叶"},{"key":"C","text":"糌粑"},{"key":"D","text":"牛羊肉"},{"key":"E","text":"青稞"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"酥油茶是藏族人民不可缺少的饮料，青稞酒度数较低，是喜庆过节所必备。","type":"多选题"},{"number":152,"stem":"黑龙江著名冰雪旅游项目有（ ）。","options":[{"key":"A","text":"哈尔滨冰雪大世界游园会"},{"key":"B","text":"牡丹江雪乡"},{"key":"C","text":"漠河北极村冰雪游"},{"key":"D","text":"亚布力滑雪场"},{"key":"E","text":"太阳岛雪博会"}],"answer":"ABC","keys":["A","B","C"],"explanation":"著名冰雪旅游项目有哈尔滨冰雪大世界游园会、牡丹江雪乡和漠河北极村冰雪游等。D项亚布力滑雪场驰名中外，属滑雪资源（与冰雪大世界、雪乡并称黑龙江“最早开发利用冰雪资源”的代表），题目问“旅游项目”时以教材列举的“冰雪大世界、雪乡、漠河北极村冰雪游”为准确答案；注意亚布力滑雪场位于尚志市，属滑雪区域范畴。","type":"多选题"},{"number":153,"stem":"河南的寻根祭祖盛典有（ ）。","options":[{"key":"A","text":"淮阳太昊伏羲祭典"},{"key":"B","text":"新郑黄帝拜祖祭典"},{"key":"C","text":"洛阳牡丹文化节"},{"key":"D","text":"开封菊花文化节"},{"key":"E","text":"开封清明文化节"}],"answer":"AB","keys":["A","B"],"explanation":"河南有淮阳太昊伏羲祭典、新郑黄帝拜祖祭典等寻根祭祖盛典，体现“老家河南”根亲文化。","type":"多选题"},{"number":154,"stem":"根据发音谐音，香港人最受欢迎的数字有（ ）。","options":[{"key":"A","text":"“3”“8”（与粤语“升”“发”谐音）"},{"key":"B","text":"“6”“9”（与“禄”“久”谐音）"},{"key":"C","text":"“4”"},{"key":"D","text":"“7”"},{"key":"E","text":"“5”"}],"answer":"AB","keys":["A","B"],"explanation":"“3”“8”与粤语“升”“发”谐音，“6”“9”与“禄”“久”谐音，最受欢迎；忌讳“4”。","type":"多选题"},{"number":155,"stem":"下列省级单位中，（ ）联合申报了世界文化非物质文化遗产中国桑丝技艺。","options":[{"key":"A","text":"浙江省"},{"key":"B","text":"四川省"},{"key":"C","text":"江苏省"},{"key":"D","text":"湖南省"},{"key":"E","text":"福建省"}],"answer":"ABC","keys":["A","B","C"],"explanation":"中国传统桑蚕丝技艺由浙江、江苏、四川三省联合申报。","type":"多选题"},{"number":156,"stem":"下列大院中，属于山西晋中大院民俗文化组成部分的有（ ）。","options":[{"key":"A","text":"祁县乔家大院"},{"key":"B","text":"祁县渠家大院"},{"key":"C","text":"灵石王家大院"},{"key":"D","text":"太谷三多堂"},{"key":"E","text":"太谷曹家大院"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"因拍摄《大红灯笼高高挂》而闻名的祁县乔家大院，加上祁县渠家大院、灵石王家大院、太谷三多堂等，共同组成山西晋中的大院民俗文化。","type":"多选题"},{"number":157,"stem":"下列安徽特色物产对应正确的有（ ）。","options":[{"key":"A","text":"歙县——枇杷之乡"},{"key":"B","text":"宁国市——山核桃之乡"},{"key":"C","text":"砀山——酥梨之乡"},{"key":"D","text":"祁门——红茶之乡"},{"key":"E","text":"泾县——宣纸之乡"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"歙县有上千年的枇杷种植史；宁国市是“山核桃之乡”；砀山是“酥梨之乡”；祁门是“红茶之乡”。","type":"多选题"},{"number":158,"stem":"广西民族风情旅游不可不看的“四绝”是（ ）。","options":[{"key":"A","text":"壮族的歌"},{"key":"B","text":"瑶族的舞"},{"key":"C","text":"苗族的节"},{"key":"D","text":"侗族的楼和桥"},{"key":"E","text":"汉族的节"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"“壮族的歌、瑶族的舞、苗族的节、侗族的楼和桥”并称广西民族风情旅游“四绝”。","type":"多选题"},{"number":159,"stem":"被誉为“甘肃十大特色美食”的有（ ）等。","options":[{"key":"A","text":"兰州清汤牛肉面"},{"key":"B","text":"羊肉泡馍"},{"key":"C","text":"陇西腊肉"},{"key":"D","text":"静宁烧鸡"},{"key":"E","text":"酿皮子"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"本题全部正确。甘肃十大特色美食还有浆水面、臊子面、手抓羊肉、靖远羊羔肉、藏包等。","type":"多选题"},{"number":160,"stem":"北京地方菜的经典名菜有（ ）。","options":[{"key":"A","text":"北京烤鸭"},{"key":"B","text":"涮羊肉"},{"key":"C","text":"老北京烤肉"},{"key":"D","text":"京酱肉丝"},{"key":"E","text":"北京炸酱面"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"北京烤鸭、涮羊肉、老北京烤肉、京酱肉丝是北京地方菜的经典名菜。富华斋馋饼铺、稻香村、百年义利、大顺斋等都是北京的知名食品品牌。","type":"多选题"},{"number":161,"stem":"上海聚焦“五个中心”建设，“五个中心”是指（ ）。","options":[{"key":"A","text":"国际经济中心"},{"key":"B","text":"金融中心"},{"key":"C","text":"贸易中心"},{"key":"D","text":"航运中心"},{"key":"E","text":"科技创新中心"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"“五个中心”即国际经济中心、金融中心、贸易中心、航运中心、科技创新中心。","type":"多选题"},{"number":162,"stem":"下列关于海口的说法，正确的有（ ）。","options":[{"key":"A","text":"别称“椰城”"},{"key":"B","text":"“海口”一名最早出现在宋代"},{"key":"C","text":"是海南省省会"},{"key":"D","text":"已有 900多年的历史"},{"key":"E","text":"有“鹿城”之称"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"海口别称“椰城”，“海口”一名最早出现在宋代，已有 900 多年的历史，是海南省省会。E 项错误，“鹿城”是三亚的别称。","type":"多选题"},{"number":163,"stem":"下列关于福建交通的说法，正确的有（ ）。","options":[{"key":"A","text":"所有设区市实现高速铁路环线贯通"},{"key":"B","text":"全国第一个市市通高铁的省份"},{"key":"C","text":"开通全国首条“冰上丝绸之路”福州港至欧洲快速航线"},{"key":"D","text":"拥有厦门港、福州港、湄洲湾 3 个亿吨大港"},{"key":"E","text":"陆地海岸线长度居全国第一"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"福建所有设区市实现高速铁路环线贯通，是全国第一个市市通高铁的省份；开通全国首条“冰上丝绸之路”福州港经北极至欧洲快速航线；拥有厦门港、福州港、湄洲湾 3个亿吨大港。E项错误，福建陆地海岸线长度位居全国第二。","type":"多选题"},{"number":164,"stem":"曲阜“三孔”是指（ ）。","options":[{"key":"A","text":"孔庙"},{"key":"B","text":"孔府"},{"key":"C","text":"孔林"},{"key":"D","text":"孔桥"},{"key":"E","text":"孔桥"}],"answer":"ABC","keys":["A","B","C"],"explanation":"曲阜“三孔”指孔庙、孔府、孔林，是世界文化遗产。","type":"多选题"},{"number":165,"stem":"下列属于吉林世界遗产的有（ ）。","options":[{"key":"A","text":"沈阳故宫"},{"key":"B","text":"长城（吉林段）"},{"key":"C","text":"元上都遗址"},{"key":"D","text":"中国高句丽王城、王陵及贵族墓葬"},{"key":"E","text":"九寨沟"}],"answer":"BD","keys":["B","D"],"explanation":"吉林文化遗产 2 项：长城（吉林段）、中国高句丽王城、王陵及贵族墓葬。沈阳故宫位于辽宁，元上都遗址位于内蒙古，九寨沟为四川世界自然遗产。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD二/LDD押题第2卷（科目三四）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD二/LDD押题第2卷（科目三四）-试卷.pdf"}]},{"number":3,"subjects":[{"name":"科目一二","questions":[{"number":1,"stem":"根据《中华人民共和国宪法》的规定，居民委员会､村民委员会是基层群众性自治组织，不属于国家机关。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"城市和农村按居民居住地区设立的居民委员会或村民委员会是基层群众性自治组织，并非国家机关。","type":"判断题"},{"number":2,"stem":"雷大大景区内 3 个游览场所的门票分别为 30 元､20 元､10 元，雷大大景区拟将门票合并出售。依据《中华人民共和国旅游法》，合并后的价格不得高于 60元，景区没有正当理由不得拒绝游客购买单项票。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"将不同景区的门票或者同一景区内不同游览场所的门票合并出售的，合并后的价格不得高于各单项门票的价格之和，且旅游者有权选择购买其中的单项票。本题错在“景区没有正当理由不得拒绝游客购买单项票”，游客采用何种购买方式，是游客“自主选择权”的体现，景区不存在“理由”，无论正当还是不正当。","type":"判断题"},{"number":3,"stem":"基于重大误解实施的民事法律行为，属于人民法院认定的无效民事法律行为。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 147条规定，基于重大误解实施的民事法律行为，行为人有权请求人民法院或者仲裁机构予以撤销。此处属于“可撤销”而不是“无效”。","type":"判断题"},{"number":4,"stem":"《文化和旅游市场信用管理规定》规定，旅游市场从业人员包括市场主体的法定代表人､主要负责人､实际控制人以及导游等有关人员。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":5,"stem":"违反治安管理行为的追究时效，应当从违法行为发生之日起计算。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"依据第 25 条，追究时效一般从违反治安管理行为发生之日起计算；但行为有连续或者继续状态的，从行为终了之日起计算。题干“应当从违法行为发生之日起计算”表述错误。","type":"判断题"},{"number":6,"stem":"根据《旅游投诉处理办法》第 15条的规定，旅游投诉处理机构处理旅游投诉，除本办法另有规定外，实行调解制度。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"《旅游投诉处理办法》第 15 条明确规定，旅游投诉处理机构处理旅游投诉，除本办法另有规定外，实行调解制度。","type":"判断题"},{"number":7,"stem":"根据《旅游法》的规定，旅游经营者应当对所有为旅游者提供服务的从业人员开展经常性应急救助技能培训。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"根据《旅游法》第 79 条第 2 款规定，旅游经营者应当对导游、领队等开展经常性应急救助技能培训。该项培训只对“直接服务人员”。","type":"判断题"},{"number":8,"stem":"旅行社责任保险是财产保险。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。旅行社责任保险主要包含以下 4个特征：属于强制保险；是财产保险；投保人和被保险人是旅行社；保险人是保险公司，赔偿的承担者是承保的保险公司。","type":"判断题"},{"number":9,"stem":"根据《铁路法》的规定，铁路运输中，旅客根据自愿申请办理保价运输的，应当按照保价额赔偿。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"根据《铁路法》第 17条第 1 项规定：“托运人或者旅客根据自愿申请办理保价运输的，按照实际损失赔偿，但最高不超过保价额。”","type":"判断题"},{"number":10,"stem":"根据《风景名胜区条例》，风景名胜区规划分为总体规划､专项规划､详细规划三类。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"《风景名胜区条例》第十二条：风景名胜区规划分为总体规划和详细规划。风景名胜区规划只分为总体规划和详细规划两类；专项规划属于总体规划的组成内容，不是独立的规划类型，故判断为错。","type":"判断题"},{"number":11,"stem":"依据《博物馆条例》，博物馆从事文物等藏品的商业经营活动，不得违反办馆宗旨，不得损害观众利益。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"博物馆不得从事文物等藏品的商业经营活动。博物馆从事其他商业经营活动，不得违反办馆宗旨，不得损害观众利益。且根据《文物保护法》，可以从事文物买卖的单位是文物商店和经营文物拍卖的拍卖企业。","type":"判断题"},{"number":12,"stem":"党的二十大报告指出，创新性是马克思主义的本质属性，党的理论是来自人民､为了人民､造福人民的理论，人民的创造性实践是理论创新的不竭源泉。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。“创新性”应改为“人民性”。党的二十大报告指出，必须坚持人民至上。人民性是马克思主义的本质属性，党的理论是来自人民、为了人民、造福人民的理论，人民的创造性实践是理论创新的不竭源泉。","type":"判断题"},{"number":13,"stem":"依据习近平生态文明思想，良好生态环境是最普惠的民生福祉。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"坚持良好生态环境是最普惠的民生福祉。该表述与原文完全一致，故本题正确。","type":"判断题"},{"number":14,"stem":"升挂国旗时，应当举行升旗仪式。举行升旗仪式时，可以奏唱国歌。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题表述错误。《国旗法》规定，升挂国旗时，可以举行升旗仪式。举行升旗仪式时，应当奏唱国歌。","type":"判断题"},{"number":15,"stem":"《英烈法》规定，禁止歪曲､丑化､亵渎､否定英雄烈士事迹和精神，英雄烈士的姓名､肖像､名誉､事迹受法律保护。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"要保护的是：姓名、肖像、名誉、荣誉；要弘扬的是：事迹、精神。","type":"判断题"},{"number":16,"stem":"《旅游强国建设“十五五”规划》是我国首部以“旅游强国”命名的国家级五年专项规划。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。这是我国首部以“旅游强国”命名的国家级五年专项规划。","type":"判断题"},{"number":17,"stem":"在法国巴黎召开的联合国教科文组织执行局第 224届会议上，我国浙江常山和四川四姑娘山顺利通过会议审议，正式成为世界地质公园。至此，我国世界地质公园增至 52 处，分布在 24个省(区､市)及香港特别行政区。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“51 处”。在法国巴黎召开的联合国教科文组织执行局第 224届会议上，我国浙江常山和四川四姑娘山顺利通过会议审议，正式成为世界地质公园。至此，我国世界地质公园增至 51处，分布在 24 个省(区､市)及香港特别行政区。","type":"判断题"},{"number":18,"stem":"2026年 7 月 8日，2025年度国家科学技术奖揭晓，中国科学院物理研究所陈立泉院士和中国电子科技集团有限公司贲德院士获国家最高科学技术奖。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2026年 7 月 8 日，2025 年度国家科学技术奖揭晓，共评选出 258个项目和 11名科技专家，中国科学院物理研究所陈立泉院士和中国电子科技集团有限公司贲德院士获国家最高科学技术奖。","type":"判断题"},{"number":19,"stem":"2026 年 7 月 10日，长征十号乙运载火箭在海南商业航天发射场发射升空，将卫星顺利送入预定轨道后，一子级垂直返回，在海上回收平台通过网系捕获方式成功回收。此次任务是我国首次成功实施运载火箭一子级可控回收，同时也是全球首次运载火箭网系回收，标志着我国在重复使用火箭技术领域取得历史性突破。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2026年 7月 10日 12时 15分，长征十号乙运载火箭在海南商业航天发射场发射升空，将卫星顺利送入预定轨道，火箭一二级分离约 6 分钟后，一子级垂直返回，在海上回收平台通过网系捕获方式成功回收，发射及一子级回收任务取得圆满成功。此次任务是我国首次成功实施运载火箭一子级可控回收，同时也是全球首次运载火箭网系回收，标志着我国在重复使用火箭技术领域取得历史性突破，将为加快提升我国进出空间能力奠定坚实基础。长征十号乙运载火箭成为我国首型成功实施回收的重复使用运载火箭。","type":"判断题"},{"number":20,"stem":"美国东部时间 2026 年 9 月 27 日晨，中国大熊猫“平平”“福双”搭乘包机抵达美国亚特兰大国际机场。根据中美双方安排，这对大熊猫将在亚特兰大动物园开启为期 10 年的旅居生活。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":21,"stem":"导游服务是单纯的脑力劳动，既需要丰富的知识，还需要扎实的讲解功底。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。导游服务不是单纯的脑力劳动，是脑体高度结合的劳动，既需要丰富的知识还需要扎实的讲解功底，也需要强健的体魄，长时间站立、行走。","type":"判断题"},{"number":22,"stem":"导游是旅游活动的核心和引领者，在整个旅游服务工作中，导游服务扮演着主导者的角色。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。导游服务是旅游服务中最具代表性的服务，起着纽带作用、标志作用、扩散作用和反馈作用，是旅游活动的核心和引领者，在整个旅游服务工作中扮演着主导者的角色。","type":"判断题"},{"number":23,"stem":"具有初级中学､中等专业学校或以上学历，身体健康，具有适应导游需要的基本知识和语言表达能力的中华人民共和国公民，就可以参加导游资格考试。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。具有高级中学、中等专业学校或以上学历，身体健康，具有适应导游需要的基本知识和语言表达能力的中华人民共和国公民，可以参加导游资格考试。","type":"判断题"},{"number":24,"stem":"接待计划是组团社委托有关地接社组织落实旅游团活动的契约性文件。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":25,"stem":"当汽车高速行驶时，禁止导游在车内讲解。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。当汽车高速行驶时，禁止导游在车内站立讲解。","type":"判断题"},{"number":26,"stem":"领队应在不迟于出团前 3日与参团旅游者取得联系，再次提醒注意事项并请旅游者回复确认。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。领队应在不迟于出团前 1 日与参团旅游者取得联系，再次提醒旅游者团队集合时间与地点、出入境及海关注意事项、公共交通工具行李要求、所需携带证件资料、根据目的地气候备齐物品等重要事项，并请旅游者回复确认。","type":"判断题"},{"number":27,"stem":"当游客的观点与自己的不同时，只要不涉及大原则问题，也不要立即反驳否定，要学会包容，求同存异。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":28,"stem":"用凝练精辟的词语提炼景点突出特征的讲解方法是画龙点睛法。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。画龙点睛法是指用凝练精辟的词语提炼景点突出特征。","type":"判断题"},{"number":29,"stem":"旅游过程中，旅游者提出变更合同的要求时，导游应婉拒，特殊情况请示旅行社核定。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":30,"stem":"导游带团时，应提前半天与饭店确认用房数､告知入住时间，让饭店提前排房号并告知导游，再与旅游者确认。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。导游应提前半天与饭店确认用房数、告知入住时间，让饭店提前排房号并告知导游，再与旅游者确认。","type":"判断题"},{"number":31,"stem":"导游带领亲子团游玩时，重点考虑家长的特殊需求，兼顾孩子的需求。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。导游要充分理解亲子团的特性，服务时兼顾孩子和父母的需求。在接待流程和服务上，重点考虑孩子的特殊需求。","type":"判断题"},{"number":32,"stem":"导游应提前了解政务接待的规律和特点，将“精细､周到､圆满与美好”的理念融入接待环节。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。导游应提前了解政务接待的规律和特点，将\"精细、周到、圆满与美好\"的理念融入接待环节，确保政务接待的规范性和专业性。","type":"判断题"},{"number":33,"stem":"个别旅游者要求前往不健康娱乐场所，导游要耐心劝阻，正面引导。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。面对个别旅游者要求前往不健康娱乐场所的情况：果断拒绝并介绍中国的传统观念和道德风貌，严肃指出不健康的娱乐活动和不正常的夜生活在中国是明令禁止的，是违法行为，会受到法律的惩处。","type":"判断题"},{"number":34,"stem":"如果游客不合理退团，导游告知退团后一切费用自理，且未使用费用不退。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。如果游客不合理退团，导游告知退团后一切费用自理，未使用费用按旅游合同约定或协商处理。","type":"判断题"},{"number":35,"stem":"当发生接待纠纷时，导游在处理问题时讲求有理､有利､有节，稳定旅游者情绪，引导旅游者理性维权。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。当发生接待纠纷时，导游在处理问题时要讲求有理、有利、有节，稳定旅游者情绪，引导旅游者理性维权。","type":"判断题"},{"number":36,"stem":"根据世界气象组织规定，当热带气旋中心持续风速达到 12级及以上时，便被定义为台风。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。根据世界气象组织规定，当热带气旋中心附近持续风速达到 12级及以上时，便被定义为台风。","type":"判断题"},{"number":37,"stem":"若在野外活动时遭遇雷电，应迅速回到旅游客车躲避。客车对雷电有较好的屏蔽作用。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。若在野外活动时遭遇雷电，应迅速回到旅游客车躲避。客车对雷电有较好的屏蔽作用。","type":"判断题"},{"number":38,"stem":"我国的外交护照是由人民政府外事部门颁发的。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。我国的外交护照是由外交部颁发的。","type":"判断题"},{"number":39,"stem":"普通列车每位旅客可以携带物品，每件物品长､宽､高之和小于等于 160厘米，杆状物品小于等于 200厘米。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。普通列车每位旅客可免费携带物品每件长+宽+高之和小于等于 160厘米，杆状物品小于等于 200厘米，超过规定尺寸需办理托运。","type":"判断题"},{"number":40,"stem":"外籍及台湾旅客须持西藏外事办/文化和旅游部/商务厅批文，或内地司局级单位出具的许可证明购票，才可以进入西藏。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。外籍及台湾旅客须持西藏外事办/文化和旅游部/商务厅批文，或内地司局级单位出具的许可证明购票。二、单项选择题（41‑ 130题）","type":"判断题"},{"number":41,"stem":"2026年 5 月 19日是第 16个中国旅游日，本届中国旅游日的主题是( )。","options":[{"key":"A","text":"乐享品质旅游，共赴美好山河"},{"key":"B","text":"畅游美丽中国，共享幸福旅程"},{"key":"C","text":"乐享文旅生活，共赏锦绣山河"},{"key":"D","text":"品质美好生活，畅游祖国山河"}],"answer":"A","keys":["A"],"explanation":"2026年 5月 19日是第 16 个中国旅游日，主题为“乐享品质旅游，共赴美好山河”，主会场设在广东省广州市。","type":"单选题"},{"number":42,"stem":"根据《中华人民共和国宪法》的规定，中国特色社会主义最本质的特征是( )。","options":[{"key":"A","text":"人民当家作主"},{"key":"B","text":"中国共产党领导"},{"key":"C","text":"人民民主专政"},{"key":"D","text":"生产资料社会主义公有制"}],"answer":"B","keys":["B"],"explanation":"宪法第 1条第 2 款明确规定：“中国共产党领导是中国特色社会主义最本质的特征。”A项错误，人民当家作主是人民主权原则的核心内容，而非中国特色社会主义最本质的特征；C项错误，人民民主专政是我国的国家性质(国体)，属于国体表述；D项错误，生产资料社会主义公有制是社会主义经济制度的基础，并非最本质特征。","type":"单选题"},{"number":43,"stem":"《宪法》规定，( )是我国的国体。","options":[{"key":"A","text":"人民代表大会制度"},{"key":"B","text":"人民民主专政"},{"key":"C","text":"政治协商制度"},{"key":"D","text":"工农联盟"}],"answer":"B","keys":["B"],"explanation":"《宪法》第 1 条规定，中华人民共和国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家。因此，人民民主专政是我国的国体。","type":"单选题"},{"number":44,"stem":"根据《旅游法》的规定，旅行社依照本法规定将包价旅游合同中的接待业务委托给地接社履行的，应当在包价旅游合同中载明( )的基本信息。","options":[{"key":"A","text":"委托社"},{"key":"B","text":"地接社"},{"key":"C","text":"委托社和地接社"},{"key":"D","text":"委托社或地接社"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 60 条，旅行社依照本法规定将包价旅游合同中的接待业务委托给地接社履行的，应当在包价旅游合同中载明地接社的基本信息。","type":"单选题"},{"number":45,"stem":"国家倡导健康､文明､环保的旅游方式，支持和鼓励( )开展旅游公益宣传。","options":[{"key":"A","text":"各类社会机构"},{"key":"B","text":"各类社会团体"},{"key":"C","text":"旅游行业组织"},{"key":"D","text":"全媒体"}],"answer":"A","keys":["A"],"explanation":"《旅游法》第 5条：国家倡导健康、文明、环保的旅游方式，支持和鼓励各类社会机构开展旅游公益宣传，对促进旅游业发展做出突出贡献的单位和个人给予奖励。","type":"单选题"},{"number":46,"stem":"李某在带团中，因旅游者不参加其安排的另行付费项目而拒不履行合同。旅行社具备履行条件，经旅游者要求李某仍拒绝履行合同，造成旅游者人身损害､滞留的严重后果。对此，旅行社除了依法承担违约责任外，旅游者还可以要求旅行社( )。","options":[{"key":"A","text":"返还旅游费用"},{"key":"B","text":"旅游费用两倍的赔偿金"},{"key":"C","text":"旅游费用 1 倍以上 3 倍以下的赔偿金"},{"key":"D","text":"尚未发生费用 1 倍以上 3 倍以下的赔偿金"}],"answer":"C","keys":["C"],"explanation":"《旅游法》第 70 条，旅行社不履行包价旅游合同义务或者履行合同义务不符合约定的，应当依法承担继续履行、采取补救措施或者赔偿损失等违约责任；造成旅游者人身损害、财产损失的，应当依法承担赔偿责任。旅行社具备履行条件，经旅游者要求仍拒绝履行合同，造成旅游者人身损害、滞留等严重后果的，旅游者还可以要求旅行社支付旅游费用 1 倍以上3倍以下的赔偿金。","type":"单选题"},{"number":47,"stem":"《旅游法》规定，国家鼓励和支持发展( )和培训，提高旅游从业人员素质。","options":[{"key":"A","text":"导游继续学习"},{"key":"B","text":"旅游职业教育"},{"key":"C","text":"导游等级提升"},{"key":"D","text":"旅游高等教育"}],"answer":"B","keys":["B"],"explanation":"《旅游法》第 27条，国家鼓励和支持发展旅游职业教育和培训，提高旅游从业人员素质。","type":"单选题"},{"number":48,"stem":"《民法典》规定，当事人可以约定一方向对方给付定金作为债权的担保，定金的数额由当事人约定，但是不得超过主合同标的额的( )。","options":[{"key":"A","text":"20%"},{"key":"B","text":"15%"},{"key":"C","text":"10%"},{"key":"D","text":"5%"}],"answer":"A","keys":["A"],"explanation":"《民法典》第 586条，定金的数额由当事人约定；但是不得超过主合同标的额的 20%，超过部分不产生定金的效力。","type":"单选题"},{"number":49,"stem":"无民事行为能力或者限制民事行为能力的成年人，由下列有监护能力的人按顺序担任监护人，排在第一位的是( )。","options":[{"key":"A","text":"父母"},{"key":"B","text":"子女"},{"key":"C","text":"配偶"},{"key":"D","text":"其他近亲属"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 28 条无民事行为能力或者限制民事行为能力的成年人，由下列有监护能力的人按顺序担任监护人：(一)配偶；(二)父母、子女；(三)其他近亲属；(四)其他愿意担任监护人的个人或者组织，但是须经被监护人住所地的居民委员会、村民委员会或者民政部门同意。","type":"单选题"},{"number":50,"stem":"《民法典》规定，自愿参加具有一定风险的文体活动，因其他参加者的行为受到损害的，受害人( )请求其他参加者承担侵权责任；但是，其他参加者对损害的发生有故意或者重大过失的除外。","options":[{"key":"A","text":"可以"},{"key":"B","text":"不得"},{"key":"C","text":"应当"},{"key":"D","text":"有权"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 1176条规定，自愿参加具有一定风险的文体活动，因其他参加者的行为受到损害的，受害人不得请求其他参加者承担侵权责任；但是，其他参加者对损害的发生有故意或者重大过失的除外。","type":"单选题"},{"number":51,"stem":"依据《中华人民共和国民法典》第 142条的规定，有相对人的意思表示的解释，应当按照所使用的词句，结合相关条款､行为的性质和目的､习惯以及( )原则，确定意思表示的含义。","options":[{"key":"A","text":"诚信"},{"key":"B","text":"平等"},{"key":"C","text":"合理"},{"key":"D","text":"公平"}],"answer":"A","keys":["A"],"explanation":"《民法典》第 142条规定，有相对人的意思表示的解释，应当按照所使用的词句，结合相关条款、行为的性质和目的、习惯以及诚信原则，确定意思表示的含义。","type":"单选题"},{"number":52,"stem":"《民法典》规定，对格式条款有两种以上解释的，应当( )。","options":[{"key":"A","text":"按照通常理解予以解释"},{"key":"B","text":"作出不利于提供格式条款一方的解释"},{"key":"C","text":"采用非格式条款"},{"key":"D","text":"按双方约定予以解释"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 498条规定，对格式条款的理解发生争议的，应当按照通常理解予以解释。对格式条款有两种以上解释的，应当作出不利于提供格式条款一方的解释。格式条款和非格式条款不一致的，应当采用非格式条款。","type":"单选题"},{"number":53,"stem":"根据《民法典》的规定，侵害他人财产的，财产损失按照( )或者其他合理方式计算。","options":[{"key":"A","text":"侵害发生时的市场价格"},{"key":"B","text":"损失发生时的市场价格"},{"key":"C","text":"侵害发生时的政府指导价"},{"key":"D","text":"损失发生时的政府指导价"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 1184条，侵害他人财产的，财产损失按照损失发生时的市场价格或者其他合理方式计算。","type":"单选题"},{"number":54,"stem":"根据《民法典》的规定，以下( )属于无效的民事法律行为。","options":[{"key":"A","text":"第三人实施欺诈，使一方在违背真实意思的情况下实施的民事法律行为"},{"key":"B","text":"欺诈手段实施的民事法律行为"},{"key":"C","text":"胁迫手段实施的民事法律行为"},{"key":"D","text":"违背公序良俗的民事法律行为"}],"answer":"D","keys":["D"],"explanation":"“第三人欺诈、欺诈手段、胁迫手段”实施的民事法律行为，均属于可撤销的民事法律行为。","type":"单选题"},{"number":55,"stem":"旅游客车在正常行驶中，突然从道路上跑出来一只宠物犬。由于事发突然，驾驶员紧急变向，冲到道路另一侧，造成车内部分游客受伤。事实证明，宠物犬距离旅游车还有一段距离。对游客的损失应当承担责任的是( )。","options":[{"key":"A","text":"汽车驾驶员和宠物犬的主人"},{"key":"B","text":"汽车驾驶员"},{"key":"C","text":"宠物犬的主人"},{"key":"D","text":"组织旅游活动的旅行社和宠物犬的主人"}],"answer":"D","keys":["D"],"explanation":"根据《民法典》第 182条，因紧急避险造成损害的，由引起险情发生的人承担民事责任。故宠物犬主人需要承担责任。紧急避险采取措施不当或者超过必要的限度，造成不应有的损害的，紧急避险人应当承担适当的责任。本题属于汽车驾驶员紧急避险采取措施不当的情形，故应适当承担责任。旅游汽车驾驶员属于旅行社的雇员，由旅行社承担替代责任，故由旅行社和宠物犬的主人共同承担责任。","type":"单选题"},{"number":56,"stem":"《旅行社条例》规定，允许旅行社向银行寻求信用支持，即以银行担保的形式交纳质量保证金。根据规定，担保期限不得少于( )；担保期届满前( )内，续办担保手续。","options":[{"key":"A","text":"1年，3 个工作日"},{"key":"B","text":"2年，1 个月"},{"key":"C","text":"1年，1 个月"},{"key":"D","text":"2年，3 个工作日"}],"answer":"A","keys":["A"],"explanation":"为了降低旅行社经营成本、避免资金闲置，《旅行社条例》还允许旅行社向银行寻求信用支持，即银行担保；担保期限不得少于 1年；担保期届满前 3 个工作日内，续办担保手续。","type":"单选题"},{"number":57,"stem":"旅行社设立分社的，应当自设立登记之日起 3 个工作日内，向( )。","options":[{"key":"A","text":"分社所在地的工商行政管理部门备案"},{"key":"B","text":"设立社所在地的工商行政管理部门备案"},{"key":"C","text":"设立社所在地的旅游行政管理部门办理设立登记"},{"key":"D","text":"分社所在地的旅游行政管理部门备案"}],"answer":"D","keys":["D"],"explanation":"旅行社设立分社的，应当向分社所在地的工商行政管理部门办理设立登记，并自设立登记之日起 3 个工作日内向分社所在地的旅游行政管理部门备案。","type":"单选题"},{"number":58,"stem":"在线旅游经营者违反有关规定，为以不合理低价组织的旅游活动提供交易机会的，由县级以上文化和旅游主管部门责令改正，给予警告，可以并处( )罚款。","options":[{"key":"A","text":"1万元以上 3万元以下"},{"key":"B","text":"3万元以下"},{"key":"C","text":"1万元以上 10万元以下"},{"key":"D","text":"1万元以下"}],"answer":"B","keys":["B"],"explanation":"《在线旅游经营服务管理暂行规定》第 36 条规定，在线旅游经营者违反本规定第 18条规定，为以不合理低价组织的旅游活动提供交易机会的，由县级以上文化和旅游主管部门责令改正，给予警告，可并处 3 万元以下罚款。","type":"单选题"},{"number":59,"stem":"《文化和旅游市场信用管理规定》规定，( )内第 3次认定为轻微失信主体的，应当认定为严重失信主体。","options":[{"key":"A","text":"36个月"},{"key":"B","text":"24个月"},{"key":"C","text":"12个月"},{"key":"D","text":"6个月"}],"answer":"C","keys":["C"],"explanation":"12 个月内第 3 次认定为轻微失信主体的，应当认定为严重失信主体。文化和旅游市场主体和从业人员有下列情形之一的，应当认定为轻微失信主体：①存在“捂票炒票”、虚假宣传、未履行相关义务、违反公序良俗等行为，造成不良社会影响的；②因故意或者重大过失严重损害旅游者合法权益，但尚不符合严重失信主体认定情形的；③在旅游经营活动中存在安全隐患，未在指定期限内整改完毕的；④拒不配合投诉处置、执法检查，拒不履行行政处罚决定，造成不良社会影响的；⑤12 个月内受到文化和旅游主管部门两次较大数额罚款行政处罚，造成不良社会影响的；⑥其他应当认定为轻微失信主体的情形。","type":"单选题"},{"number":60,"stem":"某旅行社经营范围包括国内旅游业务､入境旅游业务和出境旅游业务，并设有 2家经营国内旅游业务和入境旅游业务的分公司､1 家经营出境旅游业务的分公司，以及两家经营对应业务的服务网点。则该旅行社应当向其旅游服务质量保证金账户共存入( )。","options":[{"key":"A","text":"140万元"},{"key":"B","text":"150万元"},{"key":"C","text":"180万元"},{"key":"D","text":"210万元"}],"answer":"C","keys":["C"],"explanation":"经营入境旅游业务和国内旅游业务的旅行社，需要交纳 20 万元质量保证金，经营出境旅游业务的旅行社，需要交纳 120万元，经营入境旅游业务和国内旅游业务，同时还经营出境旅游业务的旅行社，应交纳 140万元。每设立一个经营国内旅游业务和入境旅游业务的分社，应当向其质量保证金账户增存 5万元；每设立一个经营出境旅游业务的分社，应当向其质量保证金账户增存 30 万元。服务网点无需增加质量保证金。120 万+20 万+2*5 万+30万=180万。","type":"单选题"},{"number":61,"stem":"雷大大旅行社与旅游者卢女士签订境内旅游合同，约定 2026年 10 月 10 日出发。出发当日，雷大大旅行社告知卢女士，由于飞机舱位不足不能成行。根据《旅行社服务质量赔偿标准》的规定，旅行社应当按照旅游费用总额的( )向卢女士承担违约金。","options":[{"key":"A","text":"5%"},{"key":"B","text":"10%"},{"key":"C","text":"15%"},{"key":"D","text":"20%"}],"answer":"D","keys":["D"],"explanation":"《旅行社服务质量赔偿标准》第 4 条规定，旅行社与旅游者订立合同或收取旅游者预付旅游费用后，因旅行社原因不能成行的，旅行社应在合理期限内通知旅游者，否则按下列标准承担赔偿责任：出发当日，支付旅游费用总额 20%的违约金。","type":"单选题"},{"number":62,"stem":"导游员老王在组织旅游者前往机场时，由于路途遭遇交通事故，未能乘坐行程单上预先安排的航班。根据《旅行社服务质量赔偿标准》的规定，雷大大旅行社应当赔偿游客的直接经济损失，并支付( )违约金。","options":[{"key":"A","text":"旅游费用总额的 20%"},{"key":"B","text":"直接经济损失的 20%"},{"key":"C","text":"直接经济损失的 30%"},{"key":"D","text":"旅游费用总额的 30%"}],"answer":"B","keys":["B"],"explanation":"因旅行社原因未乘坐公共交通工具的。旅行社应赔偿旅游者的直接经济损失，并支付直接经济损失 20%的违约金。","type":"单选题"},{"number":63,"stem":"根据《导游管理办法》的规定，导游以欺骗､贿赂等不正当手段取得导游人员资格证､导游证，申请人在( )内不得再次申请导游执业许可。","options":[{"key":"A","text":"1年"},{"key":"B","text":"2年"},{"key":"C","text":"3年"},{"key":"D","text":"5年"}],"answer":"C","keys":["C"],"explanation":"《导游管理办法》第 34 条，导游以欺骗、贿赂等不正当手段取得导游人员资格证、导游证，申请人在 3 年内不得再次申请导游执业许可。","type":"单选题"},{"number":64,"stem":"根据《导游管理办法》的规定，导游违反法律法规规定，以下( )情形可由县级以上旅游主管部门责令改正，并可以处 1000 元以下罚款。","options":[{"key":"A","text":"未申请变更导游证信息的"},{"key":"B","text":"导游以欺骗、贿赂等不正当手段取得导游证"},{"key":"C","text":"导游出借导游人员资格证"},{"key":"D","text":"导游擅自委托他人代为提供导游服务"}],"answer":"A","keys":["A"],"explanation":"《导游管理办法》第 33 条规定，违反本办法规定，导游有下列行为的，由县级以上旅游主管部门责令改正，并可以处 1000 元以下罚款；情节严重的，可以处 1000 元以上 5000元以下罚款：未按期报告信息变更情况的；未申请变更导游证信息的；未更换导游身份标识的；不依照本办法第二十四条规定采取相应措施的；未按规定参加旅游主管部门组织的培训的；向负责监督检查的旅游主管部门隐瞒有关情况、提供虚假材料或者拒绝提供反映其活动情况的真实材料的；在导游服务星级评价中提供虚假材料的。以欺骗、贿赂等不正当手段取得导游人员资格证、导游证，除依法撤销相关证件外，可以由所在地旅游主管部门处 1000元以上 5000 元以下罚款；申请人在 3年内不得再次申请导游执业许可。出租、出借导游人员资格证，擅自委托他人代为提供导游服务，由县级以上旅游主管部门责令改正，并可以处2000元以上 1 万元以下罚款。","type":"单选题"},{"number":65,"stem":"《导游人员管理条例》规定，各级旅游主管部门应当积极组织开展导游培训，每年累计培训时间不得少于( )小时。","options":[{"key":"A","text":"48"},{"key":"B","text":"24"},{"key":"C","text":"12"},{"key":"D","text":"4"}],"answer":"B","keys":["B"],"explanation":"各级旅游主管部门应当积极组织开展导游培训，培训内容应当包括政策法规、安全生产、突发事件应对和文明服务等，培训方式可以包括培训班、专题讲座和网络在线培训等，每年累计培训时间不得少于 24小时。培训不得向参加人员收取费用。","type":"单选题"},{"number":66,"stem":"依据《导游人员管理条例》，具有高级中学､中等专业学校或者以上学历，身体健康，具有适应( )的基本知识和语言表达能力的中华人民共和国公民，可以参加导游人员资格考试。","options":[{"key":"A","text":"社会需要"},{"key":"B","text":"旅游者需要"},{"key":"C","text":"旅游业发展需要"},{"key":"D","text":"导游需要"}],"answer":"D","keys":["D"],"explanation":"国家实行全国统一的导游人员资格考试制度，参加导游人员资格考试的条件如下：(1)中华人民共和国公民；(2)具有高级中学、中等专业学校或者以上学历；(3)身体健康；(4)具有适应导游需要的基本知识和语言表达能力。","type":"单选题"},{"number":67,"stem":"下列关于规范导游专座的说法，正确的是( )。","options":[{"key":"A","text":"导游专座应当设置在旅游大巴驾驶员后第一排乘客座椅靠通道侧位置"},{"key":"B","text":"已设置折叠座椅的旅游大巴可以在合理范围内继续供导游使用"},{"key":"C","text":"导游应自觉系好安全带，不得站立讲解"},{"key":"D","text":"旅游大巴在旅游服务过程中，应当配备印有“导游专座”字样的座套"}],"answer":"D","keys":["D"],"explanation":"导游专座的位置应设置在旅游客运车辆前乘客门侧第一排乘客座椅靠通道侧位置；折叠座椅的旅游大巴已经不允许使用；导游应当在旅游车辆“导游专座”就座。","type":"单选题"},{"number":68,"stem":"依据《中华人民共和国消费者权益保护法实施条例》，有关行政部门受理消费者投诉，消费者与经营者同意调解的，应当在受理之日起( )日内调解完毕，鉴定､检测时间不计入该期限。","options":[{"key":"A","text":"30"},{"key":"B","text":"45"},{"key":"C","text":"60"},{"key":"D","text":"90"}],"answer":"C","keys":["C"],"explanation":"有关行政部门受理投诉后，消费者和经营者同意调解的，有关行政部门应当依据职责及时调解，并在受理之日起 60日内调解完毕；调解不成的应当终止调解。调解过程中需要鉴定、检测的，鉴定、检测时间不计算在 60日内。","type":"单选题"},{"number":69,"stem":"依据《中华人民共和国消费者权益保护法》，向消费者提供消费信息和咨询服务，提高消费者维护自身合法权益的能力，引导文明､健康､节约资源和保护环境的消费方式，( )。","options":[{"key":"A","text":"既是消费者协会的权利也是其义务"},{"key":"B","text":"是消费者协会承担的社会责任"},{"key":"C","text":"是消费者协会的法定权力"},{"key":"D","text":"是消费者协会履行的公益性职责"}],"answer":"D","keys":["D"],"explanation":"《中华人民共和国消费者权益保护法》第 37 条规定了消费者协会履行的 8 条公益性职责。","type":"单选题"},{"number":70,"stem":"下列造成严重社会不良影响的行为中，属于旅游不文明行为记录对象的是( )。","options":[{"key":"A","text":"因侵害旅游者合法权益，被吊销旅游业务经营许可证的旅行社"},{"key":"B","text":"过错而导致在文化遗产上刻画涂污的 12 岁孩子的父母"},{"key":"C","text":"不尊重旅游目的地的风俗禁忌的导游"},{"key":"D","text":"违约造成游客严重滞留的某旅行社"}],"answer":"C","keys":["C"],"explanation":"旅游不文明行为记录的是旅游者和旅游从业人员的不文明行为。“因侵害旅游者合法权益……”“违约造成……”两选项属于文化市场主体和从业人员认定为严重失信主体的情形；“过错而导致……”因监护人存在重大过错导致被监护人发生旅游不文明行为，将监护人纳入“旅游不文明行为记录”，此处“过错”不是重大过错。","type":"单选题"},{"number":71,"stem":"与一般纠纷相比，下列属于旅游纠纷特点的是( )。","options":[{"key":"A","text":"旅游纠纷的法律关系单一，仅涵盖合同､侵权等民事关系"},{"key":"B","text":"旅游消费所涉的金额一般较大"},{"key":"C","text":"旅游纠纷的双方地位平等"},{"key":"D","text":"旅游纠纷的内容广泛多样，涉及住宿､餐饮､购物､安全､卫生､交通､保险等诸多方面"}],"answer":"D","keys":["D"],"explanation":"旅游纠纷的特点包括：(1)法律关系复杂，涵盖民事、行政和刑事法律关系；(2)内容广泛多样，除了与旅游合同、旅游服务等有关外，还会涉及住宿、餐饮、购物、安全、卫生、交通、保险等诸多方面；(3)旅游消费所涉的金额一般较小；(4)双方地位不平等，旅游纠纷风险防范成本高、旅游者维权难度大，旅游者的弱者地位较为明显。A 错在“法律关系单一、仅涵盖民事”；B错在“金额一般较大”；C 错在“双方地位平等”。","type":"单选题"},{"number":72,"stem":"旅游经营者提供服务时有欺诈行为，旅游者请求旅游经营者按接受服务费用的( )承担惩罚性赔偿责任的，人民法院应予支持。","options":[{"key":"A","text":"同额"},{"key":"B","text":"5倍"},{"key":"C","text":"3倍"},{"key":"D","text":"2倍"}],"answer":"C","keys":["C"],"explanation":"《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》(2020 修正)第十五条第 2款：旅游经营者提供服务时有欺诈行为，旅游者依据消费者权益保护法第五十五条第一款规定请求旅游经营者承担惩罚性赔偿责任的，人民法院应予支持。《消费者权益保护法》第 55 条第 1 款：欺诈，增加赔偿金额为价款或服务费三倍，不足 500 元按 500 元。","type":"单选题"},{"number":73,"stem":"根据《旅游投诉处理办法》的规定，下列符合旅游投诉受理条件的情形有( )。","options":[{"key":"A","text":"人民法院已经受理的"},{"key":"B","text":"投诉人与投诉事项有直接或间接利害关系"},{"key":"C","text":"社会调解机构已经处理的"},{"key":"D","text":"超过旅游合同履行期限届 30天的"}],"answer":"D","keys":["D"],"explanation":"A 项错误：人民法院已经受理的，属于不予受理情形。B项错误：受理要求是直接利害关系，间接利害关系不符合条件。C 项错误：社会调解机构已经处理的，属于不予受理情形。D 项正确：法定最长投诉时限是合同履行期限届满 90日，届满 30日尚未超期，符合受理时限要求。《旅游投诉处理办法》第九条旅游投诉应当符合下列条件：(一)投诉人与投诉事项有直接利害关系；(二)有明确的被投诉人、具体的投诉请求。第十一条旅游投诉有下列情形之一的，不予受理：(一)不属于旅游投诉处理机构管辖范围的；(二)超过旅游合同履行期限届满之日九十日的；(三)人民法院、仲裁机构、其他行政管理部门、消费者组织或者人民调解组织等机构已经受理或者处理的；(四)旅游投诉处理机构已经作出处理，且没有新情况、新理由的；(五)不符合本办法第九条规定的受理条件的；(六)本办法规定情形之外的经济纠纷、劳动人事纠纷等其他纠纷。","type":"单选题"},{"number":74,"stem":"根据《旅游投诉处理办法》第 23条的规定，旅游投诉调解不成的，旅游投诉处理机构应当( )。","options":[{"key":"A","text":"终止调解，制作《旅游投诉终止调解书》"},{"key":"B","text":"直接移送人民法院处理"},{"key":"C","text":"协调双方继续调解"},{"key":"D","text":"直接移送仲裁机构仲裁"}],"answer":"A","keys":["A"],"explanation":"《旅游投诉处理办法》第 23条规定：“调解不成的，应当终止调解，制作《旅游投诉终止调解书》，并以适当方式告知投诉人与被投诉人。调解不成或者达成调解协议后没有执行的，投诉人可以按照有关法律、法规的规定，向仲裁机构申请仲裁或者向人民法院提起诉讼。”调解须以双方自愿为基础，机构不得强制调解；仲裁须以仲裁协议为前提，诉讼由投诉人自行提起，旅游投诉处理机构无权直接移送。","type":"单选题"},{"number":75,"stem":"根据《安全生产法》，从业人员发现直接危及人身安全的紧急情况时，以下行为合法的是( )。","options":[{"key":"A","text":"应当继续作业，不得擅自停止"},{"key":"B","text":"应立即报告，等待指示后再行动"},{"key":"C","text":"有权停止作业或在采取应急措施后撤离"},{"key":"D","text":"应先告知主管领导，然后撤离"}],"answer":"C","keys":["C"],"explanation":"根据《安全生产法》第 55条规定，从业人员在发现直接危及人身安全的紧急情况时，有权停止作业或者在采取可能的应急措施后撤离作业场所。","type":"单选题"},{"number":76,"stem":"依据《旅行社责任保险管理办法》的规定，旅行社投保责任险后，在( )的保险期限内，如果发生投保范围内的赔偿责任，由承保的保险公司承担。","options":[{"key":"A","text":"3个月"},{"key":"B","text":"6个月"},{"key":"C","text":"1年"},{"key":"D","text":"2年"}],"answer":"C","keys":["C"],"explanation":"旅行社投保责任险后，在 1 年的保险期限内，如果发生投保范围内的赔偿责任，由承保的保险公司承担。","type":"单选题"},{"number":77,"stem":"当旅游目的地风险提示为四级时，旅行社应当( )。","options":[{"key":"A","text":"采取必要的安全防范措施"},{"key":"B","text":"加强对旅游者的提示"},{"key":"C","text":"停止组带团前往风险区域"},{"key":"D","text":"调整或者中止行程"}],"answer":"B","keys":["B"],"explanation":"风险提示发布后，旅行社应当根据风险级别采取下列措施：(1)四级风险的，加强对旅游者的提示；(2)三级风险的，采取必要的安全防范措施；(3)二级风险的，停止组团或者带团前往风险区域；已在风险区域的，调整或者中止行程；(4)一级风险的，停止组团或者带团前往风险区域，组织已在风险区域的旅游者撤离。","type":"单选题"},{"number":78,"stem":"根据《出入境管理法》的规定，外国人从事与签证不相符的活动，可以处( )。","options":[{"key":"A","text":"遣送回国"},{"key":"B","text":"限期出境"},{"key":"C","text":"限期离境"},{"key":"D","text":"驱逐出境"}],"answer":"B","keys":["B"],"explanation":"《出境入境管理法》第 81 条第 1 款规定：“外国人从事与停留居留事由不相符的活动，或者有其他违反中国法律、法规规定，不适宜在中国境内继续停留居留情形的，可以处限期出境。”因此，正确选项是 B。限期出境是对此类违法行为的法定处罚措施，给予外国人一定期限主动离境。","type":"单选题"},{"number":79,"stem":"《旅馆业治安管理办法》规定，旅馆对旅客遗留的物品，应当妥为保管，设法归还原主或揭示招领，经招领( )后无人认领的，登记造册，送当地公安机关按拾遗物品处理。","options":[{"key":"A","text":"1个月"},{"key":"B","text":"3个月"},{"key":"C","text":"6个月"},{"key":"D","text":"12个月"}],"answer":"B","keys":["B"],"explanation":"《旅馆业治安管理办法》第 8 条规定，旅馆对旅客遗留的物品，应当妥为保管，设法归还原主或揭示招领；经招领 3 个月后无人认领的，要登记造册，送当地公安机关按拾遗物品处理，对违禁物品和可疑物品，应当及时报告公安机关处理。","type":"单选题"},{"number":80,"stem":"依据《娱乐场所管理条例》，娱乐场所营业时间为每日上午 8 点到( )。","options":[{"key":"A","text":"次日凌晨零点"},
