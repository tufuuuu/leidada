、政府官员还是普通旅客，不分男女、国籍和等级，均须接受安全检查；安全检查通常采用通过安全门使用磁性探测检查、红外线透视、搜身、开箱检查等方式对旅游者进行检查；携带贵重物品、植入心脏起搏器或身患残疾等情况的旅客可要求在非公开场所进行安检；旅客若逃避安全检查，或有殴打辱骂民航安检员以及其他妨碍民航安检工作正常开展、扰乱民航安检工作现场秩序的行为，也将移交公安机关处理。","type":"单选题"},{"number":122,"stem":"短期多次往返港澳的旅客，携带免税制品的表述正确的是（）。","options":[{"key":"A","text":"不准免税带进酒"},{"key":"B","text":"雪茄 50 支"},{"key":"C","text":"烟丝 500克"},{"key":"D","text":"香烟 200支"}],"answer":"A","keys":["A"],"explanation":"短期多次往返港澳旅客（当天或短期内多次往返）；香烟 40支或雪茄 5支或烟丝 40克；不准免税带进酒。","type":"单选题"},{"number":123,"stem":"关于国航普通托运行李单件重量与尺寸的限制，下列表述正确的是（）。","options":[{"key":"A","text":"行李重不小于 1 千克"},{"key":"B","text":"行李重不超 30千克"},{"key":"C","text":"三边之和不小于 60厘米，含滑轮/把手"},{"key":"D","text":"三边之和不超 200厘米，含滑轮/把手"}],"answer":"C","keys":["C"],"explanation":"单件标准：每件普通托运行李重不小于 2 千克、不超 32 千克，三边之和不小于 60厘米、不超 203厘米，含滑轮/把手，超出则不可托运。","type":"单选题"},{"number":124,"stem":"旅客购买了 200元的动车票，在开车前 3 小时办理退票，需要支付的退票费为（）。","options":[{"key":"A","text":"10元"},{"key":"B","text":"20元"},{"key":"C","text":"40元"},{"key":"D","text":"100元"}],"answer":"C","keys":["C"],"explanation":"开车前 8 天（含 8 天）以上退票的，不收退票费；开车前 48 小时以上的，按票价5%计；开车前 24-48小时的，按票价 10%计；不足 24小时的按票价 20%计。","type":"单选题"},{"number":125,"stem":"车次前冠有 K 字母的列车是（）。","options":[{"key":"A","text":"快速旅客列车"},{"key":"B","text":"高速铁路列车"},{"key":"C","text":"城际铁路列车"},{"key":"D","text":"直达铁路列车"}],"answer":"A","keys":["A"],"explanation":"K 字头 快速旅客列车。","type":"单选题"},{"number":126,"stem":"发现火情后，导游首先（）。","options":[{"key":"A","text":"拨打 119报警"},{"key":"B","text":"组织旅游者撤离"},{"key":"C","text":"引导游客自救"},{"key":"D","text":"通知饭店前台"}],"answer":"A","keys":["A"],"explanation":"发现火情后，导游应迅速拨打 119 报警，同时简明扼要地将情况上报旅行社。","type":"单选题"},{"number":127,"stem":"世界主要城市中，与北京处于同一时区的是（）。","options":[{"key":"A","text":"开罗"},{"key":"B","text":"马尼拉"},{"key":"C","text":"纽约"},{"key":"D","text":"悉尼"}],"answer":"B","keys":["B"],"explanation":"开罗比北京晚 6 个小时，马尼拉与中国在同一个时区，纽约比中国晚 13个小时，悉尼比中国早 2 个小时。","type":"单选题"},{"number":128,"stem":"今天的气温是 0 摄氏度，相当于（）华氏度。","options":[{"key":"A","text":"32华氏度"},{"key":"B","text":"100华氏度"},{"key":"C","text":"210华氏度"},{"key":"D","text":"60华氏度"}],"answer":"A","keys":["A"],"explanation":"华氏度 = 摄氏度 × 9÷5 + 32，根据公式，0 摄氏度为 32华氏度。","type":"单选题"},{"number":129,"stem":"下列长度换算公式，正确的是（）。","options":[{"key":"A","text":"1千米=1.853海里"},{"key":"B","text":"1米=3 尺"},{"key":"C","text":"1英尺=1.094尺"},{"key":"D","text":"1尺=2.734 码"}],"answer":"B","keys":["B"],"explanation":"1 海里=1.853千米；1尺=1.094英尺；1码=2.734尺。","type":"单选题"},{"number":130,"stem":"下列选项中，关于旅游保险报案与索赔的描述，错误的是（）。","options":[{"key":"A","text":"游客意外事故发生后，应迅速向保险公司报案"},{"key":"B","text":"游客若需转回本地医院治疗，让救治医院出具书面转院报告即可"},{"key":"C","text":"在导游协助下收集医院诊断证明、化验单据"},{"key":"D","text":"妥善保存相关单据，以备处理赔偿所用"}],"answer":"B","keys":["B"],"explanation":"1. 及时报案：游客意外事故发生后，应迅速向保险公司报案。2. 收集并保存证据：可在导游协助下收集医院诊断证明、化验单据、意外事故证明等证据，并妥善保存。3. 转院需保险公司同意：游客意外住院后，若需转回本地医院治疗，要事先取得保险公司同意，并让救治医院出具书面转院报告。三、多选题","type":"单选题"},{"number":131,"stem":"《宪法》规定，任何公民，非经（），不受逮捕。","options":[{"key":"A","text":"人民检察院批准，并由公安机关执行"},{"key":"B","text":"人民检察院决定，并由公安机关执行"},{"key":"C","text":"人民法院决定，并由公安机关执行"},{"key":"D","text":"人民法院批准，并由公安机关执行"},{"key":"E","text":"监察机关批准，并由公安机关执行"}],"answer":"ABC","keys":["A","B","C"],"explanation":"任何公民，非经人民检察院批准或者决定或者人民法院决定，并由公安机关执行，不受逮捕。","type":"多选题"},{"number":132,"stem":"根据《中华人民共和国宪法》的规定，下列自然资源中只能归国家所有的有（）。","options":[{"key":"A","text":"矿藏"},{"key":"B","text":"水流"},{"key":"C","text":"森林"},{"key":"D","text":"荒地"},{"key":"E","text":"滩涂"}],"answer":"AB","keys":["A","B"],"explanation":"矿藏、水流、森林、山岭、草原、荒地、滩涂等自然资源，属于国家所有（即全民所有）；法律规定属于集体所有的森林和山岭、草原、荒地、滩涂除外（第 9 条）。矿藏、水流只能归国家所有。C项错误，法律规定属于集体所有的森林除外，森林并非只能归国家所有；D 项错误，法律规定属于集体所有的荒地除外；E 项错误，法律规定属于集体所有的滩涂除外。矿藏、水流只能归国家所有。","type":"多选题"},{"number":133,"stem":"《旅游法》规定，县级以上人民政府旅游主管部门有权对下列事项中的（）实施监督检查。","options":[{"key":"A","text":"经营旅行社业务以及从事导游、领队服务是否取得经营、执业许可"},{"key":"B","text":"景区是否超出承载量接待旅游者"},{"key":"C","text":"导游和领队等旅游从业人员的服务行为"},{"key":"D","text":"旅行社的经营行为"},{"key":"E","text":"法律法规、行业组织规定的其他事项"}],"answer":"ACD","keys":["A","C","D"],"explanation":"《旅游法》第 85条规定，县级以上人民政府旅游主管部门有权对下列事项实施监督检查：（1）经营旅行社业务以及从事导游、领队服务是否取得经营、执业许可；（2）旅行社的经营行为；（3）导游和领队等旅游从业人员的服务行为；（4）法律、法规规定的其他事项。","type":"多选题"},{"number":134,"stem":"《旅游法》规定，旅游者购买、接受旅游服务时，应当履行的义务包括（）。","options":[{"key":"A","text":"如实告知与旅游活动相关的个人健康信息"},{"key":"B","text":"不得损害当地居民的合法权益"},{"key":"C","text":"遵守旅游活动中的安全警示规定"},{"key":"D","text":"保障旅游经营者和旅游从业人员的合法权益"},{"key":"E","text":"文明旅游"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"《旅游法》第 15条规定，旅游者购买、接受旅游服务时，应当向旅游经营者如实告知与旅游活动相关的个人健康信息，遵守旅游活动中的安全警示规定。“保障旅游经营者和旅游从业人员的合法权益”错误，《旅游法》规定不得损害旅游经营者和旅游从业人员的合法权益，而不是“保障”。","type":"多选题"},{"number":135,"stem":"下列属于无效的民事法律行为的是（）。","options":[{"key":"A","text":"违背公序良俗的民事法律行为"},{"key":"B","text":"违反法律的强制性规定的民事法律行为"},{"key":"C","text":"违反行政法规的强制性规定的民事法律行为"},{"key":"D","text":"行为人与相对人恶意串通，损害他人合法权益的民事法律行为"},{"key":"E","text":"因第三人胁迫，当事人在违背真实意思的情况下实施的民事法律行为"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"“因第三人胁迫……”属于可撤销民事法律行为。《民法典》第 148条，一方以欺诈手段，使对方在违背真实意思的情况下实施的民事法律行为，受欺诈方有权请求人民法院或者仲裁机构予以撤销。","type":"多选题"},{"number":136,"stem":"根据《民法典》的规定，以下关于机动车交通事故责任的说法中，正确的是（）。","options":[{"key":"A","text":"非营运机动车发生交通事故造成无偿搭乘人损害，属于该机动车一方责任的，应当免除其赔偿责任"},{"key":"B","text":"因租赁机动车发生交通事故造成损害，属于该机动车一方责任的，由机动车使用人承担赔偿责任"},{"key":"C","text":"盗窃、抢劫的机动车发生交通事故造成损害的，由保险公司在机动车强制保险责任限额范围内先行赔偿，有权向机动车所有人追偿"},{"key":"D","text":"机动车驾驶人发生交通事故后逃逸，该机动车参加强制保险的，由保险公司在机动车强制保险责任限额范围内予以赔偿"},{"key":"E","text":"机动车不明，需要支付被侵权人人身伤亡的抢救、丧葬等费用的，由道路交通事故社会救助基金支付"}],"answer":"BD","keys":["B","D"],"explanation":"《民法典》第 1217条，非营运机动车发生交通事故造成无偿搭乘人损害，属于该机动车一方责任的，应当减轻其赔偿责任；选项错在“免除”。盗窃、抢劫或者抢夺的机动车发生交通事故造成损害的，由盗窃人、抢劫人或者抢夺人承担赔偿责任；选项错在“机动车所有人”。机动车不明、该机动车未参加强制保险或者抢救费用超过机动车强制保险责任限额，需要支付被侵权人人身伤亡的抢救、丧葬等费用的，由道路交通事故社会救助基金垫付。选项错在“支付”。","type":"多选题"},{"number":137,"stem":"甲旅行社导游张某带领旅游团游览某景区时，由于人满为患，旅游者李某被行人王某撞伤。经查，张某未提醒旅游者注意行走安全。下列关于李某受伤处理的说法中，正确的有（）。","options":[{"key":"A","text":"张某应当对李某承担侵权责任"},{"key":"B","text":"张某对李某的赔偿责任由甲旅行社替代承担"},{"key":"C","text":"甲旅行社与王某对李某承担连带赔偿责任"},{"key":"D","text":"甲旅行社应当对李某承担补充赔偿责任"},{"key":"E","text":"王某应当对李某承担侵权责任"}],"answer":"BDE","keys":["B","D","E"],"explanation":"《民法典》第 1198条第 2 款规定，因第三人的行为造成他人损害的，由第三人承担侵权责任；经营者、管理者或者组织者未尽到安全保障义务的，承担相应的补充责任。如果违反安全保障义务的具体行为人是公共场所管理人或者群众性活动组织者的工作人员或者雇员，其侵权责任还是要由管理人、组织者或者雇主承担。","type":"多选题"},{"number":138,"stem":"甲旅行社未取得旅游者同意，将旅游业务委托给乙旅行社。对此，关于旅游主管部门对甲旅行社进行行政处罚的说法中，正确的是（）。","options":[{"key":"A","text":"责令改正"},{"key":"B","text":"没收违法所得"},{"key":"C","text":"处 2万元以上 10 万元以下的罚款"},{"key":"D","text":"情节严重的，责令停业整顿 1 个月至 3 个月"},{"key":"E","text":"造成严重后果的，吊销旅行社业务经营许可证"}],"answer":"AE","keys":["A","E"],"explanation":"《旅游法》第 100条规定，旅行社违反本法规定，有下列行为之一的，由旅游主管部门责令改正，处三万元以上三十万元以下罚款，并责令停业整顿；造成旅游者滞留等严重后果的，吊销旅行社业务经营许可证；对直接负责的主管人员和其他直接责任人员，处二千元以上二万元以下罚款，并暂扣或者吊销导游证：（一）在旅游行程中擅自变更旅游行程安排，严重损害旅游者权益的；（二）拒绝履行合同的；（三）未征得旅游者书面同意，委托其他旅行社履行包价旅游合同的。","type":"多选题"},{"number":139,"stem":"根据《导游管理办法》的规定，有下列（）情形之一的，所在地旅游主管部门应当撤销导游证。","options":[{"key":"A","text":"对不具备申请资格的申请人核发导游证的"},{"key":"B","text":"申请人以欺骗、贿赂等不正当手段取得导游证的"},{"key":"C","text":"导游证依法被吊销的"},{"key":"D","text":"对不符合法定条件的申请人核发导游证的"},{"key":"E","text":"导游与旅行社订立的劳动合同解除后超过三个月没有签订新的劳动合同的"}],"answer":"ABD","keys":["A","B","D"],"explanation":"有下列情形之一的，所在地旅游主管部门应当撤销导游证：对不具备申请资格或者不符合法定条件的申请人核发导游证的；申请人以欺骗、贿赂等不正当手段取得导游证的；依法可以撤销导游证的其他情形。“导游证依法被吊销的”和“导游与旅行社……”两项属于导游证被注销的情形。","type":"多选题"},{"number":140,"stem":"在旅游行业组织注册并申请导游证的人员，应当向所在地旅游行业组织提交的材料包括（）。","options":[{"key":"A","text":"身份证"},{"key":"B","text":"身体健康证明"},{"key":"C","text":"注册申请"},{"key":"D","text":"导游人员资格证"},{"key":"E","text":"本人近期照片"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"《导游管理办法》第 8条规定，在旅游行业组织注册并申请取得导游证的人员，应当向所在地旅游行业组织提交下列材料：身份证、导游人员资格证、本人近期照片和注册申请。","type":"多选题"},{"number":141,"stem":"根据《治安管理处罚法》关于责任年龄的规定，下列说法正确的有（）。","options":[{"key":"A","text":"不满 14 周岁的人违反治安管理的，不予处罚，但是应当责令其监护人严加管教"},{"key":"B","text":"已满 14 周岁不满 18 周岁的人违反治安管理的，从轻或者减轻处罚"},{"key":"C","text":"已满 14 周岁不满 16 周岁的人违反治安管理的，均不执行行政拘留处罚"},{"key":"D","text":"已满 14 周岁不满 16 周岁的人，情节较严重，应当执行行政拘留处罚"},{"key":"E","text":"不满 14 周岁的人违反治安管理的，应当给予警告处罚"}],"answer":"AB","keys":["A","B"],"explanation":"A 项正确：不满 14周岁的人违反治安管理的，不予处罚，责令监护人严加管教（第12条）。B 项正确：已满 14 周岁不满 18周岁的人违反治安管理的，从轻或者减轻处罚（第12条）。C 项错误：已满 14周岁不满 16周岁属于原则上不执行行政拘留的群体，只有情节严重、影响恶劣或者 1 年内 2 次以上违反治安管理的才可以执行（第 23条）。D 项错误：“情节较严重”错误，是“情节严重”。E项错误：不满 14周岁不予任何治安管理处罚，不适用警告。","type":"多选题"},{"number":142,"stem":"根据《旅游法》第 92条的规定，旅游者与旅游经营者发生纠纷，可以通过下列途径解决（）。","options":[{"key":"A","text":"双方协商"},{"key":"B","text":"向消费者协会、旅游投诉受理机构或者有关调解组织申请调解"},{"key":"C","text":"向旅游行政管理部门投诉"},{"key":"D","text":"根据与旅游经营者达成的仲裁协议提请仲裁机构仲裁"},{"key":"E","text":"向人民法院提起诉讼"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"《旅游法》第 92条规定：“旅游者与旅游经营者发生纠纷，可以通过下列途径解决：（一）双方协商；（二）向消费者协会、旅游投诉受理机构或者有关调解组织申请调解；（三）根据与旅游经营者达成的仲裁协议提请仲裁机构仲裁；（四）向人民法院提起诉讼。”C 项错误，向旅游行政管理部门投诉，不属于《旅游法》规定的纠纷解决途径。","type":"多选题"},{"number":143,"stem":"根据《旅游安全管理办法》，旅游突发事件根据其（），分为特别重大、重大、较大和一般四级。","options":[{"key":"A","text":"已经造成的影响"},{"key":"B","text":"诱因"},{"key":"C","text":"可控性"},{"key":"D","text":"性质"},{"key":"E","text":"危害程度"}],"answer":"CDE","keys":["C","D","E"],"explanation":"《旅游安全管理办法》第 39 条第 2款规定，旅游突发事件按照其性质、危害程度、可控性以及造成或可能造成的社会影响等因素，划分为特别重大、重大、较大和一般四个等级。诱因（B）不是分级依据，故不选。A 选项错在“已经造成”，正确说法还包括“可能造成”。","type":"多选题"},{"number":144,"stem":"根据《食品安全法》的规定，以下关于食品召回的表述正确的是（）。","options":[{"key":"A","text":"国务院食品安全监督管理部门建立食品召回制度"},{"key":"B","text":"食品生产者发现其生产的食品不符合食品安全标准的，应当立即停止生产"},{"key":"C","text":"食品生产者发现其生产的食品可能危害人体健康的，应召回已经上市销售的食品"},{"key":"D","text":"食品生产者召回食品的，应通知相关生产经营者和消费者"},{"key":"E","text":"食品生产者召回食品的，应记录召回和通知情况"}],"answer":"BDE","keys":["B","D","E"],"explanation":"《食品安全法》第 63 条，国家建立食品召回制度，故“国务院食品安全监督管理部门建立食品召回制度”错误。“食品生产者发现其生产的食品可能危害人体健康的，应召回已经上市销售的食品”错误，是有“证据证明可能危害人体健康”。","type":"多选题"},{"number":145,"stem":"深化党和国家机构改革的指导思想包括（）。","options":[{"key":"A","text":"以习近平新时代中国特色社会主义思想为指导"},{"key":"B","text":"以加强党中央集中统一领导为统领"},{"key":"C","text":"以推进国家治理体系和治理能力现代化为导向"},{"key":"D","text":"以提升部门自主权限为改革导向"},{"key":"E","text":"以激发地方自主能动性作为改革统领"}],"answer":"ABC","keys":["A","B","C"],"explanation":"答案选 ABC。深化党和国家机构改革必须以习近平新时代中国特色社会主义思想为指导，以加强党中央集中统一领导为统领，以推进国家治理体系和治理能力现代化为导向。D项机构改革坚持优化协同高效，目标是理顺权责关系，而不是以提升部门自主权限作为改革导向，防范部门本位。E项激发地方自主能动性是改革需要兼顾的重要方面，但改革的统领是加强党中央集中统一领导，并非地方自主能动性。","type":"多选题"},{"number":146,"stem":"“十五五”时期经济社会发展的主要目标包括（）。","options":[{"key":"A","text":"高质量发展取得显著成效"},{"key":"B","text":"科技自立自强水平大幅提高"},{"key":"C","text":"进一步全面深化改革取得新突破"},{"key":"D","text":"社会文明程度明显提升"},{"key":"E","text":"人民生活基本实现现代化"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"答案选 ABCD。“十五五”时期主要目标包括高质量发展取得显著成效、科技自立自强水平大幅提高、进一步全面深化改革取得新突破、社会文明程度明显提升等。E 项原文是人民生活品质不断提高，“人民生活基本实现现代化”不是十五五目标，属于 2035 远景目标相关表述。","type":"多选题"},{"number":147,"stem":"《英烈法》规定，英雄烈士纪念设施保护单位应当健全服务和管理工作规范，方便瞻仰、悼念英雄烈士，保持英雄烈士纪念设施庄严、肃穆、清净的环境和氛围。任何组织和个人（）。","options":[{"key":"A","text":"不得侵占英雄烈士纪念设施保护范围内的土地"},{"key":"B","text":"不得破坏英雄烈士纪念设施"},{"key":"C","text":"不得污损英雄烈士纪念设施"},{"key":"D","text":"不得侵占英雄烈士纪念设施保护范围内的设施"},{"key":"E","text":"不得在英雄烈士纪念设施保护范围内从事相关活动"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"“相关活动”错误，任何组织和个人不得在英雄烈士纪念设施保护范围内从事有损纪念英雄烈士环境和氛围的活动，不得侵占英雄烈士纪念设施保护范围内的土地和设施，不得破坏、污损英雄烈士纪念设施。","type":"多选题"},{"number":148,"stem":"导游服务的作用有（）。","options":[{"key":"A","text":"纽带作用"},{"key":"B","text":"标志作用"},{"key":"C","text":"销售作用"},{"key":"D","text":"反馈作用"},{"key":"E","text":"扩散作用"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"导游服务的作用：纽带作用；标志作用；反馈作用；扩散作用。","type":"多选题"},{"number":149,"stem":"在日常交往中，导游通常遵循的原则有（）。","options":[{"key":"A","text":"平等原则"},{"key":"B","text":"诚信原则"},{"key":"C","text":"宽容原则"},{"key":"D","text":"互惠原则"},{"key":"E","text":"默认原则"}],"answer":"ABC","keys":["A","B","C"],"explanation":"导游通常遵循以下原则：平等原则；互尊原则；诚信原则；宽容原则；适度原则；随俗原则。","type":"多选题"},{"number":150,"stem":"地陪导游的送行服务内容有（）。","options":[{"key":"A","text":"致欢送词"},{"key":"B","text":"及时归还证件"},{"key":"C","text":"提前到达机场（车站、码头）"},{"key":"D","text":"协助办理离站手续"},{"key":"E","text":"安排好结算事宜"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"送行服务：致欢送词；提前到达机场（车站、码头）；提醒注意事项；协助办理离站手续；送别旅游者；安排好结算事宜。","type":"多选题"},{"number":151,"stem":"地陪导游向游客介绍特色旅游商品时，应该（）。","options":[{"key":"A","text":"向旅游团清晰说明购物场所的停留时间以及购物过程中的注意事项"},{"key":"B","text":"介绍本地商品的特色及选购方法，突出商品实用性、收藏性、装饰性"},{"key":"C","text":"引导其观察、引导其选购，帮助决定是否购买，充分发挥旅游购物参谋的作用"},{"key":"D","text":"入境旅游者购买中药或中药制成品时，应推荐其信誉良好的大型药店"},{"key":"E","text":"若商店以次充好地陪应及时向商店负责人反映问题，维护旅游者权益"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"在旅游者购物过程中，地陪应向旅游团清晰说明购物场所的停留时间以及购物过程中的相关注意事项，并详细介绍本地商品的特色及选购方法，重点突出商品的实用性、收藏性、装饰性、纪念性等特点，为旅游者提供客观、真实的购物参考，引导其自主观察、自由选购，自行决定是否购买，充分发挥旅游购物参谋的作用；当入境旅游者购买特殊商品（如中药或中药制成品）时，应推荐其前往质量可靠、信誉良好的大型药店，并明确告知我国海关关于药品携带出境的限额规定若发现商店存在不按质论价、以次充好、销售伪劣商品或未提供标准服务等行为，地陪应及时向商店负责人反映问题，以维护旅游者权益。","type":"多选题"},{"number":152,"stem":"接待入境旅游者的全陪导游，应该向游客说明的内容包括（）。","options":[{"key":"A","text":"介绍旅游行程的主要内容、中国概况"},{"key":"B","text":"说明外币兑换手续，并提示相关注意事项"},{"key":"C","text":"关于宗教活动应当在宗教活动场所进行等相关法律法规规定"},{"key":"D","text":"说明中国海关的有关规定，介绍办理出境手续的程序"},{"key":"E","text":"可以购买我国的中药材，如麝香、虎骨等特色产品"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"1. 介绍旅游行程的主要内容、中国概况，说明外币兑换手续，并提示相关注意事项，包括中国关于宗教活动应当在宗教活动场所进行等相关法律法规规定、旅游行程安全、文明旅游、风俗习惯、购物退税等。2. 说明中国海关的有关规定，介绍办理出境手续的程序，包括行李托运的要求等，必要时可协助旅游者办理离境通关手续。麝香、蟾酥、虎骨、犀牛角、牛黄等不准出境。","type":"多选题"},{"number":153,"stem":"领队引领游客乘坐公共交通工具时，应该（）。","options":[{"key":"A","text":"将文明旅游的规范要求向游客进行说明和提醒"},{"key":"B","text":"应提醒游客遵守和配合乘务人员指示，保障交通工具安全有序运行"},{"key":"C","text":"应提醒游客乘坐交通工具的安全规范和基本礼仪，遵守秩序，尊重他人"},{"key":"D","text":"不长时间占用通道或卫生间，不强行更换座位"},{"key":"E","text":"避免不文雅的举止，但是可以频繁索要免费餐饮"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"将文明旅游的规范要求向游客进行说明和提醒；应提醒游客遵守和配合乘务人员指示，保障交通工具安全有序运行；应提醒游客乘坐交通工具的安全规范和基本礼仪，遵守秩序，尊重他人；不长时间占用通道或卫生间，不强行更换座位。避免不文雅的举止，不无限制索要免费餐饮等。","type":"多选题"},{"number":154,"stem":"导游在带团过程中，要提醒旅游者（），从而预防火灾事故发生。","options":[{"key":"A","text":"不在密闭空间内抽烟，不乱扔烟头"},{"key":"B","text":"不携带易燃、易爆物品"},{"key":"C","text":"不在房间内玩火"},{"key":"D","text":"认真观察所在楼层的安全通道位置及安全转移路线"},{"key":"E","text":"正确佩戴防火面罩"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"导游应提醒旅游者：不在密闭空间内抽烟，不乱扔烟头；不携带易燃、易爆物品；不在房间内玩火等。导游需向旅游者说明熟悉酒店安全通道位置的重要性，并提醒大家进入客房后，认真观察所在楼层的安全通道位置及安全转移路线。","type":"多选题"},{"number":155,"stem":"提升导游的交谈技巧，可以从（）方面努力。","options":[{"key":"A","text":"开头宜寒暄"},{"key":"B","text":"宜多多分享"},{"key":"C","text":"内容宜健康"},{"key":"D","text":"说话宜真诚"},{"key":"E","text":"宜把握谈话过程"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"开头宜寒暄；说话宜真诚；内容宜健康；宜多听少说；宜把握谈话过程。","type":"多选题"},{"number":156,"stem":"导游接待政务团时，应该做好的工作有（）。","options":[{"key":"A","text":"导游的仪容仪表应端庄得体"},{"key":"B","text":"导游在重要政务接待中应严格按要求执行，每个环节都符合政务接待标准"},{"key":"C","text":"政务团的讲解要求“多”“细”。"},{"key":"D","text":"导游应遵循“三不说”原则：不多说、不错说、不乱说"},{"key":"E","text":"需严格执行保密纪律，遵守保密规定"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"导游的仪容仪表应端庄得体；导游在重要政务接待中应严格按要求执行，确保每个环节都符合政务接待标准；讲解是政务接待中导游的主要任务。政务团的讲解要求“精”“要”；导游应遵循“三不说”原则：不多说、不错说、不乱说；参与政务接待时，需严格执行保密纪律，遵守保密规定。","type":"多选题"},{"number":157,"stem":"旅游行程中游客要求更换或者增加旅游项目，导游操作正确的是（）。","options":[{"key":"A","text":"计划内的游览项目，一般应该不折不扣地按计划进行"},{"key":"B","text":"全团统一提出更换时，请示接待社计调部门，计调同意即可更换"},{"key":"C","text":"个别游客提出更换，导游尽力配合协助更换"},{"key":"D","text":"若要求增加游览项目，时间允许时，请示接待社并积极协助"},{"key":"E","text":"若要求增加游览项目，协调好相关事宜，陪同前往，做好游览项目的讲解"}],"answer":"ADE","keys":["A","D","E"],"explanation":"（一）旅游者要求更换或取消计划内的游览项目：凡是计划内的游览项目，一般应该不折不扣地按计划进行。全团统一提出时：请示接待社计调部门，请其与组团社联系，组团社同意后方可更换或取消。个别游客提出时：向游客耐心解释，不能随意更换。（二）旅游者要求增加游览项目：时间允许时：请示接待社并积极协助，与接待社有关部门联系请其报价，将对外报价报给旅游者。旅游者认可报价时：协调处理好增加的游览费用事宜，并陪同前往，做好增加游览项目的讲解等工作。","type":"多选题"},{"number":158,"stem":"地陪导游在接机（车、船）前应做好的准备工作包括（）。","options":[{"key":"A","text":"熟悉旅游接待计划安排"},{"key":"B","text":"核实接机（车、船）的准确信息"},{"key":"C","text":"准时到达迎接地点"},{"key":"D","text":"保持通信联系畅通"},{"key":"E","text":"必要时携带备用手机，防止突发故障无法及时与旅行社、旅游者取得联系"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"1. 熟悉旅游接待计划安排，导游领取计划书后，应迅速了解旅游者抵达的班（轮）次、出发及抵达时间、准确的到达地点等信息。对于飞机航班，还可借助手机软件关注航班动态；2. 核实接机（车、船）的准确信息，导游应在旅游者出发当天，在其航班或列车、班轮出发前，再次与旅游者核实班（轮）次、抵达的具体机场（车站、码头）、抵达时间、人数等信息，确保无误；3. 提前到达迎接地点，导游应提前与司机商定出发时间，无论是一同出发还是各自抵达迎接点，均需预留充足的交通时间，并提前半小时到达；4. 保持通信联系畅通，导游应确保手机开机，流量与话费充足，以满足与旅游者的基本联系需求。必要时可携带备用手机，以防手机突发故障或丢失而无法及时与旅行社、旅游者取得联系。","type":"多选题"},{"number":159,"stem":"为了避免游客丢失物品，导游应该采取以下措施：（）。","options":[{"key":"A","text":"在旅游参观各环节，导游提醒旅游者检查随身物品"},{"key":"B","text":"离店、下车时提醒带好物件，在人多场所注意保管贵重物品"},{"key":"C","text":"提供行李服务时，每次清点行李件数"},{"key":"D","text":"旅游者证件由全陪或领队统一保管"},{"key":"E","text":"司机离开且车上无人时，导游提醒其锁好车窗门"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"1. 多做提醒工作：在旅游参观各环节，导游提醒旅游者检查随身物品。离店、下车时提醒带好物件，在人多场所注意保管贵重物品；2. 做好证件与行李的清点交接：提供行李服务时，每次清点行李件数。旅游活动中，需用旅游者证件时，由全陪或领队统一收取，用毕立即如数归还并当面清点；3. 提醒司机及时锁好车门车窗：旅游客车是旅游者的“移动的家”，一些随身物件常放车上。司机离开且车上无人时，导游提醒其锁好车窗门。","type":"多选题"},{"number":160,"stem":"为了尽量避免发生旅游行程变更，导游应该（）。","options":[{"key":"A","text":"地陪在接触旅游者时第一时间与其核对行程，确保信息一致"},{"key":"B","text":"存在极端天气可能时，导游要自己调整行程，但整体行程不做变更"},{"key":"C","text":"在接团前查询团队旅游期间沿途的大致天气情况"},{"key":"D","text":"地陪按照计划书提前与供应商进行确认，保障各项预订安排准确无误"},{"key":"E","text":"若道路拥堵严重，重新规划出行线路，避开堵车"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"地陪在接触旅游者时第一时间与其核对行程，确保信息一致；存在极端天气可能时，提早关注、提前预防，经旅游者同意后微调参观顺序避开天气影响，但整体行程不做变更；在接团前查询团队旅游期间沿途的大致天气情况；地陪按照计划书提前与供应商进行确认，保障各项预订安排准确无误；若道路拥堵严重，重新规划出行线路，避开堵车。","type":"多选题"},{"number":161,"stem":"为了避免发生交通事故，导游应该（）。","options":[{"key":"A","text":"督促旅游汽车承运人严格执行车辆出车检查制度"},{"key":"B","text":"旅游汽车驾驶员应具备相关资质，做到不超载、超速、疲劳驾驶"},{"key":"C","text":"对于连续驾驶超过 3 小时或超过 300公里，应停下来休息 20分钟"},{"key":"D","text":"旅游汽车首排正座应设置导游专座，以保障导游的人身安全"},{"key":"E","text":"每车应配备一部“游客安全乘车温馨提示”宣传片"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"（1）旅游营运车辆应符合《旅游客车设施与服务规范》（GB/T26359）的要求，具备旅游包车营运资质，安全检验合格，并满足旅游行程运输需求。（2）督促旅游汽车承运人严格执行车辆出车检查制度，落实旅游车辆班组日检、部门周检、公司月检。检查时应使用安全检查表并签名，对发现的问题立即处理；无法立即处理的，应及时报告；如严重或多次违反采购协议安全条款，应及时停用。（3）旅游汽车驾驶员应具备相关资质，确保行车安全，做到不超载、超速、疲劳驾驶、酒后驾车，且出发前不使用影响驾驶安全的违禁药物。对于连续驾驶超过 4小时或连续行程超过 400公里的旅游线路，旅行社应安排驾驶员中途休息或增配一名驾驶员。（4）旅游汽车首排正座应设置导游/领队专座，以保障导游领队的人身安全。（5）每车应配备一部“游客安全乘车温馨提示”宣传片，每座配置一份《游客乘车安全须知》。","type":"多选题"},{"number":162,"stem":"为防止溺水事故发生，导游应提醒旅游者做到“五不玩水”，具体包括（）。","options":[{"key":"A","text":"不在身体不舒服时玩水"},{"key":"B","text":"不在饥饿或过饱时玩水"},{"key":"C","text":"不独自一人玩水"},{"key":"D","text":"不去情况不明或禁止的水域玩水"},{"key":"E","text":"不遇强跳水或潜水"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"本题说法全部正确。五不玩水：不在身体不舒服时玩水，不在饥饿或过饱时玩水，不独自一人玩水，不去情况不明或禁止的水域玩水，不逞强跳水或潜水。","type":"多选题"},{"number":163,"stem":"若在野外活动时遭遇雷电，导游应该（）。","options":[{"key":"A","text":"带领游客迅速回到旅游客车躲避"},{"key":"B","text":"劝告大家尽量避免使用手机，以免增加吸引雷电的风险"},{"key":"C","text":"打开汽车门窗，保持内部通风状态"},{"key":"D","text":"不宜选择孤立小屋、大树下、电线杆旁及高坡避雨"},{"key":"E","text":"如果多人在一起，彼此之间尽可能靠在一起"}],"answer":"ABD","keys":["A","B","D"],"explanation":"带领游客迅速回到旅游客车躲避；劝告大家尽量避免使用手机，以免增加吸引雷电的风险；不宜选择孤立小屋、大树下、电线杆旁及高坡避雨；务必关好汽车门窗，保持内部封闭状态，防止雷电通过车体或空气传播袭击车内人员；如果多人在一起，彼此之间应保持数米的距离，降低群体雷击风险。","type":"多选题"},{"number":164,"stem":"下列物品中，属于列车上禁止随身携带但可以托运的有（）。","options":[{"key":"A","text":"管制器具"},{"key":"B","text":"菜刀"},{"key":"C","text":"复合弓等非机械弓箭类器材"},{"key":"D","text":"消防灭火枪"},{"key":"E","text":"手提包"}],"answer":"BCD","keys":["B","C","D"],"explanation":"（1）禁止托运与携带；枪支、子弹类（含主要零部件），爆炸物品类，管制器具，易燃易爆物品，毒害品，腐蚀性物品，放射性物品，感染性物质，其他危害列车运行安全的物品，法律、行政法规、规章规定的其他禁止携带、运输的物品。（2）禁止随身携带但可托运：菜刀/水果刀/剪刀/美工刀/雕刻刀/裁纸刀等，反曲弓/复合弓等非机械弓箭类器材，消防灭火枪。","type":"多选题"},{"number":165,"stem":"关于沙漠旅游，导游告知游客的内容包括（）。","options":[{"key":"A","text":"携带高能量、耐储存食品"},{"key":"B","text":"穿着透气厚重的长袖长裤，避免晒伤"},{"key":"C","text":"带好防沙面罩、护目镜"},{"key":"D","text":"可单独行动，但是要保持与团队联系"},{"key":"E","text":"专业沙漠徒步鞋"}],"answer":"ACE","keys":["A","C","E"],"explanation":"携带高能量、耐储存食品；透气轻便长袖长裤（减少皮肤暴露）；带好防沙面罩、护目镜；旅游者不可单独行动，保持团队联系和互相照顾；专业沙漠徒步鞋。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD六/LDD押题第6卷（科目一二）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD六/LDD押题第6卷（科目一二）-试卷.pdf"},{"name":"科目三四","questions":[{"number":1,"stem":"生态旅游的核心特征是通过传感器网络实时采集景区环境、客流等数据。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，通过传感器网络实时采集景区环境、客流等数据是智慧旅游的特征，不是生态旅游的核心特征。生态旅游是指以可持续发展为理念，以保护生态环境为前提，以统筹人与自然和谐为准则，并依托良好的自然生态环境和独特的人文生态系统，采取生态友好方式开展的生态体验、生态教育、生态认知并获得身心愉悦的旅游方式。","type":"判断题"},{"number":2,"stem":"丹霞地貌因为在福建武夷山的丹霞山发现而被命名。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，丹霞地貌是在广东仁化县的丹霞山发现而被命名的（不是福建武夷山）。丹霞地貌：由中国学者于 1928年在广东丹霞山正式命名，是唯一以我国地名命名、被国际地貌学会专门设立工作组独立研究的地貌类型。","type":"判断题"},{"number":3,"stem":"江苏古琴艺术在中国具有突出地位，先后形成常熟虞山琴派、扬州广陵琴派、南京金陵琴派等重要的地方性音乐流派。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。江苏古琴艺术在中国具有突出地位，先后形成常熟虞山琴派、扬州广陵琴派、南京金陵琴派等重要的地方性音乐流派。","type":"判断题"},{"number":4,"stem":"仰韶文化居民种植水稻，使用黑陶，修建干栏式建筑。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，种植粟、使用彩陶、修建半地穴式建筑的是仰韶文化（河姆渡文化种植水稻、使用黑陶、修建干栏式建筑）。代表性文化有北方黄河流域的仰韶文化和南方长江流域的河姆渡文化，距今 7000~5000 年。","type":"判断题"},{"number":5,"stem":"鱼尾狮坐落于新加坡河畔，高 8 米，是新加坡的标志。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。鱼尾狮坐落于新加坡河畔，高 8 米，是新加坡的标志。","type":"判断题"},{"number":6,"stem":"相传春秋战国时期，上海曾经是楚国春申君黄歇的封邑，故上海别称为“申”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。上海，简称“沪”，别称“虫”。相传春秋战国时期，上海曾经是楚国春申君黄歇的封邑，故上海别称为“虫”。","type":"判断题"},{"number":7,"stem":"山西因居太行山之东而得名，又因地处黄河之西，古称河东。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“居太行山之西”“地处黄河之东，古称河东”。山西因居太行山之西而得名，又因地处黄河之东，古称河东。简称“晋”，春秋战国之交，韩、赵、魏三分晋国，又称“三晋”。","type":"判断题"},{"number":8,"stem":"南朝祖冲之在世界上首次将圆周率精确到小数点后第 7 位。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。南朝祖冲之在世界上首次将圆周率精确到小数点后第 7 位，其子祖曜提出了计算球体体积的祖曜原理。26 版教材改动说明：“祖曜”更正为“祖曜”。","type":"判断题"},{"number":9,"stem":"新加坡是继纽约、伦敦、日本东京之后的第四大国际金融中心。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，新加坡是继纽约、伦敦、中国香港之后的第四大国际金融中心（不是日本东京之后），也是亚洲重要的航运和服务中心。","type":"判断题"},{"number":10,"stem":"1891年，重庆成为中国最早对外开放的内陆通商口岸之一。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1891年，重庆成为中国最早对外开放的内陆通商口岸之一。","type":"判断题"},{"number":11,"stem":"后母戊鼎是迄今世界上发现的最大的青铜器，其重达 832.84 公斤。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。商朝代表性器物是高达 133厘米、重达 832.84 公斤的后母戊鼎，是迄今世界上发现的最大的青铜器。","type":"判断题"},{"number":12,"stem":"联合国旅游组织（UN Tourism）是联合国系统的政府间国际组织，总部设在法国巴黎。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，联合国旅游组织总部设在西班牙马德里（不是法国巴黎）。联合国旅游组织（UN Tourism）是联合国系统的政府间国际组织，总部位于西班牙马德里。26 版教材改动说明：“世界旅游组织（UNWTO）”改为“联合国旅游组织”，补充 2024年更名、世界旅游日、新视觉标识和口号；会员口径更新为 160个正式会员国、6 个准成员、2 个观察员。","type":"判断题"},{"number":13,"stem":"贵州全省建成公路桥梁超 2.8万座，被称为“世界桥梁博物馆”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。贵州全省建成公路桥梁超 2.8万座，被称为“世界桥梁博物馆”。","type":"判断题"},{"number":14,"stem":"一二·九运动标志着中国人民抗日救亡民主运动新高潮的到来。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。二·九运动揭露了日本吞并华北进而独占中国的阴谋，打击了国民党的妥协退让政策，极大地促进了中华民族的觉醒，标志着中国人民抗日救亡民主运动新高潮的到来。","type":"判断题"},{"number":15,"stem":"大本钟是法国巴黎的标志性建筑。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，大本钟是英国伦敦（不是法国巴黎）的标志性建筑之一。主要景点有白金汉宫、唐宁街 10 号、议会大厦、大英博物馆、圣保罗教堂、威斯敏斯特教堂、伦敦塔、伦敦塔桥、大本钟、温莎城堡、格林尼治天文台、中国城、海德公园等。","type":"判断题"},{"number":16,"stem":"富士山海拔 3776米，是日本最高峰，被尊称为“圣岳”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。富士山是日本的最高峰，海拔 3776 米，被日本人尊称为“圣岳”，是世界著名火山及风景游览区，成为日本的象征。","type":"判断题"},{"number":17,"stem":"党的七大以“团结的大会、胜利的大会”载入史册。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。七大以“团结的大会、胜利的大会”载入史册。党的七大于 1945 年4月 23日至 6 月 11日在延安举行，确定“以马克思列宁主义的理论与中国革命的实践之统一的思 想——毛泽东思想，作为自己一切工作的指针”。","type":"判断题"},{"number":18,"stem":"刘志丹、谢子长、习仲勋、吴岱峰等在陕甘交界地区创建了西北地区第一个革命根据地——陕甘边革命根据地。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"解析本题说法正确。刘志丹、谢子长、习仲勋、吴岱峰等在陕甘交界地区创建了西北地区第一个革命根据地——陕甘边革命根据地。","type":"判断题"},{"number":19,"stem":"《九章算术》标志着我国古典数学体系基本形成，其成书年代是西汉。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"解析本题说法错误，《九章算术》成书于东汉（不是西汉）。东汉时期的《九章算术》，提出了负数概念及正负数运算法则，标志着我国古代数学体系基本形成。","type":"判断题"},{"number":20,"stem":"吉林省查干湖多年来形成了独具渔猎特色的查干湖文化，查干湖冬捕已传承数千年。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":21,"stem":"我国探月工程命名为“嫦娥工程”，于 2004年启动。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2004年我国启动探月工程，命名为“嫦娥工程”。已实现多次月球探测，其中嫦娥五号带回月壤 1731 克，嫦娥六号带回人类首份月背样品 1935.3 克。","type":"判断题"},{"number":22,"stem":"辽宁是我国东北老工业基地核心省份，是全国重要的装备制造、石化冶金、船舶海工产业基地。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。辽宁省是我国东北老工业基地核心省份，是全国重要的装备制造、石化冶金、船舶海工产业基地。","type":"判断题"},{"number":23,"stem":"按照题材划分，中国画可分为人物画、山水画和花鸟画等类型。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。如果按照题材划分，中国画可分为人物画、山水画和花鸟画等类型，有工笔、写意、水墨、勾勒等多种技法，注重神似不重形似，大多数作品用笔、墨、纸、砚绘制而成，加上题诗和装裱，构成充满诗情画意的精美艺术品。","type":"判断题"},{"number":24,"stem":"北京从辽代到清末建造了许多宏伟的宫廷建筑，是我国拥有帝王宫殿、庙坛和陵墓数量最多、内容最丰富的城市。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。北京有 870年的建都史，从辽代到清末，北京建造了许多宏伟的宫廷建筑，是我国拥有帝王宫殿、庙坛和陵墓数量最多、内容最丰富的城市。","type":"判断题"},{"number":25,"stem":"作为中国南北气候分界线的秦岭山脉横贯陕西全省东西。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。作为中国南北气候分界线的秦岭山脉横贯全省东西。","type":"判断题"},{"number":26,"stem":"安徽清康熙六年（1667年）设安徽布政使司，取辖区内“安庆”“六安”两地首字，正式定名为“安徽”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“取“安庆”“徽州”两地首字”。清康熙六年（1667年）设安徽布政使司，取辖区内“安庆”“徽州”两地首字，正式定名为“安徽”。","type":"判断题"},{"number":27,"stem":"1970年 7 月成昆铁路竣工运营，基本改写了蜀道难的历史。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1970年 7 月成昆铁路竣工运营，基本改写了蜀道难的历史。","type":"判断题"},{"number":28,"stem":"1624 年荷兰殖民者侵占台湾南部，1626年西班牙殖民者入侵台湾北部，1642 年荷兰取代西班牙占领台湾北部。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1624年荷兰殖民者侵占台湾南部，1626年西班牙殖民者入侵台湾北部，1642年荷兰取代西班牙占领台湾北部。","type":"判断题"},{"number":29,"stem":"被誉为“天下第一行书”的书法作品是《祭侄文稿》。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，被誉为“天下第一行书”的是王羲之的《兰亭集序》（不是《祭侄文稿》）。行书以东晋王羲之成就最高，人称“书圣”，代表作《兰亭集序》被誉为“天下第一行书”。","type":"判断题"},{"number":30,"stem":"德天瀑布是我国水流量最大的瀑布。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，我国水流量最大的瀑布是壶口瀑布（不是德天瀑布）。德天瀑布是亚洲第一大跨国瀑布。","type":"判断题"},{"number":31,"stem":"北宋时，平民毕昇发明活字印刷术，使用胶泥制作单字，再排版印刷。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。北宋时，平民毕昇发明活字印刷术，使用胶泥制作单字，再排版印刷，效率大幅提升。","type":"判断题"},{"number":32,"stem":"在法国，接受礼物要当面打开，否则是无礼的表现。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。接受礼物时要当面打开，否则是无礼的表现。","type":"判断题"},{"number":33,"stem":"西藏还是国际河流分布最多的中国省区，亚洲著名的恒河、印度河、布拉马普特拉河、湄公河等河流的上源都在这里。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。西藏还是国际河流分布最多的中国省区，亚洲著名的恒河、印度河、布拉马普特拉河、湄公河等河流的上源都在这里。","type":"判断题"},{"number":34,"stem":"新疆全年日照时间平均 2600~3400小时，居全国第 2 位，为特色优势农产品种植提供了良好的自然条件。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。新疆全年日照时间平均 2600～3400 小时，居全国第 2位，为特色优势农产品种植提供了良好的自然条件。","type":"判断题"},{"number":35,"stem":"南宋宋慈著《洗冤录》，是中国第一部法医学专著。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。南宋宋慈著《洗冤录》，是中国第一部法医学专著。","type":"判断题"},{"number":36,"stem":"云南最高峰是位于玉龙雪山的扇子陡。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“梅里雪山最高峰卡瓦格博峰，海拔 6740米，是云南最高山峰”。梅里雪山最高峰卡瓦格博峰海拔 6740 米，是云南最高山峰。","type":"判断题"},{"number":37,"stem":"福建共有 10 个项目入选《联合国教科文组织非遗名录》（名册），是全国唯一实现代表作名录、急需保护名录、优秀保护实践名册三个名录系列“大满贯”的省份。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。福建共有 10 个项目入选《联合国教科文组织非遗名录》（名册），是全国唯一实现代表作名录、急需保护名录、优秀保护实践名册三个名录系列“大满贯”的省份。","type":"判断题"},{"number":38,"stem":"“三湘”因湘江流经永州时与“潇水”、流经衡阳时与“蒸水”、入洞庭湖时与“沅水”相汇而得名，分别称“潇湘”“蒸湘”“沅湘”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。三湘”因湘江流经永州时与“潇水”、流经衡阳时与“蒸水”、入洞庭湖时与“沅水”相汇而得名，分别称“潇湘”“蒸湘”“沅湘”。","type":"判断题"},{"number":39,"stem":"新界中部的大帽山（957米）是香港第一高峰。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。新界中部的大帽山（957米）是香港第一高峰。","type":"判断题"},{"number":40,"stem":"12 世纪，铁木真统一蒙古诸部，建立大蒙古国，被尊为成吉思汗，蒙古族的名字由此而来，象征着“永恒之火”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。12 世纪，铁木真统一蒙古诸部，建立大蒙古国，被尊为成吉思汗，蒙古族的名字由此而来，象征着“永恒之火”。二、单选题","type":"判断题"},{"number":41,"stem":"嫦娥六号带回的人类首份月背样品重（）","options":[{"key":"A","text":"1731克"},{"key":"B","text":"1935.3克"},{"key":"C","text":"2000克"},{"key":"D","text":"1500克"}],"answer":"B","keys":["B"],"explanation":"1731 克是嫦娥五号带回的月壤重量，A项错误。嫦娥六号带回人类首份月背样品，重1935.3克。","type":"单选题"},{"number":42,"stem":"抛政园请吴门画派的代表人物（）为其设计蓝图。","options":[{"key":"A","text":"仇英"},{"key":"B","text":"沈周"},{"key":"C","text":"文徽明"},{"key":"D","text":"唐寅"}],"answer":"C","keys":["C"],"explanation":"王献臣曾请吴门画派的代表人物文徽明为其设计蓝图，形成以水为主、疏朗平淡、近乎自然的风景。","type":"单选题"},{"number":43,"stem":"1852年, ( ) 受命在湘组建湘军, 镇压太平天国。","options":[{"key":"A","text":"左宗棠"},{"key":"B","text":"曾国藩"},{"key":"C","text":"李鸿章"},{"key":"D","text":"张之洞"}],"answer":"B","keys":["B"],"explanation":"1852 年, 曾国藩受命在湘组建湘军, 镇压太平天国。左宗棠为湘军重要将领但非组建者, 李鸿章组建淮军, 张之洞为洋务派代表, 1852年组建湘军者为曾国藩。","type":"单选题"},{"number":44,"stem":"标志着新民主主义革命伟大开端的是 ( )。","options":[{"key":"A","text":"五四运动"},{"key":"B","text":"中国共产党成立"},{"key":"C","text":"南昌起义"},{"key":"D","text":"辛亥革命"}],"answer":"A","keys":["A"],"explanation":"五四运动是近代中国革命史上具有划时代意义的事件，标志着新民主主义革命的伟大开端。","type":"单选题"},{"number":45,"stem":"我国支派最多的佛教宗派是（）。","options":[{"key":"A","text":"律宗"},{"key":"B","text":"禅宗"},{"key":"C","text":"净土宗"},{"key":"D","text":"密宗"}],"answer":"B","keys":["B"],"explanation":"禅宗是我国支派最多的佛教宗派，也是中国佛教史上流传最久远、对中国文化思想影响最广泛的宗派。","type":"单选题"},{"number":46,"stem":"1227年蒙古灭西夏后，设（），始有宁夏之名。","options":[{"key":"A","text":"宁夏府"},{"key":"B","text":"西夏路"},{"key":"C","text":"灵州路"},{"key":"D","text":"宁夏路"}],"answer":"D","keys":["D"],"explanation":"解析简称“宁”，首府银川市。1227年蒙古灭西夏后，设宁夏路，始有宁夏之名。","type":"单选题"},{"number":47,"stem":"澳门鱼行醉龙节是澳门鲜鱼行独有的一项民间传统节庆活动，又称（）。","options":[{"key":"A","text":"澳门鱼行醉龙醒狮大会"},{"key":"B","text":"澳门醉龙巡游"},{"key":"C","text":"澳门鲜鱼行庙会"},{"key":"D","text":"澳门龙舟醉会"}],"answer":"A","keys":["A"],"explanation":"澳门鱼行醉龙节是澳门鲜鱼行独有的一项民间传统节庆活动，又称澳门鱼行醉龙醒狮大会。","type":"单选题"},{"number":48,"stem":"壮族地区产量居全国首位的作物是（）。","options":[{"key":"A","text":"橡胶"},{"key":"B","text":"剑麻"},{"key":"C","text":"香蕉"},{"key":"D","text":"甘燕"}],"answer":"D","keys":["D"],"explanation":"壮族地区甘蔗产量居全国首位，南珠、三七、蛤是壮族地区最负盛名的特产。","type":"单选题"},{"number":49,"stem":"“布达拉”是梵语音译，又译作“普陀”，原指（）所居之岛。","options":[{"key":"A","text":"文殊菩萨"},{"key":"B","text":"释迦牟尼佛"},{"key":"C","text":"观世音菩萨"},{"key":"D","text":"阿弥陀佛"}],"answer":"C","keys":["C"],"explanation":"布达拉宫位于西藏拉萨市的红山上，“布达拉”是梵语音译，又译作“普陀”，原指观世音菩萨所居之岛。","type":"单选题"},{"number":50,"stem":"1914年在巴拿马国际博览会上一举夺得金奖的是天津的（）。","options":[{"key":"A","text":"“泥人张”彩塑"},{"key":"B","text":"杨柳青年画"},{"key":"C","text":"“魏记”风筝"},{"key":"D","text":"天津地毯"}],"answer":"C","keys":["C"],"explanation":"1914 年，“魏记”风筝在巴拿马国际博览会上一举夺得金奖。“泥人张”彩塑、杨柳青年画、天津地毯同为天津名产，但 1914 年获巴拿马国际博览会金奖者为“魏记”风筝。","type":"单选题"},{"number":51,"stem":"唐朝出现了专门掌握绳墨绘制图样和施工的（）。","options":[{"key":"A","text":"都料匠"},{"key":"B","text":"样人"},{"key":"C","text":"鲁班"},{"key":"D","text":"瓦匠"}],"answer":"A","keys":["A"],"explanation":"唐朝在建筑技术方面，出现了木构架设计的标准，木构件的比例形式逐步趋向定型化，并出现了专门掌握绳墨绘制图样和施工的都料匠。","type":"单选题"},{"number":52,"stem":"主桥跨径居山区桥梁跨径世界第一、桥梁高度居世界第一，“横竖”都是世界第一的贵州大桥是（）。","options":[{"key":"A","text":"北盘江大桥"},{"key":"B","text":"坝陵河大桥"},{"key":"C","text":"鸭池河大桥"},{"key":"D","text":"花江峡谷大桥"}],"answer":"D","keys":["D"],"explanation":"花江峡谷大桥全长 2890米，主桥跨径 1420米，桥面至水面垂直高度 626.01 米，主桥跨径居山区桥梁跨径世界第一、桥梁高度居世界第一，被称为“横竖”都是世界第一。一、桥梁高度居世界第一，被称为“横竖”都是世界第一。北盘江大桥、坝陵河大桥、鸭池河大桥均为贵州著名桥梁，但“横竖都是世界第一”者为花江峡谷大桥。","type":"单选题"},{"number":53,"stem":"新亚欧大陆桥又名“第二亚欧大陆桥”，是从（）到荷兰鹿特丹港的国际化铁路交通干线。","options":[{"key":"A","text":"山东省青岛市"},{"key":"B","text":"辽宁省大连市"},{"key":"C","text":"江苏省连云港市"},{"key":"D","text":"上海市"}],"answer":"C","keys":["C"],"explanation":"新亚欧大陆桥又名“第二亚欧大陆桥”，是从江苏省连云港市到荷兰鹿特丹港的国际化铁路交通干线，国内由陇海铁路和兰新铁路组成，全长 10900 公里。新亚欧大陆桥东起江苏连云港，西抵荷兰鹿特丹，青岛、大连、上海均非其起点。","type":"单选题"},{"number":54,"stem":"全国唯一的畲族自治县——景宁畲族自治县位于浙江省（）。","options":[{"key":"A","text":"温州市"},{"key":"B","text":"衢州市"},{"key":"C","text":"丽水市"},{"key":"D","text":"杭州市"}],"answer":"C","keys":["C"],"explanation":"浙江省丽水市设有全国唯一的畲族自治县——景宁畲族自治县，畲民自称“山哈”，意为山里的客人。景宁畲族自治县隶属于丽水市，非温州、衢州、杭州所辖。","type":"单选题"},{"number":55,"stem":"中国最早的马克思主义传播者是（）。","options":[{"key":"A","text":"鲁迅"},{"key":"B","text":"陈独秀"},{"key":"C","text":"李大钊"},{"key":"D","text":"毛泽东"}],"answer":"C","keys":["C"],"explanation":"李大钊是在中国举起十月革命旗帜的第一人，是中国最早的马克思主义传播者。","type":"单选题"},{"number":56,"stem":"上海民族民间文化以（）为根、移民文化为脉、海派文化为魂。","options":[{"key":"A","text":"徽文化"},{"key":"B","text":"荆楚文化"},{"key":"C","text":"齐鲁文化"},{"key":"D","text":"江南文化（吴越文化）"}],"answer":"D","keys":["D"],"explanation":"上海民族民间文化以江南文化（吴越文化）为根、移民文化为脉、海派文化为魂，兼具吴越传统与中西交融特质，开放包容、精致务实。上海民族民间文化以江南文化（吴越文化）为根，徽文化、齐鲁文化、荆楚文化均非上海文化之根。","type":"单选题"},{"number":57,"stem":"继北京之后，全国第二个拥有双 4F机场的城市是（）。","options":[{"key":"A","text":"上海"},{"key":"B","text":"广州"},{"key":"C","text":"成都"},{"key":"D","text":"重庆"}],"answer":"C","keys":["C"],"explanation":"成都市是继北京之后全国第二个拥有双 4F机场的城市。","type":"单选题"},{"number":58,"stem":"隋开皇九年（589 年）将荆州江夏郡改称（），后来鄂州又成为治所，今湖北简称鄂即源于此。","options":[{"key":"A","text":"荆州"},{"key":"B","text":"江夏"},{"key":"C","text":"鄂州"},{"key":"D","text":"武昌"}],"answer":"C","keys":["C"],"explanation":"隋开皇九年（589年）将荆州江夏郡改称鄂州，治江夏，后来鄂州又成为治所，今湖北简称鄂即源于此。荆州、江夏为隋代以前的郡名，武昌为今湖北城市，湖北简称“鄂”源于隋代改称鄂州。","type":"单选题"},{"number":59,"stem":"土家人把是否善于（）作为衡量女子才德的标准。","options":[{"key":"A","text":"唱山歌"},{"key":"B","text":"哭嫁"},{"key":"C","text":"织锦"},{"key":"D","text":"摆手舞"}],"answer":"B","keys":["B"],"explanation":"女子在出嫁前 7~20天开始哭，哭嫁歌有“女哭娘”“姐哭妹”“骂媒人”等。开始是轻歌唱，越接近嫁期越悲伤。土家人把是否善于哭嫁作为衡量女子才德的标准。唱山歌、织锦均为土家族传统技艺，摆手舞为土家族传统舞蹈，土家人把是否善于哭嫁作为衡量女子才德的标准。","type":"单选题"},{"number":60,"stem":"绍兴加饭酒距今已有（）多年的酿造历史。","options":[{"key":"A","text":"1000"},{"key":"B","text":"1500"},{"key":"C","text":"2300"},{"key":"D","text":"3000"}],"answer":"C","keys":["C"],"explanation":"解析古称“山阴甜酒”“越酒”，距今已有 2300多年的酿造历史。具有色泽橙黄清澈、香气芬芳浓郁、滋味鲜甜醇厚、越陈越香、久藏不坏的特点。","type":"单选题"},{"number":61,"stem":"世界上海拔最高的湖泊是（）。","options":[{"key":"A","text":"色林错"},{"key":"B","text":"青海湖"},{"key":"C","text":"纳木错"},{"key":"D","text":"扎日南木错"}],"answer":"C","keys":["C"],"explanation":"纳木错也是世界上海拔最高的湖泊。色林错、扎日南木错均为西藏大湖，青海湖为我国最大的内陆咸水湖，但世界上海拔最高的湖泊为纳木错。","type":"单选题"},{"number":62,"stem":"湖北土家族把丧事当作喜事办的独特丧葬习俗是（）。","options":[{"key":"A","text":"哭嫁"},{"key":"B","text":"赶年"},{"key":"C","text":"舍巴日"},{"key":"D","text":"跳丧"}],"answer":"D","keys":["D"],"explanation":"湖北土家族风情除了独具特色的服饰和美食外，特别值得一提的是“跳丧”的习俗。是把丧事当作喜事办的独特丧葬习俗。哭嫁为土家族婚俗，赶年为土家族年俗，舍巴日为土家族祭祀节庆，“跳丧”才是其独特丧葬习俗。","type":"单选题"},{"number":63,"stem":"国民党一大事实上确立的三大政策是（）。","options":[{"key":"A","text":"联俄、联共、联蒋"},{"key":"B","text":"联俄、联共、扶助农工"},{"key":"C","text":"民族、民权、民生"},{"key":"D","text":"联美、联共、扶助农工"}],"answer":"B","keys":["B"],"explanation":"1924 年 1 月，中国国民党第一次全国代表大会召开，重新解释三民主义，事实上确立联俄、联共、扶助农工三大政策，标志着第一次国共合作正式形成。","type":"单选题"},{"number":64,"stem":"以《清明上河图》最为知名的宋代画家是（）。","options":[{"key":"A","text":"王蒙"},{"key":"B","text":"张择端"},{"key":"C","text":"黄公望"},{"key":"D","text":"倪瓒"}],"answer":"B","keys":["B"],"explanation":"宋代画家以张择端《清明上河图》最为知名。","type":"单选题"},{"number":65,"stem":"有“黄河之水天上来”之势，属于我国三大瀑布之一的是（）。","options":[{"key":"A","text":"黄果树瀑布"},{"key":"B","text":"壶口瀑布"},{"key":"C","text":"德天瀑布"},{"key":"D","text":"吊水楼瀑布"}],"answer":"B","keys":["B"],"explanation":"峡谷下段有著名的壶口瀑布，有“黄河之水天上来”之势，是我国三大瀑布之一。","type":"单选题"},{"number":66,"stem":"中国古代使用时间最长、精确度最高的历法是（）。","options":[{"key":"A","text":"《甘石星经》"},{"key":"B","text":"《授时历》"},{"key":"C","text":"《太初历》"},{"key":"D","text":"《大衍历》"}],"answer":"B","keys":["B"],"explanation":"至元代郭守敬又制定《授时历》。《授时历》是中国古代使用时间最长、精确度最高的历法。","type":"单选题"},{"number":67,"stem":"南唐后主李煜的代表作有（）。","options":[{"key":"A","text":"《念奴娇·赤壁怀古》"},{"key":"B","text":"《水调歌头·明月几时有》"},{"key":"C","text":"《满江红》"},{"key":"D","text":"《虞美人·春花秋月何时了》"}],"answer":"D","keys":["D"],"explanation":"李煜的代表作有《虞美人·春花秋月何时了》《浪淘沙·帘外雨潺潺》《相见欢·林花谢了春红》《相见欢·无言独上西楼》等。","type":"单选题"},{"number":68,"stem":"世界上海拔最高的大型湖泊，被称为“天湖”的是（）。","options":[{"key":"A","text":"纳木错"},{"key":"B","text":"鄱阳湖"},{"key":"C","text":"长白山天池"},{"key":"D","text":"青海湖"}],"answer":"A","keys":["A"],"explanation":"解析 纳木错湖面海拔 4718米，为世界上海拔最高的大型湖泊，也是目前中国第三大咸水湖。","type":"单选题"},{"number":69,"stem":"古代十二时辰中，子时对应的时间是（）。","options":[{"key":"A","text":"1点- 3 点"},{"key":"B","text":"21点- 23点"},{"key":"C","text":"19点- 21点"},{"key":"D","text":"23点- 1点"}],"answer":"D","keys":["D"],"explanation":"解析 方法是将一天分为 12个时辰，对应十二地支，开始于子时（23—次日 1 点），结束于亥时（21~23点），2 小时为一个时辰。","type":"单选题"},{"number":70,"stem":"中国共产党第二次全国代表大会举行的时间是（）。","options":[{"key":"A","text":"1921年 7月 23日"},{"key":"B","text":"1922年 7月 16–23日"},{"key":"C","text":"1923年 6月 12–20日"},{"key":"D","text":"1925年 1月 11–22日"}],"answer":"B","keys":["B"],"explanation":"1922年 7月 16~23日，中国共产党第二次全国代表大会在上海举行。","type":"单选题"},{"number":71,"stem":"宋代五大名窑之首是（）。","options":[{"key":"A","text":"哥窑"},{"key":"B","text":"定窑"},{"key":"C","text":"汝窑"},{"key":"D","text":"官窑"}],"answer":"C","keys":["C"],"explanation":"汝窑瓷器釉色以天青为贵、粉青为上，天蓝和月白次之。宋代形成汝窑、官窑、哥窑、钧窑、定窑“五大名窑”，五窑中以“汝窑为魁”。26 版教材改动说明：汝窑条目 26版整体改写——窑址明确为古汝州（今河南宝丰），改写香灰胎、开片、釉色等级（天青为贵、粉青为上，天蓝和月白次之）、宋徽宗时天青瓷烧造约 20 年等，保留玛瑙为釉及“似玉、非玉、而胜玉”评价；25 版“其釉色如雨过天晴，温润古朴”表述不再保留。","type":"单选题"},{"number":72,"stem":"1271年就任蒙古帝国大汗、改国号为元的是（）。","options":[{"key":"A","text":"窝阔台"},{"key":"B","text":"蒙哥"},{"key":"C","text":"成吉思汗"},{"key":"D","text":"忽必烈"}],"answer":"D","keys":["D"],"explanation":"1271 年，成吉思汗孙子忽必烈就任蒙古帝国大汗，改国号为元，元朝正式建立，定都大都（今北京）。","type":"单选题"},{"number":73,"stem":"贵州全省最高点、海拔 2900.6米的山峰是（）。","options":[{"key":"A","text":"韭菜坪"},{"key":"B","text":"梵净山"},{"key":"C","text":"雷公山"},{"key":"D","text":"大娄山"}],"answer":"A","keys":["A"],"explanation":"贵州简称“黔”或“贵”，省会贵阳市。全省最高点韭菜坪，海拔 2900.6米。","type":"单选题"},{"number":74,"stem":"被誉为“天路”、结束了西藏没有铁路历史的铁路是（）。","options":[{"key":"A","text":"川藏铁路"},{"key":"B","text":"青藏铁路"},{"key":"C","text":"滇藏铁路"},{"key":"D","text":"拉林铁路"}],"answer":"B","keys":["B"],"explanation":"被誉为“天路”的青藏铁路的通车结束了西藏没有铁路的历史，它全长 1956公里，是世界上海拔最高、在冻土上路程最长的高原铁路。川藏铁路、滇藏铁路、拉林铁路均为进出藏铁路通道，但被誉为“天路”、结束西藏没有铁路历史者为青藏铁路。","type":"单选题"},{"number":75,"stem":"《尚书·禹贡》将天下分为“九州”，豫州位居九州之中，有（）之称。","options":[{"key":"A","text":"九州腹地、十省通衢"},{"key":"B","text":"八省通衢、天下之中"},{"key":"C","text":"五方杂处、九州之喉"},{"key":"D","text":"山河表里、四塞之固"}],"answer":"A","keys":["A"],"explanation":"《尚书·禹贡》将天下分为“九州”，豫州位居九州之中，有“九州腹地、十省通衢”之称。","type":"单选题"},{"number":76,"stem":"四川省境内共有大小河流 1419条，被誉为（）。","options":[{"key":"A","text":"万河之省"},{"key":"B","text":"千水之省"},{"key":"C","text":"水乡泽国"},{"key":"D","text":"鱼米之乡"}],"answer":"B","keys":["B"],"explanation":"四川省境内共有大小河流 1419 条，被誉为“千水之省”。","type":"单选题"},{"number":77,"stem":"有“京外名刹之首”美誉的是石家庄的（）。","options":[{"key":"A","text":"赵州桥"},{"key":"B","text":"秦皇古道"},{"key":"C","text":"隆兴寺"},{"key":"D","text":"苍岩山"}],"answer":"C","keys":["C"],"explanation":"石家庄有被誉为“京外名刹之首”的隆兴寺。赵州桥为现存最早的敞肩石拱桥，秦皇古道为世界最早的古驿道，苍岩山为石家庄名山，但“京外名刹之首”指隆兴寺。","type":"单选题"},{"number":78,"stem":"下列口岸中，属于我国仅有的铁路、公路、输油气管道三位一体的国家一类口岸的是（）。","options":[{"key":"A","text":"阿拉山口口岸"},{"key":"B","text":"红其拉甫口岸"},{"key":"C","text":"巴克图口岸"},{"key":"D","text":"伊尔克什坦口岸"}],"answer":"A","keys":["A"],"explanation":"阿拉山口口岸、霍尔果斯口岸是我国仅有的两个铁路、公路、输油气管道三位一体的国家一类口岸。","type":"单选题"},{"number":79,"stem":"被称为“中国戏曲之乡”的省份是（）。","options":[{"key":"A","text":"浙江省"},{"key":"B","text":"安徽省"},{"key":"C","text":"江苏省"},{"key":"D","text":"湖北省"}],"answer":"B","keys":["B"],"explanation":"安徽被称为“中国戏曲之乡”，地方戏种现存 30余种，影响较大的有黄梅戏、徽剧等。浙江越剧、江苏昆曲、湖北汉剧均为地方戏名称，“中国戏曲之乡”指的是安徽。","type":"单选题"},{"number":80,"stem":"唐天宝十四年（755 年）爆发“安史之乱”，太子李亨进入宁夏，在（）登基称帝，史称唐肃宗。","options":[{"key":"A","text":"银川"},{"key":"B","text":"中卫"},{"key":"C","text":"固原"},{"key":"D","text":"灵武"}],"answer":"D","keys":["D"],"explanation":"唐天宝十四年（755年）爆发了“安史之乱”，太子李亨进入宁夏，在灵武登基称帝，史称唐肃宗。","type":"单选题"},{"number":81,"stem":"（）基本属于亚热带高原季风型气候，立体气候特点显著，有“一山分四季，十里不同天”之说。","options":[{"key":"A","text":"四川"},{"key":"B","text":"广西"},{"key":"C","text":"贵州"},{"key":"D","text":"云南"}],"answer":"D","keys":["D"],"explanation":"云南基本属于亚热带高原季风型气候，但受纬度差异和海拔垂直差异影响，立体气候特点显著，“一山分四季，十里不同天”，并且全省范围内同时具有寒、温、热（包括亚热带）三带气候。有“立体气候”特点的是云南，四川、广西、贵州的气候类型均与此不符。","type":"单选题"},{"number":82,"stem":"《史记》的作者是（）时期的司马迁。","options":[{"key":"A","text":"西汉"},{"key":"B","text":"东汉"},{"key":"C","text":"西晋"},{"key":"D","text":"唐朝"}],"answer":"A","keys":["A"],"explanation":"西汉时期司马迁创作《史记》，首次采用“纪”“传”的方式，记叙了从传说中的黄帝到汉武帝时期 2000 多年的历史，是中国第一部纪传体通史，被鲁迅誉为“史家之绝唱，无韵之离骚”。","type":"单选题"},{"number":83,"stem":"全国独此一家、因用柳木炭条起线稿再扑抹印制而得名的年画是（）。","options":[{"key":"A","text":"杨柳青年画"},{"key":"B","text":"高密扑灰年画"},{"key":"C","text":"绵竹年画"},{"key":"D","text":"桃花坞年画"}],"answer":"B","keys":["B"],"explanation":"高密扑灰年画全国独此一家，年画艺人用柳木炭条起线稿，再用画纸在线稿上扑抹印，一稿可扑数张，因有这一招，便有“扑灰”之名。到清末，发展成两个主要的流派：“老抹画”和“红货”。杨柳青年画产于天津，绵竹年画产于四川，桃花坞年画产于江苏苏州，高密扑灰年画为山东独有。","type":"单选题"},{"number":84,"stem":"中国现存最大的古代祭祀性建筑群是（）。","options":[{"key":"A","text":"地坛"},{"key":"B","text":"太庙"},{"key":"C","text":"天坛"},{"key":"D","text":"北京孔庙"}],"answer":"C","keys":["C"],"explanation":"天坛位于东城区，是中国现存最大的古代祭祀性建筑群。地坛是明清帝王祭地之所，太庙为皇家祖庙，北京孔庙为祭祀孔子之所，均非最大的古代祭祀性建筑群。","type":"单选题"},{"number":85,"stem":"西班牙的“国粹”是（）。","options":[{"key":"A","text":"吉他"},{"key":"B","text":"海鲜饭"},{"key":"C","text":"弗拉门科舞蹈"},{"key":"D","text":"斗牛"}],"answer":"D","keys":["D"],"explanation":"西班牙民风奔放热情，以斗牛、弗拉门戈舞蹈、吉他而闻名。斗牛是西班牙传统的民族文化，也是“国粹”。","type":"单选题"},{"number":86,"stem":"高达 2882 米、为河北省全省最高峰的是（）。","options":[{"key":"A","text":"雾灵山"},{"key":"B","text":"祖山"},{"key":"C","text":"驼梁"},{"key":"D","text":"小五台山"}],"answer":"D","keys":["D"],"explanation":"在燕山和太行山山地中，小五台山高达 2882 米，为全省最高峰。","type":"单选题"},{"number":87,"stem":"被称为“世界上最大的四合院”的北京建筑是（）。","options":[{"key":"A","text":"雍和宫"},{"key":"B","text":"恭王府"},{"key":"C","text":"醇亲王府"},{"key":"D","text":"礼王府"}],"answer":"B","keys":["B"],"explanation":"北京有世界上最大的皇宫——紫禁城、世界上最大的四合院——恭王府。","type":"单选题"},{"number":88,"stem":"清康熙十二年（1673年），于船厂（今吉林市）建吉林城，史称“吉林乌拉”，满语译音意为（）。","options":[{"key":"A","text":"牧场"},{"key":"B","text":"平原"},{"key":"C","text":"森林"},{"key":"D","text":"沿江"}],"answer":"D","keys":["D"],"explanation":"清康熙十二年（1673 年），于船厂（今吉林市）建吉林城，史称“吉林乌拉”（满语译音“沿江”之意），吉林由此得名。“吉林乌拉”为满语译音，意为“沿江”，非平原、森林、牧场之意。","type":"单选题"},{"number":89,"stem":"天津市现存最古老的一座建筑群，也是中国北方妈祖文化的研究中心和北方最大的妈祖庙是（）。","options":[{"key":"A","text":"吕祖堂"},{"key":"B","text":"玉皇阁"},{"key":"C","text":"大悲院"},{"key":"D","text":"天后宫"}],"answer":"D","keys":["D"],"explanation":"天津天后宫是天津市现存最古老的一座建筑群，是中国北方妈祖文化的研究中心和北方最大的妈祖庙。玉皇阁、大悲院、吕祖堂均为天津道教或佛教建筑，与妈祖文化无关。","type":"单选题"},{"number":90,"stem":"“园林巧于因借”一语出自明代计成的（ ）。","options":[{"key":"A","text":"《长物志》"},{"key":"B","text":"《园冶》"},{"key":"C","text":"《闲情偶寄》"},{"key":"D","text":"《说园》"}],"answer":"B","keys":["B"],"explanation":"《园冶》是明末出现的一部总结造园经验的著作。明代计成在《园冶》中指出，“园林巧于因借”。","type":"单选题"},{"number":91,"stem":"“江水并流而不交汇”的三江并流位于（ ）省。","options":[{"key":"A","text":"云南"},{"key":"B","text":"贵州"},{"key":"C","text":"西藏"},{"key":"D","text":"四川"}],"answer":"A","keys":["A"],"explanation":"三江并流指金沙江、澜沧江和怒江这三条发源于青藏高原的大江在云南省境内自北向南并行奔流 170多千米，穿越崇山峻岭，形成世界上罕见的“江水并流而不交汇”的奇特自然地理景观。","type":"单选题"},{"number":92,"stem":"2024年 12月入选联合国教科文组织人类非物质文化遗产代表作名录的是（）。","options":[{"key":"A","text":"“端午节”"},{"key":"B","text":"“春节——中国人庆祝传统新年的社会实践”"},{"key":"C","text":"“中秋节”"},{"key":"D","text":"“元宵节”"}],"answer":"B","keys":["B"],"explanation":"2024年 12 月，中国申报的“春节——中国人庆祝传统新年的社会实践”入选联合国教科文组织人类非物质文化遗产代表作名录。“端午节”于 2009年入选，“中秋节”“元宵节”未列入该名录。","type":"单选题"},{"number":93,"stem":"中国最早的农书是西汉晚期成书的（）。","options":[{"key":"A","text":"《齐民要术》"},{"key":"B","text":"《农书》"},{"key":"C","text":"《农政全书》"},{"key":"D","text":"《汜胜之书》"}],"answer":"D","keys":["D"],"explanation":"解析中国最早的农书是西汉晚期成书的《汜胜之书》，记载黄河流域农业生产经验和耕作技术，包括选种、栽培、收获、贮藏等技术，对农作物“区种法”比较推崇。","type":"单选题"},{"number":94,"stem":"我国南方流传最广的民间木刻画，采用一版一色水印法的是（）。","options":[{"key":"A","text":"山东潍坊杨家埠年画"},{"key":"B","text":"苏州桃花坞年画"},{"key":"C","text":"四川绵竹年画"},{"key":"D","text":"天津杨柳青年画"}],"answer":"B","keys":["B"],"explanation":"解析桃花坞年画以门画、中堂、条屏为主要形式，以木版雕刻、一版一色传统水印法印刷，色彩绚丽夺目，构图精巧，形象突出，主次分明，富于装饰性，形成了一种优美清秀、严密工整的独特风格，民间画坛称为“姑苏版”。","type":"单选题"},{"number":95,"stem":"古代帝王祭日、祭月的地点和时间分别是（）。","options":[{"key":"A","text":"南郊天坛，冬至日；北郊地坛，夏至日"},{"key":"B","text":"西郊月坛，夏至日；东郊日坛，冬至日"},{"key":"C","text":"东郊日坛，春分日；西郊月坛，秋分日"},{"key":"D","text":"东郊日坛，秋分日；西郊月坛，春分日"}],"answer":"C","keys":["C"],"explanation":"祭日于东郊的日坛，时间在春分日。祭月于西郊的月坛，时间在秋分日。","type":"单选题"},{"number":96,"stem":"俗称“红教”的藏传佛教教派是（）。","options":[{"key":"A","text":"萨迦派"},{"key":"B","text":"噶举派"},{"key":"C","text":"格鲁派"},{"key":"D","text":"宁玛派"}],"answer":"D","keys":["D"],"explanation":"宁玛派：因该派僧人穿戴红色袈裟、僧裙、僧帽，俗称红教。","type":"单选题"},{"number":97,"stem":"相传于农历五月初五投汨罗江殉国的爱国诗人是（）。","options":[{"key":"A","text":"李白"},{"key":"B","text":"屈原"},{"key":"C","text":"杜甫"},{"key":"D","text":"白居易"}],"answer":"B","keys":["B"],"explanation":"端午节起源说法众多，其中以纪念战国时期楚国诗人屈原说影响最为广泛，相传屈原于农历五月初五投汨罗江殉国。","type":"单选题"},{"number":98,"stem":"我国现存最早的诗文总集是梁朝昭明太子萧统主编的（）。","options":[{"key":"A","text":"《文选》"},{"key":"B","text":"《文心雕龙》"},{"key":"C","text":"《乐府诗集》"},{"key":"D","text":"《玉台新咏》"}],"answer":"A","keys":["A"],"explanation":"梁朝昭明太子萧统主编的《文选》，将文学与经、史、子区分开来，选录了前代 130位作家 500多篇作品，我国现存最早的诗文总集。","type":"单选题"},{"number":99,"stem":"游客可以体验中、俄、朝三国交界处“一眼望三国、犬吠惊三疆”之意境的吉林景区是（）。","options":[{"key":"A","text":"图们"},{"key":"B","text":"防川"},{"key":"C","text":"三合"},{"key":"D","text":"南坪"}],"answer":"B","keys":["B"],"explanation":"游客可以体验中、俄、朝三国交界处珲春防川“一眼望三国、犬吠惊三疆”之意境。图们、三合、南坪均为吉林边境口岸或景区，但“一眼望三国、犬吠惊三疆”说的是珲春防川。","type":"单选题"},{"number":100,"stem":"红茶多以产地命名，其中以（）尤为出众。","options":[{"key":"A","text":"西湖龙井、太湖碧螺春"},{"key":"B","text":"君山银针、蒙顶黄芽"},{"key":"C","text":"白毫银针、白牡丹"},{"key":"D","text":"安徽祁红、云南滇红"}],"answer":"D","keys":["D"],"explanation":"红茶出现于清朝，用全发酵法制成，红叶红汤、香甜味醇，具有水果香气和醇厚的滋味，还具有耐泡的特点。红茶多以产地命名，以安徽祁红、云南滇红尤为出众。","type":"单选题"},{"number":101,"stem":"有着 100多年运营历史，与香港电车、太平山山顶缆车齐名，是维多利亚港著名渡海交通工具的是（）。","options":[{"key":"A","text":"天星小轮"},{"key":"B","text":"喷射飞航"},{"key":"C","text":"港九小轮"},{"key":"D","text":"愉景湾航运"}],"answer":"A","keys":["A"],"explanation":"有着 100多年运营历史的天星小轮是维多利亚港的著名渡海交通工具，它与香港电车、太平山山顶缆车齐名，是拥有百年以上悠久历史的交通工具。喷射飞航、港九小轮、愉景湾航运均为香港海上交通工具，但拥有百年以上历史、与香港电车及太平山山顶缆车齐名者为天星小轮。","type":"单选题"},{"number":102,"stem":"粉彩瓷因颜色产生（）效果而得名。","options":[{"key":"A","text":"粉化"},{"key":"B","text":"结晶"},{"key":"C","text":"窑变"},{"key":"D","text":"开片"}],"answer":"A","keys":["A"],"explanation":"解析粉彩瓷在烧好的胎釉上施含砷物的粉底，涂上颜料后用笔洗开，由于砷的乳蚀作用，其颜色产生粉化效果。","type":"单选题"},{"number":103,"stem":"彩虹袖是（）传统服饰中最典型的标志之一，互助县也由此赢得了“彩虹之乡”的美誉。","options":[{"key":"A","text":"青海藏族"},{"key":"B","text":"循化撒拉族"},{"key":"C","text":"门源回族"},{"key":"D","text":"互助土族"}],"answer":"D","keys":["D"],"explanation":"解析彩虹袖是互助土族传统服饰中最典型的标志之一，互助县也由此赢得了“彩虹之乡”的美誉。藏族、撒拉族、回族均为青海世居少数民族，但“彩虹袖”为互助土族传统服饰标志。","type":"单选题"},{"number":104,"stem":"楚汉相争时，项羽曾将秦地分封给三个秦的降将，所以陕西又被称为（）。","options":[{"key":"A","text":"三晋"},{"key":"B","text":"三秦"},{"key":"C","text":"三辅"},{"key":"D","text":"三关"}],"answer":"B","keys":["B"],"explanation":"楚汉相争时，项羽曾将秦地分封给三个秦的降将，所以陕西又被称为“三秦”。“三晋”指山西，“三辅”为汉代长安周边行政区，“三关”泛指北方关隘，陕西因项羽分封三秦王而称“三秦”。","type":"单选题"},{"number":105,"stem":"蒙古族最具代表性的乐器是（）。","options":[{"key":"A","text":"四胡"},{"key":"B","text":"火不思"},{"key":"C","text":"马头琴"},{"key":"D","text":"潮尔"}],"answer":"C","keys":["C"],"explanation":"马头琴作为蒙古族最具代表性的乐器。四胡、火不思、潮尔均为蒙古族传统乐器，其中最具代表性的是马头琴。","type":"单选题"},{"number":106,"stem":"被联合国评为“象征 20世纪人类征服自然的三大奇迹”之一的是（）。","options":[{"key":"A","text":"成渝铁路"},{"key":"B","text":"宝成铁路"},{"key":"C","text":"成昆铁路"},{"key":"D","text":"青藏铁路"}],"answer":"C","keys":["C"],"explanation":"1970年 7月 1日，全长 1096公里的成昆铁路竣工运营。它与美国阿波罗宇宙飞船登月活动、苏联第一颗人造卫星一起被联合国评为“象征 20世纪人类征服自然的三大奇迹”。","type":"单选题"},{"number":107,"stem":"距今 8000年前的（）标志着农耕文化的初步形成，开启了中华民族的文明曙光。","options":[{"key":"A","text":"马家窑文化"},{"key":"B","text":"仰韶文化"},{"key":"C","text":"大地湾文化"},{"key":"D","text":"红山文化"}],"answer":"C","keys":["C"],"explanation":"距今 8000 年前的大地湾文化标志着农耕文化的初步形成，开启了中华民族的文明曙光。马家窑文化、仰韶文化、红山文化均为新石器时代文化，标志农耕文化初步形成、开启中华民族文明曙光的是大地湾文化。","type":"单选题"},{"number":108,"stem":"“四个与共”的共同体理念属于（）的核心内容。","options":[{"key":"A","text":"民族团结进步创建"},{"key":"B","text":"社会主义核心价值观"},{"key":"C","text":"新时代爱国主义教育"},{"key":"D","text":"铸牢中华民族共同体意识"}],"answer":"D","keys":["D"],"explanation":"铸牢中华民族共同体意识，就是要引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念，把铸牢中华民族共同体意识作为新时代党的民族工作和民族地区各项工作的主线。","type":"单选题"},{"number":109,"stem":"道教是土生土长的中国宗教，形成于（）。","options":[{"key":"A","text":"魏晋"},{"key":"B","text":"隋唐"},{"key":"C","text":"西汉"},{"key":"D","text":"东汉"}],"answer":"D","keys":["D"],"explanation":"道教是土生土长的中国宗教，形成于东汉时期。据《后汉书·襄楷传》记载，东汉顺帝时（125~144年），琅琊人宫崇上其师于吉于曲阳泉水上所得神书，号《太平清领书》，这就是道教最早的经典《太平经》，所传道教称为太平道，后来领导东汉黄巾起义的张角传授的就是这一教派。","type":"单选题"},{"number":110,"stem":"推动文化与旅游融合，是因为（）。","options":[{"key":"A","text":"文化是旅游的灵魂，旅游是文化的重要载体"},{"key":"B","text":"文化可以脱离旅游独立实现产业化"},{"key":"C","text":"旅游活动是纯经济行为，与文化无关"},{"key":"D","text":"文旅融合会削弱旅游产业的竞争力"}],"answer":"A","keys":["A"],"explanation":"文化与旅游密不可分、相辅相成，文化是旅游的灵魂，旅游是文化的重要载体。","type":"单选题"},{"number":111,"stem":"五大连池药泉会（圣水节）在农历五月初五端午节前后举行，其核心内涵是（）。","options":[{"key":"A","text":"“敬天”“娱人”"},{"key":"B","text":"“祭祖”“祈福”"},{"key":"C","text":"“欢庆”“丰收”"},{"key":"D","text":"“驱邪”“避灾”"}],"answer":"A","keys":["A"],"explanation":"五大连池药泉会（圣水节）为民俗节日，在农历五月初五端午节前后（夏历五月初四至初六 3 天）举行，是黑龙江省五大连池风景区内的达斡尔族、鄂伦春族、蒙古族、满族和汉族人民以“敬天”“娱人”为内容。五大连池药泉会（圣水节）以“敬天”“娱人”为内容，其余各项表述均非其内涵。","type":"单选题"},{"number":112,"stem":"中国目前保存最完整的皇家园林是（）。","options":[{"key":"A","text":"北海公园"},{"key":"B","text":"圆明园"},{"key":"C","text":"承德避暑山庄"},{"key":"D","text":"北京颐和园"}],"answer":"D","keys":["D"],"explanation":"颐和园位于北京市海淀区，是中国目前保存最完整的皇家园林，其前身是“清漪园”。","type":"单选题"},{"number":113,"stem":"湘赣边界秋收起义爆发的日期是（）。","options":[{"key":"A","text":"1927年 10月 27 日"},{"key":"B","text":"1927年 8月 1日"},{"key":"C","text":"1927年 9月 9日"},{"key":"D","text":"1927年 9月 29日"}],"answer":"C","keys":["C"],"explanation":"解析以毛泽东为书记的中共湖南省委前敌委员会，将参加起义的各路武装 5000余人统编为工农革命军第一师，于 9 月 9 日发动湘赣边界秋收起义。","type":"单选题"},{"number":114,"stem":"澳大利亚的首都是（）。","options":[{"key":"A","text":"悉尼"},{"key":"B","text":"墨尔本"},{"key":"C","text":"堪培拉"},{"key":"D","text":"布里斯班"}],"answer":"C","keys":["C"],"explanation":"解析堪培拉是澳大利亚的首都，意思是“汇合之地”，1927 年联邦政府迁入此地，是个纯粹的政治中心，被誉为“太洋洲的花园城市”。","type":"单选题"},{"number":115,"stem":"世界上最南端的首都，有“风城”之称的是（）。","options":[{"key":"A","text":"惠灵顿"},{"key":"B","text":"悉尼"},{"key":"C","text":"墨尔本"},{"key":"D","text":"堪培拉"}],"answer":"A","keys":["A"],"explanation":"首都惠灵顿位于北岛的南端，是新西兰第二大城市，三面环山、一面临海，是世界上最南端的首都，有“风城”之称，与悉尼、墨尔本同为大洋洲的文化中心。","type":"单选题"},{"number":116,"stem":"下列湖泊中，属于构造湖的是（）。","options":[{"key":"A","text":"滇池"},{"key":"B","text":"镜泊湖"},{"key":"C","text":"草海"},{"key":"D","text":"杭州西湖"}],"answer":"A","keys":["A"],"explanation":"构造湖：由地壳运动产生断裂凹陷经储水而成，如滇池、洱海、日月潭。","type":"单选题"},{"number":117,"stem":"台湾省汉族人口占 96%左右，大多是（）的移民，主要少数民族是高山族。","options":[{"key":"A","text":"浙江省和江西省"},{"key":"B","text":"广东省和浙江省"},{"key":"C","text":"福建省和江苏省"},{"key":"D","text":"福建省和广东省"}],"answer":"D","keys":["D"],"explanation":"台湾省汉族人口占 96%左右，大多是福建省和广东省的移民，主要少数民族是高山族。","type":"单选题"},{"number":118,"stem":"中国共产党历史上生死攸关的转折点是（）。","options":[{"key":"A","text":"八七会议"},{"key":"B","text":"遵义会议"},{"key":"C","text":"瓦窑堡会议"},{"key":"D","text":"洛川会议"}],"answer":"B","keys":["B"],"explanation":"遵义会议是党的历史上一个生死攸关的转折点，事实上确立了毛遂同志在党中央和红军的领导地位，开始确立以毛遂同志为主要代表的马克思主义正确路线在党中央的领导地位，开始形成以毛遂同志为核心的党的第一代中央领导集体，开启了党独立自主解决中国革命实际问题新阶段，在最危急关头挽救了党、挽救了红军、挽救了中国革命。","type":"单选题"},{"number":119,"stem":"标志着五言诗成熟的是班固的（）。","options":[{"key":"A","text":"《咏史诗》"},{"key":"B","text":"《燕歌行》"},{"key":"C","text":"《四愁诗》"},{"key":"D","text":"《古诗十九首》"}],"answer":"A","keys":["A"],"explanation":"班固的《咏史诗》，标志着五言诗的成熟。","type":"单选题"},{"number":120,"stem":"1885年，清政府划台湾为单一行省，为当时中国第 20 个行省，首任台湾巡抚是（）。","options":[{"key":"A","text":"沈葆桢"},{"key":"B","text":"丁日昌"},{"key":"C","text":"刘铭传"},{"key":"D","text":"邵友濂"}],"answer":"C","keys":["C"],"explanation":"1885年，清政府划台湾为单一行省，为当时中国第 20 个行省，首任台湾巡抚刘铭传。","type":"单选题"},{"number":121,"stem":"南朝时，中国历史上首位由广东起家成就帝业的皇帝，也是南朝最后一个王朝“陈”的开国皇帝是（）。","options":[{"key":"A","text":"萧衍"},{"key":"B","text":"刘裕"},{"key":"C","text":"陈霸先"},{"key":"D","text":"赵佗"}],"answer":"C","keys":["C"],"explanation":"南朝时，陈霸先是中国历史上首位由广东起家成就帝业的皇帝。也是南朝最后一个王朝“陈”的开国皇帝。萧衍为南朝梁开国皇帝，刘裕为南朝宋开国皇帝，赵佗为南越国建立者，均非由广东起家成就帝业者。","type":"单选题"},{"number":122,"stem":"（）是黎族独特的乐器。","options":[{"key":"A","text":"口弦"},{"key":"B","text":"鼻箫"},{"key":"C","text":"芦笙"},{"key":"D","text":"叮咚"}],"answer":"B","keys":["B"],"explanation":"“竹竿舞”场面欢快热烈，鼻箫是黎族独特的乐器。","type":"单选题"},{"number":123,"stem":"有“中国情人节”之喻的农历节日是（）。","options":[{"key":"A","text":"重阳节"},{"key":"B","text":"元宵节"},{"key":"C","text":"七夕节"},{"key":"D","text":"中秋节"}],"answer":"C","keys":["C"],"explanation":"农历七月初七，是牛郎织女鹊桥相会之日，有“中国情人节”之喻。","type":"单选题"},{"number":124,"stem":"明嘉靖十四年（1535 年），（）迁至澳门，澳门正式开埠并发展成为重要的对外贸易港口。","options":[{"key":"A","text":"广州市船司"},{"key":"B","text":"泉州市船司"},{"key":"C","text":"宁波市船司"},{"key":"D","text":"杭州市船司"}],"answer":"A","keys":["A"],"explanation":"明嘉靖十四年（1535年），广州市船司迁至澳门，澳门正式开埠并发展成为重要的对外贸易港口。","type":"单选题"},{"number":125,"stem":"明清科举考试中，乡试又称（）。","options":[{"key":"A","text":"“殿试”"},{"key":"B","text":"“秋闹”"},{"key":"C","text":"“春闹”"},{"key":"D","text":"“廷试”"}],"answer":"B","keys":["B"],"explanation":"秋天在省城举行，叫“乡试”（又称“秋阅”），各府州的“生员”（或称“庠生”“秀才”）参加，考取者称为“举人”。","type":"单选题"},{"number":126,"stem":"西周建立后，取代杀人祭祀和殉葬的是（）。","options":[{"key":"A","text":"木俑"},{"key":"B","text":"石像"},{"key":"C","text":"陶俑"},{"key":"D","text":"纸人"}],"answer":"C","keys":["C"],"explanation":"考古发现商朝有杀人祭祀和杀人殉葬的习俗，西周建立后这种现象才逐步消失，取而代之的是陶俑（人或六畜），体现出对生命的尊重。","type":"单选题"},{"number":127,"stem":"全国各地流传的“问我祖先在何处，山西洪洞大槐树”之说，与洪洞县（）门前的大槐树有关。","options":[{"key":"A","text":"广胜寺"},{"key":"B","text":"广济寺"},{"key":"C","text":"洪洞大槐"},{"key":"D","text":"尧庙"}],"answer":"B","keys":["B"],"explanation":"由于各地移民须在洪洞县广济壶门前的大槐树下办理手续后才能远行，因此大槐树成为移民的起点，全国各地流传的“问我祖先在何处，山西洪洞大槐树”的说法即由此而来。","type":"单选题"},{"number":128,"stem":"北京现存最古老的联拱石桥是（）。","options":[{"key":"A","text":"宝带桥"},{"key":"B","text":"洛阳桥"},{"key":"C","text":"赵州桥"},{"key":"D","text":"卢沟桥"}],"answer":"D","keys":["D"],"explanation":"卢沟桥位于北京，是北京现存最古老的联拱石桥，“卢沟晓月”是“燕京八景”之一。","type":"单选题"},{"number":129,"stem":"“世界十绝风筝”之一、取材《白蛇传》的“灵芝”风筝出自（）。","options":[{"key":"A","text":"广东阳江"},{"key":"B","text":"山东潍坊"},{"key":"C","text":"北京"},{"key":"D","text":"天津"}],"answer":"A","keys":["A"],"explanation":"1990年，在第七届国际风筝会上，阳江市取材于民间传说《白蛇传》扎制而成的“灵芝”风筝，被评为“世界十绝风筝”之一。","type":"单选题"},{"number":130,"stem":"在大连被称为“海上石林”的是（）。","options":[{"key":"A","text":"金石滩"},{"key":"B","text":"棒棰岛"},{"key":"C","text":"老虎滩"},{"key":"D","text":"兴城海滨"}],"answer":"A","keys":["A"],"explanation":"金石滩在大连以“满家滩，凉水湾，海参螃蟹成筐搬”而知名，滩上有数亿年前形成的海滨地貌与沉积岩石，被称为“海上石林”，后因这些石头“比金子还要贵重”，故改名为“金石滩”。老虎滩、棒岛、兴城海滨均为辽宁海滨景观，但被称为“海上石林”者为金石滩。三、多选题","type":"单选题"},{"number":131,"stem":"白族的传统节日主要有（）。","options":[{"key":"A","text":"三月街"},{"key":"B","text":"绕三灵"},{"key":"C","text":"耍海节"},{"key":"D","text":"火把节"},{"key":"E","text":"泼水节"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"解析白族的传统节日主要有三月街、绕三灵、耍海节、火把节等。E 项错误，泼水节为傣族传统节日，非白族节日。","type":"多选题"},{"number":132,"stem":"古代察举制的察举科目有（）。","options":[{"key":"A","text":"秀才"},{"key":"B","text":"明经"},{"key":"C","text":"孝廉"},{"key":"D","text":"贤良"},{"key":"E","text":"方正"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"本题各项表述均正确。察举制是地方官向中央举荐人才的制度，察举的科目有秀才、明经、孝廉、贤良、方正等。","type":"多选题"},{"number":133,"stem":"1959年建成的“北京十大建筑”包括（）。","options":[{"key":"A","text":"人民大会堂"},{"key":"B","text":"中国人民革命军事博物馆"},{"key":"C","text":"民族文化宫"},{"key":"D","text":"北京火车站"},{"key":"E","text":"国家体育场（鸟巢）"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"E 项错误，国家体育场（鸟巢）为 2008年北京奥运会主体育场，不属于 1959年建成的“北京十大建筑”。1959 年，为迎接中华人民共和国成立 10 周年建成的人民大会堂、中国历史博物馆与中国革命博物馆（两馆属同一建筑内，即今中国国家博物馆）、中国人民革命军事博物馆、民族文化宫、民族饭店、钓鱼台国宾馆、华侨大厦（曾拆除，现已重建）、北京火车站、全国农业展览馆和北京工人体育场 10项大型建筑工程，被称为“北京十大建筑”。","type":"多选题"},{"number":134,"stem":"明清时期，康熙、雍正、乾隆三朝的重大史实有（）。","options":[{"key":"A","text":"康熙平定“三藩之乱”，统一台湾"},{"key":"B","text":"雍正实行“摊丁入亩”和“改土归流”"},{"key":"C","text":"乾隆平定新疆准噶尔部和大小和卓叛乱"},{"key":"D","text":"乾隆对西藏颁行《钦定藏内善后章程二十九条》"},{"key":"E","text":"雍正签订《尼布楚条约》"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"E 项错误，《尼布楚条约》是康熙时期与沙俄签订的，不是雍正时期。康熙皇帝平定了平西王吴三桂、平南王尚可喜、靖南王耿精忠的“三藩之乱”，统一了台湾，与沙俄签订《尼布楚条约》，划定了中俄东部边界线，维护了国家主权。雍正皇帝实行“摊丁入亩”，将按人头征收的丁银摊入地税中征收，从此取消了人头税制度，促进了人口增长。","type":"多选题"},{"number":135,"stem":"按其麦芽汁的浓度，啤酒可分为（）。","options":[{"key":"A","text":"低浓度啤酒"},{"key":"B","text":"中浓度啤酒"},{"key":"C","text":"高浓度啤酒"},{"key":"D","text":"无醇啤酒"},{"key":"E","text":"黑啤"}],"answer":"ABC","keys":["A","B","C"],"explanation":"D、E 项错误，按麦芽汁浓度啤酒只有低、中、高浓度三类，无醇啤酒、黑啤不属于该分类。按其麦芽汁的浓度，可分为低浓度啤酒（原麦汁浓度 6° - 8° ，酒精含量 2% 左右）、中浓度啤酒（原麦汁浓度 10° -12° ，酒精含量 3.1% -3.8% ）和高浓度啤酒（原麦汁浓度 14° - 20° ，酒精含量 4.9% - 5.6% ）。","type":"多选题"},{"number":136,"stem":"八卦中代表“天、地、雷、风”的是（）。","options":[{"key":"A","text":"乾"},{"key":"B","text":"坤"},{"key":"C","text":"震"},{"key":"D","text":"巽"},{"key":"E","text":"坎"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"乾代表天，坤代表地，震代表雷，巽代表风。","type":"多选题"},{"number":138,"stem":"台湾居民送礼禁忌中，忌送的物品有（）。","options":[{"key":"A","text":"粽子"},{"key":"B","text":"茶叶"},{"key":"C","text":"甜果"},{"key":"D","text":"扇子"},{"key":"E","text":"手帕"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"台湾居民送礼禁忌如下：忌送粽子，因为台湾居民之家习惯包粽子。忌送甜果，甜果在台湾指年糕，是过年的常用祭品。忌送手帕，手帕是丧事完毕后主人送给吊丧者的礼物，寓意与死者永别。忌送扇子，台湾有“送扇，无期见”的俗语。B项错误，茶叶不在台湾居民送礼禁忌之列。","type":"多选题"},{"number":139,"stem":"关于徐家汇教堂，下列说法正确的有（）。","options":[{"key":"A","text":"是上海规模最大的哥特式教堂"},{"key":"B","text":"是中国第一座按西方建筑方式建造的天主教教堂"},{"key":"C","text":"现为天主教上海教区主教座堂"},{"key":"D","text":"曾被誉为“远东第一大教堂”"},{"key":"E","text":"是基督教新教教堂"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"徐家汇教堂是上海规模最大的哥特式教堂，也是中国第一座按西方建筑方式建造的天主教教堂，现为天主教上海教区主教座堂，曾被誉为“远东第一大教堂”。","type":"多选题"},{"number":140,"stem":"广西少数民族舞蹈比较出名的有（）。","options":[{"key":"A","text":"扁担舞"},{"key":"B","text":"铜鼓舞"},{"key":"C","text":"绣球舞"},{"key":"D","text":"芦笙舞"},{"key":"E","text":"孔雀舞"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"广西少数民族舞蹈比较出名的有“扁担舞、铜鼓舞、绣球舞、芦笙舞”等。E项错误，孔雀舞为傣族舞蹈，非广西少数民族舞蹈。","type":"多选题"},{"number":141,"stem":"下列关于早期道教的说法，正确的有（）。","options":[{"key":"A","text":"领导东汉黄巾起义的张角传授的是太平道"},{"key":"B","text":"张陵在蜀中鹤鸣山传播五斗米道"},{"key":"C","text":"太平道和五斗米道即为早期的道教"},{"key":"D","text":"道教因老子宣扬“道”而奉老子为祖师爷"},{"key":"E","text":"早期道教形成于唐朝"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"E 项错误，道教是土生土长的中国宗教，形成于东汉时期（不是唐朝）。与此同时，在蜀中鹤鸣山（今四川省大邑县境内），有张陵（又称张道陵、张“天师”）在传播道教，因信徒入教必须交五斗米，故名“五斗米道”。太平道教和“五斗米道”即为早期的道教。","type":"多选题"},{"number":142,"stem":"我国第一个“五年计划”（1953—1957年）的主持制定者有（）。","options":[{"key":"A","text":"周恩来"},{"key":"B","text":"陈云"},{"key":"C","text":"李富春"},{"key":"D","text":"邓小平"},{"key":"E","text":"刘少奇"}],"answer":"ABC","keys":["A","B","C"],"explanation":"我国第一个“五年计划”（1953—1957年）由周恩来、陈云、李富春主持制定，1955年 7 月经一届全国人大二次会议审议通过。","type":"多选题"},{"number":143,"stem":"下列景区中，属于黑龙江省国家 5A 级旅游景区的有（）。","options":[{"key":"A","text":"哈尔滨市太阳岛景区"},{"key":"B","text":"黑河市五大连池景区"},{"key":"C","text":"牡丹江市镜泊湖景区"},{"key":"D","text":"中国雪乡景区"},{"key":"E","text":"大兴安岭地区北极村旅游景区"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"黑龙江省国家 5A 级旅游景区包括：哈尔滨市太阳岛景区、黑河市五大连池景区、牡丹江市镜泊湖景区、伊春市林海奇石景区、大兴安岭地区北极村旅游景区、鸡西市虎头旅游景区、齐齐哈尔市扎龙生态旅游区。D 项中国雪乡景区位于牡丹江市海林市，虽为冰雪旅游名片，但为国家 4A 级旅游景区，并非 5A，故排除。","type":"多选题"},{"number":144,"stem":"学校开展研学旅行要坚持的原则有（）。","options":[{"key":"A","text":"教育性"},{"key":"B","text":"实践性"},{"key":"C","text":"安全性"},{"key":"D","text":"公益性"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"学校开展研学旅行要坚持教育性、实践性、安全性和公益性原则，把研学旅行纳入教育教学计划，促进其与学校课程有机融合，逐步建立小学阶段以乡土乡情为主、初中阶段以县情市情为主、高中阶段以省情国情为主的课程体系。","type":"多选题"},{"number":145,"stem":"景德镇瓷器以（）的独特风格声海内外。","options":[{"key":"A","text":"“白如玉”"},{"key":"B","text":"“明如镜”"},{"key":"C","text":"“薄如纸”"},{"key":"D","text":"“声如磬”"},{"key":"E","text":"“润如脂”"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"E 项错误。景德镇瓷器造型优美、品种繁多、装饰丰富、风格独特，以“白如玉、明如镜、薄如纸、声如馨”的独特风格声海内外。","type":"多选题"},{"number":146,"stem":"海南的“吃”有四大特点，这四大特点是指（）。","options":[{"key":"A","text":"新鲜"},{"key":"B","text":"天然"},{"key":"C","text":"奇特"},{"key":"D","text":"丰富"},{"key":"E","text":"麻辣"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"海南的“吃”有四大特点: 新鲜、天然、奇特、丰富。","type":"多选题"},{"number":147,"stem":"下列关于除夕食俗的表述, 正确的有 ( )。","options":[{"key":"A","text":"北方有吃饺子的习俗, 离“更岁交子”之意"},{"key":"B","text":"南方多吃年糕, 象征生活步步高"},{"key":"C","text":"家家团聚, 吃团圆饭"},{"key":"D","text":"闭门团坐待旦, 谓之守岁"},{"key":"E","text":"北方吃饺子, 南方也吃饺子"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"E项错误，除夕北方地区有吃饺子的习俗，寓“更岁交子”之意，南方多吃年糕，象征生活步步高，并非南北方都吃饺子。","type":"多选题"},{"number":148,"stem":"下列关于美国的说法，正确的有（）。","options":[{"key":"A","text":"美国是世界第一大经济体"},{"key":"B","text":"国旗是星条旗，国花是玫瑰花"},{"key":"C","text":"纽约是美国最大的城市，也是联合国总部所在地"},{"key":"D","text":"自由女神像是法国送给美国独立 100周年的礼物"},{"key":"E","text":"夏威夷拥有全世界最活跃的火山"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"本题各项表述均正确。美国人口约 3.41亿（截至 2025年 2月），作为世界第一大经济体，其劳动生产率、国内生产总值和对外贸易额均位居世界第一。国旗是星条旗，国花是玫瑰花。旅游景点主要有自由女神像、帝国大厦、时报广场、中央公园、联合国总部大楼、百老汇、华尔街、大都会博物馆等。拥有全世界最活跃的火山，是现代冲浪、草裙舞和夏威夷地方美食的发源地。","type":"多选题"},{"number":149,"stem":"列入《急需保护的非物质文化遗产名录》的中国项目有（）。","options":[{"key":"A","text":"维吾尔族麦西热甫"},{"key":"B","text":"中国水密舱壁帆船制作技艺"},{"key":"C","text":"中国木版活字印刷术"},{"key":"D","text":"赫哲族伊玛堪说唱"},{"key":"E","text":"福建木偶戏传承人培养计划"}],"answer":"ABC","keys":["A","B","C"],"explanation":"2010 年 3 项：新疆维吾尔族麦西热甫、中国水密舱壁帆船制作技艺、中国木版活字印刷术。D 项错误，赫哲族伊玛堪说唱于 2011年列入急需保护名录，2025年已转入人类非物质文化遗产代表作名录；E 项错误，福建木偶戏传承人培养计划为优秀保护实践名册项目。","type":"多选题"},{"number":150,"stem":"下列关于苏轼的说法，正确的有（）。","options":[{"key":"A","text":"号“东坡居士”"},{"key":"B","text":"《水调歌头·明月几时有》是其词作名篇"},{"key":"C","text":"《前赤壁赋》是其散文名篇"},{"key":"D","text":"是婉约派的代表人物"},{"key":"E","text":"“竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生”出自其《定风波》"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"D 项错误，苏轼是豪放派代表人物（与辛弃疾并称），不是婉约派。苏轼（1037～1101年）：字子瞻，号东坡居士，眉山（今四川眉山市）人。宋词流派有以柳永、李清照为代表的婉约派，以苏轼、辛弃疾为代表的豪放派。","type":"多选题"},{"number":151,"stem":"陶瓷烧制是河南风物特产的核心名片，其三大传世瑰宝有（）。","options":[{"key":"A","text":"汝瓷"},{"key":"B","text":"钧瓷"},{"key":"C","text":"唐三彩"},{"key":"D","text":"青花瓷"},{"key":"E","text":"景泰蓝"}],"answer":"ABC","keys":["A","B","C"],"explanation":"陶瓷烧制是河南风物特产的核心名片，拥有汝瓷、钧瓷、唐三彩三大传世瑰宝，更有登封窑、当阳峪绞胎瓷等众多特色窑艺。D 项错误，青花瓷以江西景德镇为代表；E 项错误，景泰蓝为北京传统工艺，均非河南三大传世瑰宝。","type":"多选题"},{"number":152,"stem":"我国著名的云海景观有（）。","options":[{"key":"A","text":"黄山云海"},{"key":"B","text":"庐山云海"},{"key":"C","text":"峨眉云海"},{"key":"D","text":"衡山云海"},{"key":"E","text":"天山云海"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"解析 E 项错误，我国著名的云海景观为黄山云海、庐山云海、峨眉云海、衡山云海，无“天山云海”。","type":"多选题"},{"number":153,"stem":"下列关于山西汾酒、竹叶青酒的说法，正确的有（）。","options":[{"key":"A","text":"汾酒有 4000 多年的悠久历史，被誉为最早国酒"},{"key":"B","text":"竹叶青酒最早以黄酒加竹叶合酿而成，故名"},{"key":"C","text":"竹叶青酒现以汾酒为基酒，添加砂仁、紫檀、当归、陈皮等十余味名贵药材加工而成"},{"key":"D","text":"汾酒是最早以黄酒加竹叶合酿而成的酒"},{"key":"E","text":"竹叶青酒被誉为最早国酒，国之瑰宝"}],"answer":"ABC","keys":["A","B","C"],"explanation":"汾酒有着 4000多年的悠久历史，被誉为最早国酒，国之瑰宝。竹叶青酒是汾酒厂生产的另一品牌名酒，最早是以黄酒加竹叶合酿而成，故名，现以汾酒为基酒，添加砂仁，紫檀、当归、陈皮等十余味名贵药材加工而成。D项错误，最早以黄酒加竹叶合酿而成的是竹叶青酒，非汾酒；E项错误，被誉为“最早国酒，国之瑰宝”的是汾酒，均为张冠李戴。","type":"多选题"},{"number":154,"stem":"下列属于我国世界文化与自然双重遗产的有（）。","options":[{"key":"A","text":"泰山"},{"key":"B","text":"黄山"},{"key":"C","text":"峨眉山及乐山大佛"},{"key":"D","text":"庐山"},{"key":"E","text":"九寨沟"}],"answer":"ABC","keys":["A","B","C"],"explanation":"世界文化与自然双重遗产 4 项: 泰山、黄山、峨眉山及乐山大佛、武夷山。D 项庐山为世界文化景观, E项九寨沟为世界自然遗产, 均非世界文化与自然双重遗产。","type":"多选题"},{"number":155,"stem":"兰州牛肉面的五大特点有( )。","options":[{"key":"A","text":"一清(汤清)"},{"key":"B","text":"二白(萝卜白)"},{"key":"C","text":"三红(辣子油红)"},{"key":"D","text":"四绿(香菜绿)"},{"key":"E","text":"五黄(面条黄亮)"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"兰州牛肉面有一清（汤清）、二白（萝卜白）、三红（辣子油红）、四绿（香菜绿）、五黄（面条黄亮）五大特点。","type":"多选题"},{"number":156,"stem":"下列属于我国著名超级工程之“最”的有（）。","options":[{"key":"A","text":"“云端上的高速”——雅西高速公路"},{"key":"B","text":"世界最复杂立交桥——重庆黄桶湾立交桥"},{"key":"C","text":"港珠澳大桥是世界上里程最长的跨海大桥"},{"key":"D","text":"三峡工程是迄今世界上最大的水利枢纽工程"},{"key":"E","text":"京张高铁是世界上第一条高铁"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"E 项错误，世界上第一条高速铁路是京津城际铁路。此后，公路新建和改建工程在全国铺开，新工艺、新设备、新设计，新技术不断涌现，使我国的公路设计和施工技术很快赶上世界先进水平，涌现出“云端上的高速”——雅西高速公路，世界最复杂立交桥——重庆黄桶湾立交桥（又称盘龙立交桥），世界上里程最长、沉管隧道最长、施工难度最大、技术含量最高、投资金额最多的跨海大桥——港珠澳跨海大桥等著名工程。2003年 11月，三峡工程左岸首批 6台机组投产发电，2006年右岸电站进入机组安装阶段，2020年 11 月三峡工程完成整体竣工验收。","type":"多选题"},{"number":157,"stem":"下列寺庙中，素斋享有盛名的有（）。","options":[{"key":"A","text":"厦门南普陀寺"},{"key":"B","text":"杭州灵隐寺"},{"key":"C","text":"上海玉佛寺"},{"key":"D","text":"成都宝光寺"},{"key":"E","text":"扬州大明寺"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"解析 E 项错误, 扬州大明寺素斋虽有名, 但教材所列“素斋享有盛名”的是厦门南普陀寺、杭州灵隐寺、上海玉佛寺、成都宝光寺、湖北武当山。","type":"多选题"},{"number":158,"stem":"岭南文化主要有若干分支, 下列属于岭南文化分支的有( )。","options":[{"key":"A","text":"广府文化"},{"key":"B","text":"客家文化"},{"key":"C","text":"潮州文化"},{"key":"D","text":"雷州文化"},{"key":"E","text":"妈祖文化"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"岭南文化主要有广府文化、客家文化、潮州文化、雷州文化等分支。","type":"多选题"},{"number":159,"stem":"宁夏回族舞蹈中，主要的民间舞蹈有（）。","options":[{"key":"A","text":"宴席曲"},{"key":"B","text":"汤瓶舞"},{"key":"C","text":"踏脚舞"},{"key":"D","text":"安代舞"},{"key":"E","text":"孔雀舞"}],"answer":"ABC","keys":["A","B","C"],"explanation":"解析在宁夏回族舞蹈中，主要有“宴席曲”“汤瓶舞”和“踏脚舞”三种民间舞蹈。D项错误，安代舞是蒙古族自娱性的传统民间舞蹈；E 项错误，孔雀舞为傣族舞蹈，均非宁夏回族民间舞蹈。","type":"多选题"},{"number":160,"stem":"著名的南水北调中线工程以汉江中上游的丹江口水库为水源地，给（）提供了大量生活和生产用水。","options":[{"key":"A","text":"河南"},{"key":"B","text":"河北"},{"key":"C","text":"北京"},{"key":"D","text":"陕西"},{"key":"E","text":"天津"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"著名的南水北调中线工程就以汉江中上游的丹江口水库为水源地，给河南、河北、北京、天津四省市提供了大量生活和生产用水。D 项错误，陕西不属于南水北调中线工程受水的四省市。","type":"多选题"},{"number":161,"stem":"下列工艺品中，属于甘肃特色工艺品的有（）。","options":[{"key":"A","text":"酒泉夜光杯"},{"key":"B","text":"洮砚"},{"key":"C","text":"庆阳香包"},{"key":"D","text":"蔚县剪纸"},{"key":"E","text":"苏绣"}],"answer":"ABC","keys":["A","B","C"],"explanation":"特色工艺品酒泉夜光杯、洮砚（产于甘南藏族自治州卓尼县）、庆阳香包、兰州刻葫芦与卵石雕、保安腰刀，既是实用器也是艺术品。天水雕漆、临夏砖雕也精美绝伦。D 项蔚县剪纸为河北传统手工艺，E项苏绣为江苏传统手工艺，均非甘肃特色工艺品。","type":"多选题"},{"number":162,"stem":"下列作品与作者对应正确的有（）。","options":[{"key":"A","text":"《兰亭集序》——王羲之"},{"key":"B","text":"《岳阳楼记》——范仲淹"},{"key":"C","text":"《滕王阁序》——王勃"},{"key":"D","text":"《赤壁赋》——苏轼"},{"key":"E","text":"《桃花源记》——谢灵运"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"E项错误，《桃花源记》的作者是陶渊明，不是谢灵运。陶渊明的《桃花源记》《归去来兮辞》《饮酒诗》等。南朝时期的谢灵运和谢朓都爱山水，善诗文，世称谢灵运为“大谢”，谢朓为“小谢”。","type":"多选题"},{"number":163,"stem":"涪陵榨菜是中国对外出口的三大名菜之一，中国对外出口的三大名菜有（）。","options":[{"key":"A","text":"榨菜"},{"key":"B","text":"藏菜"},{"key":"C","text":"竹笋"},{"key":"D","text":"泡菜"},{"key":"E","text":"冬菜"}],"answer":"ABC","keys":["A","B","C"],"explanation":"涪陵榨菜与法国酸黄瓜、德国甜酸甘蓝并称世界三大名腌菜，也是中国对外出口的三大名菜（榨菜、腌菜、竹笋）之一。","type":"多选题"},{"number":164,"stem":"四川省河流的主体属于长江水系，下列属于其著名支流的有（）。","options":[{"key":"A","text":"金沙江"},{"key":"B","text":"雅砻江"},{"key":"C","text":"大渡河"},{"key":"D","text":"珠江"},{"key":"E","text":"乌江"}],"answer":"ABC","keys":["A","B","C"],"explanation":"四川省河流的主体属于长江水系，有金沙江、雅砻江、大渡河、岷江、沱江、嘉陵江等著名支流。D 项珠江不流经四川；E项乌江主要流经贵州、重庆，均非四川省河流的著名支流。","type":"多选题"},{"number":165,"stem":"中国古典园林的特色有（）。","options":[{"key":"A","text":"顺应自然的指导思想"},{"key":"B","text":"诗情画意的艺术风格"},{"key":"C","text":"力求含蓄的造园手法"},{"key":"D","text":"对称规整的布局方式"},{"key":"E","text":"追求奢华的装饰风格"}],"answer":"ABC","keys":["A","B","C"],"explanation":"D、E 项错误，中国古典园林的特色是顺应自然的指导思想、诗情画意的艺术风格、力求含蓄的造园手法，不采用对称规整的布局，也不追求奢华的装饰风格。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD六/LDD押题第6卷（科目三四）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD六/LDD押题第6卷（科目三四）-试卷.pdf"}]},{"number":7,"subjects":[{"name":"科目一二","questions":[{"number":1,"stem":"根据《中华人民共和国宪法》的规定，婚姻、家庭、母亲和儿童受国家保护，禁止虐待老人、妇女、儿童和残疾人。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。宪法第 49 条规定了家庭美德——婚姻、家庭、母亲和儿童受国家保护，禁止破坏婚姻自由，禁止虐待老人、妇女和儿童。在“家庭美德”，“老人、妇女、儿童”符合对家庭角色的描述，“残疾人”错误。","type":"判断题"},{"number":2,"stem":"《民法典》规定，无权代理人以被代理人的名义订立合同，即使被代理人已经开始履行合同义务或者接受相对人履行的，该合同依然无效。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《民法典》第 503条规定，无权代理人以被代理人的名义订立合同，被代理人已经开始履行合同义务或者接受相对人履行的，视为对合同的追认。此处，被代理人已经用行动表明接受了合同，也就是“默示”，此种情况合同相当于被追认，是有效的。故本题说法错误。","type":"判断题"},{"number":3,"stem":"导游因强迫游客消费，被“人肉搜索”，并在网上首次披露其婚姻状况、家庭背景等事实。该行为侵害了导游的隐私权。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。《民法典》第 1032 条，自然人享有隐私权。任何组织或者个人不得以刺探、侵扰、泄露、公开等方式侵害他人的隐私权。","type":"判断题"},{"number":4,"stem":"《旅行社条例》规定，申请设立旅行社，经营国内旅游业务和入境旅游业务的，应当向县级以上旅游行政管理部门提交相关文件。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。是“向省、自治区、直辖市旅游行政管理部门提交相关文件”。故本题说法错误。","type":"判断题"},{"number":5,"stem":"经营者租赁他人柜台开展经营，应当以显著方式标明自身真实名称和标记。柜台场地出租者应当核验、更新、公示场内经营者信息供消费者查询。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。经营者租赁他人柜台或者场地提供商品或者服务，或者通过宣讲、抽奖、集中式体验等方式提供商品或者服务的，应当以显著方式标明其真实名称和标记。柜台、场地的出租者应当建立场内经营管理制度，核验、更新、公示经营者的相关信息，供消费者查询。（第 13 条）","type":"判断题"},{"number":6,"stem":"根据《旅游投诉处理办法》第 5 条的规定，需要立即制止、纠正旅游经营者的损害行为的，应当由旅游经营者住所地的旅游投诉处理机构管辖。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《旅游投诉处理办法》第 5条第 2 款明确规定，需要立即制止、纠正旅游经营者的损害行为的，应当由旅游纠纷发生地旅游投诉处理机构管辖。","type":"判断题"},{"number":7,"stem":"《导游管理办法》规定，导游在执业过程中携带的电子导游证和导游身份标识，在旅游行政管理部门依法监督检查时需要出具；在旅游活动过程中，旅游者有权要求展示。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。《导游管理办法》第 20条，导游在执业过程中应当携带电子导游证、佩戴导游身份标识，并开启导游执业相关应用软件。旅游者有权要求导游展示电子导游证和导游身份标识。","type":"判断题"},{"number":8,"stem":"根据《安全生产法》，生产经营单位不得因从业人员拒绝违章指挥、强令冒险作业而降低其工资、福利等待遇或者解除与其订立的劳动合同。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。根据《安全生产法》第 54条规定，生产经营单位不得因从业人员拒绝违章指挥、强令冒险作业而降低其工资、福利等待遇或者解除与其订立的劳动合同。","type":"判断题"},{"number":9,"stem":"根据《旅游投诉处理办法》的规定，旅游投诉处理机构接到投诉，应当在三个工作日以内决定是否受理。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《旅游投诉处理办法》第 14条规定，旅游投诉处理机构接到投诉，应当在二个工作日以内决定是否受理。时限是“二个工作日”，而非“三个工作日”。","type":"判断题"},{"number":10,"stem":"根据《自然保护区条例》的规定，除国家级以外的其他自然保护区，列为地方级自然保护区。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《自然保护区条例》第十二条：自然保护区分为国家级自然保护区和省级自然保护区。在国内外有典型意义、在科学上有重大国际影响或者有特殊科学研究价值的自然保护区，以及涉及国家海洋权益的自然保护区，列为国家级自然保护区。其他自然保护区列为省级自然保护区。","type":"判断题"},{"number":11,"stem":"根据《文物保护法》的规定，文物工作贯彻抢救为主、保护第一、合理利用、加强管理的方针。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。文物工作贯彻保护为主、抢救第一、合理利用、加强管理的方针。故本题说法错误。","type":"判断题"},{"number":12,"stem":"人民是依法治国的主体和力量源泉，人民代表大会制度是保证人民当家作主的根本政治制度。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":13,"stem":"依据习近平新时代中国特色社会主义思想相关理论，中国特色社会主义进入新时代，党面临的主要任务是实现第一个百年奋斗目标，开启实现第二个百年奋斗目标新征程，朝着基本实现现代化的宏伟目标继续前进。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。文档原文：中国特色社会主义进入新时代。党面临的主要任务是，实现第一个百年奋斗目标，开启实现第二个百年奋斗目标新征程，朝着实现中华民族伟大复兴的宏伟目标继续前进。“基本实现现代化”是 2035年阶段性发展目标，正确表述是“实现中华民族伟大复兴”。","type":"判断题"},{"number":14,"stem":"《宗教事务条例》规定，各宗教坚持独立自主的原则，宗教团体、宗教院校、宗教活动场所和宗教事务不受外国势力的支配。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。前半句表述错误。应把独立自主改为独立自主自办。","type":"判断题"},{"number":15,"stem":"《港区国安法》规定，香港特别行政区负有维护国家安全的根本责任。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。根据《港区国安法》第 3 条第 1款规定：“中央人民政府对香港特别行政区有关的国家安全事务负有根本责任。”因此，题干将“中央人民政府”误述为“香港特别行政区”，属于主体错误。虽然香港特区有维护国家安全的宪制责任（见第 10条），但“根本责任”在中央，体现国家主权和安全事务的最高领导权属于中央人民政府。正确表述应为：“中央人民政府对香港特别行政区有关的国家安全事务负有根本责任。”","type":"判断题"},{"number":16,"stem":"根据《关于印发 2026 年版团队旅游合同（示范文本）的通知》，2026 年版团队旅游合同在原有文本基础上，新增《境内旅游组团社与地接社合同》和《研学旅游合同（示范文本）》。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。合同文本扩充为 6 套，新增《境内旅游组团社与地接社合同》《研学旅游合同（示范文本）》。","type":"判断题"},{"number":17,"stem":"2026年是“十五五”开局之年，旅游大国建设首次写入国家五年规划。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“旅游强国建设”。旅游强国建设首次写入国家五年规划——2026年为“十五五”开局之年，提法出自 2026年 5 月文旅部“5·19中国旅游日”新闻发布会。","type":"判断题"},{"number":18,"stem":"2026年 10月 22日，纪念中国工农红军长征胜利 100周年大会在北京人民大会堂隆重举行，习近平出席大会并发表重要讲话。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“90周年”。1936年 10月，红军三大主力在甘肃会宁、宁夏将台堡胜利会师，标志长征胜利结束。2026年 10月 22日，纪念中国工农红军长征胜利 90周年大会在北京人民大会堂隆重举行，中共中央总书记、国家主席、中央军委主席习近平出席大会并发表重要讲话。","type":"判断题"},{"number":19,"stem":"2026年米兰—科尔蒂纳丹佩佐冬奥会上，中国代表团共获得 5金 4银 6铜 15枚奖牌，创我国境外参赛历史最好成绩。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。米兰冬奥会——2026 年 2 月 6 日至 22 日在意大利举行，中国代表团 5 金 4 银 6 铜共 15枚奖牌，创境外参赛历史最好成绩。","type":"判断题"},{"number":20,"stem":"2026年 11 月 12 日是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱孙中山先生诞辰 160周年纪念日，全国政协届时举行隆重纪念活动。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。2026年 11月 12日是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱孙中山先生诞辰 160周年纪念日，全国政协届时举行隆重纪念活动。香港特别行政区政府于 11月 12 日上午在中环中山纪念公园举行官方纪念仪式，香港邮政同日发行特别邮票。","type":"判断题"},{"number":21,"stem":"热爱社会主义祖国是成为一名合格的中国导游的首要条件。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":22,"stem":"安全检查不存在任何特殊的免检对象，不分男女、国籍和等级，均须接受安全检查。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":23,"stem":"国际旅游界对导游的重视程度极高，称其为“旅游业的灵魂”“旅行社的支柱”和“参观游览活动的导演”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。国际旅游界对导游的重视程度极高，称其为“旅游业的灵魂”“旅行社的支柱”和“参观游览活动的导演”。","type":"判断题"},{"number":24,"stem":"用餐结束后，地陪应严格按照团队人数、标准、饮用酒水数量等，直接付款或在结算单上签字。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。用餐结束后，地陪应严格按照实际用餐人数、标准、饮用酒水数量等核实餐厅开列的账单，直接付款或在结算单上签字。","type":"判断题"},{"number":25,"stem":"若旅游团抵达后直接前往游览点，核商日程可选择在机场或行车途中进行。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":26,"stem":"导游领队应兼具为游客提供服务与监督游客文明旅游两项职责。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。导游领队应兼具为游客提供服务，与引导游客文明旅游两项职责。","type":"判断题"},{"number":27,"stem":"旅行社制定团队旅游计划时，游客与导游总人数不得超过车辆核定乘员数。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":28,"stem":"导游带团时应当将长句转化为短句，把口语转化为书面语言，力求表达认真严谨。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。导游应当将长句转化为短句，把书面语转化为口语，从而使表达更为浅显明白。","type":"判断题"},{"number":29,"stem":"将同类但在规模、质量、风格、水平、面积等方面不同的事物或现象进行比较，是同类相异类比。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":30,"stem":"“胡雪岩奉行采办务真的理念，老百姓都喜欢到胡庆余堂看病抓药，即使药方还没开，人的病就已经好了三分。”这段话采用的是超前类夸张的手法进行表达。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":31,"stem":"依据规定，导游执业时应携带电子导游证、佩戴导游身份标识，并开启导游执业相关应用软件。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":32,"stem":"政务团重视做事效率，时间安排紧凑，导游在接待安排中应提供快速高效的服务。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。商务旅游者重视做事效率，时间安排紧凑。导游在接待安排中应提供快速高效的服务。政务团严格按要求执行，确保每个环节都符合政务接待标准。","type":"判断题"},{"number":33,"stem":"导游带领研学团旅行时，应避免使用粗俗口头禅，多进行正面积极的引导，为学生树立良好的榜样。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":34,"stem":"一旦发现客房有蟑螂、臭虫、老鼠，导游要立即要求饭店客房部门进行打扫，打扫完毕客人仍不满意，需要调换房间。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。一旦发现客房有蟑螂、臭虫、老鼠，旅游者提出换房，要立即满足，必要时调换饭店。","type":"判断题"},{"number":35,"stem":"若发现个别旅游者存在走私文物等可疑行为，导游要耐心劝阻，动之以理，晓之以情，确保旅游者的购买行为合法合规。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。若发现个别旅游者存在走私文物等可疑行为，导游必须立即向有关部门报告，确保旅游者的购买行为合法合规。","type":"判断题"},{"number":36,"stem":"旅游者要求亲友随团活动，在条件允许且不影响其他人的情况下，可满足旅游者要求，但事先要征得领队和旅游团其他成员的同意。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":37,"stem":"遭遇火灾时，导游首先应迅速组织旅游者通过安全出口疏散撤离，不搭乘电梯或随意跳楼。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。遭遇火灾时，导游首先应报警。","type":"判断题"},{"number":38,"stem":"如果遭遇海啸，不幸落水，要迅速脱掉身上衣服，否则衣服吸水会加速沉入水底。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。如果遭遇海啸，不幸落水，不能脱掉衣服，即使吸水变重。海水温度低，衣物可减缓体温流失（失温风险>负重风险）。","type":"判断题"},{"number":39,"stem":"笔记本电脑和平板电脑在飞机滑行、起飞或者降落等阶段禁止使用。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":40,"stem":"乘船旅行时，随身携带打火机数量应不超过 2 个。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。旅游乘船旅行时，携带打火机数量需要≤2个。二、单选题","type":"判断题"},{"number":41,"stem":"2026年 3 月 12日，十四届全国人大四次会议表决通过了关于（ ）的决议。","options":[{"key":"A","text":"《中华人民共和国国民经济和社会发展第十四个五年规划和 2035年远景目标纲要》"},{"key":"B","text":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"key":"C","text":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》"},{"key":"D","text":"2026年国民经济和社会发展计划"}],"answer":"B","keys":["B"],"explanation":"2026 年 3 月 12 日，十四届全国人大四次会议表决通过关于国民经济和社会发展第十五个五年规划纲要的决议。“十五五”规划纲要共 7 万余字、18 篇 62 章，从党的二十届四中全会审议通过规划建议，到全国人大审查批准规划纲要，党的主张通过法定程序转化为国家意志。","type":"单选题"},{"number":42,"stem":"根据《中华人民共和国宪法》的规定，中国人民政治协商会议是（ ）。","options":[{"key":"A","text":"国家权力机关"},{"key":"B","text":"中国共产党领导的多党合作和政治协商制度的重要组织形式"},{"key":"C","text":"国家行政机关"},{"key":"D","text":"国家司法机关"}],"answer":"B","keys":["B"],"explanation":"宪法序言明确规定“中国共产党领导的多党合作和政治协商制度将长期存在和发展”，中国人民政治协商会议是这一制度的重要组织形式，发挥统一战线作用，在政治协商、民主监督、参政议政中具有重要功能。A 项错误，中国人民政治协商会议不是国家权力机关；C项错误，人民政协不是国家行政机关；D项错误，人民政协不是国家司法机关。人民政协是中国共产党领导的多党合作和政治协商制度的重要组织形式，发挥统一战线作用。","type":"单选题"},{"number":43,"stem":"根据《中华人民共和国宪法》的规定，国有经济（全民所有制经济）在国民经济中的地位是（ ）。","options":[{"key":"A","text":"主导力量"},{"key":"B","text":"基础"},{"key":"C","text":"主体"},{"key":"D","text":"重要组成部分"}],"answer":"A","keys":["A"],"explanation":"国有经济（全民所有制）是国民经济中的主导力量，国家保障国有经济的巩固和发展（第 7 条）。","type":"单选题"},{"number":44,"stem":"根据《中华人民共和国宪法》序言的规定，我国的历史使命是（ ）。","options":[{"key":"A","text":"实现中华民族伟大复兴"},{"key":"B","text":"全面建成小康社会"},{"key":"C","text":"实现现代化"},{"key":"D","text":"构建人类命运共同体"}],"answer":"A","keys":["A"],"explanation":"宪法序言指出：把我国建设成为富强民主文明和谐美丽的社会主义现代化强国，实现中华民族伟大复兴。历史使命：实现中华民族伟大复兴。选项辨析：B 项错误，全面建成小康社会是阶段性发展目标；C项错误，实现四个现代化是实现历史使命的具体路径和内容之一；D 项错误，构建人类命运共同体是对外交关系的描述。","type":"单选题"},{"number":45,"stem":"我国宪法规定，任何公民，非经人民检察院批准或者决定或者人民法院决定，并由（ ）执行，不受逮捕。","options":[{"key":"A","text":"公安机关"},{"key":"B","text":"所在地人民政府"},{"key":"C","text":"人民检察院"},{"key":"D","text":"人民法院"}],"answer":"A","keys":["A"],"explanation":"任何公民，非经人民检察院批准或者决定或者人民法院决定，并由公安机关执行，不受逮捕。","type":"单选题"},{"number":46,"stem":"《旅游法》共设 10 章 112条，其中第（ ）章规定了旅游经营。","options":[{"key":"A","text":"5"},{"key":"B","text":"4"},{"key":"C","text":"3"},{"key":"D","text":"2"}],"answer":"B","keys":["B"],"explanation":"《旅游法》共设 10章 112条，分为总则、旅游者、旅游规划和促进、旅游经营、旅游服务合同、旅游
