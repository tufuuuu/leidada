:"心脑血管病人每次泡温泉时间不能超过()。","options":[{"key":"A","text":"10分钟"},{"key":"B","text":"20分钟"},{"key":"C","text":"30分钟"},{"key":"D","text":"40分钟"}],"answer":"B","keys":["B"],"explanation":"高血压/心脑血管疾病患者，规则服药或医生允许后浸泡，每次≤20分钟。三、多项选择题（131‑ 165）","type":"单选题"},{"number":131,"stem":"根据《中华人民共和国宪法》的规定，下列属于我国基本政治制度的有()。","options":[{"key":"A","text":"人民代表大会制度"},{"key":"B","text":"中国共产党领导的多党合作和政治协商制度"},{"key":"C","text":"民族区域自治制度"},{"key":"D","text":"基层群众自治制度"},{"key":"E","text":"经济特区制度"}],"answer":"BCD","keys":["B","C","D"],"explanation":"我国宪法确立了三项基本政治制度：中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度。人民代表大会制度是我国的根本政治制度，不属于基本政治制度。 A项错误，人民代表大会制度是我国的根本政治制度，不属于基本政治制度；E项错误，经济特区制度是经济管理方面的制度安排，不属于政治制度范畴。","type":"多选题"},{"number":132,"stem":"根据《中华人民共和国宪法》关于财产保护制度的规定，下列说法正确的有()。","options":[{"key":"A","text":"社会主义公共财产神圣不可侵犯"},{"key":"B","text":"国家为了公共利益的需要，可以依法对土地实行征收或者征用并给予补偿"},{"key":"C","text":"国家为了公共利益的需要，可以依法对私有财产实行征收、征用并给予补偿"},{"key":"D","text":"国家可以对公民的私有财产无偿征用"},{"key":"E","text":"社会主义公共财产可以被任何组织或个人任意处置"}],"answer":"ABC","keys":["A","B","C"],"explanation":"社会主义公共财产神圣不可侵犯(第 12条)；公民合法的私有财产不受侵犯(第 13 条)。国家因公共利益需要，可依法对土地或私有财产实行征收、征用并给予补偿(第 10 条、第13条)。","type":"多选题"},{"number":133,"stem":"根据《中华人民共和国宪法》的规定，下列土地属于集体所有的有()。","options":[{"key":"A","text":"农村和城市郊区的土地(法律规定属于国家所有的除外)"},{"key":"B","text":"城市土地"},{"key":"C","text":"自留地"},{"key":"D","text":"自留山"},{"key":"E","text":"宅基地"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"农村和城市郊区的土地，除法律规定属于国家所有的以外，属于集体所有；宅基地和自留地、自留山，也属于集体所有（第 10 条）。B 项错误，城市土地属于国家所有（第 10条），不属于集体所有。","type":"多选题"},{"number":134,"stem":"《旅游法》明确规定，在旅游活动中依照法律、法规和有关规定享受便利和优惠的旅游者包括()。","options":[{"key":"A","text":"残疾人"},{"key":"B","text":"教师"},{"key":"C","text":"未成年人"},{"key":"D","text":"老年人"},{"key":"E","text":"军人"}],"answer":"ACD","keys":["A","C","D"],"explanation":"《旅游法》第 11 条规定，残疾人、老年人、未成年人等旅游者在旅游活动中依照法律、法规和有关规定享受便利和优惠。","type":"多选题"},{"number":135,"stem":"按照《旅游法》的规定，国务院和县级以上地方人民政府应当根据实际情况安排资金，加强()。","options":[{"key":"A","text":"旅游市场竞争力"},{"key":"B","text":"旅游基础设施建设"},{"key":"C","text":"旅游服务质量提升"},{"key":"D","text":"旅游公共服务"},{"key":"E","text":"旅游形象推广"}],"answer":"BDE","keys":["B","D","E"],"explanation":"《旅游法》第 24条，国务院和县级以上地方人民政府应当根据实际情况安排资金，加强旅游基础设施建设、旅游公共服务和旅游形象推广。","type":"多选题"},{"number":136,"stem":"下列选项中，属于可撤销的民事法律行为的有()。","options":[{"key":"A","text":"基于误解实施的民事法律行为"},{"key":"B","text":"因一方欺诈，当事人在违背真实意思的情况下实施的民事法律行为"},{"key":"C","text":"因第三人胁迫，当事人在违背真实意思的情况下实施的民事法律行为"},{"key":"D","text":"一方利用对方处于危困状态，致使成立时显失公平的民事法律行为"},{"key":"E","text":"行为人与相对人恶意串通，损害他人合法权益的民事法律行为"}],"answer":"BCD","keys":["B","C","D"],"explanation":"依据《民法典》第 147‑ 151条规定，可撤销的民事法律行为包括：1基于重大误解实施的民事法律行为；2因一方或者第三人的欺诈、胁迫，当事人在违背真实意思的情况下实施的民事法律行为；3一方利用对方处于危困状态、缺乏判断能力等情形，致使成立时显失公平的民事法律行为。\"基于误解实施的民事法律行为\"错误，应当是重大误解。\"行为人与相对人恶意串通……\"属于无效的民事法律行为，故错误。其余选项描述正确。","type":"多选题"},{"number":137,"stem":"张某在某动物园喂食鸵鸟时，因李某挑衅并激怒鸵鸟，造成张某被咬伤。下列关于张某权利的描述，正确的是()。","options":[{"key":"A","text":"张某只能向李某请求赔偿"},{"key":"B","text":"张某只能向动物园请求赔偿"},{"key":"C","text":"张某可以向动物园和李某请求共同赔偿"},{"key":"D","text":"张某可以向动物园请求赔偿，也可以向李某请求赔偿"},{"key":"E","text":"动物园赔偿张某后，有权向李某追偿"}],"answer":"DE","keys":["D","E"],"explanation":"《民法典》第 1250条规定，因第三人的过错致使动物造成他人损害的，被侵权人可以向动物饲养人或者管理人请求赔偿，也可以向第三人请求赔偿。动物饲养人或者管理人赔偿后，有权向第三人追偿。","type":"多选题"},{"number":138,"stem":"《中华人民共和国民法典》规定，()的，当事人可以解除合同。","options":[{"key":"A","text":"在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务"},{"key":"B","text":"因不可抗力致使不能实现合同目的"},{"key":"C","text":"当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的"},{"key":"D","text":"债权人转让债权，未通知债务人"},{"key":"E","text":"当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"\"债权人转让债权，未通知债务人\"是合同转让的情形。即便债权人转让债权，未通知债务人，产生的后果是转让无效，并不会导致合同解除。其余选项描述正确。","type":"多选题"},{"number":139,"stem":"某旅行社导游韩某以限制活动自由的方式，强迫旅游者参加购物活动，根据《旅游法》的规定，韩某受到的处罚是()。","options":[{"key":"A","text":"没收违法所得"},{"key":"B","text":"处 2000 元以上 2 万元以下罚款"},{"key":"C","text":"责令退还"},{"key":"D","text":"并暂扣或者吊销导游证"},{"key":"E","text":"情节严重的，吊销导游证并予以公告"}],"answer":"ABD","keys":["A","B","D"],"explanation":"《旅游法》第 98 条，获取购物场所、另行付费旅游项目等相关经营者以回扣、佣金、人头费或者奖励费等名义给予的不正当利益，没收违法所得，处 2000元以上 2万元以下罚款，并暂扣或者吊销导游证。","type":"多选题"},{"number":140,"stem":"导游员小张在带团前往欧洲旅游时，旅游团集体遭到抢劫。根据《旅行社条例》的规定，此时小张应当向 ( )报告。","options":[{"key":"A","text":"旅游行政管理部门"},{"key":"B","text":"公安机关"},{"key":"C","text":"相关驻外机构"},{"key":"D","text":"当地警方"},{"key":"E","text":"中国驻该国使领馆"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"《旅行社条例》第 39条规定，发生危及旅游者人身安全的情形的，旅行社及其委派的导游人员、领队人员应当采取必要的处置措施并及时报告旅游行政管理部门；在境外发生的，还应当及时报告中华人民共和国驻该国使领馆、相关驻外机构、当地警方。","type":"多选题"},{"number":141,"stem":"导游张某在带团过程中，利用旅游大巴车返程的时间向旅游者兜售物品，根据《导游人员管理条例》的规定，张某应当受到的处罚是()。","options":[{"key":"A","text":"由市场监督管理部门责令改正"},{"key":"B","text":"处 1000 元以上 3 万元以下的罚款"},{"key":"C","text":"有违法所得的，责令退还"},{"key":"D","text":"情节严重的，由相关部门吊销导游证并予以公告"},{"key":"E","text":"对其所在的旅行社给予警告直至责令停业整顿"}],"answer":"BDE","keys":["B","D","E"],"explanation":"《导游人员管理条例》第 23 条，导游人员进行导游活动，向旅游者兜售物品或者购买旅游者的物品的，或者以明示或者暗示的方式向旅游者索要小费的，由旅游行政部门责令改正，处 1000 元以上 3 万元以下的罚款；有违法所得的，并处没收违法所得；情节严重的，由省、自治区、直辖市人民政府旅游行政部门吊销导游证并予以公告；对委派该导游人员的旅行社给予警告直至责令停业整顿。\"由市场监督管理部门责令改正\"错误，是\"旅游行政部门\"；\"有违法所得的，责令退还\"错误，是\"有违法所得的，并处没收违法所得\"。","type":"多选题"},{"number":142,"stem":"依据《导游管理办法》，导游应当自下列()情形发生之日起 10个工作日内，通过全国旅游监管服务信息系统提交相应材料，申请变更导游证信息。","options":[{"key":"A","text":"姓名、身份证号、导游等级和语种等信息发生变化的"},{"key":"B","text":"与旅行社订立的劳动合同解除后，在 3 个月内未与其他旅行社订立劳动合同的"},{"key":"C","text":"在旅游行业组织取消注册后，3个月内在其他旅游行业组织注册的"},{"key":"D","text":"经常执业地区发生变化的"},{"key":"E","text":"与导游签订旅游合同的旅行社地址发生变化的"}],"answer":"ACD","keys":["A","C","D"],"explanation":"《导游管理办法》第 15 条规定，导游应当自下列情形发生之日起 10个工作日内，通过全国旅游监管服务信息系统提交相应材料，申请变更导游证信息：姓名、身份证号、导游等级和语种等信息发生变化的； 与旅行社订立的劳动合同解除、终止或者在旅游行业组织取消注册后，在 3个月内与其他旅行社订立劳动合同或者在其他旅游行业组织注册的；经常执业地区发生变化的； 其他导游身份信息发生变化的。","type":"多选题"},{"number":143,"stem":"根据《旅游投诉处理办法》第 13 条的规定，关于共同投诉，下列说法正确的有()。","options":[{"key":"A","text":"投诉人四人以上，以同一事由投诉同一被投诉人的，为共同投诉"},{"key":"B","text":"共同投诉可以由投诉人推选一至三名代表人进行投诉"},{"key":"C","text":"代表人参加旅游投诉处理机构处理投诉过程的行为，对全体投诉人发生效力"},{"key":"D","text":"代表人变更、放弃投诉请求或者进行和解，应当经多数投诉人同意"},{"key":"E","text":"共同投诉应当由投诉人推选一至三名代表人进行投诉"}],"answer":"ABC","keys":["A","B","C"],"explanation":"《旅游投诉处理办法》第 13条规定：\"投诉人四人以上，以同一事由投诉同一被投诉人的，为共同投诉。共同投诉可以由投诉人推选一至三名代表人进行投诉。代表人参加旅游投诉处理机构处理投诉过程的行为，对全体投诉人发生效力，但代表人变更、放弃投诉请求或者进行和解，应当经全体投诉人同意。\"A、B、C 正确。D错误：是\"应当经全体投诉人同意\"；E错误：是\"可以\"不是\"应当\"。","type":"多选题"},{"number":144,"stem":"旅行社违反《旅游安全管理办法》的规定，()，由旅游主管部门给予警告，可并处 2000元以下罚款；情节严重的，处 2000元以上 10000 元以下罚款。","options":[{"key":"A","text":"不按要求制作安全信息卡"},{"key":"B","text":"未将安全信息卡交由旅游者"},{"key":"C","text":"未告知旅游者相关信息"},{"key":"D","text":"未制止旅游者的的非法、不安全行为"},{"key":"E","text":"旅游主管部门及其工作人员违反相关法律、法规及本办法规定，玩忽职守，未履行安全管理职责的"}],"answer":"ABC","keys":["A","B","C"],"explanation":"《旅游安全管理办法》第 34 条规定，旅行社未制止履行辅助人的非法、不安全服务行为，或者未更换履行辅助人的，旅游主管部门给予警告，可并处 2000元以下罚款；情节严重的，处 2000 元以上 10000 元以下罚款。第 35 条规定，不按要求制作安全信息卡，未将安全信息卡交由旅游者，或者未告知旅游者相关信息的，旅游主管部门给予警告，可并处 2000元以下罚款；情节严重的，处 2000 元以上 10000 元以下罚款。选项\"旅游主管部门及其工作人员……\"惩罚措施有误。《旅游安全管理办法》第 38 条规定，旅游主管部门及其工作人员违反相关法律、法规及本办法规定，玩忽职守，未履行安全管理职责的，由有关部门责令改正，对直接负责的主管人员和其他直接责任人员依法给予处分。","type":"多选题"},{"number":145,"stem":"依据《旅游投诉处理办法》，下列关于旅游投诉一般处理程序的表述，正确的是()。","options":[{"key":"A","text":"被投诉人应当在接到通知之日起 10 日内做出书面答复"},{"key":"B","text":"投诉人和被投诉人应当对自己的投诉或者答辩提供证据"},{"key":"C","text":"鉴定、检测的时间计入投诉处理时间"},{"key":"D","text":"旅游投诉处理机构受理投诉后，应当及时向被投诉人送《旅游投诉处理通知书》以及投诉材料副本"},{"key":"E","text":"旅游投诉处理机构应当在受理旅游投诉之日起 60 个工作日内作出处理"}],"answer":"BD","keys":["B","D"],"explanation":"《旅游投诉处理办法》第十五条对于情况复杂的，应当填写《旅游投诉处理通知书》，与有关投诉材料副本一并送达被投诉人；被投诉人应当在接到通知之日起五个工作日内作出书面答复，提出事实、理由和答辩意见。投诉人和被投诉人应当对自己的投诉或者答辩提供证据。旅游投诉处理机构应当对双方当事人提出的事实、理由及证据进行审查。第二十三条旅游投诉处理机构应当在受理旅游投诉之日起六十日以内，作出处理。A项错误：被投诉人答复期限为接到通知之日起 5 个工作日，不是 10 日。B项正确：投诉人和被投诉人负有举证义务，应当对自己的主张提供证据。C 项错误：新法规定鉴定，检测时间不计入投诉处理期限。D项正确：情况复杂的投诉，需要向被投诉人送达《旅游投诉处理通知书》及投诉材料副本。E项错误：法定期限是 60日(自然日)，不是 60个工作日。","type":"多选题"},{"number":146,"stem":"根据《娱乐场所管理条例》的规定，以下()情形下，情节严重的，由公安部门责令停业整顿 1个月至 3个月。","options":[{"key":"A","text":"包厢、包间的设置以及门窗的使用不符合本条例规定的"},{"key":"B","text":"未按照本条例规定安装闭路电视监控设备的"},{"key":"C","text":"违反娱乐场所内禁止娱乐活动规定"},{"key":"D","text":"以现金、有价证券作为奖品的，且情节严重"},{"key":"E","text":"回购奖品的，且情节严重"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"选项\"违反娱乐场所内禁止娱乐活动规定\"由县级公安部门没收违法所得和非法财物，责令停业整顿 3个月至 6个月。","type":"多选题"},{"number":147,"stem":"习近平新时代中国特色社会主义思想的历史地位和重大意义包括()。","options":[{"key":"A","text":"相对于理论意义，更具有实践指导意义"},{"key":"B","text":"是当代中国马克思主义、二十一世纪马克思主义"},{"key":"C","text":"是中华文化和中国精神的时代精华"},{"key":"D","text":"实现了马克思主义中国化新的飞跃"},{"key":"E","text":"是新时代新征程全党全国各族人民的行动指南"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"答案选 BCDE。这一思想是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化新的飞跃，也是新时代新征程全党全国各族人民的行动指南。A项该思想兼具重大理论意义与实践指导意义，表述错误。","type":"多选题"},{"number":148,"stem":"导游服务的纽带作用主要体现在()。","options":[{"key":"A","text":"沟通上下"},{"key":"B","text":"连接内外"},{"key":"C","text":"协调左右"},{"key":"D","text":"串联古今"},{"key":"E","text":"跨越中西"}],"answer":"ABC","keys":["A","B","C"],"explanation":"导游服务是旅游接待服务的核心和纽带，在旅游服务各环节之间发挥着关键的沟通、联络及协调功能：沟通上下；连接内外；协调左右。","type":"多选题"},{"number":149,"stem":"关于握手礼仪的描述，正确的是()。","options":[{"key":"A","text":"握手一定要伸右手，伸左手是不礼貌的"},{"key":"B","text":"握手的时间以三至五秒为宜"},{"key":"C","text":"无论男女握手力度平等"},{"key":"D","text":"如果手上戴有手套，应当先将手套去掉"},{"key":"E","text":"男士同女士握手时，一般只轻握对方的手指部分"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"握手礼仪：握手一定要伸右手，伸左手是不礼貌的；握手的时间以三至五秒为宜；力度适中：用力大小也应适度。对男子可以稍重些，对女子则应轻柔；如果手上戴有手套，应当先将手套去掉；男士同女士握手时，一般只轻握对方的手指部分。","type":"多选题"},{"number":150,"stem":"地陪导游的离店服务工作包括()。","options":[{"key":"A","text":"提醒注意事项"},{"key":"B","text":"办理退房手续"},{"key":"C","text":"致欢送词"},{"key":"D","text":"集合登车"},{"key":"E","text":"商定出发时间"}],"answer":"ABD","keys":["A","B","D"],"explanation":"离店服务工作：提醒注意事项；办理退房手续；集合登车。致欢送词、商定出发时间属于送行服务。","type":"多选题"},{"number":151,"stem":"计划外的文娱活动，导游处理得当的是()。","options":[{"key":"A","text":"地陪应准确告知演出时间、地点和票价等信息"},{"key":"B","text":"导游需要协助其购票"},{"key":"C","text":"一般情况下不陪同前往"},{"key":"D","text":"若游客想观看不健康的文娱节目地陪应明确拒绝"},{"key":"E","text":"对于入境旅游者，地陪需做好剧情介绍及必要的翻译工作"}],"answer":"ACD","keys":["A","C","D"],"explanation":"(1)提供准确信息(可协助购票，一般不陪同)：对于旅游者自行要求观看的计划外文娱节目，地陪应准确告知演出时间、地点和票价等信息，必要时可协助其购票，但一般情况下不陪同前往。(2)拒绝不健康活动(法律引导)：若旅游者欲观看不健康的文娱节目或参与不正常的夜生活活动，地陪应明确拒绝，并向其阐述我国相关法律法规，引导旅游者文明旅游。","type":"多选题"},{"number":152,"stem":"全陪在带团过程中，照顾患病旅游者应该做到()。","options":[{"key":"A","text":"若旅游团中有游客出现晕机(车、船)症状，应给予重点照顾"},{"key":"B","text":"若游客在飞机上突发重病，通过飞机上的广播系统在乘客中寻找医生进行初步急救"},{"key":"C","text":"设法通知下一站相关方面提前落实车辆"},{"key":"D","text":"通知相关亲属前往医院即可"},{"key":"E","text":"后续费用全陪与游客协商"}],"answer":"ABC","keys":["A","B","C"],"explanation":"照顾患病旅游者：若旅游团中有游客出现晕机(车、船)症状，全陪应予重点照顾。若游客突发重病，全陪应：在飞机(列车、轮船)乘务员的协助下；通过飞机(列车、轮船)上的广播系统在乘客中寻找医生进行初步急救；设法通知下一站相关方面提前落实车辆。D协助亲属配合前往医院，E 是根据合同规定处理，不是全陪跟客人协商。","type":"多选题"},{"number":153,"stem":"导游领队引导游客文明旅游的主要内容有()。","options":[{"key":"A","text":"法律法规"},{"key":"B","text":"风俗禁忌"},{"key":"C","text":"绿色环保"},{"key":"D","text":"礼仪规范"},{"key":"E","text":"购买特产"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"主要内容：法律法规；风俗禁忌；绿色环保；礼仪规范；诚信善意。","type":"多选题"},{"number":154,"stem":"在导游口头语言表达中，常用的停顿可分为()。","options":[{"key":"A","text":"语法停顿"},{"key":"B","text":"逻辑停顿"},{"key":"C","text":"层次停顿"},{"key":"D","text":"感情停顿"},{"key":"E","text":"生理停顿"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"常用的停顿可分为：语法停顿；逻辑停顿；感情停顿；生理停顿。","type":"多选题"},{"number":155,"stem":"地陪(全陪)与领队之间的协作，应该遵循的原则有()。","options":[{"key":"A","text":"尊重领队，遇事多磋商"},{"key":"B","text":"推崇领队，积极为领队服务"},{"key":"C","text":"赞赏领队，调动积极性"},{"key":"D","text":"关心领队，建立工作友谊"},{"key":"E","text":"提醒领队，做好分内事务"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"地陪(全陪)与领队之间的协作：尊重领队，遇事多磋商；赞赏领队，调动积极性；关心领队，建立工作友谊；提醒领队，做好分内事务。","type":"多选题"},{"number":156,"stem":"导游对于游客提出调换房间的要求，处理正确的是()。","options":[{"key":"A","text":"客房清洁的问题，导游应迅速要求饭店客房部门进行打扫、消毒、整理"},{"key":"B","text":"客房有蟑螂、臭虫、老鼠等，导游立即进行房间调换"},{"key":"C","text":"调换朝向或楼层，不涉及房间价格且饭店有空房时适当予以满足"},{"key":"D","text":"住高于合同约定标准的房间，导游婉转拒绝"},{"key":"E","text":"提出住单间需求，需说明谁提出谁付费"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"客房清洁或设施问题：导游应迅速要求饭店客房部门进行打扫、消毒、整理或修理工作；客房有蟑螂、臭虫、老鼠等，旅游者提出换房，应立即满足；调换另一朝向或另一楼层的同一标准客房，不涉及房间价格且饭店有空房时：与饭店客房部联系，适当予以满足，住高于合同约定标准的房间，饭店有空房时：予以满足，但须告知旅游者高于合同标准的房间费用与原房间费用的差价由其自理。无法安排时：做好解释工作。住单间需求：先请领队调解或内部调整；若调解不成，饭店如有空房，可满足其要求，但须事先说明房费由旅游者自理(一般由提出方付房费)。","type":"多选题"},{"number":157,"stem":"关于境内行李丢失处理，导游应该()。","options":[{"key":"A","text":"查明丢失行李运输区间，协助旅游者办理报失手续"},{"key":"B","text":"若当时没有找到，应与承运人保持联系，督促承运人查找丢失行李"},{"key":"C","text":"在查找丢失行李期间，导游为游客购买生活必需品"},{"key":"D","text":"可以确认责任者的，协助旅游者向责任方索赔"},{"key":"E","text":"难以确认责任者的，导游无需继续关注"}],"answer":"ABD","keys":["A","B","D"],"explanation":"查明丢失行李或行李损坏的运输区间，协助旅游者办理报失或报损登记手续；将旅游者后续旅游行程安排告知承运人，同时在旅游过程中，应与承运人保持联系与沟通，督促承运人及时查找丢失行李；若非运输期间丢失行李的，参照\"丢失证件或物品\"处理；在查找丢失行李期间，协助旅游者购置生活必需品，提示其保留发票等购货凭证，并协助旅游者处理索赔事宜；可以确认责任者的，协助旅游者向责任方索赔，并办理相关事宜；难以确认责任者的，协助旅游者开具有关证明，以便向保险公司申请办理理赔事宜，并视情况向有关部门报告。","type":"多选题"},{"number":158,"stem":"作为导游，如何预防游客发生晕机现象?()","options":[{"key":"A","text":"避免过度疲劳"},{"key":"B","text":"宜吃清淡食物，但是要吃饱"},{"key":"C","text":"旅游客车应坐前排，游船应坐最后排舱位"},{"key":"D","text":"可以通过阅读书籍或者报刊，防止眩晕"},{"key":"E","text":"乘坐交通工具前 30分钟，服用抗晕药物减轻症状"}],"answer":"ABE","keys":["A","B","E"],"explanation":"1.避免过度疲劳安排行程避免强度过高，提醒旅游者充分休息，保持精神饱满2.注意饮食禁忌不喝酒，不吃高蛋白、高脂食品，宜吃清淡食物，且不过饱3.坐到更平稳的位置旅游客车坐前排，游船坐中间靠后舱位，飞机坐机舱前部4.乘坐期间宜闭目养神避免长时间阅读或看近处快速移动景物，以防眩晕5.提前服用抗晕药物乘坐交通工具前 30 分钟，服用抗晕药物减轻症状","type":"多选题"},{"number":159,"stem":"为了避免旅游者在旅途中发生伤病，导游应该()。","options":[{"key":"A","text":"随时观察旅游者健康，身体不佳者建议及时休息或就医"},{"key":"B","text":"如果有生病的迹象，导游可以把自己的药物给游客服用"},{"key":"C","text":"避免过度劳累，夜晚娱乐活动不宜过长过晚"},{"key":"D","text":"登高涉险项目建议量力而行，老幼群体避免参与危险项目"},{"key":"E","text":"不暴饮暴食，多喝开水或矿泉水，不吃路边摊"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"旅游过程中，随时观察旅游者健康，身体不佳者建议及时休息或就医，早发现早处理隐患；根据旅游者身体、精神状态，安排合理游览线路和节奏，避免过度劳累，夜晚娱乐活动不宜过长过晚；对风险环境或行为，及时明确警示旅游者，如禁止危险拍照、打闹等。登高涉险项目建议量力而行，老幼群体避免参与危险项目。多提醒旅游者注意饮食卫生，不暴饮暴食，多喝开水或矿泉水，食用洗净或去皮水果，不吃路边摊。","type":"多选题"},{"number":160,"stem":"遭遇火灾时，导游应该()。","options":[{"key":"A","text":"迅速拨打 119报警，同时简明扼要地将情况上报旅行社"},{"key":"B","text":"迅速组织旅游者通过安全出口疏散撤离，不搭乘电梯或随意跳楼"},{"key":"C","text":"应尽快找毛巾沾湿并捂住口鼻，身体尽量贴近地面行走"},{"key":"D","text":"若身上着火，迅速奔跑到安全区域，再扑火"},{"key":"E","text":"大火已封闭逃生通道，则退回室内，用湿被褥塞住门缝，等待救援"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"发现火情后，导游应迅速拨打 119报警，同时简明扼要地将情况上报旅行社；导游应迅速组织旅游者通过安全出口疏散撤离，不搭乘电梯或随意跳楼；导游应引导旅游者就地开展自救：如提醒大家不要贪恋财物，迅速逃生； 若楼道出现浓烟，应尽快找毛巾沾湿并捂住口鼻，身体尽量贴近地面行走；若身上着火，不可奔跑，应就地打滚或用厚重衣物压灭火苗；若大火已封闭逃生通道，则应立即退回室内，用湿被褥塞住门缝，并向窗外发出求救信号，等待救援。","type":"多选题"},{"number":161,"stem":"游客不幸落水后，导游正确引导溺水者自救的方法有()。","options":[{"key":"A","text":"保持镇定，节省体力"},{"key":"B","text":"放松身体，保持仰位"},{"key":"C","text":"若遇呛水，咳嗽调整"},{"key":"D","text":"若遇抽筋，张手扳腿"},{"key":"E","text":"看见他人，呼喊求救"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"溺水者自救方法：保持镇定，节省体力；放松身体，保持仰位；若遇呛水，咳嗽调整；若遇抽筋，张手扳腿。","type":"多选题"},{"number":162,"stem":"遭遇地震以后，正确的躲避方式有()。","options":[{"key":"A","text":"躲到坚固的柜台、桌椅、书桌等旁边或下面"},{"key":"B","text":"选择立柱旁边、内承重墙的墙根、墙角等位置相对较为安全"},{"key":"C","text":"尽量靠近吊灯、电扇等悬挂物"},{"key":"D","text":"远离玻璃门窗、橱窗、高大不稳或摆放易碎品的货架等"},{"key":"E","text":"躲避时蹲下，蜷曲身体，降低身体重心，将额头置于膝盖间"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"C 选项务必避开吊灯、电扇等悬挂物，以及玻璃门窗、橱窗、高大不稳或摆放易碎品的货架等可能发生物体倒或坠落的危险区域。其余都对。","type":"多选题"},{"number":163,"stem":"我国签证类型分为()。","options":[{"key":"A","text":"港澳签证"},{"key":"B","text":"台湾签证"},{"key":"C","text":"外交签证"},{"key":"D","text":"公务签证"},{"key":"E","text":"礼遇签证"}],"answer":"CDE","keys":["C","D","E"],"explanation":"外交签证；公务签证；礼遇签证；普通签证。","type":"多选题"},{"number":164,"stem":"关于铁路携带限量物品的描述，正确的是()。","options":[{"key":"A","text":"酒精浓度 24%≤浓度≤70%可以携带，但是总重量要少于 2000毫升"},{"key":"B","text":"两瓶香水每瓶 50 毫升可以随身携带"},{"key":"C","text":"空气清洗剂单件容量≤150毫升"},{"key":"D","text":"安全火柴≤2盒"},{"key":"E","text":"打火机≤3 个"}],"answer":"CD","keys":["C","D"],"explanation":"酒精浓度 24%≤浓度≤70%可以携带，但是总重量要少于 3000 毫升；每瓶香水 50 毫升，限带 1件；打火机≤2 个。","type":"多选题"},{"number":165,"stem":"下列哪些情况，旅行社可以免责?()。","options":[{"key":"A","text":"游客因自身疾病导致损失或损害，旅行社不担责"},{"key":"B","text":"游客因游客个人过错导致的人身伤亡、财物损失及衍生费用，旅行社不承担责任"},{"key":"C","text":"游客者自行终止旅游行程或未参加约定活动自行行动时发生的人身、财物损害，旅行社不担责"},{"key":"D","text":"游客已声明且旅行社接受游客需照顾的情形，而工作人员未尽到照顾义务除外"},{"key":"E","text":"旅行社行程线路设计有问题"}],"answer":"ABC","keys":["A","B","C"],"explanation":"游客参加活动时需服从导游或领队安排，注意自身及随行未成年人安全，妥善保管财物。因游客个人过错导致的人身伤亡、财物损失及衍生费用，旅行社不承担责任；游客因自身疾病导致损失或损害，旅行社不担责；游客自行终止旅游行程或未参加约定活动自行行动时发生的人身、财物损害，旅行社不担责。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD八/2b97e2461f5f76822e1d062d8d6926a0_2973273121995557157_m_LDD押题第8卷（科目一二）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD八/2b97e2461f5f76822e1d062d8d6926a0_2973273121995557157_m_LDD押题第8卷（科目一二）-试卷.pdf"},{"name":"科目三四","questions":[{"number":1,"stem":"中国在巴黎和会上的外交失败，是五四运动的直接导火线。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。五四运动的直接导火线是中国在巴黎和会上的外交失败(不是华盛顿会议)；1919 年 5 月 4 日，北京学生 3000余人齐集天安门前举行示威，震惊中外的五四运动爆发。同类对比‑ 五四运动‑ 导火线：中国在巴黎和会上的外交失败；‑ 爆发：1919年 5 月 4 日，北京学生 3000余人齐集天安门前举行示威；‑ 口号：\"外争主权、内除国贼\"\"还我青岛\"。","type":"判断题"},{"number":2,"stem":"金沙遗址出土的\"太阳神鸟\"金饰已成为世界文化遗产的标志。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"世界\"应改为\"中国\"。2001 年在成都城西发现与三星堆遗址有明显传承关系的金沙遗址，同样出土大量的黄金器、玉器、象牙和陶器等文物，其中\"太阳神鸟\"金饰已成为中国文化遗产的标志。","type":"判断题"},{"number":3,"stem":"龙山文化距今 6500~5000 年，因发现于内蒙古赤峰市红山而得名。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"龙山\"应改为\"红山\"。红山文化距今 6500~5000 年，因发现于内蒙古赤峰市红山而得名。红山文化出土的\"玉龙\"是其极具代表性的文物，也是中国现今发现较早期的龙的形象之一，被誉为\"中华第一龙\"，赤峰也因此被称作\"玉龙的故乡\"。","type":"判断题"},{"number":4,"stem":"安徽省内河航道的里程和密度均居全国之首。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"安徽\"应改为\"江苏\"。江苏省内河航道总里程约 2.4万千米、约占全国的 1/5，等级航道里程 8818千米、约占全国的 1/7，里程和密度均居全国之首。易混对比‑ ‑ 交通\"之最\"‑ 内河航道：总里程约 2.4万千米，里程和密度均居全国之首(江苏)；‑ 高速铁路：全国第一个\"市市通高铁\"的省份(福建)；‑ 高铁建设：全国率先实现设区市时速 350千米高铁全覆盖(江西)。","type":"判断题"},{"number":5,"stem":"庙号是古代帝王、诸侯、高官死后，朝廷根据他们生平事迹给予的称号。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，古代帝王、诸侯、高官死后，朝廷根据他们生平事迹给予的称号是谥号(不是庙号)；逝去帝王在宗庙中的称号才叫庙号，如唐太宗、宋太祖。易混对比‑ ‑ 谥号、庙号与尊号‑ 谥号：古代帝王、诸侯、高官死后，朝廷根据生平事迹给予的称号，目的是贬善恶；‑ 庙号：逝去帝王在宗庙中的称号；‑ 尊号：古代给帝王、皇后及皇太后加封的尊崇性质的称号。","type":"判断题"},{"number":6,"stem":"全国整体地势东高西低，呈三级阶梯状逐级下降，地势落差巨大。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"东高西低\"应改为\"西高东低\"。全国整体地势西高东低，呈三级阶梯状逐级下降，地势落差巨大，这是影响水系流向、气候分异与地貌格局的重要因素。易混对比‑ ‑ 我国地势三级阶梯‑ 地势：全国整体西高东低(不是东高西低)，呈三级阶梯状逐级下降；‑ 第一级阶梯：青藏高原，平均海拔 4000 米以上，号称\"世界屋脊\"；‑ 第三级阶梯：东部平原与低山丘陵，海拔多在 500米以下。","type":"判断题"},{"number":7,"stem":"贵州省茶园面积超 700万亩，辣椒产销规模居全国首位。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。贵州省茶园面积超 700万亩，辣椒产销规模居全国首位。","type":"判断题"},{"number":8,"stem":"1864年\"共产主义者同盟\"建立，揭开了国际共产主义运动的历史序幕。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"1864 年\"应改为\"1847 年\"。1847年\"共产主义者同盟\"建立，揭开了国际共产主义运动的历史序幕；1864年成立的是国际工人协会(第一国际)。易混对比‑ ‑ 国际共产主义运动历程‑ 共产主义者同盟：1847年建立，揭开了国际共产主义运动的历史序幕；‑ 《共产党宣言》：1848年出版，第一次全面系统地阐述了科学社会主义理论；‑ 国际工人协会(第一国际)：1864年诞生。","type":"判断题"},{"number":9,"stem":"山西作为中华文明的重要发祥地，自古便有\"昔三代之居，皆在河、洛之间\"的说法。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"山西\"应改为\"河南\"。河南作为中华文明的重要发祥地，自古便有\"昔三代之居，皆在河、洛之间\"的说法。","type":"判断题"},{"number":10,"stem":"\"歌圩\"是壮族人民对歌、赛歌的盛大集会，相传与歌仙刘三姐有关。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。\"歌圩\"是壮族人民对歌、赛歌的盛大集会，相传与歌仙刘三姐有关。\"三月三\"歌节，又称三月三歌圩，是壮族盛大的传统歌节。","type":"判断题"},{"number":11,"stem":"昌化鸡血石雕产自浙江昌化，其独特之处在于石材中含有天然的\"鸡血\"(辰砂矿物)，被奉为\"石中皇后\"。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。昌化鸡血石雕产自浙江昌化，核心原料鸡血石仅产于昌化镇玉岩山一带；其独特之处在于石材中含有天然的\"鸡血\"(辰砂矿物)，色泽鲜红，如同鸡血般艳丽，是鸡血石雕的核心价值所在，被奉为\"石中皇后\"。同类对比‑ ‑ 昌化鸡血石雕‑ 产地：产自浙江昌化，核心原料鸡血石仅产于昌化镇玉岩山一带；‑ 特色：石材中含有天然的\"鸡血\"(辰砂矿物)；‑ 美誉：被奉为\"石中皇后\"；‑ 工艺：\"惜血如金、巧借血色\"。","type":"判断题"},{"number":12,"stem":"湖南自古盛植木芙蓉，五代时就有\"秋风万里芙蓉国\"之说，因此又有\"芙蓉国\"之称。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。湖南自古盛植木芙蓉，五代时就有\"秋风万里芙蓉国\"之说，因此又有\"芙蓉国\"之称。","type":"判断题"},{"number":13,"stem":"1851年爆发的太平天国运动持续了 14 年，纵横 18省，一度定都北京。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"北京\"应改为\"南京\"。1851 年，洪秀全领导的太平天国运动爆发，持续 14年，纵横 18省，1853年定都南京，改称天京。易混对比‑ ‑ 太平天国运动‑ 爆发：1851年，洪秀全领导的太平天国运动爆发；‑ 规模：运动持续 14年，纵横 18省；‑ 都城：一度定都南京(不是北京)，最终被中外反动势力绞杀。","type":"判断题"},{"number":14,"stem":"瓷器的烧成温度必须在 1500°C 以上。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"\"1500°C以上\"错误，应为\"1200°C以上\"。瓷器是以高岭土(俗称瓷土)为原料，经1200°C 以上高温烧制而成的器物。高温烧制使瓷土形成结晶，胎体致密、硬度高、吸水率低，加上表面施高温釉，成品光亮坚硬。26版教材将\"瓷胎烧结后，质地致密，胎体吸水率不足 1%\"改为\"吸水率低\"，并将瓷器定义补写为以高岭土为原料、1200°C 以上高温烧制，补入结晶、胎体致密、硬度高和高温釉等特点。易混对比‑ ‑ 陶器与瓷器‑ 陶器：以黏土为原料，经 700~1000°C 的炉温焙烧而成；‑ 瓷器：以高岭土为原料，经 1200°C以上高温烧制而成；‑ 陶器缺陷：质地松、强度低、吸水率高，唐宋以后陶器大量被瓷器取代。","type":"判断题"},{"number":15,"stem":"\"墙倒屋不塌\"这句民间俗语，充分表达了我国木构架梁柱式结构体系的特点。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。由于木材建造的梁柱式结构是一个富有弹性的框架，具有突出的优点即抗震性能强，它可以把巨大的震动能量消失在弹性很强的节点上，\"墙倒屋不塌\"这句民间俗语，充分表达了上述梁柱式结构体系的特点。同类对比‑ ‑ 木构架梁柱式结构‑ 框架：木材建造的梁柱式结构是一个富有弹性的框架；‑ 优点：突出优点即抗震性能强，可以把巨大的震动能量消失在弹性很强的节点上；‑ 俗语：\"墙倒屋不塌\"充分表达了我国木构架梁柱式结构体系的特点。","type":"判断题"},{"number":16,"stem":"重庆简称\"渝\"，因长江古称\"渝水\"而得名。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"长江\"应改为\"嘉陵江\"。因嘉陵江古称\"渝水\"，此为重庆简称\"渝\"的出处。南宋时，宋孝宗之子赵惇先封恭王，后即帝位为光宗皇帝，称为\"双重喜庆\"，遂升恭州为重庆府，\"重庆\"由此而得名。","type":"判断题"},{"number":17,"stem":"巴丹吉林沙漠是中国第二大沙漠、第三大流动沙漠。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应改为\"第三大沙漠、第二大流动沙漠\"。巴丹吉林沙漠是中国第三大沙漠、第二大流动沙漠。巴丹吉林沙漠有世界最高的固定沙山、最密集的沙漠湖泊、最广阔的鸣沙区域，风蚀地貌鬼斧神工，被中国国家地理杂志评为\"中国最美沙漠\"。2024 年 7 月，\"巴丹吉林沙漠‑ 沙山湖泊群\"被成功列入《世界遗产名录》，填补了中国世界自然遗产中缺少沙漠类型的空白。易混对比‑ ‑ 沙漠之最‑ 塔克拉玛干沙漠：中国最大的沙漠，面积 33.76 万平方公里(新疆)；‑ 巴丹吉林沙漠：中国第三大沙漠、第二大流动沙漠，\"中国最美沙漠\"(内蒙古)。","type":"判断题"},{"number":18,"stem":"广东阳江是\"南国风筝之乡\"，1993年被授予\"世界风筝都\"称号。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"世界风筝都\"应改为\"全国风筝之乡\"。广东阳江是南派风筝代表之一，有\"南国风筝之乡\"之称，1993年被国家体委授予\"全国风筝之乡\"称号；\"世界风筝都\"是山东潍坊。易混对比‑ ‑ \"风筝之乡\"与\"世界风筝都\"‑ 阳江：广东阳江是南国风筝之乡，1993年被国家体委授予\"全国风筝之乡\"称号；‑ 潍坊：山东潍坊是\"世界风筝都\"，自 1984年起每年举办国际风筝节；‑ 非遗：2006 年，潍坊、南通、拉萨、北京、天津的风筝制作技艺列入第一批国家级非物质文化遗产名录。","type":"判断题"},{"number":19,"stem":"杭州西湖北面的保俶塔与南面重建的雷峰塔，是一组绝妙的对景。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。在园林中，从甲风景点可观赏乙风景点，从乙风景点可观赏甲风景点的构景方法，叫对景；杭州西湖北面的保俶塔，与南面重建的雷峰塔，就是一组绝妙的对景。同类对比‑ ‑ 古典园林构景手段‑ 对景：从甲风景点可观赏乙风景点，从乙风景点也可观赏甲风景点；‑ 实例：杭州西湖北面的保俶塔与南面重建的雷峰塔是一组绝妙的对景；‑ 其他手段：还有抑景、夹景、添景、框景、漏景和借景。","type":"判断题"},{"number":20,"stem":"洛阳因地处洛河之阳而得名，是十三朝古都、丝绸之路的东方起点、隋唐大运河的中心。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。洛阳因地处洛河之阳而得名，十三朝古都、丝绸之路的东方起点、隋唐大运河的中心。同类对比‑ ‑ 河南古都(河南)‑ 洛阳：十三朝古都、丝绸之路的东方起点、隋唐大运河的中心；‑ 开封：八朝古都，北宋东京；‑ 安阳：殷墟所在地，甲骨文出土地。","type":"判断题"},{"number":21,"stem":"著名社会学家费孝通最早提出中华民族是\"多元一体\"的复合体这一概念。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。著名社会学家费孝通最早提出中华民族是\"多元一体\"的复合体这一概念，并于 1988 年在《中华民族多元一体格局》一文中系统阐述；他指出，中华民族是一个\"多元一体\"的整体，\"多元\"指各民族保留自身语言、习俗等文化特征，\"一体\"则强调各民族共同形成了更高层次的中华民族认同。同类对比‑ ‑ 费孝通\"多元一体\"理论‑ 提出：著名社会学家费孝通最早提出中华民族是\"多元一体\"的复合体；‑ 系统阐述：1988年在《中华民族多元一体格局》一文中系统阐述；‑ \"多元\"：各民族保留自身语言、习俗等文化特征；‑ \"一体\"：各民族在长期交往中形成的共同国家认同。","type":"判断题"},{"number":22,"stem":"法国是欧盟最大的农业生产国，也是世界主要农产品和农业食品出口国。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。法国是欧盟最大的农业生产国，也是世界主要农产品和农业食品出口国，葡萄酒的出口量约占世界葡萄酒出口总量的一半；法国是全球旅游主要目的地之一，国际旅游收入居世界第二，是世界著名的三大烹饪王国之一。同类对比‑ ‑ 法国农业与工业‑ 农业地位：法国是欧盟最大的农业生产国；‑ 出口：也是世界主要农产品和农业食品出口国；‑ 葡萄酒：出口量约占世界葡萄酒出口总量的一半。","type":"判断题"},{"number":23,"stem":"我国大陆海岸线约 1.42万千米，专属经济区与大陆架管辖海域近 300万平方千米。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"1.42万千米\"应改为\"1.84 万千米\"。我国大陆海岸线约 1.84 万千米，岛屿岸线约 1.42万千米，内水加领海海域面积约 38 万平方千米，专属经济区与大陆架管辖海域近 300万平方千米。易混对比‑ ‑ 我国海岸线与管辖海域‑ 大陆海岸线：约 1.84 万千米；‑ 岛屿岸线：约 1.42万千米；‑ 内水加领海：海域面积约 38万平方千米；‑ 专属经济区与大陆架：管辖海域近 300万平方千米。","type":"判断题"},{"number":24,"stem":"福建旅游鲜明的特色是\"山海一体，闽台同根，民俗奇异，宗教多元\"。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。福建旅游鲜明的特色是\"山海一体，闽台同根，民俗奇异，宗教多元\"。","type":"判断题"},{"number":25,"stem":"截至目前，我国共有 61个项目列入联合国教科文组织非遗名录、名册，总数居世界第一。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"61个\"应改为\"45个\"。截至目前，我国共有 45个项目列入联合国教科文组织非遗名录、名册，总数居世界第一，其中，列入代表作名录 40 项，列入急需保护名录项目 3项，入选优秀保护实践名册 2 项。(数据更新，以此为准)。口诀：非遗 45 中国一：代表 40，急 3，优 2。同类对比‑ ‑ 中国非遗名录数据‑ 列入非遗名录、名册项目：45 个，总数居世界第一；‑ 代表作名录：40 项；‑ 急需保护名录：3项；‑ 优秀保护实践名册：2项。","type":"判断题"},{"number":26,"stem":"秦皇岛市是中国最佳旅游城市，是理想的旅游、度假和避暑胜地。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"秦皇岛市\"应改为\"大连市\"。大连市是中国最佳旅游城市，是理想的旅游、度假和避暑胜地。","type":"判断题"},{"number":27,"stem":"茶叶按初加工方式可分为绿茶、红茶、乌龙茶、白茶、紧压茶和花茶六大类。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。初加工六大类应包括青茶、黄茶、黑茶，紧压茶和花茶属于再加工茶。初加工茶分绿茶、红茶、青茶(乌龙茶)、黄茶、白茶、黑茶六大类；紧压茶和花茶属于再加工茶，再加工茶还有袋泡茶等。26 版教材改动：再加工茶举例增加袋泡茶，不再限定为两种。初加工茶分六大类；再加工茶有花茶、紧压茶、袋泡茶等。易混对比‑ ‑ 茶叶初加工与再加工‑ 初加工茶：按初加工方式可分为绿茶、红茶、青茶(乌龙茶)、黄茶、白茶、黑茶六大类；‑ 再加工茶：以六大类茶为原料再加工形成，如花茶、紧压茶、袋泡茶等；‑ 紧压茶：经过蒸软、压制成型、干燥等工序做成的茶饼，便于保存和运输。","type":"判断题"},{"number":28,"stem":"上海外滩是上海城市的象征。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。上海外滩是上海城市的象征。","type":"判断题"},{"number":29,"stem":"班固的《汉书》记载了从高祖建汉到王莽政权间 230 年的历史。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。班固的《汉书》记载高祖建汉到王莽政权间 230年的历史，其事详，结构谨严，描写生动，人物形象塑造栩栩如生。同类对比‑ ‑ 《汉书》与纪传体史学‑ 《汉书》：班固著，记载高祖建汉到王莽政权间 230年的历史；‑ 叙事特点：叙事详，结构谨严，描写生动，人物形象塑造栩栩如生；‑ 《史记》：司马迁著，被赞誉为\"史家之绝唱，无韵之离骚\"。","type":"判断题"},{"number":30,"stem":"闻名于世的畲族\"惠明茶\"历史悠久，1915年获巴拿马万国博览会金质奖章。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。闻名于世的畲族\"惠明茶\"历史悠久，明清时期曾被列为贡品，1915年获巴拿马万国博览会金质奖章。\"惠明茶\"明清时期曾被列为贡品。同类对比‑ ‑ 畲族文化(浙江)‑ 景宁畲族自治县：全国唯一的畲族自治县，设于丽水市；‑ 畲民自称\"山哈\"，意为山里的客人；‑ \"凤凰装\"：畲族女性传统服装，民族特色鲜明。","type":"判断题"},{"number":31,"stem":"明末总结造园经验的著作是《园冶》。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。皇家和私人的园林在传统基础上有了很大的发展，在明末出现了一部总结造园经验的著作《园冶》，并留下了许多优秀作品。同类对比‑ ‑ 中国古典园林发展阶段‑ 转折点：魏晋南北朝时期是中国园林发展的转折点，私家园林逐渐增加；‑ 成熟阶段：唐宋时期园林达到成熟，写意山水园技巧取得很大成就；‑ 精深发展：明清时期园林进入精深发展阶段；‑ 造园著作：明末出现总结造园经验的著作‑ ‑ 《园冶》。","type":"判断题"},{"number":32,"stem":"无名的《古诗十九首》代表了文人五言诗的最高成就。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。无名氏的《古诗十九首》代表了文人五言诗的最高成就。同类对比‑ ‑ 《古诗十九首》‑ 作者：无名氏；‑ 体裁：东汉文人五言诗，代表作有《行行重行行》《青青河畔草》等；‑ 地位：代表了文人五言诗的最高成就。","type":"判断题"},{"number":33,"stem":"1840年天津被辟为通商口岸。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"1840\"应改为\"1860\"。天津 1860 年被辟为通商口岸。同类对比‑ ‑ 近代开埠‑ 1860年：天津被辟为通商口岸；‑ 1842年《南京条约》：开放广州、福州、厦门、宁波、上海五处为通商口岸；‑ 1843年 11月 17 日：上海正式对外开埠。","type":"判断题"},{"number":34,"stem":"唐代孙思邈著《千金方》，被誉为\"东方医学圣典\"，他本人被为\"药王\"。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。唐朝名医孙思邈著《千金方》，被誉为\"东方医学圣典\"，他本人被为\"药王\"。同类对比‑ ‑ 孙思邈与《千金方》‑ 朝代：唐朝名医；‑ 著作：著《千金方》；‑ 美誉：《千金方》被誉为\"东方医学圣典\"，孙思邈本人被为\"药王\"。","type":"判断题"},{"number":35,"stem":"人面鱼纹盆出土于三门峡庙底沟遗址，花瓣纹彩陶钵出土于西安半坡村遗址。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，两处遗址恰好相反。仰韶文化彩陶的代表器物包括西安半坡村遗址出土的人面鱼纹盆、西安临潼姜寨遗址出土的变体鱼纹葫芦瓶，以及河南三门峡庙底沟遗址出土的花瓣纹彩陶钵。易混对比‑ ‑ 仰韶文化彩陶代表器物‑ 人面鱼纹盆：西安半坡村遗址出土；‑ 变体鱼纹葫芦瓶：西安临潼姜寨遗址出土；‑ 花瓣纹彩陶钵：河南省三门峡庙底沟遗址出土。","type":"判断题"},{"number":36,"stem":"香港行人和车辆靠右行驶，和内地正好相反。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，\"靠右行驶\"应改为\"靠左行驶\"。香港行人和车辆靠左行驶，与内地正好相反。香港交通规则：行人和车辆靠左行驶，与内地相反(其他教材补充)。易混对比‑ ‑ 香港民俗要点(香港)‑ 行驶规则：行人和车辆靠左行驶，与内地相反；‑ 数字宜忌：喜\"3\"\"8\"\"6\"\"9\"，忌\"4\"；‑ 送花禁忌：忌剑兰、茉莉、梅花；‑ 隐私禁忌：忌打听住址、收入、年龄。","type":"判断题"},{"number":37,"stem":"2006年 7 月 1 日全线通车的青藏铁路，从此结束了新疆不通铁路的历史。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，青藏铁路结束的是西藏(不是新疆)不通铁路的历史。2006 年 7 月 1日，全长 1956公里的世界上海拔最高、线路最长的高原铁路‑ ‑ 青藏铁路全线通车，从此结束了西藏不通铁路的历史，对于增进民族团结、促进民族区域发展、巩固国防意义重大。易混对比‑ ‑ 我国铁路建设成就‑ 成渝铁路：新中国成立后建成的第一条铁路，1952年 7月 1日建成通车；‑ 宝成铁路：1958年通车，后被改造成中国第一条电气化铁路；‑ 青藏铁路：2006年 7 月 1 日全线通车，从此结束了西藏(不是新疆)不通铁路的历史。","type":"判断题"},{"number":38,"stem":"承德是一个先有皇家园林和皇家寺庙群，而后有人口聚集的城市。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。承德是一个先有皇家园林和皇家寺庙群，而后有人口聚集的城市。","type":"判断题"},{"number":39,"stem":"清明上河园是以北宋张择端《清明上河图》为蓝本，按 1:1复原的大型宋文化主题公园。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。清明上河园是以北宋张择端《清明上河图》为蓝本 1:1 复原的大型宋文化主题公园。同类对比‑ ‑ 河南宋文化名片(河南)‑ 清明上河园：以张择端《清明上河图》为蓝本 1:1复原，被誉为\"活着的清明上河图\"；‑ 开封：北宋都城东京，八朝古都。","type":"判断题"},{"number":40,"stem":"1884年清政府正式在新疆设省，并取\"故土新归\"之意，改称西域为\"新疆\"。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1884年清政府正式在新疆设省，并取\"故土新归\"之意，改称西域为\"新疆\"。公元前 60 年，西汉中央政府在乌垒(今巴州轮台县境内)设立西域都护府，新疆自此正式纳入中央政府管辖。同类对比‑ ‑ 新疆沿革(新疆)‑ 古称\"西域\"：意为中国的西部疆域，自古以来是祖国不可分割的一部分；‑ 公元前 60年：西汉在乌垒(今巴州轮台县境内)设西域都护府，自此纳入中央政府管辖；‑ 1884年：清政府正式设省，取\"故土新归\"之意，改称西域为\"新疆\"。二、单项选择题","type":"判断题"},{"number":41,"stem":"江西客家山歌中()最为著名，其与采茶戏都被列入《第一批国家级非物质文化遗产名录》。","options":[{"key":"A","text":"于都客家山歌"},{"key":"B","text":"兴国客家山歌"},{"key":"C","text":"瑞金客家山歌"},{"key":"D","text":"会昌客家山歌"}],"answer":"B","keys":["B"],"explanation":"客家山歌中兴国客家山歌最为著名，采茶戏、兴国山歌都被列入《第一批国家级非物质文化遗产名录》。A 项于都、C 项瑞金、D项会昌均为江西客家地区，但客家山歌中最为著名、列入首批国家级非遗名录者为兴国客家山歌，故不选。","type":"单选题"},{"number":42,"stem":"素有\"淮左名都，竹西佳处\"\"中国运河第一城\"之称的城市是()。","options":[{"key":"A","text":"南京市"},{"key":"B","text":"镇江市"},{"key":"C","text":"扬州市"},{"key":"D","text":"苏州市"}],"answer":"C","keys":["C"],"explanation":"扬州素有\"淮左名都，竹西佳处\"\"中国运河第一城\"之称，兼具世界运河之都、世界美食之都、东亚文化之都三重文化名片。A项南京以\"六朝古都\"著称，B项苏州以园林闻名，D项镇江以\"城市山林\"著称，素有\"淮左名都，竹西佳处\"\"中国运河第一城\"之称、兼具三重文化名片者为扬州，故不选。同类对比‑ ‑ 扬州名片(江苏)‑ 古称：广陵、江都，2500余年建城史，首批国家历史文化名城；‑ \"淮左名都，竹西佳处\"\"中国运河第一城\"；‑ 三重文化名片：世界运河之都、世界美食之都、东亚文化之都；‑ 何园：中国晚清第一名园。","type":"单选题"},{"number":43,"stem":"在陕西泾阳县、三原县以及河南三门峡市、山西运城市等地保存的传统窑洞建筑是()。","options":[{"key":"A","text":"地坑院"},{"key":"B","text":"吊脚楼"},{"key":"C","text":"土楼"},{"key":"D","text":"碉楼"}],"answer":"A","keys":["A"],"explanation":"在陕西泾阳县、三原县以及河南三门峡市、山西运城市等地，还保存着一种叫作\"地坑院\"的传统窑洞建筑。B项吊脚楼为土家族等民族的传统民居，C项土楼为福建客家民居，D项碉楼以广东开平碉楼为代表，陕西等地保存的传统窑洞建筑为地坑院，故不选。易混对比‑ ‑ 特色民居形式‑ 地坑院：传统窑洞建筑，\"地下四合院\"，见于陕西泾阳、三原及豫晋部分地区；‑ 窑洞：黄土高原传统民居；‑ 碉楼：开平碉楼为代表，兼具防卫与居住功能。","type":"单选题"},{"number":44,"stem":"被李约瑟誉为\"中国科学史上的里程碑\"的是()。","options":[{"key":"A","text":"《齐民要术》"},{"key":"B","text":"《天工开物》"},{"key":"C","text":"《农政全书》"},{"key":"D","text":"《梦溪笔谈》"}],"answer":"D","keys":["D"],"explanation":"北宋科学家沈括编撰《梦溪笔谈》，内容涉及天文、数学、物理、化学、生物等多个学科门类，英国科学史家李约瑟评价此书为\"中国科学史上的里程碑\"。A《齐民要术》是北魏贾思勰所著；B《天工开物》是明朝宋应星所著。易混对比‑ ‑ 沈括与《梦溪笔谈》‑ 《梦溪笔谈》：北宋科学家沈括编撰，内容涉及天文、数学、物理、化学、生物等多个学科门类；‑ 评价：英国科学史家李约瑟评价此书为\"中国科学史上的里程碑\"；‑ 活字印刷：布衣毕昇发明活字印刷术的事迹就记载在此书中。","type":"单选题"},{"number":45,"stem":"亚洲第一、世界第二大鲜切花拍卖市场位于云南的()。","options":[{"key":"A","text":"大理市"},{"key":"B","text":"丽江市"},{"key":"C","text":"昆明市"},{"key":"D","text":"西双版纳傣族自治州"}],"answer":"C","keys":["C"],"explanation":"昆明国际花卉拍卖交易中心是亚洲第一，世界第二大鲜切花拍卖市场，占有全国 40%左右的鲜切花市场。A 项大理以苍洱风光著称，B 项丽江以古城纳西文化闻名，D 项西双版纳以热带雨林和傣族风情著称，亚洲第一、世界第二大鲜切花拍卖市场位于昆明，故不选。云南花卉产业在全国具有领先地位，该交易中心占有全国 40%左右的鲜切花市场。","type":"单选题"},{"number":46,"stem":"每年的()为中国旅游日。","options":[{"key":"A","text":"5月 19 日"},{"key":"B","text":"9月 27 日"},{"key":"C","text":"10月 1 日"},{"key":"D","text":"12月 11日"}],"answer":"A","keys":["A"],"explanation":"2011年 3 月 30日，国务院常务会议通过决议确定中国旅游日为每年的 5 月 19日《徐霞客游记》首篇《游天台山日记》开篇之日，每年的这一天，我国各地都要举行隆重的旅游节庆活动。B9 月 27日是世界旅游日，由世界旅游组织确定；D12 月 11日是中国正式加入世界贸易组织的日子。同类对比‑ ‑ 中国旅游日‑ 设立：2011年 3 月 30日，国务院常务会议通过决议确定；‑ 日期：每年 5月 19日；‑ 由来：《徐霞客游记》首篇《游天台山日记》的开篇之日；‑ 世界旅游日：每年 9 月 27 日，由世界旅游组织确定。","type":"单选题"},{"number":47,"stem":"()以烧制乳浊釉瓷为主，以其\"入窑一色，出窑万彩\"的神奇\"窑变\"而闻名。","options":[{"key":"A","text":"钧窑"},{"key":"B","text":"定窑"},{"key":"C","text":"汝窑"},{"key":"D","text":"哥窑"}],"answer":"A","keys":["A"],"explanation":"钧窑釉色以红、蓝为主，使用乳浊釉，\"入窑一色，出窑万彩\"。这种\"窑变\"现象使钧瓷表面图案千变万化，每一件都很独特。26版教材改动：新增\"釉色以红、蓝为主\"。易混对比‑ ‑ 宋代五大名窑‑ 汝窑：五窑中以\"汝窑为魁\"，专为宫廷烧造御用瓷器；‑ 钧窑：釉色以红、蓝为主，使用乳浊釉，\"入窑一色，出窑万彩\"，每件都独特；‑ 官窑：多为皇室烧造，南宋官窑有\"紫口铁足\"特征；‑ 定窑：宋代五大名窑中唯一烧造白瓷的窑场。","type":"单选题"},{"number":48,"stem":"我国文学史上第一篇文学批评著作是曹丕的()。","options":[{"key":"A","text":"《诗品》"},{"key":"B","text":"《文心雕龙》"},{"key":"C","text":"《典论·论文》"},{"key":"D","text":"《文赋》"}],"answer":"C","keys":["C"],"explanation":"曹丕的《典论·论文》是我国文学史上第一篇文学批评著作，文中论述了文学乃\"经国之大业，不朽之盛事\"的社会功能，批评了\"文人相轻\"的陋习，提出了\"文以气为主\"的主张。易混对比‑ ‑ 曹丕与《典论·论文》‑ 《典论·论文》：曹丕所著，是我国文学史上第一篇文学批评著作；‑ 核心主张：论述文学乃\"经国之大业，不朽之盛事\"，批评\"文人相轻\"陋习，提出\"文以气为主\"；‑ 《燕歌行》：曹丕诗歌代表作，是我国现存最早的文人创作的完整七言诗。","type":"单选题"},{"number":49,"stem":"\"天津\"之名意为()。","options":[{"key":"A","text":"天子经过的渡口"},{"key":"B","text":"天子的渡口驿站"},{"key":"C","text":"天降的津梁"},{"key":"D","text":"天边的渡口"}],"answer":"A","keys":["A"],"explanation":"天津简称津，意为天子经过的渡口，别名津沽、津门等，直辖市。B 项\"天子的渡口驿站\"、C 项\"天降的津梁\"、D 项\"天边的渡口\"均与教材\"天子经过的渡口\"的释义不符，故不选。易混对比‑ ‑ 城市得名由来‑ 天津：意为\"天子经过的渡口\"，别名津沽、津门；‑ 重庆：宋光宗\"双重喜庆\"，升恭州为重庆府而得名。","type":"单选题"},{"number":50,"stem":"《水经注》的作者是北魏地理学家()。","options":[{"key":"A","text":"沈括"},{"key":"B","text":"徐霞客"},{"key":"C","text":"郦道元"},{"key":"D","text":"王士性"}],"answer":"C","keys":["C"],"explanation":"北魏时期，郦道元为《水经》作注，详细记载了 1000 多条大小河流及有关的历史遗迹、人物掌故、神话传说等，是中国古代最全面、最系统的综合性地理著作。A 沈括编撰《梦溪笔谈》；B徐霞客、D 王士性是明代两位大旅行家。同类对比‑ ‑ 《水经注》与古代地理学‑ 作者：北魏郦道元为《水经》作注；‑ 内容：详细记载了 1000多条大小河流及有关的历史遗迹、人物掌故、神话传说等；‑ 地位：是中国古代最全面、最系统的综合性地理著作。","type":"单选题"},{"number":51,"stem":"被称为\"海上花园城市\"的是()。","options":[{"key":"A","text":"福州市"},{"key":"B","text":"泉州市"},{"key":"C","text":"漳州市"},{"key":"D","text":"厦门市"}],"answer":"D","keys":["D"],"explanation":"厦门简称\"厦\"或\"鹭\"，\"会展友好型城市\"，被称为海上花园城市。A 项福州为福建省会，B 项泉州为东亚文化之都，C项漳州以土楼闻名，被称为\"海上花园城市\"者为厦门，故不选。易混对比‑ ‑ 城市美誉‑ 厦门：\"海上花园城市\"(福建)；‑ 苏州：\"人间天堂\"(江苏)；‑ 哈尔滨：\"冰城\"\"东方莫斯科\"\"东方小巴黎\"(黑龙江)。","type":"单选题"},{"number":52,"stem":"被誉为\"中国古代建筑艺术历史长廊\"的是()。","options":[{"key":"A","text":"平遥古城"},{"key":"B","text":"云冈石窟"},{"key":"C","text":"晋祠"},{"key":"D","text":"五台山"}],"answer":"D","keys":["D"],"explanation":"五台山是研究我国古代建筑艺术的活标本，被誉为\"中国古代建筑艺术历史长廊\"。A项平遥古城、B项云冈石窟、C 项晋祠均为山西名胜，但被誉为\"中国古代建筑艺术历史长廊\"者为五台山，故不选。同类对比‑ ‑ 山西古建(山西)‑ 五台山：中国佛教四大名山之首，\"中国古代建筑艺术历史长廊\"，北台叶斗海拔 3061 为\"华北屋脊\"；‑ 平遥古城：\"龟城\"，保存完整的明民宅近 4000座；‑ 晋祠：荟萃多元古建筑形制的千年古祠(太原)。","type":"单选题"},{"number":53,"stem":"古称金陵、建康，是中国四大古都之一、十朝都会的是()。","options":[{"key":"A","text":"杭州"},{"key":"B","text":"扬州"},{"key":"C","text":"苏州"},{"key":"D","text":"南京"}],"answer":"D","keys":["D"],"explanation":"南京古称金陵、建康等，简称\"宁\"，是中国四大古都之一、十朝都会。A 项杭州为浙江省会，B 项扬州、C 项苏州均为江苏名城，古称金陵、建康、简称\"宁\"、为十朝都会者为南京，故不选。易混对比‑ ‑ 古都名片‑ 南京：古称金陵、建康，中国四大古都之一、十朝都会(江苏)；‑ 洛阳：十三朝古都、丝绸之路的东方起点、隋唐大运河的中心(河南)；‑ 西安：3100多年建城史、1100 多年国都史，先后有 13个封建王朝建都(陕西)。","type":"单选题"},{"number":54,"stem":"掺入玛瑙为釉、釉色以天青为贵的是()。","options":[{"key":"A","text":"哥窑"},{"key":"B","text":"官窑"},{"key":"C","text":"定窑"},{"key":"D","text":"汝窑"}],"answer":"D","keys":["D"],"explanation":"汝窑瓷器釉色以天青为贵、粉青为上，天蓝和月白次之。天青瓷在宋徽宗时烧造约20年，工艺精湛，掺入玛瑙为釉，釉色淡雅如雨过天晴。26 版教材整体改写汝窑：窑址明确为古汝州(今河南宝丰)，改写香灰胎、开片、釉色等级(天青为贵、粉青为上，天蓝和月白次之)及宋徽宗时天青瓷烧造约 20 年，保留玛瑙为釉和\"似玉、非玉、而胜玉\"评价。易混对比‑ ‑ 汝窑的专属特征‑ 地位：宋代五大名窑以\"汝窑为魁\"；‑ 窑址：古汝州(今河南省平顶山市宝丰县)；‑ 釉色：以天青为贵、粉青为上，天蓝和月白次之，掺入玛瑙为釉；‑ 珍贵：天青瓷在宋徽宗时烧造约 20 年，烧造时间短，传世品少。","type":"单选题"},{"number":55,"stem":"2010年首部 3D 电影《阿凡达》的取景地，让美景享誉世界的是()。","options":[{"key":"A","text":"武陵源"},{"key":"B","text":"天门山"},{"key":"C","text":"张家界"},{"key":"D","text":"崀山"}],"answer":"C","keys":["C"],"explanation":"2010 年首部 3D 电影《阿凡达》，更是让其中的电影取景地‑ ‑ 张家界的美景享誉世界。A项武陵源、B 项天门山均在张家界市，D 项崀山在邵阳，《阿凡达》电影取景地、美景享誉世界者为张家界，故不选。张家界原名大庸市，因旅游建市。俗话说\"九寨沟看水，张家界看山\"，张家界武陵源景区有\"中国山水画的原本\"\"缩小的仙境，放大的盆景\"的美誉。同类对比‑ ‑ 张家界名片(湖南)‑ 原名：大庸市，因旅游建市；‑ 武陵源景区：\"中国山水画的原本\"\"缩小的仙境，放大的盆景\"；‑ 《阿凡达》：2010年首部 3D电影取景地，让美景享誉世界。","type":"单选题"},{"number":56,"stem":"以\"小桥流水、粉墙黛瓦、史迹名园\"为独特风貌的城市是()。","options":[{"key":"A","text":"南京市"},{"key":"B","text":"无锡市"},{"key":"C","text":"苏州市"},{"key":"D","text":"扬州市"}],"answer":"C","keys":["C"],"explanation":"从春秋伍子胥建阖闾大城迄今，苏州城保持着\"水陆并行、河街相邻\"的双棋盘格局，以\"小桥流水、粉墙黛瓦、史迹名园\"为独特风貌。A 项南京以\"六朝古都\"著称，B项无锡素有\"太湖明珠\"之誉，D项扬州有\"中国运河第一城\"之称，保持\"水陆并行、河街相邻\"双棋盘格局者为苏州，故不选。同类对比‑ ‑ 江苏名城名片(江苏)‑ 苏州：古称姑苏、平江，\"小桥流水、粉墙黛瓦、史迹名园\"，大运河沿线唯一以古城概念申遗的城市；‑ 南京：古称金陵、建康，中国四大古都之一、十朝都会；‑ 扬州：古称广陵、江都，\"淮左名都，竹西佳处\"\"中国运河第一城\"；‑ 无锡：别名梁溪，素有\"太湖明珠\"之誉。","type":"单选题"},{"number":57,"stem":"\"丞相祠堂何处寻，锦官城外柏森森\"出自杜甫的()。","options":[{"key":"A","text":"《登高》"},{"key":"B","text":"《登楼》"},{"key":"C","text":"《阁夜》"},{"key":"D","text":"《蜀相》"}],"answer":"D","keys":["D"],"explanation":"\"丞相祠堂何处寻，锦官城外柏森森\"出自杜甫《蜀相》，杜甫有\"诗圣\"之称，其诗有\"诗史\"之誉。易混对比‑ ‑ 杜甫诗句与称号‑ \"丞相祠堂何处寻，锦官城外柏森森\"：出自杜甫《蜀相》；‑ 杜甫：有\"诗圣\"之称，其诗深刻地反映了安史之乱前后的社会现实，有\"诗史\"之誉；‑ 代表作：\"三吏三别\"(《新安吏》《石壕吏》《潼关吏》等)。","type":"单选题"},{"number":58,"stem":"《红楼梦》中有具体做法、可照法仿制的代表性菜品是()。","options":[{"key":"A","text":"糟鹅掌鸭信"},{"key":"B","text":"茄鲞"},{"key":"C","text":"炒豆腐脑"},{"key":"D","text":"黄焖鱼翅"}],"answer":"B","keys":["B"],"explanation":"红楼菜的研制，一是根据书中写有具体做法的菜，照法仿制，如茄鲞等。A 为红楼菜代表名菜；C 为曾得到慈禧太后赞赏的宫廷素菜；D 为谭家菜代表名菜。26版教材改动：红楼菜代表名菜名录调整‑ 新增茄鲞、鸡髓笋，\"糟掌\"改为\"糟鹅掌鸭信\"，删去乌龙戏珠、炸鹌鹑；本题所考\"照法仿制，如茄鲞\"新老教材一致。同类对比‑ ‑ 红楼菜‑ 性质：依据《红楼梦》所记述的贾府饮食研制，具有官府菜的特点；‑ 研制方式：一是根据书中写有具体做法的菜照法仿制，如茄鲞；‑ 代表名菜：茄鲞、糟鹅掌鸭信、火腿炖肘子、鸡髓笋、老蚌怀珠、怡红祝寿等。","type":"单选题"},{"number":59,"stem":"下列名山中，属典型的丹霞地貌的是()。","options":[{"key":"A","text":"福建武夷山"},{"key":"B","text":"陕西华山"},{"key":"C","text":"湖南张家界"},{"key":"D","text":"安徽黄山"}],"answer":"A","keys":["A"],"explanation":"武夷山位于福建省武夷山市、江西省铅山县境内，属典型的丹霞地貌，素有\"碧水丹山\"\"奇秀甲东南\"之美誉，是世界文化与自然双遗产地。同类对比‑ ‑ 我国丹霞地貌景观‑ 命名：1928 年由中国学者在广东丹霞山正式命名，是唯一以我国地名命名、被国际地貌学会专门设立工作组独立研究的地貌类型；‑ 代表：广东丹霞山、福建武夷山、江西龙虎山和圭峰(也称龟峰)等；‑ 武夷山：位于福建省武夷山市、江西省铅山县境内，素有\"碧水丹山\"\"奇秀甲东南\"之美誉。","type":"单选题"},{"number":60,"stem":"北京社稷坛按\"五行\"中五方五色配置，其中中央为()。","options":[{"key":"A","text":"红"},{"key":"B","text":"黄"},{"key":"C","text":"白"},{"key":"D","text":"黑"}],"answer":"B","keys":["B"],"explanation":"北京社稷坛按\"五行\"中五方五色的配置，中央为黄，东方为青，南方为红，西方为白，北方为黑，用五色土覆盖于坛面，以象征\"普天之下，莫非王土\"和祈求全国风调雨顺、五谷丰登。易混对比‑ ‑ 社稷坛五色土‑ 配置：北京社稷坛按\"五行\"中五方五色配置，中央为黄，东方为青、南方为红、西方为白、北方为黑；‑ 做法：用五色土覆盖于坛面；‑ 寓意：象征\"普天之下，莫非王土\"，祈求全国风调雨顺、五谷丰登。","type":"单选题"},{"number":61,"stem":"因春秋时期老子(李耳)归隐修炼于此，唐太宗赐名，有\"天下无双圣境，世界第一仙山\"美誉的是()。","options":[{"key":"A","text":"嵩山"},{"key":"B","text":"老君山"},{"key":"C","text":"云台山"},{"key":"D","text":"白云山"}],"answer":"B","keys":["B"],"explanation":"老君山因春秋时期老子(李耳)归隐修炼于此，唐太宗赐名\"老君山\"，是中原道教的核心圣地，有\"天下无双圣境，世界第一仙山\"美誉。A项嵩山以\"天地之中\"历史建筑群著称，C项云台山、D项白云山均为河南著名山水景区，老子归隐修炼、唐太宗赐名者为老君山，故不选。易混对比‑ ‑ 河南名山(河南)‑ 老君山：老子归隐修炼地，唐太宗赐名，\"天下无双圣境，世界第一仙山\"；‑ 嵩山：\"天地之中\"历史建筑群为世界文化遗产，少林寺坐落于腹地；‑ 云台山：5A 景区，以峡谷地貌著称。","type":"单选题"},{"number":62,"stem":"()城内街道、集市、商铺等还保留着原有形制，是研究我国明清县城建置的实物资料。","options":[{"key":"A","text":"南京古城"},{"key":"B","text":"西安古城"},{"key":"C","text":"平遥古城"},{"key":"D","text":"丽江古城"}],"answer":"C","keys":["C"],"explanation":"平遥古城位于山西省平遥县，始建于西周，距今已有 2800多年的悠久历史。现存城墙为明洪武年间重建，墙外有护城河。城内街道、集市、商铺等还保留着原有形制，是研究我国明清县城建置的实物资料。同类对比‑ ‑ 平遥古城与著名古城‑ 平遥古城：位于山西省平遥县，始建于西周，距今已有 2800多年的历史；‑ 价值：晋商文化的代表，是清代中国的\"金融中心\"，被誉为\"中国古代华尔街\"；‑ 四大古城：我国保存最完好的历史文化古城是平遥古城、丽江古城、徽州古城、阆中古城。","type":"单选题"},{"number":63,"stem":"2023年，习近平总书记在内蒙古、新疆、广西考察时指出，新时代党的民族工作和民族地区各项工作的共同主线是()。","options":[{"key":"A","text":"铸牢中华民族共同体意识"},{"key":"B","text":"坚持民族区域自治"},{"key":"C","text":"促进民族团结进步"},{"key":"D","text":"推动各民族共同繁荣"}],"answer":"A","keys":["A"],"explanation":"2023 年，习近平总书记在内蒙古、新疆、广西考察时指出，铸牢中华民族共同体意识是新时代党的民族工作的主线，也是民族地区各项工作的主线。B 项民族区域自治是中国解决国内民族问题的基本政策，也是我国的一项基本政治制度。C项促进民族团结进步是《中华人民共和国民族团结进步促进法》的立法目的之一。D 项各民族共同繁荣发展是民族区域自治的着力点之一。26 版教材新增考点。同类对比‑ ‑ 新时代党的民族工作‑ 主线：铸牢中华民族共同体意识是新时代党的民族工作的主线，也是民族地区各项工作的主线；‑ 提出：2023年，习近平总书记在内蒙古、新疆、广西考察时指出；‑ 法律保障：2026 年 7 月 1 日起施行的《中华人民共和国民族团结进步促进法》进一步明确\"国家坚持和完善民族区域自治制度\"。","type":"单选题"},{"number":64,"stem":"有\"乾坤聚秀之区，阴阳合会之所\"之称的是()。","options":[{"key":"A","text":"清东陵"},{"key":"B","text":"清西陵"},{"key":"C","text":"明十三陵"},{"key":"D","text":"明显陵"}],"answer":"B","keys":["B"],"explanation":"清西陵有\"乾坤聚秀之区，阴阳合会之所\"之称。A 项清东陵在河北遵化，C项明十三陵在北京昌平，D项明显陵在湖北钟祥，有\"乾坤聚秀之区，阴阳合会之所\"之称者为清西陵，故不选。易混对比‑ ‑ 清代皇陵(河北)‑ 清西陵：有\"乾坤聚秀之区，阴阳合会之所\"之称；‑ 清东陵已开放 10 座陵寝，孝陵神道长达千米，为清代最长神道。","type":"单选题"},{"number":65,"stem":"被视为道教发祥地的青城山、终南山，在道教流派上属于()。","options":[{"key":"A","text":"正一道"},{"key":"B","text":"全真派"},{"key":"C","text":"灵宝派"},{"key":"D","text":"净明道"}],"answer":"B","keys":["B"],"explanation":"目前全国道教宫观大部分属全真派，被视为道教发祥地的青城山、终南山皆属全真派，北京白云观、成都青羊宫、沈阳太清宫等都是全真派的著名道观。A 正一道主要流行在江南和台湾，以苏州玄妙观、桃园妙应坛等为代表。易混对比‑ ‑ 道教全真派与正一道‑ 全真派：目前全国道教宫观大部分属全真派，青城山、终南山皆属全真派；‑ 全真派名观：北京白云观、成都青羊宫、沈阳太清宫等；‑ 正一道：主要流行在江南和台湾，以苏州玄妙观、桃园妙应坛等为代表。","type":"单选题"},{"number":66,"stem":"世界首个双重遗产是()。","options":[{"key":"A","text":"武夷山"},{"key":"B","text":"黄山"},{"key":"C","text":"泰山"},{"key":"D","text":"峨眉山及乐山大佛"}],"answer":"C","keys":["C"],"explanation":"世界文化与自然双重遗产是指自然和文化价值相结合的遗产，泰山(泰山、岱庙、济南灵岩寺)是世界首个双重遗产。双遗 4：吾皇太饿‑ ‑ 武(武夷山)皇(黄山)太(泰山)峨(峨眉山‑ 乐山大佛)。我国世界文化与自然双重遗产共 4项：泰山、黄山、峨眉山及乐山大佛、武夷山，数量与澳大利亚并列世界第一。同类对比‑ ‑ 世界双重遗产‑ 泰山：世界首个双重遗产(山东)；‑ 4 处名单：泰山、黄山、峨眉山及乐山大佛、武夷山；‑ 数量：与澳大利亚并列世界第一。","type":"单选题"},{"number":67,"stem":"下列名茶中，属于黄茶的是()。","options":[{"key":"A","text":"西湖龙井"},{"key":"B","text":"安徽祁红"},{"key":"C","text":"君山银针"},{"key":"D","text":"铁观音"}],"answer":"C","keys":["C"],"explanation":"黄茶著名品种有君山银针、蒙顶黄芽等。A西湖龙井与太湖碧螺春、黄山毛峰、峨眉竹叶青并为最负盛名的绿茶；B 安徽祁红、云南滇红是红茶名品；D 铁观音是福建乌龙茶名品。易混对比‑ ‑ 黄茶与绿茶名品‑ 黄茶：著名品种有君山银针、蒙顶黄芽等，黄叶黄汤；‑ 黄茶工艺：加工过程中采用杀青、焖黄的方法，使鲜叶进行非酶性氧化；‑ 绿茶：西湖龙井茶、太湖碧螺春茶、黄山毛峰茶、峨眉竹叶青茶最负盛名。","type":"单选题"},{"number":68,"stem":"盐矿储藏量不仅是中国之最、也是世界之最，素有\"聚宝盆\"美称的盆地是()。","options":[{"key":"A","text":"塔里木盆地"},{"key":"B","text":"准噶尔盆地"},{"key":"C","text":"四川盆地"},{"key":"D","text":"柴达木盆地"}],"answer":"D","keys":["D"],"explanation":"柴达木盆地的盐矿储藏量不仅是中国之最，也是世界之最，察尔汗盐湖、茶卡盐湖为国内知名盐湖和旅游点，有\"聚宝盆\"的美称。易混对比‑ ‑ 柴达木盆地‑ 位置：位于青海省西北部和青藏高原东北部，为高原型盆地；‑ 盐矿：盐矿储藏量不仅是中国之最，也是世界之最，察尔汗盐湖、茶卡盐湖为国内知名盐湖和旅游点；‑ 聚宝盆：盆地还盛产锂矿、铁矿、铜矿、锡矿等多种矿物，故有\"聚宝盆\"的美称。","type":"单选题"},{"number":69,"stem":"被誉为\"草原明珠\"的是()。","options":[{"key":"A","text":"锡林郭勒草原"},{"key":"B","text":"科尔沁草原"},{"key":"C","text":"呼伦贝尔草原"},{"key":"D","text":"乌兰布统草原"}],"answer":"C","keys":["C"],"explanation":"呼伦贝尔草原被誉为\"草原明珠\"。A 项锡林郭勒草原、B 项科尔沁草原、D 项乌兰布统草原均为内蒙古著名草原，但被善为\"草原明珠\"者为呼伦贝尔草原，故不选。易混对比‑ ‑ 草原誉称(内蒙古)‑ 呼伦贝尔草原：\"草原明珠\"；‑ 科尔沁草原：\"草原上的花园\"。","type":"单选题"},{"number":70,"stem":"崇圣寺三塔是大理\"文献名邦\"的象征，位于()。","options":[{"key":"A","text":"云南昆明"},{"key":"B","text":"四川成都"},{"key":"C","text":"贵州贵阳"},{"key":"D","text":"云南大理"}],"answer":"D","keys":["D"],"explanation":"崇圣寺三塔位于云南大理，是大理\"文献名邦\"的象征，是云南古代历史文化的象征，也是中国南方最古老、最雄伟的建筑之一。同类对比‑ ‑ 崇圣寺三塔与著名古塔‑ 崇圣寺三塔：是大理\"文献名邦\"的象征，也是云南古代历史文化的象征；‑ 地位：中国南方最古老、最雄伟的建筑之一；‑ 其他名塔：河南嵩岳寺塔、西安小雁塔(方形密檐式)、北京妙应寺白塔(覆钵式塔)等都是现存著名古塔。","type":"单选题"},{"number":71,"stem":"北宋时在成都产生的世界上最早的纸币是()。","options":[{"key":"A","text":"银票"},{"key":"B","text":"会子"},{"key":"C","text":"飞钱"},{"key":"D","text":"交子"}],"answer":"D","keys":["D"],"explanation":"北宋时在成都产生了世界上最早的纸币‑ ‑ 交子。A 项银票为明清信用工具，B项会子为南宋纸币，C项飞钱为唐代汇兑凭证，世界上最早的纸币为北宋成都产生的交子，故不选。唐宋时期四川经济发达，唐代有\"扬一益二\"之称(扬：扬州；益：益州)。同类对比‑ ‑ 古代四川经济名片(四川)‑ \"扬一益二\"：唐代扬州、益州(成都)并称，经济发达；‑ 交子：北宋时在成都产生，世界上最早的纸币。","type":"单选题"},{"number":72,"stem":"\"星星的故乡\"\"看见贺兰\"等新业态推动()\"文旅+百业\"深度融合。","options":[{"key":"A","text":"宁夏"},{"key":"B","text":"甘肃"},{"key":"C","text":"青海"},{"key":"D","text":"新疆"}],"answer":"A","keys":["A"],"explanation":"\"星星的故乡\"\"看见贺兰\"等新业态推动宁夏\"文旅+百业\"深度融合。B 项甘肃、C 项青海、D 项新疆均为西北省区，但\"星星的故乡\"\"看见贺兰\"等新业态推动\"文旅+百业\"深度融合者为宁夏，故不选。贺兰山东麓葡萄酒品牌价值在葡萄酒细分领域中居中国第一、世界第四，获国际顶级赛事大奖 1100多项。","type":"单选题"},{"number":73,"stem":"明清科举殿试一甲前三名赐\"进士及第\"，二甲、三甲分别赐()。","options":[{"key":"A","text":"\"同进士出身\"和\"进士出身\""},{"key":"B","text":"\"解元出身\"和\"会元出身\""},{"key":"C","text":"\"贡士出身\"和\"进士出身\""},{"key":"D","text":"\"进士出身\"和\"同进士出身\""}],"answer":"D","keys":["D"],"explanation":"明清科举殿试排名分三等称\"三甲\"，一甲前三名赐\"进士及第\"，二甲和三甲分别赐\"进士出身\"和\"同进士出身\"称号。B解元、会元分别是乡试、会试第一名的称呼。易混对比‑ ‑ 明清科举\"三甲\"‑ 一甲：取前三名，分别称状元、榜眼、探花，赐\"进士及第\"；‑ 二甲：赐\"进士出身\"；‑ 三甲：赐\"同进士出身\"；‑ 连中三元：乡试第一名解元、会试第一名会元、殿试第一名状元。","type":"单选题"},{"number":74,"stem":"正定\"三八席\"是极具代表性的传统民俗宴席，\"三八席\"是指()。","options":[{"key":"A","text":"八凉、八热、八蒸碗"},{"key":"B","text":"四凉、四热、八大碗"},{"key":"C","text":"六凉、六热、六蒸碗"},{"key":"D","text":"八冷、八热、八扣碗"}],"answer":"A","keys":["A"],"explanation":"正定\"三八席\"(八凉、八热、八蒸碗)是极具代表性的传统民俗宴席。B 项\"四凉、四热、八大碗\"、C 项\"六凉、六热、六蒸碗\"、D 项\"八冷、八热、八扣碗\"均与教材\"八凉、八热、八蒸碗\"的表述不符，故不选。同类对比‑ ‑ 河北风物(河北)‑ \"涉县三珍\"(\"太行三珍\")：核桃、柿子、花椒；‑ 河间驴肉火烧：河北标志性特产美食；‑ 正定\"三八席\"：八凉、八热、八蒸碗的传统民俗宴席。","type":"单选题"},{"number":75,"stem":"新疆维吾尔族地区特有的水利灌溉工程是()。","options":[{"key":"A","text":"都江堰"},{"key":"B","text":"灵渠"},{"key":"C","text":"坎儿井"},{"key":"D","text":"红旗渠"}],"answer":"C","keys":["C"],"explanation":"坎儿井是新疆维吾尔族地区特有的水利灌溉工程。A 项都江堰在四川，B项灵渠在广西，D项红旗渠在河南安阳林州，新疆维吾尔族地区特有的水利灌溉工程为坎儿井，故不选。易混对比‑ ‑ 古代水利工程‑ 都江堰：四川，战国时期修筑；‑ 灵渠：广西，沟通湘江与漓江；‑ 坎儿井：新疆特有，维吾尔族地区水利灌溉工程；‑ 红旗渠：河南安阳林州，被誉为\"人工天河\"。","type":"单选题"},{"number":76,"stem":"浙江龙泉青瓷在()时达到巅峰。","options":[{"key":"A","text":"元朝"},{"key":"B","text":"明朝"},{"key":"C","text":"北宋"},{"key":"D","text":"南宋"}],"answer":"D","keys":["D"],"explanation":"龙泉青瓷在南宋时达到巅峰，成品具备\"青如玉、明如镜、薄如纸、声如磬\"的特点。同类对比‑ ‑ 龙泉青瓷‑ 产地：浙江龙泉，境内烧制青瓷的古代窑址有 360多处，史称龙泉窑；‑ 巅峰：龙泉青瓷在南宋时达到巅峰；‑ 特点：成品具备\"青如玉、明如镜、薄如纸、声如磬\"的特点。","type":"单选题"},{"number":77,"stem":"最能代表潍坊风筝特点的是()。","options":[{"key":"A","text":"\"蜈蚣\"风筝"},{"key":"B","text":"\"灵芝\"风筝"},{"key":"C","text":"硬翅风筝"},{"key":"D","text":"软翅风筝"}],"answer":"A","keys":["A"],"explanation":"潍坊风筝题材广泛，其中最能代表其特点的是\"蜈蚣\"风筝；以\"龙头蜈蚣\"为代表的制作技艺曾获金奖。26教材新增考点。同类对比‑ ‑ 潍坊风筝‑ 地位：潍坊是\"世界风筝都\"，也被称为\"风筝的故乡\"；‑ 代表：潍坊风筝题材广泛，最能代表其特点的当数\"蜈蚣\"风筝；‑ 非遗：2006年，潍坊风筝制作技艺被列入第一批国家级非物质文化遗产名录。","type":"单选题"},{"number":78,"stem":"著有《史学要论》、大力宣传马克思主义唯物史观的学者是()。","options":[{"key":"A","text":"梁启超"},{"key":"B","text":"李大钊"},{"key":"C","text":"郭沫若"},{"key":"D","text":"范文澜"}],"answer":"B","keys":["B"],"explanation":"李守常(李大钊)著《史学要论》，大力宣传马克思主义唯物史观。易混对比‑ ‑ 李大钊与马克思主义史学‑ 李大钊：著《史学要论》，大力宣传马克思主义唯物史观；‑ 李大钊(李守常)：是在中国举起十月革命旗帜的第一人，是中国最早的马克思主义传播者；‑ 郭沫若、范文澜：等一批学者也先后运用唯物史观开展历史研究。","type":"单选题"},{"number":79,"stem":"春秋鲁国人，中国儒家文化的集大成者，被后世奉为\"圣人\"的是()。","options":[{"key":"A","text":"孔丘"},{"key":"B","text":"孟子"},{"key":"C","text":"荀子"},{"key":"D","text":"曾子"}],"answer":"A","keys":["A"],"explanation":"春秋鲁国人孔丘是中国儒家文化的集大成者，被后世奉为\"圣人\"。B 项孟子被尊为\"亚圣\"，C 项荀子为战国儒家代表，D项曾子为孔子弟子，中国儒家文化的集大成者、被后世奉为\"圣人\"者为孔丘，故不选。同类对比‑ ‑ 儒家圣贤与\"三孔\"(山东)‑ 孔丘：春秋鲁国人，儒家文化集大成者，被后世奉为\"圣人\"；‑ 孔庙：\"天下第一庙\"，建筑时间最久远、保存最完整；‑ 孔府：\"天下第一家\"，延续时间最长的贵族庄园；‑ 孔林：世界上规模最大、延续时间最久的家族古墓群。","type":"单选题"},{"number":80,"stem":"古代天文学中，\"荧惑星\"指的是()。","options":[{"key":"A","text":"水星"},{"key":"B","text":"金星"},{"key":"C","text":"火星"},{"key":"D","text":"土星"}],"answer":"C","keys":["C"],"explanation":"易混对比‑ ‑ 五星与七曜‑ 五星：荧惑星(火星)、辰星(水星)、岁星(木星)、太白星(金星)、镇星(土星)；‑ 七曜：五星又称五曜，加上太阳星(日)、太阴星(月)合称七曜；‑ 荧惑：即火星，本题所考\"荧惑星\"。","type":"单选题"},{"number":81,"stem":"1935年 12 月召开的瓦窑堡会议明确提出党的基本策略任务是()。","options":[{"key":"A","text":"建立广泛的抗日民族统一战线"},{"key":"B","text":"确立思想建党、政治建军原则"},{"key":"C","text":"确立毛泽东在党中央和红军的领导地位"},{"key":"D","text":"确定把全党工作重点转移到社会主义现代化建设上来"}],"answer":"A","keys":["A"],"explanation":"1935年 12月 17~25日，中共中央在陕北子长县瓦窑堡召开政治局扩大会议，即瓦窑堡会议；会议决议和毛泽东《论反对日本帝国主义的策略》的报告，明确提出了党的基本策略任务是建立广泛的抗日民族统一战线。B 确立思想建党、政治建军原则的是古田会议；C遵义会议事实上确立了毛泽东同志在党中央和红军的领导地位；D 确定把全党工作重点转移到社会主义现代化建设上来的是党的十一届三中全会。易混对比‑ ‑ 党的会议与历史贡献‑ 瓦窑堡会议：1935年 12月召开，明确提出党的基本策略任务是建立广泛的抗日民族统一战线；‑ 古田会议：1929年 12月召开，确立了思想建党、政治建军的原则；‑ 遵义会议：1935 年 1 月召开，事实上确立了毛泽东同志在党中央和红军的领导地位，是党的历史上生死攸关的转折点。","type":"单选题"},{"number":82,"stem":"中国最大的北方小油菜基地的是()。","options":[{"key":"A","text":"青海湖"},{"key":"B","text":"百里油菜花海"},{"key":"C","text":"龙羊峡"},{"key":"D","text":"贵德梨花"}],"answer":"B","keys":["B"],"explanation":"百里油菜花海位于海北藏族自治州门源县、祁连山与大坂山之间的盆地，是中国最大的北方小油菜基地。A 项青海湖、C 项龙羊峡、D 项贵德梨花均为青海知名景观，位于门源县、为中国最大北方小油菜基地者为百里油菜花海，故不选。同类对比‑ ‑ 青海名片(青海)‑ 青海湖：我国最大的内陆咸水湖；‑ 柴达木盆地：以\"聚宝盆\"著称于世；‑ 百里油菜花海：位于门源县，中国最大的北方小油菜基地。","type":"单选题"},{"number":83,"stem":"中国第一部字典是东汉许慎编撰的()。","options":[{"key":"A","text":"《说文解字》"},{"key":"B","text":"《康熙字典》"},{"key":"C","text":"《广韵》"},{"key":"D","text":"《尔雅》"}],"answer":"A","keys":["A"],"explanation":"东汉许慎编撰了中国第一部字典《说文解字》，保存了大批先秦字体和汉代的文字训诂，反映了上古汉语词汇的面貌。","type":"单选题"},{"number":84,"stem":"蕈状岩的典型代表，野柳地质公园的象征，台湾旅游业一张亮丽名片的是()。","options":[{"key":"A","text":"烛台石"},{"key":"B","text":"仙女鞋"},{"key":"C","text":"女王头"},{"key":"D","text":"豆腐岩"}],"answer":"C","keys":["C"],"explanation":"女王头是蕈状岩的典型代表，是野柳地质公园的象征，更是台湾旅游业的一张亮丽的名片。A 项烛台石、B 项仙女鞋、D 项豆腐岩均为野柳地质公园著名景观，但蕈状岩典型代表、野柳地质公园象征者为女王头，故不选。同类对比‑ ‑ 野柳风景区(台湾)‑ 野柳：伸入海中的山岬，远望如海龟蹒跚离岸，故称野柳龟；‑ 女王头：蕈状岩典型代表，野柳地质公园的象征，台湾旅游业的亮丽名片。","type":"单选题"},{"number":85,"stem":"满族人口居全国第 1 位的省份是()。","options":[{"key":"A","text":"辽宁省"},{"key":"B","text":"吉林省"},{"key":"C","text":"黑龙江省"},{"key":"D","text":"河北省"}],"answer":"A","keys":["A"],"explanation":"辽宁人口占全国满族人口的 50.4%，居全国第 1位。B项吉林、C 项黑龙江、D 项河北均非教材所载满族人口占比最高的省份，满族人口占全国 50.4%、居全国第 1 位的是辽宁，故不选。同类对比‑ ‑ 辽宁民族人口(辽宁)‑ 满族：人口占全国满族人口的 50.4%，居全国第 1位；‑ 锡伯族：人口占全国锡伯族人口的 70.2%，居全国第 1位；‑ 世居少数民族：满族、蒙古族、回族、朝鲜族、锡伯族。","type":"单选题"},{"number":86,"stem":"世界独立纬向山系之最、距海洋最远的山系是()。","options":[{"key":"A","text":"祁连山"},{"key":"B","text":"喜马拉雅山"},{"key":"C","text":"昆仑山"},{"key":"D","text":"天山"}],"answer":"D","keys":["D"],"explanation":"天山位于欧亚大陆腹地，横贯中国新疆中部，为世界独立纬向山系之最，也是世界上距离海洋最远的山系。同类对比‑ ‑ 天山‑ 位置：位于欧亚大陆腹地，横贯中国新疆中部，在塔里木盆地和准噶尔盆地之间；‑ 之最：世界独立纬向山系之最，也是世界上距离海洋最远的山系；‑ 干旱：还是全球干旱地区最大的山系。","type":"单选题"},{"number":87,"stem":"具有\"一座没有围墙的博物馆\"独特魅力的城市是()。","options":[{"key":"A","text":"杭州市"},{"key":"B","text":"宁波市"},{"key":"C","text":"绍兴市"},{"key":"D","text":"嘉兴市"}],"answer":"C","keys":["C"],"explanation":"绍兴具有\"一座没有围墙的博物馆\"的独特魅力。A 项杭州以西湖文化著称，B 项宁波为港口城市，D项嘉兴有南湖红船，具有\"一座没有围墙的博物馆\"魅力者为绍兴，故不选。同类对比‑ ‑ 浙江城市名片(浙江)‑ 绍兴：\"一座没有围墙的博物馆\"；‑ 杭州：以西湖文化、运河文化、钱塘江文化为核心，\"茶都\"；‑ 景宁：全国唯一的畲族自治县。","type":"单选题"},{"number":88,"stem":"春秋时期称霸中原，成为春秋五霸之一的楚国国君是()。","options":[{"key":"A","text":"楚成王"},{"key":"B","text":"楚庄王"},{"key":"C","text":"楚怀王"},{"key":"D","text":"楚悼王"}],"answer":"B","keys":["B"],"explanation":"春秋时期楚庄王称霸中原，成为春秋五霸之一。A 项楚成王、C 项楚怀王、D 项楚悼王均为楚国国君，但春秋时期称霸中原、成为春秋五霸之一者为楚庄王，故不选。同类对比‑ ‑ 楚文化源流(湖北)‑ 屈家岭文化：长江中游新石器时代大型聚落遗址，楚文化发展的基础；‑ 楚先民：以凤鸟为图腾；‑ 楚庄王：春秋时期称霸中原，春秋五霸之一；‑ 屈原：战国时代伟大诗人，创造\"楚辞\"诗体，作《离骚》《九歌》《九章》《天问》。","type":"单选题"},{"number":89,"stem":"世界上最小的国家，是一个\"国中国\"的是()。","options":[{"key":"A","text":"梵蒂冈"},{"key":"B","text":"摩纳哥"},{"key":"C","text":"列支敦士登"},{"key":"D","text":"圣马力诺"}],"answer":"A","keys":["A"],"explanation":"梵蒂冈是世界上最小的国家，面积 0.44平方千米，在罗马城的西北角，是一个\"国中国\"，也是全世界天主教的中心。同类对比‑ ‑ 梵蒂冈‑ 地位：世界上最小的国家；‑ 面积：面积 0.44 平方千米，在罗马城的西北角；‑ 特点：是一个\"国中国\"，也是全世界天主教的中心‑ ‑ 以教皇为首的教廷的所在地。","type":"单选题"},{"number":90,"stem":"青藏高原唯一人口超过百万的中心城市的是()。","options":[{"key":"A","text":"拉萨"},{"key":"B","text":"西宁"},{"key":"C","text":"格尔木"},{"key":"D","text":"兰州"}],"answer":"B","keys":["B"],"explanation":"西宁古称西平郡、青唐城，是青藏高原唯一人口超过百万的中心城市。A 项拉萨是西藏自治区首府，C 项格尔木坐拥察尔汗盐湖等景观，D 项兰州为甘肃省会，青藏高原唯一人口超过百万的中心城市为西宁，故不选。同类对比‑ ‑ 青藏高原城市‑ 西宁：青藏高原唯一人口超过百万的中心城市，古称西平郡、青唐城(青海)；‑ 拉萨：藏语意为\"圣地\"，史称\"逻些\"，素有\"日光城\"美誉(西藏)。","type":"单选题"},{"number":91,"stem":"拥有人类非物质文化遗产数量最多的国家是()。","options":[{"key":"A","text":"意大利"},{"key":"B","text":"中国"},{"key":"C","text":"法国"},{"key":"D","text":"日本"}],"answer":"B","keys":["B"],"explanation":"截至目前，我国共有 45个项目列入联合国教科文组织非遗名录、名册，总数居世界第一，其中，列入代表作名录 40 项，列入急需保护名录项目 3 项，入选优秀保护实践名册2项。(数据更新，以此为准)。口诀：非遗 45 中国一：代表 40，急 3，优 2。","type":"单选题"},{"number":92,"stem":"世界最大的藏学学府，藏传佛教格鲁派六大宗主寺之一的是()。","options":[{"key":"A","text":"塔尔寺"},{"key":"B","text":"拉卜楞寺"},{"key":"C","text":"大昭寺"},{"key":"D","text":"哲蚌寺"}],"answer":"B","keys":["B"],"explanation":"甘南夏河拉卜楞寺世界最大的藏学学府、藏传佛教格鲁派六大宗主寺之一、青川地区最大的藏族宗教和文化中心。A 项塔尔寺在青海西宁，C 项大昭寺在西藏拉萨，D 项哲蚌寺为拉萨格鲁派三大寺之一，世界最大的藏学学府为甘南夏河拉卜楞寺，故不选。易混对比‑ ‑ 藏传佛教格鲁派名寺‑ 拉卜楞寺：世界最大的藏学学府，位于甘南夏河(甘肃)；‑ 塔尔寺：宗喀巴诞生地，艺术\"三绝\"酥油花、堆绣、壁画(青海)；‑ 甘丹寺、色拉寺、哲蚌寺：拉萨著名寺院(西藏)；‑ 扎什伦布寺：日喀则著名寺院(西藏)。","type":"单选题"},{"number":93,"stem":"香港的()被称为\"百业之首\"。","options":[{"key":"A","text":"旅游业"},{"key":"B","text":"航运业"},{"key":"C","text":"贸易业"},{"key":"D","text":"金融业"}],"answer":"D","keys":["D"],"explanation":"香港的金融业被称为\"百业之首\"。A 项旅游业、B 项航运业、C 项贸易业均为香港重要产业，但被称为\"百业之首\"者为香港的金融业，故不选。同类对比‑ ‑ 香港经济地位(香港)‑ 金融业：被称为\"百业之首\"；‑ 国际金融中心：继纽约、伦敦之后的世界第三大金融中心；‑ 四大支柱行业：金融服务业、旅游业、贸易及物流业、专业及工商业支援服务业。","type":"单选题"},{"number":94,"stem":"金银线垫绣是()中具有特色的工种之一，它使绣上的景物形象富有立体感。","options":[{"key":"A","text":"苏州苏绣"},{"key":"B","text":"湖南湘绣"},{"key":"C","text":"广东粤绣"},{"key":"D","text":"四川蜀绣"}],"answer":"C","keys":["C"],"explanation":"粤绣以“金银线绣”和“垫绣”为核心技法。“垫绣”是粤绣的独创，通过在纹样下方垫入棉絮等材料，使纹样凸起，具有强烈的立体感。26版教材将粤绣核心技法“金银线垫绣”拆分为“金银线绣”和“垫绣”，删除“绣工多为男工”等旧述。同类对比——四大名绣· 苏绣：产地江苏苏州，以针法细腻、色彩清雅、构图精巧著称；· 湘绣：产自湖南长沙，以狮、虎为代表题材，有“苏猫湘虎”之说，独门绝技为“毛针”；· 粤绣：产于广东，以“金银线绣”和“垫绣”为核心技法，《百鸟朝凤》是粤绣名作；· 蜀绣：以四川成都为中心，有“蜀中之宝”的美誉，代表作有《蜀宫乐女演乐图》《熊猫图》《芙蓉鲤鱼》。","type":"单选题"},{"number":95,"stem":"1947年 8 月，揭开人民解放军战略反攻序幕的是()。","options":[{"key":"A","text":"攻克济南"},{"key":"B","text":"三大战役"},{"key":"C","text":"转战陕北"},{"key":"D","text":"千里跃进大别山"}],"answer":"D","keys":["D"],"explanation":"1947年 6月，刘邓大军突破黄河天险，8月，千里跃进大别山，揭开战略反攻的序幕。同类对比‑ ‑ 人民解放战争战略反攻‑ 时间：1947年 6 月刘邓大军突破黄河天险，8月千里跃进大别山；‑ 意义：揭开了战略反攻的序幕；‑ 战果：到 11 月共歼敌 3 万余人，建立 33个县的民主政权。","type":"单选题"},{"number":96,"stem":"1930年夏，全国面积最大、力量最强的农村革命根据地是()。","options":[{"key":"A","text":"井冈山革命根据地"},{"key":"B","text":"赣南闽西根据地"},{"key":"C","text":"湘鄂西革命根据地"},{"key":"D","text":"陕甘革命根据地"}],"answer":"B","keys":["B"],"explanation":"到 1930年夏，全国已经建立十几块农村革命根据地，其中毛泽东、朱德领导下的赣南闽西根据地是当时全国面积最大、力量最强的根据地，建立了苏区中央局和苏维埃中央政府。同类对比‑ ‑ 中央革命根据地‑ 地位：赣南闽西根据地是当时全国面积最大、力量最强的农村革命根据地；‑ 领导：由毛泽东、朱德领导建立；‑ 别称：建立了苏区中央局和苏维埃中央政府，因此又称中央根据地、中央苏区。","type":"单选题"},{"number":97,"stem":"\"越陈越香\"是()区别于其他茶类的最大特点。","options":[{"key":"A","text":"碧螺春"},{"key":"B","text":"大红袍"},{"key":"C","text":"普洱茶"},{"key":"D","text":"铁观音"}],"answer":"C","keys":["C"],"explanation":"\"越陈越香\"被公认为是普洱茶区别于其他茶类的最大特点，还有一定的减肥降脂功效。同类对比‑ ‑ 普洱茶‑ 特点：\"越陈越香\"被公认为是普洱茶区别于其他茶类的最大特点；‑ 功效：还有一定的减肥降脂功效；‑ 归类：普洱茶是黑茶名品，黑茶主要分布在湖南、四川、云南、湖北。","type":"单选题"},{"number":98,"stem":"中国经济第一大省是()。","options":[{"key":"A","text":"江苏省"},{"key":"B","text":"山东省"},{"key":"C","text":"浙江省"},{"key":"D","text":"广东省"}],"answer":"D","keys":["D"],"explanation":"广东经济发展水平稳居全国首位，不仅是中国第一经济大省，更是全球最具活力和竞争力的区域经济体之一。A 项江苏、B 项山东、C 项浙江均为经济大省，但中国经济第一大省为广东，故不选。同类对比‑ ‑ 经济大省座次‑ 广东：中国第一经济大省，经济发展水平稳居全国首位；‑ 江苏：2025年经济总量突破 14万亿元，稳居全国第二位；‑ 上海：2025年经济总量 5.67万亿元，稳居中国城市首位。","type":"单选题"},{"number":99,"stem":"以蓝釉为其特点的北京特有传统工艺品是()。","options":[{"key":"A","text":"苏绣"},{"key":"B","text":"玉雕"},{"key":"C","text":"景泰蓝"},{"key":"D","text":"内画鼻烟壶"}],"answer":"C","keys":["C"],"explanation":"景泰蓝是北京特有的传统工艺品，得名于明朝景泰年间，且以蓝釉为其特点。A 项苏绣为江苏苏州传统工艺，B项玉雕、D项内画鼻烟壶虽为北京传统工艺，但得名于明朝景泰年间、以蓝釉为特点者为景泰蓝，故不选。同类对比‑ ‑ 景泰蓝(北京)‑ 得名：明朝景泰年间，以蓝釉为特点，北京特有传统工艺品；‑ 工艺：集青铜、瓷器、传统绘画、雕刻技艺于一体，堪称中国传统工艺的集大成者；‑ 现存最早产品：元代，已有近千年历史。","type":"单选题"},{"number":100,"stem":"全球最大综合孔径射电望远镜是()。","options":[{"key":"A","text":"中国天眼"},{"key":"B","text":"千眼天珠"},{"key":"C","text":"郭守敬望远镜"},{"key":"D","text":"拉索"}],"answer":"B","keys":["B"],"explanation":"圆环阵太阳射电成像望远镜直径 1000 米，由 313 台 6 米口径射电天线均匀排列而成，是全球最大综合孔径射电望远镜，可以全天候监测太阳射电爆发，预警空间天气。因从空中俯瞰像一串巨大珠串，故名\"千眼天珠\"。D\"拉索\"是超高能伽马射线探测装置。易混对比‑ ‑ \"拉索\"与\"千眼天珠\"‑ \"拉索\"：全球海拔最高、规模最大、灵敏度最强的超高能伽马射线探测装置；‑ \"千眼天珠\"：全球最大综合孔径射电望远镜，直径 1000米，由 313台 6米口径射电天线均匀排列而成；‑ 位置：二者均在四川稻城县建成。","type":"单选题"},{"number":101,"stem":"我国第一艘载人飞船()成功升空并安全着陆，中国成为世界上第三个独立掌握载人航天技术的国家。","options":[{"key":"A","text":"神舟四号"},{"key":"B","text":"神舟五号"},{"key":"C","text":"神舟六号"},{"key":"D","text":"神舟七号"}],"answer":"B","keys":["B"],"explanation":"2003 年 10 月 15‑ 16 日，神舟五号载人飞船成功升空并安全着陆，中国成为世界上第三个独立掌握载人航天技术的国家；我国载人航天工程通过\"神舟\"系列飞船建起了天宫空间站，实现了从无人飞行到载人飞行、从一人一天到多人多天、从空间出舱到交会对接、从单船飞行到组合体稳定运行的跨越。同类对比‑ ‑ 我国重大科技成就‑ 神舟五号：载人飞船成功升空并安全着陆，中国成为世界上第三个独立掌握载人航天技术的国家；‑ \"拉索\"：全球海拔最高、规模最大、灵敏度最强的超高能伽马射线探测装置；‑ \"千眼天珠\"：全球最大综合孔径射电望远镜，由 313台 6 米口径射电天线均匀排列而成。","type":"单选题"},{"number":102,"stem":"客家人聚族而居，被称为中国传统民居的瑰宝、体现宗族凝聚力的是()。","options":[{"key":"A","text":"开平碉楼"},{"key":"B","text":"福建土楼"},{"key":"C","text":"吊脚楼"},{"key":"D","text":"围龙屋"}],"answer":"B","keys":["B"],"explanation":"客家人聚族而居，福建土楼被称为中国传统民居的瑰宝，体现了宗族凝聚力，被列入《世界遗产名录》。A项开平碉楼在广东，C 项吊脚楼为土家族等民族的传统民居，D 项围龙屋是客家文化特色民居，被称为\"中国传统民居的瑰宝\"者为福建土楼，故不选。易混对比‑ ‑ 民居与地域‑ 福建土楼：中国传统民居的瑰宝，体现宗族凝聚力，列入《世界遗产名录》(福建)‑ 开平碉楼：华侨文化特色民居，列入《世界遗产名录》(广东)；‑ 围龙屋：客家特色民居建筑(广东)；‑ 吊脚楼：土家族、苗族依山而建的传统民居(湖南、贵州等)。","type":"单选题"},{"number":103,"stem":"\"一陵两冢\"的陵寝结构为历代帝王陵墓所绝无仅有的是()。","options":[{"key":"A","text":"清东陵"},{"key":"B","text":"西夏王陵"},{"key":"C","text":"明显陵"},{"key":"D","text":"长陵"}],"answer":"C","keys":["C"],"explanation":"明显陵位于湖北省钟祥市，是明世宗嘉靖皇帝的父亲恭睿献皇帝和母亲章圣皇太后的合葬墓，其\"一陵两冢\"的陵寝结构为历代帝王陵墓所绝无仅有。同类对比‑ ‑ 明代帝陵‑ 明显陵：位于湖北，嘉靖皇帝父母的合葬墓，\"一陵两冢\"结构为历代帝王陵墓所绝无仅有；‑ 明孝陵：在南京东郊紫金山，朱元璋与皇后马氏合葬，是中国明陵之首；‑ 明十三陵：在北京昌平天寿山南麓，环葬明代十三位皇帝，长陵位居陵区正中。","type":"单选题"},{"number":104,"stem":"新疆被誉为\"塞外江南\"的地方是()。","options":[{"key":"A","text":"伊犁谷地"},{"key":"B","text":"塔里木盆地"},{"key":"C","text":"吐鲁番盆地"},{"key":"D","text":"准噶尔盆地"}],"answer":"A","keys":["A"],"explanation":"在天山东部和西部，还有被称为\"火洲\"的吐鲁番盆地和被誉为\"塞外江南\"的伊犁谷地。B 项塔里木盆地是中国最大的全封闭性内陆盆地，C 项吐鲁番盆地被称为\"火洲\"，D 项准噶尔盆地位于阿尔泰山与天山之间，三者均非\"塞外江南\"，故不选。易混对比‑ ‑ \"江南\"誉称‑ 新疆：伊犁谷地被誉为\"塞外江南\"；‑ 宁夏：宁夏平原素有\"塞上江南\"之称。","type":"单选题"},{"number":105,"stem":"单粮型浓香代表泸州老窖的核心酿酒原料是()。","options":[{"key":"A","text":"大米"},{"key":"B","text":"糯米"},{"key":"C","text":"高粱"},{"key":"D","text":"玉米"}],"answer":"C","keys":["C"],"explanation":"泸州老窖特曲是单粮浓香型白酒，其核心酿造原料是高粱。A 为米香型酒的原料；BD为五粮液五种粮食原料中的两种。26版教材新增考点：新增\"泸州老窖特曲是单粮浓香型白酒，其核心酿造原料是高粱\"的表述。易混对比‑ ‑ 白酒香型与代表名酒‑ 泸州老窖特曲：单粮浓香型白酒，核心酿造原料是高粱；‑ 五粮液：以糯米、大米、高粱、小麦、玉米五种粮食为原料酿制而得名；‑ 基本香型：白酒分为酱香型、浓香型、米香型、清香型四种基本香型，另有兼香型白酒。","type":"单选题"},{"number":106,"stem":"()有\"锦绣龙城\"的美誉。","options":[{"key":"A","text":"大同"},{"key":"B","text":"临汾"},{"key":"C","text":"太原"},{"key":"D","text":"运城"}],"answer":"C","keys":["C"],"explanation":"隋末，太原留守李渊起兵反隋、建立唐朝，使得这里有了\"锦绣龙城\"的美誉。A 项大同、B 项临汾、D 项运城均为山西城市，但隋末李渊起兵反隋、有\"锦绣龙城\"美誉者为太原，故不选。同类对比‑ ‑ 山西名城古称(山西)‑ 太原：\"锦绣龙城\"，李渊起兵反隋建唐之地；‑ 大同：古称平城、云州、云中，曾为北魏京都、辽金陪都。","type":"单选题"},{"number":107,"stem":"由贵州省台江县\"六月六\"吃新节篮球赛发展而来，成为群众喜爱\"新节日\"的赛事是()。","options":[{"key":"A","text":"\"村 BA\""},{"key":"B","text":"\"村超\""},{"key":"C","text":"\"村晚\""},{"key":"D","text":"\"村歌\""}],"answer":"A","keys":["A"],"explanation":"由贵州省台江县\"六月六\ key":"C","text":"天梯山石窟"},{"key":"D","text":"云冈石窟"}],"answer":"C","keys":["C"],"explanation":"\"石窟鼻祖\"‑ ‑ 天梯山石窟。A 项莫高窟在敦煌，B 项麦积山石窟在天水，D 项云冈石窟在大同，被称为\"石窟鼻祖\"者为天梯山石窟，故不选。易混对比‑ ‑ 甘肃石窟之最(甘肃)‑ 天梯山石窟：\"石窟鼻祖\"；‑ 麦积山石窟：世界文化遗产，被誉为\"东方雕塑陈列馆\"；‑ 莫高窟：在敦煌，\"世界艺术宝库\"。","type":"单选题"},{"number":118,"stem":"被称为\"面食之都\"，\"一面百吃\"的绝技独步天下的城市是()。","options":[{"key":"A","text":"西安市"},{"key":"B","text":"太原市"},{"key":"C","text":"兰州市"},{"key":"D","text":"郑州市"}],"answer":"B","keys":["B"],"explanation":"太原被称为\"面食之都\"，\"一面百吃\"的绝技独步天下。A 项西安、C 项兰州、D 项郑州均为北方城市，但被称为\"面食之都\"者为太原，故不选。同类对比‑ ‑ 城市别称‑ 太原：\"面食之都\"，\"一面百吃\"独步天下；‑ 拉萨：\"日光城\"；‑ 海口：\"椰城\"；‑ 无锡：\"太湖明珠\"。","type":"单选题"},{"number":119,"stem":"市区温泉群占地 5 平方千米，有\"温泉城\"之称的城市是()。","options":[{"key":"A","text":"台北"},{"key":"B","text":"重庆"},{"key":"C","text":"福州"},{"key":"D","text":"昆明"}],"answer":"C","keys":["C"],"explanation":"福州市区温泉群占地 5平方千米，有\"温泉城\"之称。同类对比‑ ‑ 我国著名温泉‑ 福州：市区温泉群占地 5 平方千米，有\"温泉城\"之称；‑ 著名温泉：云南安宁温泉、腾冲温泉，陕西西安华清池温泉，台湾北投和草山温泉，广东从化温泉等；‑ 分布：台湾、广东、福建、云南、西藏等地温泉较多。","type":"单选题"},{"number":120,"stem":"享有\"西藏江南\"之称的是()。","options":[{"key":"A","text":"日喀则市"},{"key":"B","text":"林芝市"},{"key":"C","text":"昌都市"},{"key":"D","text":"山南市"}],"answer":"B","keys":["B"],"explanation":"享有\"西藏江南\"之称的林芝市。A 项日喀则、C 项昌都、D 项山南均为西藏城市，但享有\"西藏江南\"之称者为林芝市，故不选。同类对比‑ ‑ 西藏城市美誉(西藏)‑ 拉萨：\"日光城\"，年日照时间 3000 小时以上；‑ 林芝：\"西藏江南\"\"雪域明珠\"，西藏最温暖湿润的地区。","type":"单选题"},{"number":121,"stem":"因山多白色大理石而得名，是中国唯一的大理岩峰林景观的风景名胜区是()。","options":[{"key":"A","text":"白洋淀"},{"key":"B","text":"娲皇宫景区"},{"key":"C","text":"野三坡"},{"key":"D","text":"白石山"}],"answer":"D","keys":["D"],"explanation":"白石山风景区因山多白色大理石而得名，是中国唯一的大理岩峰林景观。 A 项白洋淀是中国海河平原上最大的湖泊，B 项娲皇宫为娲皇古迹，C 项野三坡以地质奇观著称，因山多白色大理石而得名、为中国唯一大理岩峰林景观者为白石山，故不选。易混对比‑ ‑ 河北\"三坡一淀\"名胜(河北)‑ 白石山：中国唯一的大理岩峰林景观；‑ 白洋淀：海河平原上最大的湖泊，素有\"华北明珠\"之称；‑ 野三坡：集雄山碧水、奇峡怪泉、文物古迹于一身；‑ 西柏坡：党中央解放全国的最后一个农村指挥所，七届二中全会在此召开。","type":"单选题"},{"number":122,"stem":"使周庄双桥驰名中外的油画《故乡的回忆》的作者是()。","options":[{"key":"A","text":"吴冠中"},{"key":"B","text":"陈逸飞"},{"key":"C","text":"徐悲鸿"},{"key":"D","text":"齐白石"}],"answer":"B","keys":["B"],"explanation":"双桥由世德桥和永安桥相连而成，因陈逸飞油画《故乡的回忆》而驰名中外。 26版教材新增考点。同类对比‑ ‑ 周庄古镇‑ 双桥：由世德桥和永安桥相连而成，因画家陈逸飞油画《故乡的回忆》而驰名中外，是周庄的标志；‑ 富安桥：始建于元代，是江南仅存的桥楼合壁建筑；‑ 美誉：著名画家吴冠中撰文\"黄山集中国山川之美，周庄集中国水乡之美\"。","type":"单选题"},{"number":123,"stem":"源于古西域\"杂戏\"的维吾尔族民间杂技、体育形式是()。","options":[{"key":"A","text":"达瓦孜"},{"key":"B","text":"赛乃姆"},{"key":"C","text":"麦西热甫"},{"key":"D","text":"鹰舞"}],"answer":"A","keys":["A"],"explanation":"达瓦孜(走高绳)是维吾尔族民间的一种杂技、体育形式，源于古西域\"杂戏\"。 B 项赛乃姆、C项麦西热甫均为维吾尔族歌舞民俗，D 项鹰舞是塔吉克族舞蹈，源于古西域\"杂戏\"的杂技、体育形式为达瓦孜，故不选。同类对比‑ ‑ 新疆民族歌舞‑ 达瓦孜：维吾尔族走高绳，源于古西域\"杂戏\"；‑ 赛乃姆舞、刀郎舞：维吾尔族舞蹈；‑ 鹰舞：塔吉克族舞蹈；‑ 沙吾尔登舞：蒙古族舞蹈。","type":"单选题"},{"number":124,"stem":"建成世界最大的赖氨酸生产基地，产能占全球 30%的是()。","options":[{"key":"A","text":"长春高新"},{"key":"B","text":"吉林化纤"},{"key":"C","text":"白城梅花"},{"key":"D","text":"通化东宝"}],"answer":"C","keys":["C"],"explanation":"白城梅花建成世界最大的赖氨酸生产基地，产能占全球的 30%。A 项长春高新、B 项吉林化纤、D项通化东宝均为吉林知名企业，但建成世界最大赖氨酸生产基地、产能占全球30%者为白城梅花，故不选。同类对比‑ ‑ 吉林产业名片(吉林)‑ 白城梅花：建成世界最大的赖氨酸生产基地，产能占全球 30%；‑ 医药健康产业：国家中药现代化科技产业基地、生物产业基地、医药出口基地和创制药物孵化基地。","type":"单选题"},{"number":125,"stem":"联合国旅游组织(UN Tourism)总部设在()。","options":[{"key":"A","text":"美国纽约"},{"key":"B","text":"西班牙马德里"},{"key":"C","text":"法国巴黎"},{"key":"D","text":"英国伦敦"}],"answer":"B","keys":["B"],"explanation":"联合国旅游组织(UN Tourism)总部在西班牙马德里。26 版教材改动：明确世界旅游组织 2021 年更名为联合国旅游组织(UN Tourism)。同类对比‑ ‑ 联合国旅游组织‑ 性质：联合国系统的政府间国际组织；‑ 总部：设在西班牙马德里；‑ 沿革：前身国际官方旅游宣传组织联盟 IUOTPO，1971年正定世界旅游组织，2021更名联合国旅游组织。","type":"单选题"},{"number":126,"stem":"著名的\"昭陵六骏\"图样设计师，人物画逼真传神的初唐画家是()。","options":[{"key":"A","text":"吴道子"},{"key":"B","text":"顾恺之"},{"key":"C","text":"展子虔"},{"key":"D","text":"阎立本"}],"answer":"D","keys":["D"],"explanation":"初唐阎立本，著名的\"昭陵六骏\"图样设计师，其人物画逼真传神，时人誉为\"丹青神话\"，代表作《步辇图》《历代帝王图》。A吴道子人称\"画圣\"；B顾恺之是东晋画家；C 展子虔是隋朝画家，被认为是\"唐画之祖\"。易混对比‑ ‑ 中国古代著名画家‑ 阎立本：初唐，著名的\"昭陵六骏\"图样设计师，时人誉为\"丹青神话\"，代表作《步辇图》《历代帝王图》；‑ 顾恺之：东晋，擅长人物画，主张\"以形写神\"，代表作《女史箴图》《洛神赋图》；‑ 吴道子：中唐，人称\"画圣\"，有\"吴带当风\"之说，代表作《送子天王图》。","type":"单选题"},{"number":127,"stem":"中国第一部词集是西蜀派赵崇祚编成的()。","options":[{"key":"A","text":"《尊前集》"},{"key":"B","text":"《金奁集》"},{"key":"C","text":"《草堂诗余》"},{"key":"D","text":"《花间集》"}],"answer":"D","keys":["D"],"explanation":"西蜀派赵崇祚编成中国第一部词集《花间集》。易混对比‑ ‑ 《花间集》与晚唐五代词‑ 《花间集》：西蜀派赵崇祚编成，是中国第一部词集；‑ 南唐派：李煜(南唐后主)的词作家喻户晓，亡国之后的作品哀婉凄凉、意境深远；‑ 李煜代表作：《虞美人·春花秋月何时了》《浪淘沙·帘外雨潺潺》《相见欢·林花谢了春红》等。","type":"单选题"},{"number":128,"stem":"\"大漠孤烟直，长河落日圆\"出自唐代王维的()。","options":[{"key":"A","text":"《使至塞上》"},{"key":"B","text":"《观猎》"},{"key":"C","text":"《终南山》"},{"key":"D","text":"《山居秋暝》"}],"answer":"A","keys":["A"],"explanation":"\"大漠孤烟直，长河落日圆\"出自唐代王维《使至塞上》。易混对比‑ ‑ 王维诗句与名篇‑ \"大漠孤烟直，长河落日圆\"：出自唐代王维《使至塞上》；‑ 王维：擅长山水画，被誉为山水画\"南宗鼻祖\"，其画作\"诗中有画，画中有诗\"，被后世奉为文人画的始祖；‑ \"海内存知己，天涯若比邻\"：出自王勃《送杜少府之任蜀州》，是送别诗的名作。","type":"单选题"},{"number":129,"stem":"被誉为\"万国建筑博物城\"的是()。","options":[{"key":"A","text":"青岛市"},{"key":"B","text":"哈尔滨市"},{"key":"C","text":"上海市"},{"key":"D","text":"天津市"}],"answer":"B","keys":["B"],"explanation":"哈尔滨市区保留了巴洛克式、拜占庭式、哥特式等一大批历史建筑，是一座欧陆风情浓郁的城市，被誉为\"万国建筑博物城\"。A 项青岛、C 项上海、D 项天津均有近代西式建筑群，但被誉为\"万国建筑博物城\"者为哈尔滨，故不选。哈尔滨素有\"冰城\"\"东方莫斯科\"\"东方小巴黎\"之美称，是享誉中外的冰雪艺术之都，被联合国授予亚洲唯一的\"世界音乐之城\"。易混对比‑ ‑ \"万国建筑\"‑ 哈尔滨：\"万国建筑博物城\"，市区保留巴洛克式、拜占庭式、哥特式等历史建筑(黑龙江)；‑ 上海外滩建筑群：\"万国建筑博览会\"之一，全长约 1.5千米(上海)。","type":"单选题"},{"number":130,"stem":"被誉为\"江南第一宅\"的是南浔古镇的()。","options":[{"key":"A","text":"小莲庄"},{"key":"B","text":"嘉业堂藏书楼"},{"key":"C","text":"刘氏梯号"},{"key":"D","text":"张石铭旧宅"}],"answer":"D","keys":["D"],"explanation":"张石铭旧宅又称\"懿德堂\"，占地 6500平方米，五落四进 150 间房，中式厅堂与巴洛克式建筑被马头墙揽入一院，被誉为\"江南第一宅\"。A项，小莲庄是南浔古镇\"四象\"之首刘镛的私家花园。B 项，南浔古镇的嘉业堂藏书楼是近代私家藏书楼。C 项，南浔古镇的刘氏梯号俗称\"红房子\"。26 版教材新增考点。易混对比‑ ‑ 南浔古镇名宅园林‑ 张石铭旧宅：又称\"懿德堂\"，被誉为\"江南第一宅\"；‑ 小莲庄：\"四象\"之首刘镛的私家花园，是南浔的标志性园林；‑ 嘉业堂藏书楼：中国近代规模最大、藏书最富的私家藏书楼之一；‑ 刘氏梯号：俗称\"红房子\"，是中西合璧的典范。三、多项选择题","type":"单选题"},{"number":131,"stem":"以下组成粤菜的是()。","options":[{"key":"A","text":"客家菜"},{"key":"B","text":"孔府菜"},{"key":"C","text":"广府菜"},{"key":"D","text":"仿膳菜"},{"key":"E","text":"潮汕菜"}],"answer":"ACE","keys":["A","C","E"],"explanation":"粤菜由广府(以广州菜为代表)、客家(以东江菜为代表)、潮汕(以潮州菜为代表)三种风味组成，以广府风味为代表。26版教材改动：粤菜客家风味由\"又称东江风味，以惠州菜为代表\"改为\"以东江菜为代表\"； 广府、潮汕组成及以广府风味为代表不变。同类对比‑ ‑ 粤菜的组成‑ 组成：由广府(以广州菜为代表)、客家(以东江菜为代表)、潮汕(以潮州菜为代表)三种风味组成；‑ 代表：以广府风味为代表；‑ 头牌菜：白切鸡、烧鹅、烤乳猪、佛跳墙。","type":"多选题"},{"number":132,"stem":"近年来，陕西提出\"成为传承中华文化的世界级旅游目的地\"发展目标，打造了()等引领时尚的旅游项目。","options":[{"key":"A","text":"\"长安三万里\""},{"key":"B","text":"\"长安十二时辰\""},{"key":"C","text":"\"盛唐密盒\""},{"key":"D","text":"\"梦回大唐\""},{"key":"E","text":"\"大唐不夜城\""}],"answer":"BE","keys":["B","E"],"explanation":"近年来，陕西提出\"成为传承中华文化的世界级旅游目的地\"等发展目标，打造了\"大唐不夜城\"\"长安十二时辰\"等引领时尚的旅游项目。\"大唐不夜城\"以盛唐文化为背景打造沉浸式夜游街区，\"长安十二时辰\"为沉浸式唐风市井生活街区。同类对比‑ ‑ 陕西文旅项目(陕西)‑ \"大唐不夜城\"：以盛唐文化为背景的沉浸式夜游街区；‑ \"长安十二时辰\"：沉浸式唐风市井生活街区；‑ 发展目标：成为传承中华文化的世界级旅游目的地。","type":"多选题"},{"number":133,"stem":"下列关于唐代\"南青北白\"制瓷格局的表述，正确的有()。","options":[{"key":"A","text":"南方以浙江越窑青瓷为代表"},{"key":"B","text":"北方以河北邢窑白瓷为代表"},{"key":"C","text":"南方以河北邢窑白瓷为代表"},{"key":"D","text":"越窑青瓷有\"类冰\"\"类玉\"之誉"},{"key":"E","text":"邢窑白瓷有\"类银\"\"类雪\"之誉"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"唐代形成\"南青北白\"的制瓷格局：南方以浙江越窑青瓷为代表，有\"类冰\"\"类玉\"之誉；北方以河北邢窑白瓷为代表，有\"类银\"\"类雪\"之誉。26 教材新增考点。同类对比‑ ‑ 唐代\"南青北白\"制瓷格局‑ 格局：南方以浙江越窑青瓷为代表，北方以河北邢窑白瓷为代表；‑ 越窑青瓷：胎薄釉润、釉色青翠，陆羽《茶经》赞其\"类冰\"\"类玉\"；‑ 邢窑白瓷：胎细质坚、器形规整，有\"类银\"\"类雪\"之美誉。","type":"多选题"},{"number":134,"stem":"\"台湾三宝\"是指()。","options":[{"key":"A","text":"米"},{"key":"B","text":"龙井茶"},{"key":"C","text":"糖"},{"key":"D","text":"普洱茶"},{"key":"E","text":"茶"}],"answer":"ACE","keys":["A","C","E"],"explanation":"米、糖、茶是台湾著名的三大传统物产，被称为\"台湾三宝\"。B 项龙井茶为浙江名茶，D项普洱茶为云南名茶，均非\"台湾三宝\"之列，故不选。台湾茶以乌龙茶最为著名，冻顶乌龙茶享誉海内外。易混对比‑ ‑ \"三宝\"名片‑ 台湾三宝：米、糖、茶；‑ 宁夏五宝：枸杞、甘草、贺兰石、滩羊皮、太西煤(宁夏)。","type":"多选题"},{"number":135,"stem":"山西汉族传统民俗活动丰富多彩，其中最具有特色的有()。","options":[{"key":"A","text":"年画"},{"key":"B","text":"剪纸"},{"key":"C","text":"皮影"},{"key":"D","text":"炕围画"},{"key":"E","text":"面塑"}],"answer":"BDE","keys":["B","D","E"],"explanation":"山西汉族传统民俗活动丰富多彩，以剪纸、炕围画、面塑最具特色。A 项年画、C 项皮影均非教材所列山西最具特色的民俗活动，故不选。同类对比‑ ‑ 山西民俗工艺(山西)‑ 剪纸：广灵剪纸以刀刻染色工艺为核心，被誉为\"中华民间艺术一绝\"；‑ 面塑：闻喜花馍经 100多道小工序，面团化作艺 ,"text":"杭州西湖"},{"key":"D","text":"红河哈尼梯田"},{"key":"E","text":"九寨沟"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"我国文化景观遗产共 6处：庐山、五台山、杭州西湖、红河哈尼梯田、左江花山岩画、普洱景迈山古茶林。 E 项九寨沟为世界自然遗产，非文化景观遗产，故不选。世界文化景观是指自然与人类的共同作品，\"文化景观\"属于\"文化遗产\"中的一个特殊类型，并不是单独的一类遗产。同类对比‑ ‑ 文化景观遗产‑ 6 处名单：庐山、五台山、杭州西湖、红河哈尼梯田、左江花山岩画、普洱景迈山古茶林；‑ 易错点：九寨沟为世界自然遗产，不属于文化景观遗产。","type":"多选题"},{"number":145,"stem":"五粮液以五种粮食为原料酿制而得名，这五种粮食是()。","options":[{"key":"A","text":"小米"},{"key":"B","text":"大麦"},{"key":"C","text":"糯米、大米"},{"key":"D","text":"高粱、小麦"},{"key":"E","text":"玉米"}],"answer":"CDE","keys":["C","D","E"],"explanation":"五粮液以糯米、大米、高粱、小麦、玉米五种粮食为原料酿制而得名。A 小米、B 大麦均不在五粮之列。同类对比‑ ‑ 中国名酒与原料‑ 五粮液：以糯米、大米、高粱、小麦、玉米五种粮食为原料酿制而得名；‑ 泸州老窖特曲：单粮浓香型白酒，核心酿造原料是高粱；‑ 基本香型：白酒分为酱香型、浓香型、米香型、清香型四种基本香型，另有兼香型。","type":"多选题"},{"number":146,"stem":"我国主要气候类型有()。","options":[{"key":"A","text":"热带季风气候"},{"key":"B","text":"亚热带季风气候"},{"key":"C","text":"温带季风气候"},{"key":"D","text":"温带大陆性气候"},{"key":"E","text":"高原山地气候"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"我国跨越多个温度带与干湿区，季风气候显著，主要气候类型有：热带季风气候、亚热带季风气候、温带季风气候、温带大陆性气候、高原山地气候。26 版教材新增考点。同类对比‑ ‑ 我国主要气候类型‑ 热带季风气候：分布于海南岛、雷州半岛、滇南、台南等地区；‑ 亚热带季风气候：分布于秦岭一淮河以南、青藏高原以东；‑ 其余：温带季风气候、温带大陆性气候、高原山地气候。","type":"多选题"},{"number":147,"stem":"关于汉族服饰与民居，下列说法正确的有()。","options":[{"key":"A","text":"汉族的服饰在式样上主要有上衣下裳和衣裳相连两种基本的形式"},{"key":"B","text":"大襟左衽是汉族服饰始终保留的鲜明特点"},{"key":"C","text":"北方以北京的四合院为主要代表"},{"key":"D","text":"南方以天井式瓦房居多"},{"key":"E","text":"闽赣粤地区的客家人居住大围楼"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"汉族的服饰在式样上主要有上衣下裳和衣裳相连两种基本的形式，大襟右衽是其服装始终保留的鲜明特点。汉族的染织工艺，以其历史悠久、技术先进、制作精美而独步世界。民居是人们的生活空间。汉族人数众多、分布广泛，由于受各自所处的特殊地域环境的限制，呈现出不同的民居式样。北方以北京的四合院为主要代表，黄土高原上是错落有致的窑洞，南方以天井式瓦房居多，闽赣粤地区的客家人则是居住大围楼，另有徽派建筑、江南的水乡民居、川西平原的林盘建筑等，都具有鲜明的地域文化特征。 B 项\"大襟左衽\"有误，汉族服装始终保留的鲜明特点是大襟右衽。26 版教材把汉族民居代表中的\"上海的石库门\"改成\"川西平原的林盘建筑\"。易混对比‑ ‑ 汉族服饰与民居‑ 服饰：式样主要有上衣下裳和衣裳相连两种基本形式，大襟右衽是始终保留的鲜明特点；‑ 北方民居：以北京的四合院为主要代表，黄土高原上是窑洞；‑ 南方民居：以天井式瓦房居多，闽赣粤地区的客家人居住大围楼。","type":"多选题"},{"number":148,"stem":"下列神话传说中，属于海南十大经典神话 设"},{"key":"B","text":"推动实现中华民族伟大复兴"},{"key":"C","text":"确立民族区域自治为我国根本政治制度"},{"key":"D","text":"促进民族团结进步"},{"key":"E","text":"铸牢中华民族共同体意识"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"该法的立法目的是促进民族团结进步，铸牢中华民族共同体意识，推进中华民族共同体建设，推动实现中华民族伟大复兴。C项表述有误，民族区域自治是我国的一项基本政治制度，不是根本政治制度。26版教材新增考点。同类对比‑ ‑ 民族团结进步促进法‑ 通过与施行：2026年 3月 12日由第十四届全国人民代表大会第四次会议通过，2026年 7月 1 日起施行；‑ 立法目的：促进民族团结进步，铸牢中华民族共同体意识，推进中华民族共同体建设，推动实现中华民族伟大复兴；‑ 制度保障：进一步明确\"国家坚持和完善民族区域自治制度\"。","type":"多选题"},{"number":153,"stem":"蜀绣的代表作有()。","options":[{"key":"A","text":"《芙蓉鲤鱼》"},{"key":"B","text":"《熊猫图》"},{"key":"C","text":"《猫》"},{"key":"D","text":"《水草鲤鱼》"},{"key":"E","text":"《百鸟朝凤》"}],"answer":"AB","keys":["A","B"],"explanation":"蜀绣的代表作有《蜀宫乐女演乐图》挂屏、《熊猫图》座屏和陈列在北京人民大会堂四川厅的巨幅作品《芙蓉鲤鱼》。《猫》‑ ‑ 苏绣；《百鸟朝凤》‑ ‑ 粤绣。[答题技巧]蜀绣：熊猫、芙蓉鲤鱼，再加一乐女。26版教材改动：蜀绣代表作删除《水草鲤鱼》，《熊猫》规范为《熊猫图》。易混对比‑ ‑ 四大名绣代表作‑ 蜀绣：《蜀宫乐女演乐图》挂屏、《熊猫图》座屏、《芙蓉鲤鱼》；‑ 苏绣：以针法细腻、色彩清雅著称，有\"苏猫湘虎\"之说；‑ 湘绣：以狮、虎为代表题材，独门绝技为\"毛针\"；‑ 粤绣：《百鸟朝凤》是粤绣名作。","type":"多选题"},{"number":154,"stem":"下列关于清代官式彩画的说法，正确的有()。","options":[{"key":"A","text":"和玺彩画专用于宫殿、庙宇主殿，以龙凤纹为主"},{"key":"B","text":"旋子彩画多用于次要宫殿和官庙、王府建筑"},{"key":"C","text":"苏式彩画常见于园林、住宅"},{"key":"D","text":"苏式彩画地位最高"},{"key":"E","text":"和玺彩画分为金龙和玺、龙凤和玺等类型"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"清代官式彩画分为和玺、旋子、苏式三级，和玺等级最高。苏式彩画内容生动但地位不高。26 版教材新增考点。易混对比‑ ‑ 清代官式彩画等级‑ 等级：清代官式彩画设为三级，地位由高到低分别是和玺彩画、旋子彩画和苏式彩画；‑ 和玺彩画：等级最高，以龙凤纹为主，分为金龙和玺、龙凤和玺等类型；‑ 苏式彩画：内容生动但地位不高，常见于园林、住宅。","type":"多选题"},{"number":155,"stem":"藏族对居住在不同地区的人有不同的称谓，下列对应正确的有()。","options":[{"key":"A","text":"阿里地区‑ ‑ \"兑巴\""},{"key":"B","text":"前藏地区‑ ‑ \"安多娃\""},{"key":"C","text":"西藏东境和四川西部‑ ‑ \"康巴\""},{"key":"D","text":"后藏地区‑ ‑ \"藏巴\""},{"key":"E","text":"前藏地区‑ ‑ \"卫巴\""}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"\"兑巴\"‑ ‑ 阿里地区；\"藏巴\"‑ ‑ 后藏地区；\"卫巴\"‑ ‑ 前藏地区；\"康巴\"‑ ‑ 西藏东境和四川西部； \"安多娃\"‑ ‑ 西藏北境、四川西北部、甘肃南部。B 项\"安多娃\"指居住在西藏北境、四川西北部、甘肃南部、青海地区的藏民，并非前藏地区，对应错误，故不选。易混对比‑ ‑ 藏族地区称谓‑ 兑巴：阿里地区；‑ 藏巴：后藏地区；‑ 卫巴：前藏地区；‑ 康巴：西藏东境和四川西部；‑ 安多娃：西藏北境、四川西北部、甘肃南部、青海地区。","type":"多选题"},{"number":156,"stem":"关于八卦，说法正确的有()。","options":[{"key":"A","text":"八卦是 8种符号，象征 8 种基本自然现象"},{"key":"B","text":"传说八卦是伏羲画出的"},{"key":"C","text":"八卦中乾代表天，坤代表地"},{"key":"D","text":"八卦中艮代表水，兑代表泽"},{"key":"E","text":"传说后来周文王又把八卦互相搭配变成六十四卦"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"八卦最早记载于《周易》一书，传说伏羲氏\"仰则观象于天，俯则观法于地……于是始作八卦，以通神明之德\"。传说周文王曾悉心研究八卦，并推演出 64个卦象。八卦包括乾(qián)代表天、坤(kūn)代表地；巽(xùn)代表风、震(zhèn)代表雷；坎(kǎn)代表水、离(lí)代表火；艮(gèn)代表山、兑(duì)代表泽。易混对比‑ ‑ 八卦及其象征‑ 起源：最早记载于《周易》，传说伏羲氏始作八卦，周文王推演出 64个卦；‑ 八卦：乾代表天、坤代表地、巽代表风、震代表雷；‑ 对应：坎代表水、离代表火、艮代表山、兑代表泽。","type":"多选题"},{"number":157,"stem":"下列是绿茶的有()。","options":[{"key":"A","text":"武夷岩茶"},{"key":"B","text":"西湖龙井"},{"key":"C","text":"黄山毛峰"},{"key":"D","text":"峨眉竹叶青茶"},{"key":"E","text":"凤凰单枞"}],"answer":"BCD","keys":["B","C","D"],"explanation":"绿茶的代表有杭州西湖龙井茶、太湖碧螺春茶、黄山毛峰茶、峨眉竹叶青茶。 武夷岩茶、凤凰单枞属于乌龙茶。26 版教材改动说明：绿茶代表品种新增峨眉竹叶青茶。易混对比‑ ‑ 茶类归属辨析‑ 绿茶：西湖龙井、太湖碧螺春、黄山毛峰、峨眉竹叶青茶最负盛名；‑ 乌龙茶：产地集中在福建、广东、台湾，名品有武夷岩茶、铁观音、凤凰单枞等；‑ 黄茶：著名品种有君山银针、蒙顶黄芽等。","type":"多选题"},{"number":158,"stem":"关于新疆\"三山夹两盆\"，下列说法正确的有()。","options":[{"key":"A","text":"天山横亘中部，把新疆分为南疆和北疆"},{"key":"B","text":"北面是昆仑山，南面是阿尔泰山"},{"key":"C","text":"阿尔泰山和天山之间是准噶尔盆地"},{"key":"D","text":"天山和昆仑山之间是塔里木盆地"},{"key":"E","text":"准噶尔盆地是我国最大的全封闭性内陆盆地"}],"answer":"ACD","keys":["A","C","D"],"explanation":"新疆的地貌可以概括为\"三山夹两盆\"。B 项应为北面是阿尔泰山、南面是昆仑山，方位颠倒；E项我国最大的全封闭性内陆盆地是塔里木盆地，非准噶尔盆地，故不选。同类对比‑ ‑ 新疆\"三山夹两盆\"(新疆)‑ 阿尔泰山：北面；‑ 天山：横亘中部，把新疆分为南疆和北疆；‑ 昆仑山：南面；‑ 准噶尔盆地：阿尔泰山与天山之间；‑ 塔里木盆地：天山与昆仑山之间，中国最大的全封闭性内陆盆地。","type":"多选题"},{"number":159,"stem":"中国古代宫殿布局的突出特点有()。","options":[{"key":"A","text":"中轴对称"},{"key":"B","text":"左祖右社"},{"key":"C","text":"面朝后市"},{"key":"D","text":"前朝后寝"},{"key":"E","text":"皇权至上"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"ABDE 项正确。中国古代宫殿建筑的布局特点包括：中轴对称、左祖右社、前朝后寝、皇权至上。 26版教材新增考点。易混对比‑ ‑ 中国古代宫殿布局‑ 中轴对称：中轴线上建筑高大华丽，轴侧建筑低小简单，体现皇权至高无上；‑ 左祖右社：宫殿左前方设祖庙(太庙)，右前方设社稷坛；‑ 前朝后寝：宫殿由前、后两部分组成，一墙之隔，\"前堂后室\"。","type":"多选题"},{"number":160,"stem":"清代广东\"四大园林\"也称岭南\"四大园林\"，包括()。","options":[{"key":"A","text":"顺德清晖园"},{"key":"B","text":"东莞可园"},{"key":"C","text":"番禺余荫山房"},{"key":"D","text":"佛山梁园"},{"key":"E","text":"苏州拙政园"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"清代广东\"四大园林\"也被称为岭南\"四大园林\"，分别是顺德清晖园、东莞可园、番禺余荫山房、佛山梁园。E拙政园是苏州\"四大园林\"之一，不属于岭南园林。同类对比‑ ‑ 岭南四大园林‑ 清晖园：广东顺德；‑ 可园：广东东莞；‑ 余荫山房：广东番禺；‑ 梁园：广东佛山。","type":"多选题"},{"number":161,"stem":"白族姑娘头饰上\"风花雪月\"的寓意，下列对应正确的有()。","options":[{"key":"A","text":"艳丽的花饰‑ ‑ 上关花"},{"key":"B","text":"垂下的穗子‑ ‑ 下关风"},{"key":"C","text":"帽顶的白色‑ ‑ 苍山雪"},{"key":"D","text":"弯弯的造型‑ ‑ 洱海月"},{"key":"E","text":"艳丽的花饰‑ ‑ 下关花"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"白族崇尚白色，在白族姑娘的头饰上，显示着\"风花雪月\"的寓意，垂下的穗子象征下关风，艳丽的花饰象征上关花，帽顶的白色代表苍山雪，弯弯的造型代表洱海月。E 项艳丽的花饰象征上关花而非\"下关花\"，对应错误，故不选。同类对比‑ ‑ 白族风情(云南)‑ 头饰\"风花雪月\"：穗子象征下关风、花饰象征上关花、帽顶白色代表苍山雪、弯弯造型代表洱海月；‑ \"三道茶\"：一苦、二甜、三回味，白族传统品茶艺术和待客礼仪。","type":"多选题"},{"number":162,"stem":"下列属于\"五胡\"的有()。","options":[{"key":"A","text":"匈奴"},{"key":"B","text":"鲜卑"},{"key":"C","text":"羯"},{"key":"D","text":"氐"},{"key":"E","text":"羌"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"秦汉魏晋南北朝是中国统一的中央集权王朝建立和逐步发展时期，是秦汉政治制度向隋唐政治制度转型时期。 中国北方先后有匈奴、鲜卑、羯、氐、羌\"五胡\"进入中原，实现了与汉民族的互相融合；中国南方由于北方人口大规模向南迁徙，经济持续发展，为唐宋以后中国经济中心的南移奠定了坚实的基础。同类对比‑ ‑ \"五胡\"内迁‑ 五胡：匈奴、鲜卑、羯、氐、羌；‑ 时代：秦汉魏晋南北朝时期；‑ 影响：进入中原，实现了与汉民族的互相融合。","type":"多选题"},{"number":163,"stem":"下列说法正确的有()。","options":[{"key":"A","text":"竹子象征人品清逸和气节高尚"},{"key":"B","text":"紫薇象征高官厚禄"},{"key":"C","text":"石榴象征多子多福"},{"key":"D","text":"松柏象征坚强和长寿"},{"key":"E","text":"莲花象征洁净无瑕"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"花木除了对山石景观起衬托作用外，又往往和园主人追求的精神境界有关。如竹子象征人品清逸、气节高尚；松柏象征坚强和长寿；莲花象征洁净无瑕；玉兰、牡丹、桂花象征荣华富贵；石榴象征多子多福；紫薇象征高官厚禄等。[答题技巧]竹子‑ ‑ 节节长高‑ ‑ 气节高尚；松柏‑ ‑ 迎客松活了很久‑ ‑ 坚强和长寿；莲花‑ ‑ 白莲洁净无瑕；玉兰、牡丹、桂花‑ ‑ \"母\"(牡)玉\"贵\"(桂)‑ ‑ \"母亲的玉镯很贵\"‑ ‑ 荣华富贵；石榴‑ ‑ 很多籽‑ ‑ 多子多福；紫薇‑ ‑ 紫色官纱帽‑ ‑ 高官厚禄。26版教材改动：石榴的象征寓意由\"多子多孙\"改为\"多子多福\"。同类对比‑ ‑ 园林花木的象征意义‑ 竹子：象征人品清逸、气节高尚；‑ 松柏：象征坚强和长寿；莲花：象征洁净无瑕；‑ 玉兰、牡丹、桂花：象征荣华富贵；石榴：象征多子多福；紫薇：象征高官厚禄。","type":"多选题"},{"number":164,"stem":"
