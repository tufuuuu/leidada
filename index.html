和旅游市场信用管理规定》规定，导游、领队因被吊销导游证而被认定为严重失信主体的，旅行社有关管理人员因旅行社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起（）内不得重新申请导游证或者从事旅行社业务。","options":[{"key":"A","text":"5 年"},{"key":"B","text":"3 年"},{"key":"C","text":"2 年"},{"key":"D","text":"1 年"}],"answer":"B","keys":["B"],"explanation":"导游、领队因被吊销导游证而被认定为严重失信主体的，旅行社有关管理人员因旅行社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起 3 年内不得重新申请导游证或者从事旅行社业务。","type":"单选题"},{"number":61,"stem":"根据《中华人民共和国宪法》的规定，全国人民代表大会每届任期为（）。","options":[{"key":"A","text":"2 年"},{"key":"B","text":"3 年"},{"key":"C","text":"5 年"},{"key":"D","text":"无限"}],"answer":"C","keys":["C"],"explanation":"全国人民代表大会每届任期 5年（第 60 条）；地方各级人民代表大会每届任期 5 年（第 98条）。","type":"单选题"},{"number":62,"stem":"《旅游法》规定，导游或领队未经旅行社委派，私自承揽业务，由旅游主管部门责令改正，没收违法所得，处（）罚款，并暂扣或者吊销导游证。","options":[{"key":"A","text":"500元以上 5000元以下"},{"key":"B","text":"2000元以上 2 万元以下"},{"key":"C","text":"1000元以上 1 万元以下"},{"key":"D","text":"1000元以下"}],"answer":"C","keys":["C"],"explanation":"《旅游法》第 102条，导游、领队私自承揽业务，由旅游主管部门责令改正，没收违法所得，处 1000 元以上 1 万元以下罚款，并暂扣或者吊销导游证。","type":"单选题"},{"number":63,"stem":"《导游管理办法》规定，我国领队管理由资格准入制改为（）管理制度，旅游主管部门不再对领队从业进行行政审批。","options":[{"key":"A","text":"注册"},{"key":"B","text":"登记"},{"key":"C","text":"审核"},{"key":"D","text":"备案"}],"answer":"D","keys":["D"],"explanation":"《导游管理办法》第 25条，具备领队条件的导游从事领队业务的，应当符合《旅行社条例实施细则》等法律、法规和规章的规定。旅行社应当按要求将本单位具备领队条件的领队信息及变更情况，通过全国旅游监管服务信息系统报旅游主管部门备案。据此可以推断此处是“备案”。","type":"单选题"},{"number":64,"stem":"导游员王某在带团中未佩戴导游身份标识，旅游主管部门在依法检查中发现，且王某百般狡辩，拒不改正。根据《导游人员管理条例》的规定，旅游行政部门可以对王某罚款（）。","options":[{"key":"A","text":"300元"},{"key":"B","text":"600元"},{"key":"C","text":"800元"},{"key":"D","text":"1000元"}],"answer":"A","keys":["A"],"explanation":"导游在执业过程中应当携带电子导游证、佩戴导游身份标识，并开启导游执业相关应用软件，由旅游行政部门责令改正；拒不改正的，处 500元以下的罚款。","type":"单选题"},{"number":65,"stem":"依据《中华人民共和国消费者权益保护法》的规定，有关行政部门收到消费者投诉，应当自收到投诉之日起（）个工作日内予以处理并告知消费者。","options":[{"key":"A","text":"7"},{"key":"B","text":"10"},{"key":"C","text":"15"},{"key":"D","text":"20"}],"answer":"A","keys":["A"],"explanation":"解析有关行政部门应当自收到投诉之日起 7 个工作日内，予以处理并告知消费者。对不符合规定的投诉决定不予受理的，应当告知消费者不予受理的理由和其他解决争议的途径。","type":"单选题"},{"number":66,"stem":"《消费者权益保护法》规定，经营者提供的机动车、计算机、电视机、电冰箱、空调器、洗衣机等耐用商品或者装饰装修等服务，消费者自接受商品或者服务之日起 6 个月内发现瑕疵，发生争议的，由（）承担有关瑕疵的举证责任。","options":[{"key":"A","text":"生产者"},{"key":"B","text":"消费者"},{"key":"C","text":"经营者"},{"key":"D","text":"以上都需要"}],"answer":"C","keys":["C"],"explanation":"《消费者权益保护法》规定，经营者提供的机动车、计算机、电视机、电冰箱、空调器、洗衣机等耐用商品或者装饰装修等服务，消费者自接受商品或者服务之日起 6 个月内发现瑕疵，发生争议的，由经营者承担有关瑕疵的举证责任。","type":"单选题"},{"number":67,"stem":"下列不属于《治安管理处罚法》规定的治安管理处罚种类的是（）。","options":[{"key":"A","text":"警告"},{"key":"B","text":"罚金"},{"key":"C","text":"行政拘留"},{"key":"D","text":"吊销公安机关发放的许可证件"}],"answer":"B","keys":["B"],"explanation":"解析依据第 10 条，治安管理处罚分为警告、罚款、行政拘留、吊销公安机关发放的许可证件四种，对违反治安管理的外国人还可以附加适用限期出境或者驱逐出境。罚金属于刑罚种类，不是治安管理处罚。B 项正确：罚金属于刑罚中的财产刑，不是治安管理处罚种类。","type":"单选题"},{"number":68,"stem":"根据《治安管理处罚法》的规定，对违反治安管理行为当事人在（）个月内曾受过治安管理处罚的，予以从重处罚。","options":[{"key":"A","text":"1"},{"key":"B","text":"3"},{"key":"C","text":"6"},{"key":"D","text":"12"}],"answer":"D","keys":["D"],"explanation":"《治安管理处罚法》第 20条规定，违反治安管理有下列情形之一的，从重处罚：（1）有较严重后果的；（2）教唆、胁迫、诱骗他人违反治安管理的；（3）对报案人、控告人、举报人、证人打击报复的；（4）一年内曾受过治安管理处罚的。","type":"单选题"},{"number":69,"stem":"根据《旅游投诉处理办法》第 7条的规定，对于同一个旅游纠纷，两个以上旅游投诉处理机构都有管辖权的，由（）管辖。","options":[{"key":"A","text":"旅游经营者住所地的旅游投诉处理机构"},{"key":"B","text":"最先收到的旅游投诉处理机构"},{"key":"C","text":"投诉人首先选择的旅游投诉处理机构"},{"key":"D","text":"共同的上一级旅游投诉处理机构"}],"answer":"B","keys":["B"],"explanation":"《旅游投诉处理办法》第 7条规定：“除本办法第五条第二款规定的情形外，对于同一个旅游纠纷，两个以上的旅游投诉处理机构都有管辖权的，由最先收到的旅游投诉处理机构管辖。”管辖冲突时以“最先收到投诉”为确定标准，既防止互相推诿，也防止重复受理。","type":"单选题"},{"number":70,"stem":"根据《旅游投诉处理办法》第 13条的规定，投诉人（）人以上，以同一事由投诉同一被投诉人的，为共同投诉。","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"4"},{"key":"D","text":"5"}],"answer":"C","keys":["C"],"explanation":"《旅游投诉处理办法》第 13 条规定：“投诉人四人以上，以同一事由投诉同一被投诉人的，为共同投诉。共同投诉可以由投诉人推选一至三名代表人进行投诉。”共同投诉须同时满足“四人以上”“同一事由”“同一被投诉人”三个要件。","type":"单选题"},{"number":71,"stem":"根据《旅游投诉处理办法》的规定，旅游投诉处理机构处理旅游投诉，一般实行（）制度。","options":[{"key":"A","text":"和解"},{"key":"B","text":"调解"},{"key":"C","text":"仲裁"},{"key":"D","text":"登记"}],"answer":"B","keys":["B"],"explanation":"（原文解析未完整显示）","type":"单选题"},{"number":72,"stem":"根据《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》，下列属于旅游经营者、旅游辅助服务者不予免责情形的是（）。","options":[{"key":"A","text":"旅游者自行安排旅游活动期间旅行社未做必要提示"},{"key":"B","text":"旅游者未履行如实告知义务的"},{"key":"C","text":"因不可抗力等客观原因导致旅游合同无法履行的"},{"key":"D","text":"旅游者擅自脱团的"}],"answer":"A","keys":["A"],"explanation":"《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》第 19条规定，旅游者在自行安排活动期间遭受人身损害、财产损失，旅游经营者未尽到必要的提示义务、救助义务，旅游者请求旅游经营者承担相应责任的，人民法院应予支持。","type":"单选题"},{"number":73,"stem":"《旅游法》规定，旅游经营者应当严格执行安全生产管理和（）的法律、法规和国家标准、行业标准。","options":[{"key":"A","text":"安全保护制度"},{"key":"B","text":"安全防范措施"},{"key":"C","text":"消防安全管理"},{"key":"D","text":"安全风险提示"}],"answer":"C","keys":["C"],"explanation":"《旅游法》第 79条，旅游经营者应当严格执行安全生产管理和消防安全管理的法律、法规和国家标准、行业标准，具备相应的安全生产条件，制定旅游者安全保护制度和应急预案。","type":"单选题"},{"number":74,"stem":"《旅游法》规定，旅行社应当按照规定交纳（），用于旅游者权益损害赔偿和垫付旅游者人身安全遇有危险时紧急救助的费用。","options":[{"key":"A","text":"旅游风险抵押金"},{"key":"B","text":"旅游权益损害赔偿金"},{"key":"C","text":"旅游安全保障金"},{"key":"D","text":"旅游服务质量保证金"}],"answer":"D","keys":["D"],"explanation":"《旅游法》第 31条规定，旅行社应当按照规定交纳旅游服务质量保证金，用于旅游者权益损害赔偿和垫付旅游者人身安全遇有危险时紧急救助的费用。","type":"单选题"},{"number":75,"stem":"旅游者50人以上200人以下滞留超过24小时，并对当地生产生活秩序造成较大影响的，属于（）。","options":[{"key":"A","text":"一般旅游突发事件"},{"key":"B","text":"较大旅游突发事件"},{"key":"C","text":"重大旅游突发事件"},{"key":"D","text":"特别重大旅游突发事件"}],"answer":"B","keys":["B"],"explanation":"《旅游安全管理办法》第 42 条规定，本办法所称较大旅游突发事件包括下列情形：造成或者可能造成人员死亡（含失踪）3 人以上 10 人以下或者重伤 10 人以上 50 人以下；旅游者 50 人以上 200人以下滞留超过 24 小时，并对当地生产生活秩序造成较大影响；其他在境内外产生较大影响，并对旅游者人身、财产安全造成较大威胁的事件。","type":"单选题"},{"number":76,"stem":"根据《中华人民共和国民用航空法》的规定，旅客未能出示客票、客票不符合规定或者客票遗失，下列说法正确的是（）。","options":[{"key":"A","text":"航空旅客运输合同直接失效"},{"key":"B","text":"不影响航空旅客运输合同的存在或者有效"},{"key":"C","text":"承运人有权拒绝提供全部运输服务"},{"key":"D","text":"旅客须出示购票凭证方可乘机"}],"answer":"B","keys":["B"],"explanation":"法条原文：第 116条客票是航空旅客运输合同订立和运输合同条件的初步证据。旅客未能出示客票、客票不符合规定或者客票遗失，不影响运输合同的存在或者有效。A项错误，客票仅为运输合同订立的初步证据，旅客未能出示客票、客票不符合规定或者客票遗失，不影响运输合同的存在或者有效，不会导致合同直接失效。B项正确，符合第 116条规定，不影响运输合同的存在或者有效。C项错误，客票问题不影响合同效力，承运人不能因此拒绝提供运输服务。D项错误，法律并未规定。","type":"单选题"},{"number":77,"stem":"申请开办饭店，未经公安机关审查批准，也未向工商行政管理部门申请登记，未领取营业执照而开业的，公安机关可以酌情给予警告或者处以（）罚款。","options":[{"key":"A","text":"200元"},{"key":"B","text":"200元以下"},{"key":"C","text":"500元"},{"key":"D","text":"500元以下"}],"answer":"B","keys":["B"],"explanation":"解析申请开办饭店，未经公安机关审查批准，也未向工商行政管理部门申请登记，未领取营业执照而开业的，公安机关可以酌情给予警告或者处以 200元以下罚款。","type":"单选题"},{"number":78,"stem":"根据《娱乐场所管理条例》，娱乐场所设置具有赌博功能的电子游戏机机型、机种、电路板等游戏设施设备的，由县级公安部门没收违法所得和非法财物，并处违法所得（）的罚款。","options":[{"key":"A","text":"1 倍以上 3 倍以下"},{"key":"B","text":"1 倍以上 5 倍以下"},{"key":"C","text":"2 倍以上 5 倍以下"},{"key":"D","text":"5 倍以上 10倍以下"}],"answer":"C","keys":["C"],"explanation":"娱乐场所有下列情形之一的，由县级公安部门没收违法所得和非法财物，并处违法所得 2倍以上 5倍以下的罚款。设置具有赌博功能的电子游戏机机型、机种、电路板等游戏设施设备的。以现金、有价证券作为奖品，或者回购奖品的。","type":"单选题"},{"number":79,"stem":"根据《风景名胜区条例》的规定，规划期届满前（），组织编制机关应当对风景名胜区规划组织评估，决定是否重新编制规划。","options":[{"key":"A","text":"1 年"},{"key":"B","text":"2 年"},{"key":"C","text":"3 年"},{"key":"D","text":"5 年"}],"answer":"B","keys":["B"],"explanation":"《风景名胜区条例》第二十三条：风景名胜区总体规划的规划期届满前 2年，规划的组织编制机关应当组织专家对规划进行评估，作出是否重新编制规划的决定。在新规划批准前，原规划继续有效。","type":"单选题"},{"number":80,"stem":"根据《自然保护区条例》的规定，自然保护区核心保护区以外的区域划为（）。","options":[{"key":"A","text":"实验区"},{"key":"B","text":"缓冲区"},{"key":"C","text":"过渡区"},{"key":"D","text":"一般控制区"}],"answer":"D","keys":["D"],"explanation":"《自然保护区条例》第十六条：自然保护区划分为核心保护区和一般控制区，实行分区管控。核心保护区以外的区域划为一般控制区。ABC三项错误，实验区、缓冲区、核心区是修订前条例的三区划分模式；D项正确，现行条例已调整为“核心保护区+一般控制区”两区管控，依据条例第十六条。","type":"单选题"},{"number":81,"stem":"（）全面推进，构建人类命运共同体成为引领时代潮流和人类前进方向的鲜明旗帜，我国外交在世界大变局中开创新局、在世界乱局中化危为机，我国国际影响力、感召力、塑造力显著提升。","options":[{"key":"A","text":"中国特色大国外交"},{"key":"B","text":"和平共处五项原则"},{"key":"C","text":"独立自主的外交政策"},{"key":"D","text":"对外开放战略"}],"answer":"A","keys":["A"],"explanation":"中国特色大国外交全面推进，构建人类命运共同体成为引领时代潮流和人类前进方向的鲜明旗帜，我国外交在世界大变局中开创新局、在世界乱局中化危为机，我国国际影响力、感召力、塑造力显著提升。","type":"单选题"},{"number":82,"stem":"全面推进依法治国必须全面贯彻和坚持的基本原则包括（）。","options":[{"key":"A","text":"坚持从人民需求出发"},{"key":"B","text":"坚持政府的领导"},{"key":"C","text":"坚持中国共产党的主体地位"},{"key":"D","text":"坚持依法治国和以德治国相结合"}],"answer":"D","keys":["D"],"explanation":"解析“坚持从人民需求出发”改成坚持从中国实际出发；“坚持政府的领导”改成坚持中国共产党的领导；“坚持中国共产党的主体地位”改成坚持人民主体地位。","type":"单选题"},{"number":83,"stem":"《港区国安法》规定，有以下（）情形的，对有关犯罪嫌疑人可以从轻、减轻处罚。","options":[{"key":"A","text":"在犯罪过程中，被动放弃犯罪的"},{"key":"B","text":"自动投案，如实供述他人罪行的"},{"key":"C","text":"在犯罪过程中，自动有效地防止犯罪结果发生的"},{"key":"D","text":"揭发他人犯罪行为"}],"answer":"C","keys":["C"],"explanation":"解析《港区国安法》第 33 条规定。“在犯罪过程中，被动放弃犯罪的”错在“被动”，正确的说法是“主动”；“自动投案，如实供述他人罪行的”错在“他人”，正确的说法是“自己的”；“揭发他人犯罪行为”错在表述不完全，不仅“揭发他人犯罪行为”，还要查证属实。","type":"单选题"},{"number":84,"stem":"下列选项中，关于奏唱国歌的场合，正确的是（）。","options":[{"key":"A","text":"宪法修改仪式"},{"key":"B","text":"国家公祭仪式"},{"key":"C","text":"重大社交活动"},{"key":"D","text":"各机构组织的重大纪念仪式"}],"answer":"B","keys":["B"],"explanation":"根据《国歌法》第 4 条规定，“宪法颁布仪式”错误，是“宪法宣誓仪式”；“重大社交活动”错误，是“重大外交活动”；“各机构”错误，是“各级机关”。","type":"单选题"},{"number":85,"stem":"依据文化和旅游部《旅游强国建设“十五五”规划》，规划提出，深入开展（）国家旅游形象推广。","options":[{"key":"A","text":"“旅游中国美好生活”"},{"key":"B","text":"“美丽中国”"},{"key":"C","text":"“畅游中国”"},{"key":"D","text":"“你好！中国”"}],"answer":"D","keys":["D"],"explanation":"健全国家旅游对外推广体系。加强中国旅游品牌的整体设计，深入开展“你好！中国”国家旅游形象推广，结合自然资源、历史文化等建立高辨识度的营销品牌。A项错误，“旅游中国美好生活”是国内旅游宣传推广活动名称，不属于国家旅游形象推广，故 A 错误。B 项错误，“美丽中国”是规划中“文明旅游美丽中国”主题活动的表述，不是国家旅游形象推广，故 B错误。C项错误，“畅游中国”不是规划表述，故 C 错误。D 项正确，深入开展“你好！中国”国家旅游形象推广，符合规划原文，故 D 正确。","type":"单选题"},{"number":86,"stem":"某通讯公司甲为铺设地下管线，在步行街路面挖一深坑，并放置了警示标志用作提醒。乙驾驶汽车撞倒标志后未及时复原，致使丙骑电动车途经该处时避让不及，撞倒人行道上的旅游者丁。下列关于赔偿的说法中，正确的是（）。","options":[{"key":"A","text":"乙独自承担赔偿责任"},{"key":"B","text":"乙、丙共同承担赔偿责任"},{"key":"C","text":"甲、乙共同承担赔偿责任"},{"key":"D","text":"甲、乙、丙共同承担赔偿责任"}],"answer":"C","keys":["C"],"explanation":"《侵权责任法》第 91 条，在公共场所或者道路上挖坑、修缮安装地下设施等，没有设置明显标志和采取安全措施造成他人损害的，施工人应当承担侵权责任。虽然在此处，甲放置了警示标志，但是并没有采取合适的安全措施，故需要承担责任。第 31 条，因紧急避险造成损害的，由引起险情发生的人承担责任。如果危险是由自然原因引起的，紧急避险人不承担责任或者给予适当补偿。紧急避险采取措施不当或者超过必要的限度，造成不应有的损害的，紧急避险人应当承担适当的责任。丙的行为属于紧急避险，因此无需承担责任。","type":"单选题"},{"number":87,"stem":"导游服务作为一种职业正式出现在（）年。","options":[{"key":"A","text":"1841"},{"key":"B","text":"1845"},{"key":"C","text":"1846"},{"key":"D","text":"1865"}],"answer":"C","keys":["C"],"explanation":"1846年，导游服务作为一种职业的正式出现在苏格兰之行。","type":"单选题"},{"number":88,"stem":"对导游采用严格型管理、需通过国家统一考试持证上岗的是（）。","options":[{"key":"A","text":"日本"},{"key":"B","text":"德国"},{"key":"C","text":"美国"},{"key":"D","text":"英国"}],"answer":"A","keys":["A"],"explanation":"对导游采用严格型管理，需通过国家统一考试持证上岗的新加坡、日本、以色列。","type":"单选题"},{"number":89,"stem":"下列选项中，对导游服务地位描述不正确的一项是（）。","options":[{"key":"A","text":"旅游服务水平的体现者"},{"key":"B","text":"旅游政策制定的主导者"},{"key":"C","text":"旅游市场竞争的助力者"},{"key":"D","text":"旅游产品信息的反馈者"}],"answer":"B","keys":["B"],"explanation":"导游服务的地位：旅游服务工作的主导者；旅游服务水平的体现者；旅游市场竞争的助力者；旅游产品信息的反馈者。","type":"单选题"},{"number":90,"stem":"关于高级导游晋升特级导游的说法，正确的一项是（）。","options":[{"key":"A","text":"原则上采取论文答辩形式，每 3 年开展一次"},{"key":"B","text":"考核内容是综合案例分析和导游词创作等"},{"key":"C","text":"申请参加特级导游等级考核的，应具有大学专科以上学历"},{"key":"D","text":"高级导游在三年内，全国旅游监管服务平台带团记录不少于 25次或 90 天"}],"answer":"D","keys":["D"],"explanation":"考核形式：特级导游等级考核，原则上采取论文答辩形式，每 4 年开展一次；根据需要，可增加笔试形式；考核科目和内容：导游词创作和导游相关专业论文等；考核条件：申请参加特级导游等级考核的，应具有大学本科以上学历，取得高级导游等级满3年，3 年内在全国旅游监管服务平台的带团记录不少于 25 次或 90天。","type":"单选题"},{"number":91,"stem":"下列关于导游工作着装要求的描述，正确的一项是（）。","options":[{"key":"A","text":"为突出导游特点，可适当多搭配装饰物"},{"key":"B","text":"全身颜色不宜超过 2 种"},{"key":"C","text":"因导游全天工作为避免汗味，可使用气味较浓烈的香水"},{"key":"D","text":"使用无线设备时，接收器隐藏于衣物内，避免外露影响美观"}],"answer":"D","keys":["D"],"explanation":"配饰应简约大方，避免夸张首饰或过多装饰物；全身颜色不宜超过 3 种；避免使用气味浓烈的香水；使用无线设备时，接收器应隐藏于衣物内，避免外露影响美观。","type":"单选题"},{"number":92,"stem":"握手礼仪在实践中运用正确的是（）。","options":[{"key":"A","text":"握手一定要伸右手，伸左手是不礼貌的"},{"key":"B","text":"握手的时间以一至三秒为宜，关系亲近的当然可以长时间相握"},{"key":"C","text":"在寒冷的冬天，可以带手套握手"},{"key":"D","text":"无论是同性还是异性，握手力度要保持一致"}],"answer":"A","keys":["A"],"explanation":"握手一定要伸右手，伸左手是不礼貌的；握手的时间以三至五秒为宜，关系亲近的当然可以长时间相握；用力大小也应适度。对男子可以稍重些，对女子则应轻柔；寒冷的冬天，户外相遇或者时间仓促来不及脱手套，在握手开始时，应说一声：“对不起！。","type":"单选题"},{"number":93,"stem":"为他人做介绍时，应该遵循的介绍原则是（）。","options":[{"key":"A","text":"将身份高的介绍给身份低的"},{"key":"B","text":"将年长者介绍给年轻人"},{"key":"C","text":"将主人介绍给客人"},{"key":"D","text":"讲女士介绍给男士"}],"answer":"C","keys":["C"],"explanation":"介绍原则：应遵循“让长者、客人先知”的原则。即先把身份低的、年纪轻的介绍给身份高的、年纪大的；先将主人介绍给客人；先将男士介绍给女士。","type":"单选题"},{"number":94,"stem":"下列内容中，（）不是欢送词中的内容。","options":[{"key":"A","text":"对旅游团在本地的旅游行程进行简要回顾"},{"key":"B","text":"预祝旅游活动愉快顺利"},{"key":"C","text":"向旅游者以及入境领队、全陪、司机表达感谢之情"},{"key":"D","text":"对行程中存在的不尽如人意之处表示歉意"}],"answer":"B","keys":["B"],"explanation":"对旅游团在本地的旅游行程进行简要回顾，着重提及那些能引发旅游者情感共鸣的人和事，强化旅游者对本次旅游经历的印象；向旅游者以及入境领队、全陪、司机表达感谢之情，肯定各方在此次旅程中的支持与配合；对行程中存在的不尽如人意之处表示歉意。选项 B，是欢迎词的内容。","type":"单选题"},{"number":95,"stem":"旅游者参加计划外的文娱活动，地陪导游操作正确的是（）。","options":[{"key":"A","text":"一般情况下，地陪需要陪同前往"},{"key":"B","text":"旅游者要参与不正常的夜生活活动，地陪应耐心劝阻"},{"key":"C","text":"地陪应准确告知演出时间、地点和票价等信息，必要时可协助其购票"},{"key":"D","text":"地陪应告知其不是接团计划内的，请其自行处理"}],"answer":"C","keys":["C"],"explanation":"（1）提供准确信息（可协助购票，一般不陪同）：对于旅游者自行要求观看的计划外文娱节目，地陪应准确告知演出时间、地点和票价等信息，必要时可协助其购票，但一般情况下不陪同前往。（2）拒绝不健康活动（法律引导）：若旅游者欲观看不健康的文娱节目或参与不正常的夜生活活动，地陪应明确拒绝，并向其阐述我国相关法律法规，引导旅游者文明旅游。","type":"单选题"},{"number":96,"stem":"导游在为游客提供购物服务时，操作不当的是（）。","options":[{"key":"A","text":"旅游者购买商品后，地陪应提醒其妥善保存购物发票"},{"key":"B","text":"若旅游者提出托运需求，应详细介绍托运手续，并积极提供协助"},{"key":"C","text":"导游带团期间不得向游客介绍特色商品"},{"key":"D","text":"若存在小贩强买强卖现象，地陪有责任提前告知旅游者避免上当受骗"}],"answer":"C","keys":["C"],"explanation":"解析若部分景区存在小贩强买强卖现象，地陪有责任提前告知旅游者避免上当受骗；旅游者购买商品后，地陪应提醒其妥善保存购物发票；若旅游者提出托运需求，地陪应详细介绍托运手续，并积极提供必要的协助。","type":"单选题"},{"number":97,"stem":"导游在带领游客游览过程中，操作恰当的是（）。","options":[{"key":"A","text":"让旅游者充分游览观赏，导游少讲，多陪伴"},{"key":"B","text":"导游要提供标准化讲解，不能因旅游者文化程度、理解能力和地域差异而调整"},{"key":"C","text":"导游应注重用文化诠释景点，使旅游者感觉导游高深莫测"},{"key":"D","text":"地陪时刻观察周围的环境，使游客自始至终环绕和跟随在自己周围或前后"}],"answer":"D","keys":["D"],"explanation":"景区讲解时，地陪需确保在计划时间和费用内，让旅游者充分游览观赏，做到“导”“游”结合，集中与分散相宜，劳逸结合；根据旅游者文化程度、理解能力和地域差异调整讲解方式，观察旅游者反应，灵活调整内容和速度；注重用文化诠释景点，使旅游者领悟文化内涵，得到美的享受，讲解时要把握详略。","type":"单选题"},{"number":98,"stem":"关于导游旗杆的描述，正确的是（）。","options":[{"key":"A","text":"使用导游旗时，可以使用造型怪异的挂饰方便游客认找"},{"key":"B","text":"暂不使用导游旗时，可以当做垫坐"},{"key":"C","text":"导游旗形状以长方形或三角形为宜，尺寸以 45cm×30cm 或 60cm×40cm 为宜"},{"key":"D","text":"无论多少游客，带团时都必须打导游旗"}],"answer":"C","keys":["C"],"explanation":"导游旗形状以长方形或三角形为宜，旗面宽高尺寸以 45cm×30cm 或 60cm×40cm 为宜，颜色应鲜艳醒目，材质易于飘扬，旗面应印制旅行社名称、标志或产品名称，字迹清晰、易辨识，无违背公序良俗的文字、符号或图案。导游服务过程中，当旅游者人数超过 10人时应持导游旗，旅游者人数少于 10人时可根据现场情况决定是否持导游旗。导游在使用导游旗时，应保持旗杆直立，旗面位于旅游者易辨识的方位；暂不使用导游旗时，需妥善放置，不应垫坐、玩耍等。","type":"单选题"},{"number":99,"stem":"导游带团讲解时，符合音量大小要求的选项是（）。","options":[{"key":"A","text":"音量应以绝大多数游客能听清为宜"},{"key":"B","text":"在庄严肃穆的场合适当提高音量"},{"key":"C","text":"讲解重要信息时应适当加大音量，提醒游客注意"},{"key":"D","text":"提及敏感的内容时，适当提高音量"}],"answer":"C","keys":["C"],"explanation":"1. 旅游者人数多少：当旅游者人数较多时，应适当提高音量；反之则降低。音量应以每位旅游者能听清为宜，如有需要，可借助扩音器辅助讲解；2. 讲解点环境情况：在宽阔地带且人员分散、环境嘈杂的场景下，应适当提高音量；而在庄严重要场合、室内安静空间等场所进行讲解时，则应适当减小音量；3. 讲解内容的重要程度：讲解重要内容或需强调信息时，应加大音量以提醒旅游者注意；提及敏感、不宜多讲内容时，则应轻描淡写。","type":"单选题"},{"number":100,"stem":"导游的讲解必须以客观事实为依据，杜绝信口开河、胡编乱造的行为，这体现了（）的准确性。","options":[{"key":"A","text":"思想观点"},{"key":"B","text":"讲解内容"},{"key":"C","text":"遣词造句"},{"key":"D","text":"语音语调"}],"answer":"B","keys":["B"],"explanation":"讲解内容准确：导游的讲解必须以客观事实为依据，杜绝信口开河、胡编乱造的行为。导游需要持续学习，积累扎实的知识储备，深入了解游览景点的历史、文化、风俗习惯等各方面情况。","type":"单选题"},{"number":101,"stem":"以生产日期计算，救生衣使用年限建议不超过（），且救生衣出现破损应及时更换。","options":[{"key":"A","text":"3 年"},{"key":"B","text":"5 年"},{"key":"C","text":"6 年"},{"key":"D","text":"8 年"}],"answer":"C","keys":["C"],"explanation":"解析以生产日期计算，救生衣使用年限建议不超过 6 年，且救生衣出现破损应及时更换。","type":"单选题"},{"number":102,"stem":"未满 18 周岁的港澳居民办理港澳居民来往内地通行证，签发有效期为（）。","options":[{"key":"A","text":"1 年"},{"key":"B","text":"3 年"},{"key":"C","text":"5 年"},{"key":"D","text":"10年"}],"answer":"C","keys":["C"],"explanation":"解析港澳居民来往内地通行证：通行证有效期分为 5 年与 10 年两种：申请人年满18周岁，签发有效期为 10年；未满 18周岁，签发有效期为 5年的通行证。","type":"单选题"},{"number":103,"stem":"（）常用于表达讽刺、含蓄、烦躁、轻薄、厌恶、意外等情绪。","options":[{"key":"A","text":"高声调"},{"key":"B","text":"低降调"},{"key":"C","text":"平直调"},{"key":"D","text":"曲折调"}],"answer":"D","keys":["D"],"explanation":"曲折调常用于表达讽刺、含蓄、烦躁、轻薄、厌恶、意外等情绪。","type":"单选题"},{"number":104,"stem":"导游将目光集中投向某一旅游者或某区域，以产生情绪呼应。这是目光语中的（）。","options":[{"key":"A","text":"前视法"},{"key":"B","text":"环视法"},{"key":"C","text":"点视法"},{"key":"D","text":"虚视法"}],"answer":"C","keys":["C"],"explanation":"点说法：导游将目光集中投向某一旅游者或某区域，以产生情绪呼应。","type":"单选题"},{"number":105,"stem":"华山是五岳中海拔最高的山峰，其陡峭险峻位居五岳之首，也是五岳中唯一为道教所独占的名山。这些内容都属于突出重点法中的（）。","options":[{"key":"A","text":"突出独特之处"},{"key":"B","text":"突出有代表性部分"},{"key":"C","text":"突出旅游者感兴趣的内容"},{"key":"D","text":"突出“最”“第一”"}],"answer":"A","keys":["A"],"explanation":"突出重点法：突出独特之处；突出有代表性部分；突出旅游者感兴趣的内容；突出“最”“第一”。","type":"单选题"},{"number":106,"stem":"带领老年团旅行时，导游操作正确的一项是（）。","options":[{"key":"A","text":"景点游览宜多，为老年人创造机会多看多游"},{"key":"B","text":"导游适当采用激将法刺激老年人参加挑战性不强的项目"},{"key":"C","text":"讲解内容应讲一些专业知识，少一些家常闲聊"},{"key":"D","text":"景点线路复杂场所，导游要不厌其烦地提醒，预防老年人迷路走丢"}],"answer":"D","keys":["D"],"explanation":"景点游览宜少而精：每天的游览项目不宜过多。在合同约定范围内，选择景点内具有代表性的点位参观，游览内容少而精，慢行细看，让老年人有足够的时间欣赏和休息；参游项目宜量力而行：导游不宜用激将法刺激老年人参加挑战性项目。应提醒他们慎重考虑，量力而行，避免因体力不支而发生危险；在景点线路复杂、游人拥挤的场所，导游要不厌其烦地提醒，预防老年人迷路走丢；讲解内容应减少说教，多一些家常闲聊。","type":"单选题"},{"number":107,"stem":"儿童不满 2 周岁但需要一个独立座位，其购买机票的票价是（）。","options":[{"key":"A","text":"成人正常票价的 10%"},{"key":"B","text":"成人正常票价的 20%"},{"key":"C","text":"成人正常票价的 50%"},{"key":"D","text":"成人正常票价的 70%"}],"answer":"C","keys":["C"],"explanation":"婴儿票：成人正常票价的 10%，不单独占座。需占座则购买儿童票。儿童票：成人正常票价 50%，独立占有一个座位。","type":"单选题"},{"number":108,"stem":"导游在安排游览顺序时，宜采用（）。","options":[{"key":"A","text":"“松紧相间，先紧后松”"},{"key":"B","text":"“先远后近，先高后低”"},{"key":"C","text":"“快旅慢游，精彩在后”"},{"key":"D","text":"“难易相兼，先易后难”"}],"answer":"B","keys":["B"],"explanation":"游览顺序宜“先远后近，先高后低”：“先远后近”指整体行程先游览离交通站点远的景点，提升最后送站的把握度；每日行程先安排离酒店远的景点，方便旅游者疲惫时快速回酒店休息。“先高后低”则是将爬山、登楼等登高项目安排在游览初期，此时旅游者精力充沛、挑战欲望强，避免后期因体力不足或兴趣丧失放弃登高。","type":"单选题"},{"number":109,"stem":"面对游客单独用餐或不随团用餐的情况，导游处理规范的选项是（）。","options":[{"key":"A","text":"因旅游团内部矛盾或其他原因，导游婉转拒绝单独用餐请求"},{"key":"B","text":"告知游客单独用餐费用自理，原餐费不退"},{"key":"C","text":"按照团队计划人数上菜"},{"key":"D","text":"如因游客身体不适，同意旅游者不随团用餐的要求，餐费按照合同约定处理"}],"answer":"D","keys":["D"],"explanation":"1. 因旅游团内部矛盾或其他原因提出时：问清情况，耐心解释，建议其与其他旅游者一起用餐；如旅游者坚持单独用餐，可协助其与餐厅联系，但应告知旅游者单独用餐的餐费自理，原餐费根据旅游合同约定处理。2. 由于外出自由活动、访友、疲劳等原因不随团用餐时：关心旅游者身体状况：同意旅游者要求，并第一时间对身体不适的旅游者予以关心照顾。明确餐费处理方式：告知旅游者原餐费根据旅游合同约定处理。通知餐馆调整用餐人数：及时通知餐馆减少用餐人数。","type":"单选题"},{"number":110,"stem":"关于调换房间的要求，导游处理得当的是（）。","options":[{"key":"A","text":"不涉及房间价格且饭店有空房时，适当予以满足"},{"key":"B","text":"如没有客房，导游明确拒绝"},{"key":"C","text":"如果客房清洁不达标或设施出现损坏，导游立即协调换房"},{"key":"D","text":"如果客房有蟑螂、臭虫、老鼠等，导游首先联系客房部打扫，客人不满意再换房"}],"answer":"A","keys":["A"],"explanation":"1. 客房清洁或设施问题：立即处理：如客房清洁不达标或设施出现损坏，导游应迅速要求饭店客房部门进行打扫、消毒、整理或修理工作。仍不满意调房：如旅游者仍不满意，坚持调房，导游应与饭店有关部门联系，予以满足，为其调换房间。2. 客房有蟑螂、臭虫、老鼠等：立即满足：旅游者提出换房，应立即满足，必要时应调换饭店。调换另一朝向或另一楼层的同一标准客房：不涉及房间价格且饭店有空房时：与饭店客房部联系，适当予以满足，或请领队在团队内部进行调整。无法满足时：向旅游者做好耐心解释工作","type":"单选题"},{"number":111,"stem":"个别游客要求自费观看文娱节目，导游操作正确的是（）。","options":[{"key":"A","text":"婉转拒绝"},{"key":"B","text":"游客执意要去大型娱乐场所或情况复杂的场所时，导游必须陪同前往"},{"key":"C","text":"时间允许，与接待社有关部门联系请其报价，详细告知游客相关情况"},{"key":"D","text":"要求前往不健康的娱乐场所，耐心劝阻"}],"answer":"C","keys":["C"],"explanation":"要求自费观看文娱节目时间允许时：积极协助。酌情选择以下两种方法：方法一：与接待社有关部门联系请其报价，将对外报价（包括节目票费、车费、服务费）告知旅游者并逐一解释清楚，若旅游者认可则请接待社预订，同时陪同前往。方法二：协助解决，提醒旅游者注意安全，帮助联系购买门票，请旅游者自行前往，相关费用自理。游客执意要去大型娱乐场所或情况复杂的场所时：提醒旅游者注意安全，必要时可陪同前往。要求前往不健康的娱乐场所：果断拒绝并介绍中国的传统观念和道德风貌，严肃指出不健康的娱乐活动和不正常的夜生活在中国是明令禁止的，是违法行为，会受到法律的惩处。","type":"单选题"},{"number":112,"stem":"下列选项中，属于旅游行程变更主观因素的是（）。","options":[{"key":"A","text":"旅游者个人兴趣改变"},{"key":"B","text":"自然灾害"},{"key":"C","text":"交通事故"},{"key":"D","text":"景点游客承载量达到上限"}],"answer":"A","keys":["A"],"explanation":"客观因素：自然因素：极端天气（如暴雨、暴雪、台风等）、自然灾害（如地震、山体滑坡、泥石流等）。社会因素：交通事故、交通管制、公共卫生事件等。景点因素：景点临时关闭、景点游客承载量达到上限等。","type":"单选题"},{"number":113,"stem":"（）是导致误机（车、船）的客观原因。","options":[{"key":"A","text":"导游因行程安排不当致旅游者无法按时抵达机场"},{"key":"B","text":"导游未认真核对票据而弄错时间或地点"},{"key":"C","text":"途中遭遇交通事故、恶劣天气、自然灾害"},{"key":"D","text":"交通时间改变，旅行社忘记通知导游"}],"answer":"C","keys":["C"],"explanation":"1. 主观原因：在接待过程中，导游因行程安排不当致旅游者无法按时抵达机场（车站、码头）、未认真核对票据而弄错时间或地点等由人为因素造成的事故，均属主观原因，是预防的重点。2. 客观原因：途中遭遇交通事故、恶劣天气、自然灾害等不可抗力或难以预测因素引发的误机（车、船），属客观原因。","type":"单选题"},{"number":114,"stem":"如果是特殊游客，例如老年人、未成年人、残疾人等，一旦走失，导游应该（）。","options":[{"key":"A","text":"立即报警"},{"key":"B","text":"12小时以后报警"},{"key":"C","text":"24小时以后报警"},{"key":"D","text":"48小时以后报警"}],"answer":"A","keys":["A"],"explanation":"特殊人群（老年人/未成年人/残疾人）：立即报警。","type":"单选题"},{"number":115,"stem":"为了避免游客在旅游过程中遭遇传染病疫情，导游操作错误的是（）。","options":[{"key":"A","text":"出行戴口罩、勤洗手，打喷嚏或咳嗽时用肘部或纸巾遮住口鼻"},{"key":"B","text":"增加外出，不要在室内逗留，避免空气不流通"},{"key":"C","text":"多喝水、吃蔬菜水果、多休息、不熬夜，行程安排劳逸结合"},{"key":"D","text":"疫情高发期，随时关注旅游者身体状况，做到早发现、早治疗"}],"answer":"B","keys":["B"],"explanation":"1. 做好个人防护，出行戴口罩、勤洗手，打喷嚏或咳嗽时用肘部或纸巾遮住口鼻，个人生活用品分开使用，加强通风和清洁消毒；2. 不去高风险区域减少外出，出游时避免人流大的景点及人群聚集区，少去室内公共场所；3. 提高机体免疫能力多喝水、吃蔬菜水果、多休息、不熬夜，行程安排劳逸结合；4. 密切关注旅游者状况，疫情高发期，随时关注旅游者身体状况，做到早发现、早报告、早诊断、早隔离、早治疗。","type":"单选题"},{"number":116,"stem":"遭遇火灾后，导游应该（）。","options":[{"key":"A","text":"导游带领游客迅速搭乘电梯以最快速度逃生"},{"key":"B","text":"提醒游客只能拿身边的东西，其他东西放弃"},{"key":"C","text":"若身上着火，不可奔跑，应就地打滚或用厚重衣物压灭火苗"},{"key":"D","text":"若火势较大，快速冲过火区，尽量减少被火势包围的可能"}],"answer":"C","keys":["C"],"explanation":"1. 立即报警，发现火情后，导游应迅速拨打 119报警，同时简明扼要地将情况上报旅行社；2. 组织旅游者撤离，导游应迅速组织旅游者通过安全出口疏散撤离，不搭乘电梯或随意跳楼；3. 引导旅游者自救，必要时，导游应引导旅游者就地开展自救：·如提醒大家不要贪恋财物，迅速逃生；·若楼道出现浓烟，应尽快找毛巾沾湿并捂住口鼻，身体尽量贴近地面行走；·若身上着火，不可奔跑，应就地打滚或用厚重衣物压灭火苗；·若大火已封闭逃生通道，则应立即退回室内，用湿被褥塞住门缝，并向窗外发出求救信号，等待救援；4. 组织抢救受伤者，若火势较大且有人受伤，应立即组织抢救。5. 安抚旅游者情绪，做好旅游者情绪安抚工作，配合旅行社解决因火灾引发的一系列问题；6. 做好善后工作，协助有关方面处理善后事宜，设法使旅游活动尽早恢复。","type":"单选题"},{"number":117,"stem":"遭受雷击后，导游救护正确的选项是（）。","options":[{"key":"A","text":"如果衣服着火，迅速把伤者衣服脱下来，避免烧伤"},{"key":"B","text":"若伤者失去意识，立即做人工呼吸"},{"key":"C","text":"若伤者无呼吸，应迅速组织人员进行心肺复苏"},{"key":"D","text":"若伤者失去呼吸，立即拨打 120，静静等待医护人员到来"}],"answer":"C","keys":["C"],"explanation":"衣物着火处理：如果衣服着火，可往伤者身上泼水或用厚外衣、毯子等把伤者捂住灭火，迅速隔绝空气使火熄灭；伤者有呼吸时：若伤者失去意识但仍有呼吸，应让其舒适平卧，保持安静休息，随后送往医院进行进一步检查和治疗；伤者无呼吸时：若伤者无呼吸，应迅速组织人员进行心肺复苏，持续施救直至救护人员赶到，心肺复苏操作应规范、用力适度，确保救援效果。","type":"单选题"},{"number":118,"stem":"（）是由人民政府外事部门颁发的。","options":[{"key":"A","text":"外交护照"},{"key":"B","text":"公务护照"},{"key":"C","text":"普通护照"},{"key":"D","text":"澳门特别行政区护照"}],"answer":"B","keys":["B"],"explanation":"解析公务护照：由外交部、我国驻外使、领馆或者外交部委托的其他驻外机构以及外交部委托的省、自治区、直辖市和设区的市人民政府外事部门颁发。","type":"单选题"},{"number":119,"stem":"下列药材中，可以出境的是（）。","options":[{"key":"A","text":"麝香"},{"key":"B","text":"蟾酥"},{"key":"C","text":"牛黄"},{"key":"D","text":"人参"}],"answer":"D","keys":["D"],"explanation":"解析麝香、蟾酥、虎骨、犀牛角、牛黄等以及超出上述规定限值的中药材、中成药不准出境。","type":"单选题"},{"number":120,"stem":"来自疫区的人员必须出示疾病预防接种证明。卫生检疫机关有权对无证者施以（）日的强制留验。","options":[{"key":"A","text":"5"},{"key":"B","text":"6"},{"key":"C","text":"7"},{"key":"D","text":"8"}],"answer":"B","keys":["B"],"explanation":"来自疫区的人员还必须出示有效的相关疾病预防接种证明。卫生检疫机关有权对无证者施以 6日的强制留验。","type":"单选题"},{"number":121,"stem":"一名 17 周岁的内地公民，申请往来港澳通行证的有效期为（）。","options":[{"key":"A","text":"3 年"},{"key":"B","text":"5 年"},{"key":"C","text":"10年"},{"key":"D","text":"20年"}],"answer":"C","keys":["C"],"explanation":"未满 16周岁的申请者所持通行证有效期为 5 年，年满 16 周岁（含）以上的申请者所持通行证有效期为 10 年。","type":"单选题"},{"number":122,"stem":"CA是（）的代码。","options":[{"key":"A","text":"中国国际航空公司"},{"key":"B","text":"中国东方航空公司"},{"key":"C","text":"中国南方航空股份有限公司"},{"key":"D","text":"春秋航空公司"}],"answer":"A","keys":["A"],"explanation":"解析由航空公司二字英文代码与阿拉伯数字构成。例如，中国国际航空公司（CA）、中国东方航空公司（MU）、中国南方航空股份有限公司（CZ）。","type":"单选题"},{"number":123,"stem":"根据航空公司规定，（）的酒精饮料，单容器不超过 5 升，旅客托运总量不超过 5 升。","options":[{"key":"A","text":"酒精含量≤1%"},{"key":"B","text":"酒精含量≤24%"},{"key":"C","text":"24%\u003c酒精含量≤70%"},{"key":"D","text":"酒精含量>70%"}],"answer":"C","keys":["C"],"explanation":"24%\u003c酒精含量≤70%：单容器不超 5升，旅客托运总量不超 5 升。","type":"单选题"},{"number":124,"stem":"关于铁路限量携带物品的描述，正确的选项是（）。","options":[{"key":"A","text":"自喷压力容器冷烫精/染发剂等，限量 1000 毫升"},{"key":"B","text":"打火机 5 个"},{"key":"C","text":"管制器具一件"},{"key":"D","text":"花露水限带 1 件且容量小于 100毫升"}],"answer":"D","keys":["D"],"explanation":"自喷压力容器（冷烫精/染发剂/摩丝/发胶/杀虫剂/空气清新剂等）总量限制：≤600毫升；打火机：≤2 个；管制器具禁止托运与携带；花露水限带 1 件，单件容量：≤100毫升","type":"单选题"},{"number":125,"stem":"如果在沙漠中迷失方向，游客应该（）。","options":[{"key":"A","text":"如果是多人，立即分头找寻道路"},{"key":"B","text":"原地等候救援"},{"key":"C","text":"沿着原路返回"},{"key":"D","text":"立即联系组团社"}],"answer":"B","keys":["B"],"explanation":"若走散迷失方向，切勿慌张和乱走，应在原地等待救援。","type":"单选题"},{"number":126,"stem":"在冰上进行活动时，（）是极其危险的。","options":[{"key":"A","text":"冰面上随意穿行、打闹嬉戏"},{"key":"B","text":"穿好防滑鞋、防寒衣物、头盔"},{"key":"C","text":"仔细观察冰面颜色、气泡、裂纹"},{"key":"D","text":"了解设备位置及使用方法"}],"answer":"A","keys":["A"],"explanation":"禁止行为：冰面上随意穿行、打闹嬉戏；使用明火或进行破坏冰面的活动。","type":"单选题"},{"number":127,"stem":"外汇兑换证明（水单）的有效期为（）。","options":[{"key":"A","text":"1 个月"},{"key":"B","text":"3 个月"},{"key":"C","text":"6 个月"},{"key":"D","text":"12个月"}],"answer":"C","keys":["C"],"explanation":"游客应妥善保管银行出具的外汇兑换证明（俗称“水单”，有效期为 6 个月）。","type":"单选题"},{"number":128,"stem":"旅游意外保险的索赔时效，一般为事故发生之日起（）内。","options":[{"key":"A","text":"30天"},{"key":"B","text":"90天"},{"key":"C","text":"180天"},{"key":"D","text":"365天"}],"answer":"C","keys":["C"],"explanation":"按合同约定，一般为事故发生之日起 180日内。","type":"单选题"},{"number":129,"stem":"饭店取得星级标志满（）年后，需进行评定性复核。","options":[{"key":"A","text":"3"},{"key":"B","text":"5"},{"key":"C","text":"8"},{"key":"D","text":"10"}],"answer":"B","keys":["B"],"explanation":"饭店取得星级标志满 5 年后，需进行评定性复核。","type":"单选题"},{"number":130,"stem":"2011年，我国开始在（）试点离境退税政策。","options":[{"key":"A","text":"海南"},{"key":"B","text":"厦门"},{"key":"C","text":"上海"},{"key":"D","text":"青岛"}],"answer":"A","keys":["A"],"explanation":"2011年起，中国在海南开始试点离境退税政策。三、多选题","type":"单选题"},{"number":131,"stem":"《宪法》规定，以下属于公民人身自由权的是（）。","options":[{"key":"A","text":"人身自由不受侵犯"},{"key":"B","text":"人格尊严不受侵犯"},{"key":"C","text":"住宅不受侵犯"},{"key":"D","text":"通信自由和通信秘密受法律的保护"},{"key":"E","text":"公民有宗教信仰自由"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"“公民有宗教信仰自由”错误，公民有宗教信仰自由是公民的宗教信仰自由权。","type":"多选题"},{"number":132,"stem":"依据我国《旅游法》的规定，下列选项中，属于旅游发展规划内容的是（）。","options":[{"key":"A","text":"旅游业发展的规划纲要"},{"key":"B","text":"旅游业发展的总体要求和发展目标"},{"key":"C","text":"旅游资源保护和利用的要求和措施"},{"key":"D","text":"旅游基础设施建设"},{"key":"E","text":"旅游产品营销"}],"answer":"BCD","keys":["B","C","D"],"explanation":"《旅游法》第 18条规定，旅游发展规划应当包括旅游业发展的总体要求和发展目标，旅游资源保护和利用的要求和措施，以及旅游产品开发、旅游服务质量提升、旅游文化建设、旅游形象宣传和推广、旅游基础设施和公共服务设施建设的要求和促进等内容。","type":"多选题"},{"number":133,"stem":"依据《中华人民共和国旅游法》，因不可抗力或者旅行社、履行辅助人已尽合理注意义务仍不能避免的事件，影响了旅游行程。下列关于处理这种情形的说法中，正确的有（）。","options":[{"key":"A","text":"合同变更的，因此增加的费用由旅行社与旅游者分担"},{"key":"B","text":"合同不能继续履行的，旅行社和旅游者均可以解除合同"},{"key":"C","text":"危及旅游者人身、财产安全的，旅行社采取相应的安全措施，支出的费用由旅行社承担"},{"key":"D","text":"造成旅游者滞留的，旅行社采取相应安置措施，增加的返程费用由旅行社承担"},{"key":"E","text":"造成旅游者滞留的，旅行社采取相应安置措施，增加的食宿费用由旅游者承担"}],"answer":"BE","keys":["B","E"],"explanation":"《旅游法》第 67条规定，因不可抗力或者旅行社、履行辅助人已尽合理注意义务仍不能避免的事件，影响旅游行程的，按照下列情形处理：合同不能继续履行的，旅行社和旅游者均可以解除合同。合同不能完全履行的，旅行社经向旅游者作出说明，可以在合理范围内变更合同；旅游者不同意变更的，可以解除合同。合同解除的，组团社应当在扣除已向地接社或者履行辅助人支付且不可退还的费用后，将余款退还旅游者；合同变更的，因此增加的费用由旅游者承担，减少的费用退还旅游者。危及旅游者人身、财产安全的，旅行社应当采取相应的安全措施，因此支出的费用，由旅行社与旅游者分担。造成旅游者滞留的，旅行社应当采取相应的安置措施。因此增加的食宿费用，由旅游者承担；增加的返程费用，由旅行社与旅游者分担。","type":"多选题"},{"number":134,"stem":"关于监护人的职责，下列说法正确的有（）。","options":[{"key":"A","text":"监护人应当代理被监护人实施民事法律行为"},{"key":"B","text":"监护人应当保护被监护人的人身权利、财产权利以及其他合法权益"},{"key":"C","text":"监护人应当尊重被监护人的真实意愿（在有能力表达时）"},{"key":"D","text":"监护人应当按照尽可能有利于被监护人的原则履行监护职责"},{"key":"E","text":"未成年人的监护人履行监护职责，应当最大程度地尊重被监护人的真实意愿"}],"answer":"ABC","keys":["A","B","C"],"explanation":"《民法典》第 35条规定，监护人应当按照最有利于被监护人的原则履行监护职责。监护人除为维护被监护人利益外，不得处分被监护人的财产。未成年人的监护人履行监护职责，在作出与被监护人利益有关的决定时，应当根据被监护人的年龄和智力状况，尊重被监护人的真实意愿。成年人的监护人履行监护职责，应当最大程度地尊重被监护人的真实意愿，保障并协助被监护人实施与其智力、精神健康状况相适应的民事法律行为。对被监护人有能力独立处理的事务，监护人不得干涉。","type":"多选题"},{"number":135,"stem":"民事法律行为的生效要件包括（）。","options":[{"key":"A","text":"行为人具有完全民事行为能力"},{"key":"B","text":"不违反法律的强制性规定"},{"key":"C","text":"意思表示真实"},{"key":"D","text":"不违反行政法规的强制性规定"},{"key":"E","text":"不违背公序良俗"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"《民法典》第 143条规定，具备下列条件的民事法律行为有效：（1）行为人具有相应的民事行为能力；（2）意思表示真实；（3）不违反法律、行政法规的强制性规定，不违背公序良俗。“行为人具有完全民事行为能力”错误，只要行为人有相应的民事行为能力就可以，不是必须要求“完全民事行为能力”。","type":"多选题"},{"number":136,"stem":"依据《旅行社服务质量赔偿标准》，旅行社应当向旅游者支付旅游费用总额 20%的违约金的情形包括（）。","options":[{"key":"A","text":"旅行社未经旅游者同意，擅自将旅游者转团、拼团的"},{"key":"B","text":"旅行社未经旅游者同意，擅自安排另行付费项目的"},{"key":"C","text":"擅自违反合同约定增加购物两次，延长停留时间的"},{"key":"D","text":"因旅行社原因造成旅游者未能乘坐预定交通工具的"},{"key":"E","text":"强迫或者变相强迫旅游者购物一次的"}],"answer":"CE","keys":["C","E"],"explanation":"选项“旅行社未经旅游者同意，擅自将旅游者转团、拼团的”错误，擅自转团、拼团的，旅行社应向旅游者支付旅游费用总额 25%的违约金；选项“旅行社未经旅游者同意，擅自安排另行付费项目的”错误，未经旅游者签字确认，擅自安排合同约定以外的用餐、娱乐、医疗保健、参观等另行付费项目的，旅行社应承担另行付费项目的费用。选项“因旅行社原因……”错误，因旅行社原因未乘坐公共交通工具的。旅行社应赔偿旅游者的直接经济损失，并支付直接经济损失 20%的违约金；选项“擅自违反合同……”正确，未经旅游者签字确认，擅自违反合同约定增加购物次数、延长停留时间的，每次向旅游者支付旅游费用总额 10% 的违约金；选项“强迫或者变相……”正确，强迫或者变相强迫旅游者购物的，每次向旅游者支付旅游费用总额 20% 的违约金。","type":"多选题"},{"number":137,"stem":"依据《导游管理办法》，当旅游突发事件发生时，导游员采取的应急处置措施有（）。","options":[{"key":"A","text":"向发生地公安部门报告"},{"key":"B","text":"救助受困旅游者"},{"key":"C","text":"协助救助受困旅游者"},{"key":"D","text":"根据有关机构的要求，采取调整或者中止行程、停止带团前往风险区域"},{"key":"E","text":"根据有关机构的要求，采取撤离风险区域等避险措施"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"“向发生地公安部门报告”错误，是“向本单位负责人报告”，《导游管理办法》第24 条，旅游突发事件发生后，导游应当立即采取下列必要的处置措施：向本单位负责人报告，情况紧急或者发生重大、特别重大旅游突发事件时，可以直接向发生地、旅行社所在地县级以上旅游主管部门、安全生产监督管理部门和负有安全生产监督管理职责的其他相关部门报告；救助或者协助救助受困旅游者；根据旅行社、旅游主管部门及有关机构的要求，采取调整或者中止行程、停止带团前往风险区域、撤离风险区域等避险措施。","type":"多选题"},{"number":138,"stem":"根据《导游管理办法》的规定，具有下列（）情形的，不予核发导游证。","options":[{"key":"A","text":"无民事行为能力或者限制民事行为能力的"},{"key":"B","text":"患有甲类、乙类传染性疾病的"},{"key":"C","text":"受过治安处罚的"},{"key":"D","text":"患有可能危害旅游者人身健康安全的传染性疾病的"},{"key":"E","text":"患有重度抑郁症的"}],"answer":"ABD","keys":["A","B","D"],"explanation":"《导游管理办法》第 12条规定，具有下列情形的，不予核发导游证：无民事行为能力或者限制民事行为能力的；患有甲类、乙类以及其他可能危害旅游者人身健康安全的传染性疾病的；受过刑事处罚的，过失犯罪的除外；被吊销导游证之日起未逾 3年的。","type":"多选题"},{"number":139,"stem":"我国对“旅游不文明行为记录”的信息保存期限实行动态管理，下列关于信息保存期限的表述中正确的是（）。","options":[{"key":"A","text":"违反刑法的，信息保存期限为 3 年至 5 年"},{"key":"B","text":"法院判决承担责任，信息保存期限为 3 年至 5 年"},{"key":"C","text":"多次纳入“旅游不文明行为记录”的，信息保存期限为 5 年至 10 年"},{"key":"D","text":"受到行政处罚的，信息保存期限为 2 年至 4 年"},{"key":"E","text":"未受到法律法规处罚的，但造成恶劣社会影响的，信息保存期限为 1 年至 3 年"}],"answer":"ADE","keys":["A","D","E"],"explanation":"《国家旅游局关于旅游不文明行为记录管理暂行办法》第 9 条规定，“旅游不文明行为记录”信息保存期限为 1-5 年，实行动态管理。 ①行为当事人违反刑法的，信息保存期限为 3- 5 年；②行为当事人受到行政处罚或法院判决承担责任的，信息保存期限为 2- 4年；③行为未受到法律法规处罚，但造成严重社会影响的，信息保存期限为 1- 3 年。“未受到法律法规处罚的，但造成社会影响的……”错在“造成社会影响”，应该是“造成严重社会影响”。","type":"多选题"},{"number":140,"stem":"根据《旅游法》的规定，旅游者与旅游经营者发生纠纷，可以通过（）途径解决。","options":[{"key":"A","text":"双方协商"},{"key":"B","text":"向消费者协会、旅游投诉受理机构或者有关调解组织申请调解"},{"key":"C","text":"根据达成的仲裁协议提请仲裁机构仲裁"},{"key":"D","text":"向监察机关提出申诉"},{"key":"E","text":"向人民法院提起诉讼"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"《旅游法》第 92条规定，旅游者与旅游经营者发生纠纷，可以通过下列途径解决：（1）双方协商；（2）向消费者协会、旅游投诉受理机构或者有关调解组织申请调解；（3）根据与旅游经营者达成的仲裁协议提请仲裁机构仲裁；（4）向人民法院提起诉讼。选项“向监察机关提出申诉”不在此其情形内。“监察机关”是对所有行使公共权力的公职人员进行监察。","type":"多选题"},{"number":141,"stem":"根据可能对旅游者造成的（），旅游目的地安全风险提示级别分为一级、二级、三级和四级。","options":[{"key":"A","text":"发展态势"},{"key":"B","text":"影响范围"},{"key":"C","text":"持续时间"},{"key":"D","text":"危害程度"},{"key":"E","text":"紧急程度"}],"answer":"ADE","keys":["A","D","E"],"explanation":"解析根据可能对旅游者造成的危害程度、紧急程度和发展态势，风险提示级别分为一级（特别严重）、二级（严重）、三级（较重）和四级（一般），分别用红色、橙色、黄色和蓝色标示。","type":"多选题"},{"number":142,"stem":"《中华人民共和国食品安全法》规定，食品安全事故应急预案应当对（）等作出规定。","options":[{"key":"A","text":"事故处置组织指挥体系与职责"},{"key":"B","text":"预防预警机制"},{"key":"C","text":"食品安全事故分级"},{"key":"D","text":"处置程序"},{"key":"E","text":"应急保障措施"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"食品安全事故应急预案应当对食品安全事故分级、事故处置组织指挥体系与职责、预防预警机制、处置程序、应急保障措施等做出规定。","type":"多选题"},{"number":143,"stem":"根据《宪法》规定，以下可能影响公民的选举权和被选举权的因素有（）。","options":[{"key":"A","text":"年龄"},{"key":"B","text":"国籍"},{"key":"C","text":"民事行为能力"},{"key":"D","text":"政治权利"},{"key":"E","text":"宗教教派"}],"answer":"ABD","keys":["A","B","D"],"explanation":"解析我国年满 18周岁的公民，不分民族、种族、性别、职业、家庭出身、宗教信仰、教育程度、财产状况、居住期限，都有选举权和被选举权；但是依照法律被剥夺政治权利的人除外。","type":"多选题"},{"number":144,"stem":"在订立包价旅游合同时，旅行社应当向旅游者详细说明和告知的事项包括（）。","options":[{"key":"A","text":"包价旅游合同的费用构成"},{"key":"B","text":"旅游活动中的安全注意事项"},{"key":"C","text":"旅行社依法可以减免责任的信息"},{"key":"D","text":"旅游者应当注意的旅游目的地相关法律、法规和风俗习惯、宗教禁忌"},{"key":"E","text":"法律、法规规定的其他应当告知的事项"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"《旅游法》第 62条规定，订立包价旅游合同时，旅行社应当向旅游者告知下列事项：旅游者不适合参加旅游活动的情形；旅游活动中的安全注意事项；旅行社依法可以减免责任的信息；旅游者应当注意的旅游目的地相关法律、法规和风俗习惯、宗教禁忌，依照中国法律不宜参加的活动等；法律、法规规定的其他应当告知的事项。在包价旅游合同履行中，遇有前款规定事项的，旅行社也应当告知旅游者。“包价旅游合同的费用构成”是旅行社的商业秘密，无需告诉旅游者。故本项错误。","type":"多选题"},{"number":145,"stem":"依据习近平新时代中国特色社会主义思想相关理论，下列关于新发展阶段、新发展理念、新发展格局的表述，符合“十个明确”规定的有（）。","options":[{"key":"A","text":"贯彻创新、协调、绿色、开放、共享的新发展理念"},{"key":"B","text":"构建以国内国际双循环为主体、国内大循环相互促进的新发展格局"},{"key":"C","text":"使市场在资源配置中起决定性作用，更好发挥政府作用"},{"key":"D","text":"推动高速发展，统筹发展和安全"},{"key":"E","text":"把握新发展阶段，加快构建新发展格局"}],"answer":"ACE","keys":["A","C","E"],"explanation":"明确必须坚持和完善社会主义基本经济制度，使市场在资源配置中起决定性作用，更好发挥政府作用，把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展，统筹发展和安全（“十个明确”第 7 点）。A 项正确，创新、协调、绿色、开放、共享为新发展理念，。B 项错误，原文为“以国内大循环为主体、国内国际双循环相互促进”，选项将主次表述颠倒。C 项正确，市场在资源配置中起决定性作用、更好发挥政府作用。D项错误，原文为推动高质量发展，不是高速发展。E 项正确，把握新发展阶段、加快构建新发展格局。","type":"多选题"},{"number":146,"stem":"下列关于英雄烈士遗属抚恤优待制度的表述正确的是（）。","options":[{"key":"A","text":"地方人民政府应当每年定期走访慰问英雄烈士遗属"},{"key":"B","text":"对英雄烈士的抚恤优待要与国民经济和社会发展相适应并逐步提高"},{"key":"C","text":"国家鼓励和支持自然人、法人和非法人组织参与英雄烈士保护工作"},{"key":"D","text":"自然人、法人和非法人组织捐赠财产用于英雄烈士保护的，依法免缴税费"},{"key":"E","text":"英雄烈士遗属按照国家规定享受教育、就业、养老、住房、医疗等方面的优待"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"“自然人、法人和……依法免缴税费”错误，《英烈法》第 20 条规定，自然人、法人和非法人组织捐赠财产用于英雄烈士保护的，依法享受税收优惠。","type":"多选题"},{"number":147,"stem":"根据《食品安全法》规定，县级以上人民政府食品安全监督管理部门接到食品安全事故的报告后，应当立即会同有关部门进行调查处理，并采取（）措施。","options":[{"key":"A","text":"开展应急救援工作，组织救治因食品安全事故导致人身伤害的人员"},{"key":"B","text":"对导致食品安全事故的食品及其原料进行清洗消毒"},{"key":"C","text":"对疑似被污染的食品及其原料，责令食品生产经营者召回"},{"key":"D","text":"封存被污染的食品相关产品"},{"key":"E","text":"做好信息发布工作"}],"answer":"ADE","keys":["A","D","E"],"explanation":"“对导致食品安全事故的食品及其原料进行清洗消毒”说法有误，正确的表达是“封存可能导致食品安全事故的食品及其原料”；“对疑似被污染……”，正确的表达是“对确认属于被污染的食品及其原料”。","type":"多选题"},{"number":148,"stem":"全陪的主要职责有（）。","options":[{"key":"A","text":"实施旅游接待计划"},{"key":"B","text":"做好联络工作"},{"key":"C","text":"宣传、调研工作"},{"key":"D","text":"进行导游讲解"},{"key":"E","text":"维护安全，处理问题"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"实施旅游接待计划；做好联络工作；做好组织协调工作；维护安全，处理问题；宣传、调研工作。","type":"多选题"},{"number":149,"stem":"地陪导游首次沿途讲解包括（）。","options":[{"key":"A","text":"介绍当地的地理位置、气候环境、历史文化"},{"key":"B","text":"推销当地特产"},{"key":"C","text":"讲解从机场（车站、码头）到下榻饭店或参观景点道路沿线存在的景观"},{"key":"D","text":"宣布当天或者次日安排"},{"key":"E","text":"向旅游者介绍饭店的名称、位置、星级、服务项目、入住手续及注意事项"}],"answer":"ACE","keys":["A","C","E"],"explanation":"介绍当地的地理位置、气候环境、历史文化、经济发展、社会生活、风物特产等；讲解从机场（车站、码头）到下榻饭店或参观景点道路沿线存在的景观，包括建筑、雕塑、河湖、道路、绿化植物、飞禽走兽等。讲解时要注意触景生情、点面结合、简明扼要，使讲解速度与旅游车行驶速度一致，准确描述景物；在旅游车快到下榻饭店时，地陪应向旅游者介绍饭店的名称、位置、星级、距机场（车站、码头）距离、服务项目、入住手续及注意事项等","type":"多选题"},{"number":150,"stem":"地陪导游接团前的准备工作包括（）。","options":[{"key":"A","text":"熟悉接待计划"},{"key":"B","text":"落实接待计划"},{"key":"C","text":"知识准备"},{"key":"D","text":"形象准备与心理准备"},{"key":"E","text":"旅游产品销售准备"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"解析熟悉接待计划；落实接待计划；物品与资料准备；知识准备；形象准备与心理准备。","type":"多选题"},{"number":151,"stem":"旅游团即将抵达前的业务安排内容有（）。","options":[{"key":"A","text":"与全陪或入境领队联系"},{"key":"B","text":"确认抵达信息"},{"key":"C","text":"持证上岗"},{"key":"D","text":"与旅游车司机对接"},{"key":"E","text":"再次核实旅游团抵达的时间"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"1. 确认旅游团抵达的时间和地点（与全陪或入境领队联系、确认抵达信息）。2. 与旅游车司机对接；3. 再次核实旅游团抵达的时间。","type":"多选题"},{"number":152,"stem":"全陪带团首站讲解的内容包括（）。","options":[{"key":"A","text":"首站城市概况"},{"key":"B","text":"致欢迎词"},{"key":"C","text":"介绍行程安排"},{"key":"D","text":"介绍消费支付和货币兑换方式"},{"key":"E","text":"提醒注意事项"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"致欢迎词; 介绍行程安排; 介绍消费支付和货币兑换方式; 提醒注意事项。","type":"多选题"},{"number":153,"stem":"游客在海外购物时, 应该遵循的原则有（）。","options":[{"key":"A","text":"导游领队应提醒游客理性、诚信消费, 全力议价"},{"key":"B","text":"遵守购物场所规范, 保持购物场所秩序, 可以随意试吃"},{"key":"C","text":"导游领队应提醒游客尊重购物场所购物数量限制"},{"key":"D","text":"提醒游客购物活动结束时间和购物结束后的集合地点, 避免游客迟到"},{"key":"E","text":"购买奢侈品时, 要求少开价格发票, 合理避税"}],"answer":"CD","keys":["C","D"],"explanation":"1. 导游领队应提醒游客理性、诚信消费, 适度议价, 善意待人, 遵守契约。2. 导游领队应提醒游客遵守购物场所规范, 保持购物场所秩序, 不哄抢喧哗, 试吃试, 用商品应征得同意, 不随意占用购物场所非公共区域的休息座椅。3. 导游领队应提醒游客尊重购物场所购物数量限制。4. 在购物活动前，导游领队应提醒游客购物活动结束时间和购物结束后的集合地点，避免游客迟到、拖延而引发的不文明现象发生。","type":"多选题"},{"number":154,"stem":"下列内容中，对导游虚实结合法描述正确的是（）。","options":[{"key":"A","text":"“虚”包括民间故事、神话传说"},{"key":"B","text":"“实”指景观的具体形象、真实历史"},{"key":"C","text":"虚实有机结合、自然连贯，不能生搬硬套"},{"key":"D","text":"以“实”为主，“虚”为“实”服务，烘托情节"},{"key":"E","text":"注意内容选择，“虚”要从眼前景物中选，“实”要“精”要“活”。"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"“虚”包括民间故事、神话传说等，“实”指景观的具体形象、真实历史等。运用虚实结合法时，需注意以下几点：（1）虚实有机结合、自然连贯，不能生搬硬套；（2）以“实”为主，“虚”为“实”服务，烘托情节；（3）注意内容选择，“实”要从眼前景物中选，“虚”要“精”要“活”。","type":"多选题"},{"number":155,"stem":"在带研学团旅行过程中，导游应该注意的事项包括（）。","options":[{"key":"A","text":"适当做到旅游特色产品营销"},{"key":"B","text":"掌握必要的教育知识和教学方法"},{"key":"C","text":"区分讲解与研学指导的不同功能"},{"key":"D","text":"重视言传身教的作用"},{"key":"E","text":"牢记安全第一的理念"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"掌握必要的教育知识和教学方法；区分讲解与研学指导的不同功能；重视言传身教的作用；牢记安全第一的理念。","type":"多选题"},{"number":156,"stem":"导游应对游客个别要求的原则是（）。","options":[{"key":"A","text":"遵循法律、法规和标准的原则"},{"key":"B","text":"维护尊严原则"},{"key":"C","text":"尽量满足旅游者合理要求的原则"},{"key":"D","text":"尊重旅游者，不卑不亢的原则"},{"key":"E","text":"符合旅行社要求的原则"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"遵循法律、法规和标准的原则；维护尊严原则；尽量满足旅游者合理要求的原则；尊重旅游者，不卑不亢的原则。","type":"多选题"},{"number":157,"stem":"游客提出延长旅游期限，导游操作正确的内容包括（）。","options":[{"key":"A","text":"由旅游者提出书面申请，报请旅行社同意"},{"key":"B","text":"协助旅游者办理延长旅游期相关事宜"},{"key":"C","text":"如外国旅游者为团体签证时，请其自行到当地公安机关机构出入境管理部门办理分离团队签证"},{"key":"D","text":"若因病、受伤滞留的旅游者，导游应该无偿为游客提供帮助"},{"key":"E","text":"若外国旅游者要求延长签证未获批准，请领队、全陪协助做好规劝工作，使其按时随团出境"}],"answer":"ABE","keys":["A","B","E"],"explanation":"1. 书面申请与审批，由旅游者提出书面申请，报请旅行社同意：2. 协助办理相关事宜，协助旅游者办理延长旅游期相关事宜（如重新订房、订交通票等）。如外国旅游者为团体签证时，须协助其去当地公安机关机构出入境管理部门办理分离团队签证或延，长个人旅华签证手续，费用由其自理。若外国旅游者要求延长旅行期的签证未获当地出入境管理部门的批准，导游应请领队、全陪协助做好规劝工作，使其按时随团出境；3. 关心滞留旅游者，导游应关心因病、受伤滞留的旅游者。如需导游继续为其提供各项服务，则与旅行社另签相关合同；4. 费用自理，延长旅游期内所发生的一切费用由旅游者自理。","type":"多选题"},{"number":158,"stem":"为了预防游客中暑，导游应该（）。","options":[{"key":"A","text":"夏日旅游节奏轻松，避免长时间烈日下活动"},{"key":"B","text":"提醒旅游者少穿浅色宽松棉麻服装，多穿化纤类"},{"key":"C","text":"涂抹防晒霜，带遮阳伞、帽、太阳镜、防晒衣等"},{"key":"D","text":"建议旅游者带保温杯，及时补水"},{"key":"E","text":"提醒旅游者准备藿香正气水、人丹、十滴水、风油精等常规药物"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"1. 合理安排行程，夏日旅游节奏轻松，避免长时间烈日下活动，早晚室外参观，中午前后室内游览或休息；2. 做好防护工作，提醒旅游者穿浅色宽松棉麻服装，少穿化纤类；涂抹防晒霜；带遮阳伞、帽、太阳镜、防晒衣等；3. 喝水补充电解质，建议旅游者带保温杯，及时补水，可在茶水中加菊花等清凉解毒成分；4. 备好防暑药品，提醒旅游者准备藿香正气水、人丹、十滴水、风油精等常规药物。","type":"多选题"},{"number":159,"stem":"中国游客在境外丢失证件后，导游应该（）。","options":[{"key":"A","text":"稳定旅游者情绪"},{"key":"B","text":"协助寻找，同时报告旅行社"},{"key":"C","text":"向当地警方报失（取得丢失证明）"},{"key":"D","text":"向中国驻当地使领馆申请签证"},{"key":"E","text":"办理相关离境手续"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"旅游者丢失证件或物品时，导游应稳定旅游者情绪，详细了解丢失情况，协助寻找，同时报告旅行社，并按以下要求处理；领队应协助旅游者： ①向当地警方报失（取得丢失证明）； ②向中国驻当地使领馆/政府派出机构申请新证件；③办理相关离境手续。","type":"多选题"},{"number":160,"stem":"当旅游者遭遇社会骚乱等群体性事件时，导游应该（）。","options":[{"key":"A","text":"立即向旅行社报告"},{"key":"B","text":"向旅游者预警，引导旅游者采取相应的安全防范措施"},{"key":"C","text":"立刻带领旅游者撤离事发区域"},{"key":"D","text":"稳定旅游者情绪，立即取消旅游行程"},{"key":"E","text":"旅游者人身、财物受到威胁的，带领游客与列徒搏斗"}],"answer":"ABC","keys":["A","B","C"],"explanation":"（1）立即向旅行社报告，反映旅游者遭遇群体性事件的详细情况，并向旅游者预警，引导旅游者采取相应的安全防范措施，同时配合现场警务人员指挥，组织旅游者有序撤离事发区域，若无警务人员现场指挥，立刻带领旅游者撤离事发区域；（2）旅游者人身、财物受到威胁的，根据现场条件，引导旅游者开展自救和互救，并及时带领旅游者脱离险境，全力保护旅游者的人身和财物安全；（3）稳定旅游者情绪，视情况变更或取消旅游行程，取消旅游行程的，协助旅游者返回出发地或旅游者指定的合理地点。","type":"多选题"},{"number":161,"stem":"导游带领游客在户外旅行中遭遇地震，应该（）。","options":[{"key":"A","text":"客车行驶过程中遭遇地震，司机应立即稳定车辆，迅速降低车速"},{"key":"B","text":"客车停车后，组织乘客撤离车辆"},{"key":"C","text":"若在徒步旅行时发生地震，应立即停止行进，就地选择开阔地带避险"},{"key":"D","text":"迅速蹲下或坐下，降低身体重心，双手护住头部，保持身体稳定"},{"key":"E","text":"选择空旷、平坦且远离建筑物、树木、电线杆等潜在危险源的地点停车"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"（1）旅游客车行驶中遇震，当旅游客车行驶过程中遭遇地震，导游应迅速提醒司机采取紧急措施。司机应立即稳定车辆，迅速降低车速，寻找并选择空旷、平坦且远离建筑物、树木、电线杆等潜在危险源的地点停车。停车后，组织乘客有序撤离车辆，引导大家疏散至安全区域，避免因车辆晃动、碰撞或其他次生灾害造成人员伤害。（2）徒步旅行时遇震，若在徒步旅行时发生地震，应立即停止行进，就地选择开阔地带避险。迅速蹲下或坐下，降低身体重心，双手护住头部，保持身体稳定，防止因地面晃动而摔倒受伤。同时，务必远离以下危险物体和区域。","type":"多选题"},{"number":162,"stem":"形成山体滑坡的条件有（）。","options":[{"key":"A","text":"存在由地下水活动产生的滑坡动力"},{"key":"B","text":"有较松散的岩土"},{"key":"C","text":"有一定坡度的斜坡"},{"key":"D","text":"山间或山前为陡峭的谷地地形"}],"answer":"ABC","keys":["A","B","C"],"explanation":"形成山体滑坡的三个条件为： ① 存在由地下水活动产生的滑坡动力； ②有较松散的岩土；③有一定坡度的斜坡。","type":"多选题"},{"number":163,"stem":"关于出入境携带金银的描述，正确的内容有（）。","options":[{"key":"A","text":"旅客携带金、银入境数量不受限制，但是必须向海关申报登记"},{"key":"B","text":"携带或者复带金银出境，海关凭中国人民银行出具的证明或者原入境时的申报单登记的数量查验放行"},{"key":"C","text":"携带在境内供应游客购买的金银饰品出境，海关凭发票查验放行"},{"key":"D","text":"每人携带黄金饰品限额为 10 市两（312.5 克）"},{"key":"E","text":"每人携带银质器皿限额为 20 市两（625克）"}],"answer":"ABE","keys":["A","B","E"],"explanation":"旅客携带金、银入境数量不受限制，但是必须向海关申报登记，由海关登记后予以放行；携带或者复带金银出境，海关凭中国人民银行出具的证明或者原入境时的申报单登记的数量查验放行；携带在境内供应游客购买的金银饰品（包括镶嵌饰品、工艺品、器皿等）出境，海关凭国内经营金银制品的单位开具的特种发货票查验放行；在境内的中国人、外国侨民和无国籍人出境定居，每人携带金银的限额为：黄金饰品 1 市两（31.25 克），白银饰品 10市两（312.50 克），银质器皿 20 市两（625克）。经海关查验符合规定限额的放行。","type":"多选题"},{"number":164,"stem":"下列情形中，旅游者会被拒载的是（）。","options":[{"key":"A","text":"旅游者携带国家规定禁运物品"},{"key":"B","text":"饮酒的旅客"},{"key":"C","text":"拒绝安检的旅客"},{"key":"D","text":"90岁的老人"}],"answer":"ACD","keys":["A","C","D"],"explanation":"依据《公共航空运输旅客服务管理规定》，以下情况承运人应拒绝运输：（1）按国家规定禁运的旅客或物品；（2）拒绝安检的旅客；（3）未经安检的行李；（4）办理乘机登记手续时身份证件与购票时不符的旅客；（5）其他违反国家规定的情况。","type":"多选题"},{"number":165,"stem":"（）是高原反应的典型症状。","options":[{"key":"A","text":"轻度症状为头疼、头晕、心慌、气短、胸闷"},{"key":"B","text":"中度症状为身体燥热，体温达到 38度以上"},{"key":"C","text":"中度症状为嘴唇和指甲床呈青紫色"},{"key":"D","text":"重度症状为咳嗽带痰，有粉红色或泡沫状痰液"},{"key":"E","text":"重度症状为步态不稳、无法走直线"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"症状与体征：轻度症状：头疼、头晕、心慌、气短、胸闷、食欲缺乏、手脚发麻、恶心、呕吐、口唇指甲发绀。中度症状：头痛加剧、频繁呕吐、呼吸急促、嘴唇和指甲床呈青紫色（缺氧标志）。重度症状：呼吸极度困难，静息时也无法平卧，需端坐呼吸；咳嗽带痰，有粉红色或泡沫状痰液；面色灰白、皮肤湿冷、神志模糊、胡言乱语或昏迷；步态不稳、无法走直线；剧烈头痛，伴随喷射性呕吐。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD四/LDD押题第4卷（科目一二）-解析.pdf","paperFile":"雷大大押题卷26【八套完结】/LDD四/LDD押题第4卷（科目一二）-试卷.pdf"},{"name":"科目三四","questions":[{"number":1,"stem":"1989年，我国把重阳节定为老年节。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。九九重阳，又与“久久”谐音，有祝愿长久长寿的含义。1989年，我国把重阳节定为老年节，赋予这个传统节日尊老、爱老、敬老、助老的全新内涵。","type":"判断题"},{"number":2,"stem":"南昌起义标志着中国共产党独立领导革命战争、创建人民军队的开端。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1927年 8 月 1 日，在以周恩来为书记的中共中央前敌委员会领导下，贺龙、叶挺、朱德、刘伯承等率领军队 2万多人，举行南昌起义。南昌起义在以周恩来为书记的中共中央前敌委员会领导下举行，标志着中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端，开启了中国革命新纪元。","type":"判断题"},{"number":3,"stem":"明朝李时珍所著《本草纲目》是集中国古代药物学大成的巨著，被誉为“东方药学巨典”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。明朝李时珍著《本草纲目》，全书 190余万字，共记载药物 1892 种，收集药方 11096 个，绘制插图 1160幅，是集中国古代药物学大成的巨著，被誉为“东方药学巨典”。","type":"判断题"},{"number":4,"stem":"“小李杜”指晚唐诗人杜牧和李商隐。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。杜牧擅长七绝，李商隐工于七律，后世将二人合称为“小李杜”。杜牧擅长七绝，李商隐工于七律。","type":"判断题"},{"number":5,"stem":"贵州茅台酒是浓香型白酒的典型代表。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。贵州茅台酒是酱香型（不是浓香型）白酒的典型代表；泸州老窖特曲、五粮液酒为浓香型酒的代表。","type":"判断题"},{"number":6,"stem":"五四运动是近代中国革命史上具有划时代意义的事件，标志着新民主主义革命的伟大开端。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。五四运动标志着新民主主义革命的伟大开端，孕育了以爱国、进步、民主、科学为主要内容的伟大五四精神，其核心是爱国主义精神。五四运动孕育了以爱国、进步、民主、科学为主要内容的伟大五四精神，其核心是爱国主义精神。","type":"判断题"},{"number":7,"stem":"李大钊发表的《我的马克思主义观》，标志着马克思主义在中国进入比较系统的传播阶段。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。李大钊发表的《我的马克思主义观》，系统介绍了马克思主义理论，在当时思想界产生重大影响，标志着马克思主义在中国进入比较系统的传播阶段。李大钊是在中国举起十月革命旗帜的第一人，是中国最早的马克思主义传播者。","type":"判断题"},{"number":8,"stem":"兰花、巨猿、蝴蝶被誉为马来西亚的三大珍宝。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。兰花、巨猿、蝴蝶被誉为马来西亚“三大珍宝”。马来西亚是亚洲新兴的工业国之一，天然橡胶、棕榈油和胡椒的产量与出口量居世界前列，曾是世界产锡大国。吉隆坡有“世界锡都、胶都”之美誉。","type":"判断题"},{"number":9,"stem":"什叶派是伊斯兰教中人数最多的一派，中国穆斯林大多属于什叶派。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。本题说法错误。伊斯兰教中人数最多的是逊尼派（不是什叶派），中国穆斯林大多属于逊尼派；什叶派人数较少，中国新疆塔吉克族穆斯林属于什叶派。","type":"判断题"},{"number":10,"stem":"中国共产党历史上的两个伟大转折点是八七会议和党的十一届三中全会。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。本题说法错误。遵义会议是党的历史上一个生死攸关的转折点；党的十一届三中全会实现了新中国成立以来党的历史上具有深远意义的伟大转折。","type":"判断题"},{"number":11,"stem":"目前我国已经成立的民族自治地方共 155个，包括 5 个自治区、30 个自治州和 120 个自治县（旗）。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。目前已经成立的民族自治地方共 155 个，包括内蒙古自治区、广西壮族自治区、西藏自治区、宁夏回族自治区、新疆维吾尔自治区共 5个自治区，在吉林、湖北、湖南、四川、贵州、云南、甘肃、青海、新疆等 9省区共设立 30 个自治州，在河北、内蒙古、辽宁、吉林、黑龙江、浙江、湖北、湖南、广东、广西、海南、重庆、四川、贵州、云南、甘肃、青海、新疆等 18省（区市）共设立 120个自治县（旗）。","type":"判断题"},{"number":12,"stem":"乌龙茶属于全发酵茶。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。乌龙茶（青茶）属半发酵茶（不是全发酵茶），介于红茶与绿茶之间；红茶才是全发酵茶。","type":"判断题"},{"number":13,"stem":"苏州宝带桥建于隋开皇年间，是我国孔数最多的联拱石桥。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。苏州宝带桥建于唐代（不是隋开皇年间），是我国孔数最多的联拱石桥，长 318米，宽 4.1米，共 53 个孔；建于隋代的是赵州桥。","type":"判断题"},{"number":14,"stem":"甲骨文是刻写在龟甲和牛肩胛骨上的文字，主要发现于商朝殷墟遗址。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。甲骨文是商周官府占卜用的原始档案，安阳殷墟发现的甲骨片超过15万片，发现单字 4000多个，是一种非常成熟的文字。甲骨文是商周官府占卜用的原始档案，对于商周历史和文字学研究意义重大。","type":"判断题"},{"number":15,"stem":"道教形成于西汉时期。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。道教是土生土长的中国宗教，形成于东汉时期。道教奉道家学派创始人老子为祖师爷。","type":"判断题"},{"number":16,"stem":"桂林山水属于丹霞地貌。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。桂林山水属于喀斯特（岩溶）地貌（不是丹霞地貌），漓江两岸是世界上规模最大、风景最优美的亚热带岩溶风景区，自古享有“桂林山水甲天下”之誉。","type":"判断题"},{"number":17,"stem":"叠山置石中，黄石用于假山的基础部分称“收顶”，太湖石置于假山上部称“叠脚”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。黄石质地坚硬，用于假山的基础部分，称叠脚；太湖石具有皱、瘦、漏、透四大特点，置于假山上部，称收顶。太湖石具有皱、瘦、漏、透四大特点，置于假山上部供游人玩赏品味。","type":"判断题"},{"number":18,"stem":"金沙江下游梯级水电开发工程建成了三峡、葛洲坝、乌东德、白鹤滩四座梯级水电站。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。金沙江下游梯级水电开发工程共建成乌东德、白鹤滩、溪洛渡、向家坝四座梯级水电站（不含三峡、葛洲坝），总装机容量相当于两个三峡工程，是我国西电东送项目的重要支撑。","type":"判断题"},{"number":19,"stem":"鲁菜的口味以麻辣著称。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。鲁菜讲究调味醇正，口味偏于咸鲜（不是麻辣），以麻辣著称的是川菜；鲁菜烹调技法以爆、扒见长。","type":"判断题"},{"number":20,"stem":"泰姬陵由莫卧儿王朝皇帝阿克巴为死去的妃子泰姬·玛哈尔建造，是印度的标志。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。泰姬陵由莫卧儿王朝皇帝沙贾汗（不是阿克巴）为死去的妃子泰姬·玛哈尔建造，是世界七大奇迹之一，成为印度的标志。","type":"判断题"},{"number":21,"stem":"北京故宫宫殿区以三大殿为中心，占地面积约 15万平方米，有大小宫殿 70多座。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，题干混淆了“占地面积”与“建筑面积”。北京故宫宫殿区以三大殿为中心，占地面积约 72万平方米，建筑面积约 15万平方米，有大小宫殿 70多座、房屋 9000余间。","type":"判断题"},{"number":22,"stem":"兰州中山铁桥是第一座横跨黄河的铁桥，被称为“天下黄河第一桥”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。沿河而建的兰州水车与荷兰风车齐名；中山铁桥是第一座横跨黄河的铁桥，被称为“天下黄河第一桥”；黄河母亲雕塑已成为黄河文化和中华民族母亲形象的代表，是全国最美的城市雕塑之一。","type":"判断题"},{"number":23,"stem":"位于吐鲁番盆地的艾丁湖低于海平面 154.31米，是中国陆地最低点。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。在大山东部和西部，还有被称为“火洲”的吐鲁番盆地和被誉为“塞外江南”的伊犁谷地。位于吐鲁番盆地的艾丁湖，低于海平面 154.31 米，是中国陆地最低点。","type":"判断题"},{"number":24,"stem":"泥人张彩塑创始于清代乾隆年间，是天津艺人张明山创造的彩绘泥塑艺术品。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。“乾隆年间”应改为“道光年间”。泥人张彩塑被公认为天津一绝，创始于清代道光年间，是天津艺人张明山于 19 世纪中叶创造的彩绘泥塑艺术品。","type":"判断题"},{"number":25,"stem":"清东陵中被称为“清陵之冠”的是裕陵地宫。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。“裕陵地宫”应改为“慈禧陵”。清东陵已开放 10座陵寝，有清代最长的神道——孝陵神道（长达 6 千米）、清代规模最大的石像生——孝陵石像生（18 对）；有目前国内唯一被誉为地下佛堂和石雕宝库的裕陵地宫和号称清陵之冠的慈禧陵。","type":"判断题"},{"number":26,"stem":"宁夏是我国最大的回族聚居区。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。宁夏是我国最大的回族聚居区，回族人口为 262.6万；回族以农业经济为主，以善于经商而著称。","type":"判断题"},{"number":27,"stem":"宁夏贺兰山东麓葡萄酒品牌价值在葡萄酒细分领域中居中国第一、世界第四。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。贺兰山东麓葡萄酒品牌价值在葡萄酒细分领域中居中国第一、世界第四，获国际顶级赛事大奖 1100 多项。","type":"判断题"},{"number":28,"stem":"云南是我国民族种类最多的省份，其中 15 个民族为云南特有。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。云南是我国民族种类最多的省份，全省少数民族人口数约 1563.6万，占全省人口总数的 33.12%。除汉族以外，人口在 6000人以上的世居少数民族有彝族、哈尼族、白族、傣族、壮族、苗族等 25个。其中哈尼族、白族、傣族、族、纳西族、独龙族等 15个民族为云南特有。","type":"判断题"},{"number":29,"stem":"山西运城芮城县西侯度遗址发现的火烧骨，将人类用火的历史追溯至距今约 50 万年前。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“50 万年”应改为“243 万～180 万年”。运城芮城县西侯度遗址发现了火烧骨，将人类最早用火的时间追溯到了距今约 243万～180万年前。","type":"判断题"},{"number":30,"stem":"“哈尔滨”在达斡尔语中意为“天然牧场”，哈尔滨又名“鹤城”，市鸟为丹顶鹤。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“哈尔滨市”应改为“齐齐哈尔市”。齐齐哈尔达斡尔语意为“天然牧场”，又名鹤城，市鸟为丹顶鹤，获得“亚洲最佳冰球城市”称号。","type":"判断题"},{"number":31,"stem":"吉林省是满族的发源地之一，满族人口居全国首位。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“吉林省”应改为“辽宁省”。辽宁省满族人口占全国满族人口的 50.4%，居全国第 1位；锡伯族人口占全国锡伯族人口的 70.2%，也居全国第 1 位。吉林省是满族的发源地之一。","type":"判断题"},{"number":32,"stem":"吉林省是朝鲜族的主要聚居地，朝鲜族爱穿素白服，注重礼仪，尊老爱幼，能歌善舞。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。吉林省是朝鲜族的主要聚居地，朝鲜族爱穿素白服，注重礼仪，尊老爱幼，能歌善舞。","type":"判断题"},{"number":33,"stem":"海南省简称“琼”，位于中国大陆最南端，南沙群岛的曾母暗沙是我国最南端的领土。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“中国大陆最南端”应改为“中国最南端”。海南省简称琼，位于中国最南端。南沙群岛的曾母暗沙是我国最南端的领土。","type":"判断题"},{"number":34,"stem":"太极拳诞生于明末清初的河南嵩山少林寺。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“河南嵩山少林寺”应改为“河南温县陈家沟”。太极拳诞生于明末清初河南温县陈家沟。","type":"判断题"},{"number":35,"stem":"涪陵榨菜是中国对外出口的三大名菜之一。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。涪陵榨菜也是中国对外出口的三大名菜（榨菜、薇菜、竹笋）之一。","type":"判断题"},{"number":36,"stem":"云南境内泸沽湖畔的纳西族支系摩梭人，至今仍保留着走婚制和母系家庭形式。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。泸沽湖畔云南境内的纳西族支系摩梭人，至今仍保留着走婚制和母系家庭的形式。摩梭人的“阿注婚姻”被民族学家喻为“人类社会家庭婚姻发展史的活化石”。","type":"判断题"},{"number":37,"stem":"云南籍音乐家田汉是中华人民共和国国歌《义勇军进行曲》的作曲者。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，“田汉”应改为“聂耳”。云南籍音乐家聂耳，是中华人民共和国国歌《义勇军进行曲》的作曲者。","type":"判断题"},{"number":38,"stem":"1937年 1 月至 1947年 3月，延安一直是中共中央所在地和陕甘宁边区首府。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。1935 年 9 月 27 日一 1948 年 3 月 23 日，中国共产党在陕北战斗和生活了 13 个春秋；1937 年 1 月至 1947 年 3 月，延安一直是中共中央所在地和陕甘宁边区首府。","type":"判断题"},{"number":39,"stem":"广西壮族自治区简称桂，境内喀斯特地貌广布，发育类型之多世界少见。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。广西壮族自治区简称桂，境内喀斯特地貌广布，集中连片分布于桂西南、桂西北、桂中和桂东北，发育类型之多世界少见。西南与越南接壤，有“广西盆地”之称。","type":"判断题"},{"number":40,"stem":"甘肃取甘州（今张掖）、肃州（今酒泉）二地首字而得名，元代设甘肃省，简称“甘”。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。甘肃取甘州（今张掖）、肃州（今酒泉）二地的首字而成，元代设甘肃省，简称甘。而唐代曾在此设置过陇右道，故又简称“陇”。省会兰州。二、单选题（请将正确答案的字母填在括号内）","type":"判断题"},{"number":41,"stem":"领导东汉黄巾起义、传授太平道的是（）。","options":[{"key":"A","text":"张角"},{"key":"B","text":"张陵"},{"key":"C","text":"王重阳"},{"key":"D","text":"葛洪"}],"answer":"A","keys":["A"],"explanation":"领导东汉黄巾起义的张角传授的为太平道；张陵（又称张道陵、张“天师”）在蜀中鹤鸣山传播五斗米道，太平道和五斗米道即为早期的道教。","type":"单选题"},{"number":42,"stem":"西汉出现农具耕车，唐朝出现轻便省力、适宜深耕的（）。","options":[{"key":"A","text":"简车"},{"key":"B","text":"水排"},{"key":"C","text":"曲辕犁"},{"key":"D","text":"翻车"}],"answer":"C","keys":["C"],"explanation":"西汉农具出现耕车（畜力播种工具）和龙骨水车（灌溉工具），唐朝还出现轻便省力、适宜深耕的曲辕犁。","type":"单选题"},{"number":43,"stem":"抗美援朝纪念日是（）。","options":[{"key":"A","text":"11月 25日"},{"key":"B","text":"10月 1日"},{"key":"C","text":"10月 19日"},{"key":"D","text":"10月 25日"}],"answer":"D","keys":["D"],"explanation":"10 月 25 日，志愿军打响了进入朝鲜后的第一仗，后来，这一天被定为抗美援朝纪念日。","type":"单选题"},{"number":44,"stem":"下列宋代散文名篇与作者对应错误的是（）。","options":[{"key":"A","text":"苏轼《爱莲说》"},{"key":"B","text":"欧阳修《醉翁亭记》"},{"key":"C","text":"王安石《游褒禅山记》"},{"key":"D","text":"范仲淹《岳阳楼记》"}],"answer":"A","keys":["A"],"explanation":"《爱莲说》的作者是周敦颐，不是苏轼。周敦颐《爱莲说》是宋代散文名篇。宋代散文名家还有周敦颐《爱莲说》等。","type":"单选题"},{"number":45,"stem":"汉族饮食以（）为主食。","options":[{"key":"A","text":"牛羊肉"},{"key":"B","text":"水产品"},{"key":"C","text":"乳制品"},{"key":"D","text":"粮食作物"}],"answer":"D","keys":["D"],"explanation":"汉族的饮食结构以粮食作物为主食，以鱼、肉、蔬菜为副食；汉族的饮食文化讲究色、香、味、形、器、意的完美结合，在世界上享有盛誉。","type":"单选题"},{"number":46,"stem":"韩国的国花是（）。","options":[{"key":"A","text":"雏菊"},{"key":"B","text":"樱花"},{"key":"C","text":"木槿花"},{"key":"D","text":"玫瑰"}],"answer":"C","keys":["C"],"explanation":"韩国国旗为太极旗，国花是木槿花；红色和黄色是皇家的颜色，象征着幸福。韩国创造的经济繁荣被称为“汉江奇迹”。","type":"单选题"},{"number":47,"stem":"德国最古老的大学是（）。","options":[{"key":"A","text":"海德堡大学"},{"key":"B","text":"慕尼黑大学"},{"key":"C","text":"法兰克福大学"},{"key":"D","text":"柏林大学"}],"answer":"A","keys":["A"],"explanation":"海德堡大学成立于 1386年，是德国最古老的大学；柏林是德国“最翠绿”的大都市，慕尼黑拥有“欧洲建筑博物馆”之名。","type":"单选题"},{"number":48,"stem":"位于台湾的构造湖是（）。","options":[{"key":"A","text":"鄱阳湖"},{"key":"B","text":"五大连池"},{"key":"C","text":"月牙泉"},{"key":"D","text":"日月潭"}],"answer":"D","keys":["D"],"explanation":"构造湖由地壳运动产生断裂凹陷经储水而成，如滇池、洱海、日月潭；鄱阳湖属河成湖，五大连池属堰塞湖，月牙泉属风成湖。","type":"单选题"},{"number":49,"stem":"首次提出“一个国家，两种制度”构想的时间是（）。","options":[{"key":"A","text":"1978年"},{"key":"B","text":"1982年"},{"key":"C","text":"1997年"},{"key":"D","text":"1999年"}],"answer":"B","keys":["B"],"explanation":"1982年，为解决台湾问题，邓小平首次提出“一个国家，两种制度”构想。","type":"单选题"},{"number":50,"stem":"下列谥号用字中，属于批评类的是（）。","options":[{"key":"A","text":"“武”"},{"key":"B","text":"“厉”"},{"key":"C","text":"“景”"},{"key":"D","text":"“文”"}],"answer":"B","keys":["B"],"explanation":"解析谥号分三类：表扬的如“文”“武”“成”“景”；批评的如“炀”（好内远礼）、“厉”（杀戮无辜）；同情的如短命叫“哀”，遭受国难叫“愍”。批评的谥号如“炀”（好内远礼）、“厉”（杀戮无辜）。","type":"单选题"},{"number":51,"stem":"被誉为“唐画之祖”，其《游春图》为现存最早卷轴画的画家是（）。","options":[{"key":"A","text":"阎立本"},{"key":"B","text":"展子虔"},{"key":"C","text":"吴道子"},{"key":"D","text":"顾恺之"}],"answer":"B","keys":["B"],"explanation":"解析隋朝展子虔既画山水也画人物，被认为是“唐画之祖”，代表作《游春图》是现存最早的卷轴画。隋朝展子虔既画山水也画人物。顾恺之主张“以形写神”，代表作《女史箴图》《洛神赋图》。","type":"单选题"},{"number":52,"stem":"京剧的主要唱腔包括“西皮”和（）两类。","options":[{"key":"A","text":"吹腔"},{"key":"B","text":"二黄"},{"key":"C","text":"高腔"},{"key":"D","text":"昆腔"}],"answer":"B","keys":["B"],"explanation":"京剧主要唱腔是“西皮”与“二黄”两类，主要表演手法是唱、念、做、打，主要角色有生、旦、净、丑。京剧主要表演手法是唱、念、做、打，主要角色有生、旦、生、净、丑，历史上最著名的“京剧四大名旦”是梅兰芳、尚小云、程砚秋、荀慧生。","type":"单选题"},{"number":53,"stem":"龙泉青瓷产品分为两类，其中白胎和朱砂胎青瓷称为（）。","options":[{"key":"A","text":"“哥窑”"},{"key":"B","text":"“弟窑”"},{"key":"C","text":"“官窑”"},{"key":"D","text":"“汝窑”"}],"answer":"B","keys":["B"],"explanation":"龙泉青瓷产品有两种：一种是白胎和朱砂胎青瓷，称“弟窑”；一种是釉面开片的黑胎青瓷，称“哥窑”，哥窑素有“紫口铁足”之称，堪称瓷中珍品。","type":"单选题"},{"number":54,"stem":"中国历史上第一部官定儒经是（）。","options":[{"key":"A","text":"开成石经"},{"key":"B","text":"正始石经"},{"key":"C","text":"三体石经"},{"key":"D","text":"熹平石经"}],"answer":"D","keys":["D"],"explanation":"东汉蔡邕主持刻写熹平石经，置于洛阳太学，成为中国历史上第一部官定的儒经经文。","type":"单选题"},{"number":55,"stem":"官式建筑中规格最高的屋顶形式是（）。","options":[{"key":"A","text":"单檐庑殿顶"},{"key":"B","text":"攒尖顶"},{"key":"C","text":"重檐庑殿顶"},{"key":"D","text":"重檐歇山顶"}],"answer":"C","keys":["C"],"explanation":"解析官式建筑中重檐庑殿顶规格最高，如故宫太和殿；重檐歇山顶等级仅次于重檐庑殿顶。重檐庑殿顶如故宫太和殿。重檐歇山顶等级仅次于重檐庑殿顶，多用于规格很高的殿堂，如故宫保和殿、天安门等。","type":"单选题"},{"number":56,"stem":"园林中供读书用、环境隐蔽清幽的建筑是（）。","options":[{"key":"A","text":"斋"},{"key":"B","text":"舫"},{"key":"C","text":"廊"},{"key":"D","text":"厅堂"}],"answer":"A","keys":["A"],"explanation":"解析斋供读书用，环境当隐蔽清幽；舫是仿造舟船造型的建筑，多设于水际或池中；廊是一条带屋顶的路，既“引”且“观”。","type":"单选题"},{"number":57,"stem":"红军长征胜利结束的时间是（）。","options":[{"key":"A","text":"1934年 10 月"},{"key":"B","text":"1935年 10 月"},{"key":"C","text":"1936年 10 月"}],"answer":"C","keys":["C"],"explanation":"1934 年 10 月至 1936 年 10 月，红军长驱二万五千里，胜利完成震撼世界、彪炳史册的长征。1936 年 10 月 9 日，红四方面军指挥部到达甘肃会宁，与红一方面军会合；22日，红二方面军指挥部到达甘肃隆德将台堡（今属宁夏回族自治区），同红一方面军会合。至此，三大主力红军会师。","type":"单选题"},{"number":58,"stem":"唐代帝王陵墓采用“以山为陵”形式的典型代表是（）。","options":[{"key":"A","text":"唐乾陵"},{"key":"B","text":"宋陵"},{"key":"C","text":"秦始皇陵"},{"key":"D","text":"汉茂陵"}],"answer":"A","keys":["A"],"explanation":"唐代李世民认为平地筑起高坡太劳民伤财，同时为了防止水土流失和盗墓，改为“以山为陵”的形式，唐乾陵即为典型例子；秦始皇陵、汉茂陵取“方上”形式。唐代李世民为防止水土流失和盗墓，改为“以山为陵”。","type":"单选题"},{"number":59,"stem":"北传佛教以大乘佛教为主，其经典主要使用（）。","options":[{"key":"A","text":"汉语"},{"key":"B","text":"藏语"},{"key":"C","text":"巴利语"},{"key":"D","text":"梵语"}],"answer":"A","keys":["A"],"explanation":"解析北传佛教以大乘佛教为主，也包括密乘佛教，其经典主要属于汉语，也称汉语系佛教；南传佛教以小乘佛教（上座部佛教）为主。","type":"单选题"},{"number":60,"stem":"与南方苏州桃花坞年画并称“南桃北柳”的是（）。","options":[{"key":"A","text":"山东潍坊杨家埠年画"},{"key":"B","text":"四川绵竹年画"},{"key":"C","text":"河南朱仙镇年画"},{"key":"D","text":"天津杨柳青年画"}],"answer":"D","keys":["D"],"explanation":"解析天津杨柳青年画有“家家会刻版，人人善丹青”之誉，与苏州桃花坞年画并称“南桃北柳”。天津杨柳青年画有“家家会刻版，人人善丹青”之誉。杨柳青年画有“家家会刻版，人人善丹青”之誉。","type":"单选题"},{"number":61,"stem":"开始采用年号纪年的皇帝是（）。","options":[{"key":"A","text":"汉武帝"},{"key":"B","text":"汉文帝"},{"key":"C","text":"汉景帝"},{"key":"D","text":"汉高祖"}],"answer":"A","keys":["A"],"explanation":"西汉武帝时，开始采用年号纪年，如汉武帝将即位的第一年（公元前 140年）称为建元元年，第二年称为建元二年等。","type":"单选题"},{"number":62,"stem":"宣纸最早产于唐代，有“（）”之说。","options":[{"key":"A","text":"万载存真"},{"key":"B","text":"纸中之王"},{"key":"C","text":"纸寿千年"},{"key":"D","text":"落纸如漆"}],"answer":"C","keys":["C"],"explanation":"宣纸的原料是青檀皮，有“纸寿千年”之说法，分生熟两种。宣纸的原料是青檀皮。宣纸分生熟两种，熟宣经过胶矾浸染，宜于工笔。","type":"单选题"},{"number":63,"stem":"下列属于汉隶代表作的是（）。","options":[{"key":"A","text":"《兰亭集序》"},{"key":"B","text":"《祭侄文稿》"},{"key":"C","text":"《泰山石刻》"},{"key":"D","text":"《石门颂》"}],"answer":"D","keys":["D"],"explanation":"汉隶代表作有东汉《石门颂》《孔宙碑》《衡方碑》《曹全碑》《张迁碑》等；《泰山石刻》是李斯小篆代表作。汉隶代表作还有《孔宙碑》《衡方碑》《曹全碑》《张迁碑》等。","type":"单选题"},{"number":64,"stem":"中国烹饪在夏商周时期出现铜烹，西汉以后出现（）。","options":[{"key":"A","text":"电烹"},{"key":"B","text":"陶烹"},{"key":"C","text":"石烹"},{"key":"D","text":"铁烹"}],"answer":"D","keys":["D"],"explanation":"夏商周时期出现铜烹，西汉以后出现铁烹，发展到现在还出现了能够精准控制火力和时长的电烹技术，烹饪工艺不断改进和完善，形成了富有中国特色的风味体系。","type":"单选题"},{"number":65,"stem":"陕西西凤酒属于（）白酒。","options":[{"key":"A","text":"兼香型"},{"key":"B","text":"米香型"},{"key":"C","text":"酱香型"},{"key":"D","text":"浓香型"}],"answer":"A","keys":["A"],"explanation":"西凤酒以大麦、豌豆制曲，优质高粱为原料，属兼香型白酒；贵州茅台酒是酱香型的典型代表，泸州老窖特曲、五粮液酒为浓香型代表。","type":"单选题"},{"number":66,"stem":"寄畅园是中国（）园林的代表。","options":[{"key":"A","text":"山麓别墅"},{"key":"B","text":"皇家"},{"key":"C","text":"寺院"}],"answer":"A","keys":["A"],"explanation":"寄畅园是中国山麓别墅园林的代表；北京颐和园内的谐趣园、圆明园内的廓然大公均为仿无锡惠山寄畅园而建。寄畅园取王羲之“取次仁智乐，寄畅山水阴”句命名，是中国山麓别墅园林的代表。","type":"单选题"},{"number":67,"stem":"我国著名的花岗岩低山或名丘地貌景区是（）。","options":[{"key":"A","text":"厦门鼓浪屿万石山"},{"key":"B","text":"陕西华山"},{"key":"C","text":"山东泰山"},{"key":"D","text":"安徽黄山"}],"answer":"A","keys":["A"],"explanation":"厦门鼓浪屿万石山、浙江普陀山、海南岛天涯海角等景区属于典型的花岗岩低山或名丘地貌。山东泰山、安徽黄山、陕西华山等为花岗岩高山地貌。鼓浪屿万石山属典型的花岗岩低山或名丘地貌。","type":"单选题"},{"number":68,"stem":"山顶洞人习惯在墓葬周边撒赤铁矿粉，说明他们（）。","options":[{"key":"A","text":"已经开始种植水稻"},{"key":"B","text":"已经会种植粟"},{"key":"C","text":"已经有灵魂不死的意识"},{"key":"D","text":"已经会烧制彩陶"}],"answer":"C","keys":["C"],"explanation":"山顶洞人习惯在墓葬周边撒赤铁矿粉，说明他们已经有灵魂不死的意识，代表着原始宗教信仰开始萌芽。山顶洞人代表着原始宗教信仰开始萌芽。山顶洞人已经掌握人工取火技术，会使用骨针缝制皮衣。","type":"单选题"},{"number":69,"stem":"历代修筑的长城中，规模最大的是（）。","options":[{"key":"A","text":"明长城"},{"key":"B","text":"楚方城"},{"key":"C","text":"秦长城"},{"key":"D","text":"汉长城"}],"answer":"D","keys":["D"],"explanation":"汉长城规模最大，东起辽东，西迄蒲昌海（今新疆罗布泊），长 1万千米；秦始皇统一六国后，以秦、赵、燕三国的北方长城为基础修缮增筑。秦始皇统一六国后，以秦、赵、燕三国的北方长城为基础，修缮增筑长城。","type":"单选题"},{"number":70,"stem":"欧洲地势最高的首都是（）。","options":[{"key":"A","text":"马德里"},{"key":"B","text":"伯尔尼"},{"key":"C","text":"伦敦"},{"key":"D","text":"巴黎"}],"answer":"A","keys":["A"],"explanation":"马德里是西班牙首都，欧洲地势最高的首都。西班牙还有“太阳王国”之称。西班牙民风奔放热情，以斗牛、弗拉门戈舞蹈、吉他而闻名。","type":"单选题"},{"number":71,"stem":"被称为最具吸引力旅游资源的“3S”，指的是阳光、沙滩和（）。","options":[{"key":"A","text":"海风"},{"key":"B","text":"海水"},{"key":"C","text":"沙雕"},{"key":"D","text":"浪花"}],"answer":"B","keys":["B"],"explanation":"阳光、沙滩、海水（3S）被称为最具吸引力的旅游资源。阳光、沙滩、海水被称为最具吸引力的旅游资源。","type":"单选题"},{"number":72,"stem":"“中国白”也成为（）白瓷的代名词。","options":[{"key":"A","text":"河北唐山"},{"key":"B","text":"景德镇"},{"key":"C","text":"福建德化"},{"key":"D","text":"浙江龙泉"}],"answer":"C","keys":["C"],"explanation":"福建德化是我国白瓷著名产地。“中国白”也成为德化白瓷的代名词。德化窑是古代南方著名瓷窑。","type":"单选题"},{"number":73,"stem":"1964年 10月 16日，我国成功爆炸了第一颗（）。","options":[{"key":"A","text":"导弹"},{"key":"B","text":"人造卫星"},{"key":"C","text":"氢弹"},{"key":"D","text":"原子弹"}],"answer":"D","keys":["D"],"explanation":"1964 年 10月 16 日成功爆炸我国第一颗原子弹；1967年 6 月 17 日，我国第一颗氢弹空爆试验成功。1966年 10 月 27 日，我国自行研制的东风二号核导弹试爆成功，标志着“两弹”成功结合，中国有了可用于实战的核导弹。","type":"单选题"},{"number":74,"stem":"世界上最大、最长的珊瑚礁群是（）。","options":[{"key":"A","text":"大堡礁"},{"key":"B","text":"马尔代夫珊瑚礁"},{"key":"C","text":"伯利兹珊瑚礁"},{"key":"D","text":"红海珊瑚礁"}],"answer":"A","keys":["A"],"explanation":"大堡礁是世界上最大、最长的珊瑚礁群，1981 年被列入《世界自然遗产名录》，纵贯澳大利亚的东北沿海，被誉为“透明清澈的海中野生王国”。","type":"单选题"},{"number":75,"stem":"桂林三花酒是（）白酒的代表。","options":[{"key":"A","text":"浓香型"},{"key":"B","text":"米香型"},{"key":"C","text":"清香型"},{"key":"D","text":"酱香型"}],"answer":"B","keys":["B"],"explanation":"桂林三花酒是米香型白酒的代表。泸州老窖特曲、五粮液酒为浓香型酒的代表；清香型白酒代表品牌是山西汾酒，产自山西汾阳杏花村。桂林三花酒是米香型白酒的代表。","type":"单选题"},{"number":76,"stem":"以燕窝和鱼翅的烹制最为有名的官府菜是（）。","options":[{"key":"A","text":"宫廷菜"},{"key":"B","text":"孔府菜"},{"key":"C","text":"谭家菜"},{"key":"D","text":"随园菜"}],"answer":"C","keys":["C"],"explanation":"谭家菜代表名菜有清汤燕窝、黄焖鱼翅、红烧鲍鱼、扒大乌参、草菇蒸鸡等。谭家菜在烹调中讲求糖盐各半，以甜提鲜、以咸提香。","type":"单选题"},{"number":77,"stem":"1949年中国人民政治协商会议第一届全体会议决定以（）为代国歌。","options":[{"key":"A","text":"《黄河大合唱》"},{"key":"B","text":"《义勇军进行曲》"},{"key":"C","text":"《歌唱祖国》"},{"key":"D","text":"《没有共产党就没有新中国》"}],"answer":"B","keys":["B"],"explanation":"会议决定采用公元纪年，以《义勇军进行曲》为代国歌，国旗为五星红旗。会议还决定采用公元纪年，国旗为五星红旗，北平改名为北京。","type":"单选题"},{"number":78,"stem":"长江三峡自西向东依次是（）。","options":[{"key":"A","text":"西陵峡、巫峡、瞿塘峡"},{"key":"B","text":"瞿塘峡、西陵峡、巫峡"},{"key":"C","text":"瞿塘峡、巫峡、西陵峡"},{"key":"D","text":"巫峡、瞿塘峡、西陵峡"}],"answer":"C","keys":["C"],"explanation":"长江三峡西起重庆市奉节白帝城，东止湖北宜昌南津关，全长 200余千米，自西向东分别是瞿塘峡、巫峡、西陵峡。瞿塘峡是三峡中最短的一个，长 8千米，以雄伟险峻著称，有“夔门天下雄”之称。","type":"单选题"},{"number":79,"stem":"标志着我国古代数学体系基本形成的是东汉时期的（）。","options":[{"key":"A","text":"《周牌算经》"},{"key":"B","text":"《九章算术》"},{"key":"C","text":"《甘石星经》"},{"key":"D","text":"《梦溪笔谈》"}],"answer":"B","keys":["B"],"explanation":"解析东汉时期的《九章算术》，提出了负数概念及正负数运算法则，标志着我国古代数学体系基本形成。《九章算术》提出了负数概念及正负数运算法则；西汉《周牌算经》是我国最早的数学著作，提出了勾股定理。","type":"单选题"},{"number":80,"stem":"中国的四大高原是（）。","options":[{"key":"A","text":"青藏高原、内蒙古高原、黄土高原、云贵高原"},{"key":"B","text":"青藏高原、内蒙古高原、黄土高原、帕米尔高原"},{"key":"C","text":"青藏高原、内蒙古高原、云贵高原、帕米尔高原"},{"key":"D","text":"青藏高原、黄土高原、云贵高原、帕米尔高原"}],"answer":"A","keys":["A"],"explanation":"四大高原为青藏高原、内蒙古高原、黄土高原、云贵高原。","type":"单选题"},{"number":81,"stem":"南非的三个首都是（）。","options":[{"key":"A","text":"茨瓦内、布隆方丹、约翰内斯堡"},{"key":"B","text":"茨瓦内、布隆方丹、开普敦"},{"key":"C","text":"布隆方丹、开普敦、约翰内斯堡"},{"key":"D","text":"茨瓦内、开普敦、约翰内斯堡"}],"answer":"B","keys":["B"],"explanation":"南非是世界上唯一拥有三个首都的国家：行政首都是茨瓦内（原名比勒陀利亚），司法首都为布隆方丹，立法首都为开普敦。","type":"单选题"},{"number":82,"stem":"下列不属于“建安七子”的是（）。","options":[{"key":"A","text":"孔融"},{"key":"B","text":"陈琳"},{"key":"C","text":"王粲"},{"key":"D","text":"曹植"}],"answer":"D","keys":["D"],"explanation":"建安文学中的重要作家有“曹氏父子”（曹操、曹丕、曹植）和“建安七子”（孔融、陈琳、王粲、徐干、阮瑀、应玚、刘桢）。","type":"单选题"},{"number":83,"stem":"“江南三大奇石”包括（）。","options":[{"key":"A","text":"玉玲珑、冠云峰、四季假山"},{"key":"B","text":"冠云峰、结云峰、环秀山庄假山"},{"key":"C","text":"玉玲珑、冠云峰、结云峰"},{"key":"D","text":"玉玲珑、结云峰、环秀山庄假山"}],"answer":"C","keys":["C"],"explanation":"被称为“江南三大奇石”的上海豫园的玉玲珑、苏州留园的冠云峰、杭州竹素园的结云峰，都是假山中的佼佼者。","type":"单选题"},{"number":84,"stem":"泰国三大国宝是（）。","options":[{"key":"A","text":"玉佛寺、卧佛寺、金佛寺"},{"key":"B","text":"玉佛寺、卧佛寺、郑王庙"},{"key":"C","text":"卧佛寺、金佛寺、四面佛"},{"key":"D","text":"玉佛寺、金佛寺、四面佛"}],"answer":"A","keys":["A"],"explanation":"玉佛寺、卧佛寺、金佛寺被称为泰国三大国宝，其中玉佛寺是泰国唯一没有和尚居住的佛寺。","type":"单选题"},{"number":85,"stem":"我国四大卫星发射中心（场）是（）。","options":[{"key":"A","text":"酒泉、太原、西昌、乌鲁木齐"},{"key":"B","text":"酒泉、太原、西昌、文昌"},{"key":"C","text":"酒泉、太原、文昌、乌鲁木齐"},{"key":"D","text":"太原、西昌、文昌、乌鲁木齐"}],"answer":"B","keys":["B"],"explanation":"1970年我国发射第一颗人造地球卫星后，目前已建成甘肃酒泉卫星发射中心、山西太原卫星发射中心、四川西昌卫星发射中心和海南文昌卫星发射场。","type":"单选题"},{"number":86,"stem":"帝王陵地面建筑的三部分是（）。","options":[{"key":"A","text":"祭祀建筑区、神道、地宫"},{"key":"B","text":"神道、护陵监、宝城"},{"key":"C","text":"祭祀建筑区、地宫、宝城"},{"key":"D","text":"祭祀建筑区、神道、护陵监"}],"answer":"D","keys":["D"],"explanation":"帝王陵的地面建筑主要有三部分：祭祀建筑区、神道、护陵监。","type":"单选题"},{"number":87,"stem":"下列属于上海本帮菜经典菜肴的是（）。","options":[{"key":"A","text":"佛跳墙"},{"key":"B","text":"白切鸡"},{"key":"C","text":"剁椒鱼头"},{"key":"D","text":"黄焖栗子鸡"}],"answer":"D","keys":["D"],"explanation":"上海本帮菜即沪菜，核心特色为淡油赤酱、咸中带甜、油而不腻，经典菜肴有响油鳝糊、黄焖栗子鸡等。A 项佛跳墙是闽菜，B 项白切鸡是粤菜，C 项剁椒鱼头是湘菜，均易误选。","type":"单选题"},{"number":88,"stem":"2021年首次举办的中国首个海边戏剧节是（）。","options":[{"key":"A","text":"阿那亚戏剧节"},{"key":"B","text":"乌镇戏剧节"},{"key":"C","text":"大凉山戏剧节"},{"key":"D","text":"南京戏剧节"}],"answer":"A","keys":["A"],"explanation":"河北还于 2021 年首次举办阿那亚戏剧节，这是中国首个海边戏剧节；2023 年廊坊《只有红楼梦·戏剧幻城》首次开放，是国内首个以《红楼梦》为主题的大型戏剧群落。","type":"单选题"},{"number":89,"stem":"以“沙子会唱歌”而闻名、被称为“响沙之王”的 5A级景区是（）。","options":[{"key":"A","text":"沙坡头"},{"key":"B","text":"鸣沙山"},{"key":"C","text":"库布齐"},{"key":"D","text":"响沙湾"}],"answer":"D","keys":["D"],"explanation":"在鄂尔多斯库布齐沙漠中，以沙子会唱歌而闻名的 5A级景区响沙滩被称为“响沙之王”，只要踩踏或滑行它就会发出嗡嗡响声。A 项沙坡头在宁夏中卫（中国四大响沙之一），B项鸣沙山在甘肃敦煌，易误选。","type":"单选题"},{"number":90,"stem":"有“草原敦煌”美称的是（）。","options":[{"key":"A","text":"云冈石窟"},{"key":"B","text":"阿尔寨石窟"},{"key":"C","text":"龙门石窟"},{"key":"D","text":"莫高窟"}],"answer":"B","keys":["B"],"explanation":"阿尔寨石窟有“草原敦煌”的美称。","type":"单选题"},{"number":91,"stem":"下列文化中，被认为是中国早期国家形态的重要代表、印证中华文明悠久历史的是（）。","options":[{"key":"A","text":"仰韶文化"},{"key":"B","text":"红山文化"},{"key":"C","text":"龙山文化"},{"key":"D","text":"良渚文化"}],"answer":"D","keys":["D"],"explanation":"良渚文化是中国早期国家形态的重要代表，良渚古城遗址被认为是 5000年前的区域性权力中心，印证了中华文明 5000年的历史。","type":"单选题"},{"number":92,"stem":"“京味文学”的代表人物是（）。","options":[{"key":"A","text":"茅盾"},{"key":"B","text":"巴金"},{"key":"C","text":"曹禺"},{"key":"D","text":"老舍"}],"answer":"D","keys":["D"],"explanation":"“京味文学”是北京最具特色的文化现象。老舍是京味文学的代表，他留下的《骆驼祥子》《四世同堂》《茶馆》《龙须沟》等作品至今影响深远。","type":"单选题"},{"number":93,"stem":"瘦西湖是（）的标志性文旅名片，素有“园林之盛，甲于天下”之誉。","options":[{"key":"A","text":"苏州"},{"key":"B","text":"扬州"},{"key":"C","text":"无锡"},{"key":"D","text":"镇江"}],"answer":"B","keys":["B"],"explanation":"瘦西湖是扬州的标志性文旅名片，五亭桥是瘦西湖的地标，二十四桥则因古诗意境而闻名。","type":"单选题"},{"number":94,"stem":"享誉世界的民歌《茉莉花》根植于（）。","options":[{"key":"A","text":"浙江"},{"key":"B","text":"福建"},{"key":"C","text":"江苏"},{"key":"D","text":"湖南"}],"answer":"C","keys":["C"],"explanation":"享誉世界的《茉莉花》根植江苏，融合江南温婉气韵，成为江苏民歌乃至中国民间音乐的经典名片。","type":"单选题"},{"number":95,"stem":"“元曲四大家”之一、散曲代表作是《天净沙·秋思》的北京文化名人是（）。","options":[{"key":"A","text":"关汉卿"},{"key":"B","text":"马致远"},{"key":"C","text":"王实甫"},{"key":"D","text":"白朴"}],"answer":"B","keys":["B"],"explanation":"北京文化名人马致远是“元曲四大家”之一，其散曲代表作是《天净沙·秋思》，杂剧代表作是《汉宫秋》。","type":"单选题"},{"number":96,"stem":"被誉为“全球首部皇家文化主题大型户外实景演出”的是（）。","options":[{"key":"A","text":"《鼎盛王朝·康熙大典》"},{"key":"B","text":"《大宋·东京梦华》"},{"key":"C","text":"《长恨歌》"},{"key":"D","text":"《印象·刘三姐》"}],"answer":"A","keys":["A"],"explanation":"《鼎盛王朝·康熙大典》被誉为“全球首部皇家文化主题大型户外实景演出”。B 项在河南开封，C项在陕西西安，D 项在广西桂林，均为跨省易混演艺项目。","type":"单选题"},{"number":97,"stem":"作为中国“洋家乐”发源地，利用乡村闲置资源发展文化旅游的浙江名镇是（）。","options":[{"key":"A","text":"莫干山镇"},{"key":"B","text":"乌镇"},{"key":"C","text":"南浔镇"},{"key":"D","text":"西塘镇"}],"answer":"A","keys":["A"],"explanation":"莫干山镇作为中国“洋家乐”发源地，利用乡村闲置资源发展文化旅游。","type":"单选题"},{"number":98,"stem":"堪称“草原之舟”的蒙古族特有交通工具是（）。","options":[{"key":"A","text":"雪橇"},{"key":"B","text":"马车"},{"key":"C","text":"驼队"},{"key":"D","text":"勒勒车"}],"answer":"D","keys":["D"],"explanation":"勒勒车是蒙古族特有的牛车，堪称“草原之舟”。“沙漠之舟”指骆驼，注意区分。","type":"单选题"},{"number":99,"stem":"被誉为“奇秀甲于东南”的上海园林是（）。","options":[{"key":"A","text":"豫园"},{"key":"B","text":"古猗园"},{"key":"C","text":"秋霞圃"},{"key":"D","text":"曲水园"}],"answer":"A","keys":["A"],"explanation":"豫园其名体现“豫悦老亲”之意，被誉为“奇秀甲于东南”“东南名园冠”等。","type":"单选题"},{"number":100,"stem":"呼和浩特简称“呼市”，旧称“归绥市”，其名称意为（）。","options":[{"key":"A","text":"“金色的城”"},{"key":"B","text":"“神圣的城”"},{"key":"C","text":"“青色的城”"},{"key":"D","text":"“美丽的城”"}],"answer":"C","keys":["C"],"explanation":"呼和浩特简称“呼市”，旧称“归绥市”，意为“青色的城”，是“中国乳都”，以奶制品和草原风味著称。","type":"单选题"},{"number":101,"stem":"江苏花果山景区有（）的美誉。","options":[{"key":"A","text":"“天下第一奇山”"},{"key":"B","text":"“海天佛国”"},{"key":"C","text":"“东南第一山”"},{"key":"D","text":"“东海第一胜境”"}],"answer":"D","keys":["D"],"explanation":"花果山景区有“东海第一胜境”美誉。A 项是黄山（安徽）的常见誉称，B项是普陀山（浙江），C 项是雁荡山（浙江），均易误选。","type":"单选题"},{"number":102,"stem":"江苏平原面积占陆地面积的（）。","options":[{"key":"A","text":"68.8%"},{"key":"B","text":"86.90%"},{"key":"C","text":"80.1%"},{"key":"D","text":"92.5%"}],"answer":"B","keys":["B"],"explanation":"江苏省地形以平原为主，平原面积占陆地面积的 86.90%。C 项 80.1%是山西山地丘陵面积占比，易误选。","type":"单选题"},{"number":103,"stem":"被联合国旅游组织授予“世界冰雪旅游卓越城市”称号的是（）。","options":[{"key":"A","text":"长春市"},{"key":"B","text":"吉林市"},{"key":"C","text":"哈尔滨市"},{"key":"D","text":"沈阳市"}],"answer":"C","keys":["C"],"explanation":"联合国旅游组织授予哈尔滨市“世界冰雪旅游卓越城市”称号。哈尔滨素有“冰城”“东方莫斯科”“东方小巴黎”之美称，是享誉中外的冰雪艺术之都。","type":"单选题"},{"number":104,"stem":"素有“北门锁钥”之称的是（）。","options":[{"key":"A","text":"慕田峪长城"},{"key":"B","text":"司马台长城"},{"key":"C","text":"居庸关长城"},{"key":"D","text":"八达岭长城"}],"answer":"D","keys":["D"],"explanation":"八达岭长城素有“北门锁钥”之称。点评：常见考法是把“八达岭”偷换成“慕田峪”。","type":"单选题"},{"number":105,"stem":"盛京三陵中，安葬清太祖努尔哈赤的陵墓是（）。","options":[{"key":"A","text":"清永陵"},{"key":"B","text":"清昭陵"},{"key":"C","text":"清孝陵"},{"key":"D","text":"清福陵"}],"answer":"D","keys":["D"],"explanation":"清永陵葬努尔哈赤以上四代父祖、福陵葬努尔哈赤、昭陵葬皇太极，合称盛京三陵。清福陵是清太祖努尔哈赤和孝慈高皇后叶赫那拉氏的陵墓。","type":"单选题"},{"number":106,"stem":"以刀刻染色工艺为核心，被誉为“中华民间艺术一绝”的山西剪纸是（）。","options":[{"key":"A","text":"蔚县剪纸"},{"key":"B","text":"陕北剪纸"},{"key":"C","text":"广灵剪纸"},{"key":"D","text":"扬州剪纸"}],"answer":"C","keys":["C"],"explanation":"广灵剪纸以刀刻染色工艺为核心，构图生动、用料考究，被誉为“中华民间艺术一绝”。闻喜花馍将面食做到了极致。","type":"单选题"},{"number":107,"stem":"2014年 11月 19日，浙江（）成为世界互联网大会永久会址。","options":[{"key":"A","text":"西塘"},{"key":"B","text":"乌镇"},{"key":"C","text":"南浔"},{"key":"D","text":"周庄"}],"answer":"B","keys":["B"],"explanation":"乌镇素有“中国最后的枕水人家”之誉，拥有 7000多年文明史和 1300年建镇史，2014年 11月 19日成为世界互联网大会永久会址。D项周庄在江苏，易误选。","type":"单选题"},{"number":108,"stem":"辽宁全省地形概貌大致是（）。","options":[{"key":"A","text":"“七山一水二分田”"},{"key":"B","text":"“五山一水一草三分田”"},{"key":"C","text":"“八山一水一分田”"},{"key":"D","text":"“六山一水三分田”"}],"answer":"D","keys":["D"],"explanation":"辽宁全省地形概貌大致是“六山一水三分田”，山地丘陵约占全省国土总面积的 60%，地势呈马蹄形向渤海倾斜。A 项“七山一水二分田”是浙江，B项“五山一水一草三分田”是黑龙江，C 项“八山一水一分田”是福建和贵州的概貌表述，易误选。","type":"单选题"},{"number":109,"stem":"以“铁人”著称的大庆精神核心人物是（）。","options":[{"key":"A","text":"王进喜"},{"key":"B","text":"雷锋"},{"key":"C","text":"焦裕禄"},{"key":"D","text":"孔繁森"}],"answer":"A","keys":["A"],"explanation":"以铁人王进喜为代表的大庆精神，是中华民族精神的重要组成部分。","type":"单选题"},{"number":110,"stem":"被誉为“中华文明的曙光”、位于安徽含山县的遗址是（）。","options":[{"key":"A","text":"双墩遗址"},{"key":"B","text":"凌家滩遗址"},{"key":"C","text":"贾湖遗址"},{"key":"D","text":"屈家岭遗址"}],"answer":"B","keys":["B"],"explanation":"位于含山县的凌家滩遗址，被誉为“中华文明的曙光”。蚌埠双墩遗址距今约 7000年，是目前淮河中游地区发现的最早、保存最完整的新石器时代文化遗址。","type":"单选题"},{"number":111,"stem":"上海市的平均海拔是（）。","options":[{"key":"A","text":"43.5米"},{"key":"B","text":"50米以下"},{"key":"C","text":"100米左右"},{"key":"D","text":"4 米左右"}],"answer":"D","keys":["D"],"explanation":"上海平均海拔 4 米左右。A项 43.5米是北京平均海拔，易误选。","type":"单选题"},{"number":112,"stem":"中国民间武术有 129个拳种，其中发源于河北省的有（）。","options":[{"key":"A","text":"36个"},{"key":"B","text":"42个"},{"key":"C","text":"52个"},{"key":"D","text":"65个"}],"answer":"C","keys":["C"],"explanation":"中国有民间武术 129个拳种，其中 52 个发源于河北省。现存规模和影响较大的有沧州的八极拳、邯郸永年的太极拳、廊坊的八卦掌等。","type":"单选题"},{"number":113,"stem":"国内仅存的三座唐代木构建筑中，位于五台山的是（）。","options":[{"key":"A","text":"佛光寺东大殿、南禅寺大佛殿"},{"key":"B","text":"佛光寺东大殿、晋祠圣母殿"},{"key":"C","text":"南禅寺大佛殿、永乐宫三清殿"},{"key":"D","text":"晋祠圣母殿、华严寺大雄宝殿"}],"answer":"A","keys":["A"],"explanation":"佛光寺东大殿和南禅寺大佛殿是国内仅存三座唐代木构建筑的杰出之作，为研究唐代建筑提供了极为珍贵的实物资料。","type":"单选题"},{"number":114,"stem":"天津素有（）之称。","options":[{"key":"A","text":"“九河下梢” “河海要冲”"},{"key":"B","text":"“九省通衢” “江汉汇流”"},{"key":"C","text":"“塞上江南” “鱼米之乡”"},{"key":"D","text":"“六朝古都” “十朝都会”"}],"answer":"A","keys":["A"],"explanation":"天津素有“九河下梢”“河海要冲”之称，是中国北方最大的港口城市。“九省通衢”指武汉（湖北），“塞上江南”指宁夏，“六朝古都”指南京（江苏），均易误选。","type":"单选题"},{"number":115,"stem":"被称为“东方城堡”、融祠、家、堡为一体的封闭式客家建筑是（）。","options":[{"key":"A","text":"福建土楼"},{"key":"B","text":"开平碉楼"},{"key":"C","text":"客家围屋"},{"key":"D","text":"吊脚楼"}],"answer":"C","keys":["C"],"explanation":"客家围屋又被称为“东方城堡”，是一种融祠、家、堡为一体，具有鲜明防卫特征的封闭式客家建筑。A项福建土楼是客家聚族而居的传统民居，B 项开平碉楼在广东，易误选。","type":"单选题"},{"number":116,"stem":"被誉为“世界水电之都”的湖北城市是（）。","options":[{"key":"A","text":"宜昌"},{"key":"B","text":"襄阳"},{"key":"C","text":"荆州"},{"key":"D","text":"十堰"}],"answer":"A","keys":["A"],"explanation":"宜昌素有“三峡门户”“川鄂咽喉”之称，古称“夷陵”，被誉为“世界水电之都”，是屈原、王昭君的故里。","type":"单选题"},{"number":117,"stem":"按照《粤港澳大湾区发展规划纲要》，粤港澳大湾区的四大中心城市是（）。","options":[{"key":"A","text":"香港、澳门、珠海、东莞"},{"key":"B","text":"香港、澳门、广州、深圳"},{"key":"C","text":"广州、深圳、珠海、佛山"},{"key":"D","text":"香港、广州、深圳、东莞"}],"answer":"B","keys":["B"],"explanation":"2019 年 2 月 18 日《粤港澳大湾区发展规划纲要》印发，以香港、澳门、广州、深圳四大中心城市作为区域发展的核心引擎。","type":"单选题"},{"number":118,"stem":"安徽地跨中国南北气候分界线（），呈现暖温带向亚热带过渡的气候特征。","options":[{"key":"A","text":"秦岭"},{"key":"B","text":"长江"},{"key":"C","text":"淮河"},{"key":"D","text":"新安江"}],"answer":"C","keys":["C"],"explanation":"安徽地跨中国南北气候分界线淮河，呈现暖温带向亚热带过渡的气候特征；长江、淮河横贯东西，将全省分为淮北平原、江淮丘陵、皖南山区三大自然区域。","type":"单选题"},{"number":119,"stem":"鲁菜是中国四大菜系之一，发源于山东，其三大系列是（）。","options":[{"key":"A","text":"济南菜、博山菜、孔府菜"},{"key":"B","text":"孔府菜、胶东菜、运河菜"},{"key":"C","text":"济南菜、孔府菜、胶东菜"},{"key":"D","text":"济南菜、胶东菜、微山湖菜"}],"answer":"C","keys":["C"],"explanation":"鲁菜是济南菜、孔府菜、胶东菜三大系列，充分体现了孔子“食不厌精，脍不厌细”的思想。","type":"单选题"},{"number":120,"stem":"“广州”之名始于（）。","options":[{"key":"A","text":"秦朝置南海郡"},{"key":"B","text":"吴景帝永安七年（264年）另设广州，州治番禺"},{"key":"C","text":"唐贞观年间"},{"key":"D","text":"明初改制为省"}],"answer":"B","keys":["B"],"explanation":"吴景帝永安七年（264年），东吴把南海、苍梧、郁林、高梁 4个郡从交州划出，另设广州，州治番禺，广州由此得名。","type":"单选题"},{"number":121,"stem":"广昌孟戏被誉为（）。","options":[{"key":"A","text":"“中国戏剧的活化石”"},{"key":"B","text":"“百戏之祖”"},{"key":"C","text":"“中国古代戏曲声腔的活化石”"},{"key":"D","text":"“东方戏曲明珠”"}],"answer":"C","keys":["C"],"explanation":"江西有“戏曲之邦”“戏曲重要发源地”之誉，广昌孟戏是中国古代戏曲声腔的“活化石”。A 项“中国戏剧的活化石”指土家族傩戏（湖南、湖北），易误选。","type":"单选题"},{"number":122,"stem":"地处晋冀豫三省交界、被誉为“人工天河”的是（）。","options":[{"key":"A","text":"红旗渠"},{"key":"B","text":"都江堰"},{"key":"C","text":"坎儿井"},{"key":"D","text":"灵渠"}],"answer":"A","keys":["A"],"explanation":"红旗渠位于河南安阳林州市，是国家 5A 级旅游景区、全国重点文物保护单位，被誉为“人工天河”。B 项在四川，C 项在新疆，D 项在广西，易误选。","type":"单选题"},{"number":123,"stem":"湖北省建省之始是（）。","options":[{"key":"A","text":"隋开皇九年（589年）"},{"key":"B","text":"明洪武年间"},{"key":"C","text":"民国初年"},{"key":"D","text":"清康熙三年（1664年）湖广分治"}],"answer":"D","keys":["D"],"explanation":"清康熙三年（1664年）湖广分治，大体以洞庭湖为界，南为湖南布政使司，北为湖北布政使司，此为湖北省建省之始。","type":"单选题"},{"number":124,"stem":"被联合国教科文组织评为世界 25首优秀民歌之一的土家族民歌是（）。","options":[{"key":"A","text":"《黄四姐》"},{"key":"B","text":"《茉莉花》"},{"key":"C","text":"《龙船调》"},{"key":"D","text":"《康定情歌》"}],"answer":"C","keys":["C"],"explanation":"《龙船调》源自湖北利川市，被联合国教科文组织评为世界 25首优秀民歌之一；2014年以《龙船调》为代表的土家族民歌（利川灯歌）被列入第四批国家级非物质文化遗产代表性项目名录。","type":"单选题"},{"number":125,"stem":"南水北调中线工程的水源地是（）。","options":[{"key":"A","text":"丹江口水库"},{"key":"B","text":"小浪底水库"},{"key":"C","text":"葛洲坝"},{"key":"D","text":"鄱阳湖"}],"answer":"A","keys":["A"],"explanation":"南水北调中线工程以汉江中上游的丹江口水库为水源地，给河南、河北、北京、天津四省市提供大量生活和生产用水。B项小浪底水库在黄河干流（河南），易误选。","type":"单选题"},{"number":126,"stem":"江南三大名楼之一、位于湖南的名楼是（）。","options":[{"key":"A","text":"黄鹤楼"},{"key":"B","text":"滕王阁"},{"key":"C","text":"鹳雀楼"},{"key":"D","text":"岳阳楼"}],"answer":"D","keys":["D"],"explanation":"岳阳楼是江南三大名楼之一，岳阳以“洞庭天下水、岳阳天下楼”著称于世。A 项黄鹤楼在湖北武汉，B 项滕王阁在江西南昌，均易误选。","type":"单选题"},{"number":127,"stem":"湘菜的代表派系是（）。","options":[{"key":"A","text":"组庵湘菜"},{"key":"B","text":"官府湘菜"},{"key":"C","text":"民间土菜"},{"key":"D","text":"寺院素菜"}],"answer":"A","keys":["A"],"explanation":"湘菜的主题是下饭，代表派系为组庵湘菜，如组庵豆腐、组庵鱼翅等；民间湘菜代表菜品有剁椒鱼头、辣椒炒肉、湘西外婆菜、吉首酸肉等。","type":"单选题"},{"number":128,"stem":"福建（）已成为中国乃至世界重要的鞋业生产基地。","options":[{"key":"A","text":"厦门"},{"key":"B","text":"晋江"},{"key":"C","text":"莆田"},{"key":"D","text":"漳州"}],"answer":"B","keys":["B"],"explanation":"晋江已成为中国乃至世界的重要鞋业生产基地。","type":"单选题"},{"number":129,"stem":"中国近代“船政文化”的发祥地是福建（）。","options":[{"key":"A","text":"福州马尾"},{"key":"B","text":"厦门"},{"key":"C","text":"泉州"},{"key":"D","text":"漳州"}],"answer":"A","keys":["A"],"explanation":"福州马尾是船政文化的发祥地。民族英雄林则徐是福建人，“船政之父”沈葆桢也与此密切相关。","type":"单选题"},{"number":130,"stem":"全球拥有世界遗产最多的城市是（）。","options":[{"key":"A","text":"洛阳"},{"key":"B","text":"西安"},{"key":"C","text":"苏州"},{"key":"D","text":"北京"}],"answer":"D","keys":["D"],"explanation":"北京有世界遗产 8 项：长城（北京段）、故宫、周口店“北京人”遗址、颐和园、天坛、明十三陵、京杭大运河（北京段）、北京中轴线，是全球拥有世界遗产最多的城市。[答题技巧] 遗产最多的城市：北京；双遗最多的国家：中国+澳大利亚（4 项，澳大利亚四个字）。三、多选题（请将正确答案的字母填在括号内）","type":"单选题"},{"number":131,"stem":"定制旅游产品的特点有（）。","options":[{"key":"A","text":"专属性强、个性化突出"},{"key":"B","text":"强调更多的情感代入和深入体验"},{"key":"C","text":"具有更多的交互性"},{"key":"D","text":"对创意和供应链的要求高"},{"key":"E","text":"完全标准化、无差别"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"定制旅游产品专属性强、个性化突出，强调更多的情感代入和深入体验，具有更多的交互性，拓展性强，对创意和供应链的要求高。定制旅游产品专属性强、个性化突出，拓展性强。","type":"多选题"},{"number":132,"stem":"下列关于明清科举考试及录取称谓的表述，正确的有（）。","options":[{"key":"A","text":"会试考中者称为“进士”"},{"key":"B","text":"乡试考取者称为“举人”"},{"key":"C","text":"会试考中者称为“贡士”"},{"key":"D","text":"殿试一甲前三名分别称为“状元”“榜眼”“探花”"},{"key":"E","text":"乡试第一名称为“解元”"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"乡试考取者称为“举人”；会试考中者称为“贡士”；殿试一甲取前三名，分别称为“状元”“榜眼”“探花”；乡试第一名称为“解元”。","type":"多选题"},{"number":133,"stem":"下列关于宫殿前日晷和嘉量的表述，正确的有（）。","options":[{"key":"A","text":"日晷是皇权的象征"},{"key":"B","text":"日晷是军权的象征"},{"key":"C","text":"日晷一般与嘉量并列于左右"},{"key":"D","text":"日晷与嘉量象征天地一统、江山永固"}],"answer":"ACD","keys":["A","C","D"],"explanation":"日晷常设于宫殿前，是皇权的象征，一般与嘉量并列于左右，象征天地一统、江山永固。嘉量是中国古代的标准量器，含有统一度量衡的意义，象征着国家的统一和强盛。","type":"多选题"},{"number":134,"stem":"下列作品中，属于“中国四大古典戏曲”的有（）。","options":[{"key":"A","text":"《西厢记》"},{"key":"B","text":"《牡丹亭》"},{"key":"C","text":"《桃花扇》"},{"key":"D","text":"《长生殿》"},{"key":"E","text":"《窦娥冤》"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"“中国四大古典戏曲”为元代王实甫《西厢记》、明代汤显祖《牡丹亭》、清代孔尚任《桃花扇》、清代洪昇《长生殿》。《窦娥冤》是关汉卿的元杂剧代表作，不属于“四大古典戏曲”。","type":"多选题"},{"number":135,"stem":"下列农学著作中，属于中国古代“四大农书”的有（）。","options":[{"key":"A","text":"《汜胜之书》"},{"key":"B","text":"《齐民要术》"},{"key":"C","text":"《农书》"},{"key":"D","text":"《农政全书》"},{"key":"E","text":"《农桑辑要》"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"中国古代“四大农书”为《汜胜之书》《齐民要术》《农书》《农政全书》。《农桑辑要》不属于“四大农书”。","type":"多选题"},{"number":136,"stem":"中国瓷器的主要产地有（）。","options":[{"key":"A","text":"江西景德镇"},{"key":"B","text":"湖南醴陵"},{"key":"C","text":"浙江龙泉"},{"key":"D","text":"山东淄博"},{"key":"E","text":"河北唐山"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"江西景德镇被称为“瓷都”。湖南醴陵、福建德化
