y":"C","text":"粉彩瓷"},{"key":"D","text":"玲珑瓷"}],"answer":"A","keys":["A"],"explanation":"雨点釉瓷又名油滴瓷,曾有“尺瓶寸盂视为无上之品,茗瓯酒盏叹为不世之珍”之说。B项青花瓷、C 项粉彩瓷、D 项玲珑瓷与颜色釉瓷并称为景德镇四大传统名瓷,均无此说。","type":"单选题"},{"number":83,"stem":"中国共产党第一次全国代表大会最后一天会议转移到( )的游船上举行。","options":[{"key":"A","text":"江西鄱阳湖"},{"key":"B","text":"湖北东湖"},{"key":"C","text":"江苏太湖"},{"key":"D","text":"浙江嘉兴南湖"}],"answer":"D","keys":["D"],"explanation":"1921年 7 月 23 日,中国共产党第一次全国代表大会在上海法租界望志路 106 号(今兴业路 76号)召开。因法租界巡捕搜查会议地点,中共一大最后一天会议转移到浙江嘉兴南湖的游船上举行。","type":"单选题"},{"number":84,"stem":"“四象”中代表东方的是( )。","options":[{"key":"A","text":"朱雀"},{"key":"B","text":"青龙"},{"key":"C","text":"玄武"},{"key":"D","text":"白虎"}],"answer":"B","keys":["B"],"explanation":"“四象”:东方青龙、北方玄武、西方白虎、南方朱雀。A 项朱雀代表南方,C 项玄武代表北方,D项白虎代表西方。","type":"单选题"},{"number":85,"stem":"中国现存年代最早、规模最大的藏传佛塔是( )。","options":[{"key":"A","text":"嵩岳寺塔"},{"key":"B","text":"真觉寺塔"},{"key":"C","text":"崇圣寺三塔"},{"key":"D","text":"妙应寺白塔"}],"answer":"D","keys":["D"],"explanation":"妙应寺白塔是中国现存年代最早、规模最大的藏传佛塔,位于北京。A 项河南登封嵩岳寺塔、C 项崇圣寺三塔均为密檐式塔;B 项北京真觉寺塔以精美的雕刻艺术而著称,三者均非藏传佛塔。","type":"单选题"},{"number":86,"stem":"现代保存下来的中国古典园林大多属于( )。","options":[{"key":"A","text":"明清时期"},{"key":"B","text":"秦汉时期"},{"key":"C","text":"元朝"},{"key":"D","text":"唐宋时期"}],"answer":"A","keys":["A"],"explanation":"现代保存下来的园林大多属于明清时期,这些园林充分表现了中国古典园林的独特风格和高超的造园技术。 魏晋南北朝时期是中国园林发展的转折点。唐宋时期园林达到成熟阶段,明清时期,园林艺术进入精深发展阶段。D 项唐宋时期园林达到成熟阶段,但并非现存园林的主要所属时期。","type":"单选题"},{"number":87,"stem":"福建省人口最多的少数民族是( )。","options":[{"key":"A","text":"畲族"},{"key":"B","text":"回族"},{"key":"C","text":"满族"},{"key":"D","text":"蒙古族"}],"answer":"A","keys":["A"],"explanation":"福建畲族人口占全国畲族人口的 57%,福建省畲族人口全国最多,是全国回族发祥地之一。畲族婚俗最大的特点是\"俗不离歌\",婚礼上有\"男拜女不拜\"仪式。","type":"单选题"},{"number":88,"stem":"被称为\"华中屋脊\"的是( )。","options":[{"key":"A","text":"衡山"},{"key":"B","text":"神农架"},{"key":"C","text":"大巴山"},{"key":"D","text":"大别山"}],"answer":"B","keys":["B"],"explanation":"号称\"华中屋脊\"和\"绿色宝库\"的神农架是重要的自然保护区,最高峰神农顶海拔 3105米,\"野人之谜\"更令人关注。A 项衡山有\"五岳独秀\"之称(湖南),C项大巴山、D 项大别山均为我国著名山地,均易误选。","type":"单选题"},{"number":89,"stem":"大连船舶重工研制的中国第一艘航空母舰是( )。","options":[{"key":"A","text":"\"山东舰\""},{"key":"B","text":"\"福建舰\""},{"key":"C","text":"\"辽宁舰\""},{"key":"D","text":"\"广东舰\""}],"answer":"C","keys":["C"],"explanation":"大连船舶重工研制出中国第一艘航空母舰\"辽宁舰\"、第一艘全国产航空母舰\"山东舰\",大船集团建造了全球首艘安装风帆装置的 30.8 万吨超大型原油船\"凯力轮\"。A 项\"山东舰\"亦由大连船舶重工研制,但它是第一艘全国产航空母舰,并非中国第一艘。","type":"单选题"},{"number":90,"stem":"被称为\"东南第一山\"的是( )。","options":[{"key":"A","text":"雪窦山"},{"key":"B","text":"莫干山"},{"key":"C","text":"江郎山"},{"key":"D","text":"雁荡山"}],"answer":"D","keys":["D"],"explanation":"浙江省境内有号称\"东南第一山\"的雁荡山风景名胜区。雪窦山、莫干山、江郎山均为浙江名山,易误选。","type":"单选题"},{"number":91,"stem":"浙江全省最大的人工湖泊是( )。","options":[{"key":"A","text":"千岛湖"},{"key":"B","text":"洞庭湖"},{"key":"C","text":"鄱阳湖"},{"key":"D","text":"太湖"}],"answer":"A","keys":["A"],"explanation":"千岛湖是新安江水电站建成后形成的全省最大人工湖泊。浙江有杭州西湖、绍兴东湖、嘉兴南湖、宁波东钱湖四大名湖。B 项洞庭湖位于湖南,C 项鄱阳湖位于江西,D 项太湖位于江苏,均为天然湖泊,非浙江人工湖。","type":"单选题"},{"number":92,"stem":"中国北方最大的民宅戏楼是( )。","options":[{"key":"A","text":"乔家大院戏楼"},{"key":"B","text":"石府戏楼"},{"key":"C","text":"恭王府戏楼"},{"key":"D","text":"颐和园戏楼"}],"answer":"B","keys":["B"],"explanation":"天津杨柳青博物馆(石家大院)有\"华北第一宅\"之称,大院内的石府戏楼是中国北方最大的民宅戏楼。","type":"单选题"},{"number":93,"stem":"素有\"华北明珠\"之称,且为中国海河平原上最大湖泊的是( )。","options":[{"key":"A","text":"衡水湖"},{"key":"B","text":"官厅水库"},{"key":"C","text":"白洋淀"},{"key":"D","text":"潘家口水库"}],"answer":"C","keys":["C"],"explanation":"白洋淀因电影《小兵张嘎》而驰名中外,是中国海河平原上最大的湖泊,水产资源丰富,并以大面积的芦苇荡和千亩连片的荷花淀而闻名,素有\"华北明珠\"之称。","type":"单选题"},{"number":94,"stem":"我国北方地区最好的深水不冻港是( )。","options":[{"key":"A","text":"天津港"},{"key":"B","text":"营口港"},{"key":"C","text":"秦皇岛港"},{"key":"D","text":"大连港"}],"answer":"D","keys":["D"],"explanation":"大连港是我国北方地区最好的深水不冻港。A 项天津港是世界等级最高、中国最大的人工深水港,C 项秦皇岛港是不冻不淤的天然良港(河北),易误选。","type":"单选题"},{"number":95,"stem":"北京最早见于文献的名称是( )。","options":[{"key":"A","text":"蓟"},{"key":"B","text":"幽州"},{"key":"C","text":"燕京"},{"key":"D","text":"大都"}],"answer":"A","keys":["A"],"explanation":"北京最早见于文献的名称叫\"蓟\"。1267年蒙古大汗忽必烈下令在中都城的东北郊筑建新城,1285 年元大都新城全部建成,这便是意大利旅行家马可·波罗在游记中称为\"世界莫能与比\"的元大都。B 项幽州、C 项燕京、D 项大都均为北京历史名称,但最早见于文献的名称是\"蓟\"。","type":"单选题"},{"number":96,"stem":"被誉为\"中华第一关\"的是( )。","options":[{"key":"A","text":"山海关"},{"key":"B","text":"雁门关"},{"key":"C","text":"嘉峪关"},{"key":"D","text":"八达岭长城"}],"answer":"B","keys":["B"],"explanation":"雁门关被誉为\"中华第一关\"(山西)。\"天下第一关\"指山海关(河北),\"天下第一雄关\"指嘉峪关(甘肃),\"北门锁钥\"指八达岭长城(北京),均易误选。","type":"单选题"},{"number":97,"stem":"上海境内最高点是( )。","options":[{"key":"A","text":"佘山"},{"key":"B","text":"崇明岛"},{"key":"C","text":"大金山"},{"key":"D","text":"天马山"}],"answer":"C","keys":["C"],"explanation":"大金山为上海境内最高点,海拔 103.4 米。A项佘山、D 项天马山均为上海境内山丘,B项崇明岛是中国第三大岛,均非上海境内最高点。","type":"单选题"},{"number":98,"stem":"西泠印社以\"保存金石,研究印学,兼及书画\"为宗旨,其第一任社长是( )。","options":[{"key":"A","text":"齐白石"},{"key":"B","text":"徐悲鸿"},{"key":"C","text":"张大千"},{"key":"D","text":"吴昌硕"}],"answer":"D","keys":["D"],"explanation":"西泠印社吴昌硕为第一任社长,是国际上历史最悠久、成就最高、影响最广的篆刻艺术团体,有\"天下第一名社\"之誉。A 项齐白石、B 项徐悲鸿、C项张大千均为近现代书画名家,与西泠印社第一任社长无关。","type":"单选题"},{"number":99,"stem":"下列哪项是江苏最高峰( )。","options":[{"key":"A","text":"黄山莲花峰"},{"key":"B","text":"连云港云台山玉女峰"},{"key":"C","text":"浙江黄茅尖"},{"key":"D","text":"陕西太白山拔仙台"}],"answer":"B","keys":["B"],"explanation":"连云港云台山玉女峰为江苏最高峰,海拔 624.4 米。黄山莲花峰、黄茅尖、太白山拔仙台均为外省名山,易误选。","type":"单选题"},{"number":100,"stem":"土家族无论什么盛大聚会都要跳的最著名舞蹈是( )。","options":[{"key":"A","text":"长鼓舞"},{"key":"B","text":"铜鼓舞"},{"key":"C","text":"芦笙舞"},{"key":"D","text":"摆手舞"}],"answer":"D","keys":["D"],"explanation":"\"摆手舞\"是最著名的土家舞蹈,是与祭祀祖先、祈求丰收相联系的,无论什么盛大的聚会都要跳。A项长鼓舞为瑶族盛行舞蹈(广西金秀),B 项铜鼓舞、C 项芦笙舞均为少数民族舞蹈而非土家族舞蹈。","type":"单选题"},{"number":101,"stem":"明清时期晋商建立的中国第一家票号是( )。","options":[{"key":"A","text":"日昇昌"},{"key":"B","text":"蔚泰厚"},{"key":"C","text":"协同庆"},{"key":"D","text":"百川通"}],"answer":"A","keys":["A"],"explanation":"明清时期,晋商成为国内势力最雄厚的商帮,晋商建立了中国第一家票号——日昇昌。著名的平遥古城、乔家大院都与晋商的鼎盛息息相关。","type":"单选题"},{"number":102,"stem":"福建全省第一大岛是( )。","options":[{"key":"A","text":"东山岛"},{"key":"B","text":"厦门岛"},{"key":"C","text":"金门岛"},{"key":"D","text":"平潭岛"}],"answer":"D","keys":["D"],"explanation":"平潭岛为福建全省第一大岛。平潭岛(海坛岛)也是全国第五大岛、福建全省第一大岛。","type":"单选题"},{"number":103,"stem":"上海历史最悠久、规模最大的佛教寺院是( )。","options":[{"key":"A","text":"龙华寺"},{"key":"B","text":"静安寺"},{"key":"C","text":"玉佛寺"},{"key":"D","text":"宝山寺"}],"answer":"A","keys":["A"],"explanation":"龙华寺位于上海市徐汇区龙华街道,是上海历史最悠久、规模最大的佛教寺院,有\"江南千年名刹\"之誉。寺前的龙华塔是上海保存最完整的宋代古塔,被誉为申城\"宝塔之冠\"。","type":"单选题"},{"number":104,"stem":"有\"京东第一山\"之誉的是( )。","options":[{"key":"A","text":"千山"},{"key":"B","text":"盘山"},{"key":"C","text":"医巫闾山"},{"key":"D","text":"凤凰山"}],"answer":"B","keys":["B"],"explanation":"盘山风景名胜区位于天津市蓟州区,有\"京东第一山\"之誉。千山有\"东北明珠\"之称(辽宁),易误选。","type":"单选题"},{"number":105,"stem":"中国黄(渤)海候鸟栖息地(第一期)位于江苏省( )。","options":[{"key":"A","text":"南通市"},{"key":"B","text":"连云港市"},{"key":"C","text":"盐城市"},{"key":"D","text":"扬州市"}],"answer":"C","keys":["C"],"explanation":"中国黄(渤)海候鸟栖息地(第一期)位于江苏省盐城市,是濒危物种最多、受威胁程度最高的东亚—澳大利西亚候鸟迁徙路线上的关键枢纽。","type":"单选题"},{"number":106,"stem":"天津\"津门三绝\"不包括( )。","options":[{"key":"A","text":"狗不理包子"},{"key":"B","text":"十八街麻花"},{"key":"C","text":"耳朵眼炸糕"},{"key":"D","text":"杨柳青年画"}],"answer":"D","keys":["D"],"explanation":"津门三绝是狗不理包子、十八街麻花、耳朵眼炸糕;杨柳青年画是天津特色民间艺术,但不属于\"津门三绝\"。","type":"单选题"},{"number":107,"stem":"中国持续最久、规模最大的民俗灯会是( )。","options":[{"key":"A","text":"自贡灯会"},{"key":"B","text":"南京秦淮灯会"},{"key":"C","text":"豫园灯会"},{"key":"D","text":"哈尔滨冰灯"}],"answer":"B","keys":["B"],"explanation":"南京秦淮灯会始于南朝,盛于明清,是中国持续最久、规模最大的民俗灯会。 夫子庙—秦淮风光带是国家 5A 级旅游景区。","type":"单选题"},{"number":108,"stem":"国家速滑馆是世界上第一座采用( )制冰的大道速滑馆,碳排放趋近于零。","options":[{"key":"A","text":"液氨制冷系统"},{"key":"B","text":"氟利昂循环系统"},{"key":"C","text":"二氧化碳跨临界直冷系统"},{"key":"D","text":"干冰降温系统"}],"answer":"C","keys":["C"],"explanation":"国家速滑馆是世界上第一座采用二氧化碳跨临界直冷系统制冰的大道速滑馆,碳排放趋近于零,拥有亚洲最大的全冰面设计。","type":"单选题"},{"number":109,"stem":"别称\"鹏城\"、中国第一个全部城镇化的城市是( )。","options":[{"key":"A","text":"深圳"},{"key":"B","text":"广州"},{"key":"C","text":"珠海"},{"key":"D","text":"东莞"}],"answer":"A","keys":["A"],"explanation":"深圳简称\"深\",别称\"鹏城\",1979年成立深圳市,1980 年成为中国第一个经济特区,是中国第一个全部城镇化的城市;深圳电子信息制造业规模已占全国规模的 1/6。","type":"单选题"},{"number":110,"stem":"因建筑时间最久远、保存最完整而被誉为\"天下第一庙\"的是( )。","options":[{"key":"A","text":"孔府"},{"key":"B","text":"孔庙"},{"key":"C","text":"孔林"},{"key":"D","text":"岱庙"}],"answer":"B","keys":["B"],"explanation":"孔庙以\"建筑时间最久远、保存最完整\"被誉为\"天下第一庙\";孔府号称\"天下第一家\";孔林是世界上规模最大、延续时间最久、墓葬最多、保存最完整的家族古墓群。","type":"单选题"},{"number":111,"stem":"吉林省当之无愧的第一支柱产业是( )。","options":[{"key":"A","text":"石油化工"},{"key":"B","text":"医药健康"},{"key":"C","text":"现代汽车及零部件产业"},{"key":"D","text":"农产品加工"}],"answer":"C","keys":["C"],"explanation":"吉林省是全国汽车工业六大产业集聚区之一,汽车工业增加值占全省工业总量的 1/4以上,是当之无愧的第一支柱产业。长春市素有\"北国春城\"\"东方底特律\"的美誉。","type":"单选题"},{"number":112,"stem":"浙江丽水景宁畲族自治县是全国唯一的畲族自治县,畲民自称\"山哈\",意为( )。","options":[{"key":"A","text":"\"山中凤凰\""},{"key":"B","text":"\"山地之王\""},{"key":"C","text":"\"大树之子\""},{"key":"D","text":"\"山里的客人\""}],"answer":"D","keys":["D"],"explanation":"畲民自称\"山哈\",意为山里的客人。《高皇歌》是一部反映畲族祖先英雄事迹的民族史诗。","type":"单选题"},{"number":113,"stem":"下列哪项是安徽最高山峰( )。","options":[{"key":"A","text":"四川贡嘎山"},{"key":"B","text":"黄山莲花峰"},{"key":"C","text":"广西猫儿山"},{"key":"D","text":"山东泰山"}],"answer":"B","keys":["B"],"explanation":"安徽最高山峰为黄山莲花峰,海拔 1864米。贡嘎山、猫儿山、泰山均为我国著名高峰,易误选。A 项贡嘎山为四川最高峰,C项猫儿山为华南第一高峰(广西),D项泰山位于山东,均非安徽最高山峰。","type":"单选题"},{"number":114,"stem":"素有\"北国江城\"\"雾凇之都滑雪天堂\"美誉的是( )。","options":[{"key":"A","text":"长春市"},{"key":"B","text":"哈尔滨市"},{"key":"C","text":"吉林市"},{"key":"D","text":"沈阳市"}],"answer":"C","keys":["C"],"explanation":"吉林市是吉林省第二大城市、全国唯一与省同名的城市,素以\"北国江城\"而闻名,有\"雾凇之都滑雪天堂\"的美誉,拥有以雾凇岛为核心的\"九大雾凇观赏带\"。A 项长春市素有\"北国春城\"\"东方底特律\"之誉,B 项哈尔滨市素有\"冰城\"之称,D 项沈阳市为辽宁省会,素以\"北国江城\"闻名的是吉林市。","type":"单选题"},{"number":115,"stem":"北京最大的过境河流,历史上曾有\"小黄河\"\"无定河\"之称的是( )。","options":[{"key":"A","text":"永定河"},{"key":"B","text":"潮白河"},{"key":"C","text":"北运河"},{"key":"D","text":"大清河"}],"answer":"A","keys":["A"],"explanation":"永定河是北京最大的过境河流,历史上曾有\"小黄河\"\"无定河\"之称。B 项潮白河、C项北运河、D 项大清河均为北京五大水系河流,但北京最大的过境河流是永定河。","type":"单选题"},{"number":116,"stem":"被誉为\"中国曲艺史活化石\"、中国规模最大的露天曲艺集会是( )。","options":[{"key":"A","text":"天津天后宫庙会"},{"key":"B","text":"宝丰马街书会"},{"key":"C","text":"吴桥杂技节"},{"key":"D","text":"开封菊花文化节"}],"answer":"B","keys":["B"],"explanation":"宝丰马街书会是中国规模最大的露天曲艺集会,被誉为\"中国曲艺史活化石\"。驻马店确山打铁花素有\"民间焰火之最\"的美誉。","type":"单选题"},{"number":117,"stem":"国内最古老的木结构楼阁是( )。","options":[{"key":"A","text":"晋祠圣母殿"},{"key":"B","text":"应县木塔"},{"key":"C","text":"独乐寺观音阁"},{"key":"D","text":"悬空寺"}],"answer":"C","keys":["C"],"explanation":"天津独乐寺有国内最古老的木结构楼阁——观音阁;还有现存最早的庑殿顶山门、国内现存规模最大的乾隆御笔碑刻和辽代白塔等。","type":"单选题"},{"number":118,"stem":"中国八大古都之一、史谓\"天地之中\"的河南城市是( )。","options":[{"key":"A","text":"洛阳"},{"key":"B","text":"开封"},{"key":"C","text":"安阳"},{"key":"D","text":"郑州"}],"answer":"D","keys":["D"],"explanation":"郑州是中国八大古都之一,史谓\"天地之中\",别称商都、绿城;《只有河南·戏剧幻城》、建业电影小镇等新晋文旅地标新颖出圈。A 项洛阳为十三朝古都,B 项开封为八朝古都,C 项安阳为殷墟所在地、中国八大古都之一,但史谓\"天地之中\"的是郑州。","type":"单选题"},{"number":119,"stem":"代表广西文化艺术最高水平、享誉国内外的民间歌舞剧是( )。","options":[{"key":"A","text":"《刘三姐》"},{"key":"B","text":"《印象·刘三姐》"},{"key":"C","text":"《八桂大歌》"},{"key":"D","text":"《壮锦》"}],"answer":"A","keys":["A"],"explanation":"代表广西文化艺术最高水平的民间歌舞剧《刘三姐》享誉国内外。《印象·刘三姐》是大型山水实景演出,注意区分。B 项《印象·刘三姐》是大型山水实景演出,不是民间歌舞剧,易误选。","type":"单选题"},{"number":120,"stem":"中国第一、世界第三高楼是( )。","options":[{"key":"A","text":"东方明珠广播电视塔"},{"key":"B","text":"环球金融中心"},{"key":"C","text":"上海中心大厦"},{"key":"D","text":"金茂大厦"}],"answer":"C","keys":["C"],"explanation":"上海中心大厦是中国第一、世界第三高楼,高 623米,共 127 层,拥有世界最快的电梯之一,速度可达 18 米/秒。A 项东方明珠高 468米,易误选。","type":"单选题"},{"number":121,"stem":"被誉为\"世界稻源\"和\"远古中华第一村\"的是( )。","options":[{"key":"A","text":"跨湖桥遗址"},{"key":"B","text":"河姆渡遗址"},{"key":"C","text":"良渚遗址"},{"key":"D","text":"上山遗址"}],"answer":"D","keys":["D"],"explanation":"上山遗址被誉为\"世界稻源\"和\"远古中华第一村\",是中国最早的稻作农业和村落形态遗址。B 项河姆渡文化反映了母系氏族社会的繁荣,C项良渚古城遗址被认为是 5000年前的区域性权力中心,易误选。","type":"单选题"},{"number":122,"stem":"我国长江中游地区发现的最早最具代表性的新石器时代大型聚落遗址是( )。","options":[{"key":"A","text":"屈家岭文化遗址"},{"key":"B","text":"河姆渡遗址"},{"key":"C","text":"半坡遗址"},{"key":"D","text":"三星堆遗址"}],"answer":"A","keys":["A"],"explanation":"屈家岭文化遗址距今 4500~5300 年,是我国长江中游地区发现的最早最具代表性的新石器时代大型聚落遗址,是楚文化发展的基础,是荆楚文明高度发展之源。B 项河姆渡遗址位于浙江,C 项半坡遗址位于陕西西安,D 项三星堆遗址位于四川,均不在长江中游,均易误选。","type":"单选题"},{"number":123,"stem":"被誉为\"中华第一龙\"的红山文化\"玉龙\",出土于内蒙古( )。","options":[{"key":"A","text":"呼和浩特"},{"key":"B","text":"包头"},{"key":"C","text":"赤峰"},{"key":"D","text":"通辽"}],"answer":"C","keys":["C"],"explanation":"红山文化出土的\"玉龙\"是中国现今发现较早期的龙的形象之一,被誉为\"中华第一龙\"。赤峰也因此被称作\"玉龙的故乡\"。红山文化距今 6500~5000 年,因发现于赤峰市红山而得名。A项呼和浩特、B项包头、D 项通辽均为内蒙古城市,但红山文化因发现于赤峰市红山而得名。","type":"单选题"},{"number":124,"stem":"土家族村寨每年最隆重的集体祭祀是( )。","options":[{"key":"A","text":"祭土王"},{"key":"B","text":"祭祖先"},{"key":"C","text":"祭山神"},{"key":"D","text":"祭灶神"}],"answer":"A","keys":["A"],"explanation":"土家人尊奉祖先,崇拜鬼神,相信兆头,敬奉土王神,\"祭土王\"是土家族村寨每年最隆重的集体祭祀。","type":"单选题"},{"number":125,"stem":"江西古有\"吴头楚尾,粤户闽庭\"之称,其别称是( )。","options":[{"key":"A","text":"\"江右大地\""},{"key":"B","text":"\"赣鄱大地\""},{"key":"C","text":"\"豫章故郡\""},{"key":"D","text":"\"江南西府\""}],"answer":"B","keys":["B"],"explanation":"江西因唐玄宗设江南西道而得省名,又因赣江而简称\"赣\",别称\"赣鄱大地\"。江西作为明确的行政区域建制始于汉高祖初年(约前 202 年),时设豫章郡。","type":"单选题"},{"number":126,"stem":"中国最大的古代文化艺术博物馆是( ),其文物收藏总数超过 186 万件。","options":[{"key":"A","text":"国家博物馆"},{"key":"B","text":"首都博物馆"},{"key":"C","text":"故宫博物院"},{"key":"D","text":"中国国家图书馆"}],"answer":"C","keys":["C"],"explanation":"故宫博物院是中国最大的古代文化艺术博物馆,其文物收藏极其丰富,总数超过 186万件。北京故宫是中国明、清两代的皇家宫殿,旧称紫禁城,位于北京中轴线的中心。","type":"单选题"},{"number":127,"stem":"世界上最大的稀土矿山——白云鄂博矿山位于内蒙古( )。","options":[{"key":"A","text":"赤峰市"},{"key":"B","text":"鄂尔多斯市"},{"key":"C","text":"通辽市"},{"key":"D","text":"包头市"}],"answer":"D","keys":["D"],"explanation":"包头市作为\"世界稀土之都\",其白云鄂博矿山是世界上最大的稀土矿山。A 项赤峰市出产巴林石,B 项鄂尔多斯市煤炭资源丰富,均非\"世界稀土之都\"。","type":"单选题"},{"number":128,"stem":"潍坊风筝主要有 3 种基本造型,其中以( )最突出。","options":[{"key":"A","text":"龙头蜈蚣"},{"key":"B","text":"沙燕"},{"key":"C","text":"蝴蝶"},{"key":"D","text":"鹰"}],"answer":"A","keys":["A"],"explanation":"潍坊风筝主要有串、硬翅和筒形 3 种基本造型,其中以龙头蜈蚣最突出,赢得了\"风筝艺术,潍坊第一\"的美誉,潍坊已成为国际风筝节的固定举办地。","type":"单选题"},{"number":129,"stem":"山海关是明长城唯一与( )相交会的地方。","options":[{"key":"A","text":"黄河"},{"key":"B","text":"渤海"},{"key":"C","text":"长江"},{"key":"D","text":"燕山"}],"answer":"B","keys":["B"],"explanation":"山海关建于明长城东端,是明长城唯一与大海相交会的地方,全国唯一同时汇聚山地、平原、滨海长城形态的关城,被誉为\"天然的长城博物馆\"。","type":"单选题"},{"number":130,"stem":"色泽乌润、汤色红亮、芳香浓郁,产于安徽祁门的是( )。","options":[{"key":"A","text":"黄山毛峰"},{"key":"B","text":"太平猴魁"},{"key":"C","text":"祁门红茶"},{"key":"D","text":"六安瓜片"}],"answer":"C","keys":["C"],"explanation":"祁门红茶色泽乌润,汤色红亮,芳香浓郁。黄山毛峰产自黄山高海拔地区,外形细秀;太平猴魁以挺秀外形著称;六安瓜片以清香口感著称,均为中国著名高品质茶叶。三、多选题","type":"单选题"},{"number":131,"stem":"中国人民解放军战略决战的“三大战役”是( )。","options":[{"key":"A","text":"辽沈战役"},{"key":"B","text":"淮海战役"},{"key":"C","text":"平津战役"},{"key":"D","text":"渡江战役"},{"key":"E","text":"济南战役"}],"answer":"ABC","keys":["A","B","C"],"explanation":"1948年 9 月 12 日至 1949 年 1 月 31日,中国人民解放军同国民党军进行战略决战,先后发动了辽沈战役、淮海战役和平津战役, 史称“三大战役”。D 项渡江战役、E项济南战役不属于“三大战役”。","type":"多选题"},{"number":132,"stem":"再加工茶类有( )。","options":[{"key":"A","text":"紧压茶"},{"key":"B","text":"花茶"},{"key":"C","text":"绿茶"},{"key":"D","text":"红茶"},{"key":"E","text":"乌龙茶"}],"answer":"AB","keys":["A","B"],"explanation":"再加工茶类有压制成型的紧压茶和鲜花窨制的花茶。紧压茶主要以黑茶或红茶或绿茶为原料,也称边销茶。花茶出现于宋代,以精制后的茶叶和鲜花为原料,经过窨花工艺制成。C项绿茶、D 项红茶、E 项乌龙茶(青茶)均属按初加工方式划分的六大类毛茶,不是再加工茶类。","type":"多选题"},{"number":133,"stem":"文房四宝之首包括( )。","options":[{"key":"A","text":"湖笔"},{"key":"B","text":"徽墨"},{"key":"C","text":"宣纸"},{"key":"D","text":"端砚"},{"key":"E","text":"歙砚"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"笔、墨、纸、砚素称文房四宝,湖笔、徽墨、宣纸、端砚,被称为文房四宝之首。E 项歙砚与端砚、洮河砚、澄泥砚并称中国四大名砚,但不是“文房四宝之首”。","type":"多选题"},{"number":134,"stem":"我国可以欣赏到极光景观的地区有( )。","options":[{"key":"A","text":"黑龙江漠河"},{"key":"B","text":"新疆阿勒泰"},{"key":"C","text":"海南三亚"},{"key":"D","text":"西藏拉萨"},{"key":"E","text":"内蒙古呼伦贝尔"}],"answer":"AB","keys":["A","B"],"explanation":"我国黑龙江漠河和新疆阿勒泰都可以欣赏到极光景观。极光出现在高纬度地区的夜空,C 项海南三亚、D项西藏拉萨、E 项内蒙古呼伦贝尔纬度较低,均无法观赏极光。","type":"多选题"},{"number":135,"stem":"我国喀斯特地貌分布最集中的地区是( )。","options":[{"key":"A","text":"广西"},{"key":"B","text":"云贵高原"},{"key":"C","text":"青藏高原"},{"key":"D","text":"黄土高原"},{"key":"E","text":"内蒙古高原"}],"answer":"AB","keys":["A","B"],"explanation":"中国是世界上喀斯特地貌分布最广泛、发育最充分、类型最齐全的国家,中国南方喀斯特(一期、二期)被列入世界自然遗产名录,以广西、云贵高原最为集中。C 项青藏高原、D项黄土高原、E项内蒙古高原均非我国喀斯特地貌集中分布区。","type":"多选题"},{"number":136,"stem":"金元以来,全国道教形成的两大教派是( )。","options":[{"key":"A","text":"全真道"},{"key":"B","text":"正一道"},{"key":"C","text":"太平道"},{"key":"D","text":"五斗米道"},{"key":"E","text":"南天师道"}],"answer":"AB","keys":["A","B"],"explanation":"金元以来至今,全国道教形成全真道与正一道两大教派。全真道在修行方法上重内丹修炼、不尚符箓;正一道集符箓派之大成,以行符箓为主要特征。 C 项太平道、D 项五斗米道均为早期的道教。","type":"多选题"},{"number":137,"stem":"廊按结构形式可分为( )。","options":[{"key":"A","text":"双面空廊"},{"key":"B","text":"单面空廊"},{"key":"C","text":"复廊"},{"key":"D","text":"爬山廊"},{"key":"E","text":"水廊"}],"answer":"ABC","keys":["A","B","C"],"explanation":"廊按结构形式可分为双面空廊、单面空廊、复廊等。按廊的总体造型及其与地形、环境的关系可分为直廊、曲廊、爬山廊、水廊、桥廊等。","type":"多选题"},{"number":138,"stem":"古代“为尊者讳”,下列属于避讳的例子有( )。","options":[{"key":"A","text":"汉高祖刘邦时,凡“邦”字一律改称“国”"},{"key":"B","text":"唐太宗李世民时,观世音被迫称为“观音”"},{"key":"C","text":"康熙名玄烨,玄武门只能叫“元武门”或“神武门”"},{"key":"D","text":"避秦始皇嬴政讳,改“正月”为“端月”"},{"key":"E","text":"避汉文帝刘恒讳,改“姮娥”为“嫦娥”"}],"answer":"ABC","keys":["A","B","C"],"explanation":"皇帝或孔子等圣人的名字,常人更不能用,要“避讳”,一般是“改字”或“缺笔”。教材所载避讳例子即 ABC三项:汉高祖刘邦时,凡“邦”字一律改称“国”;唐太宗李世民时,观世音也被迫称为“观音”;康熙名玄烨,玄武门都只能叫“元武门”或“神武门”。DE 两项非教材所载避讳例证。","type":"多选题"},{"number":139,"stem":"下列澳大利亚城市与其称号对应正确的有( )。","options":[{"key":"A","text":"悉尼——“南半球的纽约”"},{"key":"B","text":"墨尔本——“澳大利亚的伦敦”"},{"key":"C","text":"堪培拉——“大洋洲的花园城市”"},{"key":"D","text":"悉尼是澳大利亚华侨和华人聚居最多的地区"},{"key":"E","text":"堪培拉是澳大利亚最大的城市"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"悉尼是澳大利亚第一大城市,有“南半球的纽约”之称,悉尼是澳大利亚华侨和华人聚居最多的地区。墨尔本是澳大利亚最具有欧洲韵味的城市,被称为“澳大利亚的伦敦”。堪培拉是纯粹的政治中心,被誉为“大洋洲的花园城市”。E 项错误——澳大利亚最大的城市是悉尼,不是堪培拉。","type":"多选题"},{"number":140,"stem":"被誉为我国传统“四大名绣”的是( )。","options":[{"key":"A","text":"苏绣"},{"key":"B","text":"湘绣"},{"key":"C","text":"粤绣"},{"key":"D","text":"蜀绣"},{"key":"E","text":"京绣"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"苏州苏绣、湖南湘绣、广东粤绣、四川蜀绣被誉为我国传统四大名绣。苏绣、湘绣、粤绣、蜀绣并称四大名绣。","type":"多选题"},{"number":141,"stem":"下列关于唐代诗歌的表述,正确的有( )。","options":[{"key":"A","text":"李白世人称其为“诗仙”"},{"key":"B","text":"杜甫有“诗圣”之称,其诗歌深有“诗史”之誉"},{"key":"C","text":"李白和杜甫合称“李杜”,被誉为诗史上的“双子星座”"},{"key":"D","text":"晚唐杜牧和李商隐合称“小李杜”"},{"key":"E","text":"王维被世人称为“诗佛”,是唐代最杰出的浪漫主义诗人"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"李白和杜甫被誉为诗史上的“双子星座”,合称“李杜”。李白诗歌雄奇峭丽、豪放飘逸,世人称其为“诗仙”;杜甫有“诗圣”之称,其诗歌深有“诗史”之誉。晚唐代表诗人是杜牧和李商隐。杜牧擅长七绝,李商隐工于七律,后世将二人合称为“小李杜”。E 项错误——唐代最杰出的浪漫主义诗人是李白,而非王维。","type":"多选题"},{"number":142,"stem":"《诗经》的组成部分包括( )。","options":[{"key":"A","text":"风"},{"key":"B","text":"雅"},{"key":"C","text":"颂"},{"key":"D","text":"赋"},{"key":"E","text":"比"}],"answer":"ABC","keys":["A","B","C"],"explanation":"我国第一部诗歌总集《诗经》产生于春秋时期,《诗经》按音乐的特点分为风、雅、颂三部分。 《诗经》的表现手法归纳为赋、比、兴。D项赋、E项比是《诗经》的表现手法,不是其组成部分。","type":"多选题"},{"number":143,"stem":"五四运动孕育的伟大五四精神的主要内容包括( )。","options":[{"key":"A","text":"爱国"},{"key":"B","text":"进步"},{"key":"C","text":"民主"},{"key":"D","text":"科学"},{"key":"E","text":"自由"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"五四运动孕育了以爱国、进步、民主、科学为主要内容的伟大五四精神,其核心是爱国主义精神。五四运动是近代中国革命史上具有划时代意义的事件,标志着新民主主义革命的伟大开端。E项“自由”不属于五四精神的主要内容。","type":"多选题"},{"number":144,"stem":"下列关于各地剪纸特色的表述，正确的有( )。","options":[{"key":"A","text":"蔚县剪纸：不是“剪”而是“刻”"},{"key":"B","text":"扬州剪纸：与国画“白描”手法异曲同工"},{"key":"C","text":"山西剪纸：粗犷、雄壮"},{"key":"D","text":"陕西剪纸：古拙、粗犷的造型"},{"key":"E","text":"佛山剪纸：金碧辉煌的艺术风格"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"蔚县剪纸不是“剪”，而是“刻”。扬州剪纸作品一般以素色为主，其表现手法和中国画“白描”手法有异曲同工之妙。山西剪纸风格粗犷、雄壮，陕西剪纸造型古拙、粗犷，佛山剪纸风格金碧辉煌，使用铜箔、银箔。2009年，中国剪纸入选《联合国教科文组织人类非物质文化遗产代表作名录》。","type":"多选题"},{"number":145,"stem":"中医通过“四诊”的方法辨证施治，四诊指( )。","options":[{"key":"A","text":"望"},{"key":"B","text":"闻"},{"key":"C","text":"问"},{"key":"D","text":"切"},{"key":"E","text":"灸"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"中医以阴阳五行作为理论基础，将人体看成气、形、神的统一体，通过望、闻、问、切“四诊”的方法辨证施治。 E 项“灸”不属于“四诊”。","type":"多选题"},{"number":146,"stem":"我国现存最早的木结构建筑实物包括( )。","options":[{"key":"A","text":"五台县南禅寺大殿"},{"key":"B","text":"佛光寺东大殿"},{"key":"C","text":"芮城县广仁王庙正殿"},{"key":"D","text":"应县木塔"},{"key":"E","text":"晋祠圣母殿"}],"answer":"ABC","keys":["A","B","C"],"explanation":"我国现存最早的木结构建筑实物：山西省唐代所建的五台县南禅寺大殿、佛光寺东大殿和芮城县广仁王庙正殿。D项应县木塔是我国现存最古、最高的木结构大塔，但建于辽代，晚于上述唐代建筑；E 项晋祠圣母殿为宋代建筑。","type":"多选题"},{"number":147,"stem":"我国古代著名的数学成就有( )。","options":[{"key":"A","text":"西汉《周髀算经》提出勾股定理"},{"key":"B","text":"东汉《九章算术》提出负数概念及正负数运算法则"},{"key":"C","text":"魏晋刘徽注《九章算术》"},{"key":"D","text":"南朝祖冲之将圆周率精确到小数点后第 7位"},{"key":"E","text":"宋元时期珠算开始广泛使用"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"西汉《周髀算经》作为我国最早的数学著作，已经涉及复杂分数运算和开平方的方法，并提出了勾股定理。东汉时期的《九章算术》，提出了负数概念及正负数运算法则，标志着我国古代数学体系基本形成。魏晋时期数学家刘徽注《九章算术》，解决了求圆的面积和圆柱、圆锥体积的方法。南朝祖冲之在世界上首次将圆周率精确到小数点后第 7 位。宋元时期，珠算开始在中国广泛使用。","type":"多选题"},{"number":148,"stem":"北京简称\"京\"，是全国的( )。","options":[{"key":"A","text":"政治中心"},{"key":"B","text":"文化中心"},{"key":"C","text":"国际交往中心"},{"key":"D","text":"科技创新中心"},{"key":"E","text":"交通中心"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"北京简称\"京\"，是首都，全国的政治中心、文化中心、国际交往中心、科技创新中心，是世界著名古都和现代化国际城市。 E 项\"交通中心\"不属于北京作为全国中心城市的定位，故不选。","type":"多选题"},{"number":149,"stem":"下列民族中，属于云南特有民族的有( )。","options":[{"key":"A","text":"哈尼族、白族"},{"key":"B","text":"傣族"},{"key":"C","text":"傈僳族、纳西族"},{"key":"D","text":"独龙族"},{"key":"E","text":"藏族"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"云南 15 个特有民族包括哈尼族、白族、傣族、傈僳族、纳西族、独龙族等。E项藏族不是云南特有民族，故不选。","type":"多选题"},{"number":150,"stem":"\"三地三摇篮\"中的\"三摇篮\"是指( )。","options":[{"key":"A","text":"新中国汽车工业的摇篮"},{"key":"B","text":"新中国电影事业的摇篮"},{"key":"C","text":"中国人民航空事业的摇篮"},{"key":"D","text":"中国近代工业的摇篮"},{"key":"E","text":"中国航天事业的摇篮"}],"answer":"ABC","keys":["A","B","C"],"explanation":"\"三摇篮\"即新中国汽车工业的摇篮、新中国电影事业的摇篮、中国人民航空事业的摇篮。长春电影制片厂是中国电影的摇篮。","type":"多选题"},{"number" :157,"stem":"浙江四大名湖包括( )。","options":[{"key":"A","text":"杭州西湖"},{"key":"B","text":"绍兴东湖"},{"key":"C","text":"嘉兴南湖"},{"key":"D","text":"宁波东钱湖"},{"key":"E","text":"千岛湖"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"浙江有杭州西湖、绍兴东湖、嘉兴南湖、宁波东钱湖四大名湖。","type":"多选题"},{"number":158,"stem":"陕西著名的民间工艺品有( )等。","options":[{"key":"A","text":"蓝田玉雕、陕北剪纸"},{"key":"B","text":"凤翔泥塑"},{"key":"C","text":"秦腔脸谱"},{"key":"D","text":"户县农民画"},{"key":"E","text":"榆林柳编"}],"answer":"ABCDE","keys":["A","B","C","D","E"],"explanation":"陕西著名的民间工艺品还有彩绘泥塑、木版年画、扎染、挂线木偶、戏人泥拓片、仿秦俑、仿唐三彩、仿铜车马等。","type":"多选题"},{"number":159,"stem":"黑龙江滑雪资源主要集中在四大区域，包括( )。","options":[{"key":"A","text":"哈尔滨市"},{"key":"B","text":"伊春市"},{"key":"C","text":"牡丹江市"},{"key":"D","text":"大兴安岭地区"},{"key":"E","text":"黑河市"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"黑龙江滑雪资源主要集中在哈尔滨市、伊春市、牡丹江市和大兴安岭地区四大区域。","type":"多选题"},{"number":160,"stem":"下列属于贵州少数民族著名节日的有( )。","options":[{"key":"A","text":"苗族\"姊妹节\""},{"key":"B","text":"侗族\"歌酒节\""},{"key":"C","text":"布依族\"查白歌节\""},{"key":"D","text":"彝族\"火把节\""},{"key":"E","text":"壮族\"三月三\""}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"此外还有苗族\"四月八\"\"龙舟节\"\"芦笙节\"，水族\"端节\"\"卯节\"，土家族和仡佬族的\"吃新节\"等。E项壮族\"三月三\"是广西壮族盛大的传统歌节，不属于贵州少数民族著名节日，故不选。","type":"多选题"},{"number":161,"stem":"江西最具代表性的名茶\"四绿一红\"包括( )。","options":[{"key":"A","text":"庐山云雾茶"},{"key":"B","text":"狗牯脑茶"},{"key":"C","text":"婺源绿茶、浮梁绿茶"},{"key":"D","text":"修水宁红茶"},{"key":"E","text":"铁观音"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"\"四绿一红\"即庐山云雾茶、狗牯脑茶、婺源绿茶、浮梁绿茶和修水宁红茶。E项铁观音是福建安溪名茶，易误选。","type":"多选题"},{"number":162,"stem":"下列关于天津港的说法，正确的有( )。","options":[{"key":"A","text":"世界等级最高的人工深水港"},{"key":"B","text":"中国最大的人工深水港"},{"key":"C","text":"吞吐量居世界第四"},{"key":"D","text":"吞吐量居世界第一"},{"key":"E","text":"我国最大的天然良港是天津港"}],"answer":"ABC","keys":["A","B","C"],"explanation":"天津港是世界等级最高、中国最大的人工深水港，目前已是吞吐量世界第四的综合性港口。 D 项错误；E项错误，我国著名的天然良港是秦皇岛港(河北)。","type":"多选题"},{"number":163,"stem":"粤剧被列为联合国教科文组织人类非物质文化遗产代表作名录，是由( )联合申报。","options":[{"key":"A","text":"广东"},{"key":"B","text":"香港"},{"key":"C","text":"台湾"},{"key":"D","text":"浙江"},{"key":"E","text":"澳门"}],"answer":"ABE","keys":["A","B","E"],"explanation":"2009年 10 月 2 日，由广东、香港和澳门联合申报，粤剧被列为联合国教科文组织人类非物质文化遗产代表作名录。","type":"多选题"},{"number":164,"stem":"香港的四大\"支柱行业\"包括( )。","options":[{"key":"A","text":"金融服务业"},{"key":"B","text":"旅游业"},{"key":"C","text":"贸易及物流业"},{"key":"D","text":"专业及工商业支援服务业"},{"key":"E","text":"房地产业"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"香港是重要的国际金融、贸易、航运中心和国际创新科技中心，也是全球最自由经济体和最具竞争力的城市之一。E项房地产业不属于香港四大\"支柱行业\"，故不选。","type":"多选题"},{"number":165,"stem":"下列属于广东世界遗产的有( )。","options":[{"key":"A","text":"龙门石窟"},{"key":"B","text":"开平碉楼与古村落"},{"key":"C","text":"中国丹霞(广东丹霞山)"},{"key":"D","text":"鼓浪屿"},{"key":"E","text":"左江花山岩画"}],"answer":"BC","keys":["B","C"],"explanation":"广东文化遗产 1 项：开平碉楼与古村落；自然遗产 1 项：中国丹霞(广东丹霞山)。龙门石窟位于河南，鼓浪屿位于福建，左江花山岩画位于广西。","type":"多选题"}],"analysisFile":"雷大大押题卷26【八套完结】/LDD一/LDD押题第一卷（科目三四）-解析 (1).pdf","paperFile":"雷大大押题卷26【八套完结】/LDD一/LDD押题第一卷（科目三四）-试卷.pdf"}]},{"number":2,"subjects":[{"name":"科目一二","questions":[{"number":1,"stem":"根据《中华人民共和国宪法》的规定，人民法院和人民检察院依法独立行使审判权、检察权，不受宪法和法律的约束。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"法治原则还具体体现为人民法院和人民检察院依法独立行使审判权、检察权等制度安排。“依法”即依照宪法和法律，独立行使职权不等于不受宪法和法律的约束。","type":"判断题"},{"number":2,"stem":"《旅游法》的立法目的是为保障旅游者和旅游经营者的合法权益，规范旅游市场秩序，规划和合理利用旅游资源，促进旅游业持续健康发展，制定本法。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"解析为保障旅游者和旅游经营者的合法权益，规范旅游市场秩序，保护和合理利用旅游资源，促进旅游业持续健康发展，制定本法。错在“规划和合理利用旅游资源”，故本题错误。","type":"判断题"},{"number":3,"stem":"根据《民法典》规定，代理人需要转委托第三人代理的，不需要取得被代理人的同意或者追认。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 169 条，代理人需要转委托第三人代理的，应当取得被代理人的同意或者追认。","type":"判断题"},{"number":4,"stem":"《旅行社条例》规定，旅行社违反合同约定，中止对旅游者提供旅游服务的，应当负担旅游者在被中止旅游服务期间所订的同等级别的住宿、用餐、交通等必要费用，并向旅游者支付因此造成的直接经济损失 30%的违约金。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"解析旅行社违反合同约定，中止对旅游者提供住宿、用餐、交通等旅游服务的，应当负担旅游者在被中止旅游服务期间所订的同等级别的住宿、用餐、交通等必要费用，并向旅游者支付旅游费用总额 30%的违约金。错在“直接经济损失 30%”，故本题说法错误。","type":"判断题"},{"number":5,"stem":"《导游管理办法》规定，导游服务星级根据星级评价指标通过全国旅游监管服务信息系统自动生成，并根据导游执业情况每年更新一次。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。本题说法正确。《导游管理办法》第 30 条规定，导游服务星级评价是对导游服务水平的综合评价，星级评价指标由技能水平、学习培训经历、从业年限、奖惩情况、执业经历和社会评价等构成。导游服务星级根据星级评价指标通过全国旅游监管服务信息系统自动生成，并根据导游执业情况每年度更新 1 次。","type":"判断题"},{"number":6,"stem":"尚未完全丧失辨认或者控制能力的精神病人、智力残疾人违反治安管理的，应当给予处罚，但是可以从轻或者减轻处罚。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"依据第 13 条，不能辨认或者不能控制自己行为时违反治安管理的不予处罚，责令监护人加强看护管理和治疗；尚未完全丧失辨认或者控制能力的精神病人、智力残疾人违反治安管理的，应当给予处罚，但是可以从轻或者减轻处罚。题干表述与法条一致。","type":"判断题"},{"number":7,"stem":"根据《旅游投诉处理办法》第 6 条的规定，对由下级旅游投诉处理机构管辖的投诉，上级旅游投诉处理机构认为必要时，可以直接处理或者指定其他下级旅游投诉处理机构管辖。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"《旅游投诉处理办法》第 6 条规定：“对由下级旅游投诉处理机构管辖的投诉，上级旅游投诉处理机构认为必要时，可以直接处理或者指定其他下级旅游投诉处理机构管辖。”","type":"判断题"},{"number":8,"stem":"《旅游安全管理办法》规定，根据旅游突发事件的性质、危害程度、可控性以及造成或者可能造成的影响，旅游突发事件一般分为重大、较大、一般和轻微四级。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"根据旅游突发事件的性质、危害程度、可控性以及造成或者可能造成的影响，旅游突发事件一般分为特别重大、重大、较大和一般四级。","type":"判断题"},{"number":9,"stem":"从业人员发现直接危及人身财产安全的紧急情况时，有权停止作业或者在采取可能的应急措施后撤离作业场所。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"从业人员发现直接危及人身安全的紧急情况时，有权停止作业或者在采取可能的应急措施后撤离作业场所。此处错误在“财产安全”。","type":"判断题"},{"number":10,"stem":"根据《国内水路运输管理规定》规定，水路运输经营者不得出租、出借水路运输经营许可证件，或转让水路运输经营资格。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，题目中遗漏了“以其他形式非法”二字，导致表述不准确。《国内水路运输管理规定》第 21 条规定：“水路运输经营者不得出租、出借水路运输经营许可证件，或者以其他形式非法转让水路运输经营资格。”法规禁止的是“非法转让”，若通过合法程序（如企业并购、资质审批）进行的转让，则不在禁止之列。强调“非法”是为了区分正当商业行为与规避监管的挂靠、倒卖资质等违法行为。","type":"判断题"},{"number":11,"stem":"根据《中华人民共和国民用航空法》的规定，任何旨在免除本法规定的承运人责任或者降低本法规定的赔偿责任限额的条款，均属无效；此种条款的无效，不影响整个航空运输合同的效力。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"第 138 条，任何旨在免除本法规定的承运人责任或者降低本法规定的赔偿责任限额的条款，均属无效；但是，此种条款的无效，不影响整个航空运输合同的效力。该表述与法条原文一致，故正确。","type":"判断题"},{"number":12,"stem":"根据《风景名胜区条例》，国家级风景名胜区申请，由省级人民政府提出申请，经国务院组织论证并批准公布。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"《风景名胜区条例》第十条：设立国家级风景名胜区，由省、自治区、直辖市人民政府提出申请，国务院林业草原主管部门会同国务院自然资源、生态环境、住房城乡建设、文物等有关部门组织论证，提出审查意见，报国务院批准公布。国家级风景名胜区的设立必须经过国务院林业草原主管部门会同多部门组织论证、提出审查意见这一法定程序，不是国务院组织论证批准公布，故判断为错。","type":"判断题"},{"number":13,"stem":"根据《自然保护区条例》规定，自然保护区划分为核心保护区和缓冲控制区，实行分区管控。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"《自然保护区条例》第十六条：自然保护区划分为核心保护区和一般控制区，实行分区管控。核心保护区以外的区域划为一般控制区。该表述中“缓冲控制区”错误，应该是“一般控制区”，故判断为错。","type":"判断题"},{"number":14,"stem":"中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，中国共产党是最高政治领导力量。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。习近平新时代中国特色社会主义思想明确：中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，中国共产党是最高政治领导力量。题干表述与教材一致，故。","type":"判断题"},{"number":15,"stem":"二十届四中全会的核心成果是审议通过“十五五”规划纲要。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"全会最重要的成果是审议通过了《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》。","type":"判断题"},{"number":16,"stem":"中华人民共和国国徽，中间是五星照耀下的天安门，周围是谷穗和镰刀。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。错在“镰刀”，应为“齿轮”。《国徽法》第 2 条规定，中华人民共和国国徽，中间是五星照耀下的天安门，周围是谷穗和齿轮。","type":"判断题"},{"number":17,"stem":"2026 世界人工智能大会暨人工智能全球治理高级别会议即将举行之际，新一代模型KimiK3 于 7 月 16 日发布，参数规模达 2.8 万亿。这是目前全球参数最大的开源模型，标志着我国人工智能模型发展迈出新的一步。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":18,"stem":"2026 年 8 月 1 日，《中华人民共和国民族团结进步促进法》正式施行。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误，应为“2026 年 7 月 1 日”。2026 年 7 月 1 日，《中华人民共和国民族团结进步促进法》正式施行，该法除序言外，设总则、构筑共有精神家园、促进交往交流交融、推动共同繁荣发展、保障与监督、法律责任、附则共 7 章，总计 65 条。民族团结进步促进法是新时代实施宪法有关规定、处理民族事务和开展民族工作的基本法律。这是30 多年来中央政治局会议研究的第一部法律案；这是 30 多年来第一部设置序言的法律；首次将习近平总书记关于加强和改进民族工作的重要思想写入法律；首次从法理层面阐释铸牢中华民族共同体意识、推进中华民族共同体建设等核心概念；首次在法律中明确新时代党的民族工作格局。","type":"判断题"},{"number":19,"stem":"2026 国际电路与系统研讨会 5 月 25 日在上海举行，华为公司董事、半导体业务部总裁何庭波在题为《半导体新路径探索与实践》的主旨演讲中，正式发表“韬（t）定律”。这是中国在全球半导体领域首次提出指导产业发展的新原则。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":20,"stem":"9 月 23 日，2026 年中国农民丰收节全国主场活动在湖北省襄阳市枣阳市举办，活动以“丰收开新局实干促振兴”为主题。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":21,"stem":"《中华人民共和国旅游法》的实施成为导游职业规范的重要标志，表明我国导游队伍的建设有了法律保障。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。《导游人员管理条例》的实施成为导游职业规范的重要标志，表明我国导游队伍的建设有了法律保障。","type":"判断题"},{"number":22,"stem":"2016 年 7 月 1 日，全国旅游监管服务平台全面启用，标志着我国旅游市场监管加快向信息化、智能化转变。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。2018 年 7 月 1 日，全国旅游监管服务平台全面启用，标志着我国旅游市场监管加快向信息化、智能化转变。","type":"判断题"},{"number":23,"stem":"旅行社安排导游为团队旅游提供服务的，不得要求导游垫付或向导游收取任何费用；旅行社临时聘用导游为旅游者提供服务的，应当全额向导游支付规定的导游服务费用。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。旅行社安排导游为团队旅游提供服务的，不得要求导游垫付或向导游收取任何费用；旅行社临时聘用导游为旅游者提供服务的，应当全额向导游支付规定的导游服务费用。","type":"判断题"},{"number":24,"stem":"在大型娱乐场所，地陪要时刻提醒旅游者紧跟团队，密切关注旅游者的动向以及周围环境，提前了解出口位置，以便在意外情况发生时能够迅速带领旅游者撤离。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。在大型娱乐场所，地陪要时刻提醒旅游者紧跟团队，密切关注旅游者的动向以及周围环境，提前了解出口位置，以便在意外情况发生时能够迅速带领旅游者撤离。","type":"判断题"},{"number":25,"stem":"如果在餐厅用餐菜品中有异物，地陪要向餐厅反映并立即换菜，并要求餐厅负责人出面赔礼道歉。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。针对旅游者用餐中出现的问题和要求，如菜品中有异物（头发、虫子等），地陪要及时向餐厅反映并立即换菜，必要时要求餐厅负责人出面赔礼道歉并给予适当补偿。","type":"判断题"},{"number":26,"stem":"在海外当地导游私自增加或减少旅游项目，领队老王首先应进行劝说；如劝说无效，可向接待社反映，必要时向国内组团社反映。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":27,"stem":"当导游与游客观点不同时，只要不涉及大原则问题，导游不要立即反驳否定，要学会包容，求同存异。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":28,"stem":"在规模较大或内容丰富的景区，导游一般采用突出重点法进行讲解。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。在规模较大或内容丰富的景区，导游可按一定脉络顺序分块讲解，采用分段讲解法。","type":"判断题"},{"number":29,"stem":"为了保证乘机顺利，出发前一天，导游老王应通过微信、短信等向旅游者发送乘机注意事项，重点确认证件、机场名称、航班号及起飞时间等关键信息。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":30,"stem":"潜水、跳伞、攀岩、蹦极、探险、赛马、赛车等属于高风险的活动项目，不含在个人旅游意外保险的范围内，需另行购买特定险种。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":31,"stem":"雷大大旅行社统一订餐时，导游老王提前 1 小时再次确认用餐人数、比例、餐标、特殊要求及餐厅繁忙程度等信息，合理处理用餐事宜。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。旅行社统一订餐时，导游应提前 2 小时再次确认用餐人数、比例、餐标、特殊要求及餐厅繁忙程度等信息，合理处理用餐事宜。","type":"判断题"},{"number":32,"stem":"导游带团时遵循“最后上车、最先下车”原则。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。导游带团乘坐交通工具时，应遵循“最后上车、最先下车”原则。","type":"判断题"},{"number":33,"stem":"全团旅游者提出书面申请并签字更换文娱活动，导游同意即可。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。全团游客提出更换时：与接待社计调部门联系，尽可能调换，但不要在未联系妥当之前许诺；如接待社无法调换，要向旅游者做好耐心解释工作，并说明票已订好，不能退换，请其谅解。","type":"判断题"},{"number":34,"stem":"个别旅游者旅游期间坚持更换景点，导游老王应向游客耐心解释，不能随意更换。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。旅游者要求更换或取消计划内的游览项目：凡是计划内的游览项目，一般应该不折不扣地按计划进行。·全团统一提出时：请示接待社计调部门，请其与组团社联系，组团社同意后方可更换或取消。·个别旅游者提出时：向旅游者耐心解释，不能随意更换。","type":"判断题"},{"number":35,"stem":"依据 24 小时内降水量来划分暴雨等级，特大暴雨是指 24 小时内，降雨在 250 毫米及以上。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":36,"stem":"导游带领游客遭遇炸雷时，应找一块地势低洼处蹲下，尽量降低重心和减少人体与地面的接触面积，双脚并拢，双手捂住耳朵，避免雷声伤害听力。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":37,"stem":"通常是身份较高但未持外交护照的人员，或是已卸任的外国党政军高级官员及知名人士颁发礼遇签证。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"A","keys":["A"],"explanation":"本题说法正确。","type":"判断题"},{"number":38,"stem":"赴香港旅行，需持港澳通行证及车票，提前 120 分钟至联检大厅通关。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。赴香港旅行，需持港澳通行证及车票，提前 90 分钟至联检大厅通关。","type":"判断题"},{"number":39,"stem":"因天气、突发事件等非航空公司原因致始发地出港延误或取消，雷大大航空公司应按规定免费提供餐食。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。非航空公司原因：因天气、突发事件等非航空公司原因致始发地出港延误或取消，协助安排食宿，费用旅客自理。","type":"判断题"},{"number":40,"stem":"乘坐飞机，头等舱可以携带 2 件手提行李，而公务舱和经济舱只能携带 1 件手提行李。","options":[{"key":"A","text":"对"},{"key":"B","text":"错"}],"answer":"B","keys":["B"],"explanation":"本题说法错误。乘坐飞机，头等舱、公务舱可以携带 2 件手提行李，而经济舱只能携带 1 件手提行李。二、单选题","type":"判断题"},{"number":41,"stem":"6 月 13 日，2026 年文化和自然遗产日主场城市活动在湖北武汉举行，2026 年文化和自然遗产日的主题是（）。","options":[{"key":"A","text":"保护文物传承文明"},{"key":"B","text":"文物属于人民服务人民"},{"key":"C","text":"让文物活起来"},{"key":"D","text":"弘扬中华优秀传统文化"}],"answer":"B","keys":["B"],"explanation":"6 月 13 日，2026 年文化和自然遗产日主场城市活动在湖北武汉举行，2026 年文化和自然遗产日的主题是“文物属于人民服务人民”。","type":"单选题"},{"number":42,"stem":"根据《中华人民共和国宪法》的规定，我国人民行使国家权力的机关是（）。","options":[{"key":"A","text":"国务院及地方各级人民政府"},{"key":"B","text":"全国人民代表大会和地方各级人民代表大会"}],"answer":"B","keys":["B"],"explanation":"宪法第 2 条第 1 款规定“中华人民共和国的一切权力属于人民”，其制度实现形式中的代议民主是指：人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会。A 项错误，国务院及地方各级人民政府属于国家行政机关，不是行使国家权力的机关；C 项错误，中国人民政治协商会议是爱国统一战线组织，是中国共产党领导的多党合作和政治协商制度的重要组织形式，不是国家权力机关；D 项错误，各级人民法院和人民检察院是审判机关和检察机关，不属于国家权力机关。","type":"单选题"},{"number":43,"stem":"依据《中华人民共和国宪法》，既是公民基本权利，也是公民基本义务的是（）。","options":[{"key":"A","text":"服兵役"},{"key":"B","text":"受教育"},{"key":"C","text":"纳税"},{"key":"D","text":"休息"}],"answer":"B","keys":["B"],"explanation":"根据《宪法》对公民基本权利和义务的规定，受教育权和劳动权既是公民基本权利，也是公民基本义务。","type":"单选题"},{"number":44,"stem":"根据《旅游法》的规定，安排导游为旅游者提供服务的，应当在包价旅游合同中载明（）。","options":[{"key":"A","text":"导游星级评价信息"},{"key":"B","text":"导游信用信息"},{"key":"C","text":"导游服务费用"},{"key":"D","text":"导游服务特点"}],"answer":"C","keys":["C"],"explanation":"《旅游法》第 60 条，规定安排导游为旅游者提供服务的，应当在包价旅游合同中载明导游服务费用。","type":"单选题"},{"number":45,"stem":"《旅游法》规定（）建立健全旅游综合协调机制，对旅游业发展进行综合协调。","options":[{"key":"A","text":"国家"},{"key":"B","text":"文化与旅游部"},{"key":"C","text":"国务院"},{"key":"D","text":"各级人民政府"}],"answer":"C","keys":["C"],"explanation":"国务院建立健全旅游综合协调机制，对旅游业发展进行综合协调。","type":"单选题"},{"number":46,"stem":"《中华人民共和国旅游法》规定，各级（）应当组织对本级政府编制的旅游发展规划的执行情况进行评估，并向社会公布。","options":[{"key":"A","text":"人民政府"},{"key":"B","text":"旅游行业组织"},{"key":"C","text":"规划主管部门"},{"key":"D","text":"旅游主管部门"}],"answer":"A","keys":["A"],"explanation":"《旅游法》第 22 条规定，各级人民政府应当组织对本级政府编制的旅游发展规划的执行情况进行评估，并向社会公布。","type":"单选题"},{"number":47,"stem":"根据《旅游法》的规定，因未达到约定人数不能出团的，组团社经征得（），可以委托其他旅行社履行合同。","options":[{"key":"A","text":"多数旅游者的同意"},{"key":"B","text":"全体旅游者同意"},{"key":"C","text":"旅游者授权"},{"key":"D","text":"旅游者书面同意"}],"answer":"D","keys":["D"],"explanation":"《旅游法》第 63 条规定，因未达到约定人数不能出团的，组团社经征得旅游者书面同意，可以委托其他旅行社履行合同。","type":"单选题"},{"number":48,"stem":"依据《民法典》，限制民事行为能力人，实施民事法律行为由其法定代理人代理或者经其法定代理人同意、追认。但是，可以独立实施纯获利益的民事法律行为或者与其智力、（ ）相适应的民事法律行为。","options":[{"key":"A","text":"精神健康状况"},{"key":"B","text":"身体健康状况"},{"key":"C","text":"身体和精神健康状况"},{"key":"D","text":"身体或者精神健康状况"}],"answer":"A","keys":["A"],"explanation":"《民法典》第 22 条规定，不能完全辨认自己行为的成年人为限制民事行为能力人，实施民事法律行为由其法定代理人代理或者经其法定代理人同意、追认；但是，可以独立实施纯获利益的民事法律行为或者与其智力、精神健康状况相适应的民事法律行为。","type":"单选题"},{"number":49,"stem":"当事人自知道或者应当知道撤销事由之日起（）内没有行使撤销权的，撤销权消灭。","options":[{"key":"A","text":"3 个月"},{"key":"B","text":"6 个月"},{"key":"C","text":"1 年"},{"key":"D","text":"5 年"}],"answer":"C","keys":["C"],"explanation":"当事人自知道或者应当知道撤销事由之日起 1 年内、重大误解的当事人自知道或者应当知道撤销事由之日起 90 日内没有行使撤销权，撤销权消灭。","type":"单选题"},{"number":50,"stem":"《民法典》规定，民事主体有证据证明行为人正在实施或者即将实施侵害其人格权的违法行为，不及时制止将使其合法权益受到难以弥补的损害的，有权依法向（）申请采取责令行为人停止有关行为的措施。","options":[{"key":"A","text":"公安机关"},{"key":"B","text":"居委会"},{"key":"C","text":"人民法院"},{"key":"D","text":"仲裁委员会"}],"answer":"C","keys":["C"],"explanation":"《民法典》第 997 条规定，民事主体有证据证明行为人正在实施或者即将实施侵害其人格权的违法行为，不及时制止将使其合法权益受到难以弥补的损害的，有权依法向人民法院申请采取责令行为人停止有关行为的措施。","type":"单选题"},{"number":51,"stem":"有财产的无民事行为能力人、限制民事行为能力人造成他人损害的，（）。","options":[{"key":"A","text":"从本人财产中支付赔偿费用，不足部分由监护人赔偿"},{"key":"B","text":"由监护人赔偿，不足部分从本人财产中支付"},{"key":"C","text":"从本人财产中支付赔偿费用，监护人不承担赔偿责任"},{"key":"D","text":"由监护人赔偿，本人不支付赔偿费用"}],"answer":"A","keys":["A"],"explanation":"《民法典》侵权责任编第 1188 条第 2 款规定，有财产的无民事行为能力人、限制民事行为能力人造成他人损害的，从本人财产中支付赔偿费用；不足部分，由监护人赔偿。","type":"单选题"},{"number":52,"stem":"根据《民法典》的规定，不论加害人主观上是否有过错，只要其行为与损害后果之间存在因果关系，就应承担民事责任，此处适用的归责原则是（）。","options":[{"key":"A","text":"公平责任原则"},{"key":"B","text":"过错责任原则"},{"key":"C","text":"过错推定责任原则"},{"key":"D","text":"无过错责任"}],"answer":"D","keys":["D"],"explanation":"无过错责任原则指不论加害人主观上是否有过错，只要其行为与损害后果之间存在因果关系，就应承担民事责任的归责原则。","type":"单选题"},{"number":53,"stem":"根据《民法典》的规定，以下关于支付违约金的描述，正确的是（）。","options":[{"key":"A","text":"因为合同标的物不同，所以当事人无法约定一方违约时应当向对方支付的违约金的具体金额"},{"key":"B","text":"当事人仅可以约定因违约产生的损失赔偿额的计算方法"},{"key":"C","text":"约定的违约金过分高于造成的损失的，当事人可以请求人民法院予以适当减少"},{"key":"D","text":"当事人就迟延履行约定违约金的，违约方支付违约金后，无须履行债务"}],"answer":"C","keys":["C"],"explanation":"《民法典》585 条规定，当事人可以约定一方违约时应当根据违约情况向对方支付一定数额的违约金，也可以约定因违约产生的损失赔偿额的计算方法。约定的违约金低于造成的损失的，当事人可以请求人民法院或者仲裁机构予以增加；约定的违约金过分高于造成的损失的，当事人可以请求人民法院或者仲裁机构予以适当减少。当事人就迟延履行约定违约金的，违约方支付违约金后，还应当履行债务。","type":"单选题"},{"number":54,"stem":"根据《民法典》的规定，以下关于精神损害赔偿的责任承担，正确的是（）。","options":[{"key":"A","text":"侵害自然人人身权益造成严重精神损害的，被侵权人可以选择对方承担精神损害赔偿或人身损害赔偿"},{"key":"B","text":"因故意侵害自然人人身意义的特定物造成精神损害的，被侵权人有权请求精神损害赔偿"},{"key":"C","text":"因重大过失侵害自然人人身意义的特定物造成精神损害的，被侵权人有权请求精神损害赔偿"},{"key":"D","text":"侵害自然人人身权益造成严重精神损害的，被侵权人有权请求精神损害赔偿"}],"answer":"D","keys":["D"],"explanation":"《民法典》第 1183 条，侵害自然人人身权益造成严重精神损害的，被侵权人有权请求精神损害赔偿。因故意或者重大过失侵害自然人人身意义的特定物造成严重精神损害的，被侵权人有权请求精神损害赔偿。“侵害自然人人身权益造成严重精神损害的……”，此种情况下，被侵权人可以要求对方在承担人身损害赔偿的基础上再承担精神损害赔偿；“因故意侵害自然人人身……精神损害赔偿”“因重大过失侵害自然人人身……精神损害赔偿”两个选项，需要“严重”精神损害，才可以请求赔偿。","type":"单选题"},{"number":55,"stem":"《民法典》规定，采用格式条款订立合同的，提供格式条款的一方应当遵循（）确定当事人之间的权利和义务，并采取合理的方式提示对方注意免除或者减轻其责任等与对方有重大利害关系的条款。","options":[{"key":"A","text":"平等原则"},{"key":"B","text":"公平原则"},{"key":"C","text":"诚实信用原则"},{"key":"D","text":"自愿原则"}],"answer":"B","keys":["B"],"explanation":"《民法典》第 496 条规定，采用格式条款订立合同的，提供格式条款的一方应当遵循公平原则确定当事人之间的权利和义务，并采取合理的方式提示对方注意免除或者减轻其责任等与对方有重大利害关系的条款。","type":"单选题"},{"number":56,"stem":"《旅行社条例实施细则》规定，设立社应当加强对分社和服务网点的管理，对服务网点实行统一管理、统一财务、统一招徕和（）的服务规范。","options":[{"key":"A","text":"统一人事"},{"key":"B","text":"统一经费"},{"key":"C","text":"统一咨询"},{"key":"D","text":"统一接待"}],"answer":"C","keys":["C"],"explanation":"解析旅行社应当加强对服务网点的管理，实行统一管理、统一财务、统一招徕和统一咨询的服务规范。","type":"单选题"},{"number":57,"stem":"导游发现旅行社以“不合理低价游”组织旅游活动的，应该向当地（）举报。","options":[{"key":"A","text":"依法成立的旅游行业组织"},{"key":"B","text":"公安部门"},{"key":"C","text":"市场监督管理部门"},{"key":"D","text":"旅游行政管理部门"}],"answer":"D","keys":["D"],"explanation":"不合理低价游”属于旅游行政管理部门管辖范围。","type":"单选题"},{"number":58,"stem":"下列关于申请补发旅行社业务经营许可证及副本的说法，正确的是（）。","options":[{"key":"A","text":"可以向原许可的旅游行政管理部门申请"},{"key":"B","text":"应当通过县级以上旅游行政管理部门网站，刊登损毁或者遗失作废声明"},{"key":"C","text":"应当向所在地旅游行政管理部门申请"},{"key":"D","text":"应当向原许可的旅游行政管理部门申请"}],"answer":"D","keys":["D"],"explanation":"《旅行社条例实施细则》第 11 条规定，旅行社因业务经营需要，可以向原许可的旅游行政管理部门申请核发旅行社业务经营许可证副本。旅行社业务经营许可证及副本，由国务院旅游行政主管部门制定统一样式，国务院旅游行政主管部门和省级旅游行政管理部门分别印制。旅行社业务经营许可证及副本损毁或者遗失的，旅行社应当向原许可的旅游行政管理部门申请换发或者补发。申请补发旅行社业务经营许可证及副本的，旅行社应当通过本省、自治区、直辖市范围内公开发行的报刊，或者省级以上旅游行政管理部门网站，刊登损毁或者遗失作废声明。","type":"单选题"},{"number":59,"stem":"导游张某带团前往某景区，途中遭遇洪水危及旅游者人身、财产安全。对此，旅行社及其导游张某应当采取必要的处置措施，并依据《旅行社条例》及时报告（）。","options":[{"key":"A","text":"旅游行政管理部门"},{"key":"B","text":"事故发生地人民政府"},{"key":"C","text":"安全生产监督管理部门"},{"key":"D","text":"旅行社所在地人民政府"}],"answer":"A","keys":["A"],"explanation":"《旅行社条例》第 39 条规定，旅行社对可能危及旅游者人身、财产安全的事项，应当向旅游者作出真实的说明和明确的警示，并采取防止危害发生的必要措施。发生危及旅游者人身安全的情形的，旅行社及其委派的导游人员、领队人员应当采取必要的处置措施并及时报告旅游行政管理部门；在境外发生的，还应当及时报告中华人民共和国驻该国使领馆、相关驻外机构、当地警方。","type":"单选题"},{"number":60,"stem":"在线旅游经营者未依法取得旅行社业务经营许可开展相关业务的，依照《中华人民共和国旅游法》第 95 条的规定，由（）文化和旅游主管部门责令改正，没收违法所得，并处 1万元以上 10 万元以下罚款。","options":[{"key":"A","text":"县级"},{"key":"B","text":"县级以上"},{"key":"C","text":"所在地"},{"key":"D","text":"省级"}],"answer":"B","keys":["B"],"explanation":"《在线旅游经营服务管理暂行规定》第 32 条规定，在线旅游经营者未依法取得旅行社业务经营许可开展相关业务的，依照《旅游法》第 95 条的规定，由县级以上文化和旅游主管部门责令改正，没收违法所得，并处 1 万元以上 10 万元以下罚款。","type":"单选题"},{"number":61,"stem":"《文化和旅游市场信用管理规定》规定，认定部门应当自作出准予信用修复决定之日起（），解除对失信主体的相关管理措施。","options":[{"key":"A","text":"5 个工作日内"},{"key":"B","text":"7 个工作日内"},{"key":"C","text":"10 个工作日内"},{"key":"D","text":"15 个工作日内"}],"answer":"A","keys":["A"],"explanation":"《文化和旅游市场信用管理规定》第 27 条规定，认定部门应当自作出准予信用修复决定之日起 5 个工作日内，解除对失信主体的相关管理措施。","type":"单选题"},{"number":62,"stem":"某旅行社组团到香港旅游，但是在出发日前一天，发现整团签证时间有误，于是告知旅游者解除旅游合同。根据《旅行社服务质量赔偿标准》规定，旅行社应当赔偿旅游者旅游费用总额的（）违约金。","options":[{"key":"A","text":"5%"},{"key":"B","text":"10%"},{"key":"C","text":"15%"},{"key":"D","text":"20%"}],"answer":"C","keys":["C"],"explanation":"出境旅游（含赴台游）应提前 30 日（不含 30 日）通知旅游者，否则应向旅游者全额退还预付旅游费用，并按规定向旅游者支付违约金：出发前 3 日至 1 日，支付旅游费用总额 15%的违约金。","type":"单选题"},{"number":63,"stem":"根据《导游管理办法》的规定，旅游行业组织、旅行社为导游证申请人申请取得导游证隐瞒有关情况或者提供虚假材料，由县级以上旅游主管部门责令改正，并可以处（）罚款。","options":[{"key":"A","text":"1000 以下"},{"key":"B","text":"3000 元以下"},{"key":"C","text":"5000 元以下"},{"key":"D","text":"2000 元以上 1 万元以下"}],"answer":"C","keys":["C"],"explanation":"《导游管理办法》第 36 条，旅游行业组织、旅行社为导游证申请人申请取得导游证隐瞒有关情况或者提供虚假材料，由县级以上旅游主管部门责令改正，并可以处 5000 元以下罚款。","type":"单选题"},{"number":64,"stem":"《导游管理办法》规定，导游为旅游者提供服务应当接受（），但另有规定的除外。","options":[{"key":"A","text":"旅行社委派"},{"key":"B","text":"旅游主管部门委派"},{"key":"C","text":"旅游者自主选择"}],"answer":"A","keys":["A"],"explanation":"《导游管理办法》第 19 条规定，导游为旅游者提供服务应当接受旅行社委派，但另有规定的除外。","type":"单选题"},{"number":65,"stem":"根据《导游人员管理条例》规定，导游人员对旅游行政部门的行政行为不服时，导游可以（）。","options":[{"key":"A","text":"向上一级旅游行政机关申请复议"},{"key":"B","text":"提请仲裁机构仲裁"},{"key":"C","text":"向旅游执法机构申请调解"},{"key":"D","text":"向作出行政处罚的旅游行政机关申请复议"}],"answer":"A","keys":["A"],"explanation":"导游人员对旅游行政部门下列行政行为不服时，导游可以申请复议——有权向上一级旅游行政机关申请复议，有权向人民法院提起诉讼：对罚款、吊销导游证、责令改正、暂扣导游证等行政处罚不服；认为符合法定条件申领导游资格证书和导游证，旅游行政部门拒绝颁发或不予答复；认为旅游行政部门违法要求导游人员履行义务；认为旅游行政部门侵犯导游人员人身权、财产权；法律、法规规定可以提起行政诉讼或者可以申请复议的其他具体行政行为。","type":"单选题"},{"number":66,"stem":"《导游管理办法》规定，导游证的有效期为（）。导游需要在导游证有效期届满后继续执业的，应当在有效期限届满前（）内，通过全国旅游监管服务信息系统向所在地旅游主管部门提出申请。","options":[{"key":"A","text":"3 年，1 个月"},{"key":"B","text":"5 年，3 个月"},{"key":"C","text":"3 年，3 个月"},{"key":"D","text":"2 年，6 个月"}],"answer":"C","keys":["C"],"explanation":"《导游管理办法》第 13 条，导游证的有效期为 3 年。导游需要在导游证有效期届满后继续执业的，应当在有效期限届满前 3 个月内，通过全国旅游监管服务信息系统向所在地旅游主管部门提出申请。","type":"单选题"},{"number":67,"stem":"导游从事领队服务须具有两年以上旅游从业经历，这里的从业经历是指（）。","options":[{"key":"A","text":"导游从业"},{"key":"B","text":"旅行社管理"},{"key":"C","text":"旅行社业务经营、管理或者导游等相关"},{"key":"D","text":"旅行社业务经营"}],"answer":"C","keys":["C"],"explanation":"旅行社为组织旅游者出境旅游委派的领队，应当具备下列条件：（1）取得导游证；（2）具有大专以上学历；（3）取得相关语言水平测试等级证书或通过外语语种导游资格考试，旅行社委派的领队，应当掌握相关旅游目的地国家（地区）语言或者英语，但为赴港澳台地区旅游委派的领队除外；（4）具有 2 年以上旅行社业务经营、管理或者导游等相关从业经历；（5）与委派其从事领队业务的取得出境旅游业务经营许可的旅行社订立劳动合同。","type":"单选题"},{"number":68,"stem":"《导游人员管理条例》规定，具有（）学历，身体健康，具有适应导游需要的基本知识和语言表达能力的中华人民共和国公民，可以参加导游人员资格考试。","options":[{"key":"A","text":"高等专业学校、大专院校或者以上"},{"key":"B","text":"高级中学、高等专业学校或者以上"},{"key":"C","text":"高级中学、中等专业学校或者以上"},{"key":"D","text":"初级中学、中等专业学校或者以上"}],"answer":"C","keys":["C"],"explanation":"国家实行全国统一的导游人员资格考试制度，参加导游人员资格考试的条件如下：中华人民共和国公民；具有高级中学、中等专业学校或者以上学历；身体健康；具有适应导游需要的基本知识和语言表达能力。","type":"单选题"},{"number":69,"stem":"《导游人员管理条例》规定，导游人员在引导旅游者旅行、游览过程中，应当就可能发生危及旅游者人身、财物安全的情况，向旅游者作出（），并按照旅行社的要求采取防止危害发生的措施。","options":[{"key":"A","text":"真实说明"},{"key":"B","text":"明确警示"},{"key":"C","text":"真实说明和明确警示"},{"key":"D","text":"真实说明或明确警示"}],"answer":"C","keys":["C"],"explanation":"《导游人员管理条例》第 14 条规定，导游人员在引导旅游者旅行、游览过程中，应当就可能发生危及旅游者人身、财物安全的情况，向旅游者作出真实说明和明确警示，并按照旅行社的要求采取防止危害发生的措施。","type":"单选题"},{"number":70,"stem":"依据《中华人民共和国消费者权益保护法实施条例》，经营者决定停业或者迁移服务场所的，应当提前（）在经营场所、网站、网店首页等醒目位置公告经营者有效联系方式等信息。","options":[{"key":"A","text":"15 日"},{"key":"B","text":"30 日"},{"key":"C","text":"45 日"},{"key":"D","text":"60 日"}],"answer":"B","keys":["B"],"explanation":"经营者决定停业或者迁移服务场所的，应当提前 30 日在其经营场所、网站、网店首页等的醒目位置公告经营者的有效联系方式等信息。（第 21 条）","type":"单选题"},{"number":71,"stem":"依据《中华人民共和国消费者权益保护法实施条例》，对于侵害众多消费者合法权益的行为，下列哪一主体可以向人民法院提起诉讼（）。","options":[{"key":"A","text":"县级消费者协会"},{"key":"B","text":"中国消费者协会以及省、自治区、直辖市设立的消费者协会"},{"key":"C","text":"市场监督管理所"},{"key":"D","text":"普通消费者个人"}],"answer":"B","keys":["B"],"explanation":"A 项错误：有权提起该类诉讼的仅限中国消费者协会和省（自治区、直辖市）设立的消费者协会，县级消费者协会无权提起。C 项错误：市场监督管理所属于行政机关，不能作为该类诉讼的起诉主体。D 项错误：普通消费者个人只能就自身合法权益提起民事诉讼，不能针对侵害众多消费者合法权益的行为提起该类诉讼。","type":"单选题"},{"number":72,"stem":"《国家旅游局关于不文明行为记录管理暂行办法》规定，“旅游不文明行为记录”信息实行动态管理。旅游不文明行为未受到法律法规处罚，但造成严重社会影响的，信息保存期限（）。","options":[{"key":"A","text":"6 个月至 1 年"},{"key":"B","text":"1 年至 3 年"},{"key":"C","text":"2 年至 4 年"},{"key":"D","text":"3 年至 5 年"}],"answer":"B","keys":["B"],"explanation":"《办法》第 9 条规定，“旅游不文明行为记录”信息保存期限为 1- 5 年，实行动态管理。① 行为当事人违反刑法的，信息保存期限为 3- 5 年；② 行为当事人受到行政处罚或法院判决承担责任的，信息保存期限为 2- 4 年；③ 行为未受到法律法规处罚，但造成严重社会影响的，信息保存期限为 1- 3 年。","type":"单选题"},{"number":73,"stem":"根据《旅游法》第 94 条的规定，旅游者与旅游经营者发生纠纷，旅游者一方人数众多并有共同请求的，可以（）参加协商、调解、仲裁、诉讼活动。","options":[{"key":"A","text":"推选代表人"},{"key":"B","text":"由旅游投诉处理机构指定代理人"},{"key":"C","text":"由人民法院指定代表人"},{"key":"D","text":"由旅游经营者选定代表"}],"answer":"A","keys":["A"],"explanation":"《旅游法》第 94 条规定：“旅游者与旅游经营者发生纠纷，旅游者一方人数众多并有共同请求的，可以推选代表人参加协商、调解、仲裁、诉讼活动。”代表人由旅游者一方自行推选，而非由旅游投诉处理机构、人民法院指定或者旅游经营者选定。","type":"单选题"},{"number":74,"stem":"根据可能对旅游者造成的危害程度、紧急程度和发展态势，风险提示级别分为一级、二级、三级和四级，其中三级标示的颜色是（）。","options":[{"key":"A","text":"红色"},{"key":"B","text":"黄色"},{"key":"C","text":"橙色"},{"key":"D","text":"蓝色"}],"answer":"B","keys":["B"],"explanation":"解析根据可能对旅游者造成的危害程度、紧急程度和发展态势，风险提示级别分为一级（特别严重）、二级（严重）、三级（较重）和四级（一般），分别用红色、橙色、黄色和蓝色标示。","type":"单选题"},{"number":75,"stem":"发布突发事件三级、四级警报后，县级以上地方各级人民政府应当根据即将发生的突发事件的特点和可能造成的危害，采取下列（）措施。","options":[{"key":"A","text":"启动应急预案"},{"key":"B","text":"责令应急救援队伍、负有特定职责的人员进入待命状态"},{"key":"C","text":"加强对重要基础设施的安全保卫"},{"key":"D","text":"维护社会治安"}],"answer":"A","keys":["A"],"explanation":"其余三项属于突发事件一级、二级警报应采取的措施。","type":"单选题"},{"number":76,"stem":"根据《旅游安全管理办法》规定，旅游主管部门在接到旅游经营者的报告后，应当向同级人民政府和上级旅游主管部门报告。一般旅游突发事件上报至（）。","options":[{"key":"A","text":"市级旅游主管部门"},{"key":"B","text":"省级旅游主管部门"},{"key":"C","text":"文化和旅游部"},{"key":"D","text":"设区的市级旅游主管部门"}],"answer":"D","keys":["D"],"explanation":"旅游突发事件处置结束后，发生地旅游主管部门应当及时查明突发事件的发生经过和原因，总结突发事件应急处置工作的经验教训，制定改进措施，并在 30 日内按照下列程序提交总结报告：（1）一般旅游突发事件向设区的市级旅游主管部门提交；（2）较大旅游突发事件逐级向省级旅游主管部门提交；（3）重大和特别重大旅游突发事件逐级向文化和旅游部提交。","type":"单选题"},{"number":77,"stem":"根据《出境入境管理法》规定，中国公民有下列（）情形不准出境。","options":[{"key":"A","text":"持有效出境入境证件"},{"key":"B","text":"拒绝接受边防检查的"},{"key":"C","text":"属于重大刑事案件目击证人"},{"key":"D","text":"因非法出境被其他国家或者地区遣返，已满不准出境规定年限的"}],"answer":"B","keys":["B"],"explanation":"《出境入境管理法》第 12 条规定，中国公民有下列情形之一的，不准出境：（1）未持有效出境入境证件或者拒绝、逃避接受边防检查的；（2）被判处刑罚尚未执行完毕或者属于刑事案件被告人、犯罪嫌疑人的；（3）有未了结的民事案件，人民法院决定不准出境的；（4）因妨害国（边）境管理受到刑事处罚或者因非法出境、非法居留、非法就业被其他国家或者地区遣返，未满不准出境规定年限的；（5）可能危害国家安全和利益，国务院有关主管部门决定不准出境；（6）法律、行政法规规定不准出境的其他情形。因此，正确选项是 B。","type":"单选题"},{"number":78,"stem":"《食品安全法》规定，生产不符合食品安全标准的食品，消费者除要求赔偿损失外，还可以向生产者或者经营者要求支付（）的赔偿金。","options":[{"key":"A","text":"支付价款 3 倍"},{"key":"B","text":"价款 3 倍和损失 10 倍"},{"key":"C","text":"损失 10 倍"},{"key":"D","text":"价款 10 倍或者损失 3 倍"}],"answer":"D","keys":["D"],"explanation":"《食品安全法》第 148 条规定，生产不符合食品安全标准的食品或者经营明知是不符合食品安全标准的食品，消费者除要求赔偿损失外，还可以向生产者或者经营者要求支付价款 10 倍或者损失 3 倍的赔偿金。","type":"单选题"},{"number":79,"stem":"（），游艺娱乐场所设置的电子游戏机不得向未成年人提供。","options":[{"key":"A","text":"除公休日外"},{"key":"B","text":"除寒暑假外"},{"key":"C","text":"除国家法定节假日外"},{"key":"D","text":"除公休日和国家法定节假日外"}],"answer":"C","keys":["C"],"explanation":"《娱乐场所管理条例》第 23 条规定，歌舞娱乐场所不得接纳未成年人。除国家法定节假日外，游艺娱乐场所设置的电子游戏机不得向未成年人提供。","type":"单选题"},{"number":80,"stem":"《中华人民共和国食品安全法》规定，医疗机构发现其接收的病人属于食源性疾病病人或者疑似病人的，应当按照规定及时将相关信息向所在地县级人民政府卫生行政部门报告。县级人民政府卫生行政部门认为与食品安全有关的，应当及时通报（）。","options":[{"key":"A","text":"县级人民政府"},{"key":"B","text":"上级食品安全监督管理部门"},{"key":"C","text":"同级食品安全监督管理部门"},{"key":"D","text":"县级人民政府质量监督管理部门"}],"answer":"C","keys":["C"],"explanation":"《食品安全法》第 104 条规定，医疗机构发现其接收的病人属于食源性疾病病人或者疑似病人的，应当按照规定及时将相关信息向所在地县级人民政府卫生行政部门报告。县级人民政府卫生行政部门认为与食品安全有关的，应当及时通报同级食品安全监督管理部门。","type":"单选题"},{"number":81,"stem":"根据《风景名胜区条例》，施工单位在施工过程中对周围景物、林草植被造成破坏的，由风景名胜区管理机构责令停止违法行为、限期恢复原状或者采取其他补救措施，并处（）的罚款。","options":[{"key":"A","text":"1 万元以上 5 万元以下"},{"key":"B","text":"2 万元以上 10 万元以下"},{"key":"C","text":"5 万元以上 20 万元以下"},{"key":"D","text":"10 万元以上 50 万元以下"}],"answer":"B","keys":["B"],"explanation":"《风景名胜区条例》第四十六条：违反本条例的规定，施工单位在施工过程中，对周围景物、水体、林草植被、野生动物资源和地形地貌造成破坏的，由风景名胜区管理机构责令停止违法行为、限期恢复原状或者采取其他补救措施，并处 2 万元以上 10 万元以下的罚款；逾期未恢复原状或者采取有效措施的，由风景名胜区管理机构责令停止施工。","type":"单选题"},{"number":82,"stem":"根据《自然保护区条例》规定，自然保护区由（）批准设立。","options":[{"key":"A","text":"县级以上地方人民政府"},{"key":"B","text":"省级林业草原主管部门"},{"key":"C","text":"国务院或者省、自治区、直辖市人民政府"},{"key":"D","text":"国务院林业草原主管部门"}],"answer":"C","keys":["C"],"explanation":"《自然保护区条例》第二条：本条例所称自然保护区，是指由国务院或者省、自治区、直辖市人民政府批准设立，以保护典型的自然生态系统、珍稀濒危野生动植物物种的天然集中分布区、有特殊意义的自然遗迹等为主要目的，实现自然资源科学保护和合理利用的特定陆地和海洋区域。A 项错误，县级以上地方人民政府没有批准设立自然保护区的权限，批准设立主体限于国务院和省、自治区、直辖市人民政府，依据条例第二条。B 项错误，林业草原主管部门承担的是自然保护区的监督管理职责，不是批准设立主体，依据条例第六条。C 项正确，与条例规定完全一致。D 项错误，国务院林业草原主管部门负责全国自然保护区的监督管理，也不是批准设立主体，依据条例第六条。","type":"单选题"},{"number":83,"stem":"在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以（）推进中华民族伟大复兴","options":[{"key":"A","text":"中国特色社会主义现代化"},{"key":"B","text":"马克思主义"},{"key":"C","text":"马克思主义中国化"},{"key":"D","text":"中国式现代化"}],"answer":"D","keys":["D"],"explanation":"中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","type":"单选题"},{"number":84,"stem":"《港区国安法》规定，下列（）情形的，对有关犯罪行为人、犯罪嫌疑人、被告人可以从轻、减轻处罚；犯罪较轻的，可以免除处罚。","options":[{"key":"A","text":"提供重要线索侦破本案件的"},{"key":"B","text":"揭发他人犯罪行为的"},{"key":"C","text":"自动投案，如实供述自己的罪行的"},{"key":"D","text":"在犯罪过程中，被动放弃犯罪"}],"answer":"C","keys":["C"],"explanation":"第 33 条规定。正确的说法是：“揭发他人犯罪行为，查证属实，或者提供重要线索得以侦破其他案件的”。","type":"单选题"},{"number":85,"stem":"《英烈法》规定，国务院有关部门、军队有关部门和地方人民政府应当关心英雄烈士遗属的生活情况，（）走访慰问英雄烈士遗属。","options":[{"key":"A","text":"每年"},{"key":"B","text":"每季度"},{"key":"C","text":"每半年"},{"key":"D","text":"每年定期"}],"answer":"D","keys":["D"],"explanation":"解析国务院有关部门、军队有关部门和地方人民政府应当关心英雄烈士遗属的生活情况，每年定期走访慰问英雄烈士遗属。","type":"单选题"},{"number":86,"stem":"依据文化和旅游部《旅游强国建设“十五五”规划》，推动旅游业高质量发展，要以推进文旅深度融合为（）。","options":[{"key":"A","text":"主题"},{"key":"B","text":"主线"},{"key":"C","text":"抓手"},{"key":"D","text":"保障"}],"answer":"B","keys":["B"],"explanation":"文档原文：坚持旅游为民，以推动高质量发展为主题，以推进文旅深度融合为主线，统筹政府与市场、供给与需求、保护与开发、国内与国际、发展与安全。A 项错误，规划明确的主题是“推动高质量发展”，而非文旅深度融合，故 A 错误。B 项正确，以推进文旅深度融合为主线，符合规划原文，故 B 正确。C 项错误，抓手非规划表述，故 C 错误。D 项错误，保障非规划表述，故 D 错误。","type":"单选题"},{"number":87,"stem":"世界上第一次大规模的、有组织的、纯粹以商业为目的的旅游活动是（）。","options":[{"key":"A","text":"莱斯特到拉夫巴勒的禁酒大会"},{"key":"B","text":"利物浦之行"},{"key":"C","text":"苏格兰之行"},{"key":"D","text":"莱斯特到巴黎之行"}],"answer":"B","keys":["B"],"explanation":"解析 1845，组织 350 人从莱斯特到利物浦团体消遣性旅游（为期一周），是世界上第一次大规模的、有组织的、纯粹以商业为目的的旅游活动。","type":"单选题"},{"number":88,"stem":"（）年，上海商业储备银行总经理陈光甫在银行内部创设旅游部。","options":[{"key":"A","text":"1923"},{"key":"B","text":"1925"},{"key":"C","text":"1927"},{"key":"D","text":"1929"}],"answer":"A","keys":["A"],"explanation":"解析 1923 年 8 月：上海商业储备银行总经理陈光甫在银行内部创设旅游部。","type":"单选题"},{"number":89,"stem":"下列选项中，不属于导游服务未来发展趋势的一项是（）。","options":[{"key":"A","text":"导游服务内容专业化"},{"key":"B","text":"导游服务手段科技化"},{"key":"C","text":"导游服务方法多样化"},{"key":"D","text":"导游服务需求标准化"}],"answer":"D","keys":["D"],"explanation":"导游服务未来发展趋势：导游服务内容专业化；导游服务手段科技化；导游服务方法多样化；导游服务需求个性化。","type":"单选题"},{"number":90,"stem":"导游人员协调左右的纽带作用主要体现在（）。","options":[{"key":"A","text":"将旅游者的意见、要求、建议及投诉传递至旅行社和旅游行政管理部门"},{"key":"B","text":"既代表旅行社利益，又维护旅游者合法权益"},{"key":"C","text":"联络和安排旅行社与饭店、餐馆、景区、交通、商店、娱乐场所等单位"},{"key":"D","text":"向中外游客介绍中国文化，展示中国魅力"}],"answer":"C","keys":["C"],"explanation":"第一联络员：协调旅行社与饭店、餐馆、景区、交通、商店、娱乐场所等单位，在各旅游单位之间起着重要的协调作用；中心位置：各旅游单位的相互协作是生活服务得以顺利进行的重要保障，对提高旅游质量至关重要，导游处在各项旅游服务协调的中心位置，责任重大且作用显著。","type":"单选题"},{"number":91,"stem":"下列晋升导游等级的描述，正确的选项是（）。","options":[{"key":"A","text":"初级、中级导游在获得下列表彰奖励 3 年内，可以通过激励晋升的方式申请晋升一个导游等级"},{"key":"B","text":"多次获得或者同时获得多项表彰奖励的，只晋升 2 次导游等级"},{"key":"C","text":"省级文化和旅游主管部门组织的省级导游大赛一、二、三等奖，可申请激励晋升"},{"key":"D","text":"省级以上劳动模范、五一劳动奖章、青年岗位能手、三八红旗手、巾帼建功标兵，可申请激励晋升"}],"answer":"D","keys":["D"],"explanation":"初级、中级导游在获得下列表彰奖励 2 年内，可以通过激励晋升的方式申请晋升一个导游等级。多次获得或者同时获得多项表彰奖励的，只晋升 1 次导游等级：① 国务院文化和旅游主管部门组织的全国导游大赛一、二、三等奖；② 省级文化和旅游主管部门组织的省级导游大赛一等奖；③ 省级以上劳动模范、五一劳动奖章、青年岗位能手、三八红旗手、巾帼建功标兵；④ 国务院文化和旅游主管部门认定的其他符合激励晋升的情况。","type":"单选题"},{"number":92,"stem":"（）是旅游行业服务理念的高度提炼和概括。","options":[{"key":"A","text":"秉承契约，用心服务"},{"key":"B","text":"富强民主，文明和谐"},{"key":"C","text":"恪守道德，爱岗敬业"},{"key":"D","text":"游客为本，服务至诚"}],"answer":"D","keys":["D"],"explanation":"“游客为本，服务至诚”作为旅游行业的服务理念，也是对改革开放以来业已形成的旅游行业服务理念的高度提炼和概括。","type":"单选题"},{"number":93,"stem":"在社会主义核心价值观中，国家层面的价值目标是（）。","options":[{"key":"A","text":"富强、民主、文明、和谐"},{"key":"B","text":"自由、平等、公正、法治"},{"key":"C","text":"爱国、敬业、诚信、友善"},{"key":"D","text":"游客为本，服务至诚"}],"answer":"A","keys":["A"],"explanation":"党的十八大提出，倡导：富强、民主、文明、和谐（国家层面的价值目标）；倡导自由、平等、公正、法治（社会层面的价值取向）；倡导爱国、敬业、诚信、友善（公民个人层面的价值准则），积极培育和践行社会主义核心价值观。","type":"单选题"},{"number":94,"stem":"在 TPO 原则中，0 代表（）。","options":[{"key":"A","text":"时间"},{"key":"B","text":"地点"},{"key":"C","text":"场合"},{"key":"D","text":"氛围"}],"answer":"C","keys":["C"],"explanation":"遵循 TPO 原则：Time（时间）、Place（地点）、Occasion（场合）","type":"单选题"},{"number":95,"stem":"地陪导游每天带团前，应至少提前（）分钟抵达集合地点。","options":[{"key":"A","text":"10"},{"key":"B","text":"15"},{"key":"C","text":"20"},{"key":"D","text":"30"}],"answer":"A","keys":["A"],"explanation":"提前到达：地陪应提前 10 分钟到达约定集合点。","type":"单选题"},{"number":96,"stem":"若旅游团先前往饭店，核对和商定旅游日程应在（）。","options":[{"key":"A","text":"前往饭店的行车途中"},{"key":"B","text":"饭店大厅"},{"key":"C","text":"饭店单独的会议室"},{"key":"D","text":"机场大厅"}],"answer":"B","keys":["B"],"explanation":"若旅游团先前往饭店，则可在旅游团入住后进行，地点宜在公共场所，如饭店大厅等。","type":"单选题"},{"number":97,"stem":"进入酒店以后，入境旅游团应由（）负责分发房卡。","options":[{"key":"A","text":"领队"},{"key":"B","text":"团长"},{"key":"C","text":"全陪"},{"key":"D","text":"地陪"}],"answer":"A","keys":["A"],"explanation":"拿到房卡后，全陪要协助领队根据准备好的分房名单分发房卡。","type":"单选题"},{"number":98,"stem":"来自法国的游客卢女士要乘坐 14:00 的飞机从武汉飞往广州，地陪导游老王最晚（）之前，抵达机场。","options":[{"key":"A","text":"11:00"},{"key":"B","text":"12:00"},{"key":"C","text":"12:30"},{"key":"D","text":"13:00"}],"answer":"B","keys":["B"],"explanation":"乘出境航班提前 3 小时或按照航空公司规定的时间；乘国内航班提前 2 小时；乘火车、轮船提前 1 小时。","type":"单选题"},{"number":99,"stem":"下列内容中，（）不属于地陪导游后续工作范畴的。","options":[{"key":"A","text":"接团小结"},{"key":"B","text":"处理遗留问题"},{"key":"C","text":"与全陪结账"},{"key":"D","text":"提交物品"}],"answer":"C","keys":["C"],"explanation":"与全陪结账, 是送站服务, 不是后续服务。","type":"单选题"},{"number":100,"stem":"在带团过程中, 全陪老王应走在旅游团的 ( )。","options":[{"key":"A","text":"最前方"},{"key":"B","text":"中间"},{"key":"C","text":"最后"},{"key":"D","text":"与地陪并排的位置"}],"answer":"C","keys":["C"],"explanation":"主动殿后，随时清点人数及时发现未跟上团队的旅游者，避免其走失。（强调动作目的）","type":"单选题"},{"number":101,"stem":"导游在发车前应当提醒游客全程系好安全带，对不听劝导、坚持不使用安全带的，导游应该（）。","options":[{"key":"A","text":"将客人驱赶下车，拒绝继续服务"},{"key":"B","text":"在安全前提下，与司机共同劝导"},{"key":"C","text":"让客人签字，一旦出事后果自负"},{"key":"D","text":"报告旅行社，解除旅游合同"}],"answer":"B","keys":["B"],"explanation":"功导义务：对不听劝导、坚持不使用安全带的，在车辆安全停靠的前提下，导游与驾驶员共同做好劝导服务。","type":"单选题"},{"number":102,"stem":"“雪峰如老衲，保假如美人”这句话采用的修辞方式是（）。","options":[{"key":"A","text":"比喻"},{"key":"B","text":"比拟"},{"key":"C","text":"夸张"},{"key":"D","text":"引用"}],"answer":"A","keys":["A"],"explanation":"比喻（明喻）：“雷峰如老衲，保俶如美人”，将西湖边的雷峰塔和保俶塔形容得既凝练简明，又生动传神。","type":"单选题"},{"number":103,"stem":"用于肯定、请求、感叹、祝愿、赞扬、期待等情感表达，一般采用（）。","options":[{"key":"A","text":"高升调"},{"key":"B","text":"低降调"},{"key":"C","text":"平直调"},{"key":"D","text":"曲折调"}],"answer":"B","keys":["B"],"explanation":"低降调：常用于肯定、请求、感叹、祝愿、赞扬、期待等情感表达。句子前半部分音调高，后半部分明显降低。例如“按时完成任务，这次团队协作值得称赞！”（体现肯定、赞许之意）","type":"单选题"},{"number":104,"stem":"在杭州西湖边，导游讲解荷花形态时，用手比画出荷花“出淤泥而不染，濯清涟而不妖”的亭亭玉立之态，让游客仿佛看到荷花在湖中绽放的美景，这段话导游采用（）。","options":[{"key":"A","text":"情感手势语"},{"key":"B","text":"指示手势语"},{"key":"C","text":"象形手势语"},{"key":"D","text":"再现手势语"}],"answer":"C","keys":["C"],"explanation":"象形手势语：导游模拟人或事物形状、动作的手势语，能给旅游者留下生动印象，但避免机械模仿和过多表演痕迹。例如：在杭州西湖边，导游讲解荷花形态时，用手比画出荷花“出淤泥而不染，濯清涟而不妖”的亭亭玉立之态，让游客仿佛看到荷花在湖中绽放的美景。","type":"单选题"},{"number":105,"stem":"导游老王在讲解时抛出感兴趣的问题，故意不马上作答，激发旅游者急于知晓答案的欲望，这是（）的运用。","options":[{"key":"A","text":"虚实结合法"},{"key":"B","text":"触景生情法"},{"key":"C","text":"画龙点睛法"},{"key":"D","text":"制造悬念法"}],"answer":"D","keys":["D"],"explanation":"制造悬念法：导游在讲解时抛出感兴趣的问题，故意不马上作答，激发旅游者急于知晓答案的欲望，从而活跃气氛、激发游兴，使讲解效果更佳。","type":"单选题"},{"number":106,"stem":"导游运用（）介绍北京天坛祈年殿时讲到：内围四根“龙井柱”象征四季，中围十二根“金柱”象征十二个月，外围十二根“檐柱”象征十二个时辰，中层和外层相加二十四根象征二十四节气，三层总共二十八根象征二十八星宿，加上柱顶端八根铜柱共三十六根，象征三十六天罡。","options":[{"key":"A","text":"问答法"},{"key":"B","text":"妙用数字法"},{"key":"C","text":"画龙点睛法"},{"key":"D","text":"触景生情法"}],"answer":"B","keys":["B"],"explanation":"妙用数字法是借用数字说明景观内容的讲解方法。数字能让讲解更清晰、准确、有说服力。如介绍北京天坛祈年殿：“祈年殿殿内柱子数目按天象设立，内围四根‘龙井柱’象征四季，中围十二根‘金柱’象征十二个月，外围十二根‘檐柱’象征十二个时辰，中层和外层相加二十四根象征二十四节气，三层总共二十八根象征二十八星宿，加上柱顶端八根铜柱共三十六根，象征三十六天罡。”","type":"单选题"},{"number":107,"stem":"接待残障游客，应该做到（）。","options":[{"key":"A","text":"发自内心的尊重，尽量为残障旅游者多拍照"},{"key":"B","text":"导游在方便的时候，可以私下打听游客其残疾原因"},{"key":"C","text":"勿对残障者表现出过分关注，尤其不应过度关注其残疾部位"},{"key":"D","text":"在服务程度上，务必要越细致越尽力的位游客服务，不必考虑适度因素"}],"answer":"C","keys":["C"],"explanation":"尊重第一：发自内心的尊重是建立良好互动关系的前提，未经同意，不可随意对残障旅游者拍照。不多问：相处过程中，避免表现得过于好奇。若残障旅游者未主动提及，导游不应擅自打听其残疾原因。不多看：勿对残障者表现出过分关注，尤其不应过度关注其残疾部位在服务姿态上，营造“残障旅游者亦为正常旅游者”的氛围；在服务程度上，务必把握好“适时恰当”这个度。","type":"单选题"},{"number":108,"stem":"导游在带团过程中，提醒游客事项错误的内容是（）。","options":[{"key":"A","text":"不食用存在安全隐患的野菜、野果和不洁食品"},{"key":"B","text":"不直接饮用野外雪水、溪水、泉水、河水、湖水"},{"key":"C","text":"注意饮食卫生，做好用餐安全、适量点餐、杜绝浪费等提示"},{"key":"D","text":"可以在街边小摊品尝当地特色美食"}],"answer":"D","keys":["D"],"explanation":"（1）不食用存在安全隐患的野菜、野果和不洁食品；（2）不直接饮用野外雪水、溪水、泉水、河水、湖水；（3）注意饮食卫生，做好用餐安全、适量点餐、杜绝浪费等提示；（4）严防游客食物中毒。","type":"单选题"},{"number":109,"stem":"导游老王带团行程紧凑时，对于含餐团队，应在抵达餐厅前（）联系负责人，在保持菜肴热度的前提下提前上菜，减少旅游者等待。","options":[{"key":"A","text":"10 分钟"},{"key":"B","text":"15 分钟"},{"key":"C","text":"20 分钟"},{"key":"D","text":"30 分钟"}],"answer":"B","keys":["B"],"explanation":"适当提前上菜时间行程紧凑时，含餐团队抵达餐厅前 15 分钟联系负责人，在保持菜肴热度的前提下提前上菜，减少旅游者等待。","type":"单选题"},{"number":110,"stem":"导游带领游客旅行过程中，操作不当的事项是（）。","options":[{"key":"A","text":"告知游客禁止违规携带火种和易燃易爆物品进入旅游景区"},{"key":"B","text":"告知游客乘坐交通工具时一旦发生火灾，寻找最近的门窗第一时间逃生"},{"key":"C","text":"告知游客遇到火灾时沉着、冷静，不贪恋财物、迅速乘坐电梯逃离"},{"key":"D","text":"告知游客了解火灾逃生路线图，正确选择逃生路线"}],"answer":"C","keys":["C"],"explanation":"解析告知游客禁止违规携带火种和易燃易爆物品进入旅游景区；告知游客乘坐交通工具时一旦发生火灾，寻找最近的门窗第一时间逃生；遇到火灾时沉着、冷静，迅速正确逃生，不贪恋财物、不乘坐电梯、不盲目跳楼；告知游客了解火灾逃生路线图，正确选择逃生路线。","type":"单选题"},{"number":111,"stem":"登山旅游过程中，导游操作正确的是（）。","options":[{"key":"A","text":"尽量少带水和食物以及其它重量物品，避免爬山负重过大"},{"key":"B","text":"雷雨来时尽量攀登高峰，避免在山脚下遭遇泥石流或者山体滑坡"},{"key":"C","text":"登山迷路时应保持冷静，切勿盲目走动，可就近选择视野开阔处等待救援"},{"key":"D","text":"关节疾病患者、心脑血管疾病患者如果身体特征平稳，可以参加高山登山活动"}],"answer":"C","keys":["C"],"explanation":"必备物品：携带足量饮用水、高热量食物、基础急救药品及防晒用品；雷雨来时切勿攀登高峰，不要扶铁栏杆和在大树下避雨，以防雷击。迷路时应保持冷静，及时报警，保持通讯设备电力充足，切勿盲目走动，可就近选择视野开阔处等待救援；登山属高强度耗氧运动，关节疾病患者、心脑血管疾病患者、体质衰弱的老年人及平时缺乏锻炼者均不宜前往高山景区。","type":"单选题"},{"number":112,"stem":"因为雷大大旅行社原因导致行程变更的处理，导游老王应该（）。","options":[{"key":"A","text":"导游立即向游客如实说明情况，尊重游客意见"},{"key":"B","text":"诚恳向旅游者道歉，并告知后续弥补措施，充分征求旅游者意见"},{"key":"C","text":"起因是旅行社原因，因此导游无需再向旅行社汇报"},{"key":"D","text":"根据旅行社意见处理后续行程，无需与游客商议"}],"answer":"B","keys":["B"],"explanation":"导游立即向旅行社如实说明情况，听取处理意见；诚恳向旅游者道歉，并告知后续弥补措施，充分征求旅游者意见；对旅游者进行适当补偿，包括精神补偿和物质补偿，如提供更周到的导游服务、适当加菜或赠送纪念品等。","type":"单选题"},{"number":113,"stem":"根据《出境旅游领队服务规范》，领队应不迟于（）与参团旅游者/联系人联系，再次提醒注意事项。","options":[{"key":"A","text":"出团前 1 日"},{"key":"B","text":"出团前 3 日"},{"key":"C","text":"出团前 7 日"},{"key":"D","text":"出团当天"}],"answer":"A","keys":["A"],"explanation":"根据《出境旅游领队服务规范》，领队应不迟于出团前 1 日与参团旅游者/联系人联系，再次提醒注意事项并请旅游者回复确认。","type":"单选题"},{"number":114,"stem":"关于换餐的要求，导游处理正确的选项是（）。","options":[{"key":"A","text":"若旅游者在用餐 3 小时之前提出换餐，导游必须不折不扣的满足要求"},{"key":"B","text":"导游劝说后，旅游者坚持换餐，导游明确告知费用自理，退还原餐费"},{"key":"C","text":"若旅游者在用餐 3 小时之内才提出换餐，视情况而定"},{"key":"D","text":"如果无法换餐，导游报请接待社，让接待社与组团社协商"}],"answer":"C","keys":["C"],"explanation":"1. 用餐 3 小时前提出换餐的处理：·尽量与餐厅联系，事先向游客讲清楚如能换妥差价由旅游者自理，询问餐厅能否提供相应服务；·若计划中的供餐单位不具备供应西餐或风味餐的能力，可考虑更换餐厅。2. 接近用餐时间或到餐厅后提出换餐的处理：·视情况而定，若该餐厅有该项服务则协助解决；·如果情况复杂且餐厅没有此项服务，一般不应接受此类要求，但应向旅游者做好解释工作。若旅游者仍坚持换餐，可建议其到零点餐厅自己点菜或单独用餐，并告知其费用自理，原餐费根据旅游合同约定处理。","type":"单选题"},{"number":115,"stem":"在旅游过程中，游客有正当理由退团，导游应该（）。","options":[{"key":"A","text":"将剩余费用退还给游客"},{"key":"B","text":"产生的费用由旅游者和旅行社各承担一半"},{"key":"C","text":"告知旅游者提出书面退团申请并签字"},{"key":"D","text":"经导游同意，报旅行社备案"}],"answer":"C","keys":["C"],"explanation":"合理退团要求：处理流程：① 旅游者提出书面退团申请并签字；② 报旅行社同意；③ 导游协助办理；费用处理方式：① 产生的费用由旅游者自理；② 未使用费用按旅游合同约定处理。","type":"单选题"},{"number":116,"stem":"游客卢女士行李丢失以后，导游老王处理得当的选项是（）。","options":[{"key":"A","text":"立即报警"},{"key":"B","text":"与承运人保持联络，督促承运人查找丢失行李"},{"key":"C","text":"主动为游客购买生活必需品"},{"key":"D","text":"告知旅游者索赔条款，请游客自行向承运人或者保险公司索赔"}],"answer":"B","keys":["B"],"explanation":"查明丢失行李或行李损坏的运输区间，协助旅游者办理损失或报损登记手续；将旅游者后续旅游行程安排告知承运人，同时在旅游过程中，应与承运人保持联系与沟通，督促承运人及时查找丢失行李；若非运输期间丢失行李的，参照“丢失证件或物品”处理；在查找丢失行李期间，协助旅游者购置生活必需品，提示其保留发票等购货凭证，并协助旅游者处理索赔事宜；可以确认责任者的，协助旅游者向责任方索赔，并办理相关事宜；难以确认责任者的，协助旅游者开具有关证明，以便向保险公司申请办理理赔事宜，并视情况向有关部门报告。","type":"单选题"},{"number":117,"stem":"发现游客有溺水情况，作为导游应该（）。","options":[{"key":"A","text":"立即跳入水中进行营救"},{"key":"B","text":"如果不会游泳，可以在岸边鼓励溺水者坚持"},{"key":"C","text":"如果身边有竹竿、绳子、救生圈等救人工具，就利用这些工具开展施救"},{"key":"D","text":"如果导游会游泳，应从正面采用侧泳或仰泳方式将其拖带上岸"}],"answer":"C","keys":["C"],"explanation":"（1）大声呼救：一边观察溺水者和周边环境的情况，一边大声呼救，争取更多人来帮忙（2）工具施救：不会游泳者，切忌直接下水拉拽溺水者，以防被溺水者拉入水中。如果身边有竹竿、绳子、救生圈等救人工具，就利用这些工具开展施救（3）下水施救：若没有可借助的施救工具，而导游或其他施救者懂水性、能游泳，可考虑开展下水救助。·施救者应先快速脱掉外衣裤，以防被溺水者扯住衣物而无法脱身；·接近溺水者后，施救者应设法从溺水者背后抱住或拉住其腋窝，采用侧泳或仰泳方式将其拖带上岸。","type":"单选题"},{"number":118,"stem":"下列自然状况中，（ ）预示上游可能发生泥石流了。","options":[{"key":"A","text":"河床中正常流水断流并伴有较多的柴草树木，沟谷内传来类似火车轰鸣声"},{"key":"B","text":"山坡前缘出现横向及纵向裂缝，前缘土体出现隆起现象"},{"key":"C","text":"地面忽然出现上下晃动，然后再左右晃动"},{"key":"D","text":"海水异常退去时，大量鱼虾等海生动物留在浅滩"}],"answer":"A","keys":["A"],"explanation":"泥石流前兆：若观察到河（沟）床中正常流水断流或水流突然增大并伴有较多的柴草树木，听到沟谷内传来类似火车轰鸣声或闷雷声，这表明沟谷上游可能已发生山洪泥石流。","type":"单选题"},{"number":119,"stem":"外国人来中国旅游（）人及以上可以申请团体旅游签证。","options":[{"key":"A","text":"9"},{"key":"B","text":"10"},{"key":"C","text":"11"},{"key":"D","text":"20"}],"answer":"A","keys":["A"],"explanation":"外国人来中国旅游时，需向中国驻外使、领馆申请旅游签证（L 字签证），该签证属于普通签证范畴。若 9 人及以上组团来中国旅游，则可申请团体旅游签证。","type":"单选题"},{"number":120,"stem":"台湾居民往来大陆通行证分为（）两种类型。","options":[{"key":"A","text":"5 年有效和 1 个月一次有效"},{"key":"B","text":"5 年有效和 6 个月一次有效"},{"key":"C","text":"10 年有效和 6 个月一次有效"},{"key":"D","text":"5 年有效和 3 个月一次有效"}],"answer":"D","keys":["D"],"explanation":"台湾居民来往大陆通行证分为 5 年有效和 3 个月一次有效两种类型。","type":"单选题"},{"number":121,"stem":"下列物品中，可以出境的是（）。","options":[{"key":"A","text":"伪造的货币及伪造的有价证券"},{"key":"B","text":"动物、植物（均含标本）及其种子和繁殖材料"},{"key":"C","text":"珍贵文物"},{"key":"D","text":"各种武器、仿真武器、弹药及爆炸物品"}],"answer":"B","keys":["B"],"explanation":"（1）列入禁止入境范围的所有物品；（2）内容涉及国家秘密的手稿、印刷品、胶卷、照片、唱片、影片、录音带、录像带、激光视盘、计算机存储介质及其他物品；（3）珍贵文物及其他禁止出境的文物；（4）濒危的和珍贵的动物、植物（均含标本）及其种子和繁殖材料。","type":"单选题"},{"number":122,"stem":"国内头等舱的英文代码为（）。","options":[{"key":"A","text":"D"},{"key":"B","text":"C"},{"key":"C","text":"F"},{"key":"D","text":"Y"}],"answer":"C","keys":["C"],"explanation":"国内客票头等舱 F。","type":"单选题"},{"number":123,"stem":"关于使用便携式电子设备描述正确的选项是（）。","options":[{"key":"A","text":"禁止在航空器上使用发射功率在 160mW（含）以上、Wi·Fi 工作频率不在 2.4GHz 波段的便携式电子设备"},{"key":"B","text":"滑行、起飞爬升和下降着陆等飞行关键阶段禁止使用笔记本电脑、平板电脑"},{"key":"C","text":"滑行、起飞爬升和下降着陆等飞行关键阶段禁止使用心脏起搏器、助听器"},{"key":"D","text":"智能手机、电子书、视频播放器不在限制范围，可以自由使用"}],"answer":"B","keys":["B"],"explanation":"禁止在航空器上使用发射功率在 100mW（含）以上、Wi·Fi 工作频率不在 2.4GHz波段的便携式电子设备，如无发射功率标识的手机、卫星电话、移动 Wi·Fi、对讲机、无人机遥控平台、遥控玩具和其他带遥控装置的便携式电子设备；在滑行、起飞爬升和下降着陆等飞行关键阶段禁止使用，但在非飞行关键阶段允许使用的便携式电子设备，包括持续正压呼吸机（CPAP）、笔记本电脑、平板电脑等；关闭蜂窝通信功能，选择飞行模式后可在航空器上全程使用的单手可握持的小型便携式电子设备，如智能手机、电子书、视频播放器、游戏机等。但在飞行关键阶段不得连接耳机、充电口等外围设备，不得使用语音通信；允许在航空器上全程使用的电子设备，包括心脏起搏器、助听器。","type":"单选题"},{"number":124,"stem":"关于购买火车票的规定正确的是（）。","options":[{"key":"A","text":"7 周岁（含）-14 周岁可以购买儿童优惠票"},{"key":"B","text":"每名持票成人可免费携 1 名未满 6 周岁且不占座儿童"},{"key":"C","text":"一名成人携带 2 名身高不足 1.2 米的儿童，两名儿童都需要买儿童票"},{"key":"D","text":"非实名制列车 14 周岁以上购买全价票"}],"answer":"B","keys":["B"],"explanation":"实名制列车 6 周岁（含）- 14 周岁购买儿童优惠票·每名持票成人可免费携带 1 名未满 6 周岁且不占座儿童；14 周岁以上购买全价票·超员需购儿童优惠票非实名制列车身高 1.2 米（含）- 1.5 米购买儿童优惠票·每名持票成人可免费携带 1 名身高不足 1.2 米且不占座儿童；身高超 1.5 米购买全价票·超员需购儿童优惠票。","type":"单选题"},{"number":125,"stem":"禁止随身携带但是可以托运的物品是（）。","options":[{"key":"A","text":"鞭炮"},{"key":"B","text":"打火机一个"},{"key":"C","text":"强硫酸"},{"key":"D","text":"手术刀"}],"answer":"D","keys":["D"],"explanation":"禁止随身携带但可托运：手术刀/刨刀/铣刀等。","type":"单选题"},{"number":126,"stem":"水烧开了，折合华氏度是（）。","options":[{"key":"A","text":"126"},{"key":"B","text":"178"},{"key":"C","text":"198"},{"key":"D","text":"212"}],"answer":"D","keys":["D"],"explanation":"华氏度=摄氏度 \\(\\times 9\\div 5 + 32\\) ，100 度水，212 华氏度。","type":"单选题"},{"number":127,"stem":"关于时区描述正确的一项是（）。","options":[{"key":"A","text":"以北京时间为准，“+”表示比北京时间晚，“- ”表示比北京时间早"},{"key":"B","text":"北京位于东 8 区，我们国家横跨 5 个时区，有 5 个时间标准"},{"key":"C","text":"经过格林尼治天文台的零度为标准线，从西经 7 度半到东经 7 度半为中区"},{"key":"D","text":"伦敦位于欧洲，比中国晚了 7 个小时"}],"answer":"C","keys":["C"],"explanation":"中国幅员辽阔，东西横跨经度 64 度，跨 5 个时区（从东 5 区到东 9 区），为方便起见以北京时间作为标准时间；北京 0 时与世界主要城市的时差表，“+”表示比北京时间早，“- ”表示比北京时间晚；以经过格林尼治天文台的零度为标准线，从西经 7 度半到东经 7度半为中区（称为 0 时区）；伦敦位于欧洲，比中国晚了 8 个小时。","type":"单选题"},{"number":128,"stem":"一件 LV 的衣服价格为 5 万元，按照原税率 13%计算，税收机关要收取 2%的手续费用，最后可以退税到手（）元。","options":[{"key":"A","text":"1500"},{"key":"B","text":"3000"},{"key":"C","text":"4500"},{"key":"D","text":"6000"}],"answer":"C","keys":["C"],"explanation":"基准退税率：- 原税率 \\(13\\% \\rightarrow\\) 退税率 \\(11\\%\\) 实退金额 \\(\\equiv\\) 物品金额 \\(\\times\\) （退税率- 2%手续费），所以实际到手 4500 元。","type":"单选题"},{"number":129,"stem":"下列险种中，（）是强制保险。","options":[{"key":"A","text":"旅行社责任险"},{"key":"B","text":"旅游意外保险"},{"key":"C","text":"铁路意外伤害保险"},{"key":"D","text":"铁路意外伤害保险"}],"answer":"A","keys":["A"],"explanation":"保险期限：旅行社责任险为强制性保险，保险期限为 1 年。","type":"单选题"},{"number":130,"stem":"世界上发行最早的信用卡是（）。","options":[{"key":"A","text":"维萨卡"},{"key":"B","text":"大莱卡"},{"key":"C","text":"万事达卡"},{"key":"D","text":"运通卡"}],"answer":"B","keys":["B"],"explanation":"大莱卡（DinnersClubCard）：为世界上发行最早的信用卡，由大莱卡国际有限公司统一管理。三、多选题","type":"单选题"},{"number":131,"stem":"《宪法》规定，以下关于公民财产权的描述，正确的是（）。","options":[{"key":"A","text":"公民的私有财产不受侵犯"},{"key":"B","text":"国家依照法律规定保护公民的私有财产权"},{"key":"C","text":"国家依照法律规定保护公民的继承权"},{"key":"D","text":"国家为了公共利益的需要，可以依照法律规定对公民的私有财产实行征收并补偿"},{"key":"E","text":"国家为了公共利益的需要，可以依照法律规定对公民的私有财产实行无偿征用"}],"answer":"BCD","keys":["B","C","D"],"explanation":"公民的合法的私有财产不受侵犯；国家为了公共利益的需要，可以依照法律规定对公民的私有财产实行征收或者征用并给予补偿。其余选项描述正确。","type":"多选题"},{"number":132,"stem":"《旅游法》规定，旅游业发展应当遵循（）相统一的原则。","options":[{"key":"A","text":"社会效益"},{"key":"B","text":"文化效益"},{"key":"C","text":"经济效益"},{"key":"D","text":"生态效益"},{"key":"E","text":"环境效益"}],"answer":"ACD","keys":["A","C","D"],"explanation":"《旅游法》第 4 条，旅游业发展应当遵循社会效益、经济效益和生态效益相统一的原则。","type":"多选题"},{"number":133,"stem":"根据《旅游法》的规定，旅游者有下列（）情形之一的，旅行社可以解除合同。","options":[{"key":"A","text":"身体突发严重疾病，无法继续旅行"},{"key":"B","text":"携带危害公共安全物品的"},{"key":"C","text":"从事违法或者违反社会公德的活动的"},{"key":"D","text":"在行程中有旅游不文明行为，且不听劝阻"},{"key":"E","text":"法律规定的其他情形"}],"answer":"CE","keys":["C","E"],"explanation":"《旅游法》第 66 条规定，旅游者有下列情形之一的，旅行社可以解除合同：（1）患有传染病等疾病，可能危害其他旅游者健康和安全的；（2）携带危害公共安全的物品且不同意交有关部门处理的；（3）从事违法或者违反社会公德的活动的；（4）从事严重影响其他旅游者权益的活动，且不听劝阻、不能制止的；（5）法律规定的其他情形。“身体突发严重……”不在情形内：“携带危害……”表述太过绝对；“在行程中有旅游不文明行为，且不听劝阻”表述错误，是“从事严重影响其他旅游者权益的活动”。","type":"多选题"},{"number":134,"stem":"无民事行为能力人或者限制民事行为能力人在教育机构学习、生活期间受到人身损害的，下列表述正确的是（）。","options":[{"key":"A","text":"无民事行为能力人受到人身损害的，教育机构应当承担侵权责任"},{"key":"B","text":"受到教育机构以外的第三人人身损害的，由第三人承担侵权责任"},{"key":"C","text":"受到第三人人身损害的，教育机构未尽到管理职责的，承担相应的连带责任"},{"key":"D","text":"受到第三人人身损害的，教育机构承担补充责任后，无权向第三人追偿"},{"key":"E","text":"限制民事行为能力人受到人身损害的，教育机构应当承担侵权责任"}],"answer":"AB","keys":["A","B"],"explanation":"《民法典》第 1199 条规定，无民事行为能力人在幼儿园、学校或者其他教育机构学习、生活期间受到人身损害的，幼儿园、学校或者其他教育机构应当承担侵权责任；但是，能够证明尽到教育、管理职责的，不承担侵权责任。第 1200 条规定，限制民事行为能力人在学校或者其他教育机构学习、生活期间受到人身损害，学校或者其他教育机构未尽到教育、管理职责的，应当承担侵权责任。第 1201 条规定，无民事行为能力人或者限制民事行为能力人在幼儿园、学校或者其他教育机构学习、生活期间，受到幼儿园、学校或者其他教育机构以外的第三人人身损害的，由第三人承担侵权责任；幼儿园、学校或者其他教育机构未尽到管理职责的，承担相应的补充责任。幼儿园、学校或者其他教育机构承担补充责任后，可以向第三人追偿。","type":"多选题"},{"number":135,"stem":"根据《旅行社条例》规定，以下关于旅行社设立分社和服务网点的相关规定中，正确的是（）。","options":[{"key":"A","text":"服务网点以旅行社的名义开展旅游接待业务"},{"key":"B","text":"每设立 1 个经营国内旅游业务和入境旅游业务的分社，增存 5 万元质量保证金"},{"key":"C","text":"设立分社和服务网点要在办理登记之日起 5 个工作日内向各自所在地的旅游行政管理部门备案"},{"key":"D","text":"分社设立不受地域限制"},{"key":"E","text":"设立社在其所在地的省外设立服务网点的，由其省外分社设立"}],"answer":"BD","keys":["B","D"],"explanation":"服务网点不能从事旅游接待业务；“5 个工作日”错误，设立分社和服务网点要在办理登记之日起 3 个工作日内向各自所在地的旅游行政管理部门备案；设立社在其所在地的省、自治区、直辖市行政区划外设立分社的，可以在该分社所在地设区的市的行政区划内设立服务网点。分社不得设立服务网点。","type":"多选题"},{"number":136,"stem":"某旅行社在旅游旺季临时聘用导游王某，但未向其支付导游服务费用。对此，依据《中华人民共和国旅游法》，由旅游主管部门（）。","options":[{"key":"A","text":"责令改正"},{"key":"B","text":"没收违法所得"},{"key":"C","text":"责令停业整顿"},{"key":"D","text":"并处 5000 元以上 5 万元以下的罚款"},{"key":"E","text":"情节严重的，责令停业整顿或者吊销旅行社业务经营许可证"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"《旅游法》第 96 条规定，旅行社未向临时聘用的导游支付导游服务费用或要求导游垫付或者向导游收取费用的，由旅游主管部门责令改正，没收违法所得，并处 5000 元以上5 万元以下罚款；情节严重的，责令停业整顿或者吊销旅行社业务经营许可证；对直接负责的主管人员和其他直接责任人员，处 2000 元以上 2 万元以下罚款。","type":"多选题"},{"number":137,"stem":"导游人员调整或者变更接待计划的条件包括（）。","options":[{"key":"A","text":"在引导旅游者旅行、游览过程中"},{"key":"B","text":"遇到可能危及旅游者人身、财产安全的紧急情形"},{"key":"C","text":"征得多数旅游者的同意"},{"key":"D","text":"征得所有旅游者的同意"},{"key":"E","text":"立即报告旅行社"}],"answer":"ACE","keys":["A","C","E"],"explanation":"《导游人员管理条例》第 13 条规定，导游人员在引导旅游者旅行、游览过程中，遇有可能危及旅游者人身安全的紧急情形时，经征得多数旅游者的同意，可以调整或者变更接待计划，但是应当立即报告旅行社。","type":"多选题"},{"number":138,"stem":"依据《导游人员管理条例》，以下人员可以参加导游人员资格考试的是（）。","options":[{"key":"A","text":"定居海外的华侨"},{"key":"B","text":"18 周岁以上的我国在校大学生"},{"key":"C","text":"患有高血压的公司员工小李"},{"key":"D","text":"可用手语交流的高中毕业的聋哑人小孙"},{"key":"E","text":"未满 16 周岁的某高中毕业生"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"解析国家实行全国统一的导游人员资格考试制度，参加导游人员资格考试的条件如下：中华人民共和国公民；具有高级中学、中等专业学校或者以上学历；身体健康；具有适应导游需要的基本知识和语言表达能力。注意：华侨是具有中华人民共和国国籍。","type":"多选题"},{"number":139,"stem":"依据《中华人民共和国消费者权益保护法实施条例》，经营者处理敏感个人信息，应当遵守法律、行政法规的规定。下列属于条例列明的敏感个人信息的有（）。","options":[{"key":"A","text":"宗教信仰"},{"key":"B","text":"医疗健康信息"},{"key":"C","text":"日常消费记录"},{"key":"D","text":"不满 14 周岁未成年人的个人信息"},{"key":"E","text":"行踪轨迹"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"解析经营者处理包含消费者的生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息以及不满 14 周岁未成年人的个人信息等敏感个人信息的，应当符合有关法律、行政法规的规定。（第 23 条）C 项错误：日常消费记录不属于条例列举的敏感个人信息范围，属于普通个人信息，该项具有较强的迷惑性。","type":"多选题"},{"number":140,"stem":"《旅游法》规定，旅游者与旅游经营者发生纠纷，可以通过下列（）途径解决。","options":[{"key":"A","text":"双方协商"},{"key":"B","text":"向旅游投诉受理机构申请调解"},{"key":"C","text":"向消费者协会申请调解"},{"key":"D","text":"根据与旅游经营者达成的仲裁协议提请仲裁机构仲裁"},{"key":"E","text":"对处理结果不服的，可以向文化和旅游主管部门申请行政复议"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"《中华人民共和国旅游法》第九十二条旅游者与旅游经营者发生纠纷，可以通过下列途径解决：（一）双方协商；（二）向消费者协会、旅游投诉受理机构或者有关调解组织申请调解；（三）根据与旅游经营者达成的仲裁协议提请仲裁机构仲裁；（四）向人民法院提起诉讼。A 项正确，双方协商属于法定纠纷解决途径。B 项正确，向旅游投诉受理机构申请调解属于法定纠纷解决途径。C 项正确，向消费者协会申请调解属于法定纠纷解决途径。D 项正确，依据仲裁协议提请仲裁机构仲裁属于法定纠纷解决途径。E 项错误，行政复议是针对行政机关行政行为不服的救济方式，不属于本条规定旅游者和旅游经营者之间民事纠纷的解决途径。","type":"多选题"},{"number":141,"stem":"《旅游安全管理办法》规定，旅行社组织出境旅游，应当制作安全信息卡。安全信息卡应当包括（）等信息。","options":[{"key":"A","text":"旅游者姓名"},{"key":"B","text":"籍贯"},{"key":"C","text":"身份证号码"},{"key":"D","text":"出境证件号码"},{"key":"E","text":"紧急情况下的联系方式"}],"answer":"ADE","keys":["A","D","E"],"explanation":"《旅游安全管理办法》第 12 条规定，旅行社组织出境旅游，应当制作安全信息卡。安全信息卡应当包括旅游者姓名、出境证件号码和国籍，以及紧急情况下的联系人、联系方式等信息，使用中文和目的地官方语言（或者英文）填写。旅行社应当将安全信息卡交由旅游者随身携带，并告知其自行填写血型、过敏药物和重大疾病等信息。“籍贯”应为“国籍”；“身份证号码”应为“出境证件号码”。","type":"多选题"},{"number":142,"stem":"旅游经营者或者旅游辅助服务者为旅游者代管的行李物品损毁、灭失，旅游者请求赔偿损失的，人民法院应予支持，但下列（）情形除外。","options":[{"key":"A","text":"损失是由于意外事件造成的"},{"key":"B","text":"损失是由于旅游者的过错造成的"},{"key":"C","text":"损失是由于旅游者未听从旅游经营者提示，未将现金随身携带造成的"},{"key":"D","text":"损失是由于不可抗力造成的"},{"key":"E","text":"损失是由于行李放在旅游大巴车上被盗造成的"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"旅游经营者或者旅游辅助服务者为旅游者代管的行李物品损毁、灭失，旅游者请求赔偿损失的，人民法院应予支持，但下列情形除外：（1）损失是由于旅游者未听从旅游经营者或者旅游辅助服务者的事先声明或者提示，未将现金、有价证券、贵重物品由其随身携带而造成的；（2）损失是由于不可抗力、意外事件造成的；（3）损失是由于旅游者的过错造成的；（4）损失是由于物品的自然属性造成的。选项“损失是由于行李放在旅游大巴车上被盗造成的”，旅游大巴车属于旅游经营者的履行辅助人，旅游经营者需要承担旅游者的损失赔偿。","type":"多选题"},{"number":143,"stem":"根据《文物保护法》规定，下列文物受国家法律保护（）。","options":[{"key":"A","text":"具有历史、艺术、科学价值的古文化遗址"},{"key":"B","text":"与重大历史事件有关的近现代重要史迹、实物、代表性建筑"},{"key":"C","text":"历史上各时代珍贵的艺术品、工艺美术品"},{"key":"D","text":"历史上各时代的文献资料"},{"key":"E","text":"反映历史上各时代、各民族社会制度、社会生产和社会生活的代表性实物"}],"answer":"ABCE","keys":["A","B","C","E"],"explanation":"《文物保护法》第 2 条列举了受国家保护的文物范围。正确选项为 A、B、C、E。A项正确：对应第 2 条第 1 项“具有历史、艺术、科学价值的古文化遗址、古墓葬、古建筑、石窟寺和古石刻、古壁画”B 项正确：对应第 2 条第 2 项“与重大历史事件、革命运动或者著名人物有关的以及具有重要纪念意义、教育意义或者史料价值的近代现代重要史迹、实物、代表性建筑”C 项正确：对应第 2 条第 3 项“历史上各时代珍贵的艺术品、工艺美术品”D项错误：法律规定保护的是“历史上各时代重要的文献资料、手稿和图书资料等”，并非所有文献资料 E 项正确：对应第 2 条第 5 项“反映历史上各时代、各民族社会制度、社会生产、社会生活的代表性实物”。","type":"多选题"},{"number":144,"stem":"根据《风景名胜区条例》，在风景名胜区内禁止进行下列活动（）。","options":[{"key":"A","text":"开山、采石、开矿、开荒、修坟立碑"},{"key":"B","text":"在景物或者设施上刻划、涂污"},{"key":"C","text":"改变水资源、水环境自然状态的活动"},{"key":"D","text":"修建储存腐蚀性物品的设施"},{"key":"E","text":"乱扔垃圾"}],"answer":"ABDE","keys":["A","B","D","E"],"explanation":"《风景名胜区条例》第二十六条：在风景名胜区内禁止进行下列活动：（一）开山、采石、开矿、开荒、修坟立碑等破坏景观、植被和地形地貌的活动；（二）修建储存爆炸性、易燃性、放射性、毒害性、腐蚀性物品的设施；（三）在景物或者设施上刻划、涂污；（四）乱扔垃圾。故答案为 ABDE。第二十九条规定，改变水资源、水环境自然状态的活动属于经审核批准后方可开展，并非条例直接禁止的活动。故 C 选项错误。","type":"多选题"},{"number":145,"stem":"依据习近平新时代中国特色社会主义思想相关理论，下列属于“四个自信”内容的有（）。","options":[{"key":"A","text":"理论自信"},{"key":"B","text":"民族自信"},{"key":"C","text":"道路自信"},{"key":"D","text":"制度自信"},{"key":"E","text":"文化自信"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"解析我们要坚持对马克思主义的坚定信仰、对中国特色社会主义的坚定信念，坚定道路自信、理论自信、制度自信、文化自信，以更加积极的历史担当和创造精神为发展马克思主义作出新的贡献。ACDE 项正确，属于“四个自信”的组成内容。B 项错误，民族自信不属于“四个自信”的组成内容。","type":"多选题"},{"number":146,"stem":"党的二十大报告指出，十年来，我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事：一是（），二是（），三是（），实现第一个百年奋斗目标。","options":[{"key":"A","text":"迎来中国共产党成立一百周年"},{"key":"B","text":"中国特色社会主义进入新时代"},{"key":"C","text":"完成脱贫攻坚、全面建成小康社会的历史任务"},{"key":"D","text":"初步建成社会主义现代化国家"},{"key":"E","text":"创立新时代中国特色社会主义思想"}],"answer":"ABC","keys":["A","B","C"],"explanation":"解析《党的二十大报告》指出：“十年来，我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事：一是迎来中国共产党成立一百周年，二是中国特色社会主义进入新时代，三是完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。”因此，正确选项是 ABC。","type":"多选题"},{"number":147,"stem":"《英烈法》规定，禁止歪曲、丑化、亵渎、否定英雄烈士事迹和精神。英雄烈士的（）受法律保护。","options":[{"key":"A","text":"事迹"},{"key":"B","text":"姓名"},{"key":"C","text":"肖像"},{"key":"D","text":"名誉"},{"key":"E","text":"荣誉"}],"answer":"BCDE","keys":["B","C","D","E"],"explanation":"《英烈法》第 22 条规定, 禁止歪曲、丑化、亵渎、否定英雄烈士事迹和精神。国家从行政、民事、刑事等方面全面加强对英雄烈士的保护。注意区分“事迹和精神”与“姓名、肖像、名誉和荣誉”。","type":"多选题"},{"number":148,"stem":"下列选项中, 对于导游人员仪表礼仪描述正确的是 ( )。","options":[{"key":"A","text":"为了保持良好形象, 导游可以在带团中施浓妆"},{"key":"B","text":"带团前忌吃葱、蒜、韭菜等易留异味的食物"},{"key":"C","text":"衣物应无褶皱、污渍、破损, 领口、袖口保持干净"},{"key":"D","text":"避免低胸、露脐、超短裙等过度暴露的服饰"},{"key":"E","text":"头发被吹乱后, 应及时梳理, 可当众梳头, 以免失礼"}],"answer":"BCD","keys":["B","C","D"],"explanation":"女士为保持面容光泽，女士可施淡妆，但不要浓妆，不当众化妆或补妆；带团前忌吃葱、蒜、韭菜等易留异味的食物；衣物应无褶皱、污渍、破损，领口、袖口保持干净；避免低胸、露脐、超短裙等过度暴露的服饰；头发被吹乱后，应及时梳理，不可当众梳头，以免失礼。","type":"多选题"},{"number":149,"stem":"地陪导游在落实接待计划时，应该包括（）。","options":[{"key":"A","text":"核对日程安排"},{"key":"B","text":"旅游团及成员的特殊要求与注意事项"},{"key":"C","text":"与全陪联系"},{"key":"D","text":"落实接待车辆"},{"key":"E","text":"了解不熟悉的参观游览点"}],"answer":"ACDE","keys":["A","C","D","E"],"explanation":"B 项是熟悉接待计划而不是落实接待计划，其他选项正确。","type":"多选题"},{"number":150,"stem":"旅游团抵达后，地陪导游服务的内容有（）。","options":[{"key":"A","text":"致欢迎词"},{"key":"B","text":"迎接旅游团"},{"key":"C","text":"核实团队信息"},{"key":"D","text":"集中清点行李"},{"key":"E","text":"行程介绍"}],"answer":"BCD","keys":["B","C","D"],"explanation":"旅游团抵达后的服务:持证上岗;迎接旅游团;核实团队信息;集中清点行李;集合登车。","type":"多选题"},{"number":151,"stem":"地陪带团返程途中,需要完成( )等工作任务。","options":[{"key":"A","text":"回顾当天活动"},{"key":"B","text":"沿途风光导游"},{"key":"C","text":"宣布次日活动安排"},{"key":"D","text":"随时清点人数"},{"key":"E","text":"将游客送回房间"}],"answer":"ABC","keys":["A","B","C"],"explanation":"返程途中:回顾当天活动;沿途风光导游;宣布次日活动安排。","type":"多选题"},{"number":152,"stem":"全陪为游客提供途中服务的内容包括（）。","options":[{"key":"A","text":"协助旅游者登机（车、船）"},{"key":"B","text":"与旅游者多交流"},{"key":"C","text":"照顾患病旅游者"},{"key":"D","text":"注意旅游者人身和财物安全"},{"key":"E","text":"负责联系即将到达站的酒店"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"途中服务：协助旅游者登机（车、船）；与旅游者多交流；照顾患病旅游者；注意旅游者人身和财物安全；处理突发问题（问题响应与协同解决）；联络协调上下站（行程衔接与沟通桥梁）。","type":"多选题"},{"number":153,"stem":"领队带领游客文明出行，在登机或出入口岸时应该（）。","options":[{"key":"A","text":"提醒游客提前办理检票、安检、托运行李等手续，不携带违禁物品"},{"key":"B","text":"组织游客依序候机（车、船），并优先安排老人、未成年人、孕妇、残障人士"},{"key":"C","text":"提醒游客不抢座、不占位，座位让给老人、孕妇、残障人士和带婴幼儿的游客"},{"key":"D","text":"主动配合机场、车站、港口以及安检、边防（移民局）、海关的检查和指挥"},{"key":"E","text":"避免不文雅的举止，不无限制索要免费餐饮"}],"answer":"ABCD","keys":["A","B","C","D"],"explanation":"E 项不是登机或者出入口岸，而是乘坐交通工具时应该遵守的，所以 E 不对，其余选项正确。","type":"多选题"},{"number":154,"stem":"下列对于导游劝慰游客所用方法，正确的是（）。","options":[{"key":"A","text":"通过摆事实、讲道理、分清利弊得失，层层分析推进，这是正面引导法"},{"key":"B","text":"采用旁敲侧击的劝慰方法，即侧面“兜圈子”，也称简介引导法"},{"key":"C","text":"采用含蓄隐晦的动作或声音暗示旅游者接受劝告的方法是间接暗示法"},{"key":"D","text":"主动给出双方都能接受的解决方案，叫替代方案法"},{"key":"E","text":"提出要求时，导游有条件地答应，而实际上该条件基本无法满足，叫做婉转拒绝法"}],"answer":"AC","keys":["A","C"],"explanation":"劝慰的技巧：正面引导法：问题出现后，导游通过摆事实、讲道理、分清利弊得失，层层分析推进，直至说服旅游者；侧面迂回法：事情发生后，导游不直
